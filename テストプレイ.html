<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>幻想クロニクル</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;
  padding:0;

  width:100%;
  min-height:100%;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #15152b,
      #25254b,
      #15152b
    );

  color:white;

}

body{

  overflow-x:hidden;

}

button,
input{

  font:inherit;

}

button{

  cursor:pointer;

}

#app{

  min-height:100vh;

  padding-bottom:90px;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  position:sticky;

  top:0;

  z-index:50;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    12px
    16px;

  background:
    rgba(10,10,25,.95);

  backdrop-filter:
    blur(10px);

  border-bottom:
    1px solid
    rgba(255,255,255,.12);

}

.logo{

  font-size:20px;

  font-weight:900;

}

.user-area{

  display:flex;

  align-items:center;

  gap:10px;

}

.avatar{

  width:42px;
  height:42px;

  border-radius:50%;

  object-fit:cover;

  background:#333;

  border:
    2px solid
    rgba(255,255,255,.5);

}

.coin{

  font-weight:900;

  color:#ffd85a;

}


/* =========================================================
   MAIN
========================================================= */

.main{

  width:min(
    1100px,
    94%
  );

  margin:
    20px
    auto;

}

.card{

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:20px;

  padding:20px;

  margin-bottom:16px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.2);

}

.card h2{

  margin-top:0;

}


/* =========================================================
   BUTTON
========================================================= */

.btn{

  border:0;

  border-radius:12px;

  padding:
    12px
    16px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #7658ff,
      #4e35c9
    );

  font-weight:800;

  transition:
    transform .15s,
    opacity .15s;

}

.btn:hover{

  transform:
    translateY(-1px);

}

.btn:active{

  transform:
    scale(.97);

}

.btn.secondary{

  background:
    rgba(255,255,255,.12);

}

.btn.danger{

  background:
    #c83b58;

}

.btn.full{

  width:100%;

}


/* =========================================================
   GRID
========================================================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        140px,
        1fr
      )
    );

  gap:12px;

}

.nav-card{

  min-height:100px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:16px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(118,88,255,.8),
      rgba(64,44,150,.8)
    );

  border:
    1px solid
    rgba(255,255,255,.15);

  font-weight:800;

}


/* =========================================================
   FORM
========================================================= */

input{

  width:100%;

  padding:
    12px;

  border-radius:10px;

  border:
    1px solid
    rgba(255,255,255,.2);

  background:
    rgba(0,0,0,.3);

  color:white;

  outline:none;

  margin-bottom:10px;

}

input:focus{

  border-color:
    #8f7aff;

}


/* =========================================================
   SHEET OVERLAY
========================================================= */

#sheetOverlay{

  position:fixed;

  inset:0;

  z-index:90;

  display:none;

  background:
    rgba(0,0,0,.55);

}

.bottom-sheet{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:100;

  max-height:85vh;

  overflow:auto;

  background:
    #18182b;

  border-radius:
    22px
    22px
    0
    0;

  padding:20px;

  transform:
    translateY(110%);

  transition:
    transform .25s;

}

.bottom-sheet.open{

  transform:
    translateY(0);

}


/* =========================================================
   PAUSE
========================================================= */

#pauseOverlay{

  position:fixed;

  inset:0;

  z-index:300;

  display:none;

  align-items:center;

  justify-content:center;

  background:
    rgba(0,0,0,.75);

}

.pause-box{

  width:min(
    420px,
    90%
  );

  background:#19192c;

  padding:25px;

  border-radius:20px;

}


/* =========================================================
   GAME
========================================================= */

#gameLayer{

  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  background:#000;

}

#gameFrame{

  width:100%;

  height:100%;

  border:0;

}

#mobilePauseBtn{

  position:absolute;

  top:15px;

  right:15px;

  z-index:210;

  width:50px;
  height:50px;

  border:0;

  border-radius:50%;

  background:
    rgba(0,0,0,.7);

  color:white;

  font-size:22px;

}


/* =========================================================
   HISTORY
========================================================= */

.history-item{

  display:flex;

  justify-content:space-between;

  gap:20px;

  padding:
    12px
    0;

  border-bottom:
    1px solid
    rgba(255,255,255,.08);

}


/* =========================================================
   PRESENT
========================================================= */

.present-item{

  background:white;

  color:#222;

  padding:15px;

  border-radius:14px;

  margin-bottom:10px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

}


/* =========================================================
   TOAST
========================================================= */

#toast{

  position:fixed;

  left:50%;

  bottom:20px;

  transform:
    translateX(-50%);

  z-index:1000;

  padding:
    12px
    18px;

  border-radius:999px;

  background:
    rgba(0,0,0,.85);

  color:white;

  display:none;

  max-width:90%;

}

</style>

</head>

<!-- =======================================================
     JAVASCRIPT

<script>

/* =========================================================
   基本設定
========================================================= */

/*
 * ★ここだけ変更
 *
 * GASをウェブアプリとしてデプロイしたURLを入れてください。
 */

const GAS_URL =
  "ここにGASウェブアプリURLを貼り付けてください";


let myId =
  localStorage.getItem(
    "gID"
  ) || "";


let myName =
  localStorage.getItem(
    "gName"
  ) || "";


let myPass =
  localStorage.getItem(
    "gPass"
  ) || "";


let iroCoins =
  Number(
    localStorage.getItem(
      "gCoins"
    ) || 0
  );


let myChars =
  loadLocalArray(
    "gChars"
  );


let currentUser =
  null;


/* =========================================================
   初期化
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    setupDefaultAvatar();

    updateBasicUI();

    if(!myId){

      createNewUser();

    }

    await fetchSync();

    await loadGameList();

    await loadGachaSettings();

  }
);


/* =========================================================
   デフォルトアイコン
========================================================= */

function setupDefaultAvatar(){

  const avatar =
    localStorage.getItem(
      "gAv"
    );


  const src =
    avatar ||
    createDefaultAvatar();


  const hAv =
    document.getElementById(
      "hAv"
    );


  if(hAv){

    hAv.src =
      src;

  }

}


/* =========================================================
   デフォルト画像
========================================================= */

function createDefaultAvatar(){

  const svg =

`<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100"
  height="100"
>
  <rect
    width="100"
    height="100"
    rx="50"
    fill="#555"
  />
  <text
    x="50"
    y="62"
    text-anchor="middle"
    font-size="45"
  >
    👤
  </text>
</svg>`;


  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );

}


/* =========================================================
   新規ユーザー
========================================================= */

function createNewUser(){

  myId =
    generateId();


  myName =
    "USER";


  myPass =
    "";


  iroCoins =
    0;


  myChars =
    [];


  localStorage.setItem(
    "gID",
    myId
  );

  localStorage.setItem(
    "gName",
    myName
  );

  localStorage.setItem(
    "gPass",
    myPass
  );

  localStorage.setItem(
    "gCoins",
    "0"
  );

  localStorage.setItem(
    "gChars",
    "[]"
  );

}


/* =========================================================
   ID生成
========================================================= */

function generateId(){

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


  let result =
    "";


  for(
    let i = 0;
    i < 8;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }


  return result;

}


/* =========================================================
   GAS GET
========================================================= */

async function getGAS(
  action,
  params = {}
){

  if(
    !GAS_URL ||
    GAS_URL.includes(
      "ここにGAS"
    )
  ){

    throw new Error(
      "GAS_URLが設定されていません"
    );

  }


  const url =
    new URL(
      GAS_URL
    );


  if(action){

    url.searchParams.set(
      "action",
      action
    );

  }


  Object.keys(params)
    .forEach(function(key){

      if(
        params[key] !==
        undefined &&
        params[key] !==
        null
      ){

        url.searchParams.set(
          key,
          String(
            params[key]
          )
        );

      }

    });


  const response =
    await fetch(
      url.toString(),
      {
        method:"GET",
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "GAS GET HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   GAS POST
========================================================= */

async function postGAS(
  data
){

  if(
    !GAS_URL ||
    GAS_URL.includes(
      "https://script.google.com/macros/s/AKfycbytscH-cvw-7y24EQyZxA2Ng37cHemne9S3Tw0G5nqLoOoAJu9xLbaBK7byOzc-wAAX/exec"
    )
  ){

    throw new Error(
      "GAS_URLが設定されていません"
    );

  }


  const response =
    await fetch(
      GAS_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            data
          )

      }
    );


  if(!response.ok){

    throw new Error(
      "GAS POST HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   同期
========================================================= */

async function fetchSync(){

  if(!myId){

    return;

  }


  try{

    const result =
      await getGAS(
        "getUser",
        {
          id:myId
        }
      );


    if(
      result.result !==
      "success"
    ){

      return;

    }


    currentUser =
      result;


    myName =
      result.name ||
      myName ||
      "USER";


    myPass =
      result.pass ||
      myPass;


    iroCoins =
      Number(
        result.coins ||
        0
      );


    myChars =
      Array.isArray(
        result.chars
      )
        ? result.chars
        : [];


    localStorage.setItem(
      "gName",
      myName
    );


    localStorage.setItem(
      "gPass",
      myPass
    );


    localStorage.setItem(
      "gCoins",
      String(
        iroCoins
      )
    );


    localStorage.setItem(
      "gChars",
      JSON.stringify(
        myChars
      )
    );


    updateBasicUI();

    updateCharacterUI(
      myChars
    );

    updateHistoryUI(
      result.history || []
    );

    updatePresentUI(
      result.gifts || []
    );

    updateFriendUI(
      result
    );


  }catch(error){

    console.error(
      "同期エラー:",
      error
    );

    showToast(
      "サーバーとの同期に失敗しました"
    );

  }

}


/* =========================================================
   UI更新
========================================================= */

function updateBasicUI(){

  const name =
    document.getElementById(
      "hName"
    );


  const coin =
    document.getElementById(
      "hIroCoin"
    );


  const id =
    document.getElementById(
      "myIdView"
    );


  const level =
    document.getElementById(
      "levelView"
    );


  const count =
    document.getElementById(
      "charCountView"
    );


  if(name){

    name.innerText =
      myName ||
      "USER";

  }


  if(coin){

    coin.innerText =
      iroCoins.toLocaleString();

  }


  if(id){

    id.innerText =
      myId ||
      "----";

  }


  if(level){

    level.innerText =
      currentUser?.level ||
      1;

  }


  if(count){

    count.innerText =
      myChars.length;

  }


  const nIn =
    document.getElementById(
      "nIn"
    );


  const pIn =
    document.getElementById(
      "pIn"
    );


  if(nIn){

    nIn.value =
      myName;

  }


  if(pIn){

    pIn.value =
      myPass;

  }

}


/* =========================================================
   設定保存
========================================================= */

async function saveSettings(){

  const name =
    document
      .getElementById(
        "nIn"
      )
      .value
      .trim();


  const pass =
    document
      .getElementById(
        "pIn"
      )
      .value;


  if(!name){

    alert(
      "名前を入力してください"
    );

    return;

  }


  try{

    const result =
      await postGAS({

        type:
          "setting",

        id:
          myId,

        name:
          name,

        pass:
          pass,

        avatar:
          localStorage.getItem(
            "gAv"
          ) || ""

      });


    if(
      result.result !==
      "success"
    ){

      throw new Error(
        result.message ||
        "設定保存失敗"
      );

    }


    myName =
      name;


    myPass =
      pass;


    localStorage.setItem(
      "gName",
      name
    );


    localStorage.setItem(
      "gPass",
      pass
    );


    await fetchSync();


    closeAllSheets();


    alert(
      "保存しました"
    );


  }catch(error){

    console.error(error);

    alert(
      error.message ||

/* =========================================================
   ゲーム一覧
========================================================= */

async function loadGameList(){

  const container =
    document.getElementById(
      "gameListContainer"
    );


  if(!container){

    return;

  }


  container.innerHTML =
    "読み込み中...";


  try{

    const result =
      await getGAS(
        "getList"
      );


    if(
      result.result !==
      "success"
    ){

      container.innerHTML =
        escapeHTML(
          result.message ||
          "ゲーム一覧の取得に失敗しました"
        );

      return;

    }


    const games =
      result.data || [];


    if(!games.length){

      container.innerHTML =
        "ゲームがありません";

      return;

    }


    container.innerHTML =
      "";


    games.forEach(
      function(game){

        const card =
          document.createElement(
            "button"
          );


        card.className =
          "nav-card";


        card.innerText =
          game.title;


        card.onclick =
          function(){

            launchGame(
              game.id,
              game.title
            );

          };


        container.appendChild(
          card
        );

      }
    );


  }catch(error){

    console.error(error);

    container.innerText =
      "ゲーム一覧の取得に失敗しました";

  }

}


/* =========================================================
   ゲーム起動
========================================================= */

async function launchGame(
  id,
  title
){

  logWebAction(
    "ゲーム起動:" +
    title
  );


  const gameLayer =
    document.getElementById(
      "gameLayer"
    );


  const frame =
    document.getElementById(
      "gameFrame"
    );


  if(!gameLayer || !frame){

    return;

  }


  gameLayer.style.display =
    "block";


  try{

    const result =
      await getGAS(
        "getCode",
        {
          row:id
        }
      );


    if(
      result.result !==
      "success"
    ){

      throw new Error(
        result.message ||
        "ゲームコード取得失敗"
      );

    }


    frame.srcdoc =
      result.code || "";


    closeAllSheets();


    await postGAS({

      type:
        "launch",

      id:
        myId,

      gameId:
        id,

      title:
        title

    });


  }catch(error){

    console.error(error);

    gameLayer.style.display =
      "none";


    alert(
      error.message ||
      "ゲーム起動に失敗しました"
    );

  }

}


/* =========================================================
   ゲーム終了
========================================================= */

function closeGame(){

  const frame =
    document.getElementById(
      "gameFrame"
    );


  const layer =
    document.getElementById(
      "gameLayer"
    );


  const pause =
    document.getElementById(
      "pauseOverlay"
    );


  if(frame){

    frame.srcdoc =
      "";

    frame.src =
      "about:blank";

  }


  if(layer){

    layer.style.display =
      "none";

  }


  if(pause){

    pause.style.display =
      "none";

  }

}

/* =========================================================
   ガチャ結果受信
========================================================= */

window.addEventListener(
  "message",
  async function(event){

    if(
      !event.data ||
      event.data.type !==
      "gachaPull"
    ){

      return;

    }


    iroCoins =
      Number(
        event.data.value
      );


    if(
      !Number.isFinite(
        iroCoins
      )
    ){

      iroCoins = 0;

    }


    myChars =
      Array.isArray(
        event.data.chars
      )
        ? event.data.chars
        : myChars;


    localStorage.setItem(
      "gCoins",
      String(
        iroCoins
      )
    );


    localStorage.setItem(
      "gChars",
      JSON.stringify(
        myChars
      )
    );


    updateBasicUI();


    try{

      const result =
        await postGAS({

          type:
            "gachaLog",

          id:
            myId,

          userId:
            myId,

          newCoins:
            iroCoins,

          pulls:
            event.data.pulls,

          newChars:
            event.data.chars || myChars

        });


      if(
        result.result !==
        "success"
      ){

        console.warn(
          "ガチャ記録失敗:",
          result
        );

      }


      await fetchSync();


    }catch(error){

      console.error(
        "ガチャ記録エラー:",
        error
      );

    }

  }
);

/* =========================================================
   データ復元
========================================================= */

async function executeTransfer(){

  const id =
    document
      .getElementById(
        "tIdIn"
      )
      .value
      .trim()
      .toUpperCase();


  const pass =
    document
      .getElementById(
        "tPassIn"
      )
      .value;


  if(!id || !pass){

    alert(
      "IDと合言葉を入力してください"
    );

    return;

  }


  try{

    const result =
      await getGAS(
        "restore",
        {
          id:id
        }
      );


    if(
      result.result ===
      "success" &&
      String(
        result.pass || ""
      ) ===
      String(pass)
    ){

      localStorage.setItem(
        "gID",
        id
      );


      localStorage.setItem(
        "gName",
        result.name || ""
      );


      localStorage.setItem(
        "gPass",
        pass
      );


      localStorage.setItem(
        "gCoins",
        String(
          result.coins || 0
        )
      );


      localStorage.setItem(
        "gChars",
        JSON.stringify(
          result.chars || []
        )
      );


      myId =
        id;


      closeAllSheets();


      await fetchSync();


      alert(
        "データを復元しました"
      );


    }else{

      alert(
        "IDまたは合言葉が違います"
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "復元に失敗しました"
    );

  }

}

      );

      data

      ? data
      : [];

  }catch(e){

    return [];

/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   属性用エスケープ
========================================================= */

function escapeAttribute(
  value
){

  return escapeHTML(
    value
  );

}


/* =========================================================
   Toast
========================================================= */

function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  if(!toast){

    return;

  }


  toast.innerText =
    message;


  toast.style.display =
    "block";


  clearTimeout(
    showToast.timer
  );


  showToast.timer =
    setTimeout(
      function(){

        toast.style.display =
          "none";

      },
      2500
    );

}
