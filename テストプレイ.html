<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>幻想クロニクル</title>

<style>

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:#080808;
  color:#fff;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}


/* =========================================================
   アプリ
========================================================= */

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 20%,
      #1c1c2c 0%,
      #080808 60%
    );
}


/* =========================================================
   ヘッダー
========================================================= */

.header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 18px;

  z-index:10;

  background:
    rgba(10,10,18,.9);

  border-bottom:
    1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
}

.coin{
  border:
    1px solid #00ffd5;

  border-radius:30px;

  padding:
    9px 16px;

  color:#fff;

  background:
    rgba(0,255,213,.05);

  font-weight:800;
}


/* =========================================================
   メイン
========================================================= */

.main{
  position:absolute;
  top:70px;
  left:0;
  right:0;
  bottom:0;

  overflow:auto;

  padding:
    30px 20px 120px;
}

.hero{
  max-width:1000px;
  margin:0 auto;

  min-height:
    calc(100vh - 180px);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
}

.hero h1{
  margin:0 0 12px;

  font-size:
    clamp(32px,7vw,76px);

  font-weight:1000;

  letter-spacing:4px;

  text-shadow:
    0 0 20px rgba(0,255,213,.5);
}

.hero p{
  color:#aaa;
  margin-bottom:30px;
}


/* =========================================================
   ボタン
========================================================= */

.main-buttons{
  display:flex;
  flex-direction:column;
  gap:16px;

  width:min(330px,90vw);
}

.pro-btn{

  width:100%;

  min-height:58px;

  border-radius:12px;

  color:#fff;

  font-size:17px;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #fff,
      #d8d8d8
    );

  color:#111;

  box-shadow:
    5px 5px 0 #00e8c0;

}

.pro-btn.pink{

  background:
    linear-gradient(
      135deg,
      #ff2193,
      #ff3aa3
    );

  color:#fff;

  box-shadow:
    5px 5px 0 #ff8ac8;
}

.pro-btn.orange{

  background:
    linear-gradient(
      135deg,
      #ff7200,
      #ff9700
    );

  color:#fff;

  box-shadow:
    5px 5px 0 #ffc067;
}


/* =========================================================
   ボトムナビ
========================================================= */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:78px;

  display:flex;

  justify-content:
    space-around;

  align-items:center;

  background:
    rgba(8,8,12,.96);

  border-top:
    1px solid
    rgba(255,255,255,.1);

  z-index:50;
}

.nav-btn{

  background:none;

  color:#aaa;

  font-size:12px;

  display:flex;

  flex-direction:column;

  gap:5px;

  align-items:center;
}

.nav-btn .icon{
  font-size:24px;
}

.nav-btn.active{
  color:#00ffd5;
}


/* =========================================================
   オーバーレイ
========================================================= */

#sheetOverlay,
#pauseOverlay{

  position:fixed;

  inset:0;

  z-index:100;

  background:
    rgba(0,0,0,.72);

  display:none;
}


/* =========================================================
   Bottom Sheet
========================================================= */

.bottom-sheet{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:110;

  max-height:
    85vh;

  overflow:auto;

  padding:
    24px;

  border-radius:
    24px 24px 0 0;

  background:
    #16161d;

  transform:
    translateY(110%);

  transition:
    transform .25s ease;

  box-shadow:
    0 -10px 40px
    rgba(0,0,0,.5);
}

.bottom-sheet.open{
  transform:
    translateY(0);
}

.sheet-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:20px;
}

.close-btn{
  position:absolute;

  right:15px;
  top:15px;

  width:40px;
  height:40px;

  border-radius:50%;

  background:#333;

  color:#fff;

  font-size:20px;
}


/* =========================================================
   フォーム
========================================================= */

.input{

  width:100%;

  height:50px;

  margin-bottom:12px;

  border:
    1px solid #444;

  border-radius:10px;

  background:#0c0c10;

  color:#fff;

  padding:
    0 14px;

  font-size:16px;
}


/* =========================================================
   ガチャ
========================================================= */

#gachaBg{

  position:absolute;

  inset:0;

  background-size:cover;

  background-position:center;

  opacity:.28;

  z-index:-1;
}

.gacha-container{

  max-width:1100px;

  margin:0 auto;

  padding-bottom:120px;
}

.gacha-title{

  text-align:center;

  font-size:
    clamp(28px,6vw,52px);

  font-weight:1000;

  margin:
    20px 0 10px;
}

.gacha-tabs{

  display:flex;

  gap:10px;

  overflow:auto;

  padding:10px 0;
}

.gacha-tab{

  flex:
    0 0 160px;

  height:80px;

  border-radius:14px;

  background-size:cover;

  background-position:center;

  display:flex;

  align-items:flex-end;

  padding:12px;

  font-weight:900;

  text-shadow:
    0 2px 5px #000;
}

.gacha-tab.active{
  outline:
    3px solid #00ffd5;
}

.gacha-buttons{

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:12px;

  margin:20px 0;
}

.gacha-btn{

  min-width:150px;

  min-height:65px;

  padding:10px 20px;

  border-radius:14px;

  color:#fff;

  font-weight:900;

  background:#555;

  font-size:17px;
}

.gacha-btn.pink{
  background:#ff2193;
}

.gacha-btn.orange{
  background:#ff7900;
}

.gacha-btn.green{
  background:#00bfa5;
}


/* =========================================================
   ガチャ結果
========================================================= */

#resultArea{

  display:none;

  text-align:center;
}

.result-card{

  display:inline-flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  width:150px;

  min-height:190px;

  margin:8px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #222,
      #111
    );

  border:
    1px solid #444;

  padding:12px;
}

.result-card img{

  width:110px;
  height:110px;

  object-fit:cover;

  border-radius:12px;

  margin-bottom:8px;
}

.stars{
  color:#ffd700;
  font-size:18px;
}


/* =========================================================
   ゲーム
========================================================= */

#gameLayer{

  position:fixed;

  inset:0;

  z-index:200;

  background:#000;

  display:none;
}

#gameFrame{

  width:100%;
  height:100%;

  border:0;
}

#mobilePauseBtn{

  position:absolute;

  top:15px;
  right:15px;

  z-index:210;

  width:52px;
  height:52px;

  border-radius:50%;

  background:
    rgba(0,0,0,.65);

  color:#fff;

  font-size:22px;

  display:none;
}


/* =========================================================
   ゲーム一覧
========================================================= */

.game-list{

  display:flex;

  flex-wrap:wrap;

  gap:12px;
}

.nav-card{

  width:130px;

  min-height:100px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #252530,
      #15151b
    );

  display:flex;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:10px;

  cursor:pointer;
}


/* =========================================================
   履歴
========================================================= */

.history-item{

  display:flex;

  justify-content:space-between;

  gap:20px;

  padding:14px;

  border-bottom:
    1px solid #333;
}


/* =========================================================
   プレゼント
========================================================= */

.present-badge{

  display:none;

  min-width:20px;
  height:20px;

  border-radius:50%;

  background:#ff277e;

  align-items:center;
  justify-content:center;

  font-size:11px;

  position:absolute;

  top:-5px;
  right:-8px;
}


/* =========================================================
   レスポンシブ
========================================================= */

@media(max-width:600px){

  .header{
    height:62px;
  }

  .main{
    top:62px;
  }

  .logo{
    font-size:17px;
  }

  .coin{
    font-size:13px;
    padding:7px 10px;
  }

  .bottom-nav{
    height:70px;
  }

  .gacha-btn{
    min-width:
      calc(50% - 10px);
  }

}

</style>

</head>

<script>

/* =========================================================
   GAS URL
========================================================= */

/*
 * ↓ここを実際のGASウェブアプリURLに変更
 */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyAB6dqtWJHmWw5jflnU7R0EyBWkwr6PiAm9o6IKuTiECpvuvj97oQkes1RqMrYyz57/exec";


/* =========================================================
   グローバル
========================================================= */

let myId =
  localStorage.getItem("gID") ||
  createUserId();

let myName =
  localStorage.getItem("gName") ||
  "ゲスト";

let myPass =
  localStorage.getItem("gPass") ||
  "";

let iroCoins =
  Number(
    localStorage.getItem("gCoins") ||
    0
  );

let myChars = [];

let gachaSettings = [];

let charaPools = {
  star2: [],
  star3: [],
  star4: []
};


/* =========================================================
   ID作成
========================================================= */

function createUserId(){

  const id =
    "GC" +
    Math.random()
      .toString(36)
      .substring(2,10)
      .toUpperCase();

  localStorage.setItem(
    "gID",
    id
  );

  return id;
}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================================================
   GAS GET
========================================================= */

async function getGAS(
  action,
  params = {}
){

  const url =
    new URL(GAS_URL);

  if(action){
    url.searchParams.set(
      "action",
      action
    );
  }

  Object.keys(params)
    .forEach(function(key){

      url.searchParams.set(
        key,
        params[key]
      );

    });

  const response =
    await fetch(
      url.toString(),
      {
        method:"GET"
      }
    );

  return await response.json();
}


/* =========================================================
   GAS POST
========================================================= */

async function postGAS(data){

  const response =
    await fetch(
      GAS_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:
          JSON.stringify(data)
      }
    );

  return await response.json();
}


/* =========================================================
   Web操作記録
========================================================= */

async function logWebAction(action){

  try{

    await postGAS({

      type:"webAction",

      id:myId,

      action:action

    });

  }catch(error){

    console.warn(
      "操作ログ失敗:",
      error
    );

  }
}


/* =========================================================
   初期化
========================================================= */

async function init(){

  document
    .getElementById("hName")
    .innerText =
      myName;

  document
    .getElementById("hIroCoin")
    .innerText =
      iroCoins.toLocaleString();

  try{

    await loadGachaData();

    await fetchSync();

  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   データ同期
========================================================= */

async function fetchSync(){

  if(!myId){
    return;
  }

  try{

    const result =
      await getGAS(
        "getUser",
        {
          id:myId
        }
      );

    if(
      result.result !==
      "success"
    ){

      return;
    }

    if(
      result.name !==
      undefined
    ){

      myName =
        result.name;

      localStorage.setItem(
        "gName",
        myName
      );

      document
        .getElementById(
          "hName"
        )
        .innerText =
          myName;
    }

    if(
      result.pass !==
      undefined
    ){

      myPass =
        result.pass;

      localStorage.setItem(
        "gPass",
        myPass
      );
    }

    if(
      result.iroCoin !==
      undefined
    ){

      iroCoins =
        Number(
          result.iroCoin
        );

      localStorage.setItem(
        "gCoins",
        iroCoins
      );

      document
        .getElementById(
          "hIroCoin"
        )
        .innerText =
          iroCoins.toLocaleString();
    }

    if(result.chars){

      try{

        myChars =
          JSON.parse(
            result.chars
          );

      }catch(e){

        myChars = [];

      }
    }

  }catch(error){

    console.error(
      "同期エラー:",
      error
    );

  }

}


/* =========================================================
   ガチャデータ
========================================================= */

async function loadGachaData(){

  try{

    const pools =
      await getGAS(
        "getCharaPools"
      );

    if(
      pools.result ===
      "success"
    ){

      charaPools =
        pools.data || {
          star2:[],
          star3:[],
          star4:[]
        };

    }

    const settings =
      await getGAS(
        "getGachaSettings"
      );

    if(
      settings.result ===
      "success"
    ){

      gachaSettings =
        settings.data || [];

    }

    renderGachaTabs();

  }catch(error){

    console.error(
      "ガチャデータ取得エラー:",
      error
    );

  }

}


/* =========================================================
   ガチャタブ
========================================================= */

function renderGachaTabs(){

  const container =
    document.getElementById(
      "gachaTabs"
    );

  container.innerHTML = "";

  if(!gachaSettings.length){

    container.innerHTML =
      "<div>ガチャ設定がありません</div>";

    return;
  }

  gachaSettings.forEach(
    function(gacha,index){

      const tab =
        document.createElement(
          "div"
        );

      tab.className =
        "gacha-tab";

      if(index === 0){

        tab.classList.add(
          "active"
        );

      }

      if(gacha.thumbnail){

        tab.style.backgroundImage =
          "url('" +
          String(
            gacha.thumbnail
          ).replace(/'/g,"%27") +
          "')";

      }

      tab.innerText =
        gacha.title ||
        "ガチャ";

      tab.onclick =
        function(){

          selectGacha(index);

        };

      container.appendChild(
        tab
      );

    }
  );

  selectGacha(0);

}


/* =========================================================
   ガチャ選択
========================================================= */

function selectGacha(index){

  if(
    !gachaSettings[index]
  ){

    return;
  }

  document
    .querySelectorAll(
      ".gacha-tab"
    )
    .forEach(
      function(tab,i){

        tab.classList.toggle(
          "active",
          i === index
        );

      }
    );

  const gacha =
    gachaSettings[index];

  if(gacha.bg){

    document
      .getElementById(
        "gachaBg"
      )
      .style.backgroundImage =
        "url('" +
        String(
          gacha.bg
        ).replace(/'/g,"%27") +
        "')";

  }

  renderButtons(index);

}


/* =========================================================
   ガチャボタン
========================================================= */

function renderButtons(index){

  const container =
    document.getElementById(
      "gachaButtons"
    );

  container.innerHTML = "";

  const gacha =
    gachaSettings[index];

  const buttons =
    String(
      gacha.buttons ||
      "1回,10回,100回"
    )
    .split(",")
    .map(
      function(x){
        return x.trim();
      }
    )
    .filter(Boolean);

  buttons.forEach(
    function(button,index){

      const btn =
        document.createElement(
          "button"
        );

      btn.className =
        "gacha-btn";

      if(index === 1){
        btn.classList.add("pink");
      }

      if(index === 2){
        btn.classList.add("orange");
      }

      const count =
        parsePullCount(
          button
        );

      const cost =
        count * 300;

      btn.innerHTML =
        escapeHTML(button) +
        "<br>" +
        "<small>" +
        cost.toLocaleString() +
        "コイン" +
        "</small>";

      btn.onclick =
        function(){

          startPull(
            count
          );

        };

      container.appendChild(
        btn
      );

    }
  );

}


/* =========================================================
   回数解析
========================================================= */

function parsePullCount(text){

  const match =
    String(text)
      .match(/\d+/);

  return match
    ? Number(match[0])
    : 1;
}


/* =========================================================
   ガチャ実行
========================================================= */

async function startPull(n){

  n =
    Number(n);

  if(
    !Number.isFinite(n) ||
    n < 1
  ){

    return;
  }

  n =
    Math.floor(n);

  const cost =
    n * 300;

  if(iroCoins < cost){

    alert(
      "コインが不足しています"
    );

    return;
  }

  iroCoins -= cost;

  const results = [];

  const names = [];

  for(
    let i = 0;
    i < n;
    i++
  ){

    const r =
      Math.random() * 100;

    let rank;

    if(r < 3.5){

      rank = 4;

    }else if(r < 16){

      rank = 3;

    }else{

      rank = 2;

    }

    let pool;

    if(rank === 4){

      pool =
        charaPools.star4;

    }else if(rank === 3){

      pool =
        charaPools.star3;

    }else{

      pool =
        charaPools.star2;

    }

    if(
      !pool ||
      !pool.length
    ){

      continue;
    }

    const char =
      pool[
        Math.floor(
          Math.random() *
          pool.length
        )
      ];

    results.push({

      name:
        char.name,

      img:
        char.img,

      rank:
        rank

    });

    names.push(
      char.name
    );

  }

  myChars =
    myChars.concat(
      results
    );

  localStorage.setItem(
    "gCoins",
    iroCoins
  );

  localStorage.setItem(
    "gChars",
    JSON.stringify(
      myChars
    )
  );

  document
    .getElementById(
      "hIroCoin"
    )
    .innerText =
      iroCoins.toLocaleString();


  /* -----------------------------------------
     親ページへガチャ結果送信
  ----------------------------------------- */

  try{

    if(
      window.parent &&
      window.parent !== window
    ){

      window.parent.postMessage({

        type:"gachaPull",

        value:
          iroCoins,

        pulls:
          n,

        chars:
          names

      },"*");

    }

  }catch(error){

    console.warn(error);

  }


  /* -----------------------------------------
     GASへ保存
  ----------------------------------------- */

  try{

    const result =
      await postGAS({

        type:"gachaLog",

        id:myId,

        userId:myId,

        newCoins:
          iroCoins,

        pulls:n,

        newChars:
          JSON.stringify(
            myChars
          )

      });

    if(
      result.result !==
      "success"
    ){

      console.warn(
        "ガチャ記録失敗:",
        result
      );

    }

  }catch(error){

    console.error(
      "ガチャ保存エラー:",
      error
    );

  }

  showResult(
    results
  );

}


/* =========================================================
   ガチャ結果表示
========================================================= */

function showResult(results){

  const area =
    document.getElementById(
      "resultArea"
    );

  area.style.display =
    "block";

  if(!results.length){

    area.innerHTML =
      "<p>結果がありません</p>";

    return;
  }

  area.innerHTML =
    results
      .map(
        function(char){

          return `

            <div class="result-card">

              ${
                char.img
                ?
                `<img
                  src="${escapeHTML(char.img)}"
                  alt=""
                  onerror="this.style.display='none'"
                >`
                :
                `<div
                  style="
                    width:110px;
                    height:110px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:50px;
                  "
                >
                  ✨
                </div>`
              }

              <div class="stars">
                ${"★".repeat(
                  char.rank
                )}
              </div>

              <b>
                ${escapeHTML(
                  char.name
                )}
              </b>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   ガチャ結果受信
========================================================= */

window.addEventListener(
  "message",
  async function(event){

    if(
      !event.data ||
      event.data.type !==
      "gachaPull"
    ){

      return;
    }

    iroCoins =
      Number(
        event.data.value
      );

    localStorage.setItem(
      "gCoins",
      iroCoins
    );

    document
      .getElementById(
        "hIroCoin"
      )
      .innerText =
      iroCoins.toLocaleString();

    try{

      await postGAS({

        type:"gachaLog",

        id:myId,

        userId:myId,

        newCoins:
          iroCoins,

        pulls:
          event.data.pulls,

        newChars:
          event.data.chars

      });

      await fetchSync();

    }catch(error){

      console.warn(
        "ガチャ記録失敗:",
        error
      );

    }

  }
);


/* =========================================================
   設定保存
========================================================= */

async function saveSettings(){

  const name =
    document
      .getElementById("nIn")
      .value
      .trim();

  const pass =
    document
      .getElementById("pIn")
      .value;

  if(!name){

    alert(
      "名前を入力してください"
    );

    return;
  }

  localStorage.setItem(
    "gName",
    name
  );

  localStorage.setItem(
    "gPass",
    pass
  );

  myName =
    name;

  myPass =
    pass;

  try{

    const result =
      await postGAS({

        type:"setting",

        id:myId,

        name:name,

        pass:pass

      });

    if(
      result.result !==
      "success"
    ){

      alert(
        result.message ||
        "設定保存に失敗しました"
      );

      return;
    }

    await postGAS({

      type:"sync",

      id:myId,

      name:name,

      pass:pass,

      iroCoin:
        iroCoins,

      chars:
        JSON.stringify(
          myChars
        )

    });

    document
      .getElementById(
        "hName"
      )
      .innerText =
      name;

    alert(
      "保存しました"
    );

    closeAllSheets();

    await fetchSync();

  }catch(error){

    console.error(error);

    alert(
      "保存に失敗しました"
    );

  }

}

/* =========================================================
   ゲーム一覧
========================================================= */

async function loadGameList(){

  const container =
    document.getElementById(
      "gameListContainer"
    );

  container.innerHTML =
    "読み込み中...";

  try{

    const result =
      await getGAS(
        "getList"
      );

    if(
      result.result !==
      "success"
    ){

      container.innerHTML =
        "ゲーム一覧の取得に失敗しました";

      return;
    }

    const games =
      result.data || [];

    if(!games.length){

      container.innerHTML =
        "ゲームがありません";

      return;
    }

    container.innerHTML =
      "";

    games.forEach(
      function(game){

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "nav-card";

        card.innerHTML =
          "<b>" +
          escapeHTML(
            game.title
          ) +
          "</b>";

        card.onclick =
          function(){

            launchGame(
              game.id,
              game.title
            );

          };

        container.appendChild(
          card
        );

      }
    );

  }catch(error){

    console.error(error);

    container.innerHTML =
      "ゲーム一覧の取得に失敗しました";

  }

}


/* =========================================================
   ゲーム起動
========================================================= */

async function launchGame(
  id,
  title
){

  logWebAction(
    "ゲーム起動:" +
    title
  );

  document
    .getElementById(
      "gameLayer"
    )
    .style.display =
    "block";

  document
    .getElementById(
      "mobilePauseBtn"
    )
    .style.display =
    "flex";

  try{

    const result =
      await getGAS(
        "getCode",
        {
          row:id
        }
      );

    if(
      result.result !==
      "success"
    ){

      alert(
        result.message ||
        "ゲームコード取得失敗"
      );

      closeGame();

      return;
    }

    /*
     * ここでは取得したゲームHTMLを
     * iframeのsrcdocに入れる。
     *
     * メインページのHTMLとして直接挿入しないため、
     * ゲームコードがメイン画面の背景に
     * 文字として表示されることを防ぐ。
     */

    document
      .getElementById(
        "gameFrame"
      )
      .srcdoc =
      result.code || "";

    await postGAS({

      type:"launch",

      id:myId,

      gameId:id,

      title:title

    });

  }catch(error){

    console.error(error);

    alert(
      "ゲーム起動に失敗しました"
    );

    closeGame();

  }

}


/* =========================================================
   ゲーム終了
========================================================= */

function closeGame(){

  document
    .getElementById(
      "gameFrame"
    )
    .srcdoc =
    "";

  document
    .getElementById(
      "gameFrame"
    )
    .src =
    "about:blank";

  document
    .getElementById(
      "gameLayer"
    )
    .style.display =
    "none";

  document
    .getElementById(
      "mobilePauseBtn"
    )
    .style.display =
    "none";

  document
    .getElementById(
      "pauseOverlay"
    )
    .style.display =
    "none";

}

    await postGAS({

      type:"request",

      myId:myId,

  if(
    result.result !==
    "success"
  ){

    alert(
      result.message ||
      "申請に失敗しました"
    );

    return;
  }

  alert(

  await fetchSync();

}

/* =========================================================
   コイン送信
========================================================= */

async function sendFriendGift(
  fid
){

  const amount =
    prompt(
      "枚数",
      "100"
    );

  if(!amount){

    return;
  }

  const n =
    Number(amount);

  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    alert(
      "枚数が不正です"
    );

    return;
  }

  if(iroCoins < n){

    alert(
      "コインが不足しています"
    );

    return;
  }

  const result =
    await postGAS({

      type:"friendGift",

      fromId:myId,

      fromName:myName,

      toId:fid,

      amount:n

    });

  if(
    result.result !==
    "success"
  ){

    alert(
      result.message ||
      "送信に失敗しました"
    );

    return;
  }

  iroCoins -= n;

  localStorage.setItem(
    "gCoins",
    iroCoins
  );

  document
    .getElementById(
      "hIroCoin"
    )
    .innerText =
    iroCoins.toLocaleString();

  await fetchSync();

}

/* =========================================================
   データ復元
========================================================= */

async function executeTransfer(){

  const id =
    document
      .getElementById(
        "tIdIn"
      )
      .value
      .trim()
      .toUpperCase();

  const pass =
    document
      .getElementById(
        "tPassIn"
      )
      .value;

  if(!id || !pass){

    alert(
      "IDと合言葉を入力してください"
    );

    return;
  }

  try{

    const json =
      await getGAS(
        "",
        {
          id:id
        }
      );

    if(
      json.result ===
      "success" &&
      String(json.pass) ===
      String(pass)
    ){

      localStorage.setItem(
        "gID",
        id
      );

      localStorage.setItem(
        "gName",
        json.name || ""
      );

      localStorage.setItem(
        "gPass",
        pass
      );

      if(
        json.iroCoin !==
        undefined
      ){

        localStorage.setItem(
          "gCoins",
          json.iroCoin
        );

      }

      myId =
        id;

      document
        .getElementById(
          "transferSheet"
        )
        .classList.remove(
          "open"
        );

      location.reload();

    }else{

      alert(
        "IDまたは合言葉が違います"
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "復元に失敗しました"
    );

  }

}
