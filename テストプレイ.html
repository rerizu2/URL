<script>

/* =========================================================
   GAS URL
========================================================= */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwQJWL9viWY7Rjyc1YD2-MSPPudaJfGGKAjcGyKeQQeanWGz124Di8anU7Os3BcpmH5/exec";


/* =========================================================
   GLOBAL
========================================================= */

let myId =
  localStorage.getItem("gID") ||
  "";

let myName =
  localStorage.getItem("gName") ||
  "";

let myPass =
  localStorage.getItem("gPass") ||
  "";

let iroCoins =
  Number(
    localStorage.getItem("gCoins") ||
    0
  );

let myChars = [];


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   GAS GET
========================================================= */

async function getGAS(
  action,
  params = {}
){

  if(
    !GAS_URL ||
    GAS_URL.includes(
      "ここにGAS"
    )
  ){

    throw new Error(
      "GAS_URLを設定してください"
    );

  }


  const url =
    new URL(
      GAS_URL
    );


  if(action){

    url.searchParams.set(
      "action",
      action
    );

  }


  Object.keys(params)
    .forEach(
      key => {

        if(
          params[key] !==
          undefined
        ){

          url.searchParams.set(
            key,
            params[key]
          );

        }

      }
    );


  const response =
    await fetch(
      url.toString(),
      {
        method:"GET",
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "GAS GET HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   GAS POST
========================================================= */

async function postGAS(
  data
){

  if(
    !GAS_URL ||
    GAS_URL.includes(
      "ここにGAS"
    )
  ){

    throw new Error(
      "GAS_URLを設定してください"
    );

  }


  const response =
    await fetch(
      GAS_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            data
          )

      }
    );


  if(!response.ok){

    throw new Error(
      "GAS POST HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   Web操作記録
========================================================= */

async function logWebAction(
  action
){

  if(!myId){
    return;
  }


  try{

    await postGAS({

      type:
        "webAction",

      id:
        myId,

      action:
        action

    });

  }catch(error){

    console.warn(
      "Web操作記録失敗:",
      error
    );

  }

}


/* =========================================================
   初期化
========================================================= */

async function init(){

  try{

    if(!myId){

      myId =
        createLocalId();

      myName =
        "ゲスト";

      localStorage.setItem(
        "gID",
        myId
      );

      localStorage.setItem(
        "gName",
        myName
      );

      // ユーザー作成
      await postGAS({

        type:
          "sync",

        id:
          myId,

        name:
          myName,

        pass:
          myPass,

        iroCoin:
          iroCoins,

        chars:
          myChars

      });

    }


    await fetchSync();


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


  }catch(error){

    console.error(error);

    document
      .getElementById(
        "loading"
      )
      .innerHTML = `

        <p>
          起動に失敗しました
        </p>

        <small>
          ${escapeHTML(
            error.message
          )}
        </small>

      `;

  }

}


/* =========================================================
   ID生成
========================================================= */

function createLocalId(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let result = "";

  for(
    let i = 0;
    i < 8;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }


  return result;

}


/* =========================================================
   同期
========================================================= */

async function fetchSync(){

  if(!myId){
    return;
  }


  try{

    const result =
      await getGAS(
        "getUser",
        {
          id:
            myId
        }
      );


    if(
      result.result !==
      "success"
    ){

      return;

    }


    myName =
      result.name ||
      myName;


    myPass =
      result.pass ||
      myPass;


    iroCoins =
      Number(
        result.iroCoin ||
        0
      );


    myChars =
      result.chars ||
      [];


    localStorage.setItem(
      "gName",
      myName
    );


    localStorage.setItem(
      "gPass",
      myPass
    );


    localStorage.setItem(
      "gCoins",
      iroCoins
    );


    updateHeader(
      result
    );


    updateHistoryUI(
      result.history ||
      []
    );


    updatePresentUI(
      result.gifts ||
      []
    );


    updateFriendUI(
      result
    );


    updateCharaUI(
      myChars
    );


  }catch(error){

    console.error(
      "同期エラー:",
      error
    );

  }

}

/* =========================================================
   SHEET
========================================================= */

function openSheet(id){

  document
    .getElementById(
      "sheetOverlay"
    )
    .style.display =
      "block";


  document
    .getElementById(id)
    .classList.add(
      "open"
    );


  logWebAction(
    "シート:" + id
  );


  if(id === "sheetGames"){

    loadGameList();

  }


  if(id === "sheetChara"){

    loadCharacters();

  }


  if(id === "sheetGacha"){

    loadGachaSettings();

  }

}


function closeSheet(id){

  const el =
    document.getElementById(
      id
    );


  if(el){

    el.classList.remove(
      "open"
    );

  }


  if(
    !document.querySelector(
      ".bottom-sheet.open"
    )
  ){

    document
      .getElementById(
        "sheetOverlay"
      )
      .style.display =
        "none";

  }

}


function closeAllSheets(){

  document
    .getElementById(
      "sheetOverlay"
    )
    .style.display =
      "none";


  document
    .querySelectorAll(
      ".bottom-sheet"
    )
    .forEach(
      el =>
        el.classList.remove(
          "open"
        )
    );

}


/* =========================================================
   SETTINGS
========================================================= */

async function saveSettings(){

  const name =
    document
      .getElementById(
        "nIn"
      )
      .value
      .trim();


  const pass =
    document
      .getElementById(
        "pIn"
      )
      .value;


  if(!name){

    alert(
      "名前を入力してください"
    );

    return;

  }


  myName =
    name;


  myPass =
    pass;


  localStorage.setItem(
    "gName",
    name
  );


  localStorage.setItem(
    "gPass",
    pass
  );


  try{

    const result =
      await postGAS({

        type:
          "setting",

        id:
          myId,

        name:
          name,

        pass:
          pass

      });


    if(
      result.result !==
      "success"
    ){

      alert(
        result.message ||
        "保存に失敗しました"
      );

      return;

    }


    await postGAS({

      type:
        "sync",

      id:
        myId,

      name:
        name,

      pass:
        pass,

      iroCoin:
        iroCoins,

      chars:
        myChars

    });


    alert(
      "保存しました"
    );


    await fetchSync();


  }catch(error){

    console.error(error);

    alert(
      "保存に失敗しました"
    );

  }

}


/* =========================================================
   ICON
========================================================= */

function uploadIcon(input){

  if(
    !input.files ||
    !input.files[0]
  ){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    async function(event){

      const data =
        event.target.result;


      localStorage.setItem(
        "gAv",
        data
      );


      document
        .getElementById(
          "hAv"
        )
        .src =
          data;


      try{

        await postGAS({

          type:
            "setting",

          id:
            myId,

          avatar:
            data

        });


        await fetchSync();


      }catch(error){

        console.error(error);

        alert(
          "アイコン保存に失敗しました"
        );

      }

    };


  reader.readAsDataURL(
    input.files[0]
  );

}

async function loadCharacters(){

  const container =
    document

        "charaContainer"
      );


  container.innerHTML =
    "読み込み中...";


  try{

    const result =
      await getGAS(
        "getCharaPools"
      );


    if(
      result.result !==
      "success"
    ){

      container.innerHTML =
        "キャラクター取得失敗";

      return;

    }


    const pools =
      result.data || {};


    container.innerHTML = `

      <h3>★4</h3>

      ${renderChara(
        pools.star4 || []
      )}

      <h3>★3</h3>

      ${renderChara(
        pools.star3 || []
      )}

      <h3>★2</h3>

      ${renderChara(
        pools.star2 || []
      )}

    `;


  }catch(error){

    console.error(error);

    container.innerHTML =

function renderChara(list){

  if(!list.length){

    return `
      <div class="empty">
        データなし
      </div>
    `;

  }


  return list
    .map(
      chara => `

        <div class="list-item">

          ${
            chara.img
              ? `<img
                  src="${escapeHTML(
                    chara.img
                  )}"
                  style="
                    width:50px;
                    height:50px;
                    object-fit:cover;
                    border-radius:10px;
                  "
                >`
              : "👤"
          }

          <b>
            ${escapeHTML(
              chara.name
            )}
          </b>

        </div>

      `
    )
    .join("");

}

/* =========================================================
   GACHA PULL
========================================================= */

async function pullGacha(count){

  count =
    Number(count);


  const cost =
    count === 10
      ? 1000
      : 100;


  if(
    iroCoins <
    cost
  ){

    alert(
      "コインが不足しています"
    );

    return;

  }


  iroCoins -=
    cost;


  localStorage.setItem(
    "gCoins",
    iroCoins
  );


  const resultBox =
    document
      .getElementById(
        "gachaResult"
      );


  resultBox.innerHTML =
    "召喚中...";


  try{

    const poolResult =
      await getGAS(
        "getCharaPools"
      );


    const pools =
      poolResult.data || {};


    const all =
      [
        ...(pools.star2 || []),
        ...(pools.star3 || []),
        ...(pools.star4 || [])
      ];


    const results = [];


    for(
      let i = 0;
      i < count;
      i++
    ){

      if(!all.length){
        break;
      }


      const chara =
        all[
          Math.floor(
            Math.random() *
            all.length
          )
        ];


      results.push(
        chara
      );


      myChars.push(
        chara
      );

    }


    resultBox.innerHTML = `

      <div class="list-item">

        <b>
          ガチャ結果
        </b>

        <br><br>

        ${results
          .map(
            x =>
              `・${escapeHTML(
                x.name
              )}`
          )
          .join("<br>")}

      </div>

    `;


    await postGAS({

      type:
        "gachaLog",

      id:
        myId,

      userId:
        myId,

      newCoins:
        iroCoins,

      pulls:
        count,

      newChars:
        myChars

    });


    await fetchSync();


  }catch(error){

    console.error(error);

    alert(
      "ガチャ処理に失敗しました"
    );

  }

}


/* =========================================================
   GAME LIST
========================================================= */

async function loadGameList(){

  const container =
    document
      .getElementById(
        "gameListContainer"
      );


  container.innerHTML =
    "読み込み中...";


  try{

    const result =
      await getGAS(
        "getList"
      );


    if(
      result.result !==
      "success"
    ){

      container.innerHTML =
        "ゲーム一覧取得失敗";

      return;

    }


    const games =
      result.data || [];


    if(!games.length){

      container.innerHTML =
        "ゲームがありません";

      return;

    }


    container.innerHTML =
      "";


    games.forEach(
      game => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card";


        card.innerHTML = `

          <div class="card-icon">
            🎮
          </div>

          <div class="card-title">
            ${escapeHTML(
              game.title
            )}
          </div>

        `;


        card.onclick =
          function(){

            launchGame(
              game.id,
              game.title
            );

          };


        container.appendChild(
          card
        );

      }
    );


  }catch(error){

    console.error(error);

    container.innerHTML =
      "ゲーム一覧取得失敗";

  }

}


/* =========================================================
   GAME LAUNCH
========================================================= */

async function launchGame(
  id,
  title
){

  logWebAction(
    "ゲーム起動:" +
    title
  );


  try{

    const result =
      await getGAS(
        "getCode",
        {
          row:id
        }
      );


    if(
      result.result !==
      "success"
    ){

      alert(
        result.message ||
        "ゲームコード取得失敗"
      );

      return;

    }


    const gameLayer =
      document
        .getElementById(
          "gameLayer"
        );


    const frame =
      document
        .getElementById(
          "gameFrame"
        );


    /*
     * srcdocに入れるコードは
     * 必ずiframeのsrcdocへ設定する。
     *
     * HTML本文へ直接書かないことで、
     * JavaScriptが背景に表示される問題を防ぐ。
     */

    frame.srcdoc =
      result.code || "";


    gameLayer.style.display =
      "block";


    document
      .getElementById(
        "mobilePauseBtn"
      )
      .style.display =
        "flex";


    await postGAS({

      type:
        "launch",

      id:
        myId,

      gameId:
        id,

      title:
        title

    });


    closeAllSheets();


  }catch(error){

    console.error(error);

    alert(
      "ゲーム起動に失敗しました"
    );

  }

}

async function sendReq(){

  const target =
    document
      .getElementById(
        "fIdIn"
      )
      .value
      .trim()
      .toUpperCase();


  if(!target){

    alert(
      "IDを入力してください"
    );

    return;

  }


  if(target === myId){

    alert(
      "自分自身には申請できません"
    );

    return;

  }


  try{

    const result =
      await postGAS({

        type:
          "request",

        myId:
          myId,

        targetId:
          target

      });


    if(
      result.result !==
      "success"
    ){

      alert(
        result.message ||
        "申請に失敗しました"
      );

      return;

    }


    alert(
      "フレンド申請を送信しました"
    );


    document
      .getElementById(
        "fIdIn"
      )
      .value =
        "";


    await fetchSync();


  }catch(error){

    console.error(error);

    alert(
      "申請に失敗しました"
    );

  }

}

  );

async function executeTransfer(){

  const id =
    document
      .getElementById(
        "tIdIn"
      )
      .value
      .trim()
      .toUpperCase();


  const pass =
    document
      .getElementById(
        "tPassIn"
      )
      .value;


  if(
    !id ||
    !pass
  ){

    alert(
      "IDと合言葉を入力してください"
    );

    return;

  }


  try{

    const result =
      await getGAS(
        "",
        {
          id:
            id
        }
      );


    if(
      result.result ===
      "success" &&
      String(
        result.pass
      ) ===
      String(pass)
    ){

      localStorage.setItem(
        "gID",
        id
      );


      localStorage.setItem(
        "gName",
        result.name ||
        ""
      );


      localStorage.setItem(
        "gPass",
        pass
      );


      myId =
        id;


      myName =
        result.name ||
        "";


      myPass =
        pass;


      closeAllSheets();


      await fetchSync();


      alert(
        "データを復元しました"
      );


    }else{

      alert(
        "IDまたは合言葉が違います"
      );

    }


  }catch(error){

    console.error(error);

    alert(
      "復元に失敗しました"
    );

  }

}
