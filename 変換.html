<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>micro:bit Robot Controller</title>

<style>

* {

    box-sizing: border-box;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #08111f,
            #172554
        );

    color: white;
}


body {

    display: flex;

    justify-content: center;

    align-items: center;
}


.container {

    width: 100%;

    max-width: 650px;

    height: 100%;

    padding: 15px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 10px;
}


h1 {

    margin: 0;

    font-size: 26px;

    text-align: center;
}


.subtitle {

    font-size: 12px;

    opacity: .75;

    text-align: center;
}


/* =========================================================
   接続
========================================================= */

.connection {

    width: 100%;

    display: flex;

    gap: 7px;
}


.connect-button {

    flex: 1;

    border: none;

    border-radius: 12px;

    padding: 12px 5px;

    color: white;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;
}


.bluetooth-button {

    background: #2563eb;
}


.reconnect-button {

    background: #7c3aed;
}


.usb-button {

    background: #059669;
}


/* =========================================================
   状態
========================================================= */

.status {

    width: 100%;

    padding: 10px;

    background:
        rgba(0,0,0,.25);

    border-radius: 12px;
}


.status-row {

    display: flex;

    justify-content: space-between;

    padding: 3px 0;

    font-size: 13px;
}


.connected {

    color: #4ade80;

    font-weight: bold;
}


.disconnected {

    color: #f87171;

    font-weight: bold;
}


/* =========================================================
   コントローラー
========================================================= */

.controller {

    width: min(88vw, 410px);

    aspect-ratio: 1;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    gap: 10px;
}


.control {

    border: none;

    border-radius: 22px;

    background: #1e3a5f;

    color: white;

    font-size: 52px;

    font-weight: bold;

    cursor: pointer;

    touch-action: none;

    -webkit-tap-highlight-color:
        transparent;

    box-shadow:
        0 7px 0 #0b1e33;

    transition:
        transform .03s,
        background .03s;
}


.control.pressed {

    transform:
        translateY(7px);

    box-shadow: none;

    background: #3b82f6;
}


.up {

    grid-column: 2;

    grid-row: 1;
}


.left {

    grid-column: 1;

    grid-row: 2;
}


.stop {

    grid-column: 2;

    grid-row: 2;

    background: #991b1b;

    box-shadow:
        0 7px 0 #5f1111;
}


.stop.pressed {

    background: #dc2626;

    box-shadow: none;
}


.right {

    grid-column: 3;

    grid-row: 2;
}


.down {

    grid-column: 2;

    grid-row: 3;
}


/* =========================================================
   操作状態
========================================================= */

.last-action {

    width: 100%;

    padding: 9px;

    background:
        rgba(0,0,0,.25);

    border-radius: 10px;

    text-align: center;

    font-weight: bold;

    font-size: 14px;
}


/* =========================================================
   ログ
========================================================= */

.log {

    width: 100%;

    height: 90px;

    overflow-y: auto;

    padding: 8px;

    border-radius: 10px;

    background: #030712;

    color: #a5b4fc;

    font-family: monospace;

    font-size: 10px;

    white-space: pre-wrap;
}


/* =========================================================
   スマホ
========================================================= */

@media (max-width: 500px) {

    .container {

        padding: 8px;

        gap: 6px;
    }


    h1 {

        font-size: 21px;
    }


    .controller {

        width:
            min(92vw, 360px);

        gap: 7px;
    }


    .control {

        font-size: 43px;

        border-radius: 18px;
    }


    .connect-button {

        font-size: 10px;

        padding: 10px 3px;
    }


    .log {

        height: 55px;
    }
}

</style>

</head>


<body>


<div class="container">


<h1>
🤖 micro:bit ロボット
</h1>


<div class="subtitle">

USB初回接続 → Bluetooth接続 → USBを外して操作

</div>


<!-- =====================================================
     接続ボタン
===================================================== -->

<div class="connection">


<button
    id="bluetoothButton"
    class="connect-button bluetooth-button">

📡 Bluetooth

</button>


<button
    id="reconnectButton"
    class="connect-button reconnect-button">

🔄 再接続

</button>


<button
    id="usbButton"
    class="connect-button usb-button">

🔌 USB

</button>


</div>


<!-- =====================================================
     状態
===================================================== -->

<div class="status">


<div class="status-row">

<span>
Bluetooth
</span>

<span
    id="bluetoothStatus"
    class="disconnected">

未接続

</span>

</div>


<div class="status-row">

<span>
USB
</span>

<span
    id="usbStatus"
    class="disconnected">

未接続

</span>

</div>


<div class="status-row">

<span>
現在の通信
</span>

<span id="modeStatus">

未接続

</span>

</div>


</div>


<!-- =====================================================
     コントローラー
===================================================== -->

<div class="controller">


<button
    id="up"
    class="control up">

↑

</button>


<button
    id="left"
    class="control left">

←

</button>


<button
    id="stop"
    class="control stop">

■

</button>


<button
    id="right"
    class="control right">

→

</button>


<button
    id="down"
    class="control down">

↓

</button>


</div>


<div
    id="lastAction"
    class="last-action">

操作なし

</div>


<div
    id="log"
    class="log">

起動しました

</div>


</div>


<script>


/* =========================================================
   Nordic UART Service
========================================================= */

const UART_SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";


const UART_RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


const UART_TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/* =========================================================
   Bluetooth
========================================================= */

let bluetoothDevice = null;

let bluetoothServer = null;

let bluetoothService = null;

let bluetoothRX = null;

let bluetoothTX = null;


/* =========================================================
   USB
========================================================= */

let serialPort = null;

let serialWriter = null;

let serialReader = null;


/* =========================================================
   操作
========================================================= */

let activeCommand = null;

let activeButton = null;


/* =========================================================
   DOM
========================================================= */

const bluetoothButton =
    document.getElementById(
        "bluetoothButton"
    );


const reconnectButton =
    document.getElementById(
        "reconnectButton"
    );


const usbButton =
    document.getElementById(
        "usbButton"
    );


const bluetoothStatus =
    document.getElementById(
        "bluetoothStatus"
    );


const usbStatus =
    document.getElementById(
        "usbStatus"
    );


const modeStatus =
    document.getElementById(
        "modeStatus"
    );


const lastAction =
    document.getElementById(
        "lastAction"
    );


const logElement =
    document.getElementById(
        "log"
    );


/* =========================================================
   ログ
========================================================= */

function log(message) {

    const time =
        new Date()
            .toLocaleTimeString();


    logElement.textContent =
        "[" +
        time +
        "] " +
        message +
        "\n" +
        logElement.textContent;
}


/* =========================================================
   Bluetooth状態
========================================================= */

function isBluetoothConnected() {

    return (
        bluetoothDevice !== null &&
        bluetoothDevice.gatt !== null &&
        bluetoothDevice.gatt.connected &&
        bluetoothRX !== null
    );
}


/* =========================================================
   USB状態
========================================================= */

function isUSBConnected() {

    return (
        serialPort !== null &&
        serialWriter !== null
    );
}


/* =========================================================
   状態更新
========================================================= */

function updateStatus() {

    if (
        isBluetoothConnected()
    ) {

        bluetoothStatus.textContent =
            "接続済み";

        bluetoothStatus.className =
            "connected";

        bluetoothButton.textContent =
            "📡 BT切断";

    } else {

        bluetoothStatus.textContent =
            "未接続";

        bluetoothStatus.className =
            "disconnected";

        bluetoothButton.textContent =
            "📡 Bluetooth";
    }


    if (
        isUSBConnected()
    ) {

        usbStatus.textContent =
            "接続済み";

        usbStatus.className =
            "connected";

        usbButton.textContent =
            "🔌 USB切断";

    } else {

        usbStatus.textContent =
            "未接続";

        usbStatus.className =
            "disconnected";

        usbButton.textContent =
            "🔌 USB";
    }


    if (
        isBluetoothConnected()
    ) {

        modeStatus.textContent =
            "📡 Bluetooth";

    } else if (
        isUSBConnected()
    ) {

        modeStatus.textContent =
            "🔌 USB";

    } else {

        modeStatus.textContent =
            "未接続";
    }
}


/* =========================================================
   Bluetooth接続
========================================================= */

async function connectBluetooth() {

    try {

        if (
            !navigator.bluetooth
        ) {

            throw new Error(
                "Web Bluetooth非対応ブラウザです"
            );
        }


        log(
            "Bluetoothデバイスを選択してください"
        );


        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                filters: [

                    {
                        services: [
                            UART_SERVICE_UUID
                        ]
                    }

                ],

                optionalServices: [

                    UART_SERVICE_UUID

                ]

            });


        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            bluetoothDisconnected
        );


        log(
            "接続中: " +
            (
                bluetoothDevice.name ||
                "micro:bit"
            )
        );


        bluetoothServer =
            await bluetoothDevice.gatt.connect();


        bluetoothService =
            await bluetoothServer.getPrimaryService(
                UART_SERVICE_UUID
            );


        bluetoothRX =
            await bluetoothService.getCharacteristic(
                UART_RX_UUID
            );


        try {

            bluetoothTX =
                await bluetoothService.getCharacteristic(
                    UART_TX_UUID
                );


            await bluetoothTX.startNotifications();


            bluetoothTX.addEventListener(
                "characteristicvaluechanged",
                receiveBluetooth
            );

        } catch (error) {

            bluetoothTX = null;
        }


        updateStatus();


        log(
            "Bluetooth接続完了"
        );


        /*
         * 接続確認
         */

        await sendBluetooth(
            "STATUS"
        );


    } catch (error) {

        console.error(error);


        log(
            "Bluetoothエラー: " +
            error.message
        );


        bluetoothRX = null;

        bluetoothTX = null;


        updateStatus();
    }
}


/* =========================================================
   Bluetooth再接続
========================================================= */

async function reconnectBluetooth() {

    try {

        if (
            bluetoothDevice &&
            bluetoothDevice.gatt &&
            !bluetoothDevice.gatt.connected
        ) {

            log(
                "以前のmicro:bitへ再接続中..."
            );


            bluetoothServer =
                await bluetoothDevice.gatt.connect();


            bluetoothService =
                await bluetoothServer.getPrimaryService(
                    UART_SERVICE_UUID
                );


            bluetoothRX =
                await bluetoothService.getCharacteristic(
                    UART_RX_UUID
                );


            updateStatus();


            log(
                "Bluetooth再接続完了"
            );


            await sendBluetooth(
                "STATUS"
            );


            return;
        }


        /*
         * 保存されたデバイスがなければ
         * 新しく選択
         */

        await connectBluetooth();

    } catch (error) {

        log(
            "再接続失敗: " +
            error.message
        );


        bluetoothRX = null;

        updateStatus();
    }
}


/* =========================================================
   Bluetooth受信
========================================================= */

function receiveBluetooth(event) {

    try {

        const decoder =
            new TextDecoder();


        const text =
            decoder.decode(
                event.target.value
            );


        log(
            "BT ← " +
            text.trim()
        );

    } catch (error) {

        console.error(error);
    }
}


/* =========================================================
   Bluetooth切断
========================================================= */

function bluetoothDisconnected() {

    bluetoothRX = null;

    bluetoothTX = null;

    bluetoothServer = null;

    bluetoothService = null;


    updateStatus();


    removePressed();


    activeCommand = null;

    activeButton = null;


    if (
        isUSBConnected()
    ) {

        log(
            "Bluetooth切断 → USBへ切替"
        );

    } else {

        log(
            "Bluetooth切断"
        );
    }
}


/* =========================================================
   Bluetooth送信
========================================================= */

async function sendBluetooth(
    command
) {

    if (
        !isBluetoothConnected()
    ) {

        return false;
    }


    try {

        const data =
            new TextEncoder()
                .encode(
                    command + "\n"
                );


        if (
            bluetoothRX.writeValueWithResponse
        ) {

            await bluetoothRX
                .writeValueWithResponse(
                    data
                );

        } else {

            await bluetoothRX
                .writeValue(
                    data
                );
        }


        log(
            "BT → " +
            command
        );


        return true;


    } catch (error) {

        log(
            "BT送信失敗: " +
            error.message
        );


        return false;
    }
}


/* =========================================================
   USB接続
========================================================= */

async function connectUSB() {

    try {

        if (
            !("serial" in navigator)
        ) {

            throw new Error(
                "Web Serial非対応ブラウザです"
            );
        }


        log(
            "USBデバイスを選択してください"
        );


        serialPort =
            await navigator.serial.requestPort();


        await serialPort.open({

            baudRate: 115200

        });


        serialWriter =
            serialPort.writable
                .getWriter();


        updateStatus();


        log(
            "USB接続完了"
        );


        readUSB();


        await sendUSB(
            "STATUS"
        );


    } catch (error) {

        serialPort = null;

        serialWriter = null;


        updateStatus();


        log(
            "USBエラー: " +
            error.message
        );
    }
}


/* =========================================================
   USB受信
========================================================= */

async function readUSB() {

    if (
        !serialPort ||
        !serialPort.readable
    ) {

        return;
    }


    serialReader =
        serialPort.readable
            .getReader();


    const decoder =
        new TextDecoder();


    try {

        while (true) {

            const result =
                await serialReader.read();


            if (
                result.done
            ) {

                break;
            }


            if (
                result.value
            ) {

                const text =
                    decoder.decode(
                        result.value
                    );


                log(
                    "USB ← " +
                    text.trim()
                );
            }
        }

    } catch (error) {

        console.log(error);

    } finally {

        try {

            serialReader.releaseLock();

        } catch (e) {}


        serialReader = null;
    }
}


/* =========================================================
   USB送信
========================================================= */

async function sendUSB(
    command
) {

    if (
        !isUSBConnected()
    ) {

        return false;
    }


    try {

        const data =
            new TextEncoder()
                .encode(
                    command + "\n"
                );


        await serialWriter.write(
            data
        );


        log(
            "USB → " +
            command
        );


        return true;


    } catch (error) {

        log(
            "USB送信失敗: " +
            error.message
        );


        return false;
    }
}


/* =========================================================
   USB切断
========================================================= */

async function disconnectUSB() {

    try {

        if (
            isUSBConnected()
        ) {

            await sendUSB(
                "S"
            );
        }


        if (
            serialReader
        ) {

            try {

                await serialReader.cancel();

            } catch (e) {}
        }


        if (
            serialWriter
        ) {

            try {

                serialWriter.releaseLock();

            } catch (e) {}

            serialWriter = null;
        }


        if (
            serialPort
        ) {

            try {

                await serialPort.close();

            } catch (e) {}

            serialPort = null;
        }


        updateStatus();


        log(
            "USB切断"
        );

    } catch (error) {

        log(
            "USB切断エラー"
        );
    }
}


/* =========================================================
   ★ 共通送信
========================================================= */

async function sendCommand(
    command
) {

    /*
     * Bluetooth優先
     */

    if (
        isBluetoothConnected()
    ) {

        const result =
            await sendBluetooth(
                command
            );


        if (result) {

            updateLastAction(
                command,
                "Bluetooth"
            );


            return true;
        }
    }


    /*
     * Bluetoothが使えない場合USB
     */

    if (
        isUSBConnected()
    ) {

        const result =
            await sendUSB(
                command
            );


        if (result) {

            updateLastAction(
                command,
                "USB"
            );


            return true;
        }
    }


    log(
        "接続されていません"
    );


    lastAction.textContent =
        "未接続";


    return false;
}


/* =========================================================
   操作表示
========================================================= */

function updateLastAction(
    command,
    connection
) {

    const names = {

        U: "↑ 前進",

        D: "↓ 後退",

        L: "← 左",

        R: "→ 右",

        S: "■ 停止"

    };


    lastAction.textContent =
        (
            names[command] ||
            command
        ) +
        " [" +
        connection +
        "]";
}


/* =========================================================
   押下解除
========================================================= */

function removePressed() {

    document
        .querySelectorAll(
            ".control.pressed"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "pressed"
                );
            }
        );
}


/* =========================================================
   移動開始
========================================================= */

function startMoving(
    command,
    button,
    event
) {

    event.preventDefault();


    if (
        activeCommand === command
    ) {

        return;
    }


    if (
        activeCommand !== null
    ) {

        sendCommand(
            "S"
        );
    }


    removePressed();


    activeCommand =
        command;


    activeButton =
        button;


    button.classList.add(
        "pressed"
    );


    try {

        button.setPointerCapture(
            event.pointerId
        );

    } catch (e) {}


    sendCommand(
        command
    );
}


/* =========================================================
   移動停止
========================================================= */

function stopMoving(
    button,
    event
) {

    if (event) {

        event.preventDefault();
    }


    if (
        activeCommand === null
    ) {

        return;
    }


    removePressed();


    activeCommand = null;

    activeButton = null;


    sendCommand(
        "S"
    );
}


/* =========================================================
   操作ボタン登録
========================================================= */

function setupButton(
    id,
    command
) {

    const button =
        document.getElementById(
            id
        );


    button.addEventListener(
        "pointerdown",
        event => {

            startMoving(
                command,
                button,
                event
            );
        }
    );


    button.addEventListener(
        "pointerup",
        event => {

            stopMoving(
                button,
                event
            );
        }
    );


    button.addEventListener(
        "pointercancel",
        event => {

            stopMoving(
                button,
                event
            );
        }
    );


    button.addEventListener(
        "lostpointercapture",
        () => {

            if (
                activeButton === button
            ) {

                stopMoving(
                    button,
                    null
                );
            }
        }
    );
}


/* =========================================================
   ボタン
========================================================= */

setupButton(
    "up",
    "U"
);


setupButton(
    "down",
    "D"
);


setupButton(
    "left",
    "L"
);


setupButton(
    "right",
    "R"
);


/* =========================================================
   STOP
========================================================= */

const stopButton =
    document.getElementById(
        "stop"
    );


stopButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();


        removePressed();


        activeCommand = null;

        activeButton = null;


        stopButton.classList.add(
            "pressed"
        );


        sendCommand(
            "S"
        );
    }
);


stopButton.addEventListener(
    "pointerup",
    () => {

        stopButton.classList.remove(
            "pressed"
        );
    }
);


/* =========================================================
   接続ボタン
========================================================= */

bluetoothButton.addEventListener(
    "click",
    async () => {

        if (
            isBluetoothConnected()
        ) {

            await sendBluetooth(
                "S"
            );


            try {

                bluetoothDevice
                    .gatt
                    .disconnect();

            } catch (e) {}

        } else {

            await connectBluetooth();
        }
    }
);


reconnectButton.addEventListener(
    "click",
    async () => {

        await reconnectBluetooth();
    }
);


usbButton.addEventListener(
    "click",
    async () => {

        if (
            isUSBConnected()
        ) {

            await disconnectUSB();

        } else {

            await connectUSB();
        }
    }
);


/* =========================================================
   キーボード操作
========================================================= */

const keys = {

    ArrowUp: [
        "U",
        "up"
    ],

    ArrowDown: [
        "D",
        "down"
    ],

    ArrowLeft: [
        "L",
        "left"
    ],

    ArrowRight: [
        "R",
        "right"
    ]
};


document.addEventListener(
    "keydown",
    event => {

        if (
            !keys[event.key]
        ) {

            return;
        }


        event.preventDefault();


        if (
            event.repeat
        ) {

            return;
        }


        const data =
            keys[event.key];


        const button =
            document.getElementById(
                data[1]
            );


        startMoving(
            data[0],
            button,
            event
        );
    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            !keys[event.key]
        ) {

            return;
        }


        event.preventDefault();


        const data =
            keys[event.key];


        const button =
            document.getElementById(
                data[1]
            );


        stopMoving(
            button,
            event
        );
    }
);


/* =========================================================
   タブを離れたら停止
========================================================= */

window.addEventListener(
    "blur",
    () => {

        if (
            activeCommand !== null
        ) {

            removePressed();

            activeCommand = null;

            activeButton = null;

            sendCommand(
                "S"
            );
        }
    }
);


/* =========================================================
   USB物理切断
========================================================= */

if (
    "serial" in navigator
) {

    navigator.serial.addEventListener(
        "disconnect",
        event => {

            if (
                serialPort ===
                event.target
            ) {

                serialPort = null;

                serialWriter = null;

                serialReader = null;


                updateStatus();


                log(
                    "USBが抜かれました"
                );


                if (
                    isBluetoothConnected()
                ) {

                    log(
                        "Bluetooth操作を継続します"
                    );
                }
            }
        }
    );
}


/* =========================================================
   起動
========================================================= */

updateStatus();


log(
    "コントローラー起動"
);


log(
    "USBまたはBluetoothで接続してください"
);

</script>

</body>

</html>
