<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Word Converter</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h1 { font-size: 1.5rem; color: #333; }
        input[type="file"] { margin: 20px 0; width: 100%; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>PDF → Word 変換</h1>
    <p>PDFファイルを選択してください</p>
    <input type="file" id="pdf-input" accept="application/pdf">
    <br>
    <button id="convert-btn">Wordに変換して保存</button>
    <div id="status"></div>
</div>

<!-- ライブラリの読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/docx@8.2.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
    // pdf.js のワーカーを設定
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const input = document.getElementById('pdf-input');
    const btn = document.getElementById('convert-btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
        const file = input.files[0];
        if (!file) {
            alert('ファイルを選択してください');
            return;
        }

        btn.disabled = true;
        status.textContent = '変換中... しばらくお待ちください。';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            let fullText = [];

            // 1. 各ページからテキストを抽出
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText.push(pageText);
            }

            // 2. docxライブラリを使ってWordドキュメントを作成
            const doc = new docx.Document({
                sections: [{
                    properties: {},
                    children: fullText.map(text => new docx.Paragraph({
                        children: [new docx.TextRun(text)],
                        spacing: { after: 200 }
                    })),
                }],
            });

            // 3. ファイル生成とダウンロード
            const blob = await docx.Packer.toBlob(doc);
            saveAs(blob, file.name.replace('.pdf', '.docx'));

            status.textContent = '変換が完了しました！';
        } catch (error) {
            console.error(error);
            status.textContent = 'エラーが発生しました。';
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
