<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Video Player</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        /* プレイヤー表示エリア */
        #player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            display: none; /* 初期は非表示 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mini Video Player</h2>
        <div class="input-group">
            <input type="text" id="video-url" placeholder="YouTube, Vimeo, または動画URLを入力...">
            <button onclick="loadVideo()">再生</button>
        </div>
        <div id="error-msg" class="error-msg">有効な動画URLを入力してください。</div>
        
        <div id="player-container">
            <!-- ここにプレイヤーが挿入される -->
        </div>
    </div>

    <script>
        function loadVideo() {
            const urlInput = document.getElementById('video-url').value.trim();
            const container = document.getElementById('player-container');
            const errorMsg = document.getElementById('error-msg');
            
            // リセット
            container.innerHTML = '';
            container.style.display = 'none';
            errorMsg.style.display = 'none';

            if (!urlInput) return;

            let html = '';

            // 1. YouTubeの判定
            const ytRegex = /^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]+)/;
            const ytMatch = urlInput.match(ytRegex);

            // 2. Vimeoの判定
            const vimeoRegex = /^(?:https?:\/\/)?(?:www\.)?vimeo\.com\/(\d+)/;
            const vimeoMatch = urlInput.match(vimeoRegex);

            // 3. 直接の動画ファイル (.mp4, .webm, .ogv)
            const directVideoRegex = /\.(mp4|webm|ogv)$/i;

            if (ytMatch) {
                const videoId = ytMatch[1];
                html = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } 
            else if (vimeoMatch) {
                const videoId = vimeoMatch[1];
                html = `<iframe src="https://player.vimeo.com/video/${videoId}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            } 
            else if (directVideoRegex.test(urlInput)) {
                html = `<video controls autoplay><source src="${urlInput}" type="video/mp4">お使いのブラウザは動画タグをサポートしていません。</video>`;
            } 
            else {
                // 不明なURLの場合
                errorMsg.style.display = 'block';
                return;
            }

            // プレイヤーを表示
            container.innerHTML = html;
            container.style.display = 'block';
        }

        // Enterキーでも再生できるようにする
        document.getElementById('video-url').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });
    </script>
</body>
</html>
