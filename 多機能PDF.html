<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 分割・結合ツール</title>
    <!-- ライブラリの読み込み -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f39c12;
            --danger: #e74c3c;
            --success: #2ecc71;
            --bg: #f4f7f6;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .upload-area { border: 2px dashed var(--primary); padding: 40px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .upload-area:hover { background: #eef6ff; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; color: white; }
        .btn-merge { background-color: var(--success); }
        .btn-zip { background-color: var(--secondary); }
        .btn-clear { background-color: var(--danger); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #f8f9fa; }
        .preview-name { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .status-badge { font-size: 0.8em; padding: 2px 8px; border-radius: 10px; background: #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>PDF 分割・結合ツール</h1>

    <div class="upload-area" id="dropZone">
        PDFファイルをドラッグ＆ドロップするか、クリックして選択してください
        <input type="file" id="fileInput" multiple accept="application/pdf" style="display:none">
    </div>

    <div class="controls">
        <button id="btnMerge" class="btn-merge" disabled>チェックした項目を結合</button>
        <button id="btnZip" class="btn-zip" disabled>全てをZIPで保存(フォルダ化)</button>
        <button id="btnClear" class="btn-clear">リストをクリア</button>
    </div>

    <table id="fileTable">
        <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>ファイル/ページ名</th>
                <th>サイズ</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="fileList"></tbody>
    </table>
</div>

<script>
    const { PDFDocument } = PDFLib;
    let fileItems = []; // 処理中のファイルを管理

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileList = document.getElementById('fileList');
    const btnMerge = document.getElementById('btnMerge');
    const btnZip = document.getElementById('btnZip');
    const btnClear = document.getElementById('btnClear');
    const selectAll = document.getElementById('selectAll');

    // クリックでファイル選択
    dropZone.onclick = () => fileInput.click();

    // ドラッグ＆ドロップ処理
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.background = "#eef6ff"; };
    dropZone.ondragleave = () => { dropZone.style.background = "transparent"; };
    dropZone.ondrop = (e) => {
        e.preventDefault();
        handleFiles(e.dataTransfer.files);
    };

    fileInput.onchange = (e) => handleFiles(e.target.files);

    // ファイル読み込み処理
    async function handleFiles(files) {
        for (let file of files) {
            if (file.type !== 'application/pdf') continue;
            const arrayBuffer = await file.arrayBuffer();
            fileItems.push({
                name: file.name,
                data: arrayBuffer,
                id: Date.now() + Math.random()
            });
        }
        render();
    }

    // UIの更新
    function render() {
        fileList.innerHTML = '';
        fileItems.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="file-check" data-index="${index}"></td>
                <td class="preview-name">${item.name}</td>
                <td>${(item.data.byteLength / 1024).toFixed(1)} KB</td>
                <td>
                    <button onclick="splitPdf(${index})" style="background:var(--primary); font-size:12px;">ページ分割</button>
                    <button onclick="downloadSingle(${index})" style="background:#555; font-size:12px;">保存</button>
                </td>
            `;
            fileList.appendChild(tr);
        });
        btnMerge.disabled = fileItems.length < 1;
        btnZip.disabled = fileItems.length < 1;
    }

    // PDFの分割機能
    async function splitPdf(index) {
        const item = fileItems[index];
        const srcDoc = await PDFDocument.load(item.data);
        const pageCount = srcDoc.getPageCount();

        if (pageCount <= 1) {
            alert("このPDFは既に1ページのみです。");
            return;
        }

        const newItems = [];
        for (let i = 0; i < pageCount; i++) {
            const newDoc = await PDFDocument.create();
            const [copiedPage] = await newDoc.copyPages(srcDoc, [i]);
            newDoc.addPage(copiedPage);
            const pdfBytes = await newDoc.save();
            
            newItems.push({
                name: `${item.name.replace('.pdf', '')}_page_${i + 1}.pdf`,
                data: pdfBytes,
                id: Date.now() + Math.random()
            });
        }

        // 元のファイルを消して分割したものを挿入
        fileItems.splice(index, 1, ...newItems);
        render();
    }

    // PDFの結合機能
    btnMerge.onclick = async () => {
        const selectedIndexes = Array.from(document.querySelectorAll('.file-check:checked'))
                                     .map(el => parseInt(el.dataset.index));
        
        if (selectedIndexes.length < 2) {
            alert("結合するには2つ以上の項目を選択してください。");
            return;
        }

        const mergedPdf = await PDFDocument.create();
        for (let idx of selectedIndexes) {
            const srcDoc = await PDFDocument.load(fileItems[idx].data);
            const copiedPages = await mergedPdf.copyPages(srcDoc, srcDoc.getPageIndices());
            copiedPages.forEach(page => mergedPdf.addPage(page));
        }

        const mergedBytes = await mergedPdf.save();
        const blob = new Blob([mergedBytes], { type: 'application/pdf' });
        saveAs(blob, "merged_document.pdf");
    };

    // ZIPにまとめてダウンロード (フォルダ化)
    btnZip.onclick = async () => {
        const zip = new JSZip();
        fileItems.forEach(item => {
            zip.file(item.name, item.data);
        });
        const content = await zip.generateAsync({ type: "blob" });
        saveAs(content, "pdf_collection.zip");
    };

    // 単一ダウンロード
    function downloadSingle(index) {
        const item = fileItems[index];
        const blob = new Blob([item.data], { type: 'application/pdf' });
        saveAs(blob, item.name);
    }

    // ヘルパー：保存
    function saveAs(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    // 全選択
    selectAll.onchange = (e) => {
        document.querySelectorAll('.file-check').forEach(cb => cb.checked = e.target.checked);
    };

    // クリア
    btnClear.onclick = () => {
        fileItems = [];
        render();
    };
</script>

</body>
</html>
