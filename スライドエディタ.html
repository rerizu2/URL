<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スライドエディタ</title>
<style>
:root{--bg:#f1f3f6;--panel:#fff;--ink:#1d2330;--mut:#667085;--line:#d9dee7;--acc:#2f6bff;--accbg:#e8efff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1d222b;--ink:#e8ebf1;--mut:#9aa3b2;--line:#323946;--acc:#6b95ff;--accbg:#26304a}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1d222b;--ink:#e8ebf1;--mut:#9aa3b2;--line:#323946;--acc:#6b95ff;--accbg:#26304a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:14px}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar b{margin-right:8px}
button,select,input[type=number]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--accbg);border-color:var(--acc)}
input[type=color]{width:32px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#main{flex:1;display:flex;min-height:0}
#thumbs{width:190px;overflow:auto;padding:10px;background:var(--panel);border-right:1px solid var(--line);flex:none}
.th{position:relative;width:166px;height:93.4px;margin-bottom:10px;border:2px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;background:#fff}
.th.cur{border-color:var(--acc)}
.th i{position:absolute;left:3px;bottom:2px;font-style:normal;font-size:11px;background:#0008;color:#fff;border-radius:3px;padding:0 4px;z-index:3}
.th .slide{transform:scale(.1148);transform-origin:0 0;pointer-events:none}
#wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
#frame{position:relative;flex:none}
.slide{position:absolute;left:0;top:0;width:1440px;height:810px;background:#fff;overflow:hidden;transform-origin:0 0}
#frame .slide{box-shadow:0 2px 14px #0004}
.el{position:absolute;user-select:none}
.el.t{white-space:pre-wrap;line-height:1.35;overflow:visible;font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif;padding:4px 8px;word-break:break-all}
.el.i img{width:100%;height:100%;display:block;pointer-events:none;object-fit:fill}
#frame .el{cursor:move}
#frame .el:hover{outline:2px dashed #2f6bff88}
#frame .el.sel{outline:2px solid #2f6bff}
.el.ed{cursor:text!important;user-select:text;outline:2px solid #2f6bff}
.hd{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;background:#2f6bff;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;z-index:5}
#hint{padding:6px 12px;color:var(--mut);font-size:12px;background:var(--panel);border-top:1px solid var(--line)}
#mid{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#note{height:84px;margin:0;border:0;border-top:1px solid var(--line);padding:8px 12px;font:inherit;color:var(--ink);background:var(--panel);resize:vertical}
#show{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;cursor:none}
#show[hidden],#dlg[hidden],#rem[hidden],#r1[hidden],#r2[hidden]{display:none}
#sf{position:relative}
#stb{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#000a;color:#fff;opacity:0;transition:opacity .3s;cursor:default;font-size:13px}
#show.mv{cursor:default}#show.mv #stb{opacity:1}
#stb button{background:#fff2;color:#fff;border-color:#fff5}
#pg{position:fixed;right:12px;bottom:8px;color:#fff8;font-size:13px}
#dlg,#rem{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:440px;width:100%;max-height:100%;overflow:auto}
.box h3{margin:0 0 10px}.mut{color:var(--mut);font-size:12px;line-height:1.6}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
.big{padding:14px;font-size:16px;width:100%}.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#dRc.on{background:#1a9d4b;color:#fff;border-color:#1a9d4b}
#rcode{width:100%;font-size:28px;text-align:center;letter-spacing:.2em;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#rn{font-size:30px;font-weight:700;text-align:center}#rt{text-align:center;color:var(--mut);margin:4px 0 8px}
#rnote{white-space:pre-wrap;font-size:18px;line-height:1.6;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0;background:var(--bg)}
#rl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#show{overflow:hidden}#wrap{overflow-x:hidden}
#rcI{font-size:20px;font-weight:700;letter-spacing:.1em}
#bcode{font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:6px;border:1px dashed var(--line);color:var(--mut)}#bcode.on{color:#fff;background:#1a9d4b;border-color:#1a9d4b}
@keyframes a-fade{from{opacity:0}}
@keyframes a-up{from{opacity:0;transform:translateY(60px)}}
@keyframes a-left{from{opacity:0;transform:translateX(-160px)}}
@keyframes a-right{from{opacity:0;transform:translateX(160px)}}
@keyframes a-zoom{from{opacity:0;transform:scale(.3)}}
@keyframes a-spin{from{opacity:0;transform:rotate(-180deg) scale(.2)}}
@keyframes a-bounce{0%{opacity:0;transform:translateY(-200px)}60%{opacity:1;transform:translateY(24px)}80%{transform:translateY(-12px)}100%{transform:none}}
@keyframes t-fade{from{opacity:0}}@keyframes t-slide{from{transform:translateX(100%)}}@keyframes t-slideb{from{transform:translateX(-100%)}}@keyframes t-up{from{transform:translateY(100%)}}
@keyframes t-zoom{from{opacity:0;transform:scale(.4)}}@keyframes t-flip{from{opacity:0;transform:perspective(1400px) rotateY(90deg)}}@keyframes t-wipe{from{clip-path:inset(0 100% 0 0)}}
.tr-fade{animation:t-fade .7s both}.tr-slide{animation:t-slide .6s both}.tr-slideb{animation:t-slideb .6s both}.tr-up{animation:t-up .6s both}.tr-zoom{animation:t-zoom .6s both}.tr-flip{animation:t-flip .8s both}.tr-wipe{animation:t-wipe .8s both}
#print{display:none}
@media print{@page{size:1280px 720px;margin:0}body>#app{display:none}#print{display:block}#print .slide{position:relative;zoom:.8889;page-break-after:always;box-shadow:none}html,body{background:#fff;height:auto}}
@media (max-width:700px){#thumbs{display:none}}
</style>
</head>
<body>
<div id="app">
 <div id="bar">
  <b>スライドエディタ</b>
  <button id="addT">＋文字</button><button id="addI">＋画像</button><input id="file" type="file" accept="image/*" hidden>
  <span class="sep"></span>
  <select id="fs" title="文字サイズ"></select>
  <input id="col" type="color" value="#000000" title="文字色">
  <button id="bold"><b>B</b></button><button id="al" title="配置">左</button>
  <span class="sep"></span>
  <button id="up">前面</button><button id="dn">背面</button><button id="del">削除</button>
  <span class="sep"></span>
  <select id="an" title="選択中の要素のアニメーション"><option value="none">要素アニメ：なし</option><option value="fade">フェードイン</option><option value="up">下から</option><option value="left">左から</option><option value="right">右から</option><option value="zoom">ズーム</option><option value="bounce">バウンド</option><option value="spin">回転</option><option value="type">タイプライター（文字）</option><option value="char">1文字ずつ（文字）</option></select><input id="ad" type="number" min="0" max="30" step="0.5" value="0" style="width:64px" title="開始までの待ち秒数"><span>秒後</span>
  <select id="tr" title="このスライドへの切り替え効果"><option value="none">切替：なし</option><option value="fade">フェード</option><option value="slide">スライド</option><option value="up">下から</option><option value="zoom">ズーム</option><option value="flip">フリップ</option><option value="wipe">ワイプ</option></select><button id="prevB">▶ プレビュー</button>
  <span class="sep"></span>
  <button id="undo">↶</button><button id="redo">↷</button>
  <span class="sep"></span>
  <button id="addS">＋スライド</button><button id="dupS">複製</button><button id="delS">スライド削除</button>
  <span class="sep"></span>
  <button id="pdf">PDF保存/印刷</button><button id="exp">JSON書出</button><button id="imp">読込</button><input id="jf" type="file" accept=".json" hidden>
  <button id="reset">初期化</button>
  <span class="sep"></span><button id="play" class="pri">▶ スライドショー</button><button id="remB">📱 リモコン</button><span id="bcode" title="スマホのリモコンに入力する6桁のコード"></span>
 </div>
 <div id="main"><div id="thumbs"></div><div id="mid"><div id="wrap"><div id="frame"></div></div><textarea id="note" placeholder="スピーカーノート（スマホリモコンに表示されます）"></textarea></div></div>
 <div id="hint">ドラッグで移動／右下の●でサイズ変更／文字はダブルクリックで編集／矢印キーで微調整（Shiftで大きく）／Delete削除／Ctrl+Zで元に戻す</div>
</div>
<div id="print"></div>

<script>
/* ★★★ 重要 ★★★
   下の1行 `const IMG={};` を、元のHTMLファイルにあった
   `const IMG={"g": "data:image/jpeg;base64,...", "s": ..., "p": ..., "f": ..., "m": ..., "b": ...};`
   の行（1行まるごと）に置き換えてください。これで元の画像が表示されます。 */
const IMG={};

const T=(id,x,y,w,h,s,fs,o={})=>({id,t:'t',x,y,w,h,s,fs,c:'#000000',b:0,a:'left',...o});
const P=(id,x,y,w,h,k)=>({id,t:'i',x,y,w,h,k});
const INIT=()=>[
 {els:[T(1,120,230,1200,120,'情報電子工学科',72,{b:1}),T(2,120,350,1200,150,'R&D説明',110,{b:1}),T(3,120,520,1200,80,'〜王工見学会〜',48,{c:'#555555'})]},
 {els:[T(4,64,70,1300,80,'1.R&Dについて',56),T(5,64,200,1320,500,'R&Dとは(Research&Discovery)の略です。\n【Research】は【研究】\n【Discovery】は【発見】\nこのようなものです。\n問題点や課題を発見し、解決に向けて情報を収集・整理・分析を行い\n考え抜く力 (課題発見力・計画力・想像力)を育成する授業です。',40)]},
 {els:[T(6,64,60,1300,80,'2.R&Dでどのようなものを作っているか',56),T(7,64,170,800,60,'今までの課題',40,{c:'#666666'}),
  P(8,44,268,530,297,'g'),P(9,656,254,569,293,'p'),P(10,310,468,548,304,'s'),P(11,878,486,549,292,'f')]},
 {els:[T(12,64,50,1300,80,'3.R&D micro:bit（マイクロビットのサッカー大会）',50),P(13,49,177,399,250,'m'),P(14,24,450,443,310,'b'),
  T(15,500,190,900,70,'⇐ロボットを操作してサッカー大会を行う',32),T(16,500,360,900,160,'R&D（探究授業）でmicro:bitサッカー大会を開催！　AIや3DCADも活用し、チームで創意工夫',32),T(17,500,540,900,70,'⇐マイクロビット対戦様子',32)]}
];
let S,cur=0,sel=null,hist=[],fut=[],nid=100,scale=1;
const $=id=>document.getElementById(id),KEY='slide-editor-v1';
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S||!S.length)S=INIT();
const snap=()=>JSON.stringify(S);
function push(){hist.push(snap());if(hist.length>80)hist.shift();fut=[];save()}
function save(){try{localStorage.setItem(KEY,snap())}catch(e){}}
function undo(){if(!hist.length)return;fut.push(snap());S=JSON.parse(hist.pop());cur=Math.min(cur,S.length-1);sel=null;save();draw()}
function redo(){if(!fut.length)return;hist.push(snap());S=JSON.parse(fut.pop());cur=Math.min(cur,S.length-1);sel=null;save();draw()}
function mk(e,live,an){
 const d=document.createElement('div');d.className='el '+e.t;d.dataset.id=e.id;
 d.style.cssText=`left:${e.x}px;top:${e.y}px;width:${e.w}px;`+(e.t=='i'?`height:${e.h}px;`:`min-height:${e.h}px;font-size:${e.fs}px;color:${e.c};font-weight:${e.b?700:400};text-align:${e.a};`);
 if(e.t=='i'){const im=new Image();im.src=e.k?IMG[e.k]:e.src;im.draggable=false;d.appendChild(im)}else if(an&&(e.an=='type'||e.an=='char'))charAnim(d,e);else d.textContent=e.s;
 if(an&&e.an&&e.an!='none'&&e.an!='type'&&e.an!='char')d.style.animation=`a-${e.an} .8s ${+e.ad||0}s both`;
 if(live&&e.id===sel){d.classList.add('sel');const h=document.createElement('div');h.className='hd';d.appendChild(h)}
 return d}
function slideEl(s,live,an){const d=document.createElement('div');d.className='slide';s.els.forEach(e=>d.appendChild(mk(e,live,an)));return d}
function draw(pv){
 const f=$('frame'),w=$('wrap');
 scale=Math.min((w.clientWidth-32)/1440,(w.clientHeight-32)/810);if(scale<.2)scale=.2;
 f.style.width=1440*scale+'px';f.style.height=810*scale+'px';f.innerHTML='';
 const sl=slideEl(S[cur],true,pv===true);sl.style.transform=`scale(${scale})`;f.appendChild(sl);
 const th=$('thumbs');th.innerHTML='';
 S.forEach((s,i)=>{const t=document.createElement('div');t.className='th'+(i==cur?' cur':'');t.appendChild(slideEl(s,false));const n=document.createElement('i');n.textContent=i+1;t.appendChild(n);t.onclick=()=>{cur=i;sel=null;draw()};th.appendChild(t)});
 $('note').value=S[cur].note||'';$('tr').value=S[cur].tr||'none';const e=cur_el();$('an').value=(e&&e.an)||'none';$('ad').value=(e&&e.ad)||0;$('bold').classList.toggle('on',!!(e&&e.b));
 if(e&&e.t=='t'){$('fs').value=e.fs;$('col').value=e.c;$('al').textContent={left:'左',center:'中',right:'右'}[e.a]}
}
const cur_el=()=>S[cur].els.find(e=>e.id===sel);
function pt(ev){const r=$('frame').getBoundingClientRect();return{x:(ev.clientX-r.left)/scale,y:(ev.clientY-r.top)/scale}}
let drag=null;
$('frame').addEventListener('pointerdown',ev=>{
 if(document.querySelector('.el.ed')&&ev.target.closest('.el.ed'))return;
 const h=ev.target.closest('.hd'),el=ev.target.closest('.el');
 if(!el){sel=null;draw();return}
 const id=+el.dataset.id;sel=id;const e=cur_el(),p=pt(ev);
 drag={mode:h?'rs':'mv',sx:p.x,sy:p.y,ox:e.x,oy:e.y,ow:e.w,oh:e.h,moved:false,id};
 draw();ev.preventDefault();
});
addEventListener('pointermove',ev=>{
 if(!drag)return;const e=S[cur].els.find(x=>x.id===drag.id),p=pt(ev),dx=p.x-drag.sx,dy=p.y-drag.sy;
 if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<3)return;
 if(!drag.moved){drag.moved=true;hist.push(snap());fut=[]}
 if(drag.mode=='mv'){e.x=Math.round(drag.ox+dx);e.y=Math.round(drag.oy+dy)}
 else{e.w=Math.max(40,Math.round(drag.ow+dx));e.h=e.t=='i'?Math.max(30,Math.round(drag.oh*(e.w/drag.ow))):Math.max(30,Math.round(drag.oh+dy))}
 const d=$('frame').querySelector(`[data-id="${e.id}"]`);d.style.left=e.x+'px';d.style.top=e.y+'px';d.style.width=e.w+'px';
 d.style[e.t=='i'?'height':'minHeight']=e.h+'px';
});
addEventListener('pointerup',()=>{if(drag&&drag.moved){save();draw()}drag=null});
$('frame').addEventListener('dblclick',ev=>{
 const el=ev.target.closest('.el.t');if(!el)return;
 const id=+el.dataset.id,e=S[cur].els.find(x=>x.id===id);sel=id;
 el.querySelector('.hd')?.remove();el.classList.add('ed');el.contentEditable='plaintext-only';
 if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
 el.focus();getSelection().selectAllChildren(el);
 el.onblur=()=>{const v=el.innerText.replace(/\n$/,'');if(v!==e.s){push();e.s=v}el.contentEditable='false';save();draw()};
});
function edit(fn){const e=cur_el();if(!e)return;push();fn(e);draw()}
for(let n=12;n<=160;n+=n<40?4:n<80?8:16){const o=document.createElement('option');o.value=n;o.textContent=n;$('fs').appendChild(o)}
$('fs').onchange=()=>edit(e=>{if(e.t=='t')e.fs=+$('fs').value});
$('col').onchange=()=>edit(e=>{if(e.t=='t')e.c=$('col').value});
$('bold').onclick=()=>edit(e=>{if(e.t=='t')e.b=e.b?0:1});
$('al').onclick=()=>edit(e=>{if(e.t=='t')e.a={left:'center',center:'right',right:'left'}[e.a]});
$('up').onclick=()=>edit(e=>{const a=S[cur].els,i=a.indexOf(e);a.push(...a.splice(i,1))});
$('dn').onclick=()=>edit(e=>{const a=S[cur].els,i=a.indexOf(e);a.unshift(...a.splice(i,1))});
$('del').onclick=delEl;
function delEl(){const e=cur_el();if(!e)return;push();S[cur].els=S[cur].els.filter(x=>x!==e);sel=null;draw()}
$('addT').onclick=()=>{push();const e=T(++nid,300,300,600,80,'テキストを入力',48);S[cur].els.push(e);sel=e.id;draw()};
$('addI').onclick=()=>$('file').click();
$('file').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{push();const w=Math.min(600,im.width),h=Math.round(w*im.height/im.width),e={id:++nid,t:'i',x:420,y:200,w,h,src:r.result};S[cur].els.push(e);sel=e.id;draw()};im.src=r.result};r.readAsDataURL(f);ev.target.value=''};
$('addS').onclick=()=>{push();S.splice(cur+1,0,{els:[]});cur++;sel=null;draw()};
$('dupS').onclick=()=>{push();const c=JSON.parse(JSON.stringify(S[cur]));c.els.forEach(e=>e.id=++nid);S.splice(cur+1,0,c);cur++;sel=null;draw()};
$('delS').onclick=()=>{if(S.length<2||!confirm('このスライドを削除しますか？'))return;push();S.splice(cur,1);cur=Math.min(cur,S.length-1);sel=null;draw()};
$('undo').onclick=undo;$('redo').onclick=redo;
$('reset').onclick=()=>{if(!confirm('すべて初期状態に戻しますか？'))return;push();S=INIT();cur=0;sel=null;draw()};
$('pdf').onclick=()=>{const p=$('print');p.innerHTML='';S.forEach(s=>p.appendChild(slideEl(s,false)));window.print()};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([snap()],{type:'application/json'}));a.download='slides.json';a.click()};
$('imp').onclick=()=>$('jf').click();
$('jf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;push();S=d;cur=0;sel=null;draw()}catch(e){alert('読み込めませんでした')}});ev.target.value=''};
addEventListener('keydown',ev=>{
 if(document.querySelector('.el.ed')||showing||/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;
 const k=ev.key,m=ev.ctrlKey||ev.metaKey;
 if(m&&k=='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}
 if(m&&k=='y'){ev.preventDefault();redo();return}
 const e=cur_el();if(!e)return;
 if(k=='Delete'||k=='Backspace'){delEl();return}
 const st=ev.shiftKey?20:2,d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[k];
 if(d){ev.preventDefault();push();e.x+=d[0];e.y+=d[1];draw()}
});
$('note').onchange=()=>{push();S[cur].note=$('note').value;save()};
document.body.insertAdjacentHTML('beforeend',`<div id="show" hidden><div id="sf"></div><div id="stb"><button id="rcT"></button><span id="rcI"></span><span style="flex:1"></span><button id="stop">終了 (Esc)</button></div><div id="pg"></div></div>
<div id="dlg" hidden><div class="box"><h3>スライドショー</h3><button id="dRc" class="big"></button><p class="mut">ON：スマホからスライド操作とノート表示ができます（PCは全画面でスライドを表示）。<br>OFF：全画面でスライドだけを表示します。</p><div class="row"><button id="dGo" class="pri">開始</button><button id="dX">キャンセル</button></div></div></div>
<div id="rem" hidden><div class="box"><div id="r1"><h3>スマホリモコン</h3><p class="mut">PCのスライドショー画面に表示された6桁のコードを入力してください。</p><input id="rcode" inputmode="numeric" maxlength="6" placeholder="000000"><div class="row"><button id="rCon" class="pri">接続</button><button class="rx">閉じる</button></div><p id="rMsg" class="mut"></p></div><div id="r2" hidden><div id="rn"></div><div id="rt"></div><div class="row"><button id="rP" class="big">◀ 前へ</button><button id="rN" class="big pri">次へ ▶</button></div><div id="rnote"></div><div id="rl"></div><button class="rx big">切断して閉じる</button></div></div></div>`);
let showing=false,si=0,rc=false,want=false,rcErr=false,rm=null,rcode=String(Math.floor(100000+Math.random()*900000)),offs=[],mvT,rcl=null,roffs=[],rint=0,got=false;

/* ===== リモコン通信（Firebase Realtime Database・REST/SSE。SDK不要）=====
   部屋のデータ: /remote/コード/state（PC→スマホ）, /remote/コード/cmd（スマホ→PC） */
const DB='https://realtime-database-7f11f-default-rtdb.firebaseio.com';
const dbUrl=(code,p)=>`${DB}/remote/${code}/${p}.json`;
async function dbPut(url,v){const r=await fetch(url,{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw new Error('DB '+r.status);return r}
function listen(url,fn){const es=new EventSource(url);es.addEventListener('put',ev=>{try{const m=JSON.parse(ev.data);if(m&&m.path==='/'&&m.data!=null)fn(m.data)}catch(e){}});return es}
function mkRoom(){const hs={},closers=[];return{
 on:(t,f)=>{(hs[t]=hs[t]||[]).push(f);return()=>{hs[t]=hs[t].filter(x=>x!==f)}},
 _in:(t,d)=>(hs[t]||[]).forEach(f=>f({data:d})),
 _close:f=>closers.push(f),
 leave:()=>closers.forEach(f=>{try{f()}catch(e){}})}}
async function hostRoom(code){
 const r=mkRoom();
 await dbPut(`${DB}/remote/${code}.json`,{created:Date.now()});
 const es=listen(dbUrl(code,'cmd'),d=>{if(d.a=='hello')r._in('hello',d);else r._in('cmd',d)});
 r.emit=async(t,d)=>{if(t=='state')await dbPut(dbUrl(code,'state'),d)};
 r._close(()=>es.close());
 r._close(()=>fetch(`${DB}/remote/${code}.json`,{method:'DELETE',keepalive:true}).catch(()=>{}));
 return r}
async function clientRoom(code){
 const r=mkRoom();
 const chk=await fetch(dbUrl(code,'state'));if(!chk.ok)throw new Error('DB '+chk.status);
 const es=listen(dbUrl(code,'state'),d=>r._in('state',d));
 r.emit=async(t,d)=>{await dbPut(dbUrl(code,'cmd'),Object.assign({},d,{a:t=='hello'?'hello':d.a,t:Date.now(),k:Math.random()}))};
 r._close(()=>es.close());
 return r}

const titleOf=s=>{const t=s.els.find(e=>e.t=='t');return t?t.s.split('\n')[0].slice(0,30):'(文字なし)'};
function sync(){if(rm&&rc)rm.emit('state',{n:si,total:S.length,note:S[si].note||'',titles:S.map(titleOf)}).catch(()=>{})}
function renderShow(a){const f=$('sf'),k=Math.min(innerWidth/1440,innerHeight/810);f.style.width=1440*k+'px';f.style.height=810*k+'px';f.innerHTML='';const s=slideEl(S[si],false,a);s.style.transform=`scale(${k})`;f.appendChild(s);$('pg').textContent=(si+1)+' / '+S.length;sync()}
function go(n){n=Math.max(0,Math.min(S.length-1,Math.floor(+n)||0));if(n!==si){const d=n>si?1:-1;si=n;renderShow(true);playTr($('sf'),S[si].tr,d)}}
function poke(ms){const s=$('show');s.classList.add('mv');clearTimeout(mvT);mvT=setTimeout(()=>s.classList.remove('mv'),ms)}
function updRc(){const t='📱 スマホコントロール：'+(want?'ON':'OFF');$('dRc').textContent=t;$('dRc').classList.toggle('on',want);$('rcT').textContent='📱 スマホコントロール：'+(rc?'ON':'OFF');$('rcI').textContent=rcErr?'スマホ連携に接続できませんでした（ネットワークを確認）':rc?`コード ${rcode}`:'';$('bcode').textContent='PCコード '+rcode;$('bcode').classList.toggle('on',rc)}
async function hostOn(){rcErr=false;
 try{rm=await hostRoom(rcode)}catch(e){rc=false;rcErr=true;updRc();return}
 rc=true;
 offs.push(rm.on('hello',()=>sync()),rm.on('cmd',m=>{const d=m.data||{};if(d.a=='next')go(si+1);else if(d.a=='prev')go(si-1);else if(d.a=='goto')go(d.n)}));
 updRc();sync()}
function hostOff(){rc=false;offs.forEach(f=>f());offs=[];try{rm&&rm.leave()}catch(e){}rm=null;updRc()}
async function openShow(){$('dlg').hidden=true;showing=true;sel=null;si=cur;$('show').hidden=false;try{await $('show').requestFullscreen()}catch(e){}
 if(want)await hostOn();else updRc();renderShow(true);poke(want?20000:2500)}
function closeShow(){if(!showing)return;showing=false;hostOff();rcErr=false;$('show').hidden=true;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});cur=si;draw()}
$('play').onclick=()=>{updRc();$('dlg').hidden=false};
$('dRc').onclick=()=>{want=!want;updRc()};$('dGo').onclick=openShow;$('dX').onclick=()=>{$('dlg').hidden=true};
$('rcT').onclick=async()=>{if(rc)hostOff();else await hostOn();want=rc;updRc();poke(8000)};
$('stop').onclick=closeShow;
$('show').onmousemove=()=>poke(2500);
$('show').addEventListener('click',ev=>{if(ev.target.closest('#stb'))return;ev.clientX>innerWidth/3?go(si+1):go(si-1)});
addEventListener('fullscreenchange',()=>{if(showing&&!document.fullscreenElement)closeShow()});
addEventListener('keydown',ev=>{if(!showing)return;const k=ev.key;
 if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k))go(si+1);else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k))go(si-1);else if(k=='Home')go(0);else if(k=='End')go(S.length-1);else if(k=='Escape')closeShow();ev.preventDefault()});
$('remB').onclick=()=>{$('rem').hidden=false};
function remClose(){clearInterval(rint);roffs.forEach(f=>f());roffs=[];try{rcl&&rcl.leave()}catch(e){}rcl=null;got=false;$('r1').hidden=false;$('r2').hidden=true;$('rMsg').textContent='';$('rem').hidden=true}
document.querySelectorAll('.rx').forEach(b=>b.onclick=remClose);
function showRem(d){if(!d||typeof d!=='object'||!Array.isArray(d.titles))return;got=true;
 $('rn').textContent=(+d.n+1)+' / '+(+d.total);$('rt').textContent=String(d.titles[d.n]||'');$('rnote').textContent=d.note?String(d.note):'（ノートなし）';
 const l=$('rl');l.innerHTML='';d.titles.forEach((t,i)=>{const b=document.createElement('button');b.textContent=(i+1);b.title=String(t);if(i==d.n)b.className='pri';b.onclick=()=>rcl&&rcl.emit('cmd',{a:'goto',n:i});l.appendChild(b)})}
$('rCon').onclick=async()=>{const code=$('rcode').value.trim();if(!/^\d{6}$/.test(code)){$('rMsg').textContent='6桁の数字を入力してください';return}
 $('rMsg').textContent='接続中…';
 try{rcl=await clientRoom(code)}catch(e){rcl=null;$('rMsg').textContent='接続できませんでした（コードとPCのスライドショー開始を確認してください）';return}
 $('rMsg').textContent='';roffs.push(rcl.on('state',m=>showRem(m.data)));got=false;
 $('r1').hidden=true;$('r2').hidden=false;$('rn').textContent='接続中…';$('rt').textContent='PCでスライドショーを開始してください';
 rcl.emit('hello',{});rint=setInterval(()=>{if(!got&&rcl)rcl.emit('hello',{})},2000)};
$('rP').onclick=()=>rcl&&rcl.emit('cmd',{a:'prev'});$('rN').onclick=()=>rcl&&rcl.emit('cmd',{a:'next'});
function charAnim(d,e){const t=e.an=='type',b=+e.ad||0;let i=0;
 for(const ch of e.s){if(ch=='\n'){d.appendChild(document.createElement('br'));continue}
  const s=document.createElement('span');s.textContent=ch;
  if(t)s.style.animation=`a-fade .01s ${b+i*.06}s both`;else{s.style.display='inline-block';s.style.animation=`a-up .5s ${b+i*.07}s both`}
  d.appendChild(s);i++}}
function playTr(f,t,dir){if(!t||t=='none')return;f.className='';void f.offsetWidth;f.className='tr-'+(t=='slide'&&dir<0?'slideb':t)}
$('an').onchange=()=>edit(e=>{e.an=$('an').value;if(e.t=='i'&&(e.an=='type'||e.an=='char'))e.an='fade'});
$('ad').onchange=()=>edit(e=>{e.ad=Math.max(0,+$('ad').value||0)});
$('tr').onchange=()=>{push();S[cur].tr=$('tr').value;save()};
$('prevB').onclick=()=>{draw(true);playTr($('frame'),S[cur].tr,1)};
addEventListener('resize',()=>showing?renderShow():draw());
updRc();
S.forEach(s=>s.els.forEach(e=>nid=Math.max(nid,e.id)));
draw();
</script>
</body>
</html>
