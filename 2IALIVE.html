<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LIVE STREAM</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:#080c12;
    color:#fff;
    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}

body{
    padding-bottom:40px;
}

header{
    height:64px;
    background:#111822;
    border-bottom:1px solid #293441;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:#ff1744;
}

.connection{
    display:flex;
    align-items:center;
    gap:8px;

    color:#aab4bf;
    font-size:14px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#666;
}

.dot.live{
    background:#00e676;
    box-shadow:0 0 12px #00e676;
}

main{
    width:min(1100px,100%);
    margin:auto;
    padding:25px 18px;
}

h1{
    margin:0 0 8px;
    font-size:30px;
}

.subtitle{
    color:#929daa;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:14px;

    border:1px solid #303b47;
    border-radius:10px;

    background:#141c25;
    color:#fff;

    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.tab.active{
    background:#ff1744;
    border-color:#ff1744;
}

.panel{
    background:#111822;
    border:1px solid #293441;

    border-radius:15px;

    padding:18px;

    margin-bottom:20px;
}

.panel-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.video-box{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    background:#000;

    border-radius:12px;

    overflow:hidden;
}

video{
    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}

.live{
    position:absolute;
    left:14px;
    top:14px;

    background:#ff1744;

    padding:6px 10px;

    border-radius:6px;

    font-weight:bold;
    font-size:13px;

    display:none;
}

.live.show{
    display:block;
}

.status-message{
    margin-top:12px;

    padding:11px;

    border-radius:8px;

    background:#0c1219;

    border:1px solid #293441;

    color:#aab4bf;

    font-size:14px;
}

.controls{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(200px,1fr));

    gap:12px;

    margin-top:15px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#aab4bf;
    font-size:13px;
}

select,
input{
    width:100%;

    padding:13px;

    background:#090e14;

    border:1px solid #303b47;

    border-radius:9px;

    color:#fff;

    outline:none;
}

button{
    cursor:pointer;
}

.button-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:15px;
}

.main-button{
    padding:14px;

    border:0;

    border-radius:9px;

    color:#fff;

    background:#ff1744;

    font-size:16px;

    font-weight:bold;
}

.main-button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.stop{
    background:#343e48;
}

.room{
    margin-top:20px;
}

.room-id{
    display:flex;
    gap:10px;
}

.room-id div{
    flex:1;

    padding:14px;

    background:#080c11;

    border:1px solid #303b47;

    border-radius:9px;

    color:#61dafb;

    font-family:monospace;

    word-break:break-all;
}

.small-button{
    padding:12px 15px;

    border:0;

    border-radius:9px;

    background:#26313c;

    color:#fff;
}

.stream-link{
    display:flex;

    gap:10px;

    margin-top:12px;
}

.stream-link input{
    flex:1;
}

.info{
    margin-top:10px;

    color:#808b97;

    font-size:13px;
}

.hidden{
    display:none !important;
}

.viewer-controls{
    display:flex;

    gap:10px;

    margin-top:12px;
}

.viewer-controls button{
    padding:11px 15px;

    border:0;

    border-radius:8px;

    background:#27323e;

    color:#fff;
}

#viewerPanel{
    display:none;
}

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%)
        translateY(80px);

    background:#202b35;

    padding:12px 18px;

    border-radius:9px;

    border:1px solid #34414d;

    opacity:0;

    transition:.25s;

    z-index:9999;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

@media(max-width:600px){

    main{
        padding:18px 12px;
    }

    h1{
        font-size:25px;
    }

    header{
        padding:0 14px;
    }

    .logo{
        font-size:17px;
    }

    .button-row{
        grid-template-columns:1fr;
    }

    .room-id{
        flex-direction:column;
    }

    .stream-link{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <span>●</span> LIVE STREAM
    </div>

    <div class="connection">

        <div
            id="connectionDot"
            class="dot">
        </div>

        <span id="connectionText">
            未接続
        </span>

    </div>

</header>


<main>

<h1>
    ライブ配信
</h1>

<div class="subtitle">
    WebRTCを利用したリアルタイムライブ配信
</div>


<div class="tabs">

    <button
        id="streamTab"
        class="tab active">

        📡 配信する

    </button>

    <button
        id="watchTab"
        class="tab">

        👀 視聴する

    </button>

</div>


<!-- ================================
     配信者
================================ -->

<section
    id="streamPanel"
    class="panel">

    <div class="panel-title">
        📡 配信者画面
    </div>


    <div class="video-box">

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

        <div
            id="localLive"
            class="live">

            LIVE

        </div>

    </div>


    <div
        id="streamStatus"
        class="status-message">

        カメラとマイクを準備してください。

    </div>


    <div class="controls">

        <div>

            <label>
                カメラ
            </label>

            <select
                id="camera">

            </select>

        </div>


        <div>

            <label>
                マイク
            </label>

            <select
                id="microphone">

            </select>

        </div>

    </div>


    <div class="button-row">

        <button
            id="start"
            class="main-button">

            🔴 配信開始

        </button>

        <button
            id="stop"
            class="main-button stop"
            disabled>

            ⏹ 配信停止

        </button>

    </div>


    <div
        id="roomArea"
        class="room hidden">

        <label>
            あなたの配信用ID
        </label>

        <div class="room-id">

            <div id="myId">
                -
            </div>

            <button
                id="copyId"
                class="small-button">

                コピー

            </button>

        </div>


        <div class="stream-link">

            <input
                id="shareUrl"
                readonly>

            <button
                id="copyUrl"
                class="small-button">

                URLコピー

            </button>

        </div>


        <div class="info">

            このIDまたはURLを視聴者に送ってください。

        </div>

    </div>

</section>


<!-- ================================
     視聴者
================================ -->

<section
    id="watchPanel"
    class="panel hidden">

    <div class="panel-title">
        👀 ライブ視聴
    </div>


    <label>
        配信用ID
    </label>

    <div class="stream-link">

        <input
            id="targetId"
            placeholder="配信用IDを入力">

        <button
            id="connect"
            class="small-button">

            接続

        </button>

    </div>


    <div
        id="watchStatus"
        class="status-message">

        配信用IDを入力してください。

    </div>

</section>


<!-- ================================
     受信映像
================================ -->

<section
    id="viewerPanel"
    class="panel">

    <div class="panel-title">
        🔴 LIVE
    </div>


    <div class="video-box">

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

        <div class="live show">
            LIVE
        </div>

    </div>


    <div class="viewer-controls">

        <button id="mute">
            🔊 音声ON
        </button>

        <button id="fullscreen">
            ⛶ 全画面
        </button>

    </div>

</section>

</main>


<div
    id="toast"
    class="toast">
</div>


<script
src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js">
</script>


<script>

/* ========================================
   WebRTC設定
======================================== */

const PEER_CONFIG = {

    host:
        "0.peerjs.com",

    port:
        443,

    path:
        "/",

    secure:
        true,

    config:{

        iceServers:[

            {
                urls:
                "stun:stun.l.google.com:19302"
            },

            {
                urls:
                "stun:stun1.l.google.com:19302"
            }

        ]

    }

};


/* ========================================
   DOM
======================================== */

const localVideo =
    document.getElementById(
        "localVideo"
    );

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const camera =
    document.getElementById(
        "camera"
    );

const microphone =
    document.getElementById(
        "microphone"
    );

const startButton =
    document.getElementById(
        "start"
    );

const stopButton =
    document.getElementById(
        "stop"
    );

const myId =
    document.getElementById(
        "myId"
    );

const roomArea =
    document.getElementById(
        "roomArea"
    );

const shareUrl =
    document.getElementById(
        "shareUrl"
    );

const targetId =
    document.getElementById(
        "targetId"
    );

const connectButton =
    document.getElementById(
        "connect"
    );

const viewerPanel =
    document.getElementById(
        "viewerPanel"
    );

const streamPanel =
    document.getElementById(
        "streamPanel"
    );

const watchPanel =
    document.getElementById(
        "watchPanel"
    );

const streamTab =
    document.getElementById(
        "streamTab"
    );

const watchTab =
    document.getElementById(
        "watchTab"
    );

const streamStatus =
    document.getElementById(
        "streamStatus"
    );

const watchStatus =
    document.getElementById(
        "watchStatus"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const localLive =
    document.getElementById(
        "localLive"
    );

const muteButton =
    document.getElementById(
        "mute"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


/* ========================================
   変数
======================================== */

let peer = null;

let localStream = null;

let outgoingCalls = [];

let currentCall = null;


/* ========================================
   通知
======================================== */

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

    setTimeout(
        () => {
            element.classList.remove(
                "show"
            );
        },
        2500
    );
}


/* ========================================
   状態表示
======================================== */

function setConnection(
    text,
    live=false
){

    connectionText.textContent =
        text;

    connectionDot.classList.toggle(
        "live",
        live
    );

}


/* ========================================
   デバイス取得
======================================== */

async function loadDevices(){

    try{

        /*
         * 権限取得
         */

        const temporary =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video:true,
                    audio:true

                });


        temporary
            .getTracks()
            .forEach(
                track => track.stop()
            );


        const devices =
            await navigator
                .mediaDevices
                .enumerateDevices();


        camera.innerHTML = "";

        microphone.innerHTML = "";


        let cameras = 0;
        let microphones = 0;


        devices.forEach(
            device => {

                if(
                    device.kind ===
                    "videoinput"
                ){

                    cameras++;

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        device.deviceId;

                    option.textContent =
                        device.label ||
                        `カメラ ${cameras}`;

                    camera.appendChild(
                        option
                    );
                }


                if(
                    device.kind ===
                    "audioinput"
                ){

                    microphones++;

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        device.deviceId;

                    option.textContent =
                        device.label ||
                        `マイク ${microphones}`;

                    microphone.appendChild(
                        option
                    );
                }

            }
        );

    }catch(error){

        console.error(error);

        streamStatus.textContent =
            "カメラ・マイクの使用を許可してください。";

    }

}


/* ========================================
   Peer作成
======================================== */

function createPeer(){

    return new Peer(
        undefined,
        PEER_CONFIG
    );

}


/* ========================================
   配信開始
======================================== */

startButton.addEventListener(
    "click",
    startStreaming
);


async function startStreaming(){

    try{

        streamStatus.textContent =
            "カメラとマイクを取得しています…";


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video:{

                        deviceId:
                            camera.value
                                ? {
                                    exact:
                                    camera.value
                                }
                                : undefined,

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }

                    },

                    audio:{

                        deviceId:
                            microphone.value
                                ? {
                                    exact:
                                    microphone.value
                                }
                                : undefined

                    }

                });


        localVideo.srcObject =
            localStream;


        /*
         * Peer作成
         */

        peer =
            createPeer();


        peer.on(
            "open",
            id => {

                console.log(
                    "配信Peer ID:",
                    id
                );


                myId.textContent =
                    id;


                shareUrl.value =
                    location.origin +
                    location.pathname +
                    "?watch=" +
                    encodeURIComponent(id);


                roomArea.classList.remove(
                    "hidden"
                );


                startButton.disabled =
                    true;

                stopButton.disabled =
                    false;


                localLive.classList.add(
                    "show"
                );


                streamStatus.textContent =
                    "🔴 配信中です。視聴者の接続を待っています。";


                setConnection(
                    "LIVE配信中",
                    true
                );


                /*
                 * URLにIDを保存
                 */

                history.replaceState(
                    null,
                    "",
                    location.pathname +
                    "?watch=" +
                    encodeURIComponent(id)
                );

            }
        );


        /*
         * 視聴者からの着信
         */

        peer.on(
            "call",
            call => {

                console.log(
                    "視聴者から接続要求:",
                    call.peer
                );


                if(!localStream){

                    call.close();

                    return;
                }


                /*
                 * ★重要
                 * 配信者のStreamを返す
                 */

                call.answer(
                    localStream
                );


                outgoingCalls.push(
                    call
                );


                streamStatus.textContent =
                    "🔴 視聴者に配信しています。";


                call.on(
                    "close",
                    () => {

                        outgoingCalls =
                            outgoingCalls.filter(
                                item =>
                                    item !== call
                            );

                    }
                );

            }
        );


        peer.on(
            "disconnected",
            () => {

                setConnection(
                    "サーバー切断",
                    false
                );

            }
        );


        peer.on(
            "error",
            error => {

                console.error(
                    "Peer error:",
                    error
                );

                streamStatus.textContent =
                    "接続エラー: " +
                    error.type;

            }
        );


    }catch(error){

        console.error(error);

        streamStatus.textContent =
            "配信開始に失敗しました: " +
            error.message;

        toast(
            "カメラ・マイクを確認してください"
        );

    }

}


/* ========================================
   配信停止
======================================== */

stopButton.addEventListener(
    "click",
    stopStreaming
);


function stopStreaming(){

    outgoingCalls.forEach(
        call => {

            try{
                call.close();
            }catch(e){}

        }
    );


    outgoingCalls = [];


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        localStream = null;

    }


    if(peer){

        peer.destroy();

        peer = null;

    }


    localVideo.srcObject =
        null;


    startButton.disabled =
        false;

    stopButton.disabled =
        true;


    roomArea.classList.add(
        "hidden"
    );


    localLive.classList.remove(
        "show"
    );


    streamStatus.textContent =
        "配信を停止しました。";


    setConnection(
        "未接続",
        false
    );


    history.replaceState(
        null,
        "",
        location.pathname
    );


    toast(
        "配信を停止しました"
    );

}


/* ========================================
   視聴開始
======================================== */

connectButton.addEventListener(
    "click",
    connectToStream
);


async function connectToStream(){

    const id =
        targetId.value.trim();


    if(!id){

        toast(
            "配信用IDを入力してください"
        );

        return;

    }


    /*
     * 古い接続を終了
     */

    if(peer){

        peer.destroy();

        peer = null;

    }


    viewerPanel.style.display =
        "block";


    watchStatus.textContent =
        "配信者へ接続しています…";


    setConnection(
        "接続中",
        false
    );


    /*
     * 視聴者用Peer
     */

    peer =
        createPeer();


    peer.on(
        "open",
        viewerId => {

            console.log(
                "視聴者Peer:",
                viewerId
            );


            /*
             * ダミーのMediaStream
             *
             * 配信者へ「接続要求」を送るためだけに使用
             */

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width =
                1;

            canvas.height =
                1;


            const dummyStream =
                canvas.captureStream(1);


            /*
             * 配信者へCall
             */

            const call =
                peer.call(
                    id,
                    dummyStream
                );


            if(!call){

                watchStatus.textContent =
                    "配信者への接続に失敗しました。";

                return;

            }


            currentCall =
                call;


            /*
             * ★重要
             * 配信者から映像Streamを受信
             */

            call.on(
                "stream",
                stream => {

                    console.log(
                        "リモートStream受信:",
                        stream
                    );


                    remoteVideo.srcObject =
                        stream;


                    viewerPanel.style.display =
                        "block";


                    watchStatus.textContent =
                        "🔴 LIVE配信を視聴中";


                    setConnection(
                        "視聴中",
                        true
                    );


                    remoteVideo
                        .play()
                        .catch(
                            error => {

                                console.log(
                                    "Autoplay:",
                                    error
                                );

                            }
                        );


                    toast(
                        "ライブ配信に接続しました"
                    );

                }
            );


            call.on(
                "close",
                () => {

                    remoteVideo.srcObject =
                        null;


                    watchStatus.textContent =
                        "配信が終了しました。";


                    setConnection(
                        "配信終了",
                        false
                    );

                }
            );


            call.on(
                "error",
                error => {

                    console.error(
                        "Call error:",
                        error
                    );


                    watchStatus.textContent =
                        "映像接続エラー: " +
                        error.message;

                }
            );

        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                "Viewer Peer error:",
                error
            );


            if(
                error.type ===
                "peer-unavailable"
            ){

                watchStatus.textContent =
                    "この配信用IDの配信は見つかりません。";

            }else{

                watchStatus.textContent =
                    "接続エラー: " +
                    error.type;

            }


            setConnection(
                "接続失敗",
                false
            );

        }
    );

}


/* ========================================
   タブ
======================================== */

streamTab.addEventListener(
    "click",
    () => {

        streamTab.classList.add(
            "active"
        );

        watchTab.classList.remove(
            "active"
        );


        streamPanel.classList.remove(
            "hidden"
        );

        watchPanel.classList.add(
            "hidden"
        );

    }
);


watchTab.addEventListener(
    "click",
    () => {

        watchTab.classList.add(
            "active"
        );

        streamTab.classList.remove(
            "active"
        );


        streamPanel.classList.add(
            "hidden"
        );

        watchPanel.classList.remove(
            "hidden"
        );

    }
);


/* ========================================
   IDコピー
======================================== */

document
.getElementById("copyId")
.addEventListener(
    "click",
    async () => {

        await navigator
            .clipboard
            .writeText(
                myId.textContent
            );

        toast(
            "配信用IDをコピーしました"
        );

    }
);


/* ========================================
   URLコピー
======================================== */

document
.getElementById("copyUrl")
.addEventListener(
    "click",
    async () => {

        await navigator
            .clipboard
            .writeText(
                shareUrl.value
            );

        toast(
            "視聴URLをコピーしました"
        );

    }
);


/* ========================================
   ミュート
======================================== */

muteButton.addEventListener(
    "click",
    () => {

        remoteVideo.muted =
            !remoteVideo.muted;


        muteButton.textContent =
            remoteVideo.muted
                ? "🔇 ミュート"
                : "🔊 音声ON";

    }
);


/* ========================================
   全画面
======================================== */

fullscreenButton.addEventListener(
    "click",
    () => {

        if(
            document.fullscreenElement
        ){

            document.exitFullscreen();

        }else{

            remoteVideo
                .parentElement
                .requestFullscreen()
                .catch(
                    () => {}
                );

        }

    }
);


/* ========================================
   URLから自動視聴
======================================== */

function checkWatchUrl(){

    const params =
        new URLSearchParams(
            location.search
        );


    const id =
        params.get(
            "watch"
        );


    if(id){

        targetId.value =
            id;


        watchTab.click();


        /*
         * Peerの準備ができてから接続
         */

        setTimeout(
            () => {

                connectToStream();

            },
            500
        );

    }

}


/* ========================================
   初期化
======================================== */

async function initialize(){

    await loadDevices();

    checkWatchUrl();

}


initialize();


/* ========================================
   デバイス変更
======================================== */

navigator
    .mediaDevices
    .addEventListener(
        "devicechange",
        loadDevices
    );


/* ========================================
   ページ終了
======================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if(peer){

            peer.destroy();

        }

    }
);

</script>

</body>
</html>
