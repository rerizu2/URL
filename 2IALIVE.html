<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LIVE STREAM</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background:#0b0f14;
    color:white;
    min-height:100vh;
}

/* =========================
   ヘッダー
========================= */

header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;

    background:#111820;
    border-bottom:1px solid #27313c;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#ff1744;
}

.header-status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    color:#aaa;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#666;
}

.status-dot.live{
    background:#ff1744;
    box-shadow:0 0 10px #ff1744;
}

/* =========================
   メイン
========================= */

main{
    width:min(1200px, 100%);
    margin:auto;
    padding:25px;
}

.page-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:8px;
}

.description{
    color:#9ca7b3;
    margin-bottom:25px;
}

/* =========================
   モード
========================= */

.mode-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.mode-btn{
    flex:1;
    padding:15px;
    border:1px solid #303b47;
    border-radius:12px;
    background:#151d26;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.mode-btn:hover{
    background:#202b36;
}

.mode-btn.active{
    background:#ff1744;
    border-color:#ff1744;
}

/* =========================
   パネル
========================= */

.panel{
    background:#111820;
    border:1px solid #27313c;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

.panel-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:15px;
}

/* =========================
   動画
========================= */

.video-wrapper{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:14px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.live-badge{
    position:absolute;
    top:15px;
    left:15px;

    background:#ff1744;
    color:white;

    padding:6px 12px;
    border-radius:6px;

    font-size:13px;
    font-weight:800;

    display:none;
}

.live-badge.show{
    display:block;
}

.viewer-count{
    position:absolute;
    top:15px;
    right:15px;

    background:rgba(0,0,0,.65);
    padding:7px 12px;

    border-radius:7px;
    font-size:13px;
}

/* =========================
   コントロール
========================= */

.controls{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));

    gap:12px;
    margin-top:15px;
}

select,
input{
    width:100%;
    padding:13px;

    background:#0c1218;
    color:white;

    border:1px solid #303b47;
    border-radius:9px;

    outline:none;
}

select:focus,
input:focus{
    border-color:#ff1744;
}

button{
    border:none;
    cursor:pointer;
}

.main-button{
    width:100%;
    padding:14px;

    border-radius:9px;

    background:#ff1744;
    color:white;

    font-size:16px;
    font-weight:700;

    transition:.2s;
}

.main-button:hover{
    filter:brightness(1.12);
}

.stop-button{
    background:#343e48;
}

.stop-button:hover{
    background:#46515c;
}

/* =========================
   ID表示
========================= */

.room-box{
    display:flex;
    gap:10px;
}

.room-id{
    flex:1;

    padding:14px;

    background:#080c10;
    border:1px solid #303b47;
    border-radius:9px;

    font-family:monospace;
    font-size:17px;

    color:#61dafb;
}

.copy-button{
    padding:0 18px;

    background:#202b36;
    color:white;

    border-radius:9px;
}

.copy-button:hover{
    background:#2d3945;
}

/* =========================
   配信一覧
========================= */

.stream-list{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(240px,1fr));

    gap:15px;
}

.stream-card{
    background:#151d26;
    border:1px solid #293540;

    border-radius:13px;
    overflow:hidden;

    cursor:pointer;

    transition:.2s;
}

.stream-card:hover{
    transform:translateY(-3px);
    border-color:#ff1744;
}

.stream-thumbnail{
    aspect-ratio:16/9;
    background:#050505;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;
}

.stream-info{
    padding:13px;
}

.stream-name{
    font-weight:700;
}

.stream-status{
    margin-top:5px;
    color:#ff506d;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:35px;
    color:#78838e;
}

/* =========================
   視聴画面
========================= */

#viewerPanel{
    display:none;
}

.viewer-controls{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.small-button{
    padding:11px 16px;

    background:#202b36;
    color:white;

    border-radius:8px;
}

.small-button:hover{
    background:#2d3945;
}

.volume{
    flex:1;
}

/* =========================
   通知
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%)
        translateY(80px);

    background:#1d2730;

    border:1px solid #34414c;

    padding:12px 20px;

    border-radius:10px;

    opacity:0;

    transition:.3s;

    z-index:1000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   スマホ
========================= */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .logo{
        font-size:18px;
    }

    main{
        padding:15px;
    }

    .page-title{
        font-size:24px;
    }

    .mode-buttons{
        flex-direction:column;
    }

    .panel{
        padding:14px;
    }

    .room-box{
        flex-direction:column;
    }

    .copy-button{
        padding:13px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <span>●</span> LIVE STREAM
    </div>

    <div class="header-status">
        <div id="statusDot" class="status-dot"></div>
        <span id="connectionStatus">
            未接続
        </span>
    </div>

</header>


<main>

    <h1 class="page-title">
        ライブ配信
    </h1>

    <p class="description">
        カメラとマイクを使ってライブ配信できます。
    </p>


    <!-- モード -->

    <div class="mode-buttons">

        <button
            id="streamModeButton"
            class="mode-btn active">

            📡 配信する

        </button>

        <button
            id="watchModeButton"
            class="mode-btn">

            👀 視聴する

        </button>

    </div>


    <!-- ======================
         配信パネル
    ======================= -->

    <section
        id="streamPanel"
        class="panel">

        <div class="panel-title">
            📡 配信者
        </div>


        <div class="video-wrapper">

            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>

            <div
                id="liveBadge"
                class="live-badge">

                LIVE

            </div>

        </div>


        <div class="controls">

            <div>

                <label>
                    カメラ
                </label>

                <select id="cameraSelect">
                    <option>
                        カメラを取得中...
                    </option>
                </select>

            </div>


            <div>

                <label>
                    マイク
                </label>

                <select id="microphoneSelect">
                    <option>
                        マイクを取得中...
                    </option>
                </select>

            </div>

        </div>


        <div
            style="
            display:grid;
            grid-template-columns:
            1fr 1fr;
            gap:10px;
            margin-top:15px;
            ">

            <button
                id="startButton"
                class="main-button">

                🔴 配信開始

            </button>

            <button
                id="stopButton"
                class="main-button stop-button"
                disabled>

                ⏹ 配信停止

            </button>

        </div>


        <!-- 配信用ID -->

        <div
            id="roomArea"
            style="display:none;margin-top:20px;">

            <div
                style="
                font-weight:700;
                margin-bottom:8px;
                ">

                配信用ID

            </div>

            <div class="room-box">

                <div
                    id="roomId"
                    class="room-id">

                    -

                </div>

                <button
                    id="copyButton"
                    class="copy-button">

                    コピー

                </button>

            </div>

            <p
                style="
                color:#8995a1;
                font-size:13px;
                margin-top:8px;
                ">

                このIDを視聴者に共有してください。

            </p>

        </div>

    </section>


    <!-- ======================
         視聴パネル
    ======================= -->

    <section
        id="watchPanel"
        class="panel"
        style="display:none;">

        <div class="panel-title">
            👀 ライブ視聴
        </div>

        <div class="room-box">

            <input
                id="watchRoomId"
                placeholder="配信用IDを入力">

            <button
                id="connectButton"
                class="copy-button">

                接続

            </button>

        </div>

    </section>


    <!-- ======================
         視聴動画
    ======================= -->

    <section
        id="viewerPanel"
        class="panel">

        <div class="panel-title">

            🔴 LIVE配信

        </div>

        <div class="video-wrapper">

            <video
                id="remoteVideo"
                autoplay
                playsinline>
            </video>

            <div class="live-badge show">
                LIVE
            </div>

        </div>


        <div class="viewer-controls">

            <button
                id="muteButton"
                class="small-button">

                🔊 音声ON

            </button>

            <button
                id="fullscreenButton"
                class="small-button">

                ⛶ 全画面

            </button>

        </div>

    </section>


    <!-- ======================
         配信一覧
    ======================= -->

    <section class="panel">

        <div class="panel-title">

            🔴 現在配信中

        </div>

        <div
            id="streamList"
            class="stream-list">

            <div class="empty">

                現在配信中の配信はありません。

            </div>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast">

    コピーしました

</div>


<!-- PeerJS -->

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>


<script>

/* =========================================================
   ライブ配信システム
========================================================= */


/* -------------------------
   要素
------------------------- */

const localVideo =
    document.getElementById("localVideo");

const remoteVideo =
    document.getElementById("remoteVideo");

const cameraSelect =
    document.getElementById("cameraSelect");

const microphoneSelect =
    document.getElementById("microphoneSelect");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const roomId =
    document.getElementById("roomId");

const roomArea =
    document.getElementById("roomArea");

const copyButton =
    document.getElementById("copyButton");

const streamModeButton =
    document.getElementById("streamModeButton");

const watchModeButton =
    document.getElementById("watchModeButton");

const streamPanel =
    document.getElementById("streamPanel");

const watchPanel =
    document.getElementById("watchPanel");

const viewerPanel =
    document.getElementById("viewerPanel");

const watchRoomId =
    document.getElementById("watchRoomId");

const connectButton =
    document.getElementById("connectButton");

const muteButton =
    document.getElementById("muteButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const statusDot =
    document.getElementById("statusDot");

const connectionStatus =
    document.getElementById("connectionStatus");

const liveBadge =
    document.getElementById("liveBadge");

const streamList =
    document.getElementById("streamList");

const toast =
    document.getElementById("toast");


/* -------------------------
   変数
------------------------- */

let peer = null;

let localStream = null;

let currentPeerId = null;

let currentCalls = [];

let isStreaming = false;


/* =========================================================
   カメラ・マイク取得
========================================================= */

async function getDevices(){

    try{

        /*
         * 一度権限を取得する。
         * これによりデバイス名も取得しやすくなる。
         */

        const tempStream =
            await navigator.mediaDevices.getUserMedia({
                video:true,
                audio:true
            });

        tempStream
            .getTracks()
            .forEach(track => track.stop());


        const devices =
            await navigator.mediaDevices.enumerateDevices();


        cameraSelect.innerHTML = "";

        microphoneSelect.innerHTML = "";


        let cameraCount = 0;
        let microphoneCount = 0;


        devices.forEach(device => {

            if(device.kind === "videoinput"){

                cameraCount++;

                const option =
                    document.createElement("option");

                option.value =
                    device.deviceId;

                option.textContent =
                    device.label ||
                    `カメラ ${cameraCount}`;

                cameraSelect.appendChild(option);
            }


            if(device.kind === "audioinput"){

                microphoneCount++;

                const option =
                    document.createElement("option");

                option.value =
                    device.deviceId;

                option.textContent =
                    device.label ||
                    `マイク ${microphoneCount}`;

                microphoneSelect.appendChild(option);
            }

        });


        if(cameraCount === 0){

            cameraSelect.innerHTML =
                `<option>カメラなし</option>`;
        }


        if(microphoneCount === 0){

            microphoneSelect.innerHTML =
                `<option>マイクなし</option>`;
        }

    }catch(error){

        console.error(error);

        showToast(
            "カメラ・マイクへのアクセスが拒否されました"
        );
    }
}


/* =========================================================
   配信開始
========================================================= */

startButton.addEventListener(
    "click",
    startStreaming
);


async function startStreaming(){

    if(isStreaming){
        return;
    }


    try{

        const cameraId =
            cameraSelect.value;

        const microphoneId =
            microphoneSelect.value;


        localStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    deviceId:
                        cameraId
                            ? {exact:cameraId}
                            : undefined,

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:{
                    deviceId:
                        microphoneId
                            ? {exact:microphoneId}
                            : undefined
                }

            });


        localVideo.srcObject =
            localStream;


        /*
         * PeerJSのIDを作成
         */

        peer =
            new Peer({
                debug:2
            });


        peer.on(
            "open",
            id => {

                currentPeerId =
                    id;

                roomId.textContent =
                    id;

                roomArea.style.display =
                    "block";


                isStreaming = true;


                startButton.disabled =
                    true;

                stopButton.disabled =
                    false;


                liveBadge.classList.add(
                    "show"
                );


                statusDot.classList.add(
                    "live"
                );

                connectionStatus.textContent =
                    "LIVE配信中";


                /*
                 * ローカルストレージにも保存
                 */

                localStorage.setItem(
                    "live_peer_id",
                    id
                );


                /*
                 * 配信一覧に追加
                 */

                addStreamToList(id);


                showToast(
                    "配信を開始しました"
                );
            }
        );


        /*
         * 視聴者からの着信
         */

        peer.on(
            "call",
            call => {

                /*
                 * 配信映像を返す
                 */

                call.answer(localStream);


                currentCalls.push(
                    call
                );


                call.on(
                    "close",
                    () => {

                        currentCalls =
                            currentCalls.filter(
                                c => c !== call
                            );

                    }
                );

            }
        );


        peer.on(
            "error",
            error => {

                console.error(error);

                showToast(
                    "接続エラー: " +
                    error.type
                );
            }
        );


    }catch(error){

        console.error(error);

        showToast(
            "配信を開始できませんでした"
        );
    }
}


/* =========================================================
   配信停止
========================================================= */

stopButton.addEventListener(
    "click",
    stopStreaming
);


function stopStreaming(){

    if(localStream){

        localStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        localStream =
            null;
    }


    if(peer){

        peer.destroy();

        peer =
            null;
    }


    currentCalls =
        [];


    localVideo.srcObject =
        null;


    isStreaming =
        false;


    startButton.disabled =
        false;

    stopButton.disabled =
        true;


    roomArea.style.display =
        "none";


    liveBadge.classList.remove(
        "show"
    );


    statusDot.classList.remove(
        "live"
    );

    connectionStatus.textContent =
        "未接続";


    /*
     * 配信一覧から削除
     */

    removeStreamFromList();


    showToast(
        "配信を停止しました"
    );
}


/* =========================================================
   視聴
========================================================= */

connectButton.addEventListener(
    "click",
    connectToStream
);


function connectToStream(){

    const id =
        watchRoomId.value.trim();


    if(!id){

        showToast(
            "配信用IDを入力してください"
        );

        return;
    }


    if(id === currentPeerId){

        showToast(
            "自分の配信には接続できません"
        );

        return;
    }


    /*
     * 視聴者側のPeerを作る
     */

    if(peer){

        peer.destroy();
    }


    peer =
        new Peer();


    peer.on(
        "open",
        viewerPeerId => {

            /*
             * 音声なしのダミーStreamを
             * 発信側へ渡す。
             */

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width =
                1;

            canvas.height =
                1;


            const canvasStream =
                canvas.captureStream(1);


            /*
             * 音声・映像の受信だけを目的に
             * callする
             */

            const call =
                peer.call(
                    id,
                    canvasStream
                );


            if(!call){

                showToast(
                    "配信が見つかりません"
                );

                return;
            }


            call.on(
                "stream",
                remoteStream => {

                    remoteVideo.srcObject =
                        remoteStream;

                    viewerPanel.style.display =
                        "block";


                    statusDot.classList.add(
                        "live"
                    );

                    connectionStatus.textContent =
                        "視聴中";


                    remoteVideo.play()
                        .catch(() => {});


                    showToast(
                        "ライブ配信に接続しました"
                    );
                }
            );


            call.on(
                "close",
                () => {

                    remoteVideo.srcObject =
                        null;

                    viewerPanel.style.display =
                        "none";

                    showToast(
                        "配信が終了しました"
                    );
                }
            );


            call.on(
                "error",
                error => {

                    console.error(error);

                    showToast(
                        "視聴接続に失敗しました"
                    );
                }
            );

        }
    );


    peer.on(
        "error",
        error => {

            console.error(error);

            if(
                error.type ===
                "peer-unavailable"
            ){

                showToast(
                    "この配信は見つかりません"
                );

            }else{

                showToast(
                    "接続エラー"
                );
            }
        }
    );
}


/* =========================================================
   モード切り替え
========================================================= */

streamModeButton.addEventListener(
    "click",
    () => {

        streamModeButton.classList.add(
            "active"
        );

        watchModeButton.classList.remove(
            "active"
        );

        streamPanel.style.display =
            "block";

        watchPanel.style.display =
            "none";

    }
);


watchModeButton.addEventListener(
    "click",
    () => {

        watchModeButton.classList.add(
            "active"
        );

        streamModeButton.classList.remove(
            "active"
        );

        streamPanel.style.display =
            "none";

        watchPanel.style.display =
            "block";

    }
);


/* =========================================================
   コピー
========================================================= */

copyButton.addEventListener(
    "click",
    async () => {

        if(!currentPeerId){
            return;
        }


        try{

            await navigator.clipboard.writeText(
                currentPeerId
            );

            showToast(
                "配信用IDをコピーしました"
            );

        }catch(error){

            showToast(
                "コピーできませんでした"
            );
        }

    }
);


/* =========================================================
   ミュート
========================================================= */

muteButton.addEventListener(
    "click",
    () => {

        remoteVideo.muted =
            !remoteVideo.muted;


        if(remoteVideo.muted){

            muteButton.textContent =
                "🔇 ミュート";

        }else{

            muteButton.textContent =
                "🔊 音声ON";
        }

    }
);


/* =========================================================
   全画面
========================================================= */

fullscreenButton.addEventListener(
    "click",
    () => {

        const wrapper =
            remoteVideo.parentElement;


        if(
            document.fullscreenElement
        ){

            document.exitFullscreen();

        }else{

            wrapper.requestFullscreen()
                .catch(() => {});
        }

    }
);


/* =========================================================
   配信一覧
=========================================================

PeerJS単体では「全世界の配信者一覧」を
サーバーから取得する機能はありません。

ここでは、このブラウザ内で作成した配信を
一覧表示する簡易機能を用意しています。

複数端末で共通の配信一覧にする場合は、
次の段階でFirebase等のデータベースを追加します。
========================================================= */

function addStreamToList(id){

    streamList.innerHTML = "";


    const card =
        document.createElement("div");

    card.className =
        "stream-card";


    card.innerHTML = `

        <div class="stream-thumbnail">
            📡
        </div>

        <div class="stream-info">

            <div class="stream-name">
                LIVE配信
            </div>

            <div class="stream-status">
                🔴 配信中
            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        () => {

            watchModeButton.click();

            watchRoomId.value =
                id;

            connectToStream();

        }
    );


    streamList.appendChild(
        card
    );
}


function removeStreamFromList(){

    streamList.innerHTML = `

        <div class="empty">

            現在配信中の配信はありません。

        </div>

    `;
}


/* =========================================================
   通知
========================================================= */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );
}


/* =========================================================
   デバイス変更
========================================================= */

navigator.mediaDevices
    .addEventListener(
        "devicechange",
        getDevices
    );


/* =========================================================
   初期化
========================================================= */

getDevices();


/* =========================================================
   ページ終了時
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        if(peer){

            peer.destroy();
        }

    }
);

</script>

</body>
</html>
