<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webライバー配信プラットフォーム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- ★ここに取得したGASのウェブアプリURLを貼り付けてください -->
    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx3ws_iV8v2LV54gpGqDm35AxNOb3pU5cBtzBAW8l2KbqBugEsdZn1WOq7KnnDSJ3g4ZA/exec";
    </script>

    <!-- ヘッダー -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('home')">
                <div class="bg-red-600 text-white p-2 rounded-xl flex items-center justify-center shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-tower-broadcast animate-pulse"></i>
                </div>
                <span class="font-bold text-xl tracking-wider bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">LiveStream Hub</span>
            </div>
            <nav class="flex space-x-2">
                <button onclick="switchView('home')" id="nav-home" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-white transition">ホーム</button>
                <button onclick="switchView('browse')" id="nav-browse" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition">ライブ一覧</button>
                <button onclick="switchView('streamer')" id="nav-streamer" class="px-4 py-2 rounded-lg text-sm font-medium bg-red-600 hover:bg-red-500 text-white transition shadow-lg shadow-red-600/20"><i class="fa-solid fa-video mr-1"></i>配信する</button>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- ホームビュー -->
        <section id="view-home" class="space-y-12">
            <div class="text-center py-16 bg-gradient-to-b from-slate-900 to-slate-950 rounded-3xl border border-slate-800/80 p-8 shadow-2xl relative overflow-hidden">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(239,68,68,0.08)_0,transparent_70%)]"></div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 text-white">スプレッドシート連携型、<span class="text-red-500">ライブ配信</span>。</h1>
                <p class="text-slate-400 max-w-2xl mx-auto mb-8 text-sm md:text-base">一覧からIDやタイトルを確認し、カードをクリックするだけで自動で配信を視聴できます。</p>
                <div class="flex justify-center gap-4">
                    <button onclick="switchView('browse')" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold transition flex items-center border border-slate-700">
                        <i class="fa-solid fa-compass mr-2 text-red-500"></i>配信を探す
                    </button>
                    <button onclick="switchView('streamer')" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold transition flex items-center shadow-lg shadow-red-600/30">
                        <i class="fa-solid fa-video mr-2"></i>今すぐ配信する
                    </button>
                </div>
            </div>
        </section>

        <!-- 配信一覧ビュー -->
        <section id="view-browse" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-white flex items-center"><i class="fa-solid fa-fire text-red-500 mr-2"></i>配信中のライブ一覧</h2>
                    <p class="text-xs text-slate-400 mt-1">スプレッドシートに登録されているIDと配信タイトルの一覧です。</p>
                </div>
                <button onclick="renderStreamsList()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center border border-slate-700">
                    <i class="fa-solid fa-rotate mr-1.5"></i>更新
                </button>
            </div>
            <div id="streams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 動的に生成されます -->
            </div>
            <div id="no-streams" class="hidden text-center py-20 text-slate-500">
                <i class="fa-solid fa-video-slash text-4xl mb-3"></i>
                <p>現在配信中のルームはありません。</p>
            </div>
        </section>

        <!-- 配信者ビュー -->
        <section id="view-streamer" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <div class="relative bg-black rounded-2xl overflow-hidden aspect-video border border-slate-800 shadow-2xl flex items-center justify-center">
                    <video id="self-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                    <div id="streamer-offline" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-sm">
                        <i class="fa-solid fa-video text-slate-600 text-5xl mb-3"></i>
                        <p class="text-slate-400 text-sm">配信はまだ開始されていません</p>
                    </div>
                    <div class="absolute top-4 left-4 bg-red-600/90 text-white text-xs font-bold px-3 py-1 rounded-full flex items-center hidden" id="live-badge">
                        <span class="w-2 h-2 bg-white rounded-full animate-ping mr-1.5"></span>LIVE
                    </div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                    <div class="flex flex-wrap gap-4 items-center justify-between">
                        <div class="w-full md:w-auto flex-1">
                            <label class="text-xs text-slate-400 block mb-1">配信タイトル・内容</label>
                            <input type="text" id="stream-title-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-red-500" placeholder="例：プログラミングの作業配信！">
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            <button id="btn-toggle-cam" onclick="toggleCamera()" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="カメラON/OFF"><i class="fa-solid fa-camera"></i></button>
                            <button id="btn-toggle-mic" onclick="toggleMic()" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="マイクON/OFF"><i class="fa-solid fa-microphone"></i></button>
                            <button id="btn-start-stream" onclick="startBroadcasting()" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition shadow-lg shadow-red-600/20">配信開始</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- チャット欄 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col h-[500px] lg:h-auto">
                <h3 class="font-bold text-sm text-slate-300 pb-3 border-b border-slate-800 flex items-center">
                    <i class="fa-solid fa-comments text-red-500 mr-2"></i>ライブチャット (<span id="viewer-count">0</span>人視聴中)
                </h3>
                <div id="streamer-chat-messages" class="flex-1 overflow-y-auto py-3 space-y-3 text-xs">
                    <div class="text-slate-500 text-center italic">視聴者の接続待ち...</div>
                </div>
            </div>
        </section>

        <!-- 視聴者ビュー -->
        <section id="view-viewer" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <div class="relative bg-black rounded-2xl overflow-hidden aspect-video border border-slate-800 shadow-2xl flex items-center justify-center">
                    <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                    <div id="viewer-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90">
                        <i class="fa-solid fa-circle-notch fa-spin text-red-500 text-4xl mb-3"></i>
                        <p class="text-slate-300 text-sm">配信に接続しています...</p>
                    </div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                    <div>
                        <h2 id="viewer-stream-title" class="text-lg font-bold text-white">ライブ配信</h2>
                        <p class="text-xs text-slate-400 mt-0.5">ルームID: <span id="viewer-peer-id-display" class="font-mono text-slate-300"></span></p>
                    </div>
                    <button onclick="switchView('browse')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl transition">一覧に戻る</button>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col h-[500px] lg:h-auto">
                <h3 class="font-bold text-sm text-slate-300 pb-3 border-b border-slate-800 flex items-center">
                    <i class="fa-solid fa-comments text-red-500 mr-2"></i>ライブチャット
                </h3>
                <div id="viewer-chat-messages" class="flex-1 overflow-y-auto py-3 space-y-3 text-xs"></div>
                <div class="pt-3 border-t border-slate-800 flex gap-2">
                    <input type="text" id="chat-input" placeholder="コメントを入力..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500" onkeypress="if(event.key==='Enter')sendChat()">
                    <button onclick="sendChat()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

    </main>

    <!-- アプリケーション制御スクリプト -->
    <script>
        let peer = null, localStream = null, activeCall = null;
        let connections = [];
        let activeViewersCount = 0;
        let chatConnsAsViewer = null;
        let currentPeerId = null;
        let isCamOn = true, isMicOn = true;

        function switchView(viewName) {
            ['home', 'browse', 'streamer', 'viewer'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
            });
            ['home', 'browse', 'streamer'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if(btn) {
                    btn.className = v === viewName 
                        ? "px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-white transition"
                        : "px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition";
                }
            });

            document.getElementById(`view-${viewName}`).classList.remove('hidden');

            if(viewName !== 'streamer' && localStream) {
                stopBroadcastingInternal();
            }
            if(viewName !== 'viewer' && activeCall) {
                activeCall.close();
                activeCall = null;
            }
            if(viewName === 'browse') {
                renderStreamsList();
            }
        }

        // --- 配信者機能 ---
        async function startBroadcasting() {
            const title = document.getElementById('stream-title-input').value.trim() || '無題のライブ配信';
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('self-video').srcObject = localStream;
                document.getElementById('streamer-offline').classList.add('hidden');
                document.getElementById('live-badge').classList.remove('hidden');
                document.getElementById('btn-start-stream').innerText = "配信終了";
                document.getElementById('btn-start-stream').setAttribute('onclick', "stopBroadcasting()");

                peer = new Peer();
                peer.on('open', async (id) => {
                    currentPeerId = id;
                    // スプレッドシートに配信情報を登録
                    await fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'add', id: id, title: title })
                    });
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                    activeCall = call;
                });

                peer.on('connection', (conn) => {
                    connections.push(conn);
                    activeViewersCount++;
                    updateViewerCount();

                    conn.on('data', (data) => {
                        appendChat('streamer-chat-messages', data.sender, data.text);
                        connections.forEach(c => {
                            if(c !== conn && c.open) c.send(data);
                        });
                    });

                    conn.on('close', () => {
                        connections = connections.filter(c => c !== conn);
                        activeViewersCount = Math.max(0, activeViewersCount - 1);
                        updateViewerCount();
                    });
                });

            } catch (err) {
                console.error(err);
                alert('カメラまたはマイクの取得に失敗しました。');
            }
        }

        async function stopBroadcasting() {
            if(currentPeerId) {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'remove', id: currentPeerId })
                });
            }
            stopBroadcastingInternal();
            switchView('home');
        }

        function stopBroadcastingInternal() {
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if(peer) {
                peer.destroy();
                peer = null;
            }
            currentPeerId = null;
            connections = [];
            activeViewersCount = 0;
            updateViewerCount();
            document.getElementById('self-video').srcObject = null;
            document.getElementById('streamer-offline').classList.remove('hidden');
            document.getElementById('live-badge').classList.add('hidden');
            document.getElementById('btn-start-stream').innerText = "配信開始";
            document.getElementById('btn-start-stream').setAttribute('onclick', "startBroadcasting()");
        }

        function updateViewerCount() {
            document.getElementById('viewer-count').innerText = activeViewersCount;
        }

        function toggleCamera() {
            if(!localStream) return;
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            document.getElementById('btn-toggle-cam').className = isCamOn ? "p-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" : "p-3 bg-red-600 text-white rounded-xl transition";
        }

        function toggleMic() {
            if(!localStream) return;
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            document.getElementById('btn-toggle-mic').className = isMicOn ? "p-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" : "p-3 bg-red-600 text-white rounded-xl transition";
        }

        // --- 閲覧・一覧機能 (スプレッドシートから取得) ---
        async function renderStreamsList() {
            const grid = document.getElementById('streams-grid');
            const noStreams = document.getElementById('no-streams');
            grid.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i> 読み込み中...</div>';

            try {
                const response = await fetch(GAS_API_URL);
                const streams = await response.json();
                
                grid.innerHTML = '';
                if(!streams || streams.length === 0) {
                    noStreams.classList.remove('hidden');
                    return;
                }
                noStreams.classList.add('hidden');

                streams.forEach(stream => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition flex flex-col group cursor-pointer shadow-lg";
                    card.setAttribute('onclick', `joinStream('${escapeHtml(stream.id)}', '${escapeHtml(stream.title)}')`);
                    card.innerHTML = `
                        <div class="aspect-video bg-slate-950 relative flex items-center justify-center overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 to-transparent z-10"></div>
                            <i class="fa-solid fa-play text-red-500 text-3xl group-hover:scale-110 transition duration-300 z-20"></i>
                            <span class="absolute top-3 left-3 bg-red-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full z-20 flex items-center">
                                <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping mr-1"></span>LIVE
                            </span>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                            <h3 class="font-bold text-sm text-white line-clamp-1">${escapeHtml(stream.title)}</h3>
                            <div class="text-[11px] text-slate-400 bg-slate-950 p-2 rounded-lg border border-slate-800/80 flex items-center justify-between">
                                <span class="text-slate-500">ID:</span>
                                <span class="font-mono text-slate-300 truncate ml-1 max-w-[180px]">${escapeHtml(stream.id)}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                console.error(e);
                grid.innerHTML = '<div class="col-span-full text-center text-red-400 text-xs">配信リストの取得に失敗しました。GASのURLを確認してください。</div>';
            }
        }

        // --- 視聴者機能 ---
        function joinStream(peerId, title) {
            switchView('viewer');
            document.getElementById('viewer-stream-title').innerText = title;
            document.getElementById('viewer-peer-id-display').innerText = peerId;
            document.getElementById('viewer-loading').classList.remove('hidden');
            document.getElementById('viewer-chat-messages').innerHTML = '';

            peer = new Peer();
            peer.on('open', () => {
                const call = peer.call(peerId, new MediaStream());
                activeCall = call;

                call.on('stream', (remoteStream) => {
                    const videoEl = document.getElementById('remote-video');
                    videoEl.srcObject = remoteStream;
                    document.getElementById('viewer-loading').classList.add('hidden');
                });

                chatConnsAsViewer = peer.connect(peerId);
                chatConnsAsViewer.on('data', (data) => {
                    appendChat('viewer-chat-messages', data.sender, data.text);
                });
            });
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg || !chatConnsAsViewer) return;

            const chatData = { sender: '視聴者', text: msg };
            chatConnsAsViewer.send(chatData);
            appendChat('viewer-chat-messages', 'あなた', msg, true);
            input.value = '';
        }

        function appendChat(containerId, sender, text, isMe = false) {
            const container = document.getElementById(containerId);
            if(!container) return;
            const div = document.createElement('div');
            div.className = "flex flex-col";
            div.innerHTML = `
                <span class="text-[10px] text-slate-500 mb-0.5">${escapeHtml(sender)}</span>
                <div class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-xl max-w-[85%] break-words ${isMe ? 'bg-red-600/30 border border-red-600/40 text-white self-end' : ''}">${escapeHtml(text)}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/[&'`"<>]/g, (match) => ({
                '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '"': '&quot;', '<': '&lt;', '>': '&gt;'
            })[match]);
        }
    </script>
</body>
</html>
