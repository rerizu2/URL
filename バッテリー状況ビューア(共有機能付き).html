<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バッテリー状況</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --sub-text: #6e6e73;
    --accent: #34c759;
    --accent-charging: #ffd60a;
    --border: #d2d2d7;
    --danger: #ff3b30;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --sub-text: #a1a1a6;
      --accent: #32d74b;
      --accent-charging: #ffd60a;
      --border: #3a3a3c;
      --danger: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 24px;
    color: var(--sub-text);
  }
  .battery-icon-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }
  .battery-shell {
    width: 120px;
    height: 56px;
    border: 3px solid var(--text);
    border-radius: 8px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
  }
  .battery-shell::after {
    content: "";
    position: absolute;
    right: -9px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 20px;
    background: var(--text);
    border-radius: 0 3px 3px 0;
  }
  .battery-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.4s ease, background 0.4s ease;
    width: 0%;
  }
  .bolt {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 28px;
    height: 28px;
    display: none;
  }
  .bolt svg { width: 100%; height: 100%; }
  .bolt.show { display: block; }
  .level {
    font-size: 48px;
    font-weight: 700;
    margin: 8px 0 4px;
  }
  .status-line {
    font-size: 15px;
    color: var(--sub-text);
    margin-bottom: 20px;
  }
  .status-line.charging { color: #b58900; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .status-line.charging { color: var(--accent-charging); }
  }
  .details {
    text-align: left;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 0;
  }
  .detail-row .label { color: var(--sub-text); }
  .detail-row .value { font-weight: 600; }
  .unsupported {
    font-size: 14px;
    color: var(--sub-text);
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>このデバイスのバッテリー</h1>
    <div id="supported-view" style="display:none;">
      <div class="battery-icon-wrap">
        <div class="battery-shell">
          <div class="battery-fill" id="batteryFill"></div>
        </div>
        <div class="bolt" id="chargingBolt">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#ffffff" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="level" id="levelText">--%</div>
      <div class="status-line" id="statusText">取得中...</div>
      <div class="details">
        <div class="detail-row">
          <span class="label">充電時間の目安</span>
          <span class="value" id="chargingTimeText">—</span>
        </div>
        <div class="detail-row">
          <span class="label">使用可能時間の目安</span>
          <span class="value" id="dischargingTimeText">—</span>
        </div>
      </div>
    </div>
    <div id="unsupported-view" class="unsupported" style="display:none;">
      お使いのブラウザは Battery Status API に対応していません。<br>
      (iOS/Safariでは利用できません。Chromeの一部環境などでのみ利用できる場合があります)
    </div>
  </div>

<script>
function formatSeconds(sec) {
  if (sec === Infinity || sec == null || isNaN(sec)) return "—";
  if (sec === 0) return "0秒";
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}時間${m}分`;
  return `${m}分`;
}

function initBatteryUI(battery) {
  document.getElementById('supported-view').style.display = 'block';

  const fillEl = document.getElementById('batteryFill');
  const boltEl = document.getElementById('chargingBolt');
  const levelEl = document.getElementById('levelText');
  const statusEl = document.getElementById('statusText');
  const chargingTimeEl = document.getElementById('chargingTimeText');
  const dischargingTimeEl = document.getElementById('dischargingTimeText');

  function colorForLevel(pct, charging) {
    if (charging) return getComputedStyle(document.documentElement).getPropertyValue('--accent-charging');
    if (pct <= 20) return getComputedStyle(document.documentElement).getPropertyValue('--danger');
    return getComputedStyle(document.documentElement).getPropertyValue('--accent');
  }

  function updateAllBatteryInfo() {
    updateChargeInfo();
    updateLevelInfo();
    updateChargingInfo();
    updateDischargingInfo();
  }

  function updateChargeInfo() {
    const charging = battery.charging;
    boltEl.classList.toggle('show', charging);
    statusEl.textContent = charging ? '充電中' : '放電中';
    statusEl.classList.toggle('charging', charging);
  }

  function updateLevelInfo() {
    const pct = Math.round(battery.level * 100);
    levelEl.textContent = `${pct}%`;
    fillEl.style.width = `${pct}%`;
    fillEl.style.background = colorForLevel(pct, battery.charging);
  }

  function updateChargingInfo() {
    chargingTimeEl.textContent = battery.charging
      ? formatSeconds(battery.chargingTime)
      : '—';
  }

  function updateDischargingInfo() {
    dischargingTimeEl.textContent = !battery.charging
      ? formatSeconds(battery.dischargingTime)
      : '—';
  }

  updateAllBatteryInfo();

  battery.addEventListener('chargingchange', updateChargeInfo);
  battery.addEventListener('levelchange', updateLevelInfo);
  battery.addEventListener('chargingtimechange', updateChargingInfo);
  battery.addEventListener('dischargingtimechange', updateDischargingInfo);
}

if ('getBattery' in navigator) {
  navigator.getBattery().then(initBatteryUI).catch(() => {
    document.getElementById('unsupported-view').style.display = 'block';
  });
} else {
  document.getElementById('unsupported-view').style.display = 'block';
}
</script>
</body>
</html>
