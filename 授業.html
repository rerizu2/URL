<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>授業支援システム - 結果共有・同期版</title>
    <style>
        :root {
            --teacher-color: #2c3e50;
            --student-color: #27ae60;
            --bg: #f4f7f6;
            --accent: #3498db;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: var(--bg); color: #333; }
        
        /* 入室画面 */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--teacher-color); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .setup-box { background: white; color: #333; padding: 30px; border-radius: 15px; text-align: center; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .setup-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1.1rem; }

        /* メイン画面 */
        #main-content { display: none; flex-direction: column; height: 100vh; }
        header { padding: 12px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .teacher-mode { background: var(--teacher-color); }
        .student-mode { background: var(--student-color); }

        .container { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px; flex-grow: 1; overflow-y: auto; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        .only-teacher, .only-student { display: none; }
        body.is-teacher .only-teacher { display: block; }
        body.is-student .only-student { display: block; }

        /* アンケートUI */
        .survey-card { border: 2px solid var(--accent); padding: 15px; border-radius: 10px; background: #f0f8ff; margin-bottom: 20px; }
        .option-label { display: block; padding: 12px; background: white; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .option-label:hover { background: #eef; }
        
        /* グラフ表示 */
        .result-item { margin-bottom: 12px; }
        .bar-container { background: #eee; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 4px; position: relative; }
        .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .bar-text { position: absolute; right: 8px; top: 0; font-size: 0.75rem; line-height: 20px; color: #555; }
        
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; background: var(--accent); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-green { background: #27ae60; }
        .btn-red { background: #e74c3c; }

        #timer-display { font-size: 3.5rem; font-weight: bold; text-align: center; color: #e74c3c; margin: 10px 0; font-family: monospace; }
        textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
    </style>
</head>
<body>

<!-- 入室画面 -->
<div id="setup-screen">
    <div class="setup-box">
        <h2>授業用ルーム</h2>
        <input type="text" id="input-room-id" placeholder="ルームID (例: math101)">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button onclick="joinClass('teacher')" style="flex:1; background: var(--teacher-color);">教員用</button>
            <button onclick="joinClass('student')" style="flex:1; background: var(--student-color);">生徒用</button>
        </div>
    </div>
</div>

<!-- メイン画面 -->
<div id="main-content">
    <header id="header">
        <div>
            <span id="display-role" style="font-weight: bold; padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.2);">Mode</span>
            <span style="margin-left:10px;">Room: <b id="display-room-id">---</b></span>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <main class="container">
        <div class="left-col">
            <!-- 教員：アンケート作成エリア -->
            <div class="panel only-teacher">
                <h3 style="margin-top:0;">📊 アンケート配信設定</h3>
                <label>形式：</label>
                <select id="survey-type" onchange="document.getElementById('opt-area').style.display = (this.value==='text'?'none':'block')">
                    <option value="single">単一選択（ラジオ）</option>
                    <option value="multiple">複数選択（チェックボックス）</option>
                    <option value="text">自由記述（テキスト）</option>
                </select>
                <input type="text" id="survey-q" placeholder="質問を入力" style="width:100%; margin:10px 0; padding:10px;">
                <div id="opt-area">
                    <textarea id="survey-options" placeholder="選択肢を改行で入力してください" rows="3"></textarea>
                </div>
                <div style="margin-top:10px; display: flex; gap: 5px;">
                    <button onclick="broadcastSurvey()" class="btn-green">アンケート配信開始</button>
                    <button onclick="resetAll()" class="btn-red">リセット</button>
                </div>
            </div>

            <!-- 生徒：アンケート回答エリア -->
            <div class="panel only-student" id="student-survey-panel">
                <div id="no-survey-msg" style="color: #666; text-align: center; padding: 20px;">現在、配信中のアンケートはありません。</div>
                <div id="survey-ui" class="survey-card" style="display:none;">
                    <h3 id="ui-q" style="margin-top: 0;">質問</h3>
                    <div id="ui-options"></div>
                    <button id="ui-submit" onclick="sendVote()" style="width:100%; margin-top:10px; height: 50px; font-size: 1.1rem;">回答を送信</button>
                </div>
            </div>

            <!-- 全員共通：リアルタイム結果共有エリア -->
            <div class="panel" id="results-panel" style="display:none; border: 2px solid #ddd;">
                <h3 style="margin-top:0; color: var(--accent);">📈 クラス全体の回答状況</h3>
                <p>総回答数: <span id="res-total" style="font-weight:bold; font-size: 1.2rem;">0</span></p>
                <div id="res-graph"></div>
                <div id="res-texts-container" style="display:none;">
                    <strong>自由記述の回答一覧:</strong>
                    <ul id="res-texts" style="background:#f9f9f9; padding:10px; border-radius:5px; max-height:250px; overflow-y:auto; list-style: none;"></ul>
                </div>
            </div>

            <!-- 生徒：メモ帳 -->
            <div class="panel only-student">
                <h3>📝 授業ノート (自動保存されます)</h3>
                <textarea id="my-note" rows="10" placeholder="授業のメモをここに取ってください..."></textarea>
            </div>
        </div>

        <aside class="right-col">
            <!-- タイマーパネル -->
            <div class="panel">
                <h3 style="margin-top:0;">⏰ 残り時間</h3>
                <div id="timer-display">00:00</div>
                <div class="only-teacher" style="display: flex; gap: 5px;">
                    <input type="number" id="timer-min" value="45" style="width:70px; padding: 8px;">
                    <button onclick="emitTimer()" style="flex:1;">タイマー開始</button>
                </div>
            </div>

            <!-- 連絡ボード -->
            <div class="panel">
                <div id="board" style="background:#fff9c4; padding:15px; border-left:5px solid #f1c40f; border-radius: 4px;">
                    <strong style="display:block; margin-bottom:5px;">📢 先生からの連絡:</strong>
                    <span id="board-text">まだ連絡はありません。</span>
                </div>
                <div class="only-teacher" style="margin-top:10px;">
                    <input type="text" id="board-input" placeholder="連絡事項を入力..." style="width:100%; margin-bottom:5px;">
                    <button onclick="emitMsg()" style="width:100%;">全体に送信</button>
                </div>
            </div>
        </aside>
    </main>
</div>

<script>
    let channel;
    let role = '';
    let roomID = '';
    let surveyData = { active:false, type:'', question:'', options:[], votes:[], texts:[], total:0 };
    let timerInterval;

    // --- 入室処理 ---
    function joinClass(selectedRole) {
        roomID = document.getElementById('input-room-id').value.trim();
        if(!roomID) return alert("ルームIDを入力してください");
        
        role = selectedRole;
        document.body.classList.add(role === 'teacher' ? 'is-teacher' : 'is-student');
        document.getElementById('header').classList.add(role + '-mode');
        document.getElementById('display-role').innerText = role === 'teacher' ? "教員モード" : "生徒モード";
        document.getElementById('display-room-id').innerText = roomID;
        
        // チャンネル名にルームIDを付与
        channel = new BroadcastChannel('sync_room_' + roomID);
        channel.onmessage = handleMessage;

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'flex';

        if(role === 'student') {
            document.getElementById('my-note').value = localStorage.getItem('note_'+roomID) || '';
            document.getElementById('my-note').oninput = (e) => localStorage.setItem('note_'+roomID, e.target.value);
        }
    }

    // --- 通信ハンドラ ---
    function handleMessage(e) {
        const { action, data, text, index, endTime } = e.data;

        switch(action) {
            case 'SURVEY_START':
                surveyData = data;
                if(role === 'student') setupStudentSurveyUI();
                renderResultsArea(); // 生徒画面でも結果エリアを表示
                break;
            
            case 'SUBMIT_VOTE':
                if(role === 'teacher') {
                    // 教員側で集計
                    surveyData.total++;
                    if(surveyData.type === 'text') surveyData.texts.push(text);
                    else {
                        if(Array.isArray(index)) index.forEach(i => surveyData.votes[i]++);
                        else surveyData.votes[index]++;
                    }
                    // 集計した結果を「全員」に同期配信
                    channel.postMessage({ action: 'SYNC_RESULTS', data: surveyData });
                    renderResultsArea();
                }
                break;

            case 'SYNC_RESULTS':
                // 教員から届いた最新の集計データを上書き
                surveyData = data;
                renderResultsArea();
                break;

            case 'TIMER_START':
                startCountdown(endTime);
                break;

            case 'MSG':
                document.getElementById('board-text').innerText = text;
                break;

            case 'RESET':
                location.reload();
                break;
        }
    }

    // --- アンケート機能 ---
    function broadcastSurvey() {
        const q = document.getElementById('survey-q').value;
        const type = document.getElementById('survey-type').value;
        const opts = document.getElementById('survey-options').value.split('\n').filter(v => v.trim() !== "");
        
        if(!q) return alert("質問を入力してください");

        surveyData = { active:true, type, question:q, options:opts, votes:new Array(opts.length).fill(0), texts:[], total:0 };
        channel.postMessage({ action: 'SURVEY_START', data: surveyData });
        renderResultsArea();
    }

    function setupStudentSurveyUI() {
        document.getElementById('no-survey-msg').style.display = 'none';
        const ui = document.getElementById('survey-ui');
        ui.style.display = 'block';
        document.getElementById('ui-q').innerText = surveyData.question;
        const optDiv = document.getElementById('ui-options');
        optDiv.innerHTML = '';

        if(surveyData.type === 'text') {
            optDiv.innerHTML = `<textarea id="ans-text" rows="3" placeholder="ここに回答を入力してください"></textarea>`;
        } else {
            surveyData.options.forEach((opt, i) => {
                const itype = surveyData.type === 'single' ? 'radio' : 'checkbox';
                optDiv.innerHTML += `
                    <label class="option-label">
                        <input type="${itype}" name="ans" value="${i}"> ${opt}
                    </label>`;
            });
        }
        document.getElementById('ui-submit').disabled = false;
        document.getElementById('ui-submit').innerText = "回答を送信";
    }

    function sendVote() {
        let payload = { action: 'SUBMIT_VOTE' };
        if(surveyData.type === 'text') {
            payload.text = document.getElementById('ans-text').value;
            if(!payload.text) return;
        } else {
            const checks = document.querySelectorAll('input[name="ans"]:checked');
            if(checks.length === 0) return alert("選択してください");
            const vals = Array.from(checks).map(c => parseInt(c.value));
            payload.index = surveyData.type === 'single' ? vals[0] : vals;
        }
        channel.postMessage(payload);
        document.getElementById('ui-submit').disabled = true;
        document.getElementById('ui-submit').innerText = "送信完了（集計反映待ち）";
    }

    // アンケート結果の描画 (教員・生徒共通)
    function renderResultsArea() {
        if(!surveyData.active) return;
        
        const resPanel = document.getElementById('results-panel');
        resPanel.style.display = 'block';
        document.getElementById('res-total').innerText = surveyData.total;
        
        const gArea = document.getElementById('res-graph');
        const tAreaContainer = document.getElementById('res-texts-container');
        const tAreaList = document.getElementById('res-texts');

        if(surveyData.type === 'text') {
            gArea.style.display = 'none';
            tAreaContainer.style.display = 'block';
            tAreaList.innerHTML = surveyData.texts.map(t => `
                <li style="border-bottom:1px solid #eee; padding:8px 0;">💬 ${t}</li>
            `).reverse().join('');
        } else {
            gArea.style.display = 'block';
            tAreaContainer.style.display = 'none';
            gArea.innerHTML = surveyData.options.map((opt, i) => {
                const count = surveyData.votes[i];
                const pct = surveyData.total === 0 ? 0 : Math.round((count / surveyData.total) * 100);
                return `
                    <div class="result-item">
                        <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:2px;">
                            <span>${opt}</span>
                            <span style="font-weight:bold;">${count}票 (${pct}%)</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width:${pct}%"></div>
                        </div>
                    </div>`;
            }).join('');
        }
    }

    // --- タイマー同期機能 ---
    function emitTimer() {
        const min = document.getElementById('timer-min').value;
        const endTime = Date.now() + (min * 60 * 1000);
        channel.postMessage({ action: 'TIMER_START', endTime: endTime });
        startCountdown(endTime);
    }

    function startCountdown(endTime) {
        clearInterval(timerInterval);
        function update() {
            const diff = endTime - Date.now();
            if(diff <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer-display').innerText = "00:00";
                return;
            }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer-display').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        update();
        timerInterval = setInterval(update, 1000);
    }

    // --- 連絡・メッセージ ---
    function emitMsg() {
        const text = document.getElementById('board-input').value;
        if(!text) return;
        channel.postMessage({ action: 'MSG', text: text });
        document.getElementById('board-text').innerText = text;
        document.getElementById('board-input').value = '';
    }

    function resetAll() {
        if(confirm("ルーム内の全てのデータをリセットしますか？")) {
            channel.postMessage({ action: 'RESET' });
            location.reload();
        }
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>

</body>
</html>
