<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>授業支援システム - 安定通信版</title>
    <style>
        :root { --t-color: #2c3e50; --s-color: #27ae60; --bg: #f4f7f6; --accent: #3498db; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
        
        header { padding: 10px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .t-bg { background: var(--t-color); }
        .s-bg { background: var(--s-color); }

        .status-dot { width: 10px; height: 10px; background: #95a5a6; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .connected { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }

        .container { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px; flex-grow: 1; overflow-y: auto; }
        .panel { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .only-teacher, .only-student { display: none; }
        body.is-teacher .only-teacher { display: block; }
        body.is-student .only-student { display: block; }

        /* グラフ */
        .bar-bg { background: #eee; height: 16px; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.5s; }

        .survey-box { border: 2px solid var(--accent); border-radius: 8px; padding: 15px; background: #f0faff; }
        .opt-btn { display: block; width: 100%; padding: 10px; margin: 5px 0; background: white; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; text-align: left; }
        
        textarea, input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; background: var(--accent); color: white; font-weight: bold; }
    </style>
</head>
<body id="main-body">

<header id="header">
    <div>
        <span class="status-dot" id="sync-dot"></span>
        <strong id="role-text">モード確認中</strong>
        <button class="only-teacher" onclick="copyURL()" style="margin-left:10px; background:#f39c12; font-size:12px;">生徒用URLをコピー</button>
    </div>
    <div id="clock">00:00:00</div>
</header>

<main class="container">
    <div>
        <!-- 教員用：アンケート作成 -->
        <div class="panel only-teacher">
            <h3>📊 アンケート配信</h3>
            <select id="survey-type" onchange="toggleInputs()" style="margin-bottom:10px;">
                <option value="single">単一選択</option>
                <option value="text">自由記述</option>
            </select>
            <input type="text" id="survey-q" placeholder="質問を入力" style="margin-bottom:10px;">
            <div id="opt-area">
                <textarea id="survey-opts" placeholder="選択肢を改行で入力" rows="3"></textarea>
            </div>
            <button onclick="sendSurvey()" style="background:#27ae60; margin-top:10px;">配信開始（全員に送る）</button>
            <button onclick="resetAll()" style="background:#e74c3c; margin-top:10px;">リセット</button>
        </div>

        <!-- 生徒用：アンケート回答 -->
        <div class="panel only-student">
            <div id="student-msg">先生がアンケートを開始するのをお待ちください...</div>
            <div id="student-survey-ui" class="survey-box" style="display:none;">
                <h3 id="view-q">質問</h3>
                <div id="view-opts"></div>
                <button id="send-btn" onclick="submitAnswer()" style="width:100%; margin-top:10px;">回答を送信する</button>
            </div>
        </div>

        <!-- 共通：集計結果 -->
        <div class="panel" id="result-panel" style="display:none;">
            <h3>📈 リアルタイム集計結果</h3>
            <div id="graph-view"></div>
            <ul id="text-view" style="max-height:150px; overflow-y:auto; background:#f9f9f9; padding:10px; display:none;"></ul>
        </div>

        <div class="panel only-student">
            <h3>📝 授業メモ（自分用）</h3>
            <textarea id="note" rows="8"></textarea>
        </div>
    </div>

    <aside>
        <div class="panel">
            <h3>⏰ タイマー</h3>
            <div id="timer-display" style="font-size:3rem; text-align:center; font-weight:bold; color:#e74c3c;">45:00</div>
            <div class="only-teacher">
                <input type="number" id="t-min" value="45" style="width:50px;"> 分
                <button onclick="startTimerSync()">開始</button>
            </div>
        </div>
        <div class="panel">
            <strong>📢 お知らせ:</strong>
            <div id="announcement" style="margin-top:10px; color:#2c3e50;">なし</div>
        </div>
    </aside>
</main>

<script>
    // 通信チャンネル名 (一意な名前に設定)
    const BC = new BroadcastChannel('class_sync_channel_v3');
    const params = new URLSearchParams(window.location.search);
    const IS_STUDENT = params.get('role') === 'student';

    // 授業データ状態
    let state = {
        active: false,
        type: 'single',
        question: '',
        options: [],
        votes: [],
        texts: [],
        total: 0
    };

    // 初期化
    window.onload = () => {
        const body = document.getElementById('main-body');
        const header = document.getElementById('header');
        const roleText = document.getElementById('role-text');

        if (IS_STUDENT) {
            body.classList.add('is-student');
            header.classList.add('s-bg');
            roleText.innerText = "生徒モード";
            // 生徒が入室したとき、先生に「今のデータをください」と要求する
            BC.postMessage({ action: 'REQUEST_SYNC' });
        } else {
            body.classList.add('is-teacher');
            header.classList.add('t-bg');
            roleText.innerText = "教員モード";
        }
        document.getElementById('sync-dot').classList.add('connected');
    };

    // --- 教員の操作 ---
    function toggleInputs() {
        document.getElementById('opt-area').style.display = (document.getElementById('survey-type').value === 'text') ? 'none' : 'block';
    }

    function sendSurvey() {
        const q = document.getElementById('survey-q').value;
        const oText = document.getElementById('survey-opts').value;
        const opts = oText.split('\n').filter(v => v.trim() !== "");
        const type = document.getElementById('survey-type').value;

        if(!q) return alert("質問を入力してください");

        state = { active: true, type, question: q, options: opts, votes: new Array(opts.length).fill(0), texts: [], total: 0 };
        
        BC.postMessage({ action: 'SURVEY_START', state });
        updateUI();
    }

    function resetAll() {
        if(confirm("すべてリセットしますか？")) {
            BC.postMessage({ action: 'RESET' });
            location.reload();
        }
    }

    // --- 通信の受信処理 ---
    BC.onmessage = (e) => {
        const { action, state: newState, text, index, endTime } = e.data;

        // 【全員】アンケート開始
        if (action === 'SURVEY_START') {
            state = newState;
            updateUI();
        }

        // 【教員のみ】生徒からの回答を受け取って集計し、全員に配り直す
        if (action === 'SUBMIT' && !IS_STUDENT) {
            state.total++;
            if (state.type === 'text') {
                state.texts.push(text);
            } else {
                state.votes[index]++;
            }
            BC.postMessage({ action: 'UPDATE_STATE', state });
            updateUI();
        }

        // 【全員】集計結果の更新
        if (action === 'UPDATE_STATE') {
            state = newState;
            updateUI();
        }

        // 【教員のみ】新しい生徒が来たので現在の状態を送ってあげる
        if (action === 'REQUEST_SYNC' && !IS_STUDENT) {
            if(state.active) BC.postMessage({ action: 'SURVEY_START', state });
        }

        if (action === 'RESET') location.reload();
        if (action === 'TIMER') runTimer(endTime);
    };

    // --- 生徒の操作 ---
    function submitAnswer() {
        let payload = { action: 'SUBMIT' };
        if (state.type === 'text') {
            const val = document.getElementById('ans-text').value;
            if(!val) return;
            payload.text = val;
        } else {
            const checked = document.querySelector('input[name="ans"]:checked');
            if(!checked) return alert("選択してください");
            payload.index = parseInt(checked.value);
        }
        BC.postMessage(payload);
        document.getElementById('send-btn').disabled = true;
        document.getElementById('send-btn').innerText = "送信済み";
    }

    // --- UI更新ロジック ---
    function updateUI() {
        if (!state.active) return;

        // 結果エリアの表示
        document.getElementById('result-panel').style.display = 'block';
        const gView = document.getElementById('graph-view');
        const tView = document.getElementById('text-view');

        if (state.type === 'text') {
            gView.style.display = 'none';
            tView.style.display = 'block';
            tView.innerHTML = state.texts.map(t => `<li>${t}</li>`).reverse().join('');
        } else {
            gView.style.display = 'block';
            tView.style.display = 'none';
            gView.innerHTML = state.options.map((opt, i) => {
                const pct = state.total === 0 ? 0 : Math.round((state.votes[i] / state.total) * 100);
                return `<div style="margin-top:10px; font-size:14px;">${opt} (${state.votes[i]}票)</div>
                        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>`;
            }).join('');
        }

        // 生徒用回答欄の表示
        if (IS_STUDENT) {
            document.getElementById('student-msg').style.display = 'none';
            const ui = document.getElementById('student-survey-ui');
            ui.style.display = 'block';
            document.getElementById('view-q').innerText = state.question;
            const optDiv = document.getElementById('view-opts');
            optDiv.innerHTML = '';
            if (state.type === 'text') {
                optDiv.innerHTML = '<textarea id="ans-text" placeholder="回答を入力"></textarea>';
            } else {
                state.options.forEach((o, i) => {
                    optDiv.innerHTML += `<label class="opt-btn"><input type="radio" name="ans" value="${i}"> ${o}</label>`;
                });
            }
        }
    }

    // --- その他（タイマー、時計、URL） ---
    function startTimerSync() {
        const endTime = Date.now() + (document.getElementById('t-min').value * 60000);
        BC.postMessage({ action: 'TIMER', endTime });
        runTimer(endTime);
    }

    let timerInt;
    function runTimer(endTime) {
        clearInterval(timerInt);
        timerInt = setInterval(() => {
            const diff = endTime - Date.now();
            if (diff <= 0) { clearInterval(timerInt); document.getElementById('timer-display').innerText = "00:00"; return; }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }, 1000);
    }

    function copyURL() {
        const url = window.location.href.split('?')[0] + "?role=student";
        navigator.clipboard.writeText(url);
        alert("生徒用URLをコピーしました。新しいタブで開いてください。");
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
