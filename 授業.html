<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture DX v16.0 | The Master Suite</title>
    <!-- PeerJS: 高性能リアルタイム通信 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* 
           =========================================
           1. DESIGN TOKENS (SaaS-Notion Inspired)
           ========================================= 
        */
        :root {
            --bg-base: #05070a;
            --bg-main: #0c0f1a;
            --bg-sidebar: #111423;
            --bg-panel: #1a1f30;
            --bg-card: #252b41;
            --bg-hover: #313955;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #10b981;
            --accent: #f59e0b;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-lg: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-main); font-family: 'Inter', -apple-system, sans-serif; }

        /* スクロールバー */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 10px; }

        /* 
           =========================================
           2. AUTHENTICATION OVERLAY
           ========================================= 
        */
        #auth-overlay {
            position: fixed; inset: 0; background: radial-gradient(circle at top right, #1e1b4b, var(--bg-base));
            display: flex; align-items: center; justify-content: center; z-index: 10000; transition: var(--transition);
        }
        .auth-card {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-xl);
            width: min(90vw, 440px); padding: 48px; box-shadow: var(--shadow-lg); text-align: center;
        }
        .auth-logo { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; color: var(--primary); text-shadow: 0 0 30px var(--primary-glow); }
        .auth-subtitle { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 32px; }
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label { display: block; font-size: 0.7rem; color: var(--text-sub); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .text-input {
            width: 100%; background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 14px 18px; color: white; font-size: 1rem; transition: var(--transition);
        }
        .text-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        /* 
           =========================================
           3. MAIN SHELL & SIDEBAR NAVIGATION
           ========================================= 
        */
        .app-shell { display: none; height: 100vh; grid-template-columns: 84px 1fr; opacity: 0; transition: 0.8s; }
        .app-shell.active { display: grid; opacity: 1; }

        /* 左サイドメニュー */
        nav.app-sidebar {
            background: var(--bg-sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 20px;
        }
        .sidebar-logo { color: var(--primary); margin-bottom: 10px; font-weight: 900; font-size: 1.2rem; }
        .nav-item {
            width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            color: var(--text-sub); cursor: pointer; transition: var(--transition); position: relative;
        }
        .nav-item:hover { background: var(--bg-hover); color: white; }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 0 20px var(--primary-glow); }
        .nav-item::after {
            content: attr(data-label); position: absolute; left: 70px; background: var(--bg-card); color: white;
            font-size: 0.75rem; padding: 6px 12px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid var(--border);
        }
        .nav-item:hover::after { opacity: 1; left: 80px; }

        /* メインコンテンツエリア */
        .app-container { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-main); }
        
        header {
            height: 64px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .role-badge { padding: 4px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border: 1px solid var(--border); }
        .badge-teacher { background: var(--primary-glow); color: var(--primary-light); border-color: var(--primary); }
        .badge-student { background: rgba(16, 185, 129, 0.1); color: var(--secondary); border-color: var(--secondary); }

        /* マルチペイン・ビューポート */
        .workspace { flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; overflow: hidden; }
        @media (max-width: 1100px) { .workspace { grid-template-columns: 1fr; } .side-panel { display: none; } }

        /* 各ツールパネル */
        .main-pane { display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
        .tool-panel { display: none; height: 100%; animation: fadeIn 0.4s ease; }
        .tool-panel.active { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: var(--text-sub); }
        .card-body { padding: 20px; flex: 1; overflow-y: auto; }

        /* 
           =========================================
           4. TOOL SPECIFIC COMPONENTS
           ========================================= 
        */
        /* 画面共有 */
        #video-module {
            background: #000; border-radius: var(--radius-lg); margin-bottom: 16px;
            display: none; position: relative; overflow: hidden; aspect-ratio: 16/9;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        #shared-video { width: 100%; height: 100%; object-fit: contain; }
        .live-indicator {
            position: absolute; top: 15px; left: 15px; background: var(--danger);
            color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 900;
            display: flex; align-items: center; gap: 8px; z-index: 10;
        }
        .live-indicator::before { content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1.2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* アンケート */
        #survey-interaction-card {
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.15), rgba(18, 21, 32, 0.95));
            border: 1px solid var(--primary); border-radius: var(--radius-lg);
            padding: 24px; margin-bottom: 16px; display: none; animation: slideDown 0.4s ease;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .sv-question { font-size: 1.4rem; font-weight: 800; margin-bottom: 24px; color: white; line-height: 1.4; }
        .sv-choices-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .sv-choice-btn {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            color: white; padding: 20px; text-align: left; cursor: pointer; transition: var(--transition);
            font-weight: 600; font-size: 1rem;
        }
        .sv-choice-btn:hover { background: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 20px var(--primary-glow); }

        .res-bar-container { margin-bottom: 18px; }
        .res-bar-meta { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; font-weight: 700; color: var(--text-sub); }
        .res-bar-track { height: 12px; background: var(--bg-base); border-radius: 6px; overflow: hidden; }
        .res-bar-fill { height: 100%; background: var(--primary); transition: width 1.5s cubic-bezier(0.19, 1, 0.22, 1); }

        /* タイマー設定パネル */
        .timer-config { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 500px; margin: 0 auto; }
        .timer-big-display {
            font-size: 6rem; font-weight: 900; font-family: var(--font-mono);
            text-align: center; color: var(--danger); text-shadow: 0 0 40px rgba(244, 63, 94, 0.4);
            margin: 40px 0;
        }

        /* 授業ノート */
        #note-editor {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            font-size: 1.1rem; line-height: 1.8; resize: none; outline: none; padding: 10px;
        }

        /* スケッチボード */
        #sketch-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        #canvas-board { background: white; border-radius: var(--radius-md); flex: 1; cursor: crosshair; touch-action: none; }
        .canvas-toolbar {
            padding: 12px; background: var(--bg-base); display: flex; align-items: center; gap: 20px;
            border-bottom: 1px solid var(--border); border-radius: var(--radius-md) var(--radius-md) 0 0;
        }

        /* 
           =========================================
           5. BUTTONS & UI COMPONENTS
           ========================================= 
        */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border-radius: var(--radius-md); border: none; cursor: pointer;
            font-weight: 800; font-size: 0.9rem; transition: var(--transition); color: white;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn-ghost:hover { background: var(--bg-hover); color: white; border-color: var(--text-sub); }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); }
        .btn-sm { padding: 8px 16px; font-size: 0.75rem; }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%; background: var(--bg-base); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 12px; color: white; font-size: 0.95rem; outline: none; transition: var(--transition);
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        .only-teacher, .only-student { display: none !important; }
        body.is-teacher .only-teacher { display: flex !important; }
        body.is-teacher .only-teacher-block { display: block !important; }
        body.is-student .only-student { display: flex !important; }

        /* リアクション */
        #reaction-stage { position: fixed; inset: 0; pointer-events: none; z-index: 10000; overflow: hidden; }
        .emoji-fly {
            position: absolute; bottom: -80px; font-size: 4.5rem; 
            animation: riseFade 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes riseFade {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            15% { transform: translateY(-50px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-95vh) scale(1.1); opacity: 0; }
        }

        /* 出席者カード */
        .student-chip {
            background: var(--bg-elevated); padding: 12px 16px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent; transition: 0.3s; margin-bottom: 8px;
        }
        .student-chip.is-hand-raised { border-color: var(--warning); background: rgba(245, 158, 11, 0.1); box-shadow: 0 0 20px rgba(245, 158, 11, 0.15); }
    </style>
</head>
<body>

<!-- [GAWAY] 入室・認証画面 -->
<div id="auth-overlay">
    <div class="auth-card">
        <div class="auth-logo">LECTURE DX</div>
        <div class="auth-subtitle">Ultimate Master Edition v16.0</div>
        
        <div class="input-group" id="room-id-box">
            <label>ROOM ID (Unique Session Code)</label>
            <input type="text" id="init-room-id" class="text-input" placeholder="例: tanaka-phys-2024" spellcheck="false">
        </div>
        <div class="input-group">
            <label>DISPLAY NAME</label>
            <input type="text" id="init-user-name" class="text-input" placeholder="お名前を入力してください">
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:35px;">
            <button class="btn btn-ghost" onclick="app.ignition('student')">生徒として入室</button>
            <button class="btn btn-primary" id="btn-host-start" onclick="app.ignition('teacher')">教員として開始</button>
        </div>
        <p id="auth-status-log" style="margin-top:25px; font-size:0.75rem; color:var(--text-mute); font-weight:700;"></p>
    </div>
</div>

<div id="reaction-stage"></div>

<!-- [MASTER SHELL] アプリケーション本体 -->
<div class="app-shell" id="app-shell">
    
    <!-- 左グローバルナビゲーション -->
    <nav class="app-sidebar">
        <div class="sidebar-logo">LDX</div>
        <div class="nav-item active" data-label="授業メイン" id="nav-main" onclick="app.switchTool('main')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9 12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        </div>
        <div class="nav-item" data-label="スケッチボード" id="nav-sketch" onclick="app.switchTool('sketch')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 5 5"/></svg>
        </div>
        <div class="nav-item only-teacher" data-label="アンケート設定" id="nav-survey" onclick="app.switchTool('survey-config')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        </div>
        <div class="nav-item only-teacher" data-label="タイマー設定" id="nav-timer" onclick="app.switchTool('timer-config')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div class="nav-item" data-label="サウンド設定" onclick="app.unlockAudio()">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </div>
    </nav>

    <div class="app-container">
        <!-- ヘッダー -->
        <header>
            <div class="header-left">
                <span id="role-badge" class="badge">---</span>
                <span id="room-display-id" style="font-size:0.8rem; color:var(--text-sub); font-weight:700; letter-spacing: 0.5px;">ROOM: --</span>
                <div id="p2p-status-indicator" style="width:10px; height:10px; border-radius:50%; background:var(--secondary); box-shadow: 0 0 10px var(--secondary);"></div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="only-teacher btn btn-ghost btn-sm" onclick="app.copyInviteUrl()">🔗 招待URLコピー</button>
                <button class="only-teacher btn btn-primary btn-sm" id="btn-share-trigger" onclick="app.toggleScreenShare()">🖥 画面共有開始</button>
                <span id="digital-clock" style="font-family: var(--font-mono); font-size: 0.9rem; font-weight:bold; color:var(--text-main); margin-left:15px;">00:00:00</span>
            </div>
        </header>

        <main class="workspace">
            <!-- 中央: メイン可変パネル -->
            <section class="main-pane">
                
                <!-- 教員ビデオ共有 (全ツール共通オーバーレイ) -->
                <div id="screen-view-module">
                    <div class="live-label">TEACHER'S DESKTOP LIVE</div>
                    <video id="shared-video" autoplay playsinline></video>
                </div>

                <!-- アンケート出現エリア (生徒用ポップアップ) -->
                <div id="survey-interaction-overlay">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div id="sv-disp-q" class="sv-question">アンケートを取得中...</div>
                        <div class="only-teacher" style="display:flex; gap:10px;">
                            <button class="btn btn-ghost btn-sm" id="sv-vis-btn" onclick="app.toggleSurveyResultVisibility()">結果を非公開にする</button>
                            <button class="btn btn-danger btn-sm" onclick="app.terminateSurvey()">強制終了</button>
                        </div>
                    </div>
                    <div id="sv-render-area" class="sv-choices-grid"></div>
                    <div id="sv-results-area" style="margin-top:30px; border-top:1px dashed var(--border); padding-top:20px;">
                        <div style="font-size:0.7rem; color:var(--text-sub); font-weight:800; margin-bottom:15px;">REALTIME ANALYTICS: <span id="sv-total-votes">0</span> votes</div>
                        <div id="sv-bars-list"></div>
                    </div>
                </div>

                <!-- ツール 1: 授業ノート -->
                <div id="tool-main" class="tool-panel glass-card active">
                    <div class="card-header">
                        <span>📝 学習ノート</span>
                        <div style="display:flex; gap:10px; align-items:center;">
                            <span id="save-hint" style="font-size:0.6rem; color:var(--secondary)">● Auto-save: ACTIVE</span>
                            <button class="btn btn-ghost btn-sm" onclick="app.exportNoteFile()">Export .txt</button>
                        </div>
                    </div>
                    <div class="card-body" style="padding:0;">
                        <textarea id="note-editor" spellcheck="false" placeholder="ここに授業の内容を記録してください...（ Markdown形式対応 ）"></textarea>
                    </div>
                </div>

                <!-- ツール 2: スケッチボード -->
                <div id="tool-sketch" class="tool-panel glass-card">
                    <div class="card-header">🎨 スケッチボード</div>
                    <div class="card-body" style="padding:15px; display:flex; flex-direction:column;">
                        <div id="sketch-container">
                            <div class="canvas-toolbar">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <label style="font-size:0.6rem; font-weight:800;">COLOR</label>
                                    <input type="color" id="sk-color-picker" value="#6366f1" style="width:36px; height:36px; border:none; background:none; cursor:pointer;">
                                </div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <label style="font-size:0.6rem; font-weight:800;">SIZE</label>
                                    <input type="range" id="sk-size-slider" min="1" max="80" value="6" style="width:120px;">
                                </div>
                                <div style="flex:1"></div>
                                <button class="btn btn-ghost btn-sm" onclick="app.undoCanvas()">UNDO</button>
                                <button class="btn btn-ghost btn-sm" onclick="app.clearCanvas()">CLEAR ALL</button>
                                <button class="btn btn-primary btn-sm" onclick="app.saveCanvasImg()">SAVE PNG</button>
                            </div>
                            <canvas id="canvas-board"></canvas>
                        </div>
                    </div>
                </div>

                <!-- ツール 3: [TEACHER] アンケート管理 -->
                <div id="tool-survey-config" class="tool-panel glass-card">
                    <div class="card-header">📊 アンケート管理センター</div>
                    <div class="card-body">
                        <div style="max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:20px;">
                            <div class="input-group">
                                <label>アンケート形式</label>
                                <select id="adm-sv-type-sel" onchange="app.onSurveyTypeChange()">
                                    <option value="single">単一選択（ラジオボタン）</option>
                                    <option value="multi">複数選択（チェックボックス）</option>
                                    <option value="scale">5段階評価（満足度・理解度）</option>
                                    <option value="text">自由記述（テキスト入力）</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>質問タイトル</label>
                                <input type="text" id="adm-sv-q-in" placeholder="例: 今日の内容は理解できましたか？">
                            </div>
                            <div class="input-group" id="adm-sv-opt-wrapper">
                                <label>選択肢 (カンマ区切りで入力)</label>
                                <input type="text" id="adm-sv-opt-in" placeholder="よく分かった, だいたい分かった, 難しい">
                            </div>
                            <button class="btn btn-primary" style="height:55px;" onclick="app.igniteSurvey()">アンケートをクラス全員に配信する</button>
                            <p style="color:var(--text-mute); font-size:0.8rem; text-align:center;">配信すると、生徒の画面に自動的に回答フォームが出現します。</p>
                        </div>
                    </div>
                </div>

                <!-- ツール 4: [TEACHER] 精密タイマー設定 -->
                <div id="tool-timer-config" class="tool-panel glass-card">
                    <div class="card-header">⏰ 精密同期タイマー設定</div>
                    <div class="card-body">
                        <div class="timer-big-display" id="timer-canvas-disp">00:00</div>
                        <div class="timer-config">
                            <div class="input-group">
                                <label>分 (MINUTES)</label>
                                <input type="number" id="t-min-in" value="45" style="font-size:2rem; text-align:center;">
                            </div>
                            <div class="input-group">
                                <label>秒 (SECONDS)</label>
                                <input type="number" id="t-sec-in" value="0" style="font-size:2rem; text-align:center;">
                            </div>
                        </div>
                        <div style="display:flex; justify-content:center; gap:15px; margin-top:30px;">
                            <button class="btn btn-primary" style="width:200px; height:60px;" onclick="app.broadcastTimer()">タイマーを開始</button>
                            <button class="btn btn-danger" style="width:200px; height:60px;" onclick="app.resetTimer()">停止 / リセット</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右サイド: クラスメイト & 掲示板 -->
            <aside class="side-panel panel">
                <div class="panel-header">Intelligence & Roster</div>
                <div class="panel-body">
                    <!-- 理解度平均グラフ -->
                    <div style="background:var(--bg-elevated); padding:15px; border-radius:12px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.7rem; font-weight:800; margin-bottom:10px; color:var(--text-sub);">
                            <span>AVG UNDERSTANDING</span>
                            <span id="avg-pct-disp">100%</span>
                        </div>
                        <div class="res-bar-track" style="height:10px;">
                            <div id="avg-bar-fill" class="res-bar-fill" style="width:100%; background:var(--secondary)"></div>
                        </div>
                        <div class="only-student" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-top:15px;">
                            <button class="btn btn-ghost btn-sm" onclick="app.updateLv(100)">😊</button>
                            <button class="btn btn-ghost btn-sm" onclick="app.updateLv(50)">🤔</button>
                            <button class="btn btn-ghost btn-sm" onclick="app.updateLv(0)">🚨</button>
                        </div>
                        <button class="btn btn-warning btn-sm only-student" id="hand-trigger" onclick="app.toggleHand()" style="width:100%; margin-top:10px; background:transparent; border:1px solid var(--warning); color:var(--warning);">🖐 挙手 / 質問する</button>
                    </div>

                    <!-- 出席者リスト -->
                    <div id="roster-container" style="flex:1; overflow-y:auto; margin-top:15px;"></div>

                    <!-- 掲示板 -->
                    <div style="border-top:1px solid var(--border); padding-top:15px; display:flex; flex-direction:column; gap:10px; height: 300px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:0.7rem; font-weight:900;">BULLETIN BOARD</span>
                            <div style="display:flex; gap:5px;">
                                <button class="btn btn-ghost btn-sm" style="padding:2px 5px;" onclick="app.emitEmoji('👏')">👏</button>
                                <button class="btn btn-ghost btn-sm" style="padding:2px 5px;" onclick="app.emitEmoji('🔥')">🔥</button>
                            </div>
                        </div>
                        <div id="bulletin-messages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
                        <div class="only-teacher" style="display:flex; gap:5px;">
                            <input type="text" id="board-in" class="text-input" style="padding:10px; font-size:0.8rem;" placeholder="全体連絡...">
                            <button class="btn btn-primary btn-sm" onclick="app.postBulletin()">送信</button>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>
</div>

<!-- =========================================
     JAVASCRIPT: THE MASTER ENGINE
========================================= -->
<script>
/**
 * LECTURE DX ULTIMATE v16.0
 * FULLSTACK P2P CLASSROOM ENGINE
 */

class LectureDXGrandMaster {
    constructor() {
        this.peer = null;
        this.connections = new Map(); // Teacher context
        this.hostConn = null;         // Student context
        this.role = '';
        this.room = '';
        this.userName = '';
        this.roster = new Map();
        this.surveyData = null;
        this.timerInterval = null;
        this.mediaStream = null;
        this.handState = false;
        this.canvasStack = [];
        
        // 音響合成用 AudioContext
        this.audioCtx = null;
    }

    /* --- 1. CORE: BOOTSTRAP & NETWORK --- */
    async ignition(role) {
        this.room = document.getElementById('init-room-id').value.trim();
        this.userName = document.getElementById('init-user-name').value.trim() || 'Anonymous';
        if (!this.room) return alert('ROOM IDを入力してください');

        this.role = role;
        document.getElementById('auth-status-log').innerText = 'Initializing P2P Orchestrator...';

        const peerId = role === 'teacher' ? `ldx-v16-${this.room}-host` : `ldx-v16-${this.room}-cl-${Math.random().toString(36).substr(2,6)}`;
        this.peer = new Peer(peerId);

        this.peer.on('open', (id) => {
            this.prepareUI();
            if (role === 'teacher') this.launchHost();
            else this.launchClient();
        });

        this.peer.on('error', (err) => {
            if (err.type === 'unavailable-id') alert('そのルームIDは既に使用されています。別のIDをお試しください。');
            else alert('通信エラーが発生しました: ' + err.type);
            location.reload();
        });

        // WebRTC ビデオ受信リスナー
        this.peer.on('call', (call) => {
            call.answer();
            call.on('stream', (st) => {
                document.getElementById('screen-view-module').style.display = 'block';
                document.getElementById('shared-video').srcObject = st;
            });
        });
    }

    prepareUI() {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('app-shell').classList.add('active');
        document.body.classList.add(this.role === 'teacher' ? 'is-teacher' : 'is-student');
        document.getElementById('role-badge').innerText = this.role.toUpperCase();
        document.getElementById('role-badge').className = `badge badge-${this.role}`;
        document.getElementById('room-display-id').innerText = `ID: ${this.room}`;
        
        this.initStorageEngine();
        this.initCanvasEngine();
    }

    launchHost() {
        this.peer.on('connection', (conn) => {
            conn.on('open', () => {
                this.connections.set(conn.peer, conn);
                conn.on('data', (d) => this.dispatchPacket(d, conn));
                // 既存の状態を新規生徒へ即時同期
                if (this.surveyData) conn.send({ type: 'SV_SYNC', payload: this.surveyData });
            });
            conn.on('close', () => {
                this.connections.delete(conn.peer);
                this.roster.delete(conn.peer);
                this.broadcastRoster();
            });
        });
    }

    launchClient() {
        const hostId = `ldx-v16-${this.room}-host`;
        this.hostConn = this.peer.connect(hostId, { reliable: true });
        this.hostConn.on('open', () => {
            this.hostConn.send({ type: 'HELLO', name: this.userName });
        });
        this.hostConn.on('data', (d) => this.dispatchPacket(d));
        this.hostConn.on('close', () => {
            alert('教員が退出したため、セッションを終了します。');
            location.reload();
        });
    }

    broadcast(data) {
        this.connections.forEach(c => { if (c.open) c.send(data); });
    }

    dispatchPacket(d, sender = null) {
        switch (d.type) {
            case 'HELLO':
                this.roster.set(sender.peer, { name: d.name, level: 100, hand: false });
                this.broadcastRoster();
                break;
            case 'ROSTER_SYNC':
                this.renderRoster(d.payload);
                break;
            case 'LV_CHANGE':
                if (this.role === 'teacher') {
                    const s = this.roster.get(sender.peer);
                    if (s) s.level = d.val;
                    this.broadcastRoster();
                }
                break;
            case 'HAND_SIGNAL':
                if (this.role === 'teacher') {
                    const s = this.roster.get(sender.peer);
                    if (s) {
                        s.hand = d.val;
                        if (d.val) this.beep(587.33); // D5 chime
                    }
                    this.broadcastRoster();
                }
                break;
            case 'SV_IGNITE':
            case 'SV_SYNC':
                this.surveyData = d.payload;
                this.renderSurveyUI(d.payload);
                break;
            case 'SV_VOTE_RECV':
                if (this.role === 'teacher') this.tallySurveyVote(d.val);
                break;
            case 'SV_CLOSE':
                this.surveyData = null;
                document.getElementById('survey-interaction-overlay').style.display = 'none';
                break;
            case 'TIMER_TICK':
                this.uiTimerEngine(d.end);
                break;
            case 'TIMER_STOP':
                clearInterval(this.timerInterval);
                document.getElementById('timer-display-val').innerText = '00:00';
                document.getElementById('timer-canvas-disp').innerText = '00:00';
                break;
            case 'BULLETIN':
                this.drawAnnouncement(d.sender, d.msg);
                if (this.role === 'teacher') this.broadcast(d);
                break;
            case 'EMOJI_POP':
                this.spawnEmoji(d.emoji);
                if (this.role === 'teacher') this.broadcast(d);
                break;
            case 'SHARE_STOP':
                document.getElementById('screen-view-module').style.display = 'none';
                break;
        }
    }

    /* --- 2. SURVEY ENGINE (復元 & 高性能化) --- */
    onSurveyTypeChange() {
        const t = document.getElementById('adm-sv-type-sel').value;
        const wrapper = document.getElementById('adm-sv-opt-wrapper');
        wrapper.style.opacity = (t === 'text' || t === 'scale') ? '0.2' : '1';
        wrapper.style.pointerEvents = (t === 'text' || t === 'scale') ? 'none' : 'auto';
    }

    igniteSurvey() {
        const q = document.getElementById('adm-sv-q-in').value.trim();
        const t = document.getElementById('adm-sv-type-sel').value;
        let o = document.getElementById('adm-sv-opt-in').value.split(',').map(s=>s.trim()).filter(Boolean);
        if (!q) return alert('質問を入力してください');
        if (t === 'scale') o = ['1: Bad', '2', '3', '4', '5: Good'];
        
        this.surveyData = {
            type: t, question: q, options: o,
            votes: t === 'text' ? [] : Object.fromEntries(o.map(v => [v, 0])),
            total: 0, showResults: true
        };
        this.broadcast({ type: 'SV_IGNITE', payload: this.surveyData });
        this.renderSurveyUI(this.surveyData);
        this.switchTool('main'); // 生徒の反応を見るためにメインへ
    }

    tallySurveyVote(val) {
        if (!this.surveyData) return;
        this.surveyData.total++;
        if (this.surveyData.type === 'text') {
            this.surveyData.votes.push(val);
        } else if (Array.isArray(val)) {
            val.forEach(v => { if (this.surveyData.votes[v] !== undefined) this.surveyData.votes[v]++; });
        } else {
            if (this.surveyData.votes[val] !== undefined) this.surveyData.votes[val]++;
        }
        
        this.broadcast({ type: 'SV_SYNC', payload: this.surveyData });
        this.renderSurveyUI(this.surveyData);
    }

    renderSurveyUI(data) {
        const mod = document.getElementById('survey-interaction-overlay');
        mod.style.display = 'block';
        document.getElementById('sv-disp-q').innerText = "📊 " + data.question;
        document.getElementById('sv-total-votes').innerText = data.total;

        const renderArea = document.getElementById('sv-render-area');
        renderArea.innerHTML = '';
        if (this.role === 'student') {
            if (data.type === 'text') {
                renderArea.innerHTML = `<input type="text" id="sv-text-ans" class="text-input" placeholder="回答を入力...">
                                        <button class="btn btn-primary" style="margin-top:15px; width:100%" onclick="app.submitVote()">回答を送信</button>`;
            } else {
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'sv-choice-btn';
                    btn.innerText = opt;
                    btn.onclick = () => { 
                        app.submitVote(opt); 
                        renderArea.innerHTML = '<div style="color:var(--secondary); font-weight:800; padding:20px; text-align:center;">✓ 送信完了。クラスの集計をお待ちください。</div>';
                    };
                    renderArea.appendChild(btn);
                });
            }
        }

        const barsList = document.getElementById('sv-bars-list');
        if (this.role === 'student' && !data.showResults) {
            barsList.innerHTML = '<div style="text-align:center; opacity:0.5; padding:20px; font-weight:700;">先生が結果を集計しています...</div>';
            return;
        }

        barsList.innerHTML = '';
        if (data.type === 'text') {
            data.votes.slice().reverse().forEach(v => {
                barsList.innerHTML += `<div style="background:var(--bg-card); padding:15px; border-radius:12px; margin-bottom:10px; font-size:0.9rem; line-height:1.4;">${v}</div>`;
            });
        } else {
            data.options.forEach(opt => {
                const count = data.votes[opt];
                const pct = data.total ? Math.round(count / data.total * 100) : 0;
                barsList.innerHTML += `
                    <div class="res-bar-container">
                        <div class="res-bar-meta"><span>${opt}</span><span>${count} votes (${pct}%)</span></div>
                        <div class="res-bar-track"><div class="res-bar-fill" style="width:${pct}%"></div></div>
                    </div>`;
            });
        }

        if (this.role === 'teacher') {
            const visBtn = document.getElementById('sv-vis-btn');
            visBtn.innerText = data.showResults ? '結果を非公開にする' : '結果を表示中';
            visBtn.style.background = data.showResults ? 'var(--bg-hover)' : 'var(--accent)';
        }
    }

    submitVote(v = null) {
        const val = v || document.getElementById('sv-text-ans').value.trim();
        if (this.hostConn) this.hostConn.send({ type: 'SV_VOTE_RECV', val: val });
    }

    toggleSurveyResultVisibility() {
        if (!this.surveyData) return;
        this.surveyData.showResults = !this.surveyData.showResults;
        this.broadcast({ type: 'SV_SYNC', payload: this.surveyData });
        this.renderSurveyUI(this.surveyData);
    }

    terminateSurvey() {
        this.surveyData = null;
        this.broadcast({ type: 'SV_CLOSE' });
        document.getElementById('survey-interaction-overlay').style.display = 'none';
    }

    /* --- 3. CLASSROOM MANAGEMENT --- */
    broadcastRoster() {
        const list = Array.from(this.roster.values());
        this.broadcast({ type: 'ROSTER_SYNC', payload: list });
        this.renderRoster(list);
    }

    renderRoster(list) {
        const container = document.getElementById('roster-container');
        container.innerHTML = '';
        document.getElementById('user-count').innerText = list.length;
        let lvSum = 0;
        list.forEach(u => {
            lvSum += u.level;
            const card = document.createElement('div');
            card.className = `student-chip ${u.hand ? 'is-hand-raised' : ''}`;
            card.innerHTML = `<span>👤 ${u.name}</span><span>${u.hand ? '🖐 Raising' : ''}</span>`;
            container.appendChild(card);
        });
        const avg = list.length ? Math.round(lvSum / list.length) : 100;
        document.getElementById('avg-pct-disp').innerText = avg + '%';
        document.getElementById('avg-bar-fill').style.width = avg + '%';
        document.getElementById('avg-bar-fill').style.background = avg > 70 ? 'var(--secondary)' : (avg > 40 ? 'var(--accent)' : 'var(--danger)');
    }

    updateLv(val) { if (this.hostConn) this.hostConn.send({ type: 'LV_CHANGE', val: val }); }
    toggleHand() {
        this.handState = !this.handState;
        const btn = document.getElementById('hand-trigger');
        btn.innerText = this.handState ? '✋ 挙手を下ろす' : '🖐 先生に質問する';
        btn.style.background = this.handState ? 'var(--warning)' : 'transparent';
        btn.style.color = this.handState ? 'white' : 'var(--warning)';
        if (this.hostConn) this.hostConn.send({ type: 'HAND_SIGNAL', val: this.handState });
    }

    /* --- 4. PRECISION TIMER --- */
    broadcastTimer() {
        const m = parseInt(document.getElementById('t-min-in').value) || 0;
        const s = parseInt(document.getElementById('t-sec-in').value) || 0;
        const end = Date.now() + (m * 60 + s) * 1000;
        this.broadcast({ type: 'TIMER_TICK', end: end });
        this.uiTimerEngine(end);
    }

    uiTimerEngine(endTime) {
        clearInterval(this.timerInterval);
        const displays = [document.getElementById('timer-display-val'), document.getElementById('timer-canvas-disp')];
        const update = () => {
            const diff = endTime - Date.now();
            if (diff <= 0) {
                clearInterval(this.timerInterval);
                displays.forEach(d => d.innerText = '00:00');
                if (this.role === 'teacher') this.beep(880, 'square', 1.0);
                return;
            }
            const min = Math.floor(diff / 60000);
            const sec = Math.floor((diff % 60000) / 1000);
            const str = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            displays.forEach(d => d.innerText = str);
        };
        update();
        this.timerInterval = setInterval(update, 1000);
    }

    resetTimer() {
        clearInterval(this.timerInterval);
        document.getElementById('timer-display-val').innerText = '00:00';
        document.getElementById('timer-canvas-disp').innerText = '00:00';
        this.broadcast({ type: 'TIMER_STOP' });
    }

    /* --- 5. SCREEN SHARE (WebRTC) --- */
    async toggleScreenShare() {
        const btn = document.getElementById('btn-share-trigger');
        if (this.mediaStream) {
            this.mediaStream.getTracks().forEach(t => t.stop());
            this.mediaStream = null;
            btn.innerText = '🖥 画面共有開始';
            document.getElementById('screen-view-module').style.display = 'none';
            this.broadcast({ type: 'SHARE_STOP' });
            return;
        }
        try {
            this.mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: false });
            document.getElementById('screen-view-module').style.display = 'block';
            document.getElementById('shared-video').srcObject = this.mediaStream;
            btn.innerText = '共有を停止';
            this.connections.forEach(c => this.peer.call(c.peer, this.mediaStream));
            this.mediaStream.getVideoTracks()[0].onended = () => this.toggleScreenShare();
        } catch (e) { console.warn(e); }
    }

    /* --- 6. WORKSPACE TOOLS --- */
    switchTool(toolId) {
        document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tool-' + toolId).classList.add('active');
        
        // ナビアイコンのアクティブ化
        const navMap = { 'main': 'nav-main', 'sketch': 'nav-sketch', 'survey-config': 'nav-survey', 'timer-config': 'nav-timer' };
        if (navMap[toolId]) document.getElementById(navMap[toolId]).classList.add('active');
        
        // タイトル変更
        const titles = { 'main': 'Class Note', 'sketch': 'Sketchboard', 'survey-config': 'Survey Management', 'timer-config': 'Timer Settings' };
        document.getElementById('workspace-title').innerText = titles[toolId] || 'Workspace';
    }

    initStorageEngine() {
        const ed = document.getElementById('note-editor');
        const key = `ldx_v16_note_${this.roomId}`;
        ed.value = localStorage.getItem(key) || '';
        ed.oninput = () => {
            localStorage.setItem(key, ed.value);
            document.getElementById('sync-indicator').innerText = '● Saving...';
            setTimeout(() => { document.getElementById('sync-indicator').innerText = '● Online Sync'; }, 800);
        };
    }

    initCanvasEngine() {
        const cv = document.getElementById('canvas-board');
        const ctx = cv.getContext('2d');
        let drawing = false;
        const fit = () => { 
            const dpr = window.devicePixelRatio || 1;
            const b = cv.getBoundingClientRect();
            cv.width = b.width * dpr; cv.height = b.height * dpr;
            ctx.scale(dpr, dpr);
        };
        window.addEventListener('resize', fit); fit();

        const start = (e) => { 
            drawing = true; ctx.beginPath();
            const r = cv.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            ctx.moveTo(x, y);
            this.canvasStack.push(ctx.getImageData(0,0,cv.width,cv.height));
        };
        const move = (e) => {
            if (!drawing) return;
            const r = cv.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            ctx.lineWidth = document.getElementById('sk-size-slider').value;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = document.getElementById('sk-color-picker').value;
            ctx.lineTo(x, y); ctx.stroke();
        };
        cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', () => drawing = false);
        cv.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }); cv.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); });
        this.clearCanvas = () => ctx.clearRect(0, 0, cv.width, cv.height);
        this.undoCanvas = () => { if(this.canvasStack.length) ctx.putImageData(this.canvasStack.pop(), 0, 0); };
        this.saveCanvas = () => { const a = document.createElement('a'); a.download=`sketch-${this.room}.png`; a.href=cv.toDataURL(); a.click(); };
    }

    /* --- 7. BULLETIN & REACTION --- */
    postBulletin() {
        const m = document.getElementById('board-in').value.trim();
        if (!m) return;
        const sender = this.userName + ' (Teacher)';
        this.drawAnnouncement(sender, m);
        this.broadcast({ type: 'BULLETIN', sender: sender, msg: m });
        document.getElementById('board-in').value = '';
    }

    drawAnnouncement(s, m) {
        const b = document.getElementById('bulletin-messages');
        const d = document.createElement('div');
        d.style.background = 'var(--bg-card)'; d.style.padding = '12px'; d.style.borderRadius = '10px';
        d.innerHTML = `<strong style="color:var(--primary); font-size:0.65rem;">${s}</strong><div style="margin-top:6px; line-height:1.4; font-size:0.85rem;">${m}</div>`;
        b.appendChild(d); b.scrollTop = b.scrollHeight;
    }

    emitEmoji(emoji) {
        this.spawnEmoji(emoji);
        if (this.role === 'teacher') this.broadcast({ type: 'EMOJI_POP', emoji: emoji });
        else if (this.hostConn) this.hostConn.send({ type: 'EMOJI_POP', emoji: emoji });
    }

    spawnEmoji(emoji) {
        const stage = document.getElementById('reaction-layer');
        const div = document.createElement('div');
        div.className = 'emoji-fly'; div.innerText = emoji;
        div.style.left = `${Math.random() * 80 + 10}%`;
        stage.appendChild(div);
        setTimeout(() => div.remove(), 4000);
    }

    pickRoulette() {
        const users = Array.from(this.roster.values());
        if (!users.length) return alert('生徒がいません');
        const win = users[Math.floor(Math.random() * users.length)];
        const m = `🎯 Roulette Pick: 【${win.name}】さん、お願いします！`;
        this.drawAnnouncement('SYSTEM', m);
        this.broadcast({ type: 'BULLETIN', sender: 'SYSTEM', msg: m });
    }

    /* --- 8. AUDIO & UTILS --- */
    unlockAudio() {
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        this.beep(440, 'sine', 0.1);
        alert('Audio Engine Activated.');
    }

    beep(freq, type = 'sine', dur = 0.5) {
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(this.audioCtx.destination);
        osc.start(); osc.stop(this.audioCtx.currentTime + dur);
    }

    exportNote() {
        const b = new Blob([document.getElementById('note-editor').value], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `LectureNote.txt`; a.click();
    }

    copyInviteUrl() {
        const u = `${window.location.origin}${window.location.pathname}?room=${this.room}&role=student`;
        navigator.clipboard.writeText(u); alert('Invitation URL Copied!');
    }
}

// OS Bootstrap
const app = new LectureDXGrandMaster();

// UI Lifecycle
setInterval(() => {
    document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString();
}, 1000);

window.addEventListener('load', () => {
    const p = new URLSearchParams(window.location.search);
    const r = p.get('room');
    if (r) {
        document.getElementById('init-room-id').value = r;
        if (p.get('role') === 'student') {
            document.getElementById('btn-host-start').style.display = 'none';
            document.getElementById('room-id-box').style.display = 'none';
        }
    }
});
</script>
