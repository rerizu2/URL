<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>授業支援DXダッシュボード</title>
    <style>
        :root {
            --t-color: #2c3e50; --s-color: #27ae60; --bg: #f0f2f5; --accent: #3498db; --danger: #e74c3c;
        }
        body { font-family: sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ログイン・ヘッダー */
        #setup-screen { position: fixed; inset: 0; background: var(--t-color); color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .setup-box { background: white; color: #333; padding: 30px; border-radius: 15px; width: 320px; text-align: center; }
        header { padding: 10px 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .t-mode { background: var(--t-color); } .s-mode { background: var(--s-color); }

        /* レイアウト */
        .main-layout { display: grid; grid-template-columns: 250px 1fr 300px; gap: 15px; padding: 15px; flex-grow: 1; overflow: hidden; }
        .panel { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        h3 { margin-top: 0; font-size: 1rem; border-bottom: 2px solid var(--bg); padding-bottom: 5px; }

        /* 理解度メーター */
        .meter-btns { display: flex; gap: 5px; margin-bottom: 10px; }
        .meter-btns button { flex: 1; font-size: 0.8rem; }
        .meter-bar { height: 10px; border-radius: 5px; background: #eee; margin-top: 5px; overflow: hidden; }
        .meter-fill { height: 100%; width: 0%; transition: 0.5s; }

        /* リアクション */
        #reaction-layer { position: fixed; bottom: 50px; right: 50px; pointer-events: none; z-index: 1000; }
        .floating-emoji { position: absolute; animation: floatUp 2s forwards; font-size: 2rem; opacity: 0; }
        @keyframes floatUp { 0% { bottom: 0; opacity: 1; transform: translateX(0); } 100% { bottom: 300px; opacity: 0; transform: translateX(50px); } }

        /* リスト・キュー */
        .list-area { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; }
        .list-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #eee; }
        .hand-on { background: #fff3e0; border-left: 4px solid #ff9800; }

        /* フォーム系 */
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 5px; padding: 8px; box-sizing: border-box; }
        button { cursor: pointer; border: none; border-radius: 4px; padding: 8px 12px; background: var(--accent); color: white; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }

        #timer-display { font-size: 2.5rem; text-align: center; font-weight: bold; color: var(--danger); font-family: monospace; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="setup-box">
        <h2>授業Roomログイン</h2>
        <input type="text" id="in-room" placeholder="ルームID (例: room1)">
        <input type="text" id="in-name" placeholder="あなたの名前">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button onclick="join('teacher')" style="flex:1; background:var(--t-color)">教員</button>
            <button onclick="join('student')" style="flex:1; background:var(--s-color)">生徒</button>
        </div>
    </div>
</div>

<div id="reaction-layer"></div>

<header id="header">
    <div id="header-info">Room: -- | Name: --</div>
    <div id="clock">00:00:00</div>
</header>

<main class="main-layout">
    <!-- 左サイド：出席と理解度 -->
    <section class="left-col">
        <div class="panel" style="height: 40%;">
            <h3>👥 出席者 (<span id="count-p">0</span>)</h3>
            <div id="student-list" class="list-area"></div>
            <button class="only-teacher" onclick="pickRandom()" style="margin-top:10px; background:#9b59b6;">🎲 ランダム指名</button>
        </div>
        <div class="panel" style="height: 55%; margin-top:15px;">
            <h3>📊 クラスの理解度</h3>
            <div class="only-student">
                <div class="meter-btns">
                    <button onclick="sendLevel(100)" style="background:#2ecc71;">😊OK</button>
                    <button onclick="sendLevel(50)" style="background:#f1c40f;">😐微妙</button>
                    <button onclick="sendLevel(0)" style="background:#e74c3c;">❓SOS</button>
                </div>
            </div>
            <div id="meter-results">
                <div style="font-size:0.8rem;">理解度平均: <span id="avg-val">0</span>%</div>
                <div class="meter-bar"><div id="avg-fill" class="meter-fill" style="background:#2ecc71;"></div></div>
            </div>
            <hr>
            <h3>🙋 挙手リスト</h3>
            <div id="hand-list" class="list-area"></div>
            <button class="only-student" id="hand-btn" onclick="toggleHand()" style="background:#e67e22;">🖐 手を挙げる</button>
        </div>
    </section>

    <!-- 中央：メインノート・アンケート -->
    <section class="panel">
        <div style="display:flex; justify-content: space-between;">
            <h3>📝 授業メイン</h3>
            <div id="reactions-btns">
                <button onclick="sendReact('👏')">👏</button>
                <button onclick="sendReact('😮')">😮</button>
                <button onclick="sendReact('👍')">👍</button>
            </div>
        </div>
        
        <div id="survey-area" style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom:10px; display:none;">
            <h4 id="q-title" style="margin:0;"></h4>
            <div id="q-options" style="margin-top:10px;"></div>
            <div id="q-res" style="margin-top:10px; border-top:1px solid #ddd;"></div>
        </div>

        <textarea id="my-note" style="flex-grow:1;" placeholder="ここにノートを取ります..."></textarea>
        
        <div class="only-teacher" style="margin-top:10px; border-top:2px solid #eee; padding-top:10px;">
            <input type="text" id="q-input" placeholder="アンケート質問">
            <input type="text" id="o-input" placeholder="選択肢 (改行かカンマ区切り)" style="margin-top:5px;">
            <button onclick="startSurvey()" style="margin-top:5px;">アンケート配信</button>
        </div>
    </section>

    <!-- 右サイド：タイマー・連絡 -->
    <section class="right-col">
        <div class="panel">
            <h3>⏰ タイマー</h3>
            <div id="timer-display">00:00</div>
            <div class="only-teacher">
                <input type="number" id="t-min" value="45" style="width:60px;"> 分
                <button onclick="setTimer()">開始</button>
            </div>
        </div>
        <div class="panel" style="margin-top:15px; flex-grow:1;">
            <h3>📢 掲示板</h3>
            <div id="board" style="background:#fff9c4; padding:10px; border-radius:5px; flex-grow:1; overflow-y:auto; font-size:0.9rem;"></div>
            <div class="only-teacher" style="margin-top:10px;">
                <input type="text" id="msg-input" placeholder="連絡内容...">
                <button onclick="sendMsg()" style="width:100%; margin-top:5px;">送信</button>
            </div>
        </div>
    </section>
</main>

<script>
    let channel, role, room, myName;
    let students = {}, hands = [], levels = {};
    let timerInt;

    function join(r) {
        room = document.getElementById('in-room').value;
        myName = document.getElementById('in-name').value || '匿名';
        if(!room) return alert("RoomID必須");
        role = r;
        document.body.classList.add(role === 'teacher' ? 'is-teacher' : 'is-student');
        document.getElementById('header').className = role + '-mode';
        document.getElementById('header-info').innerText = `Room: ${room} | Name: ${myName} (${role})`;
        
        channel = new BroadcastChannel('dx_class_' + room);
        channel.onmessage = handle;

        document.getElementById('setup-screen').style.display = 'none';
        
        // 入室通知
        send({ action: 'HELLO', name: myName, isTeacher: role==='teacher' });
        
        // 生徒ならノート読み込み
        if(role==='student') {
            document.getElementById('my-note').value = localStorage.getItem('dx_note_'+room) || '';
            document.getElementById('my-note').oninput = (e) => localStorage.setItem('dx_note_'+room, e.target.value);
        }
    }

    function send(data) { channel.postMessage(data); }

    function handle(e) {
        const d = e.data;
        if(d.action === 'HELLO') {
            if(!students[d.name]) {
                students[d.name] = { isTeacher: d.isTeacher, level: 100 };
                updateStudentList();
                if(role === 'teacher') send({ action: 'SYNC_LIST', students }); // 教員がリストを同期
            }
        }
        if(d.action === 'SYNC_LIST') { students = d.students; updateStudentList(); }
        if(d.action === 'REACT') showEmoji(d.emoji);
        if(d.action === 'LEVEL') { students[d.name].level = d.val; updateLevel(); }
        if(d.action === 'HAND') { handleHand(d.name, d.on); }
        if(d.action === 'MSG') {
            const b = document.getElementById('board');
            b.innerHTML += `<div><b>${d.sender}:</b> ${d.text}</div>`;
            b.scrollTop = b.scrollHeight;
        }
        if(d.action === 'TIMER') startTimer(d.endTime);
        if(d.action === 'SURVEY') showSurvey(d);
        if(d.action === 'SURVEY_RES') handleSurveyRes(d);
    }

    // --- 出席・理解度 ---
    function updateStudentList() {
        const list = document.getElementById('student-list');
        list.innerHTML = '';
        let count = 0;
        for(let s in students) {
            if(!students[s].isTeacher) {
                list.innerHTML += `<div class="list-item"><span>👤 ${s}</span></div>`;
                count++;
            }
        }
        document.getElementById('count-p').innerText = count;
    }

    function sendLevel(val) { send({ action: 'LEVEL', name: myName, val }); }
    function updateLevel() {
        let total = 0, count = 0;
        for(let s in students) {
            if(!students[s].isTeacher) {
                total += students[s].level; count++;
            }
        }
        const avg = count ? Math.round(total/count) : 0;
        document.getElementById('avg-val').innerText = avg;
        document.getElementById('avg-fill').style.width = avg + '%';
    }

    // --- 挙手 ---
    function toggleHand() {
        const btn = document.getElementById('hand-btn');
        const isOn = btn.innerText.includes('下ろす');
        btn.innerText = isOn ? "🖐 手を挙げる" : "✋ 手を下ろす";
        btn.style.background = isOn ? "#e67e22" : "#7f8c8d";
        send({ action: 'HAND', name: myName, on: !isOn });
    }
    function handleHand(name, on) {
        if(on) { if(!hands.includes(name)) hands.push(name); }
        else { hands = hands.filter(h => h !== name); }
        const list = document.getElementById('hand-list');
        list.innerHTML = hands.map(h => `<div class="list-item hand-on"><span>🙋 ${h}</span></div>`).join('');
    }

    // --- リアクション ---
    function sendReact(emoji) { send({ action: 'REACT', emoji }); showEmoji(emoji); }
    function showEmoji(emoji) {
        const el = document.createElement('div');
        el.className = 'floating-emoji';
        el.innerText = emoji;
        el.style.left = Math.random() * 80 + '%';
        document.getElementById('reaction-layer').appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }

    // --- 指名ルーレット ---
    function pickRandom() {
        const sList = Object.keys(students).filter(k => !students[k].isTeacher);
        if(!sList.length) return;
        const picked = sList[Math.floor(Math.random() * sList.length)];
        send({ action: 'MSG', sender: 'SYSTEM', text: `🎯 指名: <b>${picked}</b> さん、お願いします！` });
    }

    // --- その他基本機能 ---
    function sendMsg() {
        const text = document.getElementById('msg-input').value;
        send({ action: 'MSG', sender: myName, text });
        document.getElementById('msg-input').value = '';
        handle({ data: { action: 'MSG', sender: myName, text } }); // 自分にも表示
    }

    function setTimer() {
        const end = Date.now() + (document.getElementById('t-min').value * 60000);
        send({ action: 'TIMER', endTime: end });
        startTimer(end);
    }
    function startTimer(end) {
        clearInterval(timerInt);
        timerInt = setInterval(() => {
            const diff = end - Date.now();
            if(diff <= 0) { clearInterval(timerInt); document.getElementById('timer-display').innerText = "00:00"; return; }
            const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timer-display').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }

    // アンケート簡易版
    let surveyVotes = {};
    function startSurvey() {
        const q = document.getElementById('q-input').value;
        const opts = document.getElementById('o-input').value.split(/[,、\n]/).filter(v=>v);
        surveyVotes = {};
        opts.forEach(o => surveyVotes[o] = 0);
        send({ action: 'SURVEY', q, opts });
    }
    function showSurvey(d) {
        document.getElementById('survey-area').style.display = 'block';
        document.getElementById('q-title').innerText = "📊 " + d.q;
        const optDiv = document.getElementById('q-options');
        optDiv.innerHTML = d.opts.map(o => `<button onclick="vote('${o}')">${o}</button>`).join(' ');
        document.getElementById('q-res').innerHTML = '';
    }
    function vote(o) {
        send({ action: 'SURVEY_RES', opt: o });
        document.getElementById('q-options').innerHTML = "回答送信済み";
    }
    function handleSurveyRes(d) {
        if(!surveyVotes[d.opt]) surveyVotes[d.opt] = 0;
        surveyVotes[d.opt]++;
        const resDiv = document.getElementById('q-res');
        resDiv.innerHTML = Object.entries(surveyVotes).map(([k,v]) => `<div>${k}: ${v}票</div>`).join('');
    }

    setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
</script>
</body>
</html>
