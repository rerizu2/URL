<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture DX v21.0 | Ultimate Unified Suite</title>
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --bg-base: #05070a;
            --bg-sidebar: #0f121d;
            --bg-panel: #161b2c;
            --bg-card: #202638;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --secondary: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); overflow: hidden; height: 100vh; }

        /* Auth Overlay */
        #auth-overlay { position: fixed; inset: 0; background: var(--bg-base); display: flex; align-items: center; justify-content: center; z-index: 20000; }
        .auth-card { background: var(--bg-panel); padding: 40px; border-radius: 28px; width: 440px; border: 1px solid var(--border); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .input { background: var(--bg-base); border: 1px solid var(--border); padding: 14px; border-radius: 12px; color: white; width: 100%; margin-bottom: 15px; font-size: 1rem; }

        /* Master Layout */
        .app-shell { display: none; height: 100vh; grid-template-columns: 80px 1fr 300px; }
        .app-shell.active { display: grid; }

        /* Navigation Sidebar */
        nav.sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 30px 0; gap: 20px; }
        .nav-item { width: 54px; height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--text-sub); cursor: pointer; transition: 0.3s; position: relative; font-size: 1.5rem; }
        .nav-item:hover { background: var(--bg-card); color: white; }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 0 20px var(--primary-glow); }

        /* Main Content area */
        .content-area { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-base); }
        header { height: 70px; padding: 0 30px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(15,18,29,0.6); backdrop-filter: blur(10px); }
        
        .viewport { flex: 1; position: relative; padding: 20px; overflow: hidden; }
        .pane { position: absolute; inset: 20px; display: none; flex-direction: column; background: var(--bg-panel); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .pane.active { display: flex; animation: paneIn 0.4s ease-out; }
        @keyframes paneIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Right Sidebar (Chat & Reactions) */
        aside.right-bar { background: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .log-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .log-item { background: var(--bg-card); padding: 12px; border-radius: 12px; font-size: 0.85rem; border-left: 4px solid var(--primary); }

        /* Components */
        #note-editor, #note-viewer { flex: 1; padding: 30px; font-size: 1.2rem; line-height: 1.7; border: none; background: transparent; color: white; resize: none; overflow-y: auto; }
        #canvas-board { background: #fff; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
        
        .btn { padding: 12px 24px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-ghost { background: var(--bg-card); color: var(--text-sub); }
        .btn-ghost:hover { background: var(--bg-panel); color: white; }

        /* Special States */
        .teacher-only, .student-only { display: none !important; }
        body.is-teacher .teacher-only { display: flex !important; }
        body.is-teacher .teacher-block { display: block !important; }
        body.is-student .student-only { display: flex !important; }

        #video-wrap { background: #000; border-radius: 12px; margin-bottom: 20px; overflow: hidden; display: none; aspect-ratio: 16/9; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        #timer-big { font-size: 10rem; font-weight: 900; font-family: monospace; text-align: center; margin: 40px 0; color: var(--danger); text-shadow: 0 0 30px rgba(244, 63, 94, 0.3); }

        /* Survey Result Bars */
        .res-bar-container { margin-bottom: 15px; }
        .res-bar-outer { height: 12px; background: var(--bg-base); border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .res-bar-inner { height: 100%; background: var(--primary); transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }

        /* Floating Emoji Area */
        #emoji-layer { position: fixed; inset: 0; pointer-events: none; z-index: 15000; }
        .floating-emoji { position: absolute; bottom: -50px; font-size: 3rem; animation: floatUp 3s forwards; }
        @keyframes floatUp { to { transform: translateY(-110vh) rotate(20deg); opacity: 0; } }
    </style>
</head>
<body>

<div id="emoji-layer"></div>

<!-- 認証 -->
<div id="auth-overlay">
    <div class="auth-card">
        <h1 style="letter-spacing:-1px; margin-bottom:5px;">LECTURE DX <span style="color:var(--primary)">v21.0</span></h1>
        <p style="color:var(--text-sub); font-size:0.8rem; margin-bottom:35px; font-weight:bold;">Unified Command Suite</p>
        <input type="text" id="in-room-id" class="input" placeholder="ROOM ID (例: physics-01)">
        <input type="text" id="in-user-name" class="input" placeholder="あなたの名前">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
            <button class="btn btn-ghost" onclick="app.ignition('student')">生徒として参加</button>
            <button class="btn btn-primary" onclick="app.ignition('teacher')">教員として開始</button>
        </div>
    </div>
</div>

<div class="app-shell" id="app-shell">
    <!-- 左：ナビゲーション -->
    <nav class="sidebar">
        <div class="nav-item active" id="nav-note" onclick="app.switchPane('note')">📝</div>
        <div class="nav-item" id="nav-sketch" onclick="app.switchPane('sketch')">🎨</div>
        <div class="nav-item" id="nav-survey" onclick="app.switchPane('survey')">📊</div>
        <div class="nav-item" id="nav-timer" onclick="app.switchPane('timer')">⏰</div>
        <div class="nav-item teacher-only" id="nav-admin" onclick="app.switchPane('admin')">👥</div>
    </nav>

    <!-- 中：メインビュー -->
    <div class="content-area">
        <header>
            <div style="display:flex; align-items:center; gap:20px;">
                <span id="badge-role" style="background:var(--primary); padding:4px 12px; border-radius:8px; font-size:0.75rem; font-weight:bold; letter-spacing:1px;">---</span>
                <span id="disp-room" style="font-size:0.8rem; opacity:0.6; font-weight:bold;">ROOM: ---</span>
                <div id="header-timer" style="font-family:monospace; color:var(--warning); font-weight:bold; font-size:1.4rem;">00:00</div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="btn btn-ghost teacher-only" style="padding:6px 12px; font-size:0.75rem;" onclick="app.toggleScreenShare()" id="btn-share">🖥 画面共有</button>
                <button class="btn btn-ghost teacher-only" style="padding:6px 12px; font-size:0.75rem;" onclick="app.copyInvite()">招待URL</button>
                <div id="disp-clock" style="font-family:monospace; font-weight:bold; font-size:1rem; margin-left:10px;">00:00:00</div>
            </div>
        </header>

        <div class="viewport">
            <!-- ビデオ共有枠 -->
            <div id="video-wrap">
                <video id="remote-video" autoplay playsinline style="width:100%; height:100%; object-fit:contain;"></video>
            </div>

            <!-- ノート -->
            <div id="pane-note" class="pane active">
                <textarea id="note-editor" class="teacher-block" placeholder="ここに記入した内容がリアルタイムで生徒に配信されます..."></textarea>
                <div id="note-viewer" class="student-only" style="white-space:pre-wrap; opacity:0.9;">教員がノートを書き始めるの待っています...</div>
            </div>

            <!-- スケッチ -->
            <div id="pane-sketch" class="pane">
                <div style="padding:15px 25px; background:rgba(255,255,255,0.03); display:flex; justify-content:space-between; align-items:center;">
                    <div class="teacher-only" style="gap:15px; align-items:center;">
                        <input type="color" id="sk-color" value="#6366f1" style="width:40px; height:40px; border:none; background:none;">
                        <input type="range" id="sk-size" min="1" max="50" value="5">
                        <button class="btn btn-ghost" onclick="app.canvasClear()">消去</button>
                    </div>
                    <button id="btn-sk-vis" class="btn btn-danger teacher-only" onclick="app.toggleSketchVis()">非公開中</button>
                    <div class="student-only" style="font-weight:bold;">LECTURE SKETCH BOARD</div>
                </div>
                <div style="flex:1; background:#fff; position:relative;">
                    <div id="sk-lock" class="student-only" style="position:absolute; inset:0; background:rgba(0,0,0,0.85); z-index:10; display:flex; align-items:center; justify-content:center; color:var(--text-sub); font-weight:bold;">教員がボードを公開するまで待機してください</div>
                    <canvas id="canvas-board"></canvas>
                </div>
            </div>

            <!-- アンケート -->
            <div id="pane-survey" class="pane">
                <!-- 教員用：作成・管理 -->
                <div class="teacher-block" style="padding:40px; overflow-y:auto;">
                    <h2 style="margin-bottom:20px;">アンケート管理</h2>
                    <div style="background:var(--bg-card); padding:30px; border-radius:20px; border:1px solid var(--border); margin-bottom:30px;">
                        <input type="text" id="sv-q" class="input" placeholder="質問文を入力...">
                        <input type="text" id="sv-opts" class="input" placeholder="選択肢（カンマ区切り、例: はい,いいえ,微妙）">
                        <div style="display:flex; gap:10px;">
                            <button class="btn btn-primary" onclick="app.broadcastSurvey()">配信開始</button>
                            <button class="btn btn-danger" onclick="app.resetSurvey()">リセット</button>
                        </div>
                    </div>
                    <!-- 集計結果（教員は常に表示） -->
                    <div id="sv-teacher-results">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                            <h3>リアルタイム集計結果</h3>
                            <button id="btn-sv-share" class="btn btn-danger" onclick="app.toggleSurveyResultShare()">結果を生徒に非公開中</button>
                        </div>
                        <div id="sv-bars-area"></div>
                    </div>
                </div>
                <!-- 生徒用：結果表示 -->
                <div class="student-only" style="padding:40px;">
                    <h2>アンケート結果共有</h2>
                    <div id="sv-student-lock" style="padding:100px; text-align:center; color:var(--text-sub);">先生が結果を公開するまでお待ちください。</div>
                    <div id="sv-student-results" style="display:none;"></div>
                </div>
            </div>

            <!-- タイマー -->
            <div id="pane-timer" class="pane">
                <div style="padding:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
                    <div id="timer-big">00:00</div>
                    <div class="teacher-only" style="display:flex; gap:10px;">
                        <input type="number" id="t-min" class="input" style="width:100px; text-align:center; margin:0;" value="10">
                        <button class="btn btn-primary" onclick="app.startTimer()">タイマー開始</button>
                        <button class="btn btn-danger" onclick="app.stopTimer()">停止</button>
                    </div>
                </div>
            </div>

            <!-- クラス管理（教員のみ） -->
            <div id="pane-admin" class="pane teacher-block">
                <div style="padding:40px;">
                    <h2 style="margin-bottom:20px;">クラス管理・参加者リスト</h2>
                    <p style="color:var(--secondary); font-weight:bold; margin-bottom:25px; font-size:1.2rem;">現在接続中: <span id="user-count">0</span> 名</p>
                    <div id="user-list" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右：掲示板とリアクション -->
    <aside class="right-bar">
        <div class="log-area" id="log-area">
            <div class="log-item"><b>SYSTEM</b>: ルームに接続しました。</div>
        </div>
        <div style="padding:20px; border-top:1px solid var(--border); background:rgba(0,0,0,0.2);">
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:15px;">
                <button class="btn btn-ghost" onclick="app.emitEmoji('👏')">👏</button>
                <button class="btn btn-ghost" onclick="app.emitEmoji('👍')">👍</button>
                <button class="btn btn-ghost" onclick="app.emitEmoji('❓')">❓</button>
            </div>
            <div class="student-only">
                <button id="btn-hand" class="btn btn-primary" style="width:100%; background:var(--warning); color:black;" onclick="app.sendHand()">🖐 挙手 / 先生に質問</button>
            </div>
        </div>
    </aside>
</div>

<!-- アンケート回答ポップアップ（生徒用） -->
<div id="survey-popup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:25000; align-items:center; justify-content:center;">
    <div style="background:var(--bg-panel); padding:45px; border-radius:32px; border:2px solid var(--primary); width:450px; text-align:center;">
        <h2 id="pop-q" style="margin-bottom:25px;">質問を受信しました</h2>
        <div id="pop-opts" style="display:grid; gap:12px;"></div>
    </div>
</div>

<script>
class LectureDXUltimate {
    constructor() {
        this.peer = null;
        this.conns = new Map();
        this.participants = new Map(); // id -> name
        this.role = '';
        this.room = '';
        this.userName = '';
        this.sketchVis = false;
        this.survey = { active: false, q: '', opts: [], votes: {}, total: 0, shared: false };
        this.stream = null;
    }

    ignition(role) {
        this.role = role;
        this.room = document.getElementById('in-room-id').value.trim() || 'default';
        this.userName = document.getElementById('in-user-name').value.trim() || 'No Name';

        const pid = role === 'teacher' ? `ldx-${this.room}-host` : `ldx-${this.room}-${Math.random().toString(36).substr(2,6)}`;
        this.peer = new Peer(pid);

        this.peer.on('open', () => {
            document.body.classList.add(`is-${role}`);
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('app-shell').classList.add('active');
            document.getElementById('badge-role').innerText = role.toUpperCase();
            document.getElementById('disp-room').innerText = `ROOM: ${this.room}`;
            
            if(role === 'teacher') this.setupTeacher();
            else this.setupStudent();

            this.initNote();
            this.initCanvas();
        });

        this.peer.on('call', call => {
            call.answer();
            call.on('stream', s => {
                document.getElementById('video-wrap').style.display = 'block';
                document.getElementById('remote-video').srcObject = s;
            });
        });

        this.peer.on('error', () => {
            alert("IDエラーまたは接続失敗。IDが使われている可能性があります。");
            location.reload();
        });
    }

    // --- 通信コア ---
    setupTeacher() {
        this.peer.on('connection', conn => {
            conn.on('open', () => {
                this.conns.set(conn.peer, conn);
                conn.on('data', data => this.onData(data, conn));
                // 入室時に現在の状態を即座に送る
                this.syncToUser(conn);
            });
            conn.on('close', () => {
                this.conns.delete(conn.peer);
                this.participants.delete(conn.peer);
                this.updateAdminUI();
            });
        });
    }

    setupStudent() {
        this.hostConn = this.peer.connect(`ldx-${this.room}-host`);
        this.hostConn.on('open', () => {
            this.hostConn.send({ type: 'JOIN', name: this.userName });
        });
        this.hostConn.on('data', data => this.onData(data));
    }

    broadcast(data) {
        this.conns.forEach(c => c.send(data));
    }

    syncToUser(conn) {
        conn.send({ type: 'NOTE', text: document.getElementById('note-editor').value });
        conn.send({ type: 'SK_VIS', val: this.sketchVis });
        if(this.survey.active) conn.send({ type: 'SV_OPEN', q: this.survey.q, opts: this.survey.opts });
    }

    onData(data, conn = null) {
        switch(data.type) {
            case 'JOIN':
                this.participants.set(conn.peer, data.name);
                this.updateAdminUI();
                this.log('SYSTEM', `${data.name} さんが入室しました`);
                break;
            case 'NOTE':
                document.getElementById('note-viewer').innerText = data.text;
                break;
            case 'SKETCH':
                this.drawRemote(data.img);
                break;
            case 'SK_VIS':
                document.getElementById('sk-lock').style.display = data.val ? 'none' : 'flex';
                break;
            case 'SV_OPEN':
                this.openSurveyPopup(data);
                break;
            case 'SV_VOTE':
                this.tallyVote(data.opt);
                break;
            case 'SV_RESULT':
                this.renderResults(data.payload, 'sv-student-results');
                document.getElementById('sv-student-lock').style.display = data.shared ? 'none' : 'block';
                document.getElementById('sv-student-results').style.display = data.shared ? 'block' : 'none';
                break;
            case 'TIMER':
                this.syncTimer(data.end);
                break;
            case 'EMOJI':
                this.spawnEmoji(data.emoji);
                break;
            case 'HAND':
                this.log('挙手', `${data.name} さんが挙手 / 質問しています！`);
                break;
            case 'SHARE_STOP':
                document.getElementById('video-wrap').style.display = 'none';
                break;
        }
    }

    // --- UI制御 ---
    switchPane(id) {
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`pane-${id}`).classList.add('active');
        document.getElementById(`nav-${id}`).classList.add('active');
        if(id === 'sketch') this.resizeCanvas();
    }

    log(user, msg) {
        const area = document.getElementById('log-area');
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `<b>${user}</b>: ${msg}`;
        area.appendChild(item);
        area.scrollTop = area.scrollHeight;
    }

    updateAdminUI() {
        document.getElementById('user-count').innerText = this.participants.size;
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        this.participants.forEach(name => {
            const card = document.createElement('div');
            card.style.cssText = "background:var(--bg-card); padding:15px; border-radius:15px; border:1px solid var(--border); font-weight:bold;";
            card.innerText = `👤 ${name}`;
            list.appendChild(card);
        });
    }

    // --- 各機能 ---
    initNote() {
        const ed = document.getElementById('note-editor');
        if(this.role === 'teacher') {
            ed.oninput = () => this.broadcast({ type: 'NOTE', text: ed.value });
        }
    }

    initCanvas() {
        const cv = document.getElementById('canvas-board');
        const ctx = cv.getContext('2d');
        let drawing = false;
        this.resizeCanvas = () => { const r = cv.parentElement.getBoundingClientRect(); cv.width = r.width; cv.height = r.height; };
        if(this.role === 'teacher') {
            cv.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
            cv.onmousemove = (e) => {
                if(!drawing) return;
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = document.getElementById('sk-color').value;
                ctx.lineWidth = document.getElementById('sk-size').value;
                ctx.lineCap = 'round'; ctx.stroke();
            };
            cv.onmouseup = () => { drawing = false; this.broadcast({ type: 'SKETCH', img: cv.toDataURL() }); };
        }
        this.canvasClear = () => { ctx.clearRect(0,0,cv.width,cv.height); this.broadcast({ type: 'SKETCH', img: cv.toDataURL() }); };
    }

    drawRemote(data) {
        const cv = document.getElementById('canvas-board');
        const ctx = cv.getContext('2d');
        const img = new Image();
        img.onload = () => { ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(img, 0, 0); };
        img.src = data;
    }

    toggleSketchVis() {
        this.sketchVis = !this.sketchVis;
        const btn = document.getElementById('btn-sk-vis');
        btn.innerText = this.sketchVis ? '公開中' : '非公開中';
        btn.className = this.sketchVis ? 'btn btn-primary' : 'btn btn-danger';
        this.broadcast({ type: 'SK_VIS', val: this.sketchVis });
    }

    broadcastSurvey() {
        const q = document.getElementById('sv-q').value;
        const opts = document.getElementById('sv-opts').value.split(',').map(o => o.trim());
        this.survey = { active: true, q, opts, votes: Object.fromEntries(opts.map(o=>[o,0])), total: 0, shared: false };
        this.broadcast({ type: 'SV_OPEN', q, opts });
        this.renderResults(this.survey, 'sv-bars-area');
    }

    openSurveyPopup(data) {
        const pop = document.getElementById('survey-popup');
        const optArea = document.getElementById('pop-opts');
        document.getElementById('pop-q').innerText = data.q;
        optArea.innerHTML = '';
        pop.style.display = 'flex';
        data.opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'btn btn-primary';
            b.innerText = o;
            b.onclick = () => { this.hostConn.send({ type: 'SV_VOTE', opt: o }); pop.style.display = 'none'; };
            optArea.appendChild(b);
        });
    }

    tallyVote(opt) {
        if(this.survey.votes[opt] !== undefined) {
            this.survey.votes[opt]++;
            this.survey.total++;
            this.renderResults(this.survey, 'sv-bars-area');
            if(this.survey.shared) this.sendResultsToStudents();
        }
    }

    renderResults(data, areaId) {
        const area = document.getElementById(areaId);
        area.innerHTML = `<h3 style="margin-bottom:15px; color:var(--primary-light)">Q: ${data.q}</h3>`;
        data.opts.forEach(o => {
            const count = data.votes[o];
            const pct = data.total > 0 ? Math.round(count / data.total * 100) : 0;
            area.innerHTML += `
                <div class="res-bar-container">
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem;"><span>${o}</span><span>${count}名 (${pct}%)</span></div>
                    <div class="res-bar-outer"><div class="res-bar-inner" style="width:${pct}%"></div></div>
                </div>`;
        });
    }

    toggleSurveyResultShare() {
        this.survey.shared = !this.survey.shared;
        const btn = document.getElementById('btn-sv-share');
        btn.innerText = this.survey.shared ? '結果を生徒に公開中' : '結果を生徒に非公開中';
        btn.className = this.survey.shared ? 'btn btn-primary' : 'btn btn-danger';
        this.sendResultsToStudents();
    }

    sendResultsToStudents() {
        this.broadcast({ type: 'SV_RESULT', shared: this.survey.shared, payload: this.survey });
    }

    resetSurvey() {
        this.survey = { active: false, q: '', opts: [], votes: {}, total: 0, shared: false };
        this.broadcast({ type: 'SV_RESULT', shared: false, payload: this.survey });
        document.getElementById('sv-bars-area').innerHTML = '';
    }

    startTimer() {
        const end = Date.now() + document.getElementById('t-min').value * 60000;
        this.broadcast({ type: 'TIMER', end });
        this.syncTimer(end);
    }

    syncTimer(end) {
        if(this.timerItv) clearInterval(this.timerItv);
        const update = () => {
            const diff = end - Date.now();
            if(diff <= 0) {
                clearInterval(this.timerItv);
                document.getElementById('timer-big').innerText = "00:00";
                document.getElementById('header-timer').innerText = "00:00";
                return;
            }
            const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
            const str = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            document.getElementById('timer-big').innerText = str;
            document.getElementById('header-timer').innerText = str;
        };
        this.timerItv = setInterval(update, 1000); update();
    }

    stopTimer() { this.broadcast({ type: 'TIMER', end: Date.now() }); this.syncTimer(Date.now()); }

    emitEmoji(e) {
        this.spawnEmoji(e);
        if(this.role === 'teacher') this.broadcast({ type: 'EMOJI', emoji: e });
        else this.hostConn.send({ type: 'EMOJI', emoji: e });
    }

    spawnEmoji(e) {
        const div = document.createElement('div');
        div.className = 'floating-emoji'; div.innerText = e;
        div.style.left = `${Math.random()*80+10}%`;
        document.getElementById('emoji-layer').appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    sendHand() {
        this.hostConn.send({ type: 'HAND', name: this.userName });
        this.log('YOU', '挙手しました');
    }

    async toggleScreenShare() {
        if(this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
            this.stream = null;
            this.broadcast({ type: 'SHARE_STOP' });
            document.getElementById('video-wrap').style.display = 'none';
            document.getElementById('btn-share').innerText = '🖥 画面共有';
            return;
        }
        this.stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        document.getElementById('video-wrap').style.display = 'block';
        document.getElementById('remote-video').srcObject = this.stream;
        document.getElementById('btn-share').innerText = '共有停止';
        this.conns.forEach(c => this.peer.call(c.peer, this.stream));
    }

    copyInvite() {
        navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?room=${this.room}`);
        alert("招待用URLをコピーしました");
    }
}

const app = new LectureDXUltimate();

setInterval(() => {
    document.getElementById('disp-clock').innerText = new Date().toLocaleTimeString();
}, 1000);

const params = new URLSearchParams(window.location.search);
if(params.has('room')) document.getElementById('in-room-id').value = params.get('room');
