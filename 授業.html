<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>授業リアルタイム連携システム</title>
    <style>
        :root { --t-color: #2c3e50; --s-color: #27ae60; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: #333; }

        /* 入口画面 */
        #login-screen {
            position: fixed; inset: 0; background: #2c3e50; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .login-card { background: white; color: #333; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1.1rem; }
        .btn-t { background: var(--t-color); color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .btn-s { background: var(--s-color); color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* メイン画面 */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        header { padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .teacher-header { background: var(--t-color); }
        .student-header { background: var(--s-color); }

        .layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px; flex-grow: 1; overflow: hidden; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .hide { display: none; }
        .timer-val { font-size: 3rem; font-weight: bold; text-align: center; color: #e74c3c; margin: 10px 0; }

        /* アンケート */
        .survey-box { border: 3px solid var(--accent); border-radius: 12px; padding: 20px; background: #f0f8ff; }
        .opt-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; background: white; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; }
        .opt-btn:hover { background: #eef; }

        /* グラフ */
        .bar-wrap { background: #eee; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.5s; }
        
        textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<!-- 入室画面 -->
<div id="login-screen">
    <div class="login-card">
        <h2>授業ルームに参加</h2>
        <input type="text" id="room-input" placeholder="ルームID (例: 123)" maxlength="10">
        <button class="btn-t" onclick="initApp('teacher')">教員として入室</button>
        <button class="btn-s" onclick="initApp('student')">生徒として入室</button>
    </div>
</div>

<!-- メインUI -->
<div id="main-app">
    <header id="app-header">
        <div><b id="role-name"></b> | Room: <b id="room-id-name"></b></div>
        <div id="clock">00:00:00</div>
    </header>

    <div class="layout">
        <div style="overflow-y: auto;">
            <!-- 教員：アンケート作成パネル -->
            <div id="t-ctrl" class="panel hide">
                <h3 style="margin-top:0;">📊 アンケートを配信</h3>
                <input type="text" id="q-input" placeholder="質問文を入力" style="width:100%; padding:10px; margin-bottom:10px;">
                <textarea id="o-input" rows="3" placeholder="選択肢を改行で入力"></textarea>
                <button class="btn-t" style="margin-top:10px; background:var(--accent);" onclick="startSurvey()">アンケートを全員に配信開始</button>
                <button class="btn-t" style="background:#95a5a6;" onclick="resetSystem()">全員の画面をリセット</button>
            </div>

            <!-- 生徒：アンケート回答パネル -->
            <div id="s-ctrl" class="panel hide">
                <div id="s-wait">先生がアンケートを開始するまで待機中...</div>
                <div id="s-active" class="survey-box hide">
                    <h2 id="s-q-text" style="margin-top:0;"></h2>
                    <div id="s-opts"></div>
                </div>
            </div>

            <!-- 共通：集計結果パネル -->
            <div id="res-panel" class="panel hide">
                <h3 style="margin-top:0;">📈 リアルタイム集計</h3>
                <div id="res-list"></div>
            </div>

            <div id="s-note" class="panel hide">
                <h3>📝 個人ノート</h3>
                <textarea id="note-area" rows="10" placeholder="自分用のメモ帳です"></textarea>
            </div>
        </div>

        <aside>
            <div class="panel">
                <h3>⏰ タイマー</h3>
                <div id="timer-disp" class="timer-val">00:00</div>
                <div id="t-timer" class="hide">
                    <input type="number" id="t-min" value="45" style="width:60px; padding:5px;"> 分
                    <button onclick="sendTimer()" style="padding:5px 10px; cursor:pointer;">開始</button>
                </div>
            </div>
            <div class="panel" style="background:#fff9c4;">
                <strong>📢 先生からの連絡:</strong>
                <p id="msg-disp">なし</p>
                <div id="t-msg" class="hide" style="margin-top:10px;">
                    <input type="text" id="t-msg-in" style="width:70%;">
                    <button onclick="sendMsg()">送信</button>
                </div>
            </div>
        </aside>
    </div>
</div>

<script>
    let channel;
    let role = '';
    let survey = { active: false, options: [], votes: [], total: 0, q: "" };
    let timerInt;

    // 1. 初期化処理
    function initApp(selectedRole) {
        const room = document.getElementById('room-input').value.trim();
        if(!room) return alert("ルームIDを入力してください");
        
        role = selectedRole;
        channel = new BroadcastChannel('room_' + room);
        channel.onmessage = onMessage;

        // UI表示切り替え
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        document.getElementById('role-name').innerText = role === 'teacher' ? "教員" : "生徒";
        document.getElementById('room-id-name').innerText = room;
        document.getElementById('app-header').className = role === 'teacher' ? 'teacher-header' : 'student-header';

        if(role === 'teacher') {
            document.getElementById('t-ctrl').classList.remove('hide');
            document.getElementById('t-timer').classList.remove('hide');
            document.getElementById('t-msg').classList.remove('hide');
        } else {
            document.getElementById('s-ctrl').classList.remove('hide');
            document.getElementById('s-note').classList.remove('hide');
        }
    }

    // 2. 通信受信
    function onMessage(e) {
        const { type, data, endTime, msg, index } = e.data;

        // 教員がアンケートを開始した時
        if (type === 'START_SURVEY') {
            survey = data;
            if (role === 'student') {
                document.getElementById('s-wait').classList.add('hide');
                document.getElementById('s-active').classList.remove('hide');
                document.getElementById('s-q-text').innerText = survey.q;
                const area = document.getElementById('s-opts');
                area.innerHTML = '';
                survey.options.forEach((opt, i) => {
                    area.innerHTML += `<button class="opt-btn" onclick="submitVote(${i})">${opt}</button>`;
                });
            }
            renderResults();
        }

        // 生徒が投票した時（教員が受信）
        if (type === 'VOTE' && role === 'teacher') {
            survey.total++;
            survey.votes[index]++;
            // 最新の結果を全員に送る
            channel.postMessage({ type: 'SYNC_RES', data: survey });
            renderResults();
        }

        // 最新の集計結果を受信（全員）
        if (type === 'SYNC_RES') {
            survey = data;
            renderResults();
        }

        if (type === 'TIMER') startTimer(endTime);
        if (type === 'MSG') document.getElementById('msg-disp').innerText = msg;
        if (type === 'RESET') location.reload();
    }

    // --- 各種アクション ---

    function startSurvey() {
        const q = document.getElementById('q-input').value;
        const opts = document.getElementById('o-input').value.split('\n').filter(v => v.trim() !== "");
        if(!q || opts.length === 0) return alert("質問と選択肢を入力してください");

        survey = {
            active: true,
            q: q,
            options: opts,
            votes: new Array(opts.length).fill(0),
            total: 0
        };
        channel.postMessage({ type: 'START_SURVEY', data: survey });
        renderResults();
    }

    function submitVote(idx) {
        channel.postMessage({ type: 'VOTE', index: idx });
        document.getElementById('s-active').innerHTML = "<h3>送信完了！集計を待ってください。</h3>";
    }

    function renderResults() {
        document.getElementById('res-panel').classList.remove('hide');
        const area = document.getElementById('res-list');
        area.innerHTML = `<p>合計回答: ${survey.total} 票</p>`;
        survey.options.forEach((opt, i) => {
            const pct = survey.total === 0 ? 0 : Math.round((survey.votes[i] / survey.total) * 100);
            area.innerHTML += `
                <div style="margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
                        <span>${opt}</span><span>${survey.votes[i]}票 (${pct}%)</span>
                    </div>
                    <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
                </div>
            `;
        });
    }

    function sendTimer() {
        const endTime = Date.now() + (document.getElementById('t-min').value * 60 * 1000);
        channel.postMessage({ type: 'TIMER', endTime: endTime });
        startTimer(endTime);
    }

    function startTimer(endTime) {
        clearInterval(timerInt);
        timerInt = setInterval(() => {
            const diff = endTime - Date.now();
            if(diff <= 0) { clearInterval(timerInt); document.getElementById('timer-disp').innerText = "00:00"; return; }
            const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timer-disp').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }, 1000);
    }

    function sendMsg() {
        const txt = document.getElementById('t-msg-in').value;
        channel.postMessage({ type: 'MSG', msg: txt });
        document.getElementById('msg-disp').innerText = txt;
    }

    function resetSystem() { if(confirm("全員の画面をリセットしますか？")) channel.postMessage({ type: 'RESET' }); }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>

</body>
</html>
