<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture DX v15.0 Ultimate OS</title>
    <!-- PeerJS: 高性能リアルタイム通信 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* 
           =========================================
           1. MODERN DESIGN SYSTEM (v15.0)
           ========================================= 
        */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-deep: #05070a;
            --bg-main: #0c0f17;
            --bg-panel: #161b26;
            --bg-card: #202738;
            --bg-hover: #2d364f;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #475569;
            --secondary: #10b981;
            --accent: #f59e0b;
            --danger: #f43f5e;
            --border: rgba(255, 255, 255, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-lg: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', -apple-system, system-ui, sans-serif; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 10px; }

        /* 
           =========================================
           2. AUTHENTICATION (INITIAL)
           ========================================= 
        */
        #auth-overlay {
            position: fixed; inset: 0; background: radial-gradient(circle at top right, #1e1b4b, var(--bg-deep));
            display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .auth-card {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-xl);
            width: min(95vw, 420px); padding: 48px; box-shadow: var(--shadow-lg); text-align: center;
            animation: appFadeIn 0.8s ease;
        }
        @keyframes appFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .auth-logo { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; color: var(--primary); text-shadow: 0 0 30px var(--primary-glow); }
        .auth-subtitle { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 32px; }
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label { display: block; font-size: 0.7rem; color: var(--text-sub); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }
        .text-input {
            width: 100%; background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 14px 20px; color: white; font-size: 1rem; transition: var(--transition);
        }
        .text-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        /* 
           =========================================
           3. MAIN APP INTERFACE
           ========================================= 
        */
        .app-shell { display: none; height: 100vh; grid-template-columns: 80px 1fr; opacity: 0; transition: 0.8s; }
        .app-shell.active { display: grid; opacity: 1; }

        /* Left Navigation Bar */
        nav.sidebar {
            background: var(--bg-main); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px;
        }
        .nav-icon {
            width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: var(--text-sub); cursor: pointer; transition: var(--transition); position: relative;
        }
        .nav-icon:hover { background: var(--bg-hover); color: white; }
        .nav-icon.active { background: var(--primary); color: white; box-shadow: 0 0 20px var(--primary-glow); }
        .nav-icon::after {
            content: attr(data-tooltip); position: absolute; left: 65px; background: var(--bg-panel); color: white;
            font-size: 0.7rem; padding: 4px 10px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .nav-icon:hover::after { opacity: 1; left: 75px; }

        /* Top Header */
        header {
            height: 64px; background: var(--bg-main); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
        }
        .header-info { display: flex; align-items: center; gap: 20px; }
        .badge { padding: 4px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border: 1px solid var(--border); }
        .badge-teacher { color: var(--primary-light); background: var(--primary-glow); border-color: var(--primary); }
        .badge-student { color: var(--secondary); background: rgba(16, 185, 129, 0.1); border-color: var(--secondary); }

        /* Main Canvas Layout */
        .viewport { flex: 1; display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; overflow: hidden; }
        @media (max-width: 1100px) { .viewport { grid-template-columns: 1fr; } .side-chat { display: none; } }

        /* Panel System */
        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
        .panel-header { padding: 14px 20px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }
        .panel-body { padding: 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        /* 
           =========================================
           4. MODULE SPECIFICS (SURVEY, TIMER, ETC)
           ========================================= 
        */
        /* Video Streaming */
        #screen-view-module {
            background: #000; border-radius: var(--radius-lg); margin-bottom: 16px;
            display: none; position: relative; overflow: hidden; aspect-ratio: 16/9;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        #shared-video { width: 100%; height: 100%; object-fit: contain; }
        .live-label {
            position: absolute; top: 15px; left: 15px; background: var(--danger);
            color: white; padding: 5px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 900;
            display: flex; align-items: center; gap: 8px; z-index: 10;
        }
        .live-label::before { content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.2; transform: scale(1.5); } 100% { opacity: 1; transform: scale(1); } }

        /* Survey Overlay */
        #survey-interaction-overlay {
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.2), rgba(18, 21, 32, 0.95));
            border: 1px solid var(--primary); border-radius: var(--radius-lg);
            padding: 24px; margin-bottom: 16px; display: none; animation: slideDown 0.4s ease;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .survey-question { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }
        .survey-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .survey-opt-btn {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md);
            color: white; padding: 16px; text-align: left; cursor: pointer; transition: var(--transition);
        }
        .survey-opt-btn:hover { background: var(--primary); transform: translateY(-2px); }

        /* Floating Menu Buttons (Teacher) */
        .master-controls {
            position: fixed; bottom: 30px; left: 100px; right: 350px;
            background: var(--bg-panel); border: 1px solid var(--primary); border-radius: 50px;
            padding: 10px 25px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px var(--primary-glow);
            z-index: 1000; display: none;
        }

        /* 
           =========================================
           5. INTERACTIVE WORKSPACE
           ========================================= 
        */
        #note-editor {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            font-size: 1.1rem; line-height: 1.9; resize: none; outline: none; padding: 20px;
        }
        #sketch-module { display: none; flex: 1; flex-direction: column; padding: 10px; }
        #canvas-board { background: white; border-radius: var(--radius-md); flex: 1; cursor: crosshair; touch-action: none; }
        .canvas-controls { display: flex; gap: 12px; margin-bottom: 10px; background: var(--bg-base); padding: 10px; border-radius: 8px; align-items: center; }

        /* Timer UI */
        .timer-display {
            font-size: 4.5rem; font-weight: 900; font-family: 'JetBrains Mono', monospace;
            text-align: center; color: var(--danger); text-shadow: 0 0 30px rgba(244, 63, 94, 0.4);
            margin: 10px 0;
        }

        /* 
           =========================================
           6. COMPONENTS & BUTTONS
           ========================================= 
        */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px 24px; border-radius: var(--radius-md); border: none; cursor: pointer;
            font-weight: 800; font-size: 0.9rem; transition: var(--transition); color: white;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-sub); }
        .btn-ghost:hover { background: var(--bg-hover); color: white; }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); }
        .btn-sm { padding: 6px 12px; font-size: 0.7rem; }

        .only-teacher, .only-student { display: none !important; }
        body.is-teacher .only-teacher { display: flex !important; }
        body.is-teacher .only-teacher-block { display: block !important; }
        body.is-student .only-student { display: flex !important; }

        /* Reaction Stamp Layer */
        #reaction-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10000; overflow: hidden; }
        .float-emoji {
            position: absolute; bottom: -60px; font-size: 4rem; 
            animation: riseAndFade 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes riseAndFade {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            15% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { transform: translateY(-95vh) scale(1); opacity: 0; }
        }

        /* Student Card */
        .student-card {
            background: var(--bg-elevated); padding: 12px 16px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent; transition: 0.3s;
        }
        .student-card.hand-up { border-color: var(--accent); background: rgba(245, 158, 11, 0.1); }
    </style>
</head>
<body>

<!-- 入室認証オーバーレイ -->
<div id="auth-overlay">
    <div class="auth-card">
        <div class="auth-logo">LECTURE DX</div>
        <div class="auth-subtitle">Professional Dual-Link System v15.0</div>
        
        <div class="input-group" id="room-input-container">
            <label>ROOM IDENTIFIER</label>
            <input type="text" id="init-room-id" class="text-input" placeholder="例: tanaka-phys-201" spellcheck="false">
        </div>
        <div class="input-group">
            <label>DISPLAY NAME</label>
            <input type="text" id="init-user-name" class="text-input" placeholder="あなたのお名前">
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:30px;">
            <button class="btn btn-ghost" onclick="app.setup('student')">生徒として入室</button>
            <button class="btn btn-primary" id="host-trigger" onclick="app.setup('teacher')">教員として開始</button>
        </div>
        <p id="auth-status-log" style="margin-top:20px; font-size:0.7rem; color:var(--text-dim); font-weight:700;"></p>
    </div>
</div>

<div id="reaction-layer"></div>

<div class="app-shell" id="app-shell">
    <!-- サイド・ナビゲーションメニュー -->
    <nav class="sidebar">
        <div class="nav-icon active" data-tooltip="ホーム・メイン" onclick="app.setTool('main')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        </div>
        <div class="nav-icon" data-tooltip="スケッチボード" onclick="app.setTool('sketch')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 5 5"/><path d="m8.5 8.5 7 7"/></svg>
        </div>
        <div class="nav-icon only-teacher" data-tooltip="アンケート管理" onclick="app.toggleMenu('survey')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        </div>
        <div class="nav-icon only-teacher" data-tooltip="タイマー設定" onclick="app.toggleMenu('timer')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div class="nav-icon" data-tooltip="サウンド設定" onclick="app.unlockAudio()">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </div>
        <div style="margin-top:auto" class="nav-icon" data-tooltip="システム設定" onclick="alert('v15.0 Enterprise Mode')">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </nav>

    <div style="display:flex; flex-direction:column; overflow:hidden;">
        <!-- ヘッダーエリア -->
        <header>
            <div class="header-info">
                <span id="role-badge" class="badge">---</span>
                <span id="room-display-id" style="font-size:0.8rem; font-weight:800; color:var(--text-sub);">ROOM: --</span>
                <div id="p2p-status" style="width:10px; height:10px; border-radius:50%; background:var(--secondary);"></div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="only-teacher btn btn-ghost btn-sm" onclick="app.copyInviteUrl()">🔗 生徒用招待URLをコピー</button>
                <button class="only-teacher btn btn-primary btn-sm" id="btn-master-share" onclick="app.toggleScreenShare()">🖥 画面共有開始</button>
                <span id="digital-clock" style="font-family: monospace; font-size: 0.9rem; font-weight:bold; margin-left:15px;">00:00:00</span>
            </div>
        </header>

        <main class="viewport">
            <!-- 中央メインステージ -->
            <section style="display:flex; flex-direction:column; overflow:hidden;">
                
                <!-- 教員ビデオ共有配信 -->
                <div id="screen-view-module">
                    <div class="live-label">LECTURE STREAMING</div>
                    <video id="remote-video" autoplay playsinline></video>
                </div>

                <!-- アンケート同期モジュール -->
                <div id="survey-interaction-overlay">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div id="sv-question-label" class="survey-question">質問を受信しています...</div>
                        <div class="only-teacher" style="display:flex; gap:10px;">
                            <button class="btn btn-ghost btn-sm" id="sv-vis-toggle" onclick="app.toggleSurveyResultsVis()">結果を非公開にする</button>
                            <button class="btn btn-danger btn-sm" onclick="app.terminateSurvey()">アンケート終了</button>
                        </div>
                    </div>
                    <div id="sv-choices-area" class="survey-choices"></div>
                    <div id="sv-results-area" style="margin-top:24px; border-top:1px dashed var(--border); padding-top:20px;">
                        <div style="font-size:0.7rem; color:var(--text-sub); font-weight:800; margin-bottom:15px;">クラス集計データ (<span id="sv-vote-count">0</span> votes)</div>
                        <div id="sv-results-list"></div>
                    </div>
                </div>

                <!-- ノート & キャンバス -->
                <div class="panel" style="flex:1;">
                    <div class="panel-header" style="background:transparent; border-bottom:none;">
                        <span id="workspace-title">Class Note</span>
                        <div style="display:flex; gap:15px; align-items:center;">
                            <span id="sync-indicator" style="font-size:0.6rem; color:var(--secondary)">● Online Sync</span>
                            <button class="btn btn-ghost btn-sm" onclick="app.exportNote()">Export .txt</button>
                        </div>
                    </div>
                    
                    <textarea id="note-editor" spellcheck="false" placeholder="授業内容をメモしてください（自動保存されます）"></textarea>
                    
                    <div id="sketch-module">
                        <div class="canvas-controls">
                            <input type="color" id="sk-color" value="#6366f1" style="width:34px; height:34px; border:none; background:none; cursor:pointer;">
                            <input type="range" id="sk-size" min="1" max="100" value="5" style="width:120px;">
                            <div style="border-left:1px solid var(--border); height:24px; margin:0 10px;"></div>
                            <button class="btn btn-ghost btn-sm" onclick="app.undoCanvas()">元に戻す</button>
                            <button class="btn btn-ghost btn-sm" onclick="app.clearCanvas()">全消去</button>
                            <button class="btn btn-primary btn-sm" onclick="app.saveCanvas()">PNG保存</button>
                        </div>
                        <canvas id="canvas-board"></canvas>
                    </div>
                </div>
            </section>

            <!-- 右サイド：掲示板 & ステータス -->
            <aside class="side-chat" style="display:flex; flex-direction:column; gap:16px;">
                <div class="panel" style="height: 250px;">
                    <div class="panel-header">出席・挙手リスト</div>
                    <div class="panel-body" id="roster-list"></div>
                </div>

                <div class="panel" style="flex:1;">
                    <div class="panel-header">
                        公式掲示板
                        <div style="display:flex; gap:5px;">
                            <button class="btn btn-ghost btn-sm" style="padding:0 5px;" onclick="app.emitEmoji('👏')">👏</button>
                            <button class="btn btn-ghost btn-sm" style="padding:0 5px;" onclick="app.emitEmoji('🔥')">🔥</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div id="board-messages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px;"></div>
                        <div class="only-teacher" style="margin-top:15px; border-top:1px solid var(--border); padding-top:15px;">
                            <textarea id="teacher-msg-input" class="text-input" style="padding:10px; font-size:0.85rem;" rows="2" placeholder="全員へ連絡を投稿..."></textarea>
                            <button class="btn btn-primary btn-sm" style="width:100%; margin-top:8px;" onclick="app.postBulletin()">掲示板に投稿</button>
                        </div>
                    </div>
                </div>

                <!-- タイマー（ミニ） -->
                <div class="panel">
                    <div class="panel-header">Timer</div>
                    <div class="panel-body">
                        <div id="timer-display-val" class="timer-display" style="font-size:2.5rem; margin:0;">00:00</div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- 教員用マスターメニュー（オーバーレイ型） -->
    <div id="teacher-menu-survey" class="master-controls only-teacher-block">
        <span style="font-weight:bold; font-size:0.7rem; color:var(--primary); margin-right:10px;">SURVEY BUILDER</span>
        <select id="adm-sv-type" class="text-input" style="width:100px; padding:5px;">
            <option value="single">単一</option><option value="multi">複数</option><option value="scale">5段階</option><option value="text">記述</option>
        </select>
        <input type="text" id="adm-sv-q" class="text-input" style="flex:2; padding:5px;" placeholder="質問文...">
        <input type="text" id="adm-sv-opt" class="text-input" style="flex:2; padding:5px;" placeholder="選択肢 (A,B,C...)">
        <button class="btn btn-primary btn-sm" onclick="app.igniteSurvey()">配信</button>
        <button class="btn btn-ghost btn-sm" onclick="app.toggleMenu('survey')">✖</button>
    </div>

    <div id="teacher-menu-timer" class="master-controls only-teacher-block">
        <span style="font-weight:bold; font-size:0.7rem; color:var(--primary); margin-right:10px;">PRECISION TIMER</span>
        <input type="number" id="t-min" class="text-input" style="width:70px; padding:5px;" value="45"> 分
        <input type="number" id="t-sec" class="text-input" style="width:70px; padding:5px;" value="0"> 秒
        <button class="btn btn-primary btn-sm" onclick="app.broadcastTimer()">開始</button>
        <button class="btn btn-danger btn-sm" onclick="app.resetTimer()">リセット</button>
        <button class="btn btn-ghost btn-sm" onclick="app.toggleMenu('timer')">✖</button>
    </div>
</div>

<script>
/**
 * LECTURE DX ULTIMATE v15.0
 * COMPLETE INTEGRATED ENGINE
 */

class UltimateEngine {
    constructor() {
        this.peer = null;
        this.connections = new Map(); // 教員用
        this.hostConn = null;         // 生徒用
        this.role = '';
        this.roomId = '';
        this.userName = '';
        this.roster = new Map();
        this.surveyCtx = null;
        this.timer = null;
        this.stream = null;
        this.handState = false;
        this.canvasHistory = [];
        
        // 音響合成エンジン
        this.audioCtx = null;
    }

    /* 1. INITIALIZATION */
    async setup(role) {
        this.roomId = document.getElementById('init-room-id').value.trim();
        this.userName = document.getElementById('init-user-name').value.trim() || 'No Name';
        if (!this.roomId) return alert('ROOM IDを入力してください');

        this.role = role;
        document.getElementById('auth-status-log').innerText = 'Initializing P2P Secure Layer...';

        const pid = role === 'teacher' ? `ldx-v15-${this.roomId}-host` : `ldx-v15-${this.roomId}-cl-${Math.random().toString(36).substr(2, 6)}`;
        this.peer = new Peer(pid);

        this.peer.on('open', (id) => {
            this.buildAppUI();
            if (role === 'teacher') this.startHost();
            else this.startClient();
        });

        this.peer.on('error', (err) => {
            alert('接続エラー: ' + err.type + '\nルームIDを確認してください。');
            location.reload();
        });

        this.peer.on('call', (call) => {
            call.answer();
            call.on('stream', (st) => {
                document.getElementById('screen-view-module').style.display = 'block';
                document.getElementById('remote-video').srcObject = st;
            });
        });
    }

    buildAppUI() {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('app-shell').classList.add('active');
        document.body.classList.add(this.role === 'teacher' ? 'is-teacher' : 'is-student');
        document.getElementById('role-badge').innerText = this.role;
        document.getElementById('role-badge').className = `badge badge-${this.role}`;
        document.getElementById('room-display-id').innerText = `ROOM ID: ${this.roomId}`;
        
        this.initPersistentStorage();
        this.initCanvasLayer();
    }

    /* 2. COMMUNICATION LAYER */
    startHost() {
        this.peer.on('connection', (conn) => {
            conn.on('open', () => {
                this.connections.set(conn.peer, conn);
                conn.on('data', (d) => this.processPacket(d, conn));
                // 新規生徒への状態同期
                if (this.surveyCtx) conn.send({ type: 'SV_SYNC', payload: this.surveyCtx });
            });
            conn.on('close', () => {
                this.connections.delete(conn.peer);
                this.roster.delete(conn.peer);
                this.syncRosterState();
            });
        });
    }

    startClient() {
        this.hostConn = this.peer.connect(`ldx-v15-${this.roomId}-host`, { reliable: true });
        this.hostConn.on('open', () => {
            this.hostConn.send({ type: 'HELLO', name: this.userName });
        });
        this.hostConn.on('data', (d) => this.processPacket(d));
        this.hostConn.on('close', () => {
            alert('教員がセッションを終了しました。');
            location.reload();
        });
    }

    broadcast(data) {
        this.connections.forEach(c => { if (c.open) c.send(data); });
    }

    processPacket(d, sender = null) {
        switch (d.type) {
            case 'HELLO':
                this.roster.set(sender.peer, { name: d.name, level: 100, hand: false });
                this.syncRosterState();
                break;
            case 'ROSTER_SYNC':
                this.renderRosterUI(d.payload);
                break;
            case 'LV_CHANGE':
                if (this.role === 'teacher') {
                    const s = this.roster.get(sender.peer);
                    if (s) s.level = d.val;
                    this.syncRosterState();
                }
                break;
            case 'HAND_SIGNAL':
                if (this.role === 'teacher') {
                    const s = this.roster.get(sender.peer);
                    if (s) {
                        s.hand = d.val;
                        if (d.val) this.beep(523, 'sine', 0.2); // Do
                    }
                    this.syncRosterState();
                }
                break;
            case 'SV_IGNITE':
            case 'SV_SYNC':
                this.surveyCtx = d.payload;
                this.renderSurveyUI(d.payload);
                break;
            case 'SV_VOTE':
                if (this.role === 'teacher') this.tallySurveyVote(d.val);
                break;
            case 'SV_TERM':
                this.surveyCtx = null;
                document.getElementById('survey-interaction-overlay').style.display = 'none';
                break;
            case 'TIMER_TICK':
                this.updateTimerUI(d.end);
                break;
            case 'TIMER_KILL':
                clearInterval(this.timer);
                document.getElementById('timer-display-val').innerText = '00:00';
                break;
            case 'ANN':
                this.renderAnnouncement(d.sender, d.msg);
                if (this.role === 'teacher') this.broadcast(d);
                break;
            case 'REACT':
                this.popEmoji(d.emoji);
                if (this.role === 'teacher') this.broadcast(d);
                break;
            case 'SHARE_OFF':
                document.getElementById('screen-view-module').style.display = 'none';
                break;
        }
    }

    /* 3. SURVEY ENGINE (アドバンスド) */
    igniteSurvey() {
        const q = document.getElementById('adm-sv-q').value.trim();
        const t = document.getElementById('adm-sv-type').value;
        let o = document.getElementById('adm-sv-opt').value.split(',').map(s=>s.trim()).filter(Boolean);
        if (!q) return alert('質問を入力してください');
        if (t === 'scale') o = ['1:Bad','2','3','4','5:Good'];

        this.surveyCtx = {
            type: t, question: q, options: o,
            votes: t === 'text' ? [] : Object.fromEntries(o.map(v => [v, 0])),
            total: 0, showResults: true
        };
        this.broadcast({ type: 'SV_IGNITE', payload: this.surveyCtx });
        this.renderSurveyUI(this.surveyCtx);
        this.toggleMenu('survey');
    }

    tallySurveyVote(val) {
        if (!this.surveyCtx) return;
        this.surveyCtx.total++;
        if (this.surveyCtx.type === 'text') this.surveyCtx.votes.push(val);
        else if (Array.isArray(val)) val.forEach(v => { if (this.surveyCtx.votes[v] !== undefined) this.surveyCtx.votes[v]++; });
        else if (this.surveyCtx.votes[val] !== undefined) this.surveyCtx.votes[val]++;
        
        this.broadcast({ type: 'SV_SYNC', payload: this.surveyCtx });
        this.renderSurveyUI(this.surveyCtx);
    }

    renderSurveyUI(data) {
        const over = document.getElementById('survey-interaction-overlay');
        over.style.display = 'block';
        document.getElementById('sv-question-label').innerText = "📊 " + data.question;
        document.getElementById('sv-vote-count').innerText = data.total;

        const ui = document.getElementById('sv-choices-area');
        ui.innerHTML = '';
        if (this.role === 'student') {
            if (data.type === 'text') {
                ui.innerHTML = `<input type="text" id="sv-inp-text" class="text-input" placeholder="回答を入力...">
                                <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="app.submitVote()">送信</button>`;
            } else {
                data.options.forEach(opt => {
                    const b = document.createElement('button');
                    b.className = 'survey-opt-btn';
                    b.innerText = opt;
                    b.onclick = () => { app.submitVote(opt); ui.innerHTML = '✓ Sent'; };
                    ui.appendChild(b);
                });
            }
        }

        const list = document.getElementById('sv-results-list');
        if (this.role === 'student' && !data.showResults) {
            list.innerHTML = '<div style="text-align:center; padding:15px; color:var(--text-dim);">結果は非公開です</div>';
            return;
        }

        list.innerHTML = '';
        if (data.type === 'text') {
            data.votes.slice().reverse().forEach(v => {
                list.innerHTML += `<div style="background:var(--bg-card); padding:8px; border-radius:6px; margin-bottom:5px; font-size:0.8rem;">${v}</div>`;
            });
        } else {
            data.options.forEach(o => {
                const count = data.votes[o];
                const pct = data.total ? Math.round(count / data.total * 100) : 0;
                list.innerHTML += `
                    <div style="font-size:0.75rem; display:flex; justify-content:space-between; margin-bottom:4px;"><span>${o}</span><span>${count} (${pct}%)</span></div>
                    <div style="height:6px; background:var(--bg-base); border-radius:3px; margin-bottom:12px; overflow:hidden;"><div style="width:${pct}%; height:100%; background:var(--primary); transition:1s;"></div></div>`;
            });
        }
    }

    submitVote(v = null) {
        const val = v || document.getElementById('sv-inp-text').value.trim();
        if (this.hostConn) this.hostConn.send({ type: 'SV_VOTE', val: val });
    }

    toggleSurveyResultsVis() {
        if (!this.surveyCtx) return;
        this.surveyCtx.showResults = !this.surveyCtx.showResults;
        this.broadcast({ type: 'SV_SYNC', payload: this.surveyCtx });
        this.renderSurveyUI(this.surveyCtx);
        document.getElementById('sv-vis-toggle').innerText = this.surveyCtx.showResults ? '結果を非公開にする' : '結果を表示する';
    }

    terminateSurvey() {
        this.surveyCtx = null;
        this.broadcast({ type: 'SV_TERM' });
        document.getElementById('survey-interaction-overlay').style.display = 'none';
    }

    /* 4. CLASSROOM COMMANDS */
    broadcastTimer() {
        const m = parseInt(document.getElementById('t-min').value) || 0;
        const s = parseInt(document.getElementById('t-sec').value) || 0;
        const end = Date.now() + (m * 60 + s) * 1000;
        this.broadcast({ type: 'TIMER_TICK', end });
        this.updateTimerUI(end);
        this.toggleMenu('timer');
    }

    updateTimerUI(end) {
        clearInterval(this.timer);
        const el = document.getElementById('timer-display-val');
        const update = () => {
            const diff = end - Date.now();
            if (diff <= 0) {
                clearInterval(this.timer);
                el.innerText = '00:00';
                if (this.role === 'teacher') this.beep(880, 'square', 1);
                return;
            }
            const min = Math.floor(diff / 60000);
            const sec = Math.floor((diff % 60000) / 1000);
            el.innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        };
        update();
        this.timer = setInterval(update, 1000);
    }

    resetTimer() {
        clearInterval(this.timer);
        document.getElementById('timer-display-val').innerText = '00:00';
        this.broadcast({ type: 'TIMER_KILL' });
    }

    async toggleScreenShare() {
        const btn = document.getElementById('btn-master-share');
        if (this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
            this.stream = null;
            btn.innerText = '画面共有開始';
            document.getElementById('screen-view-module').style.display = 'none';
            this.broadcast({ type: 'SHARE_OFF' });
            return;
        }
        try {
            this.stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('screen-view-module').style.display = 'block';
            document.getElementById('remote-video').srcObject = this.stream;
            btn.innerText = '共有停止';
            this.connections.forEach(c => this.peer.call(c.peer, this.stream));
            this.stream.getVideoTracks()[0].onended = () => this.toggleScreenShare();
        } catch (e) { console.error(e); }
    }

    syncRosterState() {
        const d = Array.from(this.roster.values());
        this.broadcast({ type: 'ROSTER_SYNC', payload: d });
        this.renderRosterUI(d);
    }

    renderRosterUI(list) {
        const area = document.getElementById('roster-list');
        area.innerHTML = '';
        document.getElementById('user-count').innerText = list.length;
        list.forEach(u => {
            const el = document.createElement('div');
            el.className = `student-card ${u.hand ? 'hand-up' : ''}`;
            el.innerHTML = `<span>👤 ${u.name}</span><span>${u.hand ? '🖐 Raising' : ''}</span>`;
            area.appendChild(el);
        });
    }

    postBulletin() {
        const m = document.getElementById('teacher-msg-input').value.trim();
        if (!m) return;
        this.renderAnnouncement(this.userName + ' (Teacher)', m);
        this.broadcast({ type: 'ANN', sender: this.userName + ' (Teacher)', msg: m });
        document.getElementById('teacher-msg-input').value = '';
    }

    renderAnnouncement(s, m) {
        const b = document.getElementById('board-messages');
        const d = document.createElement('div');
        d.style.background = 'var(--bg-card)'; d.style.padding = '10px'; d.style.borderRadius = '10px';
        d.innerHTML = `<strong style="color:var(--primary); font-size:0.65rem;">${s}</strong><div style="margin-top:5px; line-height:1.5; font-size:0.85rem;">${m}</div>`;
        b.appendChild(d); b.scrollTop = b.scrollHeight;
    }

    emitEmoji(emoji) {
        this.popEmoji(emoji);
        if (this.role === 'teacher') this.broadcast({ type: 'REACT', emoji: emoji });
        else if (this.hostConn) this.hostConn.send({ type: 'REACT', emoji: emoji });
    }

    popEmoji(emoji) {
        const layer = document.getElementById('reaction-layer');
        const div = document.createElement('div');
        div.className = 'float-emoji'; div.innerText = emoji;
        div.style.left = `${Math.random() * 80 + 10}%`;
        layer.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    /* 5. TOOLS & WORKSPACE */
    setTool(tool) {
        document.querySelectorAll('.nav-icon').forEach(n => n.classList.remove('active'));
        const editor = document.getElementById('note-editor');
        const sketch = document.getElementById('sketch-module');
        if (tool === 'main') {
            editor.style.display = 'block'; sketch.style.display = 'none';
            document.querySelector('[data-tooltip="ホーム・メイン"]').classList.add('active');
        } else if (tool === 'sketch') {
            editor.style.display = 'none'; sketch.style.display = 'flex';
            document.querySelector('[data-tooltip="スケッチボード"]').classList.add('active');
        }
    }

    toggleMenu(type) {
        const surveyMenu = document.getElementById('teacher-menu-survey');
        const timerMenu = document.getElementById('teacher-menu-timer');
        if (type === 'survey') {
            surveyMenu.style.display = (surveyMenu.style.display === 'flex') ? 'none' : 'flex';
            timerMenu.style.display = 'none';
        } else if (type === 'timer') {
            timerMenu.style.display = (timerMenu.style.display === 'flex') ? 'none' : 'flex';
            surveyMenu.style.display = 'none';
        }
    }

    initPersistentStorage() {
        const ed = document.getElementById('note-editor');
        const key = `ldx_v15_note_${this.roomId}`;
        ed.value = localStorage.getItem(key) || '';
        ed.oninput = () => {
            localStorage.setItem(key, ed.value);
            document.getElementById('sync-indicator').innerText = '● Saving...';
            setTimeout(() => { document.getElementById('sync-indicator').innerText = '● Online Sync'; }, 1000);
        };
    }

    initCanvasLayer() {
        const cv = document.getElementById('canvas-board');
        const ctx = cv.getContext('2d');
        let draw = false;
        const resize = () => {
            const dpr = window.devicePixelRatio || 1;
            const b = cv.getBoundingClientRect();
            cv.width = b.width * dpr; cv.height = b.height * dpr;
            ctx.scale(dpr, dpr);
        };
        window.addEventListener('resize', resize); resize();

        const start = (e) => { 
            draw = true; ctx.beginPath();
            const r = cv.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            ctx.moveTo(x, y);
            this.canvasHistory.push(ctx.getImageData(0,0,cv.width,cv.height));
        };
        const move = (e) => {
            if (!draw) return;
            const r = cv.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            ctx.lineWidth = document.getElementById('sk-size').value;
            ctx.lineCap = 'round'; ctx.strokeStyle = document.getElementById('sk-color').value;
            ctx.lineTo(x, y); ctx.stroke();
        };
        cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', () => draw = false);
        cv.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }); cv.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); });
        this.clearCanvas = () => ctx.clearRect(0, 0, cv.width, cv.height);
        this.undoCanvas = () => { if (this.canvasHistory.length) ctx.putImageData(this.canvasHistory.pop(), 0, 0); };
        this.saveCanvas = () => { const a = document.createElement('a'); a.download = `sketch.png`; a.href = cv.toDataURL(); a.click(); };
    }

    /* 6. AUDIO & UTILS */
    unlockAudio() {
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        this.playSfx(440, 'sine', 0.1);
        alert('Sound System Activated');
    }

    playSfx(freq, type, dur) {
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(this.audioCtx.destination);
        osc.start(); osc.stop(this.audioCtx.currentTime + dur);
    }

    beep(freq, type, dur) { this.playSfx(freq, type, dur); }

    copyInviteUrl() {
        const u = `${window.location.origin}${window.location.pathname}?room=${this.roomId}&role=student`;
        navigator.clipboard.writeText(u); alert('Invitation URL Copied!');
    }
}

// OS Launcher
const app = new UltimateEngine();

// UI Lifecycle
setInterval(() => {
    document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString();
}, 1000);

window.addEventListener('load', () => {
    const p = new URLSearchParams(window.location.search);
    const r = p.get('room');
    if (r) {
        document.getElementById('init-room-id').value = r;
        if (p.get('role') === 'student') {
            document.getElementById('host-trigger').style.display = 'none';
            document.getElementById('room-input-container').style.display = 'none';
        }
    }
});
</script>
