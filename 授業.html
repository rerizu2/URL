<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture DX OS v34.0 | Ultra-Resilient Architecture</title>
    
    <!-- External Dependencies -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        /* 
           =============================================================
           1. DESIGN SYSTEM - CORE VARIABLES
           ============================================================= 
        */
        :root {
            --p-color: #6366f1;
            --p-light: #818cf8;
            --p-glow: rgba(99, 102, 241, 0.4);
            --bg-base: #05070a;
            --bg-sidebar: #0d1117;
            --bg-panel: #12161f;
            --bg-card: #1c212c;
            --bg-input: #010409;
            --text-vivid: #f0f6fc;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-success: #238636;
            --accent-error: #da3633;
            --accent-warn: #d29922;
            --border: #30363d;
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --font-main: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        html, body { height: 100%; width: 100%; background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-main); overflow: hidden; display: flex; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); }
        ::-webkit-scrollbar-thumb:hover { background: var(--p-color); }

        /* 2. BOOT LOADER */
        #os-boot-loader {
            position: fixed; inset: 0; z-index: 99999;
            background: radial-gradient(circle at center, #1a1c2e 0%, var(--bg-base) 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .boot-card {
            width: min(90vw, 520px); background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; padding: 70px; box-shadow: 0 40px 100px rgba(0,0,0,0.8); text-align: center; backdrop-filter: blur(30px);
            animation: dx-entry 0.8s ease;
        }
        @keyframes dx-entry { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .boot-logo { font-size: 3.5rem; font-weight: 900; letter-spacing: -3px; margin-bottom: 10px; background: linear-gradient(135deg, #fff, var(--p-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .boot-version { font-family: var(--font-code); font-size: 0.8rem; color: var(--text-dim); margin-bottom: 50px; opacity: 0.6; }
        
        .input-group { text-align: left; margin-bottom: 25px; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; }
        .dx-input, .dx-select { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 14px; padding: 18px 25px; color: white; font-size: 1rem; transition: var(--transition); }
        .dx-input:focus, .dx-select:focus { border-color: var(--p-color); box-shadow: 0 0 0 4px var(--p-glow); }

        .btn-boot { width: 100%; padding: 20px; border-radius: 16px; font-weight: 900; cursor: pointer; transition: var(--transition); border: none; text-transform: uppercase; letter-spacing: 1px; }
        .btn-p { background: var(--p-color); color: white; margin-bottom: 15px; }
        .btn-p:hover { background: var(--p-light); transform: translateY(-2px); }
        .btn-s { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
        .btn-s:hover { color: white; border-color: white; }

        /* 3. MAIN APP SHELL */
        #app-shell { display: none; width: 100%; height: 100%; grid-template-columns: 90px 1fr 350px; }
        #app-shell.active { display: grid; }

        .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 35px 0; gap: 20px; }
        .sidebar-brand { font-weight: 900; font-size: 1.6rem; color: var(--p-color); margin-bottom: 30px; cursor: pointer; }
        .nav-tool { width: 55px; height: 55px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer; transition: var(--transition); position: relative; }
        .nav-tool:hover { background: var(--bg-card); color: white; transform: translateX(5px); }
        .nav-tool.active { background: var(--p-color); color: white; box-shadow: 0 10px 25px var(--p-glow); }
        
        body.is-student .nav-tool.nav-survey { display: none; opacity: 0; }
        body.is-student .nav-tool.nav-survey.active-survey { display: flex; opacity: 1; animation: menu-reveal 0.5s forwards; }

        .nav-tool::after { content: attr(data-tip); position: absolute; left: 85px; background: #000; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 0.8rem; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; }
        .nav-tool:hover::after { opacity: 1; left: 95px; }

        .viewport { display: flex; flex-direction: column; background: var(--bg-base); border-right: 1px solid var(--border); overflow: hidden; position: relative; }
        .top-bar { height: 80px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(25px); border-bottom: 1px solid #30363d; z-index: 100; }
        
        .status-pill { padding: 6px 16px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; border: 1.5px solid var(--border); text-transform: uppercase; }
        .status-teacher { background: rgba(248, 81, 73, 0.1); color: #f85149; border-color: #f85149; }
        .status-student { background: rgba(63, 185, 80, 0.1); color: #3fb950; border-color: #3fb950; }
        .status-offline { background: #333; color: #777; border-color: #444; animation: offlinePulse 2s infinite; }
        @keyframes offlinePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* 4. PERSISTENT VIDEO */
        #persistent-stream-container { width: 100%; max-height: 45vh; background: #000; border-bottom: 2px solid var(--p-color); display: none; flex-direction: column; position: relative; overflow: hidden; flex-shrink: 0; }
        #remote-video { width: 100%; height: 100%; max-height: 45vh; object-fit: contain; }
        .stream-status-overlay { position: absolute; top: 15px; left: 20px; background: rgba(218, 54, 51, 0.9); color: white; padding: 4px 12px; border-radius: 5px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; z-index: 10; }

        .pane-container { flex: 1; position: relative; padding: 35px; overflow: hidden; }
        .dx-pane { position: absolute; inset: 35px; visibility: hidden; opacity: 0; transform: translateY(20px); transition: var(--transition); }
        .dx-pane.active { visibility: visible; opacity: 1; transform: translateY(0); z-index: 10; }

        .dx-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-xl); display: flex; flex-direction: column; height: 100%; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .dx-card-header { padding: 20px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
        .dx-card-title { font-size: 0.9rem; font-weight: 900; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; }
        .dx-card-body { flex: 1; overflow-y: auto; padding: 30px; }

        /* 5. RIGHT BAR */
        .right-bar { background: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; width: 350px; }
        .chat-log { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .chat-msg { background: var(--bg-card); padding: 15px 20px; border-radius: 15px; border: 1px solid var(--border); animation: msg-slide 0.4s ease-out; }
        .msg-meta { font-size: 0.7rem; font-weight: 900; color: var(--p-light); margin-bottom: 5px; text-transform: uppercase; }

        .teacher-only { display: none !important; }
        body.is-teacher .teacher-only { display: flex !important; }
        .teacher-only-block { display: none !important; }
        body.is-teacher .teacher-only-block { display: block !important; }
        .student-only { display: none !important; }
        body.is-student .student-only { display: flex !important; }

        #reaction-layer { position: fixed; inset: 0; pointer-events: none; z-index: 100000; overflow: hidden; }
        .floating-emoji { position: absolute; bottom: -100px; font-size: 4.5rem; animation: emojiFloat 3.5s forwards; }
        @keyframes emojiFloat { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 15% { opacity: 1; transform: translateY(-50px) scale(1.2); } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <!-- OS BOOT LOADER -->
    <div id="os-boot-loader">
        <div class="boot-card">
            <div class="boot-logo">LECTURE DX</div>
            <div class="boot-version">QUANTUM-CORE OS v34.0</div>
            <div class="input-group">
                <label>Room ID</label>
                <input type="text" id="boot-room-id" class="dx-input" placeholder="e.g. math-class-01">
            </div>
            <div class="input-group">
                <label>Identifier Name</label>
                <input type="text" id="boot-user-name" class="dx-input" placeholder="e.g. Isaac Newton">
            </div>
            <div id="boot-actions">
                <button class="btn-boot btn-p" id="btn-boot-teacher" onclick="core.ignition('teacher')">Launch as Teacher</button>
                <button class="btn-boot btn-s" onclick="core.ignition('student')">Join as Student</button>
            </div>
            <p id="boot-status" style="margin-top:20px; font-size:0.7rem; color:var(--text-dim); font-weight:700;"></p>
        </div>
    </div>

    <!-- REACTION OVERLAY -->
    <div id="reaction-layer"></div>

    <!-- MAIN OS SHELL -->
    <div id="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand" onclick="location.reload()">LDX</div>
            <div class="nav-tool active" data-tip="Lecture Note" onclick="core.ui.switchPane('note')"><i class="fa-solid fa-file-signature"></i></div>
            <div class="nav-tool" data-tip="Sketch Board" onclick="core.ui.switchPane('sketch')"><i class="fa-solid fa-palette"></i></div>
            <div class="nav-tool nav-survey" id="nav-survey-link" data-tip="Live Survey" onclick="core.ui.switchPane('survey')"><i class="fa-solid fa-square-poll-vertical"></i></div>
            <div class="nav-tool" data-tip="Sync Timer" onclick="core.ui.switchPane('timer')"><i class="fa-solid fa-stopwatch-20"></i></div>
        </aside>

        <main class="viewport">
            <header class="top-bar">
                <div style="display:flex; align-items:center; gap:20px;">
                    <span id="display-role" class="status-pill">---</span>
                    <span id="display-room" style="font-family:var(--font-code); font-weight:800; font-size:0.85rem; color:var(--text-dim);">ID: ----</span>
                </div>
                <div style="display:flex; gap:15px; align-items:center;">
                    <div id="clock" style="font-family:var(--font-code); font-weight:800; color:var(--p-light);">00:00:00</div>
                    <button id="btn-screen-share" class="btn-boot btn-p btn-sm teacher-only" onclick="core.media.toggleScreenShare()" style="padding: 10px 20px; font-size: 0.8rem;"><i class="fa-solid fa-display"></i> SCREEN SHARE</button>
                </div>
            </header>

            <!-- 永続ビデオエリア (画面共有用) -->
            <div id="persistent-stream-container">
                <div class="stream-status-overlay"><i class="fa-solid fa-tower-broadcast"></i> LIVE: TEACHER SCREEN</div>
                <video id="remote-video" autoplay playsinline></video>
            </div>

            <div class="pane-container">
                <!-- PANE: NOTE -->
                <div id="pane-note" class="dx-pane active">
                    <div class="dx-card">
                        <div class="dx-card-header"><span class="dx-card-title">Shared Note</span></div>
                        <div class="dx-card-body" style="padding:0;">
                            <textarea id="note-editor" class="teacher-only-block" style="width:100%; height:100%; background:transparent; color:#fff; padding:40px; border:none; font-size:1.2rem; line-height:1.8; resize:none;" placeholder="Type here..."></textarea>
                            <div id="note-viewer" class="student-only" style="padding:40px; font-size:1.2rem; line-height:1.8; white-space:pre-wrap;">ノート待機中...</div>
                        </div>
                    </div>
                </div>

                <!-- PANE: SKETCH -->
                <div id="pane-sketch" class="dx-pane">
                    <div class="dx-card">
                        <div class="dx-card-header"><span class="dx-card-title">Sketch Board</span></div>
                        <div class="dx-card-body" style="background:#080a0f; position:relative;">
                            <canvas id="main-canvas" style="width: 100%; height: 100%;"></canvas>
                        </div>
                    </div>
                </div>

                <!-- PANE: SURVEY / TIMER etc (省略可) -->
                <div id="pane-survey" class="dx-pane">
                    <div class="dx-card"><div class="dx-card-body">Survey System Active.</div></div>
                </div>
                <div id="pane-timer" class="dx-pane">
                    <div class="dx-card"><div class="dx-card-body">Timer System Active.</div></div>
                </div>
            </div>
        </main>

        <aside class="right-bar">
            <div class="dx-card-header"><span class="dx-card-title">Feed</span></div>
            <div id="chat-log" class="chat-log"></div>
            <div style="padding:25px; border-top:1px solid #30363d;">
                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
                    <button class="tool-btn" onclick="core.ui.emitEmoji('👏')">👏</button>
                    <button class="tool-btn" onclick="core.ui.emitEmoji('👍')">👍</button>
                    <button class="tool-btn" onclick="core.ui.emitEmoji('❓')">❓</button>
                    <button class="tool-btn" onclick="core.ui.emitEmoji('💡')">💡</button>
                </div>
            </div>
        </aside>
    </div>

<script>
/**
 * LECTURE DX KERNEL v34.0
 */
class LectureDX {
    constructor() {
        this.role = ''; this.room = ''; this.userName = '';
        this.peer = null; this.conns = new Map(); this.hostConn = null;
        this.participants = new Map();
        
        this.ui = new DX_UI(this); 
        this.net = new DX_Network(this);
        this.board = new DX_Board(this); 
        this.note = new DX_Note(this);
        this.media = new DX_Media(this);
    }

    ignition(role) {
        this.role = role;
        this.room = document.getElementById('boot-room-id').value.trim() || 'default';
        this.userName = document.getElementById('boot-user-name').value.trim() || 'Anonymous';
        
        const pid = role === 'teacher' ? `ldx34-${this.room}-host` : `ldx34-${this.room}-${Math.random().toString(36).substr(2,8)}`;
        this.peer = new Peer(pid);
        
        this.peer.on('open', () => this.boot());
        this.peer.on('connection', c => this.net.onConn(c));
        this.peer.on('call', c => this.media.onCall(c));
        this.peer.on('error', (e) => { 
            if(this.role === 'teacher') { alert("教員が既に存在するか、通信エラーです。"); location.reload(); }
        });
    }

    boot() {
        document.body.classList.add(`is-${this.role}`);
        document.getElementById('os-boot-loader').style.display = 'none';
        document.getElementById('app-shell').classList.add('active');
        document.getElementById('display-role').innerText = this.role.toUpperCase();
        document.getElementById('display-room').innerText = `ID: ${this.room}`;
        
        this.ui.init();
        this.note.init();
        this.board.init();
        if(this.role === 'student') this.net.connect();
    }
}

class DX_Network {
    constructor(c) { this.core = c; }
    connect() {
        this.core.hostConn = this.core.peer.connect(`ldx34-${this.core.room}-host`);
        this.core.hostConn.on('open', () => {
            this.core.ui.setStatus('student');
            this.core.hostConn.send({ type:'JOIN', name:this.core.userName });
        });
        this.core.hostConn.on('data', d => this.router(d));
        this.core.hostConn.on('close', () => {
            this.core.ui.setStatus('offline');
            setTimeout(() => this.connect(), 3000);
        });
    }
    onConn(c) {
        c.on('open', () => {
            this.core.conns.set(c.peer, c);
            c.on('data', d => this.router(d, c));
            
            // 重要：新しい生徒が接続したとき、既に画面共有中ならその生徒を呼ぶ
            if (this.core.role === 'teacher' && this.core.media.stream) {
                console.log("Existing stream detected, calling new student:", c.peer);
                this.core.peer.call(c.peer, this.core.media.stream);
            }
        });
    }
    router(d, c=null) {
        switch(d.type) {
            case 'JOIN': this.core.ui.log('SYSTEM', `${d.name} connected.`); break;
            case 'NOTE_SYNC': this.core.note.receive(d.val); break;
            case 'EMOJI': this.core.ui.spawnEmoji(d.emoji); break;
            case 'SCREEN_OFF': 
                document.getElementById('persistent-stream-container').style.display='none'; 
                document.getElementById('remote-video').srcObject = null;
                break;
        }
    }
    broadcast(d) { this.core.conns.forEach(c => c.open && c.send(d)); }
    sendToHost(p) { if(this.core.hostConn?.open) this.core.hostConn.send(p); }
}

class DX_Media {
    constructor(c) { this.core = c; this.stream = null; }

    async toggleScreenShare() {
        const btn = document.getElementById('btn-screen-share');
        
        // すでに共有中の場合は停止
        if (this.stream) {
            this.stopStream();
            btn.innerHTML = '<i class="fa-solid fa-display"></i> SCREEN SHARE';
            btn.classList.replace('btn-s', 'btn-p');
            return;
        }

        try {
            this.stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { cursor: "always" },
                audio: false 
            });

            // プレビュー表示
            const videoEl = document.getElementById('remote-video');
            document.getElementById('persistent-stream-container').style.display = 'flex';
            videoEl.srcObject = this.stream;

            // 全接続先にコールをかける
            this.core.conns.forEach(conn => {
                console.log("Calling student:", conn.peer);
                this.core.peer.call(conn.peer, this.stream);
            });

            // ストリーム停止時の処理
            this.stream.getVideoTracks()[0].onended = () => this.stopStream();

            btn.innerHTML = '<i class="fa-solid fa-circle-stop"></i> STOP SHARING';
            btn.style.background = 'var(--accent-error)';

        } catch (err) {
            console.error("Screen share error:", err);
        }
    }

    stopStream() {
        if (this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
            this.stream = null;
        }
        document.getElementById('persistent-stream-container').style.display = 'none';
        document.getElementById('remote-video').srcObject = null;
        
        // 生徒側に終了を通知
        this.core.net.broadcast({ type: 'SCREEN_OFF' });
        
        const btn = document.getElementById('btn-screen-share');
        btn.innerHTML = '<i class="fa-solid fa-display"></i> SCREEN SHARE';
        btn.style.background = 'var(--p-color)';
    }

    onCall(call) {
        console.log("Receiving screen share call...");
        call.answer(); // 応答する
        call.on('stream', s => {
            console.log("Stream received!");
            const videoEl = document.getElementById('remote-video');
            document.getElementById('persistent-stream-container').style.display = 'flex';
            videoEl.srcObject = s;
        });
    }
}

class DX_Note {
    constructor(c) { this.core = c; }
    init() { 
        const ed = document.getElementById('note-editor');
        if(this.core.role === 'teacher') {
            ed.oninput = () => this.core.net.broadcast({ type:'NOTE_SYNC', val:ed.value });
        }
    }
    receive(v) { 
        document.getElementById('note-viewer').innerText = v; 
        document.getElementById('note-editor').value = v; 
    }
}

class DX_Board {
    constructor(c) { this.core = c; }
    init() { /* Canvas実装 (必要に応じて) */ }
}

class DX_UI {
    constructor(c) { this.core = c; }
    init() { setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000); }
    setStatus(s) {
        const p = document.getElementById('display-role');
        p.className = 'status-pill ' + (s === 'student' ? 'status-student' : (s === 'teacher' ? 'status-teacher' : 'status-offline'));
    }
    switchPane(id) {
        document.querySelectorAll('.dx-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-tool').forEach(t => t.classList.remove('active'));
        document.getElementById(`pane-${id}`).classList.add('active');
    }
    log(s, t) {
        const l = document.getElementById('chat-log');
        const m = document.createElement('div');
        m.className='chat-msg';
        m.innerHTML=`<div class="msg-meta">${s}</div><div>${t}</div>`;
        l.appendChild(m);
        l.scrollTop = l.scrollHeight;
    }
    emitEmoji(e) { 
        this.spawnEmoji(e); 
        if(this.core.role==='teacher') this.core.net.broadcast({ type:'EMOJI', emoji:e }); 
        else this.core.net.sendToHost({ type:'EMOJI', emoji:e }); 
    }
    spawnEmoji(e) {
        const el = document.createElement('div');
        el.className='floating-emoji'; el.innerText=e;
        el.style.left=`${Math.random()*80+10}%`;
        document.getElementById('reaction-layer').appendChild(el);
        setTimeout(()=>el.remove(),3500);
    }
}

const core = new LectureDX();
</script>
</body>
</html>
