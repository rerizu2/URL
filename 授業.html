<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>授業支援システム - ルームID接続版</title>
    <style>
        :root {
            --teacher-color: #2c3e50;
            --student-color: #27ae60;
            --bg: #f4f7f6;
            --accent: #3498db;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: var(--bg); color: #333; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* ログイン/セットアップ画面 */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--teacher-color); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        .setup-box { background: white; padding: 30px; border-radius: 12px; color: #333; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .setup-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 1.2rem; text-align: center; }

        /* メイン画面 */
        header { padding: 12px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .teacher-mode { background: var(--teacher-color); }
        .student-mode { background: var(--student-color); }

        .container { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px; flex-grow: 1; overflow-y: auto; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        .only-teacher, .only-student { display: none; }
        body.is-teacher .only-teacher { display: block; }
        body.is-student .only-student { display: block; }

        /* アンケート表示 */
        .survey-card { border: 2px solid var(--accent); padding: 15px; border-radius: 10px; background: #f0f8ff; margin-bottom: 20px; }
        .option-label { display: block; padding: 10px; background: white; border: 1px solid #ddd; margin-bottom: 5px; border-radius: 5px; cursor: pointer; }
        .bar-container { background: #eee; height: 16px; border-radius: 8px; overflow: hidden; margin-top: 4px; }
        .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.5s ease-out; }
        
        #text-responses-list { background: #f9f9f9; padding: 10px; border-radius: 5px; max-height: 150px; overflow-y: auto; list-style: none; padding: 0; font-size: 0.9rem; }
        #text-responses-list li { padding: 5px 10px; border-bottom: 1px solid #eee; }

        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; background: var(--accent); }
        .btn-green { background: #27ae60; }
        .btn-red { background: #e74c3c; }

        #timer-display { font-size: 2.5rem; font-weight: bold; text-align: center; color: #e74c3c; }
        textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body id="main-body">

<!-- ルーム参加画面 -->
<div id="setup-screen">
    <div class="setup-box">
        <h2 id="setup-title">授業に参加</h2>
        <p id="setup-desc">ルームIDを入力してください</p>
        <input type="text" id="room-id-input" placeholder="例: 1234" maxlength="10">
        <button id="join-btn" onclick="initRoom()" class="btn-green" style="width:100%;">接続する</button>
    </div>
</div>

<header id="header">
    <div>
        <strong id="role-label">Mode</strong>
        <span id="room-display" style="margin-left:15px; background:rgba(255,255,255,0.2); padding:3px 8px; border-radius:5px;">ID: ----</span>
    </div>
    <div id="clock">00:00:00</div>
</header>

<main class="container">
    <div class="main-content">
        <!-- 教員：アンケート作成 -->
        <div class="panel only-teacher">
            <h2 style="margin-top:0;">📊 アンケート配信</h2>
            <div style="margin-bottom:10px;">
                <label>形式：</label>
                <select id="survey-type" onchange="toggleTeacherInputs()">
                    <option value="single">単一選択</option>
                    <option value="multiple">複数選択</option>
                    <option value="text">自由記述</option>
                </select>
            </div>
            <input type="text" id="survey-q" placeholder="質問を入力" style="width:100%; margin-bottom:10px; padding:8px;">
            <div id="options-area">
                <textarea id="survey-options" placeholder="選択肢を改行で入力" rows="3"></textarea>
            </div>
            <button onclick="startSurvey()" class="btn-green">全員に配信開始</button>
            <button onclick="clearSurvey()" class="btn-red">リセット</button>
        </div>

        <!-- 生徒：アンケート回答 -->
        <div class="panel only-student" id="student-view-area">
            <div id="no-survey-msg">配信中のアンケートはありません。</div>
            <div id="active-survey-ui" class="survey-card" style="display:none;">
                <h3 id="display-q">質問</h3>
                <div id="display-options"></div>
                <button id="btn-submit" onclick="submitAnswer()" style="width:100%; margin-top:10px;">回答を送信</button>
            </div>
        </div>

        <!-- 共通：集計結果リアルタイム共有 -->
        <div class="panel" id="results-panel" style="display:none;">
            <h3>📊 リアルタイム集計結果 (共有中)</h3>
            <p>合計回答数: <span id="total-count">0</span></p>
            <div id="graph-area"></div>
            <ul id="text-responses-list" style="display:none;"></ul>
        </div>

        <div class="panel only-student">
            <h3>📝 自分用ノート</h3>
            <textarea id="student-note" rows="8" placeholder="自動保存されます..."></textarea>
        </div>
    </div>

    <!-- サイドバー -->
    <aside>
        <div class="panel">
            <h3>⏰ 授業タイマー</h3>
            <div id="timer-display">45:00</div>
            <div class="only-teacher" style="margin-top:10px;">
                <input type="number" id="timer-min" value="45" style="width:50px;"> 分
                <button onclick="syncTimer()">開始</button>
            </div>
        </div>
        <div class="panel">
            <div id="announcement" style="background:#fff9c4; padding:10px; border-left:4px solid #f1c40f;">
                <strong>先生からの連絡:</strong><br>
                <span id="announcement-text">なし</span>
            </div>
            <div class="only-teacher" style="margin-top:10px;">
                <input type="text" id="msg-input" placeholder="連絡を入力" style="width:70%;">
                <button onclick="sendMsg()">送信</button>
            </div>
        </div>
    </aside>
</main>

<script>
    let channel;
    const params = new URLSearchParams(window.location.search);
    const isStudent = params.get('role') === 'student';
    
    // データ初期化
    let surveyData = { active: false, type: 'single', question: '', options: [], votes: [], texts: [], total: 0 };

    // 役割に応じた画面切り替え
    if (isStudent) {
        document.body.classList.add('is-student');
        document.getElementById('header').classList.add('student-mode');
        document.getElementById('role-label').innerText = "👨‍🎓 生徒";
        document.getElementById('setup-title').innerText = "授業に参加";
    } else {
        document.body.classList.add('is-teacher');
        document.getElementById('header').classList.add('teacher-mode');
        document.getElementById('role-label').innerText = "👨‍🏫 教員";
        document.getElementById('setup-title').innerText = "授業を開設";
        document.getElementById('setup-desc').innerText = "任意のルームIDを決めてください";
    }

    // ルームIDによる接続
    function initRoom() {
        const roomId = document.getElementById('room-id-input').value.trim();
        if (!roomId) return alert("IDを入力してください");

        // 接続（BroadcastChannelのチャンネル名をIDにする）
        channel = new BroadcastChannel('room_' + roomId);
        
        // UI更新
        document.getElementById('room-display').innerText = "Room ID: " + roomId;
        document.getElementById('setup-screen').style.display = 'none';

        // 通信イベント登録
        setupCommunication();

        if(isStudent) {
            document.getElementById('student-note').value = localStorage.getItem('note_' + roomId) || '';
            document.getElementById('student-note').oninput = (e) => localStorage.setItem('note_' + roomId, e.target.value);
        }
    }

    function setupCommunication() {
        channel.onmessage = (e) => {
            const { action, data, text, index, endTime } = e.data;

            // アンケート開始
            if (action === 'START') {
                surveyData = data;
                if (isStudent) {
                    document.getElementById('no-survey-msg').style.display = 'none';
                    document.getElementById('active-survey-ui').style.display = 'block';
                    document.getElementById('display-q').innerText = data.question;
                    const optDiv = document.getElementById('display-options');
                    optDiv.innerHTML = '';
                    if (data.type === 'text') {
                        optDiv.innerHTML = `<textarea id="ans-text" placeholder="回答を入力..."></textarea>`;
                    } else {
                        data.options.forEach((opt, i) => {
                            const inputType = data.type === 'single' ? 'radio' : 'checkbox';
                            optDiv.innerHTML += `<label class="option-label"><input type="${inputType}" name="ans" value="${i}"> ${opt}</label>`;
                        });
                    }
                    document.getElementById('btn-submit').disabled = false;
                    document.getElementById('btn-submit').innerText = "回答を送信";
                }
                renderResults();
            }

            // 回答受信（教員のみ）→ 全員に再配信
            if (action === 'SUBMIT' && !isStudent) {
                surveyData.total++;
                if (surveyData.type === 'text') {
                    surveyData.texts.push(text);
                } else {
                    if (Array.isArray(index)) index.forEach(i => surveyData.votes[i]++);
                    else surveyData.votes[index]++;
                }
                channel.postMessage({ action: 'UPDATE_RESULTS', data: surveyData });
                renderResults();
            }

            // 集計結果更新（全員）
            if (action === 'UPDATE_RESULTS') {
                surveyData = data;
                renderResults();
            }

            if (action === 'CLEAR') location.reload();
            if (action === 'MSG') document.getElementById('announcement-text').innerText = text;
            if (action === 'TIMER') startTimer(endTime);
        };
    }

    // --- 教員：アンケート制御 ---
    function toggleTeacherInputs() {
        const type = document.getElementById('survey-type').value;
        document.getElementById('options-area').style.display = (type === 'text') ? 'none' : 'block';
    }

    function startSurvey() {
        const q = document.getElementById('survey-q').value;
        const opts = document.getElementById('survey-options').value.split('\n').filter(t => t.trim() !== "");
        const type = document.getElementById('survey-type').value;
        if(!q) return alert("質問を入力してください");

        surveyData = { active: true, type, question: q, options: opts, votes: new Array(opts.length).fill(0), texts: [], total: 0 };
        channel.postMessage({ action: 'START', data: surveyData });
        renderResults();
    }

    function clearSurvey() {
        if(confirm("アンケートを終了しますか？")) channel.postMessage({ action: 'CLEAR' });
    }

    // --- 生徒：回答送信 ---
    function submitAnswer() {
        let payload = { action: 'SUBMIT' };
        if (surveyData.type === 'text') {
            payload.text = document.getElementById('ans-text').value;
            if(!payload.text) return;
        } else {
            const checked = document.querySelectorAll('input[name="ans"]:checked');
            if(checked.length === 0) return alert("回答を選択してください");
            const values = Array.from(checked).map(c => parseInt(c.value));
            payload.index = (surveyData.type === 'single') ? values[0] : values;
        }
        channel.postMessage(payload);
        document.getElementById('btn-submit').disabled = true;
        document.getElementById('btn-submit').innerText = "送信済み";
    }

    // --- 共通ロジック ---
    function renderResults() {
        document.getElementById('results-panel').style.display = 'block';
        document.getElementById('total-count').innerText = surveyData.total;
        const graphArea = document.getElementById('graph-area');
        const listArea = document.getElementById('text-responses-list');

        if (surveyData.type === 'text') {
            graphArea.style.display = 'none';
            listArea.style.display = 'block';
            listArea.innerHTML = surveyData.texts.map(t => `<li>${t}</li>`).reverse().join('');
        } else {
            graphArea.style.display = 'block';
            listArea.style.display = 'none';
            graphArea.innerHTML = surveyData.options.map((opt, i) => {
                const pct = surveyData.total === 0 ? 0 : Math.round((surveyData.votes[i] / surveyData.total) * 100);
                return `<div class="result-item">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem;"><span>${opt}</span><span>${surveyData.votes[i]}票 (${pct}%)</span></div>
                    <div class="bar-container"><div class="bar-fill" style="width:${pct}%"></div></div>
                </div>`;
            }).join('');
        }
    }

    function sendMsg() {
        const text = document.getElementById('msg-input').value;
        channel.postMessage({ action: 'MSG', text });
        document.getElementById('announcement-text').innerText = text;
    }

    function syncTimer() {
        const endTime = Date.now() + (document.getElementById('timer-min').value * 60 * 1000);
        channel.postMessage({ action: 'TIMER', endTime });
        startTimer(endTime);
    }

    let timerInterval;
    function startTimer(endTime) {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const diff = endTime - Date.now();
            if (diff <= 0) { clearInterval(timerInterval); document.getElementById('timer-display').innerText = "00:00"; return; }
            const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }, 1000);
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
