<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture DX Pro - クロスデバイス完全版</title>
    <!-- PeerJS: サーバーなしで端末間通信を行うためのライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --t-color: #2c3e50; --s-color: #27ae60; --bg: #f4f7f9;
            --accent: #3498db; --danger: #e74c3c; --warning: #f39c12;
        }
        body { font-family: sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ログイン画面 */
        #setup-screen { position: fixed; inset: 0; background: var(--t-color); color: white; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .setup-box { background: white; color: #333; padding: 40px; border-radius: 20px; width: 350px; text-align: center; }
        .setup-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .setup-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .setup-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }

        header { padding: 10px 20px; background: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .main-layout { display: grid; grid-template-columns: 280px 1fr 300px; gap: 15px; padding: 15px; flex-grow: 1; overflow: hidden; }
        .panel { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        
        /* 画面共有 */
        #video-container { background: #000; border-radius: 10px; margin-bottom: 15px; position: relative; overflow: hidden; display: none; aspect-ratio: 16/9; }
        #remote-video { width: 100%; height: 100%; object-fit: contain; }
        .live-tag { position: absolute; top: 10px; left: 10px; background: var(--danger); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; }

        /* 出席者・挙手 */
        .list-area { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; }
        .list-item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .hand-active { background: #fff3e0; border-left: 4px solid var(--warning); }

        /* アンケート */
        #survey-panel { background: #f0faff; border: 2px solid var(--accent); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: none; }
        .survey-opt { display: block; width: 100%; text-align: left; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; background: white; cursor: pointer; }
        .res-bar { background: #eee; height: 10px; border-radius: 5px; margin-bottom: 8px; overflow: hidden; }
        .res-fill { height: 100%; background: var(--accent); transition: 0.8s; }

        /* UI */
        button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 12px; transition: 0.2s; font-weight: bold; }
        .only-teacher, .only-student { display: none !important; }
        body.is-teacher .only-teacher { display: block !important; }
        body.is-student .only-student { display: block !important; }
        #timer-display { font-size: 3rem; text-align: center; color: var(--danger); font-family: monospace; }
        #my-note { flex-grow: 1; border: 1px solid #ddd; padding: 10px; border-radius: 8px; resize: none; }
        #reaction-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
        .floating-emoji { position: absolute; bottom: 0; animation: floatUp 3s forwards; font-size: 2.5rem; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-80vh); opacity: 0; } }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="setup-box">
        <h1 style="color:var(--t-color); margin-top:0;">Lecture DX Pro</h1>
        <p id="connection-status" style="font-size:0.8rem; color:var(--accent);">通信エンジン準備中...</p>
        <div id="room-input-area"><input type="text" id="setup-room-id" placeholder="ルームID (英数字)"></div>
        <input type="text" id="setup-user-name" placeholder="あなたのお名前">
        <div class="setup-buttons">
            <button id="btn-teach" onclick="initPeer('teacher')" style="background:var(--t-color)">教員として開始</button>
            <button id="btn-stud" onclick="initPeer('student')" style="background:var(--s-color)">生徒として入室</button>
        </div>
    </div>
</div>

<div id="reaction-layer"></div>

<header id="header">
    <div style="display:flex; align-items:center; gap:15px;">
        <span id="role-label" style="font-weight:bold; color:var(--t-color);">Connecting...</span>
        <span id="room-display">Room: --</span>
        <button class="only-teacher" onclick="copyInviteURL()" style="background:var(--warning); color:white; font-size:0.7rem;">🔗 招待URLをコピー</button>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="only-teacher" id="share-btn" onclick="toggleScreenShare()" style="background:#9b59b6; color:white;">🖥 画面共有</button>
        <span id="clock" style="font-family:monospace; font-weight:bold;">00:00:00</span>
    </div>
</header>

<main class="main-layout">
    <!-- 左：クラス管理 -->
    <aside class="left-col">
        <div class="panel" style="flex:1;">
            <h3>👥 出席者 (<span id="attendee-count">0</span>)</h3>
            <div id="attendee-list" class="list-area"></div>
            <button class="only-teacher" onclick="roulette()" style="width:100%; margin-top:10px; background:var(--accent); color:white;">🎲 指名</button>
        </div>
        <div class="panel" style="flex:1; margin-top:15px;">
            <h3>📊 理解度メーター</h3>
            <div class="only-student">
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <button onclick="sendLevel(100)" style="background:#2ecc71; flex:1;">😊</button>
                    <button onclick="sendLevel(50)" style="background:#f1c40f; flex:1;">😐</button>
                    <button onclick="sendLevel(0)" style="background:#e74c3c; flex:1;">❓</button>
                </div>
            </div>
            <div style="font-size:0.8rem;">平均: <span id="avg-level">--</span>%</div>
            <div class="res-bar"><div id="avg-fill" class="res-fill" style="width:0%"></div></div>
            <h3>🙋 挙手</h3>
            <div id="hand-list" class="list-area"></div>
            <button class="only-student" id="hand-btn" onclick="toggleHand()" style="background:var(--warning); color:white; width:100%;">🖐 質問する</button>
        </div>
    </aside>

    <!-- 中央：授業ノート・共有・アンケート -->
    <section class="panel">
        <div id="video-container">
            <div class="live-tag">LIVE</div>
            <video id="remote-video" autoplay playsinline></video>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>📝 授業メインノート</h3>
            <div>
                <button onclick="sendEmoji('👏')">👏</button>
                <button onclick="sendEmoji('😮')">😮</button>
                <button onclick="sendEmoji('👍')">👍</button>
            </div>
        </div>

        <!-- アンケート表示 -->
        <div id="survey-panel">
            <div style="display:flex; justify-content:space-between;">
                <h4 id="sv-q" style="margin:0;">質問</h4>
                <button class="only-teacher" id="sv-toggle-btn" onclick="toggleSvRes()" style="font-size:0.6rem; background:#9b59b6; color:white;">結果公開中</button>
            </div>
            <div id="sv-ui"></div>
            <button id="sv-sub" class="only-student" onclick="submitSv()" style="width:100%; margin-top:10px; background:var(--accent); color:white;">回答を送信</button>
            <div id="sv-res-area" style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
                <div id="sv-hidden-msg" style="display:none; text-align:center; color:#888;">結果は先生が公開するまで隠されています</div>
                <div id="sv-res-draw"></div>
            </div>
        </div>

        <textarea id="my-note" placeholder="自分用のノート（自動保存されます）..."></textarea>
        
        <div class="only-teacher" style="margin-top:10px; padding:10px; background:#f8f9fa; border-radius:10px; border:1px solid #ddd;">
            <h4 style="margin:0 0 10px 0;">📊 アンケート配信</h4>
            <div style="display:flex; gap:5px;">
                <select id="sv-type-in" style="width:80px;" onchange="toggleSvIn()"><option value="single">単一</option><option value="multi">複数</option><option value="text">記述</option><option value="scale">5段階</option></select>
                <input type="text" id="sv-q-in" placeholder="質問文" style="margin:0;">
            </div>
            <input type="text" id="sv-o-in" placeholder="選択肢(カンマ区切り)" style="margin-top:5px;">
            <button onclick="broadcastSurvey()" style="width:100%; margin-top:5px; background:var(--accent); color:white;">配信開始</button>
        </div>
    </section>

    <!-- 右：掲示板・タイマー -->
    <aside class="right-col">
        <div class="panel">
            <h3>⏰ タイマー</h3>
            <div id="timer-display">00:00</div>
            <div class="only-teacher" style="display:flex; gap:5px;">
                <input type="number" id="t-min" value="45" style="width:60px; margin:0;">
                <button onclick="startTimerSync()" style="background:var(--accent); color:white; flex:1;">開始</button>
            </div>
        </div>
        <div class="panel" style="margin-top:15px; flex-grow:1;">
            <h3>📢 掲示板</h3>
            <div id="board" style="background:#fff9c4; padding:10px; border-radius:8px; flex-grow:1; overflow-y:auto; font-size:0.85rem;"></div>
            <div class="only-teacher" style="margin-top:10px;">
                <textarea id="msg-in" placeholder="連絡内容..." rows="2" style="width:100%;"></textarea>
                <button onclick="broadcastMsg()" style="width:100%; margin-top:5px; background:var(--accent); color:white;">送信</button>
            </div>
        </div>
    </aside>
</main>

<script>
/* =========================================
   CORE: PeerJS 通信ロジック
========================================= */
let peer = null;
let conn = null; // 生徒用：教員への接続
let connections = []; // 教員用：生徒全員の接続リスト
let role = '';
let room = '';
let myName = '';
let students = {};
let hands = [];
let currentSv = null;
let timerInt;

// URLパラメータ確認
const params = new URLSearchParams(window.location.search);
if(params.get('room') && params.get('role') === 'student') {
    document.getElementById('setup-room-id').value = params.get('room');
    document.getElementById('room-input-area').style.display = 'none';
    document.getElementById('btn-teach').style.display = 'none';
}

function initPeer(selectedRole) {
    room = document.getElementById('setup-room-id').value.trim();
    myName = document.getElementById('setup-user-name').value.trim() || '匿名';
    if(!room) return alert("RoomID必須");
    role = selectedRole;

    document.getElementById('connection-status').innerText = "サーバーに接続中...";

    // IDを教員と生徒で分ける
    const peerId = role === 'teacher' ? `ldx-pro-${room}-host` : `ldx-pro-${room}-stud-${Math.floor(Math.random()*10000)}`;
    peer = new Peer(peerId);

    peer.on('open', (id) => {
        document.body.classList.add(role === 'teacher' ? 'is-teacher' : 'is-student');
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('role-label').innerText = role==='teacher'?'👨‍🏫 教員':'👨‍🎓 生徒';
        document.getElementById('room-display').innerText = `Room: ${room}`;
        
        if(role === 'teacher') {
            setupTeacher();
        } else {
            setupStudent();
        }
    });

    peer.on('error', (err) => {
        alert("通信エラー: ルームIDが既に使われているか、接続に失敗しました。\n" + err.type);
        location.reload();
    });

    // ビデオ着信用
    peer.on('call', (call) => {
        call.answer();
        call.on('stream', (stream) => {
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('remote-video').srcObject = stream;
        });
    });
}

/* --- 教員側の処理 --- */
function setupTeacher() {
    peer.on('connection', (c) => {
        c.on('open', () => {
            connections.push(c);
            c.on('data', (data) => handleData(data, c));
        });
    });
}

/* --- 生徒側の処理 --- */
function setupStudent() {
    conn = peer.connect(`ldx-pro-${room}-host`);
    conn.on('open', () => {
        sendToHost({ action: 'HELLO', name: myName });
    });
    conn.on('data', (data) => handleData(data));
    
    // ノート自動保存
    document.getElementById('my-note').value = localStorage.getItem('note_'+room) || '';
    document.getElementById('my-note').oninput = (e) => localStorage.setItem('note_'+room, e.target.value);
}

// 共通データ処理
function handleData(d, senderConn = null) {
    switch(d.action) {
        case 'HELLO':
            students[d.name] = { id: senderConn.peer, level: 100 };
            broadcast({ action: 'SYNC_LIST', students });
            break;
        case 'SYNC_LIST':
            students = d.students; updateAttendeeUI(); updateLevelUI();
            break;
        case 'LEVEL':
            if(students[d.name]) students[d.name].level = d.val;
            if(role === 'teacher') broadcast({ action: 'SYNC_LIST', students });
            break;
        case 'HAND':
            if(d.on) { if(!hands.includes(d.name)) hands.push(d.name); }
            else { hands = hands.filter(h => h !== d.name); }
            if(role === 'teacher') broadcast({ action: 'HAND_SYNC', hands });
            renderHands();
            break;
        case 'HAND_SYNC':
            hands = d.hands; renderHands();
            break;
        case 'REACTION':
            spawnEmoji(d.emoji);
            if(role === 'teacher') broadcast(d);
            break;
        case 'MSG':
            renderMsg(d.sender, d.text);
            break;
        case 'TIMER':
            startTimer(d.endTime);
            break;
        case 'SV_START':
            showSvUI(d.data);
            break;
        case 'SV_VOTE':
            if(role === 'teacher') collectVote(d.val);
            break;
        case 'SV_SYNC':
            renderSvRes(d.data);
            break;
        case 'SHARE_STOP':
            document.getElementById('video-container').style.display = 'none';
            break;
    }
}

// 通信補助
function sendToHost(data) { if(conn) conn.send(data); }
function broadcast(data) { connections.forEach(c => c.send(data)); }

/* =========================================
   UI & 各機能のロジック
========================================= */

// アンケート
function toggleSvIn() {
    const t = document.getElementById('sv-type-in').value;
    document.getElementById('sv-o-in').style.display = (t==='text'||t==='scale')?'none':'block';
}
function broadcastSurvey() {
    const type = document.getElementById('sv-type-in').value;
    const q = document.getElementById('sv-q-in').value;
    let opts = document.getElementById('sv-o-in').value.split(',').map(s=>s.trim()).filter(v=>v);
    if(type==='scale') opts = ["1","2","3","4","5"];
    currentSv = { type, question:q, options:opts, votes: type==='text'?[]:{}, total:0, show:true };
    if(type!=='text') opts.forEach(o=>currentSv.votes[o]=0);
    broadcast({ action: 'SV_START', data: currentSv });
    showSvUI(currentSv);
}
function showSvUI(data) {
    currentSv = data;
    document.getElementById('survey-panel').style.display = 'block';
    document.getElementById('sv-q').innerText = "📊 " + data.question;
    const ui = document.getElementById('sv-ui'); ui.innerHTML = '';
    if(role === 'student') {
        document.getElementById('sv-sub').disabled = false;
        document.getElementById('sv-sub').innerText = "回答を送信";
        if(data.type === 'text') ui.innerHTML = `<textarea id="sv-ans-t" rows="2"></textarea>`;
        else {
            const it = data.type === 'multi' ? 'checkbox' : 'radio';
            data.options.forEach(o => ui.innerHTML += `<label class="survey-opt"><input type="${it}" name="sv-o" value="${o}"> ${o}</label>`);
        }
    }
    renderSvRes(data);
}
function submitSv() {
    let v;
    if(currentSv.type === 'text') v = document.getElementById('sv-ans-t').value;
    else {
        const ck = Array.from(document.querySelectorAll('input[name="sv-o"]:checked')).map(i=>i.value);
        if(!ck.length) return; v = (currentSv.type==='multi')?ck:ck[0];
    }
    sendToHost({ action: 'SV_VOTE', val: v });
    document.getElementById('sv-sub').disabled = true;
    document.getElementById('sv-sub').innerText = "送信完了";
}
function collectVote(val) {
    currentSv.total++;
    if(currentSv.type==='text') currentSv.votes.push(val);
    else if(Array.isArray(val)) val.forEach(v => currentSv.votes[v]++);
    else currentSv.votes[val]++;
    broadcast({ action: 'SV_SYNC', data: currentSv });
    renderSvRes(currentSv);
}
function renderSvRes(data) {
    currentSv = data;
    const res = document.getElementById('sv-res-draw');
    const msg = document.getElementById('sv-hidden-msg');
    if(role === 'student' && !data.show) { res.style.display='none'; msg.style.display='block'; return; }
    res.style.display='block'; msg.style.display='none';
    res.innerHTML = `<div style="font-size:0.8rem; margin-bottom:5px;">回答数: ${data.total}</div>`;
    if(data.type==='text') res.innerHTML += data.votes.map(v => `<div style="font-size:0.7rem;">・${v}</div>`).join('');
    else {
        for(let o in data.votes) {
            const p = data.total===0?0:Math.round(data.votes[o]/data.total*100);
            res.innerHTML += `<div style="font-size:0.7rem;">${o} (${data.votes[o]}票)</div><div class="res-bar"><div class="res-fill" style="width:${p}%"></div></div>`;
        }
    }
    if(role === 'teacher') {
        const b = document.getElementById('sv-toggle-btn');
        b.innerText = data.show ? "結果公開中" : "結果は非公開";
        b.style.background = data.show ? "#9b59b6" : "#7f8c8d";
    }
}
function toggleSvRes() {
    currentSv.show = !currentSv.show;
    broadcast({ action: 'SV_SYNC', data: currentSv });
    renderSvRes(currentSv);
}

// タイマー
function startTimerSync() {
    const endTime = Date.now() + (document.getElementById('t-min').value * 60000);
    broadcast({ action: 'TIMER', endTime });
    startTimer(endTime);
}
function startTimer(e) {
    clearInterval(timerInt);
    timerInt = setInterval(() => {
        const d = e - Date.now();
        if(d <= 0) { clearInterval(timerInt); document.getElementById('timer-display').innerText = "00:00"; return; }
        const m = Math.floor(d/60000), s = Math.floor((d%60000)/1000);
        document.getElementById('timer-display').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }, 1000);
}

// 画面共有 (WebRTC)
let localStream = null;
async function toggleScreenShare() {
    const btn = document.getElementById('share-btn');
    if(localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
        btn.innerText = "🖥 画面共有"; btn.style.background = "#9b59b6";
        document.getElementById('video-container').style.display = 'none';
        broadcast({ action: 'SHARE_STOP' });
        return;
    }
    try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        document.getElementById('video-container').style.display = 'block';
        document.getElementById('remote-video').srcObject = localStream;
        btn.innerText = "🛑 共有停止"; btn.style.background = "var(--danger)";
        
        connections.forEach(c => {
            peer.call(c.peer, localStream);
        });
    } catch(e) { console.error(e); }
}

// その他共通UI
function updateAttendeeUI() {
    const list = document.getElementById('attendee-list');
    const keys = Object.keys(students);
    list.innerHTML = keys.map(s => `<div class="list-item">👤 ${s}</div>`).join('');
    document.getElementById('attendee-count').innerText = keys.length;
}
function updateLevelUI() {
    let t=0, c=0;
    for(let s in students) { t+=students[s].level; c++; }
    const a = c?Math.round(t/c):0;
    document.getElementById('avg-level').innerText = a;
    document.getElementById('avg-fill').style.width = a + '%';
}
function sendLevel(v) { if(role==='student') sendToHost({ action: 'LEVEL', name: myName, val: v }); }
function toggleHand() {
    const b = document.getElementById('hand-btn');
    const isOn = b.innerText.includes('下ろす');
    b.innerText = isOn ? "🖐 質問する" : "✋ 下ろす";
    sendToHost({ action: 'HAND', name: myName, on: !isOn });
}
function renderHands() {
    document.getElementById('hand-list').innerHTML = hands.map(h => `<div class="list-item hand-active">🙋 ${h}</div>`).join('');
}
function broadcastMsg() {
    const t = document.getElementById('msg-in').value;
    if(!t) return;
    broadcast({ action: 'MSG', sender: myName + '(教員)', text: t });
    renderMsg(myName + '(教員)', t);
    document.getElementById('msg-in').value = '';
}
function renderMsg(s, t) {
    const b = document.getElementById('board');
    b.innerHTML += `<div><b>${s}:</b> ${t}</div>`;
    b.scrollTop = b.scrollHeight;
}
function sendEmoji(emoji) {
    if(role==='student') sendToHost({ action: 'REACTION', emoji });
    else broadcast({ action: 'REACTION', emoji });
    spawnEmoji(emoji);
}
function spawnEmoji(emoji) {
    const el = document.createElement('div');
    el.className = 'floating-emoji'; el.innerText = emoji;
    el.style.left = Math.random() * 80 + '%';
    document.getElementById('reaction-layer').appendChild(el);
    setTimeout(() => el.remove(), 3000);
}
function roulette() {
    const s = Object.keys(students); if(!s.length) return;
    const p = s[Math.floor(Math.random()*s.length)];
    broadcast({ action: 'MSG', sender: 'SYSTEM', text: `🎯 指名: <b>${p}</b> さん` });
    renderMsg('SYSTEM', `🎯 指名: <b>${p}</b> さん`);
}
function copyInviteURL() {
    const u = `${window.location.origin}${window.location.pathname}?room=${room}&role=student`;
    navigator.clipboard.writeText(u); alert("招待URLをコピーしました！");
}
setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
</script>
</body>
</html>
