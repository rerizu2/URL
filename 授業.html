<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>授業支援システム - アンケート共有機能付</title>
    <style>
        :root {
            --teacher-color: #2c3e50;
            --student-color: #27ae60;
            --bg: #f4f7f6;
            --accent: #3498db;
            --share-color: #e67e22;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: var(--bg); color: #333; display: flex; flex-direction: column; height: 100vh; }
        
        header { padding: 12px 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .teacher-mode { background: var(--teacher-color); }
        .student-mode { background: var(--student-color); }

        .container { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px; flex-grow: 1; overflow-y: auto; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        .only-teacher, .only-student { display: none; }
        body.is-teacher .only-teacher { display: block; }
        body.is-student .only-student { display: block; }

        /* アンケート設定 */
        .config-row { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9rem; }
        select, input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        /* グラフと回答リスト */
        .result-box { background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .result-item { margin-bottom: 10px; }
        .bar-container { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; }
        .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s; }
        .text-list { background: #f9f9f9; padding: 0; border-radius: 5px; max-height: 200px; overflow-y: auto; list-style: none; }
        .text-list li { padding: 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }

        /* 共有中バッジ */
        .sharing-badge { background: var(--share-color); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; display: inline-block; margin-bottom: 10px; }

        /* 生徒回答エリア */
        .survey-card { border: 2px solid var(--accent); padding: 15px; border-radius: 10px; background: #f0f8ff; }
        .option-label { display: block; padding: 10px; background: white; border: 1px solid #ddd; margin-bottom: 5px; border-radius: 5px; cursor: pointer; }

        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; background: var(--accent); }
        .btn-green { background: #27ae60; }
        .btn-red { background: #e74c3c; }
        .btn-orange { background: var(--share-color); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        #timer-display { font-size: 2.5rem; font-weight: bold; text-align: center; color: #e74c3c; margin: 10px 0; }
    </style>
</head>
<body id="main-body">

<header id="header">
    <div>
        <strong id="role-label">Mode</strong>
        <button class="only-teacher" onclick="copyStudentURL()" style="margin-left:15px; background:rgba(255,255,255,0.2); font-size: 0.8rem;">生徒用URLをコピー</button>
    </div>
    <div id="clock">00:00:00</div>
</header>

<main class="container">
    <div class="main-content">
        <!-- アンケート機能 -->
        <div class="panel">
            <h2 style="margin-top:0;">📊 アンケート</h2>
            
            <!-- 教員用コントロール -->
            <div class="only-teacher">
                <div id="setup-area">
                    <div class="config-row">
                        <label>形式</label>
                        <select id="survey-type" onchange="toggleInputs()">
                            <option value="single">単一選択</option>
                            <option value="multiple">複数選択</option>
                            <option value="text">記述式</option>
                        </select>
                    </div>
                    <div class="config-row">
                        <label>質問</label>
                        <input type="text" id="survey-q" placeholder="例：理解できましたか？">
                    </div>
                    <div id="options-area" class="config-row">
                        <label>選択肢（改行区切り）</label>
                        <textarea id="survey-options" rows="3" placeholder="はい&#13;&#10;いいえ"></textarea>
                    </div>
                    <button onclick="startSurvey()" class="btn-green">配信開始</button>
                </div>

                <div id="teacher-result-ui" style="display:none; margin-top:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>集計結果 (<span id="total-count">0</span>件)</strong>
                        <div>
                            <label style="display:inline; font-size:0.8rem;"><input type="checkbox" id="share-toggle" onchange="toggleShare()"> 生徒に結果を共有する</label>
                        </div>
                    </div>
                    <div id="res-display" class="result-box"></div>
                    <button onclick="resetSurvey()" class="btn-red" style="margin-top:10px;">終了してクリア</button>
                </div>
            </div>

            <!-- 生徒用UI -->
            <div class="only-student">
                <div id="student-wait-msg">アンケートの開始を待っています...</div>
                
                <div id="student-survey-ui" class="survey-card" style="display:none;">
                    <h3 id="st-question"></h3>
                    <div id="st-options"></div>
                    <button id="st-submit" onclick="submitAnswer()" style="width:100%; margin-top:10px;">回答を送信</button>
                </div>

                <div id="student-result-ui" style="display:none; margin-top:20px; border-top: 2px dashed #ccc; padding-top:10px;">
                    <span class="sharing-badge">📢 全体の集計結果</span>
                    <div id="st-res-display" class="result-box"></div>
                </div>
            </div>
        </div>

        <div class="panel only-student">
            <h3>📝 授業メモ</h3>
            <textarea id="student-note" style="height: 150px;"></textarea>
        </div>

        <div class="panel only-teacher">
            <h3>📢 全体連絡</h3>
            <input type="text" id="teacher-msg" style="width:70%;"> <button onclick="sendMsg()">送信</button>
        </div>
    </div>

    <!-- サイドバー -->
    <aside>
        <div class="panel">
            <h3>⏰ 残り時間</h3>
            <div id="timer-display">45:00</div>
            <div class="only-teacher">
                <input type="number" id="timer-min" value="45" style="width:50px;"> 分 <button onclick="syncTimer()">開始</button>
            </div>
        </div>
        <div class="panel" id="notice-board" style="background:#fff9c4; border-left:5px solid #f1c40f;">
            連絡: なし
        </div>
    </aside>
</main>

<script>
    const channel = new BroadcastChannel('class_pro_channel');
    const params = new URLSearchParams(window.location.search);
    const isStudent = params.get('role') === 'student';
    
    let currentSurvey = { active: false, type: '', question: '', options: [], votes: [], texts: [], count: 0, shared: false };

    // 初期表示設定
    if (isStudent) {
        document.body.classList.add('is-student');
        document.getElementById('header').classList.add('student-mode');
        document.getElementById('role-label').innerText = "STUDENT";
        document.getElementById('student-note').value = localStorage.getItem('note') || '';
        document.getElementById('student-note').oninput = (e) => localStorage.setItem('note', e.target.value);
    } else {
        document.body.classList.add('is-teacher');
        document.getElementById('header').classList.add('teacher-mode');
        document.getElementById('role-label').innerText = "TEACHER";
    }

    function toggleInputs() {
        const type = document.getElementById('survey-type').value;
        document.getElementById('options-area').style.display = (type === 'text') ? 'none' : 'block';
    }

    // --- アンケートロジック ---
    function startSurvey() {
        const type = document.getElementById('survey-type').value;
        const q = document.getElementById('survey-q').value;
        const opts = document.getElementById('survey-options').value.split('\n').filter(s => s.trim() !== "");
        
        if (!q) return alert("質問を入力してください");

        currentSurvey = { active: true, type, question: q, options: opts, votes: new Array(opts.length).fill(0), texts: [], count: 0, shared: false };
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('teacher-result-ui').style.display = 'block';
        
        renderResults('res-display');
        channel.postMessage({ action: 'START', data: currentSurvey });
    }

    function toggleShare() {
        currentSurvey.shared = document.getElementById('share-toggle').checked;
        channel.postMessage({ action: 'SYNC', data: currentSurvey });
    }

    function resetSurvey() {
        if(!confirm("アンケートをリセットしますか？")) return;
        channel.postMessage({ action: 'RESET' });
        location.reload();
    }

    function renderResults(elementId) {
        const target = document.getElementById(elementId);
        target.innerHTML = '';
        if (currentSurvey.type === 'text') {
            const ul = document.createElement('ul');
            ul.className = 'text-list';
            currentSurvey.texts.forEach(t => {
                const li = document.createElement('li');
                li.innerText = t;
                ul.prepend(li);
            });
            target.appendChild(ul);
        } else {
            currentSurvey.options.forEach((opt, i) => {
                const val = currentSurvey.votes[i];
                const per = currentSurvey.count === 0 ? 0 : Math.round((val / currentSurvey.count) * 100);
                target.innerHTML += `
                    <div class="result-item">
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                            <span>${opt}</span><span>${val}票 (${per}%)</span>
                        </div>
                        <div class="bar-container"><div class="bar-fill" style="width:${per}%"></div></div>
                    </div>
                `;
            });
        }
        if(!isStudent) document.getElementById('total-count').innerText = currentSurvey.count;
    }

    // --- 受信処理 ---
    channel.onmessage = (e) => {
        const { action, data, ansIndex, ansText, endTime } = e.data;

        if (action === 'START' && isStudent) {
            currentSurvey = data;
            document.getElementById('student-wait-msg').style.display = 'none';
            document.getElementById('student-survey-ui').style.display = 'block';
            document.getElementById('st-question').innerText = data.question;
            const container = document.getElementById('st-options');
            container.innerHTML = '';
            if (data.type === 'text') {
                container.innerHTML = `<textarea id="st-ans-text" placeholder="回答を入力..."></textarea>`;
            } else {
                data.options.forEach((opt, i) => {
                    const inputType = data.type === 'single' ? 'radio' : 'checkbox';
                    container.innerHTML += `<label class="option-label"><input type="${inputType}" name="ans" value="${i}"> ${opt}</label>`;
                });
            }
            document.getElementById('st-submit').disabled = false;
            document.getElementById('st-submit').innerText = "回答を送信";
            document.getElementById('student-result-ui').style.display = 'none';
        }

        if (action === 'SUBMIT' && !isStudent) {
            currentSurvey.count++;
            if (currentSurvey.type === 'text') {
                currentSurvey.texts.push(ansText);
            } else {
                if (Array.isArray(ansIndex)) ansIndex.forEach(i => currentSurvey.votes[i]++);
                else currentSurvey.votes[ansIndex]++;
            }
            renderResults('res-display');
            if (currentSurvey.shared) channel.postMessage({ action: 'SYNC', data: currentSurvey });
        }

        if (action === 'SYNC' && isStudent) {
            currentSurvey = data;
            if (data.shared) {
                document.getElementById('student-result-ui').style.display = 'block';
                renderResults('st-res-display');
            } else {
                document.getElementById('student-result-ui').style.display = 'none';
            }
        }

        if (action === 'RESET') location.reload();
        if (action === 'MSG') document.getElementById('notice-board').innerText = "連絡: " + data;
        if (action === 'TIMER') startTimer(endTime);
    };

    // 生徒：回答送信
    function submitAnswer() {
        const textInput = document.getElementById('st-ans-text');
        const checked = document.querySelectorAll('input[name="ans"]:checked');
        let payload = { action: 'SUBMIT' };

        if (textInput) {
            payload.ansText = textInput.value;
        } else if (checked.length > 0) {
            const vals = Array.from(checked).map(i => parseInt(i.value));
            payload.ansIndex = (document.querySelector('input[type="radio"]')) ? vals[0] : vals;
        } else {
            return alert("入力してください");
        }

        channel.postMessage(payload);
        document.getElementById('st-submit').disabled = true;
        document.getElementById('st-submit').innerText = "送信完了";
    }

    // その他共通機能
    function sendMsg() {
        const m = document.getElementById('teacher-msg').value;
        channel.postMessage({ action: 'MSG', data: m });
        document.getElementById('notice-board').innerText = "連絡: " + m;
    }

    function syncTimer() {
        const t = document.getElementById('timer-min').value;
        const endTime = Date.now() + t * 60000;
        channel.postMessage({ action: 'TIMER', endTime });
        startTimer(endTime);
    }

    let timerId;
    function startTimer(endTime) {
        clearInterval(timerId);
        timerId = setInterval(() => {
            const diff = endTime - Date.now();
            if (diff <= 0) {
                clearInterval(timerId);
                document.getElementById('timer-display').innerText = "00:00";
                return;
            }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }, 1000);
    }

    function copyStudentURL() {
        navigator.clipboard.writeText(window.location.origin + window.location.pathname + "?role=student");
        alert("コピーしました");
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
