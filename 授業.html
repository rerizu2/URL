<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>授業支援システム - 動作安定版</title>
    <style>
        :root { --t-color: #2c3e50; --s-color: #27ae60; --accent: #3498db; }
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .teacher-mode { background: var(--t-color); }
        .student-mode { background: var(--s-color); }
        .container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 20px; flex-grow: 1; }
        .panel { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .only-teacher, .only-student { display: none; }
        body.is-teacher .only-teacher { display: block; }
        body.is-student .only-student { display: block; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 15px; border: none; border-radius: 4px; background: var(--accent); color: white; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.8; }
        .res-bar-bg { background: #eee; height: 15px; border-radius: 10px; overflow: hidden; margin: 5px 0 15px; }
        .res-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body id="main-body">

<header id="header">
    <div id="role-text">モード判別中...</div>
    <button class="only-teacher" onclick="copyURL()" style="background:#f39c12;">生徒用URLをコピー</button>
    <div id="clock">00:00:00</div>
</header>

<main class="container">
    <div>
        <!-- アンケート機能 -->
        <div class="panel">
            <h2>📊 アンケート</h2>
            
            <!-- 教員画面 -->
            <div class="only-teacher">
                <select id="q-type">
                    <option value="single">単一選択</option>
                    <option value="text">自由記述</option>
                </select>
                <input type="text" id="q-text" placeholder="質問を入力">
                <textarea id="q-options" placeholder="選択肢を改行して入力（選択式の場合）"></textarea>
                <button onclick="sendSurvey()" style="background:#27ae60;">配信開始</button>
                <button onclick="resetAll()" style="background:#e74c3c;">リセット</button>

                <div id="t-results" style="margin-top:20px; display:none; border-top:1px solid #ccc; padding-top:10px;">
                    <strong>集計結果:</strong> <span id="t-count">0</span>件
                    <div id="t-graph"></div>
                    <button onclick="shareToStudents()" id="share-btn" style="margin-top:10px; background:#9b59b6;">結果を生徒に共有</button>
                </div>
            </div>

            <!-- 生徒画面 -->
            <div class="only-student">
                <div id="s-form" style="display:none; border:2px solid var(--accent); padding:15px; border-radius:10px;">
                    <h3 id="s-question">質問</h3>
                    <div id="s-options-ui"></div>
                    <button onclick="submitAnswer()" id="s-submit-btn" style="width:100%; margin-top:10px;">回答を送信</button>
                </div>
                <p id="s-wait">現在、アンケートはありません。</p>

                <!-- 生徒側結果共有エリア -->
                <div id="s-results" style="display:none; margin-top:20px; background:#e8f4fd; padding:15px; border-radius:10px;">
                    <strong>📡 クラス全体の集計結果:</strong>
                    <div id="s-graph"></div>
                </div>
            </div>
        </div>

        <div class="panel only-student">
            <h3>📝 メモ</h3>
            <textarea id="my-note" style="height:100px;"></textarea>
        </div>
    </div>

    <aside>
        <div class="panel">
            <h3>⏰ タイマー</h3>
            <div id="timer-display" style="font-size:2rem; text-align:center; font-weight:bold;">45:00</div>
            <div class="only-teacher">
                <input type="number" id="t-min" value="45" style="width:60px;">分
                <button onclick="startTimer()">開始</button>
            </div>
        </div>
    </aside>
</main>

<script>
    // 通信チャネルの作成
    const bc = new BroadcastChannel('class_system');
    const params = new URLSearchParams(window.location.search);
    const isStudent = params.get('role') === 'student';
    let surveyData = { type:'', q:'', opts:[], votes:[], texts:[], count:0, shared: false };

    // ロール設定
    if (isStudent) {
        document.body.classList.add('is-student');
        document.getElementById('header').classList.add('student-mode');
        document.getElementById('role-text').innerText = "👨‍🎓 生徒用画面";
    } else {
        document.body.classList.add('is-teacher');
        document.getElementById('header').classList.add('teacher-mode');
        document.getElementById('role-text').innerText = "👨‍🏫 教員用画面";
    }

    // 教員：アンケート配信
    function sendSurvey() {
        const q = document.getElementById('q-text').value;
        const o = document.getElementById('q-options').value.split('\n').filter(x => x.trim());
        if(!q) return alert("質問を入力してください");

        surveyData = { 
            type: document.getElementById('q-type').value, 
            q: q, opts: o, votes: new Array(o.length).fill(0), 
            texts: [], count: 0, shared: false 
        };
        bc.postMessage({ type: 'START', data: surveyData });
        showResults('teacher');
    }

    function shareToStudents() {
        surveyData.shared = true;
        bc.postMessage({ type: 'SYNC', data: surveyData });
        alert("結果を共有しました");
    }

    // 通信受信
    bc.onmessage = (e) => {
        const msg = e.data;
        console.log("受信:", msg); // デバッグ用

        if (msg.type === 'START' && isStudent) {
            surveyData = msg.data;
            document.getElementById('s-wait').style.display = 'none';
            document.getElementById('s-form').style.display = 'block';
            document.getElementById('s-results').style.display = 'none';
            document.getElementById('s-question').innerText = surveyData.q;
            const ui = document.getElementById('s-options-ui');
            ui.innerHTML = '';
            if(surveyData.type === 'text') {
                ui.innerHTML = '<textarea id="s-text-ans"></textarea>';
            } else {
                surveyData.opts.forEach((opt, i) => {
                    ui.innerHTML += `<label style="display:block; margin:5px 0;"><input type="radio" name="ans" value="${i}"> ${opt}</label>`;
                });
            }
            document.getElementById('s-submit-btn').disabled = false;
            document.getElementById('s-submit-btn').innerText = "回答を送信";
        }

        if (msg.type === 'ANSWER' && !isStudent) {
            surveyData.count++;
            if(surveyData.type === 'text') surveyData.texts.push(msg.val);
            else surveyData.votes[msg.val]++;
            showResults('teacher');
            if(surveyData.shared) bc.postMessage({ type: 'SYNC', data: surveyData });
        }

        if (msg.type === 'SYNC' && isStudent) {
            surveyData = msg.data;
            if(surveyData.shared) {
                document.getElementById('s-results').style.display = 'block';
                showResults('student');
            }
        }

        if (msg.type === 'RESET') location.reload();
        if (msg.type === 'TIMER') runTimer(msg.val);
    };

    // 生徒：回答送信
    function submitAnswer() {
        let val;
        if(surveyData.type === 'text') {
            val = document.getElementById('s-text-ans').value;
        } else {
            const selected = document.querySelector('input[name="ans"]:checked');
            if(!selected) return alert("選択してください");
            val = selected.value;
        }
        bc.postMessage({ type: 'ANSWER', val: val });
        document.getElementById('s-submit-btn').disabled = true;
        document.getElementById('s-submit-btn').innerText = "送信済み";
    }

    // 集計表示
    function showResults(mode) {
        const id = mode === 'teacher' ? 't' : 's';
        document.getElementById(`${id}-results`)?.style.setProperty('display', 'block');
        document.getElementById(`${id}-count`).innerText = surveyData.count;
        const graph = document.getElementById(`${id}-graph`);
        graph.innerHTML = '';

        if(surveyData.type === 'text') {
            surveyData.texts.forEach(txt => {
                graph.innerHTML += `<div style="padding:5px; border-bottom:1px solid #eee;">・${txt}</div>`;
            });
        } else {
            surveyData.opts.forEach((opt, i) => {
                const v = surveyData.votes[i];
                const p = surveyData.count === 0 ? 0 : Math.round(v/surveyData.count*100);
                graph.innerHTML += `
                    <div style="font-size:0.8rem;">${opt} (${v}票)</div>
                    <div class="res-bar-bg"><div class="res-bar-fill" style="width:${p}%"></div></div>
                `;
            });
        }
    }

    // 共通機能
    function resetAll() { bc.postMessage({ type: 'RESET' }); location.reload(); }
    function copyURL() {
        const url = window.location.origin + window.location.pathname + "?role=student";
        navigator.clipboard.writeText(url);
        alert("コピー完了！同じブラウザの別タブに貼り付けてください。");
    }
    function startTimer() {
        const end = Date.now() + document.getElementById('t-min').value * 60000;
        bc.postMessage({ type: 'TIMER', val: end });
        runTimer(end);
    }
    let timerId;
    function runTimer(end) {
        clearInterval(timerId);
        timerId = setInterval(() => {
            const diff = end - Date.now();
            if(diff <= 0) { clearInterval(timerId); document.getElementById('timer-display').innerText = "00:00"; return; }
            const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timer-display').innerText = `${m}:${s<10?'0':''}${s}`;
        }, 1000);
    }
    setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
</script>
</body>
</html>
