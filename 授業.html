<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture DX Ultimate v8.1 - Survey Enhanced</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a; --bg-panel: #1e293b; --bg-card: #334155; --bg-hover: #475569;
            --border: rgba(255, 255, 255, 0.08); --border-active: #6366f1;
            --primary: #6366f1; --primary-hover: #4f46e5; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --text-main: #f8fafc; --text-sub: #94a3b8; --radius-md: 10px; --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ログイン */
        #auth-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .auth-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); width: min(90vw, 400px); padding: 30px; text-align: center; }
        .input-field { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: white; margin-bottom: 15px; outline: none; }
        .input-field:focus { border-color: var(--primary); }

        /* ヘッダー */
        header { height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border: 1px solid; }
        .badge-teacher { background: rgba(99, 102, 241, 0.2); color: #818cf8; border-color: #6366f1; }
        .badge-student { background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: #10b981; }

        /* レイアウト */
        .workspace { flex: 1; display: grid; grid-template-columns: 260px 1fr 300px; gap: 12px; padding: 12px; overflow: hidden; }
        @media (max-width: 1000px) { .workspace { grid-template-columns: 1fr; } .side { display: none; } }
        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: bold; color: var(--text-sub); }
        .panel-body { padding: 12px; overflow-y: auto; flex: 1; }

        /* スクリーン共有 */
        #screen-module { background: #000; border-radius: var(--radius-md); margin-bottom: 12px; aspect-ratio: 16/9; display: none; overflow: hidden; }
        #shared-video { width: 100%; height: 100%; object-fit: contain; }

        /* アンケート */
        #survey-module { background: rgba(99, 102, 241, 0.1); border: 1px solid var(--primary); border-radius: var(--radius-md); padding: 15px; margin-bottom: 12px; display: none; }
        .survey-opt { background: var(--bg-card); border: 1px solid var(--border); padding: 10px; border-radius: 6px; width: 100%; text-align: left; color: white; cursor: pointer; margin-top: 6px; }
        .survey-opt:hover { border-color: var(--primary); }
        .track { background: var(--bg-card); height: 8px; border-radius: 4px; margin: 4px 0 10px; }
        .fill { background: var(--primary); height: 100%; transition: width 0.6s ease; }

        /* ツール・ボタン */
        .btn { background: var(--primary); color: white; border: none; border-radius: 6px; padding: 8px 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-sub); }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); }
        #timer-val { font-size: 3rem; font-weight: 800; text-align: center; color: var(--danger); font-family: monospace; }
        textarea { width: 100%; flex: 1; background: transparent; border: none; color: white; resize: none; outline: none; line-height: 1.6; }

        /* リアクション */
        #reaction-stage { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
        .floating { position: absolute; bottom: -50px; font-size: 2.5rem; animation: float 3s forwards; }
        @keyframes float { 0% { opacity:0; transform: translateY(0); } 10% { opacity:1; } 100% { opacity:0; transform: translateY(-80vh); } }
    </style>
</head>
<body>

<div id="auth-modal">
    <div class="auth-card">
        <h2>Lecture DX <span style="color:var(--primary)">Ultimate</span></h2>
        <div style="text-align:left; margin-top:20px;">
            <label style="font-size:0.7rem; color:var(--text-sub)">Room ID</label>
            <input type="text" id="init-room" class="input-field" placeholder="math-101">
            <label style="font-size:0.7rem; color:var(--text-sub)">User Name</label>
            <input type="text" id="init-name" class="input-field" placeholder="お名前">
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-outline" style="flex:1" onclick="app.join('student')">生徒として入室</button>
            <button class="btn" style="flex:1" onclick="app.join('teacher')">教員として開始</button>
        </div>
    </div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-weight:900;">LDX</span>
        <span id="role-badge" class="badge">---</span>
        <span id="room-id-display" style="font-size:0.8rem; opacity:0.6;"></span>
    </div>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-outline only-teacher" onclick="app.copyInviteUrl()">🔗 招待URL</button>
        <button class="btn only-teacher" id="btn-share" onclick="app.toggleShare()">🖥 画面共有</button>
        <button class="btn btn-danger" onclick="location.reload()">退室</button>
    </div>
</header>

<div class="workspace">
    <!-- 左: 出席者・挙手 -->
    <div class="panel side">
        <div class="panel-header">出席者 (<span id="user-count">0</span>)</div>
        <div class="panel-body">
            <div id="attendee-list" style="display:flex; flex-direction:column; gap:5px;"></div>
            <div style="margin-top:auto;">
                <div style="font-size:0.7rem; margin-bottom:5px;">理解度平均: <span id="avg-text">100</span>%</div>
                <div class="track"><div id="avg-bar" class="fill" style="width:100%; background:var(--success)"></div></div>
                <div class="only-student" style="display:flex; gap:3px; margin-top:5px;">
                    <button class="btn btn-outline" style="flex:1; font-size:0.6rem;" onclick="app.sendLv(100)">😊</button>
                    <button class="btn btn-outline" style="flex:1; font-size:0.6rem;" onclick="app.sendLv(50)">🤔</button>
                    <button class="btn btn-outline" style="flex:1; font-size:0.6rem;" onclick="app.sendLv(0)">🚨</button>
                </div>
                <button id="btn-hand" class="btn btn-warning only-student" style="width:100%; margin-top:8px;" onclick="app.toggleHand()">🖐 挙手 / 質問</button>
            </div>
        </div>
    </div>

    <!-- 中: ビデオ・ノート・アンケート -->
    <div style="display:flex; flex-direction:column; gap:12px; overflow:hidden;">
        <div id="screen-module">
            <video id="shared-video" autoplay playsinline></video>
        </div>

        <!-- 改良版アンケートパネル -->
        <div id="survey-module">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span id="sv-title" style="font-weight:bold;"></span>
                <div style="display:flex; gap:5px;">
                    <button class="btn btn-outline only-teacher" style="padding:2px 8px; font-size:0.65rem;" onclick="app.toggleSvVisibility()" id="btn-sv-lock">結果を隠す</button>
                    <button class="btn btn-danger only-teacher" style="padding:2px 8px; font-size:0.65rem;" onclick="app.endSurvey()">終了</button>
                </div>
            </div>
            <div id="sv-interaction"></div>
            <div id="sv-results" style="margin-top:10px; font-size:0.8rem;"></div>
        </div>

        <div class="panel" style="flex:1;">
            <div class="panel-header">授業ノート <span id="save-status" style="font-weight:normal; opacity:0.5;"></span></div>
            <div class="panel-body">
                <textarea id="note-area" placeholder="ここにメモを入力..."></textarea>
            </div>
        </div>

        <!-- 教員専用: アンケート作成 -->
        <div class="panel only-teacher">
            <div class="panel-header">アンケート配信コントロール</div>
            <div class="panel-body" style="display:flex; gap:10px; align-items:flex-end;">
                <div style="flex:1;">
                    <label style="font-size:0.6rem;">形式</label>
                    <select id="adm-sv-type" class="input-field" style="margin-bottom:0;" onchange="app.onSurveyTypeChange()">
                        <option value="single">単一選択</option>
                        <option value="multi">複数選択</option>
                        <option value="scale">5段階評価</option>
                        <option value="text">自由記述</option>
                    </select>
                </div>
                <div style="flex:2;">
                    <label style="font-size:0.6rem;">質問内容</label>
                    <input type="text" id="adm-sv-q" class="input-field" style="margin-bottom:0;" placeholder="例: 理解できましたか？">
                </div>
                <div style="flex:2;" id="adm-sv-opt-box">
                    <label style="font-size:0.6rem;">選択肢 (カンマ区切り)</label>
                    <input type="text" id="adm-sv-opt" class="input-field" style="margin-bottom:0;" placeholder="はい, いいえ">
                </div>
                <button class="btn" onclick="app.publishSurvey()">配信</button>
            </div>
        </div>
    </div>

    <!-- 右: タイマー・掲示板 -->
    <div class="panel side">
        <div class="panel-header">TIMER</div>
        <div class="panel-body">
            <div id="timer-val">00:00</div>
            <div class="only-teacher" style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                <button class="btn btn-outline" onclick="app.setTimer(15)">15分</button>
                <button class="btn btn-outline" onclick="app.setTimer(45)">45分</button>
                <button class="btn btn-danger" style="grid-column: span 2;" onclick="app.stopTimer()">停止</button>
            </div>
            <hr style="margin:15px 0; border:none; border-top:1px solid var(--border);">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="font-size:0.7rem;">掲示板</span>
                <div><button class="btn btn-outline" style="padding:2px 5px;" onclick="app.sendEmoji('👏')">👏</button></div>
            </div>
            <div id="board-msg" style="flex:1; overflow-y:auto; font-size:0.8rem; display:flex; flex-direction:column; gap:5px;"></div>
            <div class="only-teacher" style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="board-in" class="input-field" style="margin-bottom:0;" placeholder="連絡...">
                <button class="btn" onclick="app.postMsg()">送信</button>
            </div>
        </div>
    </div>
</div>

<div id="reaction-stage"></div>

<script>
class UltimateApp {
    constructor() {
        this.peer = null;
        this.conns = new Map(); // Host uses this
        this.hostConn = null;   // Student uses this
        this.role = '';
        this.room = '';
        this.name = '';
        this.svCtx = null;
        this.roster = new Map();
        this.timer = null;
        this.localStream = null;
    }

    join(role) {
        this.role = role;
        this.room = document.getElementById('init-room').value.trim();
        this.name = document.getElementById('init-name').value.trim() || 'Guest';
        if (!this.room) return alert('Room ID required');

        document.getElementById('auth-modal').style.display = 'none';
        document.body.classList.add(role === 'teacher' ? 'is-teacher' : 'is-student');
        document.getElementById('role-badge').innerText = role;
        document.getElementById('role-badge').className = `badge badge-${role}`;
        document.getElementById('room-id-display').innerText = `Room: ${this.room}`;

        // Initialize Peer
        const pid = role === 'teacher' ? `ldx-v81-${this.room}-host` : `ldx-v81-${this.room}-stud-${Math.random().toString(36).substr(2,6)}`;
        this.peer = new Peer(pid);

        this.peer.on('open', () => {
            if (role === 'teacher') this.setupHost();
            else this.setupClient();
        });

        this.peer.on('call', (call) => {
            call.answer();
            call.on('stream', (stream) => {
                document.getElementById('screen-module').style.display = 'block';
                document.getElementById('shared-video').srcObject = stream;
            });
        });

        this.initNotes();
    }

    setupHost() {
        this.peer.on('connection', (c) => {
            c.on('open', () => {
                this.conns.set(c.peer, c);
                c.on('data', (d) => this.onData(d, c));
                if (this.svCtx) c.send({ type: 'SV_SYNC', payload: this.svCtx });
            });
            c.on('close', () => {
                this.conns.delete(c.peer);
                this.roster.delete(c.peer);
                this.syncRoster();
            });
        });
    }

    setupClient() {
        this.hostConn = this.peer.connect(`ldx-v81-${this.room}-host`);
        this.hostConn.on('open', () => {
            this.hostConn.send({ type: 'JOIN', name: this.name });
        });
        this.hostConn.on('data', (d) => this.onData(d));
    }

    onData(d, sender = null) {
        switch (d.type) {
            case 'JOIN':
                this.roster.set(sender.peer, { name: d.name, level: 100, hand: false });
                this.syncRoster();
                break;
            case 'ROSTER':
                this.renderRoster(d.payload);
                break;
            case 'LV':
                if (this.role === 'teacher') {
                    const s = this.roster.get(sender.peer);
                    if (s) s.level = d.val;
                    this.syncRoster();
                }
                break;
            case 'HAND':
                if (this.role === 'teacher') {
                    const s = this.roster.get(sender.peer);
                    if (s) s.hand = d.val;
                    this.syncRoster();
                }
                break;
            case 'SV_PUB':
                this.svCtx = d.payload;
                this.renderSv();
                break;
            case 'SV_VOTE':
                if (this.role === 'teacher') this.tallyVote(d.val);
                break;
            case 'SV_SYNC':
                this.svCtx = d.payload;
                this.renderSv();
                break;
            case 'SV_END':
                this.svCtx = null;
                document.getElementById('survey-module').style.display = 'none';
                break;
            case 'TIMER':
                this.startTimerUI(d.val);
                break;
            case 'T_STOP':
                clearInterval(this.timer);
                document.getElementById('timer-val').innerText = '00:00';
                break;
            case 'MSG':
                this.renderMsg(d.sender, d.msg);
                if (this.role === 'teacher') this.broadcast(d);
                break;
            case 'REACT':
                this.spawnReact(d.emoji);
                if (this.role === 'teacher') this.broadcast(d);
                break;
            case 'SHARE_OFF':
                document.getElementById('screen-module').style.display = 'none';
                break;
        }
    }

    broadcast(data) {
        this.conns.forEach(c => { if (c.open) c.send(data); });
    }

    /* アンケートシステム */
    onSurveyTypeChange() {
        const t = document.getElementById('adm-sv-type').value;
        document.getElementById('adm-sv-opt-box').style.visibility = (t === 'text' || t === 'scale') ? 'hidden' : 'visible';
    }

    publishSurvey() {
        const type = document.getElementById('adm-sv-type').value;
        const q = document.getElementById('adm-sv-q').value.trim();
        let opts = document.getElementById('adm-sv-opt').value.split(',').map(s => s.trim()).filter(Boolean);

        if (!q) return alert('質問を入力してください');
        if (type === 'scale') opts = ['1', '2', '3', '4', '5'];

        this.svCtx = {
            type, question: q, options: opts,
            votes: type === 'text' ? [] : Object.fromEntries(opts.map(o => [o, 0])),
            total: 0, visible: true
        };
        this.broadcast({ type: 'SV_PUB', payload: this.svCtx });
        this.renderSv();
    }

    tallyVote(val) {
        if (!this.svCtx) return;
        this.svCtx.total++;
        if (this.svCtx.type === 'text') this.svCtx.votes.push(val);
        else if (Array.isArray(val)) val.forEach(v => { if (this.svCtx.votes[v] !== undefined) this.svCtx.votes[v]++; });
        else if (this.svCtx.votes[val] !== undefined) this.svCtx.votes[val]++;
        
        this.broadcast({ type: 'SV_SYNC', payload: this.svCtx });
        this.renderSv();
    }

    renderSv() {
        const ctx = this.svCtx;
        const mod = document.getElementById('survey-module');
        if (!ctx) return mod.style.display = 'none';

        mod.style.display = 'block';
        document.getElementById('sv-title').innerText = `📊 ${ctx.question}`;
        
        const interact = document.getElementById('sv-interaction');
        interact.innerHTML = '';

        if (this.role === 'student') {
            if (ctx.type === 'text') {
                interact.innerHTML = `<input type="text" id="sv-ans-txt" class="input-field" style="margin-bottom:5px;">
                                      <button class="btn btn-sm" onclick="app.submitVote()">送信</button>`;
            } else {
                ctx.options.forEach(o => {
                    const b = document.createElement('button');
                    b.className = 'survey-opt';
                    b.innerText = o;
                    b.onclick = () => app.submitVote(o);
                    interact.appendChild(b);
                });
            }
        }

        const res = document.getElementById('sv-results');
        if (!ctx.visible && this.role === 'student') {
            res.innerHTML = `<div style="text-align:center; padding:10px; opacity:0.5;">集計中です...</div>`;
            return;
        }

        res.innerHTML = `<div style="font-size:0.7rem; margin-bottom:5px;">合計: ${ctx.total}票</div>`;
        if (ctx.type === 'text') {
            res.innerHTML += ctx.votes.map(v => `<div style="background:var(--bg-card); padding:5px; border-radius:4px; margin-bottom:3px;">${v}</div>`).reverse().join('');
        } else {
            for (const [o, count] of Object.entries(ctx.votes)) {
                const pct = ctx.total ? Math.round(count / ctx.total * 100) : 0;
                res.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:0.7rem;"><span>${o}</span><span>${pct}%</span></div>
                                  <div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
            }
        }
    }

    submitVote(direct = null) {
        const val = direct || document.getElementById('sv-ans-txt').value;
        if (!val) return;
        this.hostConn.send({ type: 'SV_VOTE', val });
        document.getElementById('sv-interaction').innerHTML = '✓ 送信しました';
    }

    endSurvey() {
        this.svCtx = null;
        this.broadcast({ type: 'SV_END' });
        document.getElementById('survey-module').style.display = 'none';
    }

    toggleSvVisibility() {
        if (!this.svCtx) return;
        this.svCtx.visible = !this.svCtx.visible;
        document.getElementById('btn-sv-lock').innerText = this.svCtx.visible ? '結果を隠す' : '結果を表示中';
        this.broadcast({ type: 'SV_SYNC', payload: this.svCtx });
        this.renderSv();
    }

    /* その他機能 */
    syncRoster() {
        const data = Array.from(this.roster.values());
        this.broadcast({ type: 'ROSTER', payload: data });
        this.renderRoster(data);
    }

    renderRoster(list) {
        document.getElementById('user-count').innerText = list.length;
        const container = document.getElementById('attendee-list');
        container.innerHTML = '';
        let totalLv = 0;
        list.forEach(u => {
            totalLv += u.level;
            const el = document.createElement('div');
            el.style.fontSize = '0.75rem';
            el.style.padding = '5px';
            el.style.background = u.hand ? 'rgba(245,158,11,0.2)' : 'var(--bg-card)';
            el.style.borderRadius = '4px';
            el.innerHTML = `<span>${u.name}</span> <span style="float:right;">${u.hand ? '🖐' : ''}</span>`;
            container.appendChild(el);
        });
        const avg = list.length ? Math.round(totalLv / list.length) : 100;
        document.getElementById('avg-text').innerText = avg;
        document.getElementById('avg-bar').style.width = avg + '%';
    }

    toggleHand() {
        this.hand = !this.hand;
        document.getElementById('btn-hand').innerText = this.hand ? '✋ 下ろす' : '🖐 挙手 / 質問';
        this.hostConn.send({ type: 'HAND', val: this.hand });
    }

    sendLv(val) { if (this.hostConn) this.hostConn.send({ type: 'LV', val }); }

    setTimer(m) {
        const end = Date.now() + m * 60000;
        this.broadcast({ type: 'TIMER', val: end });
        this.startTimerUI(end);
    }

    startTimerUI(end) {
        clearInterval(this.timer);
        this.timer = setInterval(() => {
            const diff = end - Date.now();
            if (diff <= 0) {
                clearInterval(this.timer);
                document.getElementById('timer-val').innerText = '00:00';
                return;
            }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer-val').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }

    stopTimer() { clearInterval(this.timer); this.broadcast({ type: 'T_STOP' }); document.getElementById('timer-val').innerText = '00:00'; }

    postMsg() {
        const msg = document.getElementById('board-in').value;
        if (!msg) return;
        this.renderMsg(this.name, msg);
        this.broadcast({ type: 'MSG', sender: this.name, msg });
        document.getElementById('board-in').value = '';
    }

    renderMsg(s, m) {
        const el = document.createElement('div');
        el.innerHTML = `<b style="color:var(--primary)">${s}:</b> ${m}`;
        document.getElementById('board-msg').appendChild(el);
    }

    sendEmoji(emoji) {
        this.spawnReact(emoji);
        if (this.role === 'teacher') this.broadcast({ type: 'REACT', emoji });
        else this.hostConn.send({ type: 'REACT', emoji });
    }

    spawnReact(emoji) {
        const el = document.createElement('div');
        el.className = 'floating'; el.innerText = emoji; el.style.left = Math.random() * 80 + '%';
        document.getElementById('reaction-stage').appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    async toggleShare() {
        if (this.localStream) {
            this.localStream.getTracks().forEach(t => t.stop());
            this.localStream = null;
            document.getElementById('screen-module').style.display = 'none';
            this.broadcast({ type: 'SHARE_OFF' });
            return;
        }
        this.localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        document.getElementById('screen-module').style.display = 'block';
        document.getElementById('shared-video').srcObject = this.localStream;
        this.conns.forEach(c => this.peer.call(c.peer, this.localStream));
    }

    initNotes() {
        const area = document.getElementById('note-area');
        area.value = localStorage.getItem(`note_${this.room}`) || '';
        area.oninput = () => {
            localStorage.setItem(`note_${this.room}`, area.value);
            document.getElementById('save-status').innerText = 'Saving...';
            setTimeout(() => document.getElementById('save-status').innerText = 'Saved', 500);
        };
    }

    copyInviteUrl() {
        const url = `${window.location.origin}${window.location.pathname}?room=${this.room}&role=student`;
        navigator.clipboard.writeText(url); alert('招待リンクをコピーしました');
    }
}

const app = new UltimateApp();
setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
window.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('room')) {
        document.getElementById('init-room').value = p.get('room');
        if (p.get('role') === 'student') document.getElementById('btn-init-host').style.display = 'none';
    }
});
</script>
</body>
</html>
