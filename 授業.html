<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture DX v22.0 | Student Portal</title>
    
    <!-- External Dependencies: PeerJS (High-speed P2P) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <style>
        /* 
           =============================================================
           1. DESIGN SYSTEM
           ============================================================= 
        */
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-deep: #05070a;
            --bg-main: #0c0f1a;
            --bg-sidebar: #0f121d;
            --bg-panel: #161b2c;
            --bg-card: #202638;
            --bg-hover: #2d3654;
            --bg-input: #0a0c14;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #475569;
            --secondary: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --border: rgba(255, 255, 255, 0.08);
            --radius-xl: 28px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-xl: 0 25px 60px -12px rgba(0, 0, 0, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; outline: none; border: none; }
        html, body { height: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', -apple-system, system-ui, sans-serif; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 10px; }

        /* 
           =============================================================
           2. AUTHENTICATION (GATEWAY)
           ============================================================= 
        */
        #auth-overlay {
            position: fixed; inset: 0; background: radial-gradient(circle at top right, #1e1b4b, var(--bg-deep));
            display: flex; align-items: center; justify-content: center; z-index: 20000; transition: var(--transition);
        }
        .auth-card {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-xl);
            width: min(95vw, 460px); padding: 50px; box-shadow: var(--shadow-xl); text-align: center;
        }
        .auth-logo { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; color: var(--primary); text-shadow: 0 0 35px var(--primary-glow); }
        .auth-desc { color: var(--text-sub); font-size: 0.8rem; margin-bottom: 40px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .input-box { margin-bottom: 25px; text-align: left; }
        .input-box label { display: block; font-size: 0.7rem; color: var(--text-sub); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; }
        .text-input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 16px 22px; color: white; font-size: 1rem; transition: var(--transition);
        }
        .text-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        /* 
           =============================================================
           3. SHELL & NAVIGATION
           ============================================================= 
        */
        .app-shell { display: none; height: 100vh; grid-template-columns: 90px 1fr 320px; opacity: 0; }
        .app-shell.active { display: grid; opacity: 1; transition: 1s; }

        nav.sidebar {
            background: var(--bg-sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 35px 0; gap: 28px;
        }
        .sidebar-logo { color: var(--primary); margin-bottom: 15px; font-weight: 900; font-size: 1.4rem; }
        .nav-item {
            width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
            color: var(--text-sub); cursor: pointer; transition: var(--transition); position: relative;
        }
        .nav-item:hover { background: var(--bg-hover); color: white; }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 10px 30px var(--primary-glow); }
        .nav-item::after {
            content: attr(data-label); position: absolute; left: 80px; background: var(--bg-card); color: white;
            font-size: 0.8rem; padding: 8px 16px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100;
        }
        .nav-item:hover::after { opacity: 1; left: 95px; }

        .content-area { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-main); border-right: 1px solid var(--border); }
        
        header {
            height: 70px; padding: 0 35px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border); background: rgba(12, 15, 26, 0.6); backdrop-filter: blur(20px); z-index: 50;
        }
        .badge { padding: 5px 14px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; border: 1px solid var(--border); }
        .badge-teacher { background: var(--primary-glow); color: var(--primary-light); }
        .badge-student { background: rgba(16, 185, 129, 0.1); color: var(--secondary); }

        .main-viewport { flex: 1; position: relative; padding: 25px; overflow: hidden; }

        .pane {
            position: absolute; inset: 25px; visibility: hidden; opacity: 0;
            display: flex; flex-direction: column; transition: 0.3s;
            transform: translateY(10px);
        }
        .pane.active { visibility: visible; opacity: 1; transform: translateY(0); z-index: 10; }

        .glass-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-xl); display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .pane-head { padding: 18px 25px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; }
        .pane-body { padding: 25px; flex: 1; overflow-y: auto; }

        /* 
           =============================================================
           4. MODULE SPECIFIC
           ============================================================= 
        */
        #survey-push-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
            display: none; align-items: center; justify-content: center; z-index: 30000;
        }
        .survey-push-card {
            background: var(--bg-panel); border: 2px solid var(--primary); border-radius: var(--radius-xl);
            width: min(90vw, 500px); padding: 45px; text-align: center;
        }
        .sv-opt-btn {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
            color: white; padding: 18px; text-align: center; cursor: pointer; transition: var(--transition);
            font-weight: 700; font-size: 1rem; margin-bottom: 12px; width: 100%;
        }
        .sv-opt-btn:hover { background: var(--primary); transform: scale(1.02); }

        canvas { background: white; border-radius: var(--radius-md); width: 100%; height: 100%; cursor: default; }

        .msg-log-item { background: var(--bg-card); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .msg-sender { font-size: 0.65rem; font-weight: 900; color: var(--primary-light); margin-bottom: 4px; text-transform: uppercase; }
        .msg-body { font-size: 0.85rem; line-height: 1.4; }

        .btn { padding: 12px 20px; border-radius: var(--radius-md); cursor: pointer; font-weight: 800; font-size: 0.75rem; transition: var(--transition); color: white; text-transform: uppercase; }
        .btn-primary { background: var(--primary); box-shadow: 0 8px 20px var(--primary-glow); }
        .btn-ghost { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-sub); }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 6px 12px; font-size: 0.65rem; }

        #timer-display { font-size: 8rem; font-weight: 900; font-family: var(--font-mono); color: var(--danger); text-shadow: 0 0 30px rgba(244, 63, 94, 0.3); }

        /* Role Display Control */
        .teacher-only { display: none !important; }
        body.is-teacher .teacher-only { display: flex !important; }
        body.is-teacher .teacher-only-block { display: block !important; }
        
        .student-only { display: none !important; }
        body.is-student .student-only { display: flex !important; }

        #reaction-layer { position: fixed; inset: 0; pointer-events: none; z-index: 15000; }
        .float-emoji { position: absolute; bottom: -50px; font-size: 3rem; animation: floatUp 3s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-100vh) scale(1.2); opacity: 0; } }
    </style>
</head>
<body>

<!-- [GATEWAY] -->
<div id="auth-overlay">
    <div class="auth-card">
        <div class="auth-logo">LECTURE DX</div>
        <div class="auth-desc">Universal Command Suite</div>
        
        <div id="auth-fields">
            <div class="input-box">
                <label>ROOM ID</label>
                <input type="text" id="init-room-id" class="text-input" placeholder="Enter Room Name">
            </div>
            <div class="input-box">
                <label>YOUR NAME</label>
                <input type="text" id="init-user-name" class="text-input" placeholder="Enter Your Name">
            </div>
            
            <div id="auth-buttons" style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:30px;">
                <button class="btn btn-ghost" onclick="app.ignition('student')">生徒として参加</button>
                <button class="btn btn-primary" onclick="app.ignition('teacher')">教員として開始</button>
            </div>
        </div>
    </div>
</div>

<!-- [SURVEY POPUP] -->
<div id="survey-push-overlay">
    <div class="survey-push-card">
        <div id="sv-push-q" style="font-size: 1.5rem; font-weight: 900; margin-bottom: 30px; line-height: 1.3;">質問を受信しました</div>
        <div id="sv-push-options"></div>
        <p style="margin-top:20px; color:var(--text-dim); font-size:0.75rem;">※回答すると自動的に閉じます。</p>
    </div>
</div>

<div id="reaction-layer"></div>

<!-- [MAIN SHELL] -->
<div class="app-shell" id="app-shell">
    
    <nav class="sidebar">
        <div class="sidebar-logo">LDX</div>
        <div class="nav-item active" id="nav-note" data-label="授業ノート" onclick="app.switchPane('note')">📝</div>
        <div class="nav-item" id="nav-sketch" data-label="スケッチ" onclick="app.switchPane('sketch')">🎨</div>
        <div class="nav-item teacher-only" id="nav-survey" data-label="アンケート管理" onclick="app.switchPane('survey')">📊</div>
        <div class="nav-item" id="nav-timer" data-label="タイマー" onclick="app.switchPane('timer')">⏰</div>
        <div class="nav-item teacher-only" id="nav-admin" data-label="管理" onclick="app.switchPane('admin')">👥</div>
    </nav>

    <div class="content-area">
        <header>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="role-badge" class="badge">---</span>
                <span id="room-id-display" style="font-size:0.8rem; font-weight:800; color:var(--text-sub);">ID: --</span>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <div id="mini-timer" style="font-family:var(--font-mono); font-weight:900; color:var(--warning); margin-right:15px;">00:00</div>
                <button class="btn btn-ghost btn-sm teacher-only" onclick="app.copyInviteUrl()">URLコピー</button>
                <button class="btn btn-primary btn-sm teacher-only" id="btn-share" onclick="app.toggleScreenShare()">画面共有</button>
            </div>
        </header>

        <main class="main-viewport">
            <!-- ビデオストリーミング -->
            <video id="shared-video" autoplay playsinline style="display:none; width:100%; border-radius:16px; margin-bottom:20px; background:#000; aspect-ratio:16/9;"></video>

            <!-- 授業ノート -->
            <div id="pane-note" class="pane active">
                <div class="glass-card">
                    <div class="pane-head">
                        <span>📝 Lecture Notes</span>
                        <div class="teacher-only">
                            <button class="btn btn-ghost btn-sm" onclick="app.clearNote()">クリア</button>
                        </div>
                    </div>
                    <div class="pane-body" style="padding:0;">
                        <textarea id="note-editor" class="teacher-only-block" style="width:100%; height:100%; background:transparent; color:white; padding:30px; font-size:1.1rem; line-height:1.6; resize:none;" placeholder="ここに授業内容を入力..."></textarea>
                        <div id="note-viewer" class="student-only" style="padding:30px; font-size:1.1rem; line-height:1.6; white-space:pre-wrap;">教員のノートを待機中...</div>
                    </div>
                </div>
            </div>

            <!-- スケッチ -->
            <div id="pane-sketch" class="pane">
                <div class="glass-card">
                    <div class="pane-head">
                        <span>🎨 Sketch Board</span>
                        <div class="teacher-only" style="gap:10px;">
                            <input type="color" id="sk-color" value="#6366f1">
                            <button class="btn btn-ghost btn-sm" onclick="app.canvasClear()">消去</button>
                        </div>
                    </div>
                    <div class="pane-body" style="position:relative; background:#fff; margin:20px; border-radius:12px; padding:0;">
                        <canvas id="sketch-canvas"></canvas>
                        <div id="sketch-lock" class="student-only" style="position:absolute; inset:0; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; border-radius:12px;">教員がボードを公開するまでお待ちください</div>
                    </div>
                </div>
            </div>

            <!-- アンケート（教員専用） -->
            <div id="pane-survey" class="pane teacher-only-block">
                <div class="glass-card">
                    <div class="pane-head">📊 Survey Master</div>
                    <div class="pane-body" style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
                        <div>
                            <label style="display:block; margin-bottom:10px; font-size:0.7rem; font-weight:800;">QUESTION</label>
                            <input type="text" id="sv-q" class="text-input" style="margin-bottom:20px;">
                            <label style="display:block; margin-bottom:10px; font-size:0.7rem; font-weight:800;">OPTIONS (Comma separated)</label>
                            <input type="text" id="sv-opts" class="text-input" placeholder="Yes, No, Maybe">
                            <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="app.sendSurvey()">配信開始</button>
                        </div>
                        <div id="sv-results" style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px;">結果がここに表示されます</div>
                    </div>
                </div>
            </div>

            <!-- タイマー -->
            <div id="pane-timer" class="pane">
                <div class="glass-card">
                    <div class="pane-head">⏰ Synchronized Timer</div>
                    <div class="pane-body" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                        <div id="timer-display">00:00</div>
                        <div class="teacher-only" style="margin-top:30px; gap:10px;">
                            <input type="number" id="t-min" value="5" class="text-input" style="width:100px; display:inline-block; margin-right:10px;">
                            <button class="btn btn-primary" onclick="app.startTimer()">START</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 管理（教員専用） -->
            <div id="pane-admin" class="pane teacher-only-block">
                <div class="glass-card">
                    <div class="pane-head">👥 Class Administration</div>
                    <div class="pane-body">
                        <div style="font-size:1.5rem; font-weight:900; margin-bottom:20px;">接続中: <span id="user-count">0</span></div>
                        <div id="user-list" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:15px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 掲示板 -->
    <aside style="background:var(--bg-sidebar); display:flex; flex-direction:column;">
        <div style="padding:20px; font-size:0.7rem; font-weight:900; color:var(--text-dim); border-bottom:1px solid var(--border);">REACTIONS & LOG</div>
        <div id="log-area" style="flex:1; padding:20px; overflow-y:auto;"></div>
        <div style="padding:20px; border-top:1px solid var(--border);">
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
                <button class="btn btn-ghost btn-sm" onclick="app.emoji('👏')">👏</button>
                <button class="btn btn-ghost btn-sm" onclick="app.emoji('👍')">👍</button>
                <button class="btn btn-ghost btn-sm" onclick="app.emoji('❓')">❓</button>
            </div>
            <div class="student-only">
                <button id="hand-btn" class="btn btn-primary" style="width:100%; background:var(--warning); color:black;" onclick="app.toggleHand()">🖐 挙手 / 質問</button>
            </div>
        </div>
    </aside>
</div>

<script>
class LectureDX {
    constructor() {
        this.peer = null;
        this.conns = new Map();
        this.role = '';
        this.room = '';
        this.name = '';
        this.survey = { q:'', opts:[], votes:{} };
        this.isHandUp = false;
    }

    ignition(role) {
        this.role = role;
        this.room = document.getElementById('init-room-id').value.trim() || 'default';
        this.name = document.getElementById('init-user-name').value.trim() || 'Guest';

        const pid = role === 'teacher' ? `ldx22-${this.room}-host` : `ldx22-${this.room}-${Math.random().toString(36).substr(2,6)}`;
        this.peer = new Peer(pid);

        this.peer.on('open', () => {
            document.body.classList.add(`is-${role}`);
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('app-shell').classList.add('active');
            document.getElementById('role-badge').innerText = role.toUpperCase();
            document.getElementById('role-badge').className = `badge badge-${role}`;
            document.getElementById('room-id-display').innerText = `ID: ${this.room}`;
            
            if(role === 'teacher') this.setupTeacher();
            else this.setupStudent();
            
            this.initCanvas();
            this.initNote();
        });

        this.peer.on('call', call => {
            call.answer();
            call.on('stream', s => {
                const v = document.getElementById('shared-video');
                v.style.display = 'block';
                v.srcObject = s;
            });
        });

        this.peer.on('error', () => {
            alert("接続エラー。ルーム名を確認するか、教員が開始しているか確認してください。");
            location.reload();
        });
    }

    setupTeacher() {
        this.peer.on('connection', conn => {
            conn.on('open', () => {
                this.conns.set(conn.peer, conn);
                conn.on('data', d => this.handleData(d, conn));
                this.syncTo(conn);
                this.updateAdmin();
            });
            conn.on('close', () => {
                this.conns.delete(conn.peer);
                this.updateAdmin();
            });
        });
    }

    setupStudent() {
        this.host = this.peer.connect(`ldx22-${this.room}-host`);
        this.host.on('open', () => {
            this.host.send({ type:'JOIN', name: this.name });
        });
        this.host.on('data', d => this.handleData(d));
    }

    handleData(d, conn) {
        switch(d.type) {
            case 'JOIN': 
                this.log('SYSTEM', `${d.name} joined.`);
                conn.userName = d.name;
                this.updateAdmin();
                break;
            case 'NOTE': 
                document.getElementById('note-viewer').innerText = d.val; 
                break;
            case 'SKETCH': 
                this.drawRemote(d.val); 
                document.getElementById('sketch-lock').style.display = 'none';
                break;
            case 'SURVEY_PUSH': 
                this.showSurvey(d); 
                break;
            case 'VOTE': 
                this.survey.votes[d.opt]++; 
                this.renderResults(); 
                break;
            case 'TIMER': 
                this.runTimer(d.end); 
                break;
            case 'EMOJI': 
                this.spawnEmoji(d.val); 
                break;
            case 'HAND': 
                conn.hand = d.val;
                this.log('HAND', `${conn.userName} raised hand!`);
                this.updateAdmin();
                break;
        }
    }

    /* NOTE */
    initNote() {
        const ed = document.getElementById('note-editor');
        if(this.role === 'teacher') {
            ed.oninput = () => this.broadcast({ type:'NOTE', val: ed.value });
        }
    }
    clearNote() {
        if(confirm("Delete all?")) {
            document.getElementById('note-editor').value = '';
            this.broadcast({ type:'NOTE', val: '' });
        }
    }

    /* CANVAS */
    initCanvas() {
        const cv = document.getElementById('sketch-canvas');
        const ctx = cv.getContext('2d');
        const resize = () => { cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; };
        window.onresize = resize; resize();

        if(this.role === 'teacher') {
            let drawing = false;
            cv.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
            cv.onmousemove = (e) => {
                if(!drawing) return;
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = document.getElementById('sk-color').value;
                ctx.lineWidth = 3; ctx.stroke();
            };
            cv.onmouseup = () => { drawing = false; this.broadcast({ type:'SKETCH', val: cv.toDataURL() }); };
        }
    }
    drawRemote(data) {
        const cv = document.getElementById('sketch-canvas');
        const ctx = cv.getContext('2d');
        const img = new Image();
        img.onload = () => { ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0); };
        img.src = data;
    }
    canvasClear() {
        const cv = document.getElementById('sketch-canvas');
        cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
        this.broadcast({ type:'SKETCH', val: cv.toDataURL() });
    }

    /* SURVEY */
    sendSurvey() {
        const q = document.getElementById('sv-q').value;
        const opts = document.getElementById('sv-opts').value.split(',').map(o => o.trim());
        this.survey = { q, opts, votes: Object.fromEntries(opts.map(o=>[o,0])) };
        this.broadcast({ type:'SURVEY_PUSH', q, opts });
        this.renderResults();
    }
    showSurvey(d) {
        const over = document.getElementById('survey-push-overlay');
        const box = document.getElementById('sv-push-options');
        document.getElementById('sv-push-q').innerText = d.q;
        box.innerHTML = '';
        d.opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'sv-opt-btn'; b.innerText = o;
            b.onclick = () => { this.host.send({ type:'VOTE', opt: o }); over.style.display = 'none'; };
            box.appendChild(b);
        });
        over.style.display = 'flex';
    }
    renderResults() {
        const res = document.getElementById('sv-results');
        res.innerHTML = `<h4>${this.survey.q}</h4>`;
        this.survey.opts.forEach(o => {
            res.innerHTML += `<div style="margin-top:10px;">${o}: ${this.survey.votes[o]}</div>`;
        });
    }

    /* TIMER */
    startTimer() {
        const end = Date.now() + document.getElementById('t-min').value * 60000;
        this.broadcast({ type:'TIMER', end });
        this.runTimer(end);
    }
    runTimer(end) {
        if(this.itv) clearInterval(this.itv);
        this.itv = setInterval(() => {
            const diff = end - Date.now();
            if(diff <= 0) { clearInterval(this.itv); return; }
            const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
            const str = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            document.getElementById('timer-display').innerText = str;
            document.getElementById('mini-timer').innerText = str;
        }, 1000);
    }

    /* UI / UTILS */
    switchPane(id) {
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`pane-${id}`).classList.add('active');
        document.getElementById(`nav-${id}`).classList.add('active');
    }
    broadcast(data) { this.conns.forEach(c => c.send(data)); }
    syncTo(c) {
        c.send({ type:'NOTE', val: document.getElementById('note-editor').value });
    }
    log(type, msg) {
        const l = document.getElementById('log-area');
        l.innerHTML += `<div class="msg-log-item"><div class="msg-sender">${type}</div><div class="msg-body">${msg}</div></div>`;
        l.scrollTop = l.scrollHeight;
    }
    updateAdmin() {
        document.getElementById('user-count').innerText = this.conns.size;
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        this.conns.forEach(c => {
            list.innerHTML += `<div class="btn btn-ghost" style="text-align:left;">${c.hand ? '🖐 ' : '👤 '} ${c.userName || 'Unknown'}</div>`;
        });
    }
    toggleHand() {
        this.isHandUp = !this.isHandUp;
        document.getElementById('hand-btn').innerText = this.isHandUp ? '✋ 挙手を下ろす' : '🖐 挙手 / 質問';
        this.host.send({ type:'HAND', val: this.isHandUp });
    }
    emoji(e) {
        this.spawnEmoji(e);
        if(this.role === 'teacher') this.broadcast({ type:'EMOJI', val: e });
        else this.host.send({ type:'EMOJI', val: e });
    }
    spawnEmoji(e) {
        const div = document.createElement('div');
        div.className = 'float-emoji'; div.innerText = e;
        div.style.left = Math.random() * 80 + '%';
        document.getElementById('reaction-layer').appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }
    copyInviteUrl() {
        const url = location.origin + location.pathname + '?room=' + this.room;
        navigator.clipboard.writeText(url);
        alert("招待用URLをコピーしました");
    }
}

const app = new LectureDX();

// URLパラメータ確認
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if(params.has('room')) {
        document.getElementById('init-room-id').value = params.get('room');
        // URLからの場合は生徒ボタンを強調し、教員ボタンを隠す
        document.getElementById('auth-buttons').innerHTML = `
            <button class="btn btn-primary" style="grid-column: span 2; height:60px; font-size:1rem;" onclick="app.ignition('student')">授業に参加する</button>
        `;
        document.querySelector('.auth-desc').innerText = "Student Access Mode";
    }
};
</script>
