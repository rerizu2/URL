<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHF RFID Tag Scanner</title>
    <style>
        :root {
            --uniqlo-red: #ff0000;
        }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; width: 100%; max-width: 500px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid var(--uniqlo-red); }
        h1 { font-size: 1.2rem; text-align: center; color: #333; margin-bottom: 20px; }
        
        /* 入力エリアを隠さない程度に配置（USBリーダーの受け皿） */
        .scan-area { background: #f9f9f9; padding: 20px; border: 2px dashed #ccc; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        #usbInput { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; text-align: center; }
        
        .counter { font-size: 2rem; font-weight: bold; color: var(--uniqlo-red); margin: 10px 0; }
        
        /* 読み取り履歴リスト */
        .history-list { list-style: none; padding: 0; margin-top: 20px; border-top: 1px solid #eee; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; font-family: monospace; background: #fff; animation: slideIn 0.3s ease-out; }
        .history-item:first-child { background: #fffde7; font-weight: bold; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .clear-btn { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; float: right; font-size: 0.8rem; }
        .status-msg { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>RFID 商品スキャナー</h1>
    
    <div class="scan-area">
        <div class="status-msg">USBリーダーを接続し、以下にカーソルを置いてください</div>
        <input type="text" id="usbInput" placeholder="スキャン待機中..." autofocus>
        <div class="counter">合計: <span id="itemCount">0</span> 点</div>
    </div>

    <button class="clear-btn" onclick="clearList()">リストを消去</button>
    <h2 style="font-size: 1rem;">読み取り履歴</h2>
    <div id="history" class="history-list">
        <!-- ここにスキャン結果が追加されます -->
    </div>
</div>

<script>
    const usbInput = document.getElementById('usbInput');
    const historyDiv = document.getElementById('history');
    const itemCountSpan = document.getElementById('itemCount');
    
    // 重複読み込み防止用のセット
    let scannedTags = new Set();

    // 入力イベント（USBスキャナーからのデータ）
    usbInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const tagId = usbInput.value.trim();
            if (tagId) {
                processTag(tagId);
            }
            // 次の読み取りのために即座に入力欄を空にする
            usbInput.value = '';
        }
    });

    function processTag(id) {
        // 重複チェック（一度の会計で同じタグを二回数えない）
        if (scannedTags.has(id)) {
            // 既に読み取っている場合は視覚的なフィードバックだけ
            usbInput.style.backgroundColor = "#ffebee";
            setTimeout(() => usbInput.style.backgroundColor = "white", 200);
            return;
        }

        scannedTags.add(id);
        
        // リストに追加
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<span>ID: ${id.substring(0, 20)}...</span><span>1点</span>`;
        historyDiv.insertBefore(item, historyDiv.firstChild);

        // カウント更新
        itemCountSpan.textContent = scannedTags.size;

        // 成功時の色変化
        usbInput.style.backgroundColor = "#e8f5e9";
        setTimeout(() => usbInput.style.backgroundColor = "white", 200);
    }

    function clearList() {
        scannedTags.clear();
        historyDiv.innerHTML = '';
        itemCountSpan.textContent = '0';
        usbInput.focus();
    }

    // フォーカスが外れたら自動で戻す（スキャン漏れ防止）
    document.addEventListener('click', () => {
        usbInput.focus();
    });
</script>

</body>
</html>
