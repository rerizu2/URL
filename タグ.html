<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-IC Scanner</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 450px; }
        .mode-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 10px; background: #eee; }
        
        #status { margin: 15px 0; padding: 15px; border-radius: 8px; font-weight: bold; background: #f8f9fa; border: 1px solid #ddd; }
        .scanning { color: #007bff; border-color: #007bff; animation: blink 1.5s infinite; }
        .success { color: #28a745; border-color: #28a745; background: #eaffef; }
        
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 10px; }
        button:disabled { background: #ccc; }

        .input-area { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; text-align: center; }
        
        #log { margin-top: 20px; text-align: left; font-family: monospace; font-size: 0.9rem; max-height: 100px; overflow-y: auto; background: #333; color: #fff; padding: 10px; border-radius: 4px; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h2>ICタグスキャナー</h2>
    
    <!-- スマホ用 Web NFC セクション -->
    <div id="nfcSection">
        <div class="mode-badge">スマホ内蔵NFC</div>
        <button id="nfcBtn">スマホでスキャン開始</button>
    </div>

    <div id="status">USBリーダー待機中...</div>

    <!-- USBリーダー用 セクション -->
    <div class="input-area">
        <div class="mode-badge">USBリーダー (キーボード入力型)</div>
        <input type="text" id="usbInput" placeholder="ここにフォーカスしてスキャン" autofocus>
        <p style="font-size: 0.7rem; color: #666;">※USBリーダー使用時はこの枠にカーソルを置いてください</p>
    </div>

    <div id="log">ログ: 待機中...</div>
</div>

<script>
    const statusDiv = document.getElementById('status');
    const usbInput = document.getElementById('usbInput');
    const nfcBtn = document.getElementById('nfcBtn');
    const logDiv = document.getElementById('log');

    // ログ出力用関数
    function addLog(msg) {
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML = `[${time}] ${msg}<br>` + logDiv.innerHTML;
    }

    // --- 1. USBスキャナー対応 (キーボードエミュレーション) ---
    // USBスキャナーは「数字を打ち込んで最後にEnterを押す」動作が一般的
    usbInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = usbInput.value;
            if (val) {
                statusDiv.textContent = "USB読み取り成功！";
                statusDiv.className = "success";
                addLog("USB読込: " + val);
                
                // 次の読み取りのためにクリア
                setTimeout(() => {
                    usbInput.value = '';
                    statusDiv.textContent = "USBリーダー待機中...";
                    statusDiv.className = "";
                }, 2000);
            }
        }
    });

    // 画面のどこをクリックしても入力欄にフォーカスを戻す（利便性のため）
    document.addEventListener('click', () => {
        // NFCボタン以外を押したときは入力欄へ
        if (document.activeElement.tagName !== 'BUTTON') {
            usbInput.focus();
        }
    });


    // --- 2. Web NFC対応 (Android Chrome用) ---
    if (!('NDEFReader' in window)) {
        nfcBtn.textContent = "このブラウザはNFC非対応です";
        nfcBtn.disabled = true;
    } else {
        nfcBtn.addEventListener('click', async () => {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                
                statusDiv.textContent = "NFCスキャン中...";
                statusDiv.className = "scanning";
                nfcBtn.disabled = true;

                ndef.addEventListener("reading", ({ message, serialNumber }) => {
                    statusDiv.textContent = "NFC読み取り成功！";
                    statusDiv.className = "success";
                    addLog("NFC(UID): " + serialNumber);
                    
                    setTimeout(() => {
                        statusDiv.textContent = "USBリーダー待機中...";
                        statusDiv.className = "";
                        nfcBtn.disabled = false;
                    }, 3000);
                });

            } catch (error) {
                addLog("エラー: " + error);
                nfcBtn.disabled = false;
            }
        });
    }
</script>

</body>
</html>
