<script>


/* ==========================================

   ★★★ ここを変更 ★★★

const GAS_URL =
    "ここにGoogle Apps ScriptのWebアプリURLを入れてください";



/* ==========================================
   変数
========================================== */

let mediaRecorder =

let audioChunks =
    [];


let currentStream =

let startTime =

/* ==========================================
   HTML

const microphoneSelect =
    document.getElementById(

    );


const refreshButton =
    document.getElementById(

    );

/* ==========================================
   メッセージ
========================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}



/* ==========================================
   マイク一覧取得
========================================== */

async function loadMicrophones() {

    try {


        /*
         * マイク一覧を取得するには
         * 一度マイク許可を取得する必要があります。
         */

        let devices =
            await navigator
                .mediaDevices
                .enumerateDevices();


        let audioInputs =
            devices.filter(
                device =>
                    device.kind ===
                    "audioinput"
            );


        /*
         * マイクがない
         */

        if (
            audioInputs.length === 0
        ) {

            microphoneSelect.innerHTML = `

                <option value="">
                    マイクが見つかりません
                </option>

            `;

            return;

        }


        /*
         * 現在選択されているID
         */

        const previousId =
            microphoneSelect.value;


        /*
         * 一旦クリア
         */

        microphoneSelect.innerHTML =
            "";


        /*
         * マイクを追加
         */

        audioInputs.forEach(
            (device, index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    device.deviceId;


                /*
                 * ラベルが空の場合
                 * 「マイク 1」などを表示
                 */

                option.textContent =
                    device.label ||
                    `マイク ${index + 1}`;


                /*
                 * 前回選択していた
                 * マイクを維持
                 */

                if (
                    previousId &&
                    device.deviceId ===
                        previousId
                ) {

                    option.selected =
                        true;

                }


                microphoneSelect
                    .appendChild(
                        option
                    );

            }
        );


        showMessage(
            `${audioInputs.length}個のマイクを検出しました。`,
            "success"
        );


    }
    catch (error) {

        console.error(
            error
        );


        showMessage(
            "マイク一覧を取得できませんでした。",
            "error"
        );

    }

}



/* ==========================================
   初回マイク許可
========================================== */

async function requestMicrophonePermission() {

    try {


        /*
         * 最初にマイク許可を取得
         *
         * これによってChromeなどで
         * マイク名が表示されるようになります。
         */

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        /*
         * 許可取得後すぐ停止
         */

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        /*
         * マイク一覧を再取得
         */

        await loadMicrophones();


    }
    catch (error) {

        console.error(
            error
        );


        microphoneSelect.innerHTML = `

            <option value="">
                マイクの使用を許可してください
            </option>

        `;


        showMessage(
            "マイクの使用を許可すると、使用するマイクを選択できます。",
            "error"
        );

    }

}



/* ==========================================
   更新ボタン
========================================== */

refreshButton.addEventListener(
    "click",
    async function () {

        await loadMicrophones();

    }
);



/* ==========================================
   デバイス接続・切断監視
========================================== */

navigator
    .mediaDevices
    .addEventListener(
        "devicechange",
        function () {

            loadMicrophones();

        }
    );



/* ==========================================
   録音形式
========================================== */

function getSupportedMimeType() {

    const types = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/ogg;codecs=opus",

        "audio/ogg"

    ];


    for (
        const type of types
    ) {

        if (
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ) {

            return type;

        }

    }


    return "";

}



/* ==========================================
   タイマー
========================================== */

function updateTimer() {

    if (!startTime) {

        return;

    }


    const elapsed =
        Date.now() -
        startTime;


    const totalSeconds =
        Math.floor(
            elapsed / 1000
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    timer.textContent =

        String(hours)
            .padStart(
                2,
                "0"
            )

        + ":"

        +

        String(minutes)
            .padStart(
                2,
                "0"
            )

        + ":"

        +

        String(seconds)
            .padStart(
                2,
                "0"
            );

}



/* ==========================================
   録音開始
========================================== */

startButton.addEventListener(
    "click",
    async function () {

        try {


            /*
             * GAS URLチェック
             */

            if (
                GAS_URL.includes(
                    "ここにGoogle Apps Script"
                )
            ) {

                showMessage(
                    "Google Apps ScriptのURLを設定してください。",
                    "error"
                );

                return;

            }


            /*
             * マイクID
             */

            const deviceId =
                microphoneSelect.value;


            if (!deviceId) {

                showMessage(
                    "使用するマイクを選択してください。",
                    "error"
                );

                return;

            }


            /*
             * 選択したマイクを取得
             */

            currentStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio: {

                            deviceId: {
                                exact:
                                    deviceId
                            },

                            echoCancellation:
                                true,

                            noiseSuppression:
                                true,

                            autoGainControl:
                                true

                        }

                    });


            /*
             * 録音データ初期化
             */

            audioChunks =
                [];


            /*
             * 録音形式
             */

            const mimeType =
                getSupportedMimeType();


            /*
             * MediaRecorder作成
             */

            if (mimeType) {

                mediaRecorder =
                    new MediaRecorder(
                        currentStream,
                        {
                            mimeType:
                                mimeType
                        }
                    );

            }
            else {

                mediaRecorder =
                    new MediaRecorder(
                        currentStream
                    );

            }


            /*
             * 音声データ
             */

            mediaRecorder
                .addEventListener(
                    "dataavailable",
                    function (event) {

                        if (
                            event.data &&
                            event.data.size > 0
                        ) {

                            audioChunks.push(
                                event.data
                            );

                        }

                    }
                );


            /*
             * 録音停止
             */

            mediaRecorder
                .addEventListener(
                    "stop",
                    async function () {

                        try {


                            /*
                             * MIMEタイプ
                             */

                            const finalMimeType =
                                mediaRecorder.mimeType ||
                                "audio/webm";


                            /*
                             * Blob
                             */

                            const audioBlob =
                                new Blob(
                                    audioChunks,
                                    {
                                        type:
                                            finalMimeType
                                    }
                                );


                            /*
                             * マイク停止
                             */

                            if (
                                currentStream
                            ) {

                                currentStream
                                    .getTracks()
                                    .forEach(
                                        track => {

                                            track.stop();

                                        }
                                    );

                            }


                            /*
                             * Driveへ保存
                             */

                            await uploadToDrive(
                                audioBlob
                            );


                        }
                        catch (error) {

                            console.error(
                                error
                            );


                            status.textContent =
                                "⚠ エラー";


                            showMessage(
                                "録音データの処理中にエラーが発生しました。",
                                "error"
                            );

                        }

                    }
                );


            /*
             * 録音開始
             */

            mediaRecorder.start();


            /*
             * タイマー開始
             */

            startTime =
                Date.now();


            timerInterval =
                setInterval(
                    updateTimer,
                    1000
                );


            /*
             * UI
             */

            recorder
                .classList
                .add(
                    "recording"
                );


            status.textContent =
                "🔴 録音中";


            startButton.disabled =
                true;


            stopButton.disabled =
                false;


            microphoneSelect.disabled =
                true;


            refreshButton.disabled =
                true;


            driveResult
                .classList
                .remove(
                    "show"
                );


            showMessage(
                "選択したマイクで録音しています。",
                "success"
            );


        }
        catch (error) {

            console.error(
                error
            );


            if (
                error.name ===
                "NotAllowedError"
            ) {

                showMessage(
                    "マイクの使用が拒否されています。ブラウザの設定からマイクを許可してください。",
                    "error"
                );

            }
            else if (
                error.name ===
                "NotFoundError"
            ) {

                showMessage(
                    "選択したマイクが見つかりません。",
                    "error"
                );

            }
            else {

                showMessage(
                    "選択したマイクを使用できませんでした。",
                    "error"
                );

            }

        }

    }
);

/* ==========================================
   Blob → Base64
========================================== */

function blobToBase64(
    blob
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {


            const reader =
                new FileReader();


            reader.onload =
                function () {

                    try {

                        const result =
                            reader.result;


                        const base64 =
                            result
                                .split(
                                    ","
                                )[1];


                        resolve(
                            base64
                        );

                    }
                    catch (error) {

                        reject(
                            error
                        );

                    }

                };


            reader.onerror =
                function () {

                    reject(
                        reader.error
                    );

                };


            reader.readAsDataURL(
                blob
            );

        }
    );

}



/* ==========================================
   Google Drive保存
========================================== */

async function uploadToDrive(
    blob
) {

    try {


        showMessage(
            "音声データを変換しています..."
        );


        /*
         * Base64
         */

        const base64 =
            await blobToBase64(
                blob
            );


        /*
         * ファイル名
         */

        const fileName =
            createFileName();


        /*
         * データ
         */

        const data = {

            base64:
                base64,

            mimeType:
                blob.type ||
                "audio/webm",

            fileName:
                fileName

        };


        /*
         * GAS送信
         */

        const response =
            await fetch(
                GAS_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            data
                        )

                }
            );


        /*
         * レスポンス
         */

        const responseText =
            await response.text();


        console.log(
            "GAS:",
            responseText
        );


        /*
         * JSON
         */

        let result;


        try {

            result =
                JSON.parse(
                    responseText
                );

        }
        catch (error) {

            throw new Error(
                "Google Apps Scriptから正しい応答を受信できませんでした。"
            );

        }


        /*
         * エラー
         */

        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Google Driveへの保存に失敗しました。"
            );

        }


        /*
         * 成功
         */

        status.textContent =
            "✅ Google Drive保存完了";


        showMessage(
            "録音データをGoogle Driveへ保存しました。",
            "success"
        );


        /*
         * ファイル名
         */

        driveFileName.textContent =
            "ファイル名："
            +
            result.fileName;


        /*
         * Driveリンク
         */

        driveLink.href =
            result.url;


        /*
         * 表示
         */

        driveResult
            .classList
            .add(
                "show"
            );


    }
    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "⚠ 保存失敗";


        showMessage(
            "Google Driveへの保存に失敗しました。"
            +
            " "
            +
            error.message,
            "error"
        );

    }

}



/* ==========================================
   ファイル名
========================================== */

function createFileName() {

    const now =
        new Date();


    const year =
        now
            .getFullYear();


    const month =
        String(
            now.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        )
        .padStart(
            2,
            "0"
        );


    const hour =
        String(
            now.getHours()
        )
        .padStart(
            2,
            "0"
        );


    const minute =
        String(
            now.getMinutes()
        )
        .padStart(
            2,
            "0"
        );


    const second =
        String(
            now.getSeconds()
        )
        .padStart(
            2,
            "0"
        );


    return (

        "録音_" +

        year +

        month +

        day +

        "_" +

        hour +

        minute +

        second +

        ".webm"

    );

}
