<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>高機能ボイスレコーダー</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    font-family:
        "Noto Sans JP",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    color: #ffffff;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(0, 234, 255, 0.12),
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(105, 60, 255, 0.15),
            transparent 35%
        ),

        #070b12;

    padding: 20px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: min(1050px, 100%);

    margin: 0 auto;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    text-align: center;

    margin:
        20px 0 25px;

}

.header h1 {

    font-size:
        clamp(
            30px,
            6vw,
            52px
        );

    font-weight: 800;

    letter-spacing: 2px;

}

.header p {

    margin-top: 10px;

    color: #9ba9ba;

}


/* =====================================================
   CARD
===================================================== */

.card {

    background:
        rgba(
            15,
            22,
            34,
            0.96
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.08
        );

    border-radius: 28px;

    padding: 30px;

    box-shadow:
        0 30px 80px
        rgba(
            0,
            0,
            0,
            0.45
        );

}


/* =====================================================
   MICROPHONE
===================================================== */

.microphone-section {

    background: #0c1420;

    border:
        1px solid
        #253447;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 30px;

}

.microphone-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 12px;

}

.microphone-title span {

    color: #00eaff;

}

.microphone-row {

    display: flex;

    gap: 10px;

}

.microphone-select {

    flex: 1;

    min-width: 0;

    padding: 14px;

    border-radius: 12px;

    border:
        1px solid
        #344356;

    background: #111b29;

    color: white;

    font-size: 15px;

    outline: none;

}

.microphone-select:focus {

    border-color: #00eaff;

}

.refresh-button {

    white-space: nowrap;

    background: #1d2b3d;

}

.refresh-button:hover {

    background: #2a3c54;

}

.selected-mic {

    margin-top: 12px;

    color: #8190a2;

    font-size: 13px;

}

.selected-mic strong {

    color: #00eaff;

}


/* =====================================================
   RECORDER
===================================================== */

.recorder {

    text-align: center;

}


/* =====================================================
   MICROPHONE ICON
===================================================== */

.mic {

    width: 145px;

    height: 145px;

    margin:
        10px auto 25px;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 62px;

    background:

        linear-gradient(
            145deg,
            #00eaff,
            #0066ff
        );

    box-shadow:

        0 0 40px
        rgba(
            0,
            220,
            255,
            0.35
        );

    transition: 0.3s;

}

.recording .mic {

    background:

        linear-gradient(
            145deg,
            #ff315b,
            #d6003d
        );

    box-shadow:

        0 0 40px
        rgba(
            255,
            0,
            70,
            0.65
        );

    animation:
        pulse 1s infinite;

}

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }

}


/* =====================================================
   STATUS
===================================================== */

.status {

    color: #a8b4c4;

    font-size: 18px;

    margin-bottom: 8px;

}

.recording .status {

    color: #ff5072;

}


/* =====================================================
   TIMER
===================================================== */

.timer {

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            42px,
            9vw,
            72px
        );

    font-weight: bold;

    letter-spacing: 4px;

}


/* =====================================================
   WAVE ANIMATION
===================================================== */

.wave {

    height: 50px;

    margin-top: 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;

}

.wave span {

    width: 4px;

    height: 8px;

    border-radius: 5px;

    background: #00eaff;

    opacity: 0.35;

}

.recording .wave span {

    opacity: 1;

    animation:
        wave 0.6s
        infinite
        alternate;

}

.wave span:nth-child(1) {
    animation-delay: 0s;
}

.wave span:nth-child(2) {
    animation-delay: .1s;
}

.wave span:nth-child(3) {
    animation-delay: .2s;
}

.wave span:nth-child(4) {
    animation-delay: .3s;
}

.wave span:nth-child(5) {
    animation-delay: .4s;
}

.wave span:nth-child(6) {
    animation-delay: .5s;
}

.wave span:nth-child(7) {
    animation-delay: .6s;
}

.wave span:nth-child(8) {
    animation-delay: .7s;
}

.wave span:nth-child(9) {
    animation-delay: .8s;
}

@keyframes wave {

    from {
        height: 8px;
    }

    to {
        height: 42px;
    }

}


/* =====================================================
   BUTTON
===================================================== */

.buttons {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;

    margin-top: 30px;

}

button {

    border: none;

    color: white;

    cursor: pointer;

    padding:
        15px 28px;

    border-radius: 14px;

    font-size: 16px;

    font-weight: bold;

    transition: 0.2s;

}

button:hover {

    transform:
        translateY(-2px);

}

button:active {

    transform:
        translateY(1px);

}

button:disabled {

    opacity: 0.35;

    cursor: not-allowed;

    transform: none;

}

.start-button {

    background:

        linear-gradient(
            135deg,
            #00d4ff,
            #0066ff
        );

}

.stop-button {

    background:

        linear-gradient(
            135deg,
            #ff315b,
            #d9003d
        );

}

.reset-button {

    background: #283547;

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    text-align: center;

    min-height: 25px;

    margin-top: 20px;

    color: #8f9cae;

}

.message.success {

    color: #38e5a1;

}

.message.error {

    color: #ff5c79;

}


/* =====================================================
   RESULT
===================================================== */

.result {

    display: none;

    margin-top: 30px;

    padding: 22px;

    background: #0c1520;

    border:
        1px solid
        #26384d;

    border-radius: 18px;

}

.result.show {

    display: block;

}

.result-title {

    color: #00eaff;

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;

}


/* =====================================================
   AUDIO
===================================================== */

audio {

    width: 100%;

    margin:
        10px 0 20px;

}


/* =====================================================
   WAVEFORM
===================================================== */

.editor {

    margin-top: 25px;

    padding: 20px;

    background: #0a111b;

    border:
        1px solid
        #243448;

    border-radius: 18px;

}

.editor-title {

    color: #00eaff;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 15px;

}


/* =====================================================
   CANVAS
===================================================== */

.waveform-container {

    position: relative;

    width: 100%;

    height: 150px;

    background: #070d15;

    border-radius: 12px;

    overflow: hidden;

    border:
        1px solid
        #26364a;

}

#waveform {

    width: 100%;

    height: 100%;

    display: block;

}


/* =====================================================
   SELECTION
===================================================== */

.selection {

    position: absolute;

    top: 0;

    bottom: 0;

    background:
        rgba(
            0,
            234,
            255,
            0.12
        );

    border-left:
        2px solid
        #00eaff;

    border-right:
        2px solid
        #00eaff;

    pointer-events: none;

}


/* =====================================================
   RANGE
===================================================== */

.range-wrapper {

    margin-top: 20px;

}

.range-row {

    display: grid;

    grid-template-columns:
        100px 1fr 80px;

    align-items: center;

    gap: 10px;

    margin: 12px 0;

}

.range-label {

    color: #9caabd;

    font-size: 14px;

}

.range-value {

    color: #00eaff;

    font-family:
        "Courier New",
        monospace;

    text-align: right;

}

input[type="range"] {

    width: 100%;

    accent-color: #00eaff;

    cursor: pointer;

}


/* =====================================================
   EDIT BUTTON
===================================================== */

.edit-buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 20px;

}

.cut-button {

    background:

        linear-gradient(
            135deg,
            #00d4ff,
            #0077ff
        );

}

.preview-button {

    background: #27384d;

}

.save-button {

    background:

        linear-gradient(
            135deg,
            #00c98d,
            #008b63
        );

}


/* =====================================================
   INFO
===================================================== */

.file-info {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 20px;

}

.info-box {

    padding: 14px;

    background: #111c2a;

    border-radius: 12px;

    text-align: center;

}

.info-label {

    color: #718095;

    font-size: 12px;

    margin-bottom: 5px;

}

.info-value {

    color: #dce5ef;

    font-weight: bold;

    word-break: break-word;

}


/* =====================================================
   SAVE AREA
===================================================== */

.save-area {

    margin-top: 20px;

    padding-top: 20px;

    border-top:
        1px solid
        #253447;

}

.download-button {

    display: inline-block;

    text-decoration: none;

    background:

        linear-gradient(
            135deg,
            #00c98d,
            #008b63
        );

    color: white;

    padding:
        14px 22px;

    border-radius: 12px;

    font-weight: bold;

}


/* =====================================================
   PRIVACY
===================================================== */

.privacy {

    margin-top: 25px;

    padding: 15px;

    border-radius: 13px;

    background: #101923;

    border:
        1px solid
        #263344;

    color: #8795a7;

    font-size: 13px;

    line-height: 1.8;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
    max-width: 650px
) {

    body {
        padding: 10px;
    }

    .card {
        padding: 20px;
        border-radius: 20px;
    }

    .microphone-row {
        flex-direction: column;
    }

    .refresh-button {
        width: 100%;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .range-row {
        grid-template-columns:
            75px 1fr 70px;
    }

    .file-info {
        grid-template-columns: 1fr;
    }

    .edit-buttons {
        flex-direction: column;
    }

    .edit-buttons button {
        width: 100%;
    }

    .mic {
        width: 115px;
        height: 115px;
        font-size: 48px;
    }

}

</style>

/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}



/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    seconds
) {

    seconds =
        Math.max(
            0,
            seconds
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return (

        String(minutes)
            .padStart(
                2,
                "0"
            )

        +

        ":"

        +

        String(secs)
            .padStart(
                2,
                "0"
            )

    );

}


/* =====================================================
   FORMAT LONG TIME
===================================================== */

function formatLongTime(
    seconds
) {

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return (

        String(hours)
            .padStart(
                2,
                "0"
            )

        + ":"

        +

        String(minutes)
            .padStart(
                2,
                "0"
            )

        + ":"

        +

        String(secs)
            .padStart(
                2,
                "0"
            )

    );

}


/* =====================================================
   FILE SIZE
===================================================== */

function formatFileSize(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return (
            bytes +
            " B"
        );

    }

    if (
        bytes < 1024 * 1024
    ) {

        return (
            (bytes / 1024)
                .toFixed(1)
            +
            " KB"
        );

    }

    return (
        (bytes / 1024 / 1024)
            .toFixed(2)
        +
        " MB"
    );

}


/* =====================================================
   MIME TYPE
===================================================== */

function getSupportedMimeType() {

    const types = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/ogg;codecs=opus",

        "audio/mp4"

    ];


    for (
        const type of types
    ) {

        if (
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ) {

            return type;

        }

    }


    return "";

}


/* =====================================================
   EXTENSION
===================================================== */

function getExtension(
    mimeType
) {

    if (
        mimeType.includes(
            "ogg"
        )
    ) {

        return "ogg";

    }

    if (
        mimeType.includes(
            "mp4"
        )
    ) {

        return "mp4";

    }

    return "webm";

}


/* =====================================================
   FILE NAME
===================================================== */

function createFileName(
    suffix = ""
) {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );

    const day =
        String(
            now.getDate()
        )
        .padStart(
            2,
            "0"
        );

    const hour =
        String(
            now.getHours()
        )
        .padStart(
            2,
            "0"
        );

    const minute =
        String(
            now.getMinutes()
        )
        .padStart(
            2,
            "0"
        );

    const second =
        String(
            now.getSeconds()
        )
        .padStart(
            2,
            "0"
        );

    const extension =
        recordedBlob
            ? getExtension(
                recordedBlob.type
            )
            : "webm";


    return (

        "録音_"

        +

        year

        +

        month

        +

        day

        +

        "_"

        +

        hour

        +

        minute

        +

        second

        +

        suffix

        +

        "."

        +

        extension

    );

}


/* =====================================================
   MICROPHONES
===================================================== */

async function loadMicrophones() {

    try {

        const devices =
            await navigator
                .mediaDevices
                .enumerateDevices();


        const microphones =
            devices.filter(
                device =>
                    device.kind ===
                    "audioinput"
            );


        microphoneSelect.innerHTML =
            "";


        if (
            microphones.length === 0
        ) {

            microphoneSelect.innerHTML = `

                <option value="">
                    マイクが見つかりません
                </option>

            `;

            selectedMic.innerHTML =
                "選択中：<strong>なし</strong>";

            return;

        }


        microphones.forEach(
            (device, index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    device.deviceId;


                option.textContent =
                    device.label ||
                    `マイク ${index + 1}`;


                microphoneSelect
                    .appendChild(
                        option
                    );

            }
        );


        updateSelectedMicrophone();


        showMessage(
            `${microphones.length}個のマイクを検出しました。`,
            "success"
        );

    }
    catch (error) {

        console.error(
            error
        );

        showMessage(
            "マイク一覧を取得できませんでした。",
            "error"
        );

    }

}


/* =====================================================
   MICROPHONE PERMISSION
===================================================== */

async function requestMicrophonePermission() {

    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        await loadMicrophones();

    }
    catch (error) {

        console.error(
            error
        );

        microphoneSelect.innerHTML = `

            <option value="">
                マイクの使用を許可してください
            </option>

        `;


        showMessage(
            "マイクの使用を許可してください。",
            "error"
        );

    }

}


/* =====================================================
   SELECTED MICROPHONE
===================================================== */

function updateSelectedMicrophone() {

    const option =
        microphoneSelect
            .options[
                microphoneSelect
                    .selectedIndex
            ];


    if (
        !option
    ) {

        selectedMic.innerHTML =
            "選択中：<strong>なし</strong>";

        return;

    }


    selectedMic.innerHTML =
        "選択中：<strong>"
        +
        option.textContent
        +
        "</strong>";

}


microphoneSelect.addEventListener(
    "change",
    updateSelectedMicrophone
);


refreshButton.addEventListener(
    "click",
    loadMicrophones
);



/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    if (
        !recordingStartTime
    ) {

        return;

    }


    const seconds =
        (
            Date.now()
            -
            recordingStartTime
        )
        /
        1000;


    timer.textContent =
        formatLongTime(
            seconds
        );

}


/* =====================================================
   START RECORDING
===================================================== */

startButton.addEventListener(
    "click",
    async function() {

        try {

            const deviceId =
                microphoneSelect.value;


            if (
                !deviceId
            ) {

                showMessage(
                    "マイクを選択してください。",
                    "error"
                );

                return;

            }


            currentStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio: {

                            deviceId: {
                                exact:
                                    deviceId
                            },

                            echoCancellation:
                                true,

                            noiseSuppression:
                                true,

                            autoGainControl:
                                true

                        }

                    });


            audioChunks = [];


            const mimeType =
                getSupportedMimeType();


            if (
                mimeType
            ) {

                mediaRecorder =
                    new MediaRecorder(
                        currentStream,
                        {
                            mimeType:
                                mimeType
                        }
                    );

            }
            else {

                mediaRecorder =
                    new MediaRecorder(
                        currentStream
                    );

            }


            mediaRecorder.addEventListener(
                "dataavailable",
                function(event) {

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );

                    }

                }
            );


            mediaRecorder.addEventListener(
                "stop",
                finishRecording
            );


            mediaRecorder.start(
                1000
            );


            recordingStartTime =
                Date.now();


            timerInterval =
                setInterval(
                    updateTimer,
                    250
                );


            recorder
                .classList
                .add(
                    "recording"
                );


            status.textContent =
                "🔴 録音中";


            startButton.disabled =
                true;

            stopButton.disabled =
                false;

            resetButton.disabled =
                true;

            microphoneSelect.disabled =
                true;

            refreshButton.disabled =
                true;


            result
                .classList
                .remove(
                    "show"
                );


            showMessage(
                "録音中です。",
                "success"
            );

        }
        catch (error) {

            console.error(
                error
            );


            showMessage(
                "マイクを使用できませんでした。",
                "error"
            );

        }

    }
);



/* =====================================================
   STOP RECORDING
===================================================== */

stopButton.addEventListener(
    "click",
    function() {

        if (
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ) {

            mediaRecorder.stop();

        }

    }
);



/* =====================================================
   FINISH RECORDING
===================================================== */

function finishRecording() {

    clearInterval(
        timerInterval
    );


    timerInterval =
        null;


    const elapsed =
        (
            Date.now()
            -
            recordingStartTime
        )
        /
        1000;


    recordingStartTime =
        null;


    const mimeType =
        mediaRecorder.mimeType ||
        "audio/webm";


    recordedBlob =
        new Blob(
            audioChunks,
            {
                type:
                    mimeType
            }
        );


    if (
        audioURL
    ) {

        URL.revokeObjectURL(
            audioURL
        );

    }


    audioURL =
        URL.createObjectURL(
            recordedBlob
        );


    audioPlayer.src =
        audioURL;


    audioPlayer.load();


    const extension =
        getExtension(
            mimeType
        );


    originalFileName =
        createFileName();


    fileName.textContent =
        originalFileName;


    recordDuration.textContent =
        formatLongTime(
            elapsed
        );


    fileSize.textContent =
        formatFileSize(
            recordedBlob.size
        );


    /*
     * AudioBuffer解析
     */

    loadAudioBuffer();


    recorder
        .classList
        .remove(
            "recording"
        );


    status.textContent =
        "✅ 録音完了";


    timer.textContent =
        formatLongTime(
            elapsed
        );


    startButton.disabled =
        false;

    stopButton.disabled =
        true;

    resetButton.disabled =
        false;

    microphoneSelect.disabled =
        false;

    refreshButton.disabled =
        false;


    result
        .classList
        .add(
            "show"
        );


    showMessage(
        "録音が完了しました。",
        "success"
    );


    if (
        currentStream
    ) {

        currentStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        currentStream =
            null;

    }

}


/* =====================================================
   LOAD AUDIO BUFFER
===================================================== */

async function loadAudioBuffer() {

    try {

        if (
            !audioContext
        ) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const arrayBuffer =
            await recordedBlob.arrayBuffer();


        audioBuffer =
            await audioContext
                .decodeAudioData(
                    arrayBuffer
                );


        /*
         * Range設定
         */

        const duration =
            audioBuffer.duration;


        startRange.min =
            0;

        startRange.max =
            duration;

        startRange.value =
            0;


        endRange.min =
            0;

        endRange.max =
            duration;

        endRange.value =
            duration;


        updateRangeDisplay();


        drawWaveform();


    }
    catch (error) {

        console.error(
            error
        );


        showMessage(
            "音声波形を読み込めませんでした。",
            "error"
        );

    }

}


/* =====================================================
   DRAW WAVEFORM
===================================================== */

function drawWaveform() {

    if (
        !audioBuffer
    ) {

        return;

    }


    const rect =
        waveform
            .getBoundingClientRect();


    const dpr =
        window.devicePixelRatio ||
        1;


    waveform.width =
        rect.width *
        dpr;


    waveform.height =
        rect.height *
        dpr;


    const ctx =
        waveform.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        waveform.width,
        waveform.height
    );


    ctx.scale(
        dpr,
        dpr
    );


    const width =
        rect.width;


    const height =
        rect.height;


    const data =
        audioBuffer
            .getChannelData(0);


    const step =
        Math.ceil(
            data.length /
            width
        );


    const amp =
        height / 2;


    ctx.beginPath();


    ctx.strokeStyle =
        "#00eaff";


    ctx.lineWidth =
        1;


    for (
        let x = 0;
        x < width;
        x++
    ) {

        let min = 1;

        let max = -1;


        const start =
            x * step;


        const end =
            Math.min(
                start + step,
                data.length
            );


        for (
            let i = start;
            i < end;
            i++
        ) {

            const value =
                data[i];


            if (
                value < min
            ) {

                min = value;

            }


            if (
                value > max
            ) {

                max = value;

            }

        }


        ctx.moveTo(
            x,
            (1 + min) * amp
        );


        ctx.lineTo(
            x,
            (1 + max) * amp
        );

    }


    ctx.stroke();


    updateSelection();

}


/* =====================================================
   RANGE DISPLAY
===================================================== */

function updateRangeDisplay() {

    if (
        !audioBuffer
    ) {

        return;

    }


    let start =
        Number(
            startRange.value
        );


    let end =
        Number(
            endRange.value
        );


    /*
     * 開始位置が終了位置を
     * 超えないようにする
     */

    if (
        start >= end
    ) {

        if (
            document.activeElement ===
            startRange
        ) {

            start =
                Math.max(
                    0,
                    end - 0.01
                );

            startRange.value =
                start;

        }
        else {

            end =
                Math.min(
                    audioBuffer.duration,
                    start + 0.01
                );

            endRange.value =
                end;

        }

    }


    startValue.textContent =
        formatTime(
            start
        );


    endValue.textContent =
        formatTime(
            end
        );


    updateSelection();

}


/* =====================================================
   UPDATE SELECTION
===================================================== */

function updateSelection() {

    if (
        !audioBuffer
    ) {

        return;

    }


    const duration =
        audioBuffer.duration;


    const start =
        Number(
            startRange.value
        );


    const end =
        Number(
            endRange.value
        );


    const left =
        (
            start /
            duration
        )
        *
        100;


    const width =
        (
            (end - start) /
            duration
        )
        *
        100;


    selection.style.left =
        left + "%";


    selection.style.width =
        width + "%";

}


startRange.addEventListener(
    "input",
    updateRangeDisplay
);


endRange.addEventListener(
    "input",
    updateRangeDisplay
);



/* =====================================================
   PREVIEW SELECTION
===================================================== */

previewButton.addEventListener(
    "click",
    async function() {

        if (
            !audioBuffer
        ) {

            return;

        }


        const start =
            Number(
                startRange.value
            );


        const end =
            Number(
                endRange.value
            );


        /*
         * 元音声を指定位置から再生
         */

        audioPlayer.currentTime =
            start;


        await audioPlayer.play();


        const stopPreview =
            function() {

                if (
                    audioPlayer.currentTime >=
                    end
                ) {

                    audioPlayer.pause();

                    audioPlayer.removeEventListener(
                        "timeupdate",
                        stopPreview
                    );

                }

            };


        audioPlayer.addEventListener(
            "timeupdate",
            stopPreview
        );

    }
);



/* =====================================================
   CUT AUDIO
===================================================== */

cutButton.addEventListener(
    "click",
    async function() {

        if (
            !audioBuffer
        ) {

            showMessage(
                "カットする音声がありません。",
                "error"
            );

            return;

        }


        const start =
            Number(
                startRange.value
            );


        const end =
            Number(
                endRange.value
            );


        if (
            end <= start
        ) {

            showMessage(
                "開始位置と終了位置を確認してください。",
                "error"
            );

            return;

        }


        try {

            showMessage(
                "音声をカットしています..."
            );


            /*
             * AudioBufferを
             * 指定範囲だけコピー
             */

            const sampleRate =
                audioBuffer.sampleRate;


            const startSample =
                Math.floor(
                    start *
                    sampleRate
                );


            const endSample =
                Math.floor(
                    end *
                    sampleRate
                );


            const frameCount =
                endSample -
                startSample;


            const channels =
                audioBuffer.numberOfChannels;


            const newBuffer =
                audioContext
                    .createBuffer(
                        channels,
                        frameCount,
                        sampleRate
                    );


            /*
             * チャンネルごとコピー
             */

            for (
                let channel = 0;
                channel < channels;
                channel++
            ) {

                const sourceData =
                    audioBuffer
                        .getChannelData(
                            channel
                        );


                const destinationData =
                    newBuffer
                        .getChannelData(
                            channel
                        );


                destinationData.set(
                    sourceData.slice(
                        startSample,
                        endSample
                    )
                );

            }


            /*
             * WAVへ変換
             */

            cutBlob =
                audioBufferToWav(
                    newBuffer
                );


            /*
             * URL
             */

            if (
                cutURL
            ) {

                URL.revokeObjectURL(
                    cutURL
                );

            }


            cutURL =
                URL.createObjectURL(
                    cutBlob
                );


            /*
             * プレイヤーを
             * カット後音声に変更
             */

            audioPlayer.src =
                cutURL;


            audioPlayer.load();


            /*
             * ダウンロード
             */

            const cutName =
                createCutFileName();


            downloadButton.href =
                cutURL;


            downloadButton.download =
                cutName;


            /*
             * 情報更新
             */

            fileName.textContent =
                cutName;


            recordDuration.textContent =
                formatLongTime(
                    end - start
                );


            fileSize.textContent =
                formatFileSize(
                    cutBlob.size
                );


            showMessage(
                "✂️ 指定した範囲をカットしました。",
                "success"
            );


        }
        catch (error) {

            console.error(
                error
            );


            showMessage(
                "音声のカットに失敗しました。",
                "error"
            );

        }

    }
);



/* =====================================================
   WAV CONVERTER
===================================================== */

function audioBufferToWav(
    buffer
) {

    const numberOfChannels =
        buffer.numberOfChannels;


    const sampleRate =
        buffer.sampleRate;


    const format =
        1;


    const bitDepth =
        16;


    const samples =
        buffer.length;


    const blockAlign =
        numberOfChannels *
        bitDepth /
        8;


    const byteRate =
        sampleRate *
        blockAlign;


    const dataSize =
        samples *
        blockAlign;


    const bufferSize =
        44 +
        dataSize;


    const arrayBuffer =
        new ArrayBuffer(
            bufferSize
        );


    const view =
        new DataView(
            arrayBuffer
        );


    /*
     * RIFF
     */

    writeString(
        view,
        0,
        "RIFF"
    );


    view.setUint32(
        4,
        36 + dataSize,
        true
    );


    writeString(
        view,
        8,
        "WAVE"
    );


    /*
     * fmt
     */

    writeString(
        view,
        12,
        "fmt "
    );


    view.setUint32(
        16,
        16,
        true
    );


    view.setUint16(
        20,
        format,
        true
    );


    view.setUint16(
        22,
        numberOfChannels,
        true
    );


    view.setUint32(
        24,
        sampleRate,
        true
    );


    view.setUint32(
        28,
        byteRate,
        true
    );


    view.setUint16(
        32,
        blockAlign,
        true
    );


    view.setUint16(
        34,
        bitDepth,
        true
    );


    /*
     * data
     */

    writeString(
        view,
        36,
        "data"
    );


    view.setUint32(
        40,
        dataSize,
        true
    );


    /*
     * PCMデータ
     */

    let offset = 44;


    for (
        let i = 0;
        i < samples;
        i++
    ) {

        for (
            let channel = 0;
            channel < numberOfChannels;
            channel++
        ) {

            const channelData =
                buffer
                    .getChannelData(
                        channel
                    );


            let sample =
                channelData[i];


            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );


            if (
                sample < 0
            ) {

                sample =
                    sample *
                    0x8000;

            }
            else {

                sample =
                    sample *
                    0x7fff;

            }


            view.setInt16(
                offset,
                sample,
                true
            );


            offset += 2;

        }

    }


    return new Blob(
        [arrayBuffer],
        {
            type:
                "audio/wav"
        }
    );

}


/* =====================================================
   WRITE STRING
===================================================== */

function writeString(
    view,
    offset,
    string
) {

    for (
        let i = 0;
        i < string.length;
        i++
    ) {

        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );

    }

}


/* =====================================================
   CUT FILE NAME
===================================================== */

function createCutFileName() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        )
        .padStart(
            2,
            "0"
        );


    const hour =
        String(
            now.getHours()
        )
        .padStart(
            2,
            "0"
        );


    const minute =
        String(
            now.getMinutes()
        )
        .padStart(
            2,
            "0"
        );


    const second =
        String(
            now.getSeconds()
        )
        .padStart(
            2,
            "0"
        );


    return (

        "録音_カット_"

        +
        year
        +
        month
        +
        day
        +
        "_"
        +
        hour
        +
        minute
        +
        second
        +
        ".wav"

    );

}


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    function() {

        if (
            !recordedBlob
        ) {

            return;

        }


        if (
            !confirm(
                "録音データを削除しますか？"
            )
        ) {

            return;

        }


        audioPlayer.pause();


        audioPlayer.removeAttribute(
            "src"
        );


        audioPlayer.load();


        if (
            audioURL
        ) {

            URL.revokeObjectURL(
                audioURL
            );

            audioURL =
                null;

        }


        if (
            cutURL
        ) {

            URL.revokeObjectURL(
                cutURL
            );

            cutURL =
                null;

        }


        recordedBlob =
            null;


        cutBlob =
            null;


        audioBuffer =
            null;


        audioChunks =
            [];


        result
            .classList
            .remove(
                "show"
            );


        resetButton.disabled =
            true;


        timer.textContent =
            "00:00:00";


        status.textContent =
            "録音待機中";


        showMessage(
            "録音データを削除しました。",
            "success"
        );

    }
);



/* =====================================================
   RESIZE WAVEFORM
===================================================== */

window.addEventListener(
    "resize",
    function() {

        if (
            audioBuffer
        ) {

            drawWaveform();

        }

    }
);



/* =====================================================
   DEVICE CHANGE
===================================================== */

if (
    navigator.mediaDevices
) {

    navigator
        .mediaDevices
        .addEventListener(
            "devicechange",
            function() {

                if (
                    !mediaRecorder ||
                    mediaRecorder.state !==
                    "recording"
                ) {

                    loadMicrophones();

                }

            }
        );

}



/* =====================================================
   PAGE EXIT
===================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        if (
            currentStream
        ) {

            currentStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if (
            audioURL
        ) {

            URL.revokeObjectURL(
                audioURL
            );

        }


        if (
            cutURL
        ) {

            URL.revokeObjectURL(
                cutURL
            );

        }

    }
);



/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(
    "load",
    async function() {

        if (
            !window.MediaRecorder
        ) {

            showMessage(
                "このブラウザは録音機能に対応していません。",
                "error"
            );


            startButton.disabled =
                true;


            return;

        }


        await requestMicrophonePermission();

    }
);
