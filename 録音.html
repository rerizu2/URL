<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>高機能ボイスレコーダー</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family:
        "Noto Sans JP",
        "Yu Gothic",
        Meiryo,
        sans-serif;

    color: #fff;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,234,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(100,50,255,.15),
            transparent 35%
        ),
        #070b12;

    padding: 20px;
}

.container {
    width: min(1100px, 100%);
    margin: auto;
}

.header {
    text-align: center;
    margin: 20px 0 25px;
}

.header h1 {
    font-size: clamp(30px, 6vw, 52px);
    letter-spacing: 2px;
}

.header p {
    color: #91a0b3;
    margin-top: 8px;
}

.card {
    background: rgba(14,22,34,.96);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 26px;
    padding: 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
}

/* マイク */

.microphone-section {
    background: #0c1420;
    border: 1px solid #26384d;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 30px;
}

.microphone-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.microphone-title span {
    color: #00eaff;
}

.microphone-row {
    display: flex;
    gap: 10px;
}

.microphone-select {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #344356;
    background: #111b29;
    color: white;
    font-size: 15px;
    outline: none;
}

.microphone-select:focus {
    border-color: #00eaff;
}

button {
    border: none;
    color: white;
    cursor: pointer;
    padding: 14px 24px;
    border-radius: 13px;
    font-size: 15px;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: translateY(1px);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

.refresh-button {
    background: #243348;
}

.selected-mic {
    margin-top: 12px;
    color: #7f8da0;
    font-size: 13px;
}

.selected-mic strong {
    color: #00eaff;
}

/* 録音 */

.recorder {
    text-align: center;
}

.mic {
    width: 145px;
    height: 145px;
    margin: 10px auto 25px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 60px;

    background:
        linear-gradient(
            145deg,
            #00eaff,
            #0066ff
        );

    box-shadow:
        0 0 40px
        rgba(0,220,255,.35);

    transition: .3s;
}

.recording .mic {
    background:
        linear-gradient(
            145deg,
            #ff315b,
            #d5003e
        );

    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
    }
}

.status {
    color: #a6b2c1;
    font-size: 18px;
}

.recording .status {
    color: #ff5575;
}

.timer {
    font-family: monospace;
    font-size: clamp(42px, 9vw, 72px);
    font-weight: bold;
    letter-spacing: 4px;
}

.wave {
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

.wave span {
    width: 4px;
    height: 8px;
    background: #00eaff;
    border-radius: 5px;
}

.recording .wave span {
    animation: wave .6s infinite alternate;
}

.wave span:nth-child(2) { animation-delay: .1s; }
.wave span:nth-child(3) { animation-delay: .2s; }
.wave span:nth-child(4) { animation-delay: .3s; }
.wave span:nth-child(5) { animation-delay: .4s; }
.wave span:nth-child(6) { animation-delay: .5s; }
.wave span:nth-child(7) { animation-delay: .6s; }
.wave span:nth-child(8) { animation-delay: .7s; }
.wave span:nth-child(9) { animation-delay: .8s; }

@keyframes wave {
    from { height: 8px; }
    to { height: 42px; }
}

/* ボタン */

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
}

.start-button {
    background: linear-gradient(135deg,#00d4ff,#0066ff);
}

.stop-button {
    background: linear-gradient(135deg,#ff315b,#d9003d);
}

.reset-button {
    background: #283547;
}

.message {
    min-height: 25px;
    text-align: center;
    margin-top: 20px;
    color: #8f9cac;
}

.message.success {
    color: #35e6a0;
}

.message.error {
    color: #ff5878;
}

/* 結果 */

.result {
    display: none;
    margin-top: 30px;
    padding: 22px;
    background: #0b141f;
    border: 1px solid #26384d;
    border-radius: 18px;
}

.result.show {
    display: block;
}

.result-title {
    color: #00eaff;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}

audio {
    width: 100%;
    margin: 10px 0 20px;
}

/* エディタ */

.editor {
    margin-top: 20px;
    padding: 20px;
    background: #09111b;
    border: 1px solid #26384d;
    border-radius: 18px;
}

.editor-title {
    color: #00eaff;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 15px;
}

.waveform-container {
    position: relative;
    width: 100%;
    height: 180px;
    background: #050b12;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #26384d;
}

#waveform {
    width: 100%;
    height: 100%;
    display: block;
}

.selection {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(0,234,255,.12);
    border-left: 2px solid #00eaff;
    border-right: 2px solid #00eaff;
    pointer-events: none;
}

.range-row {
    display: grid;
    grid-template-columns: 100px 1fr 80px;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
}

.range-label {
    color: #9aa8ba;
}

.range-value {
    color: #00eaff;
    font-family: monospace;
    text-align: right;
}

input[type="range"] {
    width: 100%;
    accent-color: #00eaff;
}

/* 編集 */

.edit-panel {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #26384d;
}

.edit-panel h3 {
    color: #00eaff;
    margin-bottom: 15px;
}

.volume-row {
    display: grid;
    grid-template-columns: 120px 1fr 80px;
    gap: 10px;
    align-items: center;
}

.volume-value {
    color: #00eaff;
    font-family: monospace;
    text-align: right;
}

.volume-presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.volume-presets button {
    background: #202f42;
    padding: 10px 15px;
}

.volume-presets button:hover {
    background: #30445c;
}

.edit-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

.preview-button {
    background: #27384d;
}

.cut-button {
    background: linear-gradient(135deg,#00d4ff,#0077ff);
}

.volume-button {
    background: linear-gradient(135deg,#a855f7,#6d28d9);
}

.mute-button {
    background: linear-gradient(135deg,#ff8a00,#e64a00);
}

/* 情報 */

.file-info {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    margin-top: 20px;
}

.info-box {
    background: #111c2a;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
}

.info-label {
    color: #718095;
    font-size: 12px;
}

.info-value {
    color: #dce5ef;
    font-weight: bold;
    margin-top: 5px;
    word-break: break-word;
}

.save-area {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #26384d;
}

.download-button {
    display: inline-block;
    text-decoration: none;
    background: linear-gradient(135deg,#00c98d,#008b63);
    color: white;
    padding: 14px 22px;
    border-radius: 12px;
    font-weight: bold;
}

.privacy {
    margin-top: 25px;
    padding: 15px;
    background: #101923;
    border: 1px solid #263344;
    border-radius: 13px;
    color: #8795a7;
    font-size: 13px;
    line-height: 1.8;
}

@media(max-width:650px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 18px;
    }

    .microphone-row {
        flex-direction: column;
    }

    .refresh-button {
        width: 100%;
    }

    .buttons,
    .edit-buttons {
        flex-direction: column;
    }

    .buttons button,
    .edit-buttons button {
        width: 100%;
    }

    .range-row {
        grid-template-columns: 75px 1fr 70px;
    }

    .volume-row {
        grid-template-columns: 75px 1fr 70px;
    }

    .file-info {
        grid-template-columns: 1fr;
    }

    .mic {
        width: 115px;
        height: 115px;
        font-size: 48px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
    <h1>🎙 ボイスレコーダー</h1>
    <p>録音・カット・部分音量変更・ミュート</p>
</header>

<main class="card">

<!-- マイク -->

<section class="microphone-section">

    <div class="microphone-title">
        🎧 <span>使用するマイク</span>
    </div>

    <div class="microphone-row">

        <select
            id="microphoneSelect"
            class="microphone-select">
            <option value="">マイクを確認しています...</option>
        </select>

        <button
            id="refreshButton"
            class="refresh-button">
            🔄 マイク更新
        </button>

    </div>

    <div id="selectedMic" class="selected-mic">
        選択中：<strong>確認中...</strong>
    </div>

</section>

<!-- 録音 -->

<section id="recorder" class="recorder">

    <div class="mic">🎙</div>

    <div id="status" class="status">
        録音待機中
    </div>

    <div id="timer" class="timer">
        00:00:00
    </div>

    <div class="wave">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

</section>

<div class="buttons">

    <button
        id="startButton"
        class="start-button">
        🔴 録音開始
    </button>

    <button
        id="stopButton"
        class="stop-button"
        disabled>
        ⏹ 録音停止
    </button>

    <button
        id="resetButton"
        class="reset-button"
        disabled>
        🗑 削除
    </button>

</div>

<div id="message" class="message"></div>

<!-- 結果 -->

<section id="result" class="result">

    <div class="result-title">
        🎵 録音データ
    </div>

    <audio id="audioPlayer" controls></audio>

    <!-- 波形 -->

    <div class="editor">

        <div class="editor-title">
            ✂️🔊 音声編集
        </div>

        <div class="waveform-container">

            <canvas id="waveform"></canvas>

            <div
                id="selection"
                class="selection">
            </div>

        </div>

        <!-- 開始 -->

        <div class="range-row">

            <div class="range-label">
                開始位置
            </div>

            <input
                id="startRange"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0">

            <div
                id="startValue"
                class="range-value">
                00:00
            </div>

        </div>

        <!-- 終了 -->

        <div class="range-row">

            <div class="range-label">
                終了位置
            </div>

            <input
                id="endRange"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1">

            <div
                id="endValue"
                class="range-value">
                00:00
            </div>

        </div>

        <!-- 音量 -->

        <div class="edit-panel">

            <h3>
                🔊 選択範囲の音量
            </h3>

            <div class="volume-row">

                <div class="range-label">
                    音量
                </div>

                <input
                    id="volumeRange"
                    type="range"
                    min="0"
                    max="300"
                    step="1"
                    value="100">

                <div
                    id="volumeValue"
                    class="volume-value">
                    100%
                </div>

            </div>

            <div class="volume-presets">

                <button
                    data-volume="0">
                    🔇 0%
                </button>

                <button
                    data-volume="25">
                    25%
                </button>

                <button
                    data-volume="50">
                    50%
                </button>

                <button
                    data-volume="75">
                    75%
                </button>

                <button
                    data-volume="100">
                    100%
                </button>

                <button
                    data-volume="150">
                    150%
                </button>

                <button
                    data-volume="200">
                    200%
                </button>

                <button
                    data-volume="300">
                    300%
                </button>

            </div>

            <div class="edit-buttons">

                <button
                    id="previewButton"
                    class="preview-button">
                    ▶️ 選択範囲を再生
                </button>

                <button
                    id="cutButton"
                    class="cut-button">
                    ✂️ 選択範囲だけ残す
                </button>

                <button
                    id="volumeButton"
                    class="volume-button">
                    🔊 選択範囲の音量を変更
                </button>

                <button
                    id="muteButton"
                    class="mute-button">
                    🔇 選択範囲を無音にする
                </button>

            </div>

        </div>

    </div>

    <!-- 情報 -->

    <div class="file-info">

        <div class="info-box">

            <div class="info-label">
                ファイル名
            </div>

            <div
                id="fileName"
                class="info-value">
                -
            </div>

        </div>

        <div class="info-box">

            <div class="info-label">
                音声時間
            </div>

            <div
                id="recordDuration"
                class="info-value">
                -
            </div>

        </div>

        <div class="info-box">

            <div class="info-label">
                ファイルサイズ
            </div>

            <div
                id="fileSize"
                class="info-value">
                -
            </div>

        </div>

    </div>

    <!-- 保存 -->

    <div class="save-area">

        <a
            id="downloadButton"
            class="download-button"
            href="#"
            download>
            💾 編集後の音声を保存
        </a>

    </div>

</section>

<div class="privacy">

    🔒 <strong>完全ローカル処理</strong><br>

    Google Drive・GAS・サーバーなどの外部サービスは使用していません。<br>

    録音データと編集データは、このブラウザ上で処理されます。<br>

    保存すると、編集した音声を端末へWAV形式で保存できます。

</div>

</main>
</div>

<script>

/* =====================================================
   基本変数
===================================================== */

let mediaRecorder = null;
let currentStream = null;
let audioChunks = [];

let recordingStartTime = null;
let timerInterval = null;

let recordedBlob = null;
let audioURL = null;

let audioContext = null;
let audioBuffer = null;

let cutBlob = null;
let cutURL = null;


/* =====================================================
   要素
===================================================== */

const microphoneSelect =
    document.getElementById("microphoneSelect");

const refreshButton =
    document.getElementById("refreshButton");

const selectedMic =
    document.getElementById("selectedMic");

const recorder =
    document.getElementById("recorder");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const resetButton =
    document.getElementById("resetButton");

const status =
    document.getElementById("status");

const timer =
    document.getElementById("timer");

const message =
    document.getElementById("message");

const result =
    document.getElementById("result");

const audioPlayer =
    document.getElementById("audioPlayer");

const waveform =
    document.getElementById("waveform");

const selection =
    document.getElementById("selection");

const startRange =
    document.getElementById("startRange");

const endRange =
    document.getElementById("endRange");

const startValue =
    document.getElementById("startValue");

const endValue =
    document.getElementById("endValue");

const volumeRange =
    document.getElementById("volumeRange");

const volumeValue =
    document.getElementById("volumeValue");

const previewButton =
    document.getElementById("previewButton");

const cutButton =
    document.getElementById("cutButton");

const volumeButton =
    document.getElementById("volumeButton");

const muteButton =
    document.getElementById("muteButton");

const downloadButton =
    document.getElementById("downloadButton");

const fileName =
    document.getElementById("fileName");

const recordDuration =
    document.getElementById("recordDuration");

const fileSize =
    document.getElementById("fileSize");


/* =====================================================
   メッセージ
===================================================== */

function showMessage(text, type = "") {

    message.textContent = text;
    message.className = "message " + type;

}


/* =====================================================
   時間
===================================================== */

function formatTime(seconds) {

    seconds = Math.max(0, seconds);

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );

}


function formatLongTime(seconds) {

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(hours).padStart(2, "0")
        +
        ":"
        +
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );

}


/* =====================================================
   ファイルサイズ
===================================================== */

function formatFileSize(bytes) {

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1024 / 1024).toFixed(2) + " MB";

}


/* =====================================================
   MIME
===================================================== */

function getSupportedMimeType() {

    const types = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus",
        "audio/mp4"
    ];

    for (const type of types) {

        if (MediaRecorder.isTypeSupported(type)) {
            return type;
        }

    }

    return "";

}


/* =====================================================
   マイク一覧
===================================================== */

async function loadMicrophones() {

    try {

        const devices =
            await navigator.mediaDevices.enumerateDevices();

        const microphones =
            devices.filter(
                d => d.kind === "audioinput"
            );

        microphoneSelect.innerHTML = "";

        if (!microphones.length) {

            microphoneSelect.innerHTML =
                `<option value="">マイクがありません</option>`;

            return;

        }

        microphones.forEach((device, index) => {

            const option =
                document.createElement("option");

            option.value =
                device.deviceId;

            option.textContent =
                device.label ||
                `マイク ${index + 1}`;

            microphoneSelect.appendChild(option);

        });

        updateSelectedMicrophone();

    }
    catch (error) {

        console.error(error);

        showMessage(
            "マイク一覧を取得できませんでした。",
            "error"
        );

    }

}


/* =====================================================
   マイク権限
===================================================== */

async function requestMicrophonePermission() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        stream.getTracks().forEach(
            track => track.stop()
        );

        await loadMicrophones();

    }
    catch (error) {

        console.error(error);

        showMessage(
            "マイクの使用を許可してください。",
            "error"
        );

    }

}


/* =====================================================
   マイク表示
===================================================== */

function updateSelectedMicrophone() {

    const option =
        microphoneSelect.options[
            microphoneSelect.selectedIndex
        ];

    if (!option) {
        return;
    }

    selectedMic.innerHTML =
        "選択中：<strong>"
        +
        option.textContent
        +
        "</strong>";

}


microphoneSelect.addEventListener(
    "change",
    updateSelectedMicrophone
);

refreshButton.addEventListener(
    "click",
    loadMicrophones
);


/* =====================================================
   タイマー
===================================================== */

function updateTimer() {

    if (!recordingStartTime) {
        return;
    }

    const seconds =
        (Date.now() - recordingStartTime) / 1000;

    timer.textContent =
        formatLongTime(seconds);

}


/* =====================================================
   録音開始
===================================================== */

startButton.addEventListener(
    "click",
    async () => {

        try {

            if (!microphoneSelect.value) {

                showMessage(
                    "マイクを選択してください。",
                    "error"
                );

                return;

            }

            currentStream =
                await navigator.mediaDevices.getUserMedia({

                    audio: {
                        deviceId: {
                            exact:
                                microphoneSelect.value
                        },

                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }

                });

            audioChunks = [];

            const mimeType =
                getSupportedMimeType();

            mediaRecorder =
                mimeType
                ?
                new MediaRecorder(
                    currentStream,
                    { mimeType }
                )
                :
                new MediaRecorder(
                    currentStream
                );

            mediaRecorder.ondataavailable =
                event => {

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );

                    }

                };

            mediaRecorder.onstop =
                finishRecording;

            mediaRecorder.start(1000);

            recordingStartTime =
                Date.now();

            timerInterval =
                setInterval(
                    updateTimer,
                    250
                );

            recorder.classList.add(
                "recording"
            );

            status.textContent =
                "🔴 録音中";

            startButton.disabled = true;
            stopButton.disabled = false;
            resetButton.disabled = true;

            microphoneSelect.disabled = true;
            refreshButton.disabled = true;

            showMessage(
                "録音中です。",
                "success"
            );

        }
        catch (error) {

            console.error(error);

            showMessage(
                "マイクを使用できませんでした。",
                "error"
            );

        }

    }
);


/* =====================================================
   録音停止
===================================================== */

stopButton.addEventListener(
    "click",
    () => {

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {

            mediaRecorder.stop();

        }

    }
);


/* =====================================================
   録音終了
===================================================== */

function finishRecording() {

    clearInterval(timerInterval);

    const elapsed =
        (Date.now() - recordingStartTime) / 1000;

    recordingStartTime = null;

    recordedBlob =
        new Blob(
            audioChunks,
            {
                type:
                    mediaRecorder.mimeType ||
                    "audio/webm"
            }
        );

    if (audioURL) {
        URL.revokeObjectURL(audioURL);
    }

    audioURL =
        URL.createObjectURL(
            recordedBlob
        );

    audioPlayer.src =
        audioURL;

    audioPlayer.load();

    fileName.textContent =
        "録音データ";

    recordDuration.textContent =
        formatLongTime(elapsed);

    fileSize.textContent =
        formatFileSize(
            recordedBlob.size
        );

    recorder.classList.remove(
        "recording"
    );

    status.textContent =
        "✅ 録音完了";

    timer.textContent =
        formatLongTime(elapsed);

    startButton.disabled = false;
    stopButton.disabled = true;
    resetButton.disabled = false;

    microphoneSelect.disabled = false;
    refreshButton.disabled = false;

    result.classList.add("show");

    showMessage(
        "録音が完了しました。",
        "success"
    );

    if (currentStream) {

        currentStream.getTracks().forEach(
            track => track.stop()
        );

        currentStream = null;

    }

    loadAudioBuffer();

}


/* =====================================================
   AudioBuffer
===================================================== */

async function loadAudioBuffer() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const arrayBuffer =
            await recordedBlob.arrayBuffer();

        audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );

        const duration =
            audioBuffer.duration;

        startRange.min = 0;
        startRange.max = duration;
        startRange.value = 0;

        endRange.min = 0;
        endRange.max = duration;
        endRange.value = duration;

        updateRangeDisplay();
        drawWaveform();

    }
    catch (error) {

        console.error(error);

        showMessage(
            "音声の解析に失敗しました。",
            "error"
        );

    }

}


/* =====================================================
   波形
===================================================== */

function drawWaveform() {

    if (!audioBuffer) {
        return;
    }

    const rect =
        waveform.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    waveform.width =
        rect.width * dpr;

    waveform.height =
        rect.height * dpr;

    const ctx =
        waveform.getContext("2d");

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    const width =
        rect.width;

    const height =
        rect.height;

    const data =
        audioBuffer.getChannelData(0);

    const step =
        Math.ceil(data.length / width);

    const amp =
        height / 2;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.beginPath();

    ctx.strokeStyle =
        "#00eaff";

    for (
        let x = 0;
        x < width;
        x++
    ) {

        let min = 1;
        let max = -1;

        const start =
            x * step;

        const end =
            Math.min(
                start + step,
                data.length
            );

        for (
            let i = start;
            i < end;
            i++
        ) {

            const value =
                data[i];

            if (value < min) {
                min = value;
            }

            if (value > max) {
                max = value;
            }

        }

        ctx.moveTo(
            x,
            (1 + min) * amp
        );

        ctx.lineTo(
            x,
            (1 + max) * amp
        );

    }

    ctx.stroke();

    updateSelection();

}


/* =====================================================
   選択範囲
===================================================== */

function updateRangeDisplay() {

    if (!audioBuffer) {
        return;
    }

    let start =
        Number(startRange.value);

    let end =
        Number(endRange.value);

    if (start >= end) {

        if (
            document.activeElement ===
            startRange
        ) {

            start =
                Math.max(
                    0,
                    end - .01
                );

            startRange.value =
                start;

        }
        else {

            end =
                Math.min(
                    audioBuffer.duration,
                    start + .01
                );

            endRange.value =
                end;

        }

    }

    startValue.textContent =
        formatTime(start);

    endValue.textContent =
        formatTime(end);

    updateSelection();

}


function updateSelection() {

    if (!audioBuffer) {
        return;
    }

    const duration =
        audioBuffer.duration;

    const start =
        Number(startRange.value);

    const end =
        Number(endRange.value);

    const left =
        start / duration * 100;

    const width =
        (end - start) / duration * 100;

    selection.style.left =
        left + "%";

    selection.style.width =
        width + "%";

}


startRange.addEventListener(
    "input",
    updateRangeDisplay
);

endRange.addEventListener(
    "input",
    updateRangeDisplay
);


/* =====================================================
   音量表示
===================================================== */

volumeRange.addEventListener(

        volumeValue.textContent =

    }
);


/* =====================================================
   音量プリセット
===================================================== */

document.querySelectorAll(
    ".volume-presets button"
).forEach(button => {

    button.addEventListener(

/* =====================================================
   選択範囲再生
===================================================== */

previewButton.addEventListener(
    "click",
    async () => {

        if (!audioBuffer) {
            return;
        }

        const start =
            Number(startRange.value);

        const end =
            Number(endRange.value);

        audioPlayer.currentTime =
            start;

        await audioPlayer.play();

        const check =
            () => {

                if (
                    audioPlayer.currentTime >= end
                ) {

                    audioPlayer.pause();

                    audioPlayer.removeEventListener(
                        "timeupdate",
                        check
                    );

                }

            };

        audioPlayer.addEventListener(
            "timeupdate",
            check
        );

    }
);


/* =====================================================
   音声編集
===================================================== */

function cloneAudioBuffer(buffer) {

    const result =
        audioContext.createBuffer(
            buffer.numberOfChannels,
            buffer.length,
            buffer.sampleRate
        );

    for (
        let channel = 0;
        channel < buffer.numberOfChannels;
        channel++
    ) {

        result
            .getChannelData(channel)
            .set(
                buffer.getChannelData(channel)
            );

    }

    return result;

}


/* =====================================================
   部分音量変更
===================================================== */

volumeButton.addEventListener(
    "click",
    async () => {

        if (!audioBuffer) {

            showMessage(
                "音声がありません。",
                "error"
            );

            return;

        }

        const start =
            Number(startRange.value);

        const end =
            Number(endRange.value);

        const volume =
            Number(volumeRange.value) / 100;

        if (end <= start) {

            showMessage(
                "範囲を確認してください。",
                "error"
            );

            return;

        }

        try {

            showMessage(
                "指定範囲の音量を変更しています..."
            );

            const newBuffer =
                cloneAudioBuffer(
                    audioBuffer
                );

            const startSample =
                Math.floor(
                    start *
                    newBuffer.sampleRate
                );

            const endSample =
                Math.floor(
                    end *
                    newBuffer.sampleRate
                );

            for (
                let channel = 0;
                channel < newBuffer.numberOfChannels;
                channel++
            ) {

                const data =
                    newBuffer.getChannelData(
                        channel
                    );

                for (
                    let i = startSample;
                    i < endSample;
                    i++
                ) {

                    data[i] *= volume;

                    /*
                     * 音割れ防止
                     */

                    if (data[i] > 1) {
                        data[i] = 1;
                    }

                    if (data[i] < -1) {
                        data[i] = -1;
                    }

                }

            }

            await applyEditedBuffer(
                newBuffer,
                "部分音量変更"
            );

        }
        catch (error) {

            console.error(error);

            showMessage(
                "音量変更に失敗しました。",
                "error"
            );

        }

    }
);


/* =====================================================
   無音化
===================================================== */

muteButton.addEventListener(
    "click",
    async () => {

        if (!audioBuffer) {
            return;
        }

        const start =
            Number(startRange.value);

        const end =
            Number(endRange.value);

        const newBuffer =
            cloneAudioBuffer(
                audioBuffer
            );

        const startSample =
            Math.floor(
                start *
                newBuffer.sampleRate
            );

        const endSample =
            Math.floor(
                end *
                newBuffer.sampleRate
            );

        for (
            let channel = 0;
            channel < newBuffer.numberOfChannels;
            channel++
        ) {

            const data =
                newBuffer.getChannelData(
                    channel
                );

            for (
                let i = startSample;
                i < endSample;
                i++
            ) {

                data[i] = 0;

            }

        }

        await applyEditedBuffer(
            newBuffer,
            "部分ミュート"
        );

    }
);


/* =====================================================
   カット
===================================================== */

cutButton.addEventListener(
    "click",
    async () => {

        if (!audioBuffer) {
            return;
        }

        const start =
            Number(startRange.value);

        const end =
            Number(endRange.value);

        if (end <= start) {
            return;
        }

        try {

            showMessage(
                "音声をカットしています..."
            );

            const sampleRate =
                audioBuffer.sampleRate;

            const startSample =
                Math.floor(
                    start *
                    sampleRate
                );

            const endSample =
                Math.floor(
                    end *
                    sampleRate
                );

            const frameCount =
                endSample -
                startSample;

            const newBuffer =
                audioContext.createBuffer(
                    audioBuffer.numberOfChannels,
                    frameCount,
                    sampleRate
                );

            for (
                let channel = 0;
                channel < audioBuffer.numberOfChannels;
                channel++
            ) {

                const source =
                    audioBuffer.getChannelData(
                        channel
                    );

                const destination =
                    newBuffer.getChannelData(
                        channel
                    );

                destination.set(
                    source.slice(
                        startSample,
                        endSample
                    )
                );

            }

            await applyEditedBuffer(
                newBuffer,
                "カット"
            );

        }
        catch (error) {

            console.error(error);

            showMessage(
                "カットに失敗しました。",
                "error"
            );

        }

    }
);


/* =====================================================
   編集結果を反映
===================================================== */

async function applyEditedBuffer(
    newBuffer,
    operation
) {

    audioBuffer =
        newBuffer;

    cutBlob =
        audioBufferToWav(
            newBuffer
        );

    if (cutURL) {

        URL.revokeObjectURL(
            cutURL
        );

    }

    cutURL =
        URL.createObjectURL(
            cutBlob
        );

    audioPlayer.src =
        cutURL;

    audioPlayer.load();

    const duration =
        newBuffer.duration;

    startRange.min = 0;
    startRange.max = duration;
    startRange.value = 0;

    endRange.min = 0;
    endRange.max = duration;
    endRange.value = duration;

    drawWaveform();

    updateRangeDisplay();

    fileName.textContent =
        `編集後_${operation}.wav`;

    recordDuration.textContent =
        formatLongTime(duration);

    fileSize.textContent =
        formatFileSize(
            cutBlob.size
        );

    downloadButton.href =
        cutURL;

    downloadButton.download =
        createEditedFileName(operation);

    showMessage(
        `✅ ${operation}を適用しました。`,
        "success"
    );

}


/* =====================================================
   編集後ファイル名
===================================================== */

function createEditedFileName(
    operation
) {

    const now =
        new Date();

    const stamp =
        now.getFullYear()
        +
        String(
            now.getMonth() + 1
        ).padStart(2, "0")
        +
        String(
            now.getDate()
        ).padStart(2, "0")
        +
        "_"
        +
        String(
            now.getHours()
        ).padStart(2, "0")
        +
        String(
            now.getMinutes()
        ).padStart(2, "0")
        +
        String(
            now.getSeconds()
        ).padStart(2, "0");

    return (
        `録音_${operation}_${stamp}.wav`
    );

}


/* =====================================================
   WAV変換
===================================================== */

function audioBufferToWav(buffer) {

    const channels =
        buffer.numberOfChannels;

    const sampleRate =
        buffer.sampleRate;

    const bitDepth = 16;

    const blockAlign =
        channels * bitDepth / 8;

    const byteRate =
        sampleRate * blockAlign;

    const dataSize =
        buffer.length * blockAlign;

    const arrayBuffer =
        new ArrayBuffer(
            44 + dataSize
        );

    const view =
        new DataView(
            arrayBuffer
        );

    writeString(
        view,
        0,
        "RIFF"
    );

    view.setUint32(
        4,
        36 + dataSize,
        true
    );

    writeString(
        view,
        8,
        "WAVE"
    );

    writeString(
        view,
        12,
        "fmt "
    );

    view.setUint32(
        16,
        16,
        true
    );

    view.setUint16(
        20,
        1,
        true
    );

    view.setUint16(
        22,
        channels,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        byteRate,
        true
    );

    view.setUint16(
        32,
        blockAlign,
        true
    );

    view.setUint16(
        34,
        bitDepth,
        true
    );

    writeString(
        view,
        36,
        "data"
    );

    view.setUint32(
        40,
        dataSize,
        true
    );

    let offset = 44;

    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        for (
            let channel = 0;
            channel < channels;
            channel++
        ) {

            const data =
                buffer.getChannelData(
                    channel
                );

            let sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        data[i]
                    )
                );

            if (sample < 0) {

                sample *= 0x8000;

            }
            else {

                sample *= 0x7fff;

            }

            view.setInt16(
                offset,
                sample,
                true
            );

            offset += 2;

        }

    }

    return new Blob(
        [arrayBuffer],
        {
            type: "audio/wav"
        }
    );

}


/* =====================================================
   文字列書き込み
===================================================== */

function writeString(
    view,
    offset,
    string
) {

    for (
        let i = 0;
        i < string.length;
        i++
    ) {

        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );

    }

}


/* =====================================================
   削除
===================================================== */

resetButton.addEventListener(
    "click",
    () => {

        if (!recordedBlob) {
            return;
        }

        if (
            !confirm(
                "録音データを削除しますか？"
            )
        ) {
            return;
        }

        audioPlayer.pause();

        audioPlayer.removeAttribute(
            "src"
        );

        audioPlayer.load();

        if (audioURL) {

            URL.revokeObjectURL(
                audioURL
            );

            audioURL = null;

        }

        if (cutURL) {

            URL.revokeObjectURL(
                cutURL
            );

            cutURL = null;

        }

        recordedBlob = null;
        cutBlob = null;
        audioBuffer = null;
        audioChunks = [];

        result.classList.remove(
            "show"
        );

        resetButton.disabled = true;

        timer.textContent =
            "00:00:00";

        status.textContent =
            "録音待機中";

        showMessage(
            "録音データを削除しました。",
            "success"
        );

    }
);

   リサイズ
===================================================== */

window.addEventListener(
    "resize",
    () => {

        if (audioBuffer) {
            drawWaveform();
        }

    }
);

   デバイス変更
===================================================== */

if (navigator.mediaDevices) {

    navigator.mediaDevices.addEventListener(
        "devicechange",
        () => {

            if (
                !mediaRecorder ||
                mediaRecorder.state !== "recording"
            ) {

                loadMicrophones();

            }

        }
    );

}

   終了処理
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (currentStream) {

            currentStream.getTracks().forEach(
                track => track.stop()
            );

        }

        if (audioURL) {
            URL.revokeObjectURL(audioURL);
        }

        if (cutURL) {
            URL.revokeObjectURL(cutURL);
        }

    }
);

   初期化
===================================================== */

window.addEventListener(

        if (!window.MediaRecorder) {

            );
