<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>高機能ボイスレコーダー</title>

<style>

/* =========================================
   基本設定
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family:
        "Noto Sans JP",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(0, 234, 255, 0.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(100, 50, 255, 0.14),
            transparent 30%
        ),
        #070b12;

    padding: 20px;
}


/* =========================================
   メイン
========================================= */

.container {
    width: min(1000px, 100%);
    margin: 0 auto;
}


/* =========================================
   ヘッダー
========================================= */

.header {
    text-align: center;
    margin: 20px 0 25px;
}

.header h1 {
    font-size: clamp(30px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: 2px;
}

.header p {
    color: #9ba9ba;
    margin-top: 10px;
}


/* =========================================
   カード
========================================= */

.card {
    background: rgba(15, 22, 34, 0.95);

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    border-radius: 28px;

    padding: 30px;

    box-shadow:
        0 30px 80px
        rgba(0, 0, 0, 0.45);

    backdrop-filter: blur(15px);
}


/* =========================================
   マイク選択
========================================= */

.microphone-section {
    background: #0c1420;

    border:
        1px solid
        #253447;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 30px;
}

.microphone-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.microphone-title span {
    color: #00eaff;
}

.microphone-row {
    display: flex;
    gap: 10px;
}

.microphone-select {
    flex: 1;

    min-width: 0;

    padding: 14px;

    border-radius: 12px;

    border:
        1px solid
        #344356;

    background: #111b29;

    color: white;

    font-size: 15px;

    outline: none;
}

.microphone-select:focus {
    border-color: #00eaff;

    box-shadow:
        0 0 0 3px
        rgba(0, 234, 255, 0.1);
}

.refresh-button {
    white-space: nowrap;

    background: #1d2b3d;
}

.refresh-button:hover {
    background: #293c54;
}


/* =========================================
   選択中マイク表示
========================================= */

.selected-mic {
    margin-top: 12px;

    color: #8998aa;

    font-size: 13px;
}

.selected-mic strong {
    color: #00eaff;
}


/* =========================================
   録音エリア
========================================= */

.recorder {
    text-align: center;
}


/* =========================================
   マイクアイコン
========================================= */

.mic {
    width: 145px;
    height: 145px;

    margin: 10px auto 25px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 62px;

    background:
        linear-gradient(
            145deg,
            #00eaff,
            #0066ff
        );

    box-shadow:
        0 0 40px
        rgba(0, 220, 255, 0.35);

    transition: 0.3s;
}


/* =========================================
   録音中
========================================= */

.recording .mic {
    background:
        linear-gradient(
            145deg,
            #ff315b,
            #d6003d
        );

    box-shadow:
        0 0 40px
        rgba(255, 0, 70, 0.65);

    animation:
        pulse 1s infinite;
}

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }
}


/* =========================================
   ステータス
========================================= */

.status {
    color: #a8b4c4;

    font-size: 18px;

    margin-bottom: 8px;
}

.recording .status {
    color: #ff5072;
}


/* =========================================
   タイマー
========================================= */

.timer {
    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(42px, 9vw, 72px);

    font-weight: bold;

    letter-spacing: 4px;
}


/* =========================================
   波形
========================================= */

.wave {
    height: 50px;

    margin-top: 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 5px;
}

.wave span {
    width: 4px;
    height: 8px;

    border-radius: 5px;

    background: #00eaff;

    opacity: 0.35;
}

.recording .wave span {
    opacity: 1;

    animation:
        wave 0.6s
        infinite
        alternate;
}

.wave span:nth-child(1) {
    animation-delay: 0s;
}

.wave span:nth-child(2) {
    animation-delay: .1s;
}

.wave span:nth-child(3) {
    animation-delay: .2s;
}

.wave span:nth-child(4) {
    animation-delay: .3s;
}

.wave span:nth-child(5) {
    animation-delay: .4s;
}

.wave span:nth-child(6) {
    animation-delay: .5s;
}

.wave span:nth-child(7) {
    animation-delay: .6s;
}

.wave span:nth-child(8) {
    animation-delay: .7s;
}

.wave span:nth-child(9) {
    animation-delay: .8s;
}

@keyframes wave {

    from {
        height: 8px;
    }

    to {
        height: 42px;
    }
}


/* =========================================
   ボタン
========================================= */

.buttons {
    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;

    margin-top: 30px;
}

button {
    border: none;

    color: white;

    cursor: pointer;

    padding: 15px 28px;

    border-radius: 14px;

    font-size: 16px;

    font-weight: bold;

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: translateY(1px);
}

button:disabled {
    opacity: 0.35;

    cursor: not-allowed;

    transform: none;
}


/* =========================================
   録音開始
========================================= */

.start-button {
    background:
        linear-gradient(
            135deg,
            #00d4ff,
            #0066ff
        );

    box-shadow:
        0 8px 25px
        rgba(0, 110, 255, 0.3);
}


/* =========================================
   停止
========================================= */

.stop-button {
    background:
        linear-gradient(
            135deg,
            #ff315b,
            #d9003d
        );
}


/* =========================================
   リセット
========================================= */

.reset-button {
    background: #283547;
}


/* =========================================
   メッセージ
========================================= */

.message {
    text-align: center;

    min-height: 25px;

    margin-top: 20px;

    color: #8f9cae;
}

.message.success {
    color: #38e5a1;
}

.message.error {
    color: #ff5c79;
}


/* =========================================
   録音結果
========================================= */

.result {
    display: none;

    margin-top: 30px;

    padding: 22px;

    background: #0c1520;

    border:
        1px solid
        #26384d;

    border-radius: 18px;
}

.result.show {
    display: block;
}

.result-title {
    color: #00eaff;

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;
}


/* =========================================
   音声プレイヤー
========================================= */

audio {
    width: 100%;

    margin: 10px 0 20px;
}


/* =========================================
   ファイル情報
========================================= */

.file-info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-bottom: 20px;
}

.info-box {
    padding: 14px;

    background: #111c2a;

    border-radius: 12px;

    text-align: center;
}

.info-label {
    color: #718095;

    font-size: 12px;

    margin-bottom: 5px;
}

.info-value {
    color: #dce5ef;

    font-weight: bold;

    word-break: break-word;
}


/* =========================================
   ダウンロード
========================================= */

.download-button {
    display: inline-block;

    text-decoration: none;

    background:
        linear-gradient(
            135deg,
            #00c98d,
            #008b63
        );

    color: white;

    padding: 14px 22px;

    border-radius: 12px;

    font-weight: bold;

    margin-right: 8px;

    transition: 0.2s;
}

.download-button:hover {
    transform: translateY(-2px);
}


/* =========================================
   削除
========================================= */

.delete-button {
    background: #442330;
}

.delete-button:hover {
    background: #5b2c3d;
}


/* =========================================
   プライバシー
========================================= */

.privacy {
    margin-top: 25px;

    padding: 15px;

    border-radius: 13px;

    background: #101923;

    border:
        1px solid
        #263344;

    color: #8795a7;

    font-size: 13px;

    line-height: 1.8;
}


/* =========================================
   スマホ
========================================= */

@media (max-width: 650px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 20px;

        border-radius: 20px;
    }

    .microphone-row {
        flex-direction: column;
    }

    .refresh-button {
        width: 100%;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .file-info {
        grid-template-columns: 1fr;
    }

    .download-button {
        display: block;

        text-align: center;

        margin: 0 0 10px;
    }

    .delete-button {
        width: 100%;
    }

    .mic {
        width: 115px;
        height: 115px;

        font-size: 48px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================
         ヘッダー
    ====================================== -->

    <header class="header">

        <h1>
            🎙 ボイスレコーダー
        </h1>

        <p>
            マイクを選択して録音
        </p>

    </header>


    <!-- =====================================
         メインカード
    ====================================== -->

    <main class="card">


        <!-- =================================
             マイク選択
        ================================== -->

        <section class="microphone-section">

            <div class="microphone-title">

                🎧
                <span>使用するマイク</span>

            </div>


            <div class="microphone-row">

                <select
                    id="microphoneSelect"
                    class="microphone-select"
                >

                    <option value="">
                        マイクを確認しています...
                    </option>

                </select>


                <button
                    id="refreshButton"
                    class="refresh-button"
                    type="button"
                >
                    🔄 マイク更新
                </button>

            </div>


            <div
                id="selectedMic"
                class="selected-mic"
            >
                選択中：
                <strong>確認中...</strong>
            </div>

        </section>



        <!-- =================================
             録音エリア
        ================================== -->

        <section
            id="recorder"
            class="recorder"
        >


            <div class="mic">
                🎙
            </div>


            <div
                id="status"
                class="status"
            >
                録音待機中
            </div>


            <div
                id="timer"
                class="timer"
            >
                00:00:00
            </div>


            <div class="wave">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


        </section>



        <!-- =================================
             操作ボタン
        ================================== -->

        <div class="buttons">


            <button
                id="startButton"
                class="start-button"
                type="button"
            >
                🔴 録音開始
            </button>


            <button
                id="stopButton"
                class="stop-button"
                type="button"
                disabled
            >
                ⏹ 録音停止
            </button>


            <button
                id="resetButton"
                class="reset-button"
                type="button"
                disabled
            >
                🗑 録音を削除
            </button>


        </div>



        <!-- =================================
             メッセージ
        ================================== -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- =================================
             録音結果
        ================================== -->

        <section
            id="result"
            class="result"
        >


            <div class="result-title">
                🎵 録音完了
            </div>


            <!-- 音声再生 -->

            <audio
                id="audioPlayer"
                controls
            ></audio>


            <!-- ファイル情報 -->

            <div class="file-info">


                <div class="info-box">

                    <div class="info-label">
                        ファイル名
                    </div>

                    <div
                        id="fileName"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        録音時間
                    </div>

                    <div
                        id="recordDuration"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        ファイルサイズ
                    </div>

                    <div
                        id="fileSize"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


            </div>



            <!-- ダウンロード -->

            <a
                id="downloadButton"
                class="download-button"
                href="#"
                download
            >
                💾 録音ファイルを保存
            </a>


        </section>



        <!-- =================================
             プライバシー
        ================================== -->

        <div class="privacy">

            🔒
            <strong>プライバシーについて</strong><br>

            このページではGoogle DriveやGASなどの
            外部サービスを使用していません。<br>

            録音データはJavaScriptによって
            このブラウザ上で処理されます。<br>

            「録音ファイルを保存」を押した場合のみ、
            音声ファイルが端末へ保存されます。

        </div>


    </main>


</div>



<script>

/* ==================================================
   グローバル変数
================================================== */


/*
 * MediaRecorder
 */
let mediaRecorder = null;


/*
 * 現在のマイクストリーム
 */
let currentStream = null;


/*
 * 録音データ
 */
let audioChunks = [];


/*
 * 録音開始時間
 */
let recordingStartTime = null;


/*
 * タイマー
 */
let timerInterval = null;


/*
 * 録音Blob
 */
let recordedBlob = null;


/*
 * Object URL
 */
let audioURL = null;



/* ==================================================
   HTML要素
================================================== */

const microphoneSelect =
    document.getElementById(
        "microphoneSelect"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


const selectedMic =
    document.getElementById(
        "selectedMic"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const recorder =
    document.getElementById(
        "recorder"
    );


const status =
    document.getElementById(
        "status"
    );


const timer =
    document.getElementById(
        "timer"
    );


const message =
    document.getElementById(
        "message"
    );


const result =
    document.getElementById(
        "result"
    );


const audioPlayer =
    document.getElementById(
        "audioPlayer"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const fileName =
    document.getElementById(
        "fileName"
    );


const recordDuration =
    document.getElementById(
        "recordDuration"
    );


const fileSize =
    document.getElementById(
        "fileSize"
    );



/* ==================================================
   メッセージ
================================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}



/* ==================================================
   時間を表示
================================================== */

function formatTime(
    seconds
) {

    seconds =
        Math.floor(seconds);


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    return (

        String(hours)
            .padStart(2, "0")

        + ":" +

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(secs)
            .padStart(2, "0")

    );

}



/* ==================================================
   タイマー更新
================================================== */

function updateTimer() {

    if (
        !recordingStartTime
    ) {
        return;
    }


    const elapsed =
        (
            Date.now()
            -
            recordingStartTime
        )
        /
        1000;


    timer.textContent =
        formatTime(
            elapsed
        );

}



/* ==================================================
   ファイルサイズ
================================================== */

function formatFileSize(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return bytes + " B";

    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            (bytes / 1024)
                .toFixed(1)
            +
            " KB"
        );

    }


    return (
        (bytes / 1024 / 1024)
            .toFixed(2)
        +
        " MB"
    );

}



/* ==================================================
   録音形式を決定
================================================== */

function getSupportedMimeType() {

    const mimeTypes = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/ogg;codecs=opus",

        "audio/mp4"

    ];


    for (
        const type of mimeTypes
    ) {

        if (
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ) {

            return type;

        }

    }


    return "";

}



/* ==================================================
   マイク一覧取得
================================================== */

async function loadMicrophones() {

    try {


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.enumerateDevices
        ) {

            throw new Error(
                "このブラウザはマイク選択に対応していません。"
            );

        }


        const devices =
            await navigator
                .mediaDevices
                .enumerateDevices();


        const microphones =
            devices.filter(
                device =>
                    device.kind ===
                    "audioinput"
            );


        microphoneSelect.innerHTML =
            "";


        if (
            microphones.length === 0
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                "";


            option.textContent =
                "マイクが見つかりません";


            microphoneSelect
                .appendChild(
                    option
                );


            selectedMic.innerHTML =
                "選択中：<strong>マイクなし</strong>";


            return;

        }


        microphones.forEach(
            (device, index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    device.deviceId;


                option.textContent =
                    device.label ||
                    `マイク ${index + 1}`;


                microphoneSelect
                    .appendChild(
                        option
                    );

            }
        );


        updateSelectedMicrophone();


        showMessage(
            `${microphones.length}個のマイクを検出しました。`,
            "success"
        );


    }
    catch (error) {

        console.error(
            error
        );


        showMessage(
            error.message,
            "error"
        );

    }

}



/* ==================================================
   マイク許可
================================================== */

async function requestMicrophonePermission() {

    try {


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        /*
         * 許可だけ取得して
         * このストリームは停止
         */

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        await loadMicrophones();


    }
    catch (error) {

        console.error(
            error
        );


        microphoneSelect.innerHTML = `

            <option value="">
                マイクの使用を許可してください
            </option>

        `;


        showMessage(
            "マイクの使用を許可してください。",
            "error"
        );

    }

}



/* ==================================================
   選択中マイク更新
================================================== */

function updateSelectedMicrophone() {

    const selectedOption =
        microphoneSelect
            .options[
                microphoneSelect.selectedIndex
            ];


    if (
        !selectedOption
    ) {

        selectedMic.innerHTML =
            "選択中：<strong>なし</strong>";

        return;

    }


    selectedMic.innerHTML =
        "選択中：<strong>"
        +
        selectedOption.textContent
        +
        "</strong>";

}



/* ==================================================
   マイク選択変更
================================================== */

microphoneSelect.addEventListener(
    "change",
    function () {

        updateSelectedMicrophone();

    }
);



/* ==================================================
   更新ボタン
================================================== */

refreshButton.addEventListener(
    "click",
    async function () {

        await loadMicrophones();

    }
);



/* ==================================================
   マイク接続・切断を検知
================================================== */

if (
    navigator.mediaDevices
) {

    navigator
        .mediaDevices
        .addEventListener(
            "devicechange",
            async function () {

                if (
                    !mediaRecorder ||
                    mediaRecorder.state !==
                    "recording"
                ) {

                    await loadMicrophones();

                }

            }
        );

}



/* ==================================================
   録音開始
================================================== */

startButton.addEventListener(
    "click",
    async function () {

        try {


            const deviceId =
                microphoneSelect.value;


            if (
                !deviceId
            ) {

                showMessage(
                    "使用するマイクを選択してください。",
                    "error"
                );

                return;

            }


            /*
             * 選択したマイクだけ取得
             */

            currentStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio: {

                            deviceId: {
                                exact:
                                    deviceId
                            },

                            echoCancellation:
                                true,

                            noiseSuppression:
                                true,

                            autoGainControl:
                                true

                        }

                    });


            /*
             * 録音データを初期化
             */

            audioChunks = [];


            /*
             * 録音形式
             */

            const mimeType =
                getSupportedMimeType();


            if (
                mimeType
            ) {

                mediaRecorder =
                    new MediaRecorder(
                        currentStream,
                        {
                            mimeType:
                                mimeType
                        }
                    );

            }
            else {

                mediaRecorder =
                    new MediaRecorder(
                        currentStream
                    );

            }


            /*
             * データ受信
             */

            mediaRecorder.addEventListener(
                "dataavailable",
                function(event) {

                    if (
                        event.data &&
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );

                    }

                }
            );


            /*
             * 録音停止
             */

            mediaRecorder.addEventListener(
                "stop",
                function() {

                    finishRecording();

                }
            );


            /*
             * 録音開始
             */

            mediaRecorder.start(
                1000
            );


            /*
             * タイマー開始
             */

            recordingStartTime =
                Date.now();


            timerInterval =
                setInterval(
                    updateTimer,
                    250
                );


            /*
             * UI変更
             */

            recorder
                .classList
                .add(
                    "recording"
                );


            status.textContent =
                "🔴 録音中";


            startButton.disabled =
                true;


            stopButton.disabled =
                false;


            resetButton.disabled =
                true;


            microphoneSelect.disabled =
                true;


            refreshButton.disabled =
                true;


            result
                .classList
                .remove(
                    "show"
                );


            showMessage(
                "録音中です。",
                "success"
            );


        }
        catch (error) {

            console.error(
                error
            );


            if (
                error.name ===
                "NotAllowedError"
            ) {

                showMessage(
                    "マイクの使用が拒否されました。",
                    "error"
                );

            }
            else if (
                error.name ===
                "NotFoundError"
            ) {

                showMessage(
                    "選択したマイクが見つかりません。",
                    "error"
                );

            }
            else {

                showMessage(
                    "マイクを使用できませんでした。",
                    "error"
                );

            }

        }

    }
);



/* ==================================================
   録音停止
================================================== */

stopButton.addEventListener(
    "click",
    function() {

        if (
            !mediaRecorder
        ) {
            return;
        }


        if (
            mediaRecorder.state ===
            "recording"
        ) {

            mediaRecorder.stop();

        }

    }
);



/* ==================================================
   録音完了
================================================== */

function finishRecording() {

    /*
     * タイマー停止
     */

    clearInterval(
        timerInterval
    );


    timerInterval =
        null;


    /*
     * 録音時間
     */

    const elapsedSeconds =
        (
            Date.now()
            -
            recordingStartTime
        )
        /
        1000;


    recordingStartTime =
        null;


    /*
     * MIMEタイプ
     */

    const mimeType =
        mediaRecorder.mimeType ||
        "audio/webm";


    /*
     * Blob作成
     */

    recordedBlob =
        new Blob(
            audioChunks,
            {
                type:
                    mimeType
            }
        );


    /*
     * 古いURLを削除
     */

    if (
        audioURL
    ) {

        URL.revokeObjectURL(
            audioURL
        );

    }


    /*
     * 新しいURL
     */

    audioURL =
        URL.createObjectURL(
            recordedBlob
        );


    /*
     * プレイヤー
     */

    audioPlayer.src =
        audioURL;


    /*
     * ファイル名
     */

    const extension =
        getExtension(
            mimeType
        );


    const name =
        createFileName(
            extension
        );


    /*
     * ダウンロード設定
     */

    downloadButton.href =
        audioURL;


    downloadButton.download =
        name;


    /*
     * 情報表示
     */

    fileName.textContent =
        name;


    recordDuration.textContent =
        formatTime(
            elapsedSeconds
        );


    fileSize.textContent =
        formatFileSize(
            recordedBlob.size
        );


    /*
     * UI
     */

    recorder
        .classList
        .remove(
            "recording"
        );


    status.textContent =
        "✅ 録音完了";


    timer.textContent =
        formatTime(
            elapsedSeconds
        );


    startButton.disabled =
        false;


    stopButton.disabled =
        true;


    resetButton.disabled =
        false;


    microphoneSelect.disabled =
        false;


    refreshButton.disabled =
        false;


    result
        .classList
        .add(
            "show"
        );


    showMessage(
        "録音が完了しました。再生または保存できます。",
        "success"
    );


    /*
     * マイク停止
     */

    if (
        currentStream
    ) {

        currentStream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );


        currentStream =
            null;

    }

}



/* ==================================================
   拡張子
================================================== */

function getExtension(
    mimeType
) {

    if (
        mimeType.includes(
            "ogg"
        )
    ) {

        return "ogg";

    }


    if (
        mimeType.includes(
            "mp4"
        )
    ) {

        return "mp4";

    }


    return "webm";

}



/* ==================================================
   ファイル名作成
================================================== */

function createFileName(
    extension
) {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        )
        .padStart(
            2,
            "0"
        );


    const hour =
        String(
            now.getHours()
        )
        .padStart(
            2,
            "0"
        );


    const minute =
        String(
            now.getMinutes()
        )
        .padStart(
            2,
            "0"
        );


    const second =
        String(
            now.getSeconds()
        )
        .padStart(
            2,
            "0"
        );


    return (

        "録音_" +
        year +
        month +
        day +
        "_" +
        hour +
        minute +
        second +
        "." +
        extension

    );

}



/* ==================================================
   録音削除
================================================== */

resetButton.addEventListener(
    "click",
    function() {

        if (
            !recordedBlob
        ) {

            return;

        }


        const confirmed =
            confirm(
                "録音データを削除しますか？"
            );


        if (
            !confirmed
        ) {

            return;

        }


        /*
         * プレイヤー停止
         */

        audioPlayer.pause();


        audioPlayer.removeAttribute(
            "src"
        );


        audioPlayer.load();


        /*
         * URL削除
         */

        if (
            audioURL
        ) {

            URL.revokeObjectURL(
                audioURL
            );

            audioURL =
                null;

        }


        /*
         * データ削除
         */

        recordedBlob =
            null;


        audioChunks =
            [];


        /*
         * UI
         */

        result
            .classList
            .remove(
                "show"
            );


        resetButton.disabled =
            true;


        timer.textContent =
            "00:00:00";


        status.textContent =
            "録音待機中";


        showMessage(
            "録音データを削除しました。",
            "success"
        );

    }
);



/* ==================================================
   ページ終了時
================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        /*
         * ストリーム停止
         */

        if (
            currentStream
        ) {

            currentStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        /*
         * URL削除
         */

        if (
            audioURL
        ) {

            URL.revokeObjectURL(
                audioURL
            );

        }

    }
);



/* ==================================================
   初期化
================================================== */

window.addEventListener(
    "load",
    async function() {

        /*
         * MediaRecorder確認
         */

        if (
            !window.MediaRecorder
        ) {

            showMessage(
                "このブラウザは録音機能に対応していません。",
                "error"
            );

            startButton.disabled =
                true;

            return;

        }


        /*
         * HTTPSまたはlocalhost確認
         */

        const secure =
            window.isSecureContext;


        if (
            !secure &&
            location.hostname !==
            "localhost"
        ) {

            showMessage(
                "マイク機能を使用するにはHTTPSまたはlocalhostで開いてください。",
                "error"
            );

        }


        /*
         * マイク許可
         */

        await requestMicrophonePermission();

    }
);

</script>
