<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

    initial-scale=1.0,
    maximum-scale=1.0,

<title>micro:bit Robot Controller</title>


<style>

* {

    box-sizing:
        border-box;

    user-select:
        none;

    -webkit-user-select:
        none;

    -webkit-tap-highlight-color:
        transparent;
}


html,
body {

    margin:
        0;

    padding:
        0;

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;
}


body {

    background:
        #07111f;

    color:
        white;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}


.container {

    width:
        100%;

    height:
        100%;

    max-width:
        650px;

    margin:
        auto;

    padding:
        10px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        7px;
}


/* =====================================================
   タイトル
===================================================== */

.title {

    text-align:
        center;

    font-size:
        22px;

    font-weight:
        bold;

    padding:
        4px;
}


/* =====================================================
   接続ボタン
===================================================== */

.connection {

    display:

    grid-template-columns:
        1fr 1fr 1fr;

    gap:
        6px;
}


.connection button {

    border:
        none;

    border-radius:
        10px;

    padding:
        12px 4px;

    color:
        white;

    font-size:
        13px;

    font-weight:
        bold;

    cursor:

}


#bluetoothButton {

    background:
        #2563eb;
}


#usbButton {

        #059669;
}


#reconnectButton {

    background:
        #7c3aed;
}


.connection button:active {

    transform:

   状態
===================================================== */

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        10px;

    padding:
        7px 10px;

    font-size:

}


.statusRow {

    display:

    justify-content:
        space-between;

    align-items:
        center;

    min-height:
        18px;
}


.ok {

    color:
        #4ade80;

    font-weight:

}


.ng {

    color:
        #f87171;

    font-weight:
        bold;
}


.info {

    color:
        #60a5fa;

    font-weight:
        bold;
}

   速度
===================================================== */

.speedArea {

    display:
        flex;

    align-items:
        center;

    gap:
        7px;
}


.speedButton {

    width:
        50px;

    height:
        40px;

    border:
        none;

    border-radius:
        9px;

    background:
        #334155;

    color:
        white;

    font-size:
        23px;

    font-weight:
        bold;
}


.speedButton:active {

    transform:
        scale(.94);
}


.speedValue {

    flex:
        1;

    text-align:
        center;

    font-size:
        18px;

    font-weight:
        bold;
}


/* =====================================================
   コントローラー
===================================================== */

.controller {

    width:
        min(
            90vw,
            390px
        );

    aspect-ratio:
        1 / 1;

    margin:
        auto;

    display:
        grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    grid-template-rows:
        repeat(
            3,
            1fr
        );

    gap:
        8px;
}


.control {

    border:
        none;

    border-radius:
        20px;

    background:
        #1e3a5f;

    color:
        white;

    font-size:
        45px;

    font-weight:
        bold;

    box-shadow:
        0 6px 0
        #0b1e33;

    touch-action:
        none;

    cursor:
        pointer;
}


.control:active {

    transform:
        translateY(
            6px
        );

    box-shadow:
        none;
}


#up {

    grid-column:
        2;

    grid-row:
        1;
}


#left {

    grid-column:
        1;

    grid-row:
        2;
}


#stop {

    grid-column:
        2;

    grid-row:
        2;

    background:
        #991b1b;

    box-shadow:
        0 6px 0
        #5f1111;
}


#right {

    grid-column:
        3;

    grid-row:
        2;
}


#down {

    grid-column:
        2;

    grid-row:
        3;
}


/* =====================================================
   テスト
===================================================== */

.testArea {

    display:
        grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:
        5px;
}


.testArea button {

    border:
        none;

    border-radius:
        8px;

    padding:
        8px;

    background:
        #475569;

    color:
        white;

    font-size:
        11px;

    font-weight:
        bold;
}


/* =====================================================
   ログ
===================================================== */

#log {

    height:
        75px;

    overflow-y:
        auto;

    background:
        #020617;

    border-radius:
        8px;

    padding:
        6px;

    font-family:
        monospace;

    font-size:
        9px;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;
}

<script>


// =====================================================
// Bluetooth UUID
// =====================================================

const UART_SERVICE =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";


const UART_RX =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


const UART_TX =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


// =====================================================
// Bluetooth
// =====================================================

let device = null;

let server = null;

let service = null;

let rx = null;

let tx = null;


// =====================================================
// USB
// =====================================================

let port = null;

let writer = null;


// =====================================================
// 速度
// =====================================================

let speed = 50;


// =====================================================
// 最後に送信した移動コマンド
// =====================================================

let currentCommand = "S";


// =====================================================
// ログ
// =====================================================

function log(
    text
) {

    const element =
        document.getElementById(
            "log"
        );


    const time =
        new Date()
        .toLocaleTimeString();


    element.textContent =
        time +
        " " +
        text +
        "\n" +
        element.textContent;
}


// =====================================================
// Bluetooth接続判定
// =====================================================

function isBluetoothConnected() {

    return (
        device !== null &&
        device.gatt !== null &&
        device.gatt.connected === true &&
        rx !== null
    );
}


// =====================================================
// USB接続判定
// =====================================================

function isUSBConnected() {

    return (
        port !== null &&
        writer !== null
    );
}


// =====================================================
// 状態表示
// =====================================================

function updateStatus() {

    const btStatus =
        document.getElementById(
            "btStatus"
        );


    const usbStatus =
        document.getElementById(
            "usbStatus"
        );


    const modeStatus =
        document.getElementById(
            "modeStatus"
        );


    const currentSpeed =
        document.getElementById(
            "currentSpeed"
        );


    const speedValue =
        document.getElementById(
            "speedValue"
        );


    if (
        isBluetoothConnected()
    ) {

        btStatus.textContent =
            "接続済み";

        btStatus.className =
            "ok";

    } else {

        btStatus.textContent =
            "未接続";

        btStatus.className =
            "ng";
    }


    if (
        isUSBConnected()
    ) {

        usbStatus.textContent =
            "接続済み";

        usbStatus.className =
            "ok";

    } else {

        usbStatus.textContent =
            "未接続";

        usbStatus.className =
            "ng";
    }


    if (
        isBluetoothConnected()
    ) {

        modeStatus.textContent =
            "Bluetooth";

    } else if (
        isUSBConnected()
    ) {

        modeStatus.textContent =
            "USB";

    } else {

        modeStatus.textContent =
            "未接続";
    }


    currentSpeed.textContent =
        speed + "%";


    speedValue.textContent =
        "速度 " +
        speed +
        "%";
}


// =====================================================
// Bluetooth接続
// =====================================================

async function connectBluetooth() {

    if (
        !navigator.bluetooth
    ) {

        alert(
            "このブラウザはWeb Bluetoothに対応していません。ChromeまたはEdgeを使用してください。"
        );

        return;
    }


    try {

        log(
            "Bluetooth接続開始"
        );


        log(
            "micro:bitを検索しています..."
        );


        /*
         * acceptAllDevicesを使用。
         *
         * これにより、UARTサービスの広告が
         * chooserに出ない場合でも
         * micro:bitを選択できます。
         */

        device =
            await navigator.bluetooth
            .requestDevice({

                acceptAllDevices:
                    true,

                optionalServices: [
                    UART_SERVICE
                ]

            });


        log(
            "選択: " +
            (
                device.name ||
                "micro:bit"
            )
        );


        device.addEventListener(
            "gattserverdisconnected",
            handleBluetoothDisconnected
        );


        log(
            "GATT接続中..."
        );


        server =
            await device.gatt.connect();


        log(
            "GATT接続OK"
        );


        // =================================================
        // UART Service
        // =================================================

        try {

            service =
                await server
                .getPrimaryService(
                    UART_SERVICE
                );

        } catch (
            error
        ) {

            log(
                "UARTサービス取得失敗"
            );


            log(
                "UUID: " +
                UART_SERVICE
            );


            log(
                "micro:bit側で bluetooth.startUartService() が必要です"
            );


            try {

                device.gatt.disconnect();

            } catch (
                disconnectError
            ) {
            }


            return;
        }


        log(
            "UARTサービスOK"
        );


        // =================================================
        // RX
        // =================================================

        try {

            rx =
                await service
                .getCharacteristic(
                    UART_RX
                );

        } catch (
            error
        ) {

            log(
                "RX取得失敗"
            );

            return;
        }


        log(
            "RX OK"
        );


        // =================================================
        // TX
        // =================================================

        try {

            tx =
                await service
                .getCharacteristic(
                    UART_TX
                );


            await tx.startNotifications();


            tx.addEventListener(
                "characteristicvaluechanged",
                handleBluetoothMessage
            );


            log(
                "TX OK"
            );

        } catch (
            error
        ) {

            log(
                "TX取得失敗: " +
                error.message
            );
        }


        updateStatus();


        log(
            "=========================="
        );


        log(
            "Bluetooth UART接続成功"
        );


        log(
            "=========================="
        );


        // =================================================
        // PING
        // =================================================

        await sendBluetooth(
            "PING"
        );


    } catch (
        error
    ) {

        log(
            "Bluetooth ERROR: " +
            error.message
        );


        rx = null;

        tx = null;

        service = null;

        server = null;


        updateStatus();
    }
}


// =====================================================
// Bluetooth受信
// =====================================================

function handleBluetoothMessage(
    event
) {

    try {

        const decoder =
            new TextDecoder();


        const data =
            decoder.decode(
                event.target.value
            );


        log(
            "BT ← " +
            data.trim()
        );

    } catch (
        error
    ) {

        log(
            "BT受信エラー"
        );
    }
}


// =====================================================
// Bluetooth切断
// =====================================================

function handleBluetoothDisconnected() {

    log(
        "Bluetooth切断"
    );


    rx = null;

    tx = null;

    service = null;

    server = null;


    updateStatus();
}


// =====================================================
// Bluetooth再接続
// =====================================================

async function reconnectBluetooth() {

    if (
        !device
    ) {

        log(
            "保存されたBluetoothデバイスがありません"
        );


        await connectBluetooth();

        return;
    }


    try {

        log(
            "Bluetooth再接続中..."
        );


        server =
            await device.gatt.connect();


        log(
            "GATT再接続OK"
        );


        service =
            await server
            .getPrimaryService(
                UART_SERVICE
            );


        log(
            "UARTサービスOK"
        );


        rx =
            await service
            .getCharacteristic(
                UART_RX
            );


        log(
            "RX OK"
        );


        tx =
            await service
            .getCharacteristic(
                UART_TX
            );


        await tx.startNotifications();


        tx.addEventListener(
            "characteristicvaluechanged",
            handleBluetoothMessage
        );


        updateStatus();


        log(
            "Bluetooth再接続成功"
        );


        await sendBluetooth(
            "PING"
        );


    } catch (
        error
    ) {

        log(
            "再接続失敗: " +
            error.message
        );


        rx = null;

        tx = null;


        updateStatus();
    }
}


// =====================================================
// Bluetooth送信
// =====================================================

async function sendBluetooth(
    command
) {

    if (
        !isBluetoothConnected()
    ) {

        log(
            "Bluetooth未接続"
        );

        return false;
    }


    try {

        const data =
            new TextEncoder()
            .encode(
                command +
                "\n"
            );


        /*
         * Chromeの実装差に対応
         */

        if (
            rx.writeValueWithResponse
        ) {

            await rx.writeValueWithResponse(
                data
            );

        } else {

            await rx.writeValue(
                data
            );
        }


        log(
            "BT → " +
            command
        );


        return true;


    } catch (
        error
    ) {

        log(
            "BT送信ERROR: " +
            error.message
        );


        return false;
    }
}


// =====================================================
// USB接続
// =====================================================

async function connectUSB() {

    if (
        !navigator.serial
    ) {

        alert(
            "このブラウザはWeb Serialに対応していません。ChromeまたはEdgeを使用してください。"
        );

        return;
    }


    try {

        log(
            "USB接続開始"
        );


        port =
            await navigator.serial
            .requestPort();


        await port.open({
            baudRate:
                115200
        });


        writer =
            port.writable.getWriter();


        updateStatus();


        log(
            "USB接続成功"
        );


        await sendUSB(
            "STATUS"
        );


    } catch (
        error
    ) {

        log(
            "USB ERROR: " +
            error.message
        );


        port = null;

        writer = null;


        updateStatus();
    }
}


// =====================================================
// USB送信
// =====================================================

async function sendUSB(
    command
) {

    if (
        !isUSBConnected()
    ) {

        log(
            "USB未接続"
        );

        return false;
    }


    try {

        const data =
            new TextEncoder()
            .encode(
                command +
                "\n"
            );


        await writer.write(
            data
        );


        log(
            "USB → " +
            command
        );


        return true;


    } catch (
        error
    ) {

        log(
            "USB送信ERROR: " +
            error.message
        );


        return false;
    }
}


// =====================================================
// 共通送信
//
// Bluetoothを優先。
// BluetoothがなければUSB。
// =====================================================

async function sendCommand(
    command
) {

    /*
     * Bluetooth優先
     */

    if (
        isBluetoothConnected()
    ) {

        return await sendBluetooth(
            command
        );
    }


    /*
     * BluetoothがなければUSB
     */

    if (
        isUSBConnected()
    ) {

        return await sendUSB(
            command
        );
    }


    log(
        "送信先がありません"
    );


    return false;
}


// =====================================================
// 速度送信
// =====================================================

async function sendSpeed() {

    await sendCommand(
        "SPEED:" +
        speed
    );
}


// =====================================================
// 速度UP
// =====================================================

document
.getElementById(
    "speedPlus"
)
.addEventListener(
    "click",
    async function() {

        speed += 10;


        if (
            speed > 100
        ) {

            speed = 100;
        }


        updateStatus();


        await sendSpeed();
    }
);


// =====================================================
// 速度DOWN
// =====================================================

document
.getElementById(
    "speedMinus"
)
.addEventListener(
    "click",
    async function() {

        speed -= 10;


        if (
            speed < 10
        ) {

            speed = 10;
        }


        updateStatus();


        await sendSpeed();
    }
);


// =====================================================
// Bluetoothボタン
// =====================================================

document
.getElementById(
    "bluetoothButton"
)
.addEventListener(
    "click",
    async function() {

        await connectBluetooth();
    }
);


// =====================================================
// 再接続ボタン
// =====================================================

document
.getElementById(
    "reconnectButton"
)
.addEventListener(
    "click",
    async function() {

        await reconnectBluetooth();
    }
);


// =====================================================
// USBボタン
// =====================================================

document
.getElementById(
    "usbButton"
)
.addEventListener(
    "click",
    async function() {

        await connectUSB();
    }
);


// =====================================================
// 移動ボタン設定
// =====================================================

function setupMoveButton(
    id,
    command
) {

    const button =
        document.getElementById(
            id
        );


    /*
     * 押した瞬間
     */

    button.addEventListener(
        "pointerdown",
        async function(event) {

            event.preventDefault();


            try {

                button.setPointerCapture(
                    event.pointerId
                );

            } catch (
                error
            ) {
            }


            currentCommand =
                command;


            await sendCommand(
                command
            );
        }
    );


    /*
     * 離した瞬間
     */

    button.addEventListener(
        "pointerup",
        async function(event) {

            event.preventDefault();


            currentCommand =
                "S";


            await sendCommand(
                "S"
            );
        }
    );


    /*
     * キャンセル
     */

    button.addEventListener(
        "pointercancel",
        async function() {

            currentCommand =
                "S";


            await sendCommand(
                "S"
            );
        }
    );


    /*
     * ポインターが外れた
     */

    button.addEventListener(
        "lostpointercapture",
        async function() {

            if (
                currentCommand ==
                command
            ) {

                currentCommand =
                    "S";


                await sendCommand(
                    "S"
                );
            }
        }
    );
}


// =====================================================
// 移動ボタン
// =====================================================

setupMoveButton(
    "up",
    "U"
);


setupMoveButton(
    "down",
    "D"
);


setupMoveButton(
    "left",
    "L"
);


setupMoveButton(
    "right",
    "R"
);

// =====================================================

document
.getElementById(
    "stop"
)
.addEventListener(
    "pointerdown",
    async function(event) {

        event.preventDefault();


        currentCommand =
            "S";


        await sendCommand(
            "S"
        );
    }
);


// =====================================================
// PING
// =====================================================

document
.getElementById(
    "pingButton"
)
.addEventListener(
    "click",
    async function() {

        await sendCommand(

        );
    }
);


// =====================================================
// TEST
// =====================================================

document
.getElementById(
    "testButton"
)
.addEventListener(

        await sendCommand(

// =====================================================
// MOTOR TEST
// =====================================================

document
.getElementById(
    "motorTestButton"
)
.addEventListener(

    async function() {

        await sendCommand(

        );
    }

// =====================================================
// キーボード操作
// =====================================================

const keyboardCommands = {

    ArrowUp:
        "U",

    ArrowDown:
        "D",

    ArrowLeft:
        "L",

    ArrowRight:
        "R"

};


document.addEventListener(
    "keydown",
    async function(event) {

        const command =
            keyboardCommands[
                event.key
            ];


        if (
            !command
        ) {

            return;
        }


        event.preventDefault();


        if (
            event.repeat
        ) {

            return;
        }


        currentCommand =
            command;


        await sendCommand(
            command
        );
    }
);


document.addEventListener(
    "keyup",
    async function(event) {

        if (
            !keyboardCommands[
                event.key
            ]
        ) {

            return;
        }


        event.preventDefault();


        currentCommand =
            "S";


        await sendCommand(
            "S"
        );
    }
);
