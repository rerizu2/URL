<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>micro:bit Robot</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {

    margin: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;

    background:
        #07111f;

    color: white;
}

.container {

    width: 100%;
    height: 100%;

    max-width: 600px;

    margin: auto;

    padding: 10px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 8px;
}


/* =====================================================
   タイトル
===================================================== */

h1 {

    margin: 0;

    text-align: center;

    font-size: 22px;
}


/* =====================================================
   接続
===================================================== */

.connection {

    display: flex;

    gap: 6px;
}

.connection button {

    flex: 1;

    border: none;

    border-radius: 10px;

    padding: 12px 5px;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

#bluetoothButton {

    background: #2563eb;
}

#usbButton {

    background: #059669;
}

#reconnectButton {

    background: #7c3aed;
}


/* =====================================================
   ステータス
===================================================== */

.status {

    background:
        rgba(255,255,255,.08);

    border-radius: 10px;

    padding: 8px;

    font-size: 12px;
}

.status div {

    display: flex;

    justify-content: space-between;

    padding: 2px;
}

.ok {

    color: #4ade80;

    font-weight: bold;
}

.ng {

    color: #f87171;

    font-weight: bold;
}


/* =====================================================
   速度
===================================================== */

.speed {

    display: flex;

    gap: 6px;

    align-items: center;
}

.speed button {

    border: none;

    border-radius: 9px;

    background: #334155;

    color: white;

    font-size: 20px;

    width: 55px;

    height: 40px;
}

.speedValue {

    flex: 1;

    text-align: center;

    font-size: 20px;

    font-weight: bold;
}


/* =====================================================
   コントローラー
===================================================== */

.controller {

    width: min(90vw, 390px);

    aspect-ratio: 1;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    gap: 8px;
}

.control {

    border: none;

    border-radius: 20px;

    background: #1e3a5f;

    color: white;

    font-size: 45px;

    font-weight: bold;

    box-shadow:
        0 6px 0 #0b1e33;

    touch-action: none;
}

.control:active {

    transform:
        translateY(6px);

    box-shadow: none;
}

#up {

    grid-column: 2;
    grid-row: 1;
}

#left {

    grid-column: 1;
    grid-row: 2;
}

#stop {

    grid-column: 2;
    grid-row: 2;

    background: #991b1b;

    box-shadow:
        0 6px 0 #5f1111;
}

#right {

    grid-column: 3;
    grid-row: 2;
}

#down {

    grid-column: 2;
    grid-row: 3;
}


/* =====================================================
   ログ
===================================================== */

#log {

    height: 75px;

    overflow-y: auto;

    background: #020617;

    border-radius: 8px;

    padding: 6px;

    font-family: monospace;

    font-size: 9px;

    white-space: pre-wrap;
}

</style>

</head>


<body>


<div class="container">


<h1>
🤖 micro:bit Robot
</h1>


<!-- 接続 -->

<div class="connection">

<button
    id="bluetoothButton"
>
📡 Bluetooth
</button>

<button
    id="reconnectButton"
>
🔄 再接続
</button>

<button
    id="usbButton"
>
🔌 USB
</button>

</div>


<!-- 状態 -->

<div class="status">

<div>

<span>Bluetooth</span>

<span
    id="btStatus"
    class="ng"
>
未接続
</span>

</div>


<div>

<span>USB</span>

<span
    id="usbStatus"
    class="ng"
>
未接続
</span>

</div>


<div>

<span>通信</span>

<span id="mode">
未接続
</span>

</div>

</div>


<!-- 速度 -->

<div class="speed">

<button
    id="speedMinus"
>
−
</button>


<div
    id="speedValue"
    class="speedValue"
>
50%
</div>


<button
    id="speedPlus"
>
＋
</button>

</div>


<!-- コントローラー -->

<div class="controller">


<button
    id="up"
    class="control"
>
↑
</button>


<button
    id="left"
    class="control"
>
←
</button>


<button
    id="stop"
    class="control"
>
■
</button>


<button
    id="right"
    class="control"
>
→
</button>


<button
    id="down"
    class="control"
>
↓
</button>


</div>


<!-- ログ -->

<div
    id="log"
>
起動しました。
</div>


</div>


<script>


// =========================================================
// UUID
// =========================================================

const UART_SERVICE =
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const UART_RX =
"6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const UART_TX =
"6e400003-b5a3-f393-e0a9-e50e24dcca9e";


// =========================================================
// Bluetooth
// =========================================================

let device = null;

let server = null;

let service = null;

let rx = null;

let tx = null;


// =========================================================
// USB
// =========================================================

let port = null;

let writer = null;


// =========================================================
// 速度
// =========================================================

let speed = 50;


// =========================================================
// ログ
// =========================================================

function log(
    text
) {

    const element =
        document.getElementById(
            "log"
        );


    element.textContent =
        new Date()
        .toLocaleTimeString()
        + " "
        + text
        + "\n"
        + element.textContent;
}


// =========================================================
// 状態
// =========================================================

function updateStatus() {

    const bt =
        document.getElementById(
            "btStatus"
        );

    const usb =
        document.getElementById(
            "usbStatus"
        );

    const mode =
        document.getElementById(
            "mode"
        );


    if (
        device &&
        device.gatt &&
        device.gatt.connected &&
        rx
    ) {

        bt.textContent =
            "接続済み";

        bt.className =
            "ok";

        mode.textContent =
            "Bluetooth";

    } else {

        bt.textContent =
            "未接続";

        bt.className =
            "ng";
    }


    if (
        port &&
        writer
    ) {

        usb.textContent =
            "接続済み";

        usb.className =
            "ok";

        if (
            !(
                device &&
                device.gatt &&
                device.gatt.connected
            )
        ) {

            mode.textContent =
                "USB";
        }

    } else {

        usb.textContent =
            "未接続";

        usb.className =
            "ng";
    }
}


// =========================================================
// Bluetooth接続
// =========================================================

async function connectBluetooth() {

    log(
        "Bluetooth接続開始"
    );


    if (
        !navigator.bluetooth
    ) {

        alert(
            "Web Bluetoothに対応していません。ChromeまたはEdgeを使用してください。"
        );

        return;
    }


    try {

        log(
            "micro:bitを検索しています..."
        );


        device =
            await navigator.bluetooth
            .requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    UART_SERVICE
                ]
            });


        log(
            "選択: " +
            (
                device.name ||
                "micro:bit"
            )
        );


        device.addEventListener(
            "gattserverdisconnected",
            function() {

                log(
                    "Bluetooth切断"
                );


                rx = null;

                tx = null;

                server = null;

                service = null;


                updateStatus();
            }
        );


        log(
            "GATT接続中..."
        );


        server =
            await device.gatt.connect();


        log(
            "GATT接続OK"
        );


        service =
            await server
            .getPrimaryService(
                UART_SERVICE
            );


        log(
            "UARTサービスOK"
        );


        rx =
            await service
            .getCharacteristic(
                UART_RX
            );


        log(
            "UART RX OK"
        );


        try {

            tx =
                await service
                .getCharacteristic(
                    UART_TX
                );


            await tx.startNotifications();


            tx.addEventListener(
                "characteristicvaluechanged",
                function(event) {

                    const decoder =
                        new TextDecoder();


                    const data =
                        decoder.decode(
                            event.target.value
                        );


                    log(
                        "BT ← " +
                        data.trim()
                    );
                }
            );


            log(
                "UART TX OK"
            );

        } catch (
            error
        ) {

            log(
                "TX取得不可"
            );
        }


        updateStatus();


        log(
            "Bluetooth接続完了"
        );


        await sendBluetooth(
            "STATUS"
        );


    } catch (
        error
    ) {

        log(
            "Bluetooth ERROR: "
            + error.message
        );


        rx = null;

        tx = null;

        server = null;

        service = null;


        updateStatus();
    }
}


// =========================================================
// Bluetooth再接続
// =========================================================

async function reconnectBluetooth() {

    if (
        !device
    ) {

        await connectBluetooth();

        return;
    }


    try {

        log(
            "再接続中..."
        );


        server =
            await device.gatt.connect();


        service =
            await server
            .getPrimaryService(
                UART_SERVICE
            );


        rx =
            await service
            .getCharacteristic(
                UART_RX
            );


        tx =
            await service
            .getCharacteristic(
                UART_TX
            );


        await tx.startNotifications();


        updateStatus();


        log(
            "再接続完了"
        );


        await sendBluetooth(
            "STATUS"
        );


    } catch (
        error
    ) {

        log(
            "再接続失敗: "
            + error.message
        );


        await connectBluetooth();
    }
}


// =========================================================
// Bluetooth送信
// =========================================================

async function sendBluetooth(
    command
) {

    if (
        !rx ||
        !device ||
        !device.gatt ||
        !device.gatt.connected
    ) {

        log(
            "BT送信不可"
        );

        return false;
    }


    try {

        const data =
            new TextEncoder()
            .encode(
                command +
                "\n"
            );


        if (
            rx.writeValueWithResponse
        ) {

            await rx.writeValueWithResponse(
                data
            );

        } else {

            await rx.writeValue(
                data
            );
        }


        log(
            "BT → " +
            command
        );


        return true;


    } catch (
        error
    ) {

        log(
            "BT送信エラー: "
            + error.message
        );


        return false;
    }
}


// =========================================================
// USB接続
// =========================================================

async function connectUSB() {

    if (
        !navigator.serial
    ) {

        alert(
            "Web Serialに対応していません。ChromeまたはEdgeを使用してください。"
        );

        return;
    }


    try {

        port =
            await navigator.serial
            .requestPort();


        await port.open({
            baudRate: 115200
        });


        writer =
            port.writable.getWriter();


        updateStatus();


        log(
            "USB接続完了"
        );


    } catch (
        error
    ) {

        log(
            "USB ERROR: "
            + error.message
        );


        port = null;

        writer = null;


        updateStatus();
    }
}


// =========================================================
// USB送信
// =========================================================

async function sendUSB(
    command
) {

    if (
        !writer
    ) {

        return false;
    }


    try {

        const data =
            new TextEncoder()
            .encode(
                command +
                "\n"
            );


        await writer.write(
            data
        );


        log(
            "USB → " +
            command
        );


        return true;

    } catch (
        error
    ) {

        log(
            "USB送信エラー"
        );

        return false;
    }
}


// =========================================================
// 共通送信
// =========================================================

async function sendCommand(
    command
) {

    /*
     * Bluetooth優先
     */

    if (
        device &&
        device.gatt &&
        device.gatt.connected &&
        rx
    ) {

        return await sendBluetooth(
            command
        );
    }


    /*
     * BluetoothがなければUSB
     */

    if (
        writer
    ) {

        return await sendUSB(
            command
        );
    }


    log(
        "送信先がありません"
    );


    return false;
}


// =========================================================
// Bluetoothボタン
// =========================================================

document
.getElementById(
    "bluetoothButton"
)
.addEventListener(
    "click",
    async function() {

        await connectBluetooth();
    }
);


// =========================================================
// 再接続
// =========================================================

document
.getElementById(
    "reconnectButton"
)
.addEventListener(
    "click",
    async function() {

        await reconnectBluetooth();
    }
);


// =========================================================
// USB
// =========================================================

document
.getElementById(
    "usbButton"
)
.addEventListener(
    "click",
    async function() {

        await connectUSB();
    }
);


// =========================================================
// 速度
// =========================================================

document
.getElementById(
    "speedPlus"
)
.addEventListener(
    "click",
    async function() {

        speed += 10;


        if (
            speed > 100
        ) {

            speed = 100;
        }


        document
        .getElementById(
            "speedValue"
        )
        .textContent =
            speed + "%";


        /*
         * 現在のmicro:bitコードでは
         * SPEEDコマンドはモーター速度変更には
         * 使用しません。
         *
         * 後でServo:Liteの速度制御を
         * 正確に追加できます。
         */
    }
);


document
.getElementById(
    "speedMinus"
)
.addEventListener(
    "click",
    function() {

        speed -= 10;


        if (
            speed < 10
        ) {

            speed = 10;
        }


        document
        .getElementById(
            "speedValue"
        )
        .textContent =
            speed + "%";
    }
);


// =========================================================
// 移動ボタン
// =========================================================

function setupMoveButton(
    id,
    command
) {

    const button =
        document.getElementById(
            id
        );


    button.addEventListener(
        "pointerdown",
        async function(event) {

            event.preventDefault();


            button.setPointerCapture(
                event.pointerId
            );


            await sendCommand(
                command
            );
        }
    );


    button.addEventListener(
        "pointerup",
        async function(event) {

            event.preventDefault();


            await sendCommand(
                "S"
            );
        }
    );


    button.addEventListener(
        "pointercancel",
        async function() {

            await sendCommand(
                "S"
            );
        }
    );


    button.addEventListener(
        "lostpointercapture",
        async function() {

            await sendCommand(
                "S"
            );
        }
    );
}


setupMoveButton(
    "up",
    "U"
);


setupMoveButton(
    "down",
    "D"
);


setupMoveButton(
    "left",
    "L"
);


setupMoveButton(
    "right",
    "R"
);


// =========================================================
// 停止
// =========================================================

document
.getElementById(
    "stop"
)
.addEventListener(
    "pointerdown",
    async function() {

        await sendCommand(
            "S"
        );
    }
);


// =========================================================
// キーボード
// =========================================================

const keyboardCommands = {

    ArrowUp: "U",

    ArrowDown: "D",

    ArrowLeft: "L",

    ArrowRight: "R"
};


document.addEventListener(
    "keydown",
    async function(event) {

        if (
            !keyboardCommands[
                event.key
            ]
        ) {

            return;
        }


        if (
            event.repeat
        ) {

            return;
        }


        event.preventDefault();


        await sendCommand(
            keyboardCommands[
                event.key
            ]
        );
    }
);


document.addEventListener(
    "keyup",
    async function(event) {

        if (
            !keyboardCommands[
                event.key
            ]
        ) {

            return;
        }


        event.preventDefault();


        await sendCommand(
            "S"
        );
    }
);


// =========================================================
// 起動
// =========================================================

updateStatus();

log(
    "micro:bit Robot Controller READY"
);

</script>

</body>

</html>
