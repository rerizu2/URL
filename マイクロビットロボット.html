<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>幻想クロニクル</title>

<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap"
  rel="stylesheet"

<style>

:root{
  --teal:#33ffcc;
  --pink:#ff3399;
  --glass:rgba(0,0,0,.8);
  --border:rgba(255,255,255,.4);
}

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:#fff;

  font-family:
    "Noto Sans JP",
    sans-serif;

  touch-action:manipulation;

}

button,
input{

  font-family:inherit;

}

.hidden{

  display:none !important;

}


/* =========================================================
   背景
========================================================= */

.bg-sekai{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  background:

    url(
      "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2000"
    )

    center/cover no-repeat;

  filter:brightness(.4);

  z-index:-2;

  pointer-events:none;

}

.bg-overlay{

  position:fixed;

  inset:0;

  background:
    radial-gradient(
      circle at center,
      transparent 0%,
      #000 100%
    );

  z-index:-1;

  pointer-events:none;

}


/* =========================================================
   画面
========================================================= */

.screen{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-direction:column;

  padding:20px;

  z-index:100;

}


/* =========================================================
   ボタン
========================================================= */

.btn-pro{

  border:none;

  background:#fff;

  color:#111;

  padding:16px 40px;

  margin:12px;

  width:85%;

  max-width:320px;

  border-radius:4px;

  font-weight:900;

  cursor:pointer;

  transform:skewX(-15deg);

  box-shadow:
    5px 5px 0 var(--teal);

}

.btn-pro span{

  display:inline-block;

  transform:skewX(15deg);

}

.btn-pro.pink{

  background:var(--pink);

  color:#fff;

  box-shadow:
    5px 5px 0 var(--pink);

}

.btn-pro.gray{

  background:#777;

  color:#fff;

}


/* =========================================================
   ヘッダー
========================================================= */

.header-minimal{

  position:absolute;

  top:15px;

  left:15px;

  display:flex;

  align-items:center;

  gap:8px;

  z-index:300;

}

.av-mini{

  width:38px;
  height:38px;

  border-radius:50%;

  overflow:hidden;

  border:2px solid #fff;

  cursor:pointer;

}

.av-mini img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.iro-coin-disp{

  color:var(--teal);

  font-weight:900;

  margin-left:10px;

}


/* =========================================================
   ホーム
========================================================= */

.main-console-text{

  font-family:Montserrat,sans-serif;

  font-size:
    clamp(
      2rem,
      10vw,
      5.5rem
    );

  letter-spacing:12px;

  text-align:center;

  pointer-events:none;

}

.nav-container{

  position:absolute;

  bottom:25px;

  left:2.5%;

  width:95%;

  display:flex;

  gap:10px;

  z-index:400;

}

.nav-card{

  flex:1;

  padding:18px 5px;

  background:rgba(0,0,0,.65);

  border:
    1px solid
    rgba(255,255,255,.2);

  border-radius:12px;

  text-align:center;

  font-weight:900;

  cursor:pointer;

}

.nav-card.main{

  background:var(--pink);

}


/* =========================================================
   プレゼント
========================================================= */

.present-btn{

  position:absolute;

  top:75px;

  left:15px;

  width:48px;
  height:48px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(255,255,255,.08);

  border:1px solid #555;

  cursor:pointer;

  z-index:300;

}

.present-badge{

  position:absolute;

  right:-3px;

  top:-3px;

  width:19px;
  height:19px;

  display:none;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:red;

  font-size:.65rem;

  font-weight:bold;

}


/* =========================================================
   シート
========================================================= */

#sheetOverlay{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.8);

  backdrop-filter:blur(5px);

  z-index:49000;

  display:none;

}

.bottom-sheet{

  position:fixed;

  left:0;

  bottom:-100%;

  width:100%;

  height:94%;

  overflow-y:auto;

  background:#0a0b12;

  border-radius:
    30px 30px 0 0;

  border-top:
    1px solid var(--border);

  z-index:50000;

  transition:
    .4s ease;

}

.bottom-sheet.open{

  bottom:0;

}

.sheet-content{

  max-width:800px;

  margin:auto;

  padding:25px;

  padding-bottom:120px;

}


/* =========================================================
   メンバー
========================================================= */

.member-grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(100px,1fr)
    );

  gap:12px;

}

.member-card{

  position:relative;

  padding:10px;

  background:
    rgba(255,255,255,.08);

  border-radius:12px;

  text-align:center;

  cursor:pointer;

}

.member-card img{

  width:100%;
  height:110px;

  object-fit:cover;

  border-radius:6px;

}

.count-badge{

  position:absolute;

  right:5px;
  top:5px;

  background:var(--pink);

  padding:2px 7px;

  border-radius:10px;

}


/* =========================================================
   設定
========================================================= */

.student-id-card{

  background:#fff;

  color:#333;

  border-radius:15px;

  padding:25px;

  max-width:350px;

  margin:auto;

}

.student-input{

  width:100%;

  border:none;

  border-bottom:
    2px solid #333;

  padding:10px 0;

  margin-bottom:15px;

  font-size:1.1rem;

  color:#000;

  background:transparent;

}


/* =========================================================
   クエスト
========================================================= */

#questScreen{

  overflow-y:auto;

}

#gameListContainer{

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:15px;

  width:100%;

}


/* =========================================================
   ゲーム
========================================================= */

#gameLayer{

  position:fixed;

  inset:0;

  display:none;

  z-index:10000;

  background:#000;

}

#gameFrame{

  width:100%;
  height:100%;

  border:none;

}


/* =========================================================
   ポーズ
========================================================= */

#pauseOverlay{

  position:fixed;

  inset:0;

  display:none;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  background:rgba(0,0,0,.96);

  z-index:60000;

}


/* =========================================================
   履歴
========================================================= */

.history-item{

  background:
    rgba(255,255,255,.06);

  padding:12px;

  margin-bottom:8px;

  border-radius:10px;

  display:flex;

  justify-content:space-between;

}


/* =========================================================
   プレゼント
========================================================= */

.present-item{

  background:#fff;

  color:#333;

  border-radius:12px;

  padding:15px;

  margin-bottom:10px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}


/* =========================================================
   モーダル
========================================================= */

dialog{

  background:#111;

  color:#fff;

  border:none;

  border-radius:20px;

  padding:30px;

  width:90%;

  max-width:350px;

}

dialog input{

  width:100%;

  padding:12px;

  margin:8px 0;

}


/* =========================================================
   スマホ
========================================================= */

@media(max-width:600px){

  .nav-container{

    gap:5px;

  }

  .nav-card{

    font-size:.7rem;

    padding:15px 3px;

  }

  .main-console-text{

    letter-spacing:5px;

  }

}

</style>

</head>

<script>

/* =========================================================
   GAS
========================================================= */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxPh-uEHaAV57Oo3xvYc-FCFEI_dZkaz7_iHsly-Wbm7nZJHqlmdBMXqGVFjvq6mVLw/exec";


/* =========================================================
   グローバル
========================================================= */

let myId =
  localStorage.getItem("gID") ||
  generateId();

let iroCoins =
  Number(
    localStorage.getItem("gCoins") || 0
  );

let myChars = "";

let globalCharaPool = {

  star2: [],
  star3: [],
  star4: []

};

let friendsData = [];

let claimedPresents = [];

let syncTimer = null;


/* =========================================================
   ID生成
========================================================= */

function generateId(){

  return Math
    .random()
    .toString(36)
    .substring(2,12)
    .toUpperCase();

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   GAS GET
========================================================= */

async function getGAS(
  action = "",
  params = {}
){

  const query =
    new URLSearchParams();

  if(action){

    query.set(
      "action",
      action
    );

  }

  Object
    .entries(params)
    .forEach(
      ([key,value]) => {

        query.set(
          key,
          value
        );

      }
    );


  const url =
    GAS_URL +
    "?" +
    query.toString();


  const response =
    await fetch(url);


  return await response.json();

}


/* =========================================================
   GAS POST
========================================================= */

async function postGAS(data){

  try{

    const response =
      await fetch(
        GAS_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data)

        }
      );


    return await response.json();

  }catch(error){

    console.error(
      "POST ERROR",
      error
    );


    return {

      result:"error",

      message:
        error.message

    };

  }

}


/* =========================================================
   Web操作記録
========================================================= */

async function logWebAction(
  action,
  detail = "",
  value = ""
){

  try{

    await postGAS({

      type:
        "webAction",

      id:
        myId,

      action:
        action,

      detail:
        detail,

      value:
        value

    });

  }catch(error){

    console.warn(
      "操作履歴保存失敗",
      error
    );

  }

}


/* =========================================================
   ログイン
========================================================= */

function handleLoginClick(){

  logWebAction(
    "ログインボタン"
  );


  if(
    !localStorage.getItem(
      "gName"
    )
  ){

    transition(
      "titleScreen",
      "registrationScreen"
    );

  }else{

    beginPortalSync();

  }

}


/* =========================================================
   登録
========================================================= */

async function saveRegistration(){

  const name =
    document
      .getElementById(
        "regName"
      )
      .value
      .trim();

  const pass =
    document
      .getElementById(
        "regPass"
      )
      .value;


  if(!name || !pass){

    alert(
      "名前と合言葉を入力してください"
    );

    return;

  }


  localStorage.setItem(
    "gName",
    name
  );

  localStorage.setItem(
    "gPass",
    pass
  );

  localStorage.setItem(
    "gID",
    myId
  );


  await postGAS({

    type:"sync",

    id:myId,

    name:name,

    pass:pass,

    iroCoin:iroCoins,

    chars:myChars,

/* =========================================================
   ポータル同期
========================================================= */

async function beginPortalSync(){

  transition(
    "titleScreen",
    "loadingScreen"
  );

  transition(
    "registrationScreen",
    "loadingScreen"
  );


  try{

    const charResult =
      await getGAS(
        "getCharaPools"
      );


    if(
      charResult.result ===
      "success"
    ){

      globalCharaPool =
        charResult.data || {

          star2:[],
          star3:[],
          star4:[]

        };

    }


    const ok =
      await fetchSync();


    if(!ok){

      alert(
        "サーバーとの同期に失敗しました"
      );

      transition(
        "loadingScreen",
        "titleScreen"
      );

      return;

    }


    transition(
      "loadingScreen",
      "gameScreen"
    );


    if(!syncTimer){

      syncTimer =
        setInterval(
          fetchSync,
          15000
        );

    }

  }catch(error){

    console.error(error);

    alert(
      "初期化に失敗しました"
    );

    transition(
      "loadingScreen",
      "titleScreen"
    );

  }

}


/* =========================================================
   同期
========================================================= */

async function fetchSync(){

  try{

    const json =
      await getGAS(
        "",
        {
          id:myId
        }
      );


    if(
      json.result !==
      "success"
    ){

      return false;

    }


    iroCoins =
      Number(
        json.iroCoin || 0
      );


    localStorage.setItem(
      "gCoins",
      iroCoins
    );


    myChars =
      json.chars || "";


    friendsData =
      json.friendsData || [];


    document
      .getElementById(
        "hIroCoin"
      )
      .innerText =
        iroCoins.toLocaleString();


    document
      .getElementById(
        "hName"
      )
      .innerText =
        json.name || "USER";


    document
      .getElementById(
        "myIdDisplay"
      )
      .innerText =
        myId;


    document
      .getElementById(
        "hVerified"
      )
      .innerHTML =
        json.isOfficial
          ? '<span class="badge-verify">✔</span>'
          : "";


    const avatar =
      json.avatar ||
      "https://api.dicebear.com/7.x/avataaars/svg?seed=" +
      encodeURIComponent(myId);


    document
      .getElementById(
        "hAv"
      )
      .src =
        avatar;


    document
      .getElementById(
        "mAv"
      )
      .src =
        avatar;


    document
      .getElementById(
        "nIn"
      )
      .value =
        json.name || "";


    document
      .getElementById(
        "pIn"
      )
      .value =
        localStorage.getItem(
          "gPass"
        ) || "";


    updatePresentUI(
      json.pendingGifts || []
    );


    updateHistoryUI(
      json.history || []
    );


    renderMembers();

    renderFriends(
      json.pending || ""
    );


    return true;

  }catch(error){

    console.error(
      "同期エラー",
      error
    );

    return false;

  }

}


/* =========================================================

========================================================= */

function transition(
  from,
  to
){

  const a =
    document.getElementById(
      from
    );

  const b =
    document.getElementById(
      to
    );


  if(a){

    a.classList.add(
      "hidden"
    );

  }


  if(b){

    b.style.display =
      "flex";

    b.classList.remove(
      "hidden"
    );

  }

}


/* =========================================================
   メンバー
========================================================= */

function renderMembers(){

  const container =
    document.getElementById(
      "memberListContainer"
    );


  if(!myChars){

    container.innerHTML =
      "キャラクターなし";

    return;

  }


  const counts = {};


  myChars
    .split(",")
    .filter(Boolean)
    .forEach(
      name => {

        counts[name] =
          (
            counts[name] || 0
          ) + 1;

      }
    );


  const master = [

    ...(globalCharaPool.star2 || []),
    ...(globalCharaPool.star3 || []),
    ...(globalCharaPool.star4 || [])

  ];


  container.innerHTML =
    Object
      .keys(counts)
      .map(
        name => {

          const char =
            master.find(
              c =>
                c.name === name
            );


          if(!char){

            return "";

          }


          return `

            <div
              class="member-card"
              onclick="showMemberDetail(
                '${escapeHTML(name)}'
              )"
            >

              <div class="count-badge">
                x${counts[name]}
              </div>

              <img
                src="${escapeHTML(char.img)}"
              >

              <small>
                ${escapeHTML(char.name)}
              </small>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   メンバー詳細
========================================================= */

function showMemberDetail(
  name
){

  const master = [

    ...(globalCharaPool.star2 || []),
    ...(globalCharaPool.star3 || []),
    ...(globalCharaPool.star4 || [])

  ];


  const char =
    master.find(
      c =>
        c.name === name
    );


  if(!char){

    return;

  }


  let stars = 2;


  if(
    globalCharaPool.star4
      .some(
        c => c.name === name
      )
  ){

    stars = 4;

  }else if(
    globalCharaPool.star3
      .some(
        c => c.name === name
      )
  ){

    stars = 3;

  }


  document
    .getElementById(
      "memberDetailContent"
    )
    .innerHTML = `

      <img
        src="${escapeHTML(char.img)}"
        style="
          width:220px;
          max-width:80%;
          border-radius:20px;
        "
      >

      <div
        style="
          color:#ffcc00;
          font-size:2rem;
        "
      >
        ${"★".repeat(stars)}
      </div>

      <h2>
        ${escapeHTML(char.name)}
      </h2>

    `;


  document
    .getElementById(
      "giftSelectionArea"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "startGiftBtn"
    )
    .onclick =
      function(){

        document
          .getElementById(
            "giftFriendList"
          )
          .innerHTML =
            friendsData
              .map(
                friend => `

                  <div
                    style="
                      padding:12px;
                      border-bottom:
                        1px solid #ddd;
                      cursor:pointer;
                    "
                    onclick="
                      executeMemberGift(
                        '${escapeHTML(friend.id)}',
                        '${escapeHTML(friend.name)}',
                        '${escapeHTML(char.name)}'
                      )
                    "
                  >
                    ${escapeHTML(friend.name)}
                    ➜ 贈る

                `
              )
              .join("");


        document
          .getElementById(
            "giftSelectionArea"
          )
          .style.display =

  openSheet(
    "sheetMemberDetail"
  );

}

async function executeMemberGift(
  targetId,
  targetName,
  charName
){

  if(
    !confirm(
      targetName +
      "さんに" +
      charName +
      "を贈りますか？"
    )
  ){

    return;

  }


  const result =
    await postGAS({

      type:
        "friendMemberGift",

      fromId:
        myId,

      fromName:
        document
          .getElementById(
            "hName"
          )
          .innerText,

      toId:
        targetId,

      charName:
        charName

    });


  if(
    result.result !==
    "success"
  ){

    alert(
      result.message ||
      "送信に失敗しました"
    );

    return;

  }


  alert(
    "送信しました"
  );


  closeSheet(
    "sheetMemberDetail"
  );


  await fetchSync();

function startPull(n){

  const cost =
    n * 300;


  if(
    coins < cost
  ){

    alert(
      "コインが不足しています"
    );

    return;

  }


  const allPool = {

    star2:
      pools.star2 || [],

    star3:
      pools.star3 || [],

    star4:
      pools.star4 || []

  };


  if(
    !allPool.star2.length ||
    !allPool.star3.length ||
    !allPool.star4.length
  ){

    alert(
      "キャラクターデータが不足しています"
    );

    return;

  }


  coins -= cost;


  document
    .getElementById(
      "c"
    )
    .innerText =
      coins.toLocaleString();


  results = [];

  const names = [];


  let has4 = false;
  let has3 = false;


  for(
    let i=0;
    i<n;
    i++
  ){

    let rank = 2;

    const r =
      Math.random() * 100;


    if(
      r < 3.5
    ){

      rank = 4;

    }else if(
      r < 16
    ){

      rank = 3;

    }


    if(
      n >= 100 &&
      i === n - 1 &&
      !has4
    ){

      rank = 4;

    }else if(
      n >= 10 &&
      i === n - 1 &&
      !has3 &&
      rank < 3
    ){

      rank = 3;

    }


    if(rank >= 4){
      has4 = true;
    }

    if(rank >= 3){
      has3 = true;
    }


    const pool =
      allPool[
        "star" + rank
      ];


    const char =
      pool[
        Math.floor(
          Math.random() *
          pool.length
        )
      ];


    results.push({

      ...char,

      rank:rank

    });


    names.push(
      char.name
    );

  }


  window.parent.postMessage(

    {

      type:
        "gachaPull",

      value:
        coins,

      pulls:
        n,

      chars:
        names.join(",")

    },

    "*"

  );


  current = 0;

  showReveal();

}

function uploadIcon(input){

  if(
    !input.files ||
    !input.files[0]
  ){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    async function(event){

      const data =
        event.target.result;


      localStorage.setItem(
        "gAv",
        data
      );


      document
        .getElementById(
          "hAv"
        )
        .src =
          data;


      document
        .getElementById(
          "mAv"
        )
        .src =
          data;


      await postGAS({

        type:
          "setting",

        id:
          myId,

        avatar:
          data

      });


      logWebAction(
        "アイコン変更"
      );


      await fetchSync();

    };


  reader.readAsDataURL(
    input.files[0]
  );

}

/* =========================================================
   ゲーム一覧
========================================================= */

async function loadGameList(){

  const container =
    document.getElementById(
      "gameListContainer"
    );


  container.innerHTML =
    "読み込み中...";


  try{

    const result =
      await getGAS(
        "getList"
      );


    if(
      result.result !==
      "success"
    ){

      container.innerHTML =
        "ゲーム一覧の取得に失敗しました";

      return;

    }


    const games =
      result.data || [];


    container.innerHTML =
      "";


    if(!games.length){

      container.innerHTML =
        "ゲームがありません";

      return;

    }


    games.forEach(
      game => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "nav-card";


        card.style.width =
          "130px";


        card.innerHTML =
          `<b>${escapeHTML(game.title)}</b>`;


        card.onclick =
          function(){

            launchGame(
              game.id,
              game.title
            );

          };


        container.appendChild(
          card
        );

      }
    );


  }catch(error){

    console.error(error);

    container.innerHTML =
      "ゲーム一覧の取得に失敗しました";

  }

}


/* =========================================================
   ゲーム起動
========================================================= */

async function launchGame(
  id,
  title
){

  logWebAction(
    "ゲーム起動",
    title,
    id
  );


  document
    .getElementById(
      "gameLayer"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "mobilePauseBtn"
    )
    .style.display =
      "flex";


  try{

    const result =
      await getGAS(
        "getCode",
        {
          row:id
        }
      );


    if(
      result.result !==
      "success"
    ){

      alert(
        result.message ||
        "ゲームコード取得失敗"
      );

      return;

    }


    document
      .getElementById(
        "gameFrame"
      )
      .srcdoc =
        result.code || "";


    await postGAS({

      type:
        "launch",

      id:
        myId,

      gameId:
        id,

      title:
        title

    });


  }catch(error){

    console.error(error);

    alert(
      "ゲーム起動に失敗しました"
    );

  }

}

async function sendReq(){

  const target =
    document
      .getElementById(
        "fIdIn"
      )
      .value
      .trim()
      .toUpperCase();


  if(!target){

    alert(
      "IDを入力してください"
    );

    return;

  }


  if(
    target === myId
  ){

    alert(
      "自分自身には申請できません"
    );

    return;

  }


  const result =
    await postGAS({

      type:
        "request",

      myId:
        myId,

      targetId:
        target

    });


  if(
    result.result !==
    "success"
  ){

    alert(
      result.message ||
      "申請に失敗しました"
    );

    return;

  }


  logWebAction(
    "フレンド申請",
    target
  );


  alert(
    "送信完了"
  );


  document
    .getElementById(
      "fIdIn"
    )
    .value =
      "";


  await fetchSync();

}

/* =========================================================
   コイン送信
========================================================= */

async function sendFriendGift(
  fid
){

  const amount =
    prompt(
      "枚数",
      "100"
    );


  if(!amount){

    return;

  }


  const n =
    Number(amount);


  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    alert(
      "枚数が不正です"
    );

    return;

  }


  if(
    iroCoins < n
  ){

    alert(
      "コインが不足しています"
    );

    return;

  }


  const result =
    await postGAS({

      type:
        "friendGift",

      fromId:
        myId,

      fromName:
        document
          .getElementById(
            "hName"
          )
          .innerText,

      toId:
        fid,

      amount:
        n

    });


  if(
    result.result !==
    "success"
  ){

    alert(
      result.message ||
      "送信に失敗しました"
    );

    return;

  }


  await fetchSync();

}

/* =========================================================
   データ復元
========================================================= */

async function executeTransfer(){

  const id =
    document
      .getElementById(
        "tIdIn"
      )
      .value
      .trim()
      .toUpperCase();


  const pass =
    document
      .getElementById(
        "tPassIn"
      )
      .value;


  if(!id || !pass){

    alert(
      "IDと合言葉を入力してください"
    );

    return;

  }


  try{

    const json =
      await getGAS(
        "",
        {
          id:id
        }
      );


    if(
      json.result ===
      "success" &&
      String(json.pass) ===
      String(pass)
    ){

      localStorage.setItem(
        "gID",
        id
      );

      localStorage.setItem(
        "gName",
        json.name || ""
      );

      localStorage.setItem(
        "gPass",
        pass
      );

      localStorage.setItem(
        "gCoins",
        json.iroCoin || 0
      );


      myId =
        id;


      logWebAction(
        "データ復元成功"
      );


      document
        .getElementById(
          "modalTransfer"
        )
        .close();


      location.reload();

    }else{

      alert(
        "IDまたは合言葉が違います"
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "復元に失敗しました"
    );

  }

}


/* =========================================================
   属性用エスケープ
========================================================= */

function escapeAttribute(
  value
){

  return String(
    value || ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
