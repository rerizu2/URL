<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>micro:bit Robot Controller</title>


<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}


body {

    background: #07111f;

    color: white;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}


.container {

    width: 100%;
    height: 100%;

    max-width: 650px;

    margin: auto;

    padding: 10px;

    display: flex;

    flex-direction: column;

    gap: 7px;
}


/* =====================================================
   タイトル
===================================================== */

.title {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    padding: 3px;
}


/* =====================================================
   接続
===================================================== */

.connection {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 6px;
}


.connection button {

    border: none;

    border-radius: 10px;

    padding: 11px 4px;

    color: white;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}


#bluetoothButton {
    background: #2563eb;
}


#reconnectButton {
    background: #7c3aed;
}


#usbButton {
    background: #059669;
}


.connection button:active {

    transform: scale(.95);
}


/* =====================================================
   ステータス
===================================================== */

.status {

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 10px;

    padding: 6px 10px;

    font-size: 12px;
}


.statusRow {

    min-height: 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.ok {

    color: #4ade80;

    font-weight: bold;
}


.ng {

    color: #f87171;

    font-weight: bold;
}


.info {

    color: #60a5fa;

    font-weight: bold;
}


/* =====================================================
   速度
===================================================== */

.speedArea {

    display: flex;

    align-items: center;

    gap: 7px;
}


.speedButton {

    width: 50px;

    height: 40px;

    border: none;

    border-radius: 9px;

    background: #334155;

    color: white;

    font-size: 23px;

    font-weight: bold;
}


.speedButton:active {

    transform: scale(.94);
}


.speedValue {

    flex: 1;

    text-align: center;

    font-size: 18px;

    font-weight: bold;
}


/* =====================================================
   コントローラー
===================================================== */

.controller {

    width:
        min(90vw, 390px);

    aspect-ratio: 1 / 1;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    gap: 8px;
}


.control {

    border: none;

    border-radius: 20px;

    background: #1e3a5f;

    color: white;

    font-size: 45px;

    font-weight: bold;

    box-shadow:
        0 6px 0 #0b1e33;

    touch-action: none;

    cursor: pointer;
}


.control:active {

    transform:
        translateY(6px);

    box-shadow: none;
}


#up {

    grid-column: 2;
    grid-row: 1;
}


#left {

    grid-column: 1;
    grid-row: 2;
}


#stop {

    grid-column: 2;
    grid-row: 2;

    background: #991b1b;

    box-shadow:
        0 6px 0 #5f1111;
}


#right {

    grid-column: 3;
    grid-row: 2;
}


#down {

    grid-column: 2;
    grid-row: 3;
}


/* =====================================================
   テスト
===================================================== */

.testArea {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 5px;
}


.testArea button {

    border: none;

    border-radius: 8px;

    padding: 8px;

    background: #475569;

    color: white;

    font-size: 11px;

    font-weight: bold;
}


/* =====================================================
   ログ
===================================================== */

#log {

    height: 78px;

    overflow-y: auto;

    background: #020617;

    border-radius: 8px;

    padding: 6px;

    font-family: monospace;

    font-size: 9px;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}

</style>

</head>


<body>


<div class="container">


<div class="title">

🤖 micro:bit Robot Controller

</div>


<!-- ===================================================
     接続
=================================================== -->

<div class="connection">

<button
    id="bluetoothButton"
>
📡 Bluetooth
</button>


<button
    id="reconnectButton"
>
🔄 再接続
</button>


<button
    id="usbButton"
>
🔌 USB初期接続
</button>

</div>


<!-- ===================================================
     状態
=================================================== -->

<div class="status">

<div class="statusRow">

<span>
Bluetooth
</span>

<span
    id="btStatus"
    class="ng"
>
未接続
</span>

</div>


<div class="statusRow">

<span>
USB
</span>

<span
    id="usbStatus"
    class="ng"
>
未接続
</span>

</div>


<div class="statusRow">

<span>
操作モード
</span>

<span
    id="modeStatus"
    class="info"
>
未接続
</span>

</div>


<div class="statusRow">

<span>
速度
</span>

<span
    id="currentSpeed"
    class="info"
>
50%
</span>

</div>

</div>


<!-- ===================================================
     速度
=================================================== -->

<div class="speedArea">

<button
    id="speedMinus"
    class="speedButton"
>
−
</button>


<div
    id="speedValue"
    class="speedValue"
>
速度 50%
</div>


<button
    id="speedPlus"
    class="speedButton"
>
＋
</button>

</div>


<!-- ===================================================
     操作
=================================================== -->

<div class="controller">


<button
    id="up"
    class="control"
>
↑
</button>


<button
    id="left"
    class="control"
>
←
</button>


<button
    id="stop"
    class="control"
>
■
</button>


<button
    id="right"
    class="control"
>
→
</button>


<button
    id="down"
    class="control"
>
↓
</button>


</div>


<!-- ===================================================
     テスト
=================================================== -->

<div class="testArea">

<button
    id="pingButton"
>
PING
</button>


<button
    id="testButton"
>
TEST
</button>


<button
    id="motorTestButton"
>
MOTOR TEST
</button>

</div>


<!-- ===================================================
     ログ
=================================================== -->

<div id="log">
起動しました。
</div>


</div>


<script>


/* =====================================================
   Bluetooth UUID
===================================================== */

const UART_SERVICE =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";


const UART_RX =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


const UART_TX =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/* =====================================================
   Bluetooth
===================================================== */

let device = null;

let server = null;

let service = null;

let rx = null;

let tx = null;


/* =====================================================
   USB
===================================================== */

let port = null;

let writer = null;


/* =====================================================
   速度
===================================================== */

let speed = 50;


/* =====================================================
   コマンド
===================================================== */

let currentCommand = "S";


/* =====================================================
   ログ
===================================================== */

function log(text) {

    const element =
        document.getElementById("log");

    const time =
        new Date()
        .toLocaleTimeString();

    element.textContent =
        time +
        " " +
        text +
        "\n" +
        element.textContent;
}


/* =====================================================
   Bluetooth接続確認
===================================================== */

function isBluetoothConnected() {

    return (
        device !== null &&
        device.gatt !== null &&
        device.gatt.connected === true &&
        rx !== null
    );
}


/* =====================================================
   USB接続確認
===================================================== */

function isUSBConnected() {

    return (
        port !== null &&
        writer !== null
    );
}


/* =====================================================
   状態更新
===================================================== */

function updateStatus() {

    const bt =
        document.getElementById(
            "btStatus"
        );


    const usb =
        document.getElementById(
            "usbStatus"
        );


    const mode =
        document.getElementById(
            "modeStatus"
        );


    const speedText =
        document.getElementById(
            "currentSpeed"
        );


    const speedValue =
        document.getElementById(
            "speedValue"
        );


    if (
        isBluetoothConnected()
    ) {

        bt.textContent =
            "接続済み";

        bt.className =
            "ok";

    } else {

        bt.textContent =
            "未接続";

        bt.className =
            "ng";
    }


    if (
        isUSBConnected()
    ) {

        usb.textContent =
            "接続済み";

        usb.className =
            "ok";

    } else {

        usb.textContent =
            "未接続";

        usb.className =
            "ng";
    }


    /*
     * Bluetoothを最優先
     */

    if (
        isBluetoothConnected()
    ) {

        mode.textContent =
            "Bluetooth";

    } else if (
        isUSBConnected()
    ) {

        mode.textContent =
            "USB";

    } else {

        mode.textContent =
            "未接続";
    }


    speedText.textContent =
        speed + "%";


    speedValue.textContent =
        "速度 " +
        speed +
        "%";
}


/* =====================================================
   Bluetooth接続
===================================================== */

async function connectBluetooth() {

    if (
        !navigator.bluetooth
    ) {

        alert(
            "Web Bluetoothに対応していません。ChromeまたはEdgeを使用してください。"
        );

        return;
    }


    try {

        log(
            "Bluetooth接続開始"
        );


        log(
            "micro:bitを検索しています..."
        );


        /*
         * acceptAllDevicesを使う。
         *
         * UARTサービスが広告時のfilterに
         * 出てこないケースを避ける。
         */

        device =
            await navigator.bluetooth
            .requestDevice({

                acceptAllDevices:
                    true,

                optionalServices: [
                    UART_SERVICE
                ]
            });


        log(
            "選択: " +
            (
                device.name ||
                "BBC micro:bit"
            )
        );


        device.addEventListener(
            "gattserverdisconnected",
            bluetoothDisconnected
        );


        log(
            "GATT接続中..."
        );


        server =
            await device.gatt.connect();


        log(
            "GATT接続OK"
        );


        /*
         * UART Service
         */

        service =
            await server
            .getPrimaryService(
                UART_SERVICE
            );


        log(
            "UARTサービスOK"
        );


        /*
         * RX
         */

        rx =
            await service
            .getCharacteristic(
                UART_RX
            );


        log(
            "RX OK"
        );


        /*
         * TX
         */

        tx =
            await service
            .getCharacteristic(
                UART_TX
            );


        log(
            "TX OK"
        );


        await tx.startNotifications();


        tx.addEventListener(
            "characteristicvaluechanged",
            bluetoothReceived
        );


        updateStatus();


        log(
            "=========================="
        );


        log(
            "Bluetooth UART接続成功"
        );


        log(
            "=========================="
        );


        /*
         * 通信確認
         */

        await sendBluetooth(
            "PING"
        );


    } catch (error) {

        log(
            "Bluetooth ERROR: " +
            error.message
        );


        rx = null;

        tx = null;

        service = null;

        server = null;


        updateStatus();
    }
}


/* =====================================================
   Bluetooth受信
===================================================== */

function bluetoothReceived(
    event
) {

    try {

        const decoder =
            new TextDecoder();


        const data =
            decoder.decode(
                event.target.value
            );


        log(
            "BT ← " +
            data.trim()
        );

    } catch (error) {

        log(
            "BT受信ERROR"
        );
    }
}


/* =====================================================
   Bluetooth切断
===================================================== */

function bluetoothDisconnected() {

    log(
        "Bluetooth切断"
    );


    rx = null;

    tx = null;

    service = null;

    server = null;


    updateStatus();
}


/* =====================================================
   Bluetooth再接続
===================================================== */

async function reconnectBluetooth() {

    if (
        !device
    ) {

        log(
            "再接続するmicro:bitがありません"
        );


        await connectBluetooth();

        return;
    }


    try {

        log(
            "Bluetooth再接続中..."
        );


        server =
            await device.gatt.connect();


        log(
            "GATT再接続OK"
        );


        service =
            await server
            .getPrimaryService(
                UART_SERVICE
            );


        log(
            "UARTサービスOK"
        );


        rx =
            await service
            .getCharacteristic(
                UART_RX
            );


        tx =
            await service
            .getCharacteristic(
                UART_TX
            );


        await tx.startNotifications();


        tx.addEventListener(
            "characteristicvaluechanged",
            bluetoothReceived
        );


        updateStatus();


        log(
            "Bluetooth再接続成功"
        );


        await sendBluetooth(
            "PING"
        );


    } catch (error) {

        log(
            "再接続ERROR: " +
            error.message
        );


        rx = null;

        tx = null;

        updateStatus();
    }
}


/* =====================================================
   Bluetooth送信
===================================================== */

async function sendBluetooth(
    command
) {

    if (
        !isBluetoothConnected()
    ) {

        log(
            "Bluetooth未接続"
        );

        return false;
    }


    try {

        const data =
            new TextEncoder()
            .encode(
                command +
                "\n"
            );


        if (
            rx.writeValueWithResponse
        ) {

            await rx.writeValueWithResponse(
                data
            );

        } else {

            await rx.writeValue(
                data
            );
        }


        log(
            "BT → " +
            command
        );


        return true;


    } catch (error) {

        log(
            "BT送信ERROR: " +
            error.message
        );


        return false;
    }
}


/* =====================================================
   USB接続
===================================================== */

async function connectUSB() {

    if (
        !navigator.serial
    ) {

        alert(
            "Web Serialに対応していません。ChromeまたはEdgeを使用してください。"
        );

        return;
    }


    try {

        log(
            "USB初期接続開始"
        );


        port =
            await navigator.serial
            .requestPort();


        await port.open({
            baudRate: 115200
        });


        writer =
            port.writable
            .getWriter();


        updateStatus();


        log(
            "USB接続成功"
        );


        await sendUSB(
            "STATUS"
        );


    } catch (error) {

        log(
            "USB ERROR: " +
            error.message
        );


        port = null;

        writer = null;


        updateStatus();
    }
}


/* =====================================================
   USB送信
===================================================== */

async function sendUSB(
    command
) {

    if (
        !isUSBConnected()
    ) {

        log(
            "USB未接続"
        );

        return false;
    }


    try {

        const data =
            new TextEncoder()
            .encode(
                command +
                "\n"
            );


        await writer.write(
            data
        );


        log(
            "USB → " +
            command
        );


        return true;


    } catch (error) {

        log(
            "USB送信ERROR: " +
            error.message
        );


        return false;
    }
}


/* =====================================================
   共通送信
 *
 * Bluetoothを最優先。
 * BluetoothがなければUSB。
===================================================== */

async function sendCommand(
    command
) {

    if (
        isBluetoothConnected()
    ) {

        return await sendBluetooth(
            command
        );
    }


    if (
        isUSBConnected()
    ) {

        return await sendUSB(
            command
        );
    }


    log(
        "送信先なし: " +
        command
    );


    return false;
}


/* =====================================================
   速度
===================================================== */

async function sendSpeed() {

    await sendCommand(
        "SPEED:" +
        speed
    );
}


/* =====================================================
   速度+
===================================================== */

document
.getElementById("speedPlus")
.addEventListener(
    "click",
    async function() {

        speed += 10;


        if (speed > 100) {
            speed = 100;
        }


        updateStatus();


        await sendSpeed();
    }
);


/* =====================================================
   速度-
===================================================== */

document
.getElementById("speedMinus")
.addEventListener(
    "click",
    async function() {

        speed -= 10;


        if (speed < 10) {
            speed = 10;
        }


        updateStatus();


        await sendSpeed();
    }
);


/* =====================================================
   Bluetooth
===================================================== */

document
.getElementById("bluetoothButton")
.addEventListener(
    "click",
    async function() {

        await connectBluetooth();
    }
);


/* =====================================================
   再接続
===================================================== */

document
.getElementById("reconnectButton")
.addEventListener(
    "click",
    async function() {

        await reconnectBluetooth();
    }
);


/* =====================================================
   USB
===================================================== */

document
.getElementById("usbButton")
.addEventListener(
    "click",
    async function() {

        await connectUSB();
    }
);


/* =====================================================
   移動ボタン
===================================================== */

function setupMoveButton(
    id,
    command
) {

    const button =
        document.getElementById(
            id
        );


    button.addEventListener(
        "pointerdown",
        async function(event) {

            event.preventDefault();


            try {

                button.setPointerCapture(
                    event.pointerId
                );

            } catch (error) {
            }


            currentCommand =
                command;


            await sendCommand(
                command
            );
        }
    );


    button.addEventListener(
        "pointerup",
        async function(event) {

            event.preventDefault();


            currentCommand =
                "S";


            await sendCommand(
                "S"
            );
        }
    );


    button.addEventListener(
        "pointercancel",
        async function() {

            currentCommand =
                "S";


            await sendCommand(
                "S"
            );
        }
    );
}


/* =====================================================
   ボタン登録
===================================================== */

setupMoveButton(
    "up",
    "U"
);


setupMoveButton(
    "down",
    "D"
);


setupMoveButton(
    "left",
    "L"
);


setupMoveButton(
    "right",
    "R"
);


/* =====================================================
   STOP
===================================================== */

document
.getElementById("stop")
.addEventListener(
    "pointerdown",
    async function(event) {

        event.preventDefault();


        currentCommand =
            "S";


        await sendCommand(
            "S"
        );
    }
);


/* =====================================================
   PING
===================================================== */

document
.getElementById("pingButton")
.addEventListener(
    "click",
    async function() {

        await sendCommand(
            "PING"
        );
    }
);


/* =====================================================
   TEST
===================================================== */

document
.getElementById("testButton")
.addEventListener(
    "click",
    async function() {

        await sendCommand(
            "TEST"
        );
    }
);


/* =====================================================
   MOTOR TEST
===================================================== */

document
.getElementById("motorTestButton")
.addEventListener(
    "click",
    async function() {

        await sendCommand(
            "MOTOR_TEST"
        );
    }
);


/* =====================================================
   キーボード
===================================================== */

const keyboardCommands = {

    ArrowUp: "U",

    ArrowDown: "D",

    ArrowLeft: "L",

    ArrowRight: "R"
};


document.addEventListener(
    "keydown",
    async function(event) {

        const command =
            keyboardCommands[
                event.key
            ];


        if (!command) {
            return;
        }


        event.preventDefault();


        if (event.repeat) {
            return;
        }


        currentCommand =
            command;


        await sendCommand(
            command
        );
    }
);


document.addEventListener(
    "keyup",
    async function(event) {

        const command =
            keyboardCommands[
                event.key
            ];


        if (!command) {
            return;
        }


        event.preventDefault();


        currentCommand =
            "S";


        await sendCommand(
            "S"
        );
    }
);


/* =====================================================
   起動
===================================================== */

updateStatus();


log(
    "================================"
);


log(
    "micro:bit Robot Controller"
);


log(
    "Bluetooth UART READY"
);


log(
    "USB SERIAL READY"
);


log(
    "Bluetooth優先モード"
);


log(
    "================================"
);

</script>

</body>

</html>
