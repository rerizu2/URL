<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>micro:bit Bluetooth ロボット</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #0b132b,
            #1c2541
        );

    color: white;
}

body {

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =========================================================
   メイン
========================================================= */

.container {

    width: 100%;
    max-width: 650px;

    height: 100%;
    max-height: 950px;

    padding: 15px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 10px;
}


/* =========================================================
   タイトル
========================================================= */

h1 {

    margin: 0;

    font-size: 28px;

    text-align: center;
}

.subtitle {

    font-size: 13px;

    opacity: 0.75;

    text-align: center;
}


/* =========================================================
   接続ボタン
========================================================= */

.connection {

    width: 100%;

    display: flex;

    gap: 8px;
}

.connect-button {

    flex: 1;

    border: none;

    border-radius: 12px;

    padding: 13px 8px;

    color: white;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;

    transition:
        transform 0.1s,
        opacity 0.1s;
}

.connect-button:active {

    transform: scale(0.96);

    opacity: 0.85;
}

.bluetooth-button {

    background: #2563eb;
}

.reconnect-button {

    background: #7c3aed;
}

.usb-button {

    background: #059669;
}


/* =========================================================
   状態
========================================================= */

.status {

    width: 100%;

    padding: 10px 14px;

    border-radius: 12px;

    background:
        rgba(0,0,0,0.25);

    border: 1px solid
        rgba(255,255,255,0.08);
}

.status-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 3px 0;

    font-size: 14px;
}

.connected {

    color: #4ade80;

    font-weight: bold;
}

.disconnected {

    color: #f87171;
}

.warning {

    color: #facc15;

    font-weight: bold;
}


/* =========================================================
   コントローラー
========================================================= */

.controller {

    width: min(88vw, 410px);

    aspect-ratio: 1 / 1;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    gap: 10px;
}


/* =========================================================
   操作ボタン
========================================================= */

.control {

    border: none;

    border-radius: 24px;

    background: #1e3a5f;

    color: white;

    font-size: 55px;

    font-weight: bold;

    cursor: pointer;

    touch-action: none;

    -webkit-tap-highlight-color:
        transparent;

    box-shadow:
        0 7px 0 #102a43,
        0 10px 20px
        rgba(0,0,0,0.3);

    transition:
        transform 0.03s,
        background 0.03s,
        box-shadow 0.03s;
}

.control.pressed {

    transform:
        translateY(7px);

    box-shadow:
        0 0 0 #102a43;

    background: #3b82f6;
}


/* =========================================================
   配置
========================================================= */

.up {

    grid-column: 2;
    grid-row: 1;
}

.left {

    grid-column: 1;
    grid-row: 2;
}

.stop {

    grid-column: 2;
    grid-row: 2;

    background: #991b1b;

    box-shadow:
        0 7px 0 #5f1111,
        0 10px 20px
        rgba(0,0,0,0.3);
}

.stop.pressed {

    background: #dc2626;

    box-shadow:
        0 0 0 #5f1111;
}

.right {

    grid-column: 3;
    grid-row: 2;
}

.down {

    grid-column: 2;
    grid-row: 3;
}


/* =========================================================
   最終操作
========================================================= */

.last-action {

    width: 100%;

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(0,0,0,0.25);

    text-align: center;

    font-size: 16px;

    font-weight: bold;
}


/* =========================================================
   ログ
========================================================= */

.log {

    width: 100%;

    height: 110px;

    overflow-y: auto;

    padding: 8px;

    border-radius: 10px;

    background: #050b18;

    color: #a5b4fc;

    font-family: monospace;

    font-size: 11px;

    white-space: pre-wrap;

    border: 1px solid
        rgba(255,255,255,0.05);
}


/* =========================================================
   スマートフォン
========================================================= */

@media (max-width: 500px) {

    .container {

        padding: 10px;

        gap: 7px;
    }

    h1 {

        font-size: 22px;
    }

    .subtitle {

        font-size: 11px;
    }

    .controller {

        width: min(92vw, 360px);

        gap: 7px;
    }

    .control {

        font-size: 43px;

        border-radius: 19px;
    }

    .connect-button {

        padding: 10px 4px;

        font-size: 11px;
    }

    .log {

        height: 65px;
    }
}


/* =========================================================
   横画面
========================================================= */

@media
(max-height: 600px)
and
(orientation: landscape) {

    .container {

        max-width: 850px;

        display: grid;

        grid-template-columns:
            1fr 1fr;

        grid-template-rows:
            auto auto 1fr auto;

        gap: 8px;
    }

    h1 {

        grid-column:
            1 / 3;
    }

    .subtitle {

        grid-column:
            1 / 3;
    }

    .connection {

        grid-column:
            1 / 3;
    }

    .status {

        grid-column: 1;

        grid-row: 4;
    }

    .controller {

        grid-column: 2;

        grid-row: 3 / 5;

        width:
            min(50vh, 360px);
    }

    .last-action {

        grid-column: 1;

        grid-row: 3;
    }

    .log {

        display: none;
    }
}

</style>

</head>


<body>


<div class="container">


<h1>
    🤖 micro:bit ロボット
</h1>


<div class="subtitle">

    USBは初回設定用・通常操作はBluetooth

</div>


<!-- =====================================================
     接続
===================================================== -->

<div class="connection">

    <button
        id="bluetoothButton"
        class="connect-button bluetooth-button"
    >
        📡 Bluetooth接続
    </button>


    <button
        id="reconnectButton"
        class="connect-button reconnect-button"
    >
        🔄 再接続
    </button>


    <button
        id="usbButton"
        class="connect-button usb-button"
    >
        🔌 初回USB
    </button>

</div>


<!-- =====================================================
     状態
===================================================== -->

<div class="status">


    <div class="status-row">

        <span>
            Bluetooth
        </span>

        <span
            id="bluetoothStatus"
            class="disconnected"
        >
            未接続
        </span>

    </div>


    <div class="status-row">

        <span>
            USB
        </span>

        <span
            id="usbStatus"
            class="disconnected"
        >
            未接続
        </span>

    </div>


    <div class="status-row">

        <span>
            モード
        </span>

        <span
            id="modeStatus"
        >
            Bluetooth待機
        </span>

    </div>


</div>


<!-- =====================================================
     コントローラー
===================================================== -->

<div class="controller">


    <button
        id="up"
        class="control up"
        aria-label="前進"
    >
        ↑
    </button>


    <button
        id="left"
        class="control left"
        aria-label="左"
    >
        ←
    </button>


    <button
        id="stop"
        class="control stop"
        aria-label="停止"
    >
        ■
    </button>


    <button
        id="right"
        class="control right"
        aria-label="右"
    >
        →
    </button>


    <button
        id="down"
        class="control down"
        aria-label="後退"
    >
        ↓
    </button>


</div>


<div
    id="lastAction"
    class="last-action"
>
    操作なし
</div>


<div
    id="log"
    class="log"
>
起動しました
Bluetooth待機中
</div>


</div>


<script>


/* =========================================================
   Nordic UART Service
========================================================= */

/*
 * micro:bit / Nordic UART Service
 *
 * Web → micro:bit
 * RX characteristic = 002
 *
 * micro:bit → Web
 * TX characteristic = 003
 */

const UART_SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";


const UART_RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


const UART_TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/* =========================================================
   Bluetooth
========================================================= */

let bluetoothDevice = null;

let bluetoothServer = null;

let bluetoothService = null;

let bluetoothRX = null;

let bluetoothTX = null;


/* =========================================================
   USB
========================================================= */

let serialPort = null;

let serialWriter = null;

let serialReader = null;


/* =========================================================
   操作状態
========================================================= */

let activeCommand = null;

let activeButton = null;


/* =========================================================
   DOM
========================================================= */

const bluetoothButton =
    document.getElementById(
        "bluetoothButton"
    );


const reconnectButton =
    document.getElementById(
        "reconnectButton"
    );


const usbButton =
    document.getElementById(
        "usbButton"
    );


const bluetoothStatus =
    document.getElementById(
        "bluetoothStatus"
    );


const usbStatus =
    document.getElementById(
        "usbStatus"
    );


const modeStatus =
    document.getElementById(
        "modeStatus"
    );


const lastAction =
    document.getElementById(
        "lastAction"
    );


const logElement =
    document.getElementById(
        "log"
    );


/* =========================================================
   ログ
========================================================= */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent =
        `[${time}] ${message}\n` +
        logElement.textContent;
}


/* =========================================================
   Bluetooth状態表示
========================================================= */

function setBluetoothConnected() {

    bluetoothStatus.textContent =
        "接続済み";

    bluetoothStatus.className =
        "connected";

    bluetoothButton.textContent =
        "📡 Bluetooth切断";

    modeStatus.textContent =
        "Bluetooth操作";
}


function setBluetoothDisconnected() {

    bluetoothStatus.textContent =
        "未接続";

    bluetoothStatus.className =
        "disconnected";

    bluetoothButton.textContent =
        "📡 Bluetooth接続";

    modeStatus.textContent =
        "Bluetooth待機";
}


/* =========================================================
   Bluetooth接続
========================================================= */

async function connectBluetooth(
    useExistingDevice = false
) {

    try {

        if (!navigator.bluetooth) {

            throw new Error(
                "このブラウザはWeb Bluetoothに対応していません"
            );
        }


        /*
         * -------------------------------------------------
         * 一度許可したデバイスを探す
         * -------------------------------------------------
         */

        if (
            useExistingDevice &&
            typeof navigator.bluetooth.getDevices ===
                "function"
        ) {

            log(
                "以前許可したBluetoothデバイスを検索中..."
            );


            const devices =
                await navigator.bluetooth.getDevices();


            const existing =
                devices.find(
                    device =>
                        device.name &&
                        (
                            device.name
                                .toLowerCase()
                                .includes("micro")
                            ||
                            device.name
                                .toLowerCase()
                                .includes("bit")
                        )
                );


            if (existing) {

                bluetoothDevice =
                    existing;

                log(
                    "以前のmicro:bitを発見: " +
                    (
                        bluetoothDevice.name ||
                        "名称なし"
                    )
                );

            }

        }


        /*
         * -------------------------------------------------
         * 以前のデバイスがなければ選択画面
         * -------------------------------------------------
         */

        if (!bluetoothDevice) {

            log(
                "Bluetoothデバイス検索開始"
            );


            bluetoothDevice =
                await navigator.bluetooth.requestDevice({

                    filters: [
                        {
                            services: [
                                UART_SERVICE_UUID
                            ]
                        }
                    ],

                    optionalServices: [
                        UART_SERVICE_UUID
                    ]

                });


            log(
                "デバイス発見: " +
                (
                    bluetoothDevice.name ||
                    "名称なし"
                )
            );
        }


        /*
         * -------------------------------------------------
         * 切断イベント
         * -------------------------------------------------
         */

        bluetoothDevice.removeEventListener(
            "gattserverdisconnected",
            bluetoothDisconnected
        );


        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            bluetoothDisconnected
        );


        /*
         * -------------------------------------------------
         * GATT接続
         * -------------------------------------------------
         */

        log(
            "Bluetooth GATT接続中..."
        );


        bluetoothServer =
            await bluetoothDevice.gatt.connect();


        log(
            "GATT接続成功"
        );


        /*
         * -------------------------------------------------
         * Service
         * -------------------------------------------------
         */

        bluetoothService =
            await bluetoothServer.getPrimaryService(
                UART_SERVICE_UUID
            );


        log(
            "UART Service取得成功"
        );


        /*
         * -------------------------------------------------
         * RX
         *
         * Web → micro:bit
         *
         * 002
         * -------------------------------------------------
         */

        bluetoothRX =
            await bluetoothService.getCharacteristic(
                UART_RX_UUID
            );


        log(
            "UART RX取得成功"
        );


        /*
         * -------------------------------------------------
         * TX
         *
         * micro:bit → Web
         *
         * 003
         * -------------------------------------------------
         */

        try {

            bluetoothTX =
                await bluetoothService.getCharacteristic(
                    UART_TX_UUID
                );


            await bluetoothTX.startNotifications();


            bluetoothTX.addEventListener(
                "characteristicvaluechanged",
                receiveBluetooth
            );


            log(
                "UART TX通知開始"
            );

        } catch (error) {

            bluetoothTX = null;

            log(
                "TX通知は使用できません"
            );
        }


        setBluetoothConnected();


        log(
            "Bluetooth接続完了"
        );


        /*
         * 通信テスト
         */

        await sendBluetooth(
            "TEST"
        );


    } catch (error) {

        console.error(error);


        bluetoothRX = null;

        bluetoothTX = null;

        bluetoothService = null;

        bluetoothServer = null;


        setBluetoothDisconnected();


        log(
            "Bluetooth接続エラー: " +
            error.message
        );


        if (
            error.message.includes(
                "No Services matching UUID"
            )
        ) {

            log(
                "UART Serviceが見つかりません"
            );

            log(
                "micro:bit側のBluetooth UARTを確認してください"
            );
        }
    }
}


/* =========================================================
   Bluetooth再接続
========================================================= */

async function reconnectBluetooth() {

    /*
     * すでに接続されている
     */

    if (
        bluetoothDevice &&
        bluetoothDevice.gatt &&
        bluetoothDevice.gatt.connected
    ) {

        log(
            "すでにBluetooth接続されています"
        );

        return;
    }


    bluetoothDevice = null;


    await connectBluetooth(
        true
    );
}


/* =========================================================
   Bluetooth受信
========================================================= */

function receiveBluetooth(event) {

    try {

        const decoder =
            new TextDecoder();


        const text =
            decoder.decode(
                event.target.value
            );


        log(
            "micro:bit → Bluetooth : " +
            text.trim()
        );


    } catch (error) {

        console.error(error);
    }
}


/* =========================================================
   Bluetooth切断
========================================================= */

function bluetoothDisconnected() {

    bluetoothRX = null;

    bluetoothTX = null;

    bluetoothService = null;

    bluetoothServer = null;


    setBluetoothDisconnected();


    removePressed();


    activeCommand = null;

    activeButton = null;


    log(
        "Bluetooth切断"
    );
}


/* =========================================================
   Bluetooth接続ボタン
========================================================= */

bluetoothButton.addEventListener(
    "click",
    async function() {

        if (
            bluetoothDevice &&
            bluetoothDevice.gatt &&
            bluetoothDevice.gatt.connected
        ) {

            try {

                await sendBluetooth(
                    "S"
                );

            } catch (e) {}


            try {

                bluetoothDevice.gatt.disconnect();

            } catch (e) {}

        } else {

            await connectBluetooth(
                false
            );
        }
    }
);


/* =========================================================
   再接続ボタン
========================================================= */

reconnectButton.addEventListener(
    "click",
    async function() {

        await reconnectBluetooth();

    }
);


/* =========================================================
   Bluetooth送信
========================================================= */

async function sendBluetooth(
    command
) {

    if (
        !bluetoothRX
    ) {

        return false;
    }


    try {

        /*
         * 接続確認
         */

        if (
            !bluetoothDevice ||
            !bluetoothDevice.gatt ||
            !bluetoothDevice.gatt.connected
        ) {

            return false;
        }


        const data =
            new TextEncoder().encode(
                command + "\n"
            );


        /*
         * writeValueWithResponse
         */

        if (
            typeof
            bluetoothRX.writeValueWithResponse
            ===
            "function"
        ) {

            await bluetoothRX.writeValueWithResponse(
                data
            );

        } else {

            await bluetoothRX.writeValue(
                data
            );
        }


        log(
            "Web → Bluetooth : " +
            command
        );


        return true;


    } catch (error) {

        log(
            "Bluetooth送信エラー: " +
            error.message
        );


        return false;
    }
}


/* =========================================================
   USB初回接続
========================================================= */

async function connectUSB() {

    try {

        if (
            !("serial" in navigator)
        ) {

            throw new Error(
                "Web Serial APIが利用できません"
            );
        }


        log(
            "初回USBデバイス選択"
        );


        serialPort =
            await navigator.serial.requestPort();


        await serialPort.open({

            baudRate: 115200

        });


        serialWriter =
            serialPort.writable.getWriter();


        usbStatus.textContent =
            "接続済み";

        usbStatus.className =
            "connected";


        usbButton.textContent =
            "🔌 USB切断";


        log(
            "USB接続成功"
        );


        modeStatus.textContent =
            "初回USB確認";


        readUSB();


        /*
         * USB通信テスト
         */

        await sendUSB(
            "TEST"
        );


    } catch (error) {

        console.error(error);


        log(
            "USB接続エラー: " +
            error.message
        );


        serialPort = null;

        serialWriter = null;
    }
}


/* =========================================================
   USB受信
========================================================= */

async function readUSB() {

    if (
        !serialPort ||
        !serialPort.readable
    ) {

        return;
    }


    serialReader =
        serialPort.readable.getReader();


    const decoder =
        new TextDecoder();


    try {

        while (true) {

            const result =
                await serialReader.read();


            if (result.done) {

                break;
            }


            if (result.value) {

                log(
                    "micro:bit → USB : " +
                    decoder
                        .decode(
                            result.value
                        )
                        .trim()
                );
            }
        }


    } catch (error) {

        console.error(error);


    } finally {

        try {

            serialReader.releaseLock();

        } catch (e) {}


        serialReader = null;
    }
}


/* =========================================================
   USB送信
========================================================= */

async function sendUSB(
    command
) {

    if (
        !serialWriter
    ) {

        return false;
    }


    try {

        const data =
            new TextEncoder().encode(
                command + "\n"
            );


        await serialWriter.write(
            data
        );


        log(
            "Web → USB : " +
            command
        );


        return true;


    } catch (error) {

        log(
            "USB送信エラー: " +
            error.message
        );


        return false;
    }
}


/* =========================================================
   USB切断
========================================================= */

async function disconnectUSB() {

    try {

        /*
         * 停止
         */

        if (serialWriter) {

            try {

                await sendUSB(
                    "S"
                );

            } catch (e) {}
        }


        /*
         * Reader停止
         */

        if (serialReader) {

            try {

                await serialReader.cancel();

            } catch (e) {}
        }


        /*
         * Writer解除
         */

        if (serialWriter) {

            try {

                serialWriter.releaseLock();

            } catch (e) {}

            serialWriter = null;
        }


        /*
         * Portを閉じる
         */

        if (serialPort) {

            try {

                await serialPort.close();

            } catch (e) {}

            serialPort = null;
        }


        usbStatus.textContent =
            "未接続";

        usbStatus.className =
            "disconnected";


        usbButton.textContent =
            "🔌 初回USB";


        modeStatus.textContent =
            bluetoothRX
                ? "Bluetooth操作"
                : "Bluetooth待機";


        log(
            "USB切断"
        );


        log(
            "USBは初回接続用です"
        );


    } catch (error) {

        log(
            "USB切断エラー"
        );
    }
}


/* =========================================================
   USBボタン
========================================================= */

usbButton.addEventListener(
    "click",
    async function() {

        if (serialPort) {

            await disconnectUSB();

        } else {

            await connectUSB();

        }
    }
);


/* =========================================================
   共通送信
========================================================= */

async function sendCommand(
    command
) {

    /*
     * -------------------------------------------------
     * Bluetoothのみを通常操作に使用
     * -------------------------------------------------
     */

    const bluetoothAvailable =
        bluetoothRX !== null &&
        bluetoothDevice &&
        bluetoothDevice.gatt &&
        bluetoothDevice.gatt.connected;


    /*
     * USBは「初回確認」のためだけ
     *
     * 通常操作ではUSBへ送らない
     */

    if (!bluetoothAvailable) {

        log(
            "Bluetoothが接続されていません"
        );

        return false;
    }


    const success =
        await sendBluetooth(
            command
        );


    /*
     * 表示
     */

    const names = {

        U: "↑ 前進",

        D: "↓ 後退",

        L: "← 左",

        R: "→ 右",

        S: "■ 停止"

    };


    lastAction.textContent =
        names[command] ||
        command;


    return success;
}


/* =========================================================
   押されているボタン解除
========================================================= */

function removePressed() {

    document
        .querySelectorAll(
            ".control.pressed"
        )
        .forEach(
            function(button) {

                button.classList.remove(
                    "pressed"
                );
            }
        );
}


/* =========================================================
   移動開始
========================================================= */

function startMoving(
    command,
    button,
    event
) {

    event.preventDefault();


    if (
        activeCommand === command
    ) {

        return;
    }


    /*
     * 他方向を停止
     */

    if (
        activeCommand !== null
    ) {

        sendCommand(
            "S"
        );
    }


    removePressed();


    activeCommand =
        command;

    activeButton =
        button;


    /*
     * Pointer Capture
     */

    try {

        button.setPointerCapture(
            event.pointerId
        );

    } catch (e) {}


    button.classList.add(
        "pressed"
    );


    /*
     * Bluetoothへ送信
     */

    sendCommand(
        command
    );
}


/* =========================================================
   移動停止
========================================================= */

function stopMoving(
    button,
    event
) {

    if (event) {

        event.preventDefault();
    }


    if (
        activeCommand === null
    ) {

        return;
    }


    removePressed();


    activeButton = null;

    activeCommand = null;


    sendCommand(
        "S"
    );
}


/* =========================================================
   操作ボタン登録
========================================================= */

function setupMoveButton(
    id,
    command
) {

    const button =
        document.getElementById(
            id
        );


    /*
     * 押した
     */

    button.addEventListener(
        "pointerdown",
        function(event) {

            startMoving(
                command,
                button,
                event
            );
        }
    );


    /*
     * 離した
     */

    button.addEventListener(
        "pointerup",
        function(event) {

            stopMoving(
                button,
                event
            );
        }
    );


    /*
     * キャンセル
     */

    button.addEventListener(
        "pointercancel",
        function(event) {

            stopMoving(
                button,
                event
            );
        }
    );


    /*
     * Pointer Capture解除
     */

    button.addEventListener(
        "lostpointercapture",
        function() {

            if (
                activeButton === button &&
                activeCommand !== null
            ) {

                stopMoving(
                    button,
                    null
                );
            }
        }
    );


    /*
     * マウス右クリック禁止
     */

    button.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();
        }
    );
}


/* =========================================================
   移動ボタン登録
========================================================= */

setupMoveButton(
    "up",
    "U"
);


setupMoveButton(
    "down",
    "D"
);


setupMoveButton(
    "left",
    "L"
);


setupMoveButton(
    "right",
    "R"
);


/* =========================================================
   STOP
========================================================= */

const stopButton =
    document.getElementById(
        "stop"
    );


stopButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();


        removePressed();


        activeButton = null;

        activeCommand = null;


        stopButton.classList.add(
            "pressed"
        );


        sendCommand(
            "S"
        );
    }
);


stopButton.addEventListener(
    "pointerup",
    function() {

        stopButton.classList.remove(
            "pressed"
        );
    }
);


/* =========================================================
   キーボード
========================================================= */

const keyboardCommands = {

    ArrowUp: [
        "U",
        "up"
    ],

    ArrowDown: [
        "D",
        "down"
    ],

    ArrowLeft: [
        "L",
        "left"
    ],

    ArrowRight: [
        "R",
        "right"
    ]

};


document.addEventListener(
    "keydown",
    function(event) {

        const data =
            keyboardCommands[
                event.key
            ];


        if (!data) {

            return;
        }


        event.preventDefault();


        /*
         * キーリピート無視
         */

        if (event.repeat) {

            return;
        }


        const button =
            document.getElementById(
                data[1]
            );


        startMoving(
            data[0],
            button,
            event
        );
    }
);


document.addEventListener(
    "keyup",
    function(event) {

        const data =
            keyboardCommands[
                event.key
            ];


        if (!data) {

            return;
        }


        event.preventDefault();


        const button =
            document.getElementById(
                data[1]
            );


        stopMoving(
            button,
            event
        );
    }
);


/* =========================================================
   ページから離れた
========================================================= */

window.addEventListener(
    "blur",
    function() {

        if (
            activeCommand !== null
        ) {

            removePressed();

            activeButton = null;

            activeCommand = null;

            sendCommand(
                "S"
            );
        }
    }
);


/* =========================================================
   タブを切り替えた
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {

            removePressed();


            if (
                activeCommand !== null
            ) {

                activeButton = null;

                activeCommand = null;

                sendCommand(
                    "S"
                );
            }
        }
    }
);


/* =========================================================
   ページ終了
========================================================= */

window.addEventListener(
    "beforeunload",
    function() {

        try {

            sendCommand(
                "S"
            );

        } catch (e) {}
    }
);


/* =========================================================
   USBが物理的に抜かれた場合
========================================================= */

if (
    "serial" in navigator
) {

    navigator.serial.addEventListener(
        "disconnect",
        function(event) {

            if (
                serialPort === event.target
            ) {

                serialPort = null;

                serialWriter = null;

                serialReader = null;


                usbStatus.textContent =
                    "未接続";

                usbStatus.className =
                    "disconnected";


                usbButton.textContent =
                    "🔌 初回USB";


                log(
                    "USBが抜かれました"
                );


                /*
                 * Bluetoothはそのまま使用
                 */

                if (
                    bluetoothDevice &&
                    bluetoothDevice.gatt &&
                    bluetoothDevice.gatt.connected
                ) {

                    modeStatus.textContent =
                        "Bluetooth操作";

                    log(
                        "Bluetooth操作を継続します"
                    );

                } else {

                    modeStatus.textContent =
                        "Bluetooth待機";
                }
            }
        }
    );
}


/* =========================================================
   起動
========================================================= */

log(
    "コントローラー起動"
);

log(
    "USBは初回確認用"
);

log(
    "通常操作はBluetooth"
);


/*
 * 以前許可したmicro:bitが存在するか確認
 */

(async function() {

    if (
        navigator.bluetooth &&
        typeof navigator.bluetooth.getDevices ===
            "function"
    ) {

        try {

            const devices =
                await navigator.bluetooth.getDevices();


            const microbit =
                devices.find(
                    device =>
                        device.name &&
                        (
                            device.name
                                .toLowerCase()
                                .includes("micro")
                            ||
                            device.name
                                .toLowerCase()
                                .includes("bit")
                        )
                );


            if (microbit) {

                log(
                    "以前許可したmicro:bitを検出しました"
                );

                log(
                    "「再接続」を押してください"
                );
            }

        } catch (error) {

            console.log(error);
        }
    }

})();

</script>
