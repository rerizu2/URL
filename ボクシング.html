<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ボクシングタイム記録 (OCR & GAS連動)</title>
    <!-- ライブラリ読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style id="dynamic-print-style"></style>
    <style>
        /* --- デザイン設定 --- */
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f0f2f5; --pdf-header: #b2ffff; --success: #10b981; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 15px; }
        
        /* 写真解析エリア */
        .ocr-area { background: #ecfdf5; border: 2px dashed var(--success); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .ocr-loader { display: none; margin-top: 10px; color: #059669; font-weight: bold; }

        /* 記録表 */
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; background: #fff; table-layout: fixed; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px 2px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-table input { width: 95%; border: none; text-align: center; font-size: 13px; background: transparent; }
        
        .col-name { width: 130px; text-align: left !important; padding-left: 5px !important; font-weight: bold; }
        .col-rank { width: 30px; color: var(--primary); font-weight: bold; font-size: 11px; }
        .lap-edit { width: 35px !important; border: 1px solid #ccc !important; background: #fff !important; color: var(--primary); font-weight: bold; border-radius: 3px; }

        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn-send:disabled { background: #ccc; }
        .print-btn { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* --- 印刷設定 --- */
        @media print {
            @page { margin: 3mm; size: A4 landscape; }
            body { background: white; padding: 0; }
            .no-print, .ocr-area, button, .lap-edit, .no-print-area { display: none !important; }
            .card { box-shadow: none; border: none; padding: 0; margin-bottom: 5px; }
            .pdf-table { width: 100% !important; min-width: 100% !important; }
            .pdf-table th, .pdf-table td { font-size: 9px !important; padding: 1px !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card no-print no-print-area" style="display:flex; gap:15px; align-items:center;">
        <div style="font-weight:bold;">印刷設定:</div>
        <label><input type="checkbox" id="check-graph" checked onchange="toggleSec('section-graph', this)"> グラフ</label>
        <label><input type="checkbox" id="check-rank" checked onchange="toggleSec('section-rank', this)"> ランキング</label>
        <button class="print-btn" onclick="window.print()">印刷・PDF保存</button>
    </div>

    <!-- 1. 写真読み取りエリア -->
    <div class="ocr-area no-print">
        <h2 style="margin:0 0 10px 0; font-size:16px; color:#065f46;">📸 写真から表を自動入力</h2>
        <p style="margin:0 0 10px 0; font-size:11px;">表を撮影した写真をアップロードしてください。名簿と照らし合わせて自動入力します。</p>
        <input type="file" id="imageInput" accept="image/*">
        <div id="ocr-status" style="margin-top:10px; font-weight:bold; color:#059669;"></div>
        <div id="ocr-loader" class="ocr-loader">解析中: <span id="progress">0</span>%</div>
    </div>

    <div class="dashboard-grid">
        <!-- 左：サイドバー -->
        <div class="card no-print">
            <div style="font-size:10px; color:var(--success); font-weight:bold; margin-bottom:5px;">● スプレッドシート同期中</div>
            <label style="font-weight:bold;">履歴選択</label>
            <select id="dateHistory" onchange="syncDateAndLoad()" style="width:100%; padding:8px; margin-bottom:10px;"><option value="">-- 読込中 --</option></select>
            <input type="date" id="recordDate" onchange="onDateChange()" style="width:100%; padding:8px; margin-bottom:15px;">
            <hr>
            <h2 style="font-size:14px;">選手名簿</h2>
            <textarea id="memberList" style="width:100%; height:150px; font-size:11px;"></textarea>
            <button onclick="applyMembers()" style="width:100%; padding:8px; background:#6c757d; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-top:5px;">名簿更新</button>
        </div>

        <!-- 右：分析エリア -->
        <div class="card">
            <div id="section-graph" style="height:300px;">
                <canvas id="runChart"></canvas>
            </div>
            <div id="section-rank" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
                <div style="background:#f8fafc; padding:10px; border-radius:8px;">
                    <h3 style="margin:0; font-size:11px; text-align:center;">🏆 2周ベストタイム</h3>
                    <div id="rankLaps2" style="font-size:11px;"></div>
                </div>
                <div style="background:#f8fafc; padding:10px; border-radius:8px;">
                    <h3 style="margin:0; font-size:11px; text-align:center;">🏆 1周ベストタイム</h3>
                    <div id="rankLaps1" style="font-size:11px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 記録表 -->
    <div class="card" id="section-table">
        <div style="overflow-x: auto;">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th class="col-name">氏名</th>
                        <th class="col-time">1本目(<input type="number" class="lap-edit" id="lap-1" value="2">周)</th><th class="col-rank">順</th>
                        <th class="col-time">2本目(<input type="number" class="lap-edit" id="lap-2" value="2">周)</th><th class="col-rank">順</th>
                        <th class="col-time">3本目(<input type="number" class="lap-edit" id="lap-3" value="1">周)</th><th class="col-rank">順</th>
                        <th class="col-time">4本目(<input type="number" class="lap-edit" id="lap-4" value="1">周)</th><th class="col-rank">順</th>
                        <th class="col-time">5本目(<input type="number" class="lap-edit" id="lap-5" value="1">周)</th><th class="col-rank">順</th>
                        <th class="col-time">追加(<input type="number" class="lap-edit" id="lap-6" value="1">周)</th><th class="col-rank">順</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveToSheet()">スプレッドシートに保存</button>
    </div>
</div>

<script>
    // --- 重要：GASのウェブアプリURLをここに貼り付けてください ---
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwQatmySaZpBIMes0aRYcHzlFxep57jqRq0015NK5mLQjZxVOuxHCeHaInvnf-8l5CzQg/exec"; 

    const PERMANENT_MEMBERS = "石橋 乃蒼\n川﨑 輝寅\n上窪 聖\n大畑 歩希\n志冨田 凪大\n亀本 快歩\n松嶋 虎鉄\n今井 仁\n岡田 陸翔\n濱田 周摩\n日高 心太\n井上 暁仁\n今中 悠人\n惣田 湧大\n髙峯 将真\n西岡 泰志\n福貴田 泰生\n栗原 翔\n岩原 晴斗\n杉阪 咲太\n安藤 心咲\n大西 義一\n岸上 虎央\n南 悠翔\n石橋 奈樹\n志冨田 明陽\n木下 一颯\n道下 大翔\n柏木 羽空";
    
    let chart;
    let allSheetData = [];

    window.onload = async () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || PERMANENT_MEMBERS;
        applyMembers();
        initChart();
        initOCR();
        await fetchDateHistory();
        await fetchAllData();
        await loadDateData();
    };

    // --- OCR (写真解析) ---
    function initOCR() {
        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const status = document.getElementById('ocr-status');
            const loader = document.getElementById('ocr-loader');
            const progress = document.getElementById('progress');
            
            status.innerText = "画像を解析中..."; loader.style.display = "block";

            try {
                const worker = await Tesseract.createWorker('jpn');
                const ret = await worker.recognize(file, {}, {
                    onProgress: m => { if(m.status === 'recognizing text') progress.innerText = Math.floor(m.progress * 100); }
                });
                await worker.terminate();
                processOCRResult(ret.data.text);
                status.innerText = "解析完了しました。"; loader.style.display = "none";
            } catch (err) {
                status.innerText = "解析失敗。文字がはっきり写った写真で試してください。"; loader.style.display = "none";
            }
        });
    }

    function processOCRResult(text) {
        const rows = document.getElementById('pdfTableBody').rows;
        const lines = text.split('\n');
        lines.forEach(line => {
            for (let r = 0; r < rows.length; r++) {
                const name = rows[r].cells[0].innerText.trim();
                if (line.includes(name)) {
                    const times = line.match(/(\d[:：\.]\d{2}|\d{3,4})/g);
                    if (times) {
                        times.forEach((t, i) => {
                            if (i < 6) {
                                let val = t.replace(/[：\.]/g, ':');
                                if (/^\d{3,4}$/.test(val)) val = val.slice(0, -2) + ":" + val.slice(-2);
                                const input = rows[r].cells[(i + 1) * 2 - 1].querySelector('input');
                                input.value = val;
                            }
                        });
                    }
                    break;
                }
            }
        });
        for (let i = 1; i <= 6; i++) calcRanks(i);
        updateGraph();
    }

    // --- GAS通信 ---
    async function saveToSheet() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('pdfTableBody').rows;
        const memberList = document.getElementById('memberList').value;
        
        btn.disabled = true; btn.innerText = "保存中...";

        let countSaved = 0;
        for (let r = 0; r < rows.length; r++) {
            const name = rows[r].cells[0].innerText;
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c * 2 - 1].querySelector('input');
                const time = input.value.trim();
                if (!time) continue;

                const payload = {
                    date: date,
                    name: name,
                    count: ["1本目", "2本目", "3本目", "4本目", "5本目", "追加"][c-1],
                    laps: document.getElementById(`lap-${c}`).value,
                    time: time,
                    rank: rows[r].cells[c * 2].innerText,
                    memberList: memberList
                };

                try {
                    await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    countSaved++;
                } catch (e) { console.error(e); }
            }
        }
        alert(countSaved + "件のデータをスプレッドシートに保存しました");
        btn.disabled = false; btn.innerText = "スプレッドシートに保存";
        await fetchAllData();
    }

    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            // 表を一旦クリア
            document.querySelectorAll('#pdfTableBody input').forEach(i => i.value = '');
            document.querySelectorAll('.col-rank').forEach(r => { if(r.cellIndex !== 0) r.innerText = '-'; });

            if (result.found) {
                const rows = document.getElementById('pdfTableBody').rows;
                const data = result.data; // DisplayValues配列
                for (let i = 1; i < data.length; i++) {
                    const sheetName = data[i][0];
                    for (let r = 0; r < rows.length; r++) {
                        if (rows[r].cells[0].innerText.trim() === sheetName.trim()) {
                            for (let c = 1; c <= 6; c++) {
                                rows[r].cells[c*2-1].querySelector('input').value = data[i][c*2-1] || '';
                                rows[r].cells[c*2].innerText = data[i][c*2] || '-';
                            }
                            break;
                        }
                    }
                }
            }
        } catch (e) { console.error(e); }
        updateGraph();
    }

    async function fetchDateHistory() {
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?mode=listDates`);
            const dates = await res.json();
            const select = document.getElementById('dateHistory');
            select.innerHTML = '<option value="">-- 練習履歴を選択 --</option>';
            dates.forEach(d => select.add(new Option(d, d)));
        } catch (e) {}
    }

    async function fetchAllData() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(GAS_WEBAPP_URL);
            allSheetData = await res.json();
            updateGraph();
            renderRanking();
        } catch (e) {}
    }

    // --- 基本ロジック ---
    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        tbody.innerHTML = '';
        ms.forEach(m => {
            if(!m.trim()) return;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-name">${m.trim()}</td>` +
                           Array(6).fill(0).map((_,i) => `<td class="col-time"><input type="text" oninput="calcRanks(${i+1})" onblur="formatInput(this, ${i+1})"></td><td class="col-rank">-</td>`).join('');
            tbody.appendChild(tr);
        });
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
    }

    function formatInput(el, colIdx) {
        let v = el.value.trim();
        if (/^\d{3,4}$/.test(v)) el.value = v.slice(0, -2) + ":" + v.slice(-2);
        calcRanks(colIdx);
        updateGraph();
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const val = rows[i].cells[colIdx * 2 - 1].querySelector('input').value.trim();
            if(val) times.push({ rowIndex: i, sec: t2s(val) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, idx) => { rows[t.rowIndex].cells[colIdx * 2].innerText = idx + 1; });
    }

    function t2s(v){
        if(!v || !v.includes(':')) return 0;
        const p = v.split(':');
        return (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0);
    }

    function s2t(s) {
        return Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2, '0');
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true, ticks: { callback: v => s2t(v) } } } } });
    }

    function updateGraph() {
        const curDay = document.getElementById('recordDate').value;
        const dataMap = {}; const labelSet = new Set();
        const currentData = [];
        const rows = document.getElementById('pdfTableBody').rows;
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const val = rows[r].cells[c * 2 - 1].querySelector('input').value;
                if (val) currentData.push({ date: curDay, name: rows[r].cells[0].innerText, count: ["1本目", "2本目", "3本目", "4本目", "5本目", "追加"][c-1], time: val });
            }
        }
        allSheetData.concat(currentData).forEach(r => {
            if (r.date !== curDay) return;
            labelSet.add(r.count);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][r.count] = t2s(r.time);
        });
        const sortedLabels = Array.from(labelSet).sort();
        chart.data.labels = sortedLabels;
        chart.data.datasets = Object.keys(dataMap).map((name, i) => ({
            label: name, data: sortedLabels.map(l => dataMap[name][l] || null),
            borderColor: `hsl(${(i * 60) % 360}, 70%, 50%)`, tension: 0.3, fill: false, spanGaps: true
        }));
        chart.update();
    }

    function renderRanking() {
        let pBest2 = {}; let pBest1 = {};
        allSheetData.forEach(r => {
            const sec = t2s(r.time);
            if (sec === 0) return;
            if (r.laps == "2") { if (!pBest2[r.name] || sec < pBest2[r.name]) pBest2[r.name] = sec; }
            else if (r.laps == "1") { if (!pBest1[r.name] || sec < pBest1[r.name]) pBest1[r.name] = sec; }
        });
        const draw = (id, obj) => {
            const arr = Object.entries(obj).sort((a,b) => a[1]-b[1]).slice(0,5);
            document.getElementById(id).innerHTML = arr.map((x,i) => `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:2px 0;"><span>${i+1}. ${x[0]}</span><b>${s2t(x[1])}</b></div>`).join('') || 'データなし';
        };
        draw('rankLaps2', pBest2); draw('rankLaps1', pBest1);
    }

    function syncDateAndLoad() { const d = document.getElementById('dateHistory').value; if(d) { document.getElementById('recordDate').value = d; loadDateData(); } }
    function onDateChange() { loadDateData(); }
    function toggleSec(id, el) { document.getElementById(id).style.display = el.checked ? '' : 'none'; }
</script>
</body>
</html>
