<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Boxing Tracker - Full Sync Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f4f7f9; --pdf-header: #b2ffff; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 15px; }
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; background: #fff; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 4px; text-align: center; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-table input { width: 60px; border: none; text-align: center; font-size: 13px; background: transparent; padding: 5px 0; }
        .rank-col { width: 35px; color: var(--primary); font-weight: bold; font-size: 11px; }
        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 10px; }
        .chart-container { height: 400px; position: relative; }
        .setting-section { margin-bottom: 15px; }
        .setting-section label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--secondary); }
        .setting-section select, .setting-section input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .filter-box { display: flex; gap: 10px; align-items: center; background: #f1f5f9; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .filter-box label { font-weight: bold; color: var(--secondary); font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-grid">
        <!-- 左：設定パネル -->
        <div class="card">
            <div class="setting-section">
                <label>表の日付を選択（履歴から）</label>
                <select id="dateHistory" onchange="syncDateAndGraph()"><option value="">-- 読込中 --</option></select>
            </div>
            <div class="setting-section">
                <label>またはカレンダーから選択</label>
                <input type="date" id="recordDate" onchange="loadDateData(); updateGraph();">
            </div>
            <hr>
            <h2>選手名簿</h2>
            <textarea id="memberList" style="width:100%; height:120px; font-size:11px; margin-bottom:5px;"></textarea>
            <button onclick="applyMembers()" style="width:100%; padding:8px; background:#6c757d; color:#fff; border:none; border-radius:4px; font-size:11px;">名簿更新</button>
        </div>

        <!-- 右：グラフエリア -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                <h2>成長・当日分析グラフ</h2>
                <div class="filter-box">
                    <label>選手:</label>
                    <select id="filterSelect" onchange="updateGraph()"><option value="all">全員表示</option></select>
                    <button onclick="resetGraph()" style="font-size:10px; padding:2px 5px; cursor:pointer;">全履歴を表示</button>
                </div>
            </div>
            <div class="chart-container"><canvas id="runChart"></canvas></div>
        </div>
    </div>

    <!-- 入力表 -->
    <div class="card">
        <div style="font-size:11px; color:#10b981; font-weight:bold; margin-bottom:5px;">● スプレッドシート同期モード（5:00 形式）</div>
        <div style="overflow-x: auto;">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th style="width:140px;">氏名</th>
                        <th>1本目</th><th class="rank-col">順位</th>
                        <th>2本目</th><th class="rank-col">順位</th>
                        <th>3本目</th><th class="rank-col">順位</th>
                        <th>4本目</th><th class="rank-col">順位</th>
                        <th>5本目</th><th class="rank-col">順位</th>
                        <th>追加</th><th class="rank-col">順位</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">スプレッドシートへ送信・同期保存</button>
    </div>
</div>

<script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyCP5i8WPZT3kviJ4tkZ0a2Dd9pQuQyoo4aIgVxW_54HLGlQEqXh0wQsMwxC-ZXAvh7jg/exec"; 
    const PERMANENT_MEMBERS = "石橋 乃蒼\n川﨑 輝寅\n上窪 聖\n大畑 歩希\n志冨田 凪大\n亀本 快歩\n松嶋 虎鉄\n今井 仁\n岡田 陸翔\n濱田 周摩\n日高 心太\n井上 暁仁\n今中 悠人\n惣田 湧大\n髙峯 将真\n西岡 泰志\n福貴田 泰生\n栗原 翔\n岩原 晴斗\n杉阪 咲太\n安藤 心咲\n大西 義一\n岸上 虎央\n南 悠翔\n石橋 奈樹\n志冨田 明陽\n木下 一颯\n道下 大翔\n柏木 羽空";
    
    let chart;
    const colors = ['#e63946', '#457b9d', '#2a9d8f', '#f4a261', '#1d3557', '#8b5cf6'];
    let allSheetData = [];
    let isFilteredByDate = true; // 初回は日付で絞り込む

    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('recordDate').value = today;
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || PERMANENT_MEMBERS;
        applyMembers();
        initChart();
        fetchDateHistory();
        loadDateData();
        fetchAllDataForGraph();
    };

    // 【新機能】日付履歴から選んだ時、表とグラフの両方を更新
    function syncDateAndGraph() {
        const selectedDate = document.getElementById('dateHistory').value;
        if(selectedDate) {
            document.getElementById('recordDate').value = selectedDate;
            isFilteredByDate = true; // 日付フィルタを有効にする
            loadDateData(); // 表を更新
            updateGraph(); // グラフを更新
        }
    }

    // グラフのリセット（全履歴表示）
    function resetGraph() {
        isFilteredByDate = false;
        updateGraph();
    }

    async function fetchDateHistory() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?mode=listDates`);
            const dates = await res.json();
            const select = document.getElementById('dateHistory');
            select.innerHTML = '<option value="">-- 過去の練習日を選択 --</option>';
            dates.forEach(d => select.add(new Option(d, d)));
        } catch (e) {}
    }

    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            document.querySelectorAll('.t-in').forEach(el => el.value = '');
            document.querySelectorAll('.rank-col-cell').forEach(el => el.innerText = '-');
            if (result.found) {
                const sheetData = result.data;
                const rows = document.getElementById('pdfTableBody').rows;
                for (let i = 1; i < sheetData.length; i++) {
                    for (let r = 0; r < rows.length; r++) {
                        if (rows[r].cells[0].innerText === sheetData[i][0]) {
                            for (let c = 1; c <= 6; c++) {
                                rows[r].cells[c * 2 - 1].querySelector('input').value = sheetData[i][c * 2 - 1] || '';
                                rows[r].cells[c * 2].innerText = sheetData[i][c * 2] || '-';
                            }
                        }
                    }
                }
            }
        } catch (e) {}
    }

    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        const fs = document.getElementById('filterSelect');
        tbody.innerHTML = '';
        const currentFilter = fs.value;
        fs.innerHTML = '<option value="all">全員表示</option>';
        ms.forEach(m => {
            const tr = document.createElement('tr');
            let html = `<td style="font-weight:bold; background:#f9f9f9; text-align:left; padding-left:5px;">${m.trim()}</td>`;
            for(let i=1; i<=6; i++) html += `<td><input type="text" class="t-in" oninput="calcRanks(${i})"></td><td class="rank-col rank-col-cell">-</td>`;
            tr.innerHTML = html;
            tbody.appendChild(tr);
            fs.add(new Option(m.trim(), m.trim()));
        });
        fs.value = currentFilter;
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            const val = input.value.trim();
            if(val) times.push({ rowIndex: i, sec: t2s(val) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, idx) => { rows[t.rowIndex].cells[colIdx * 2].innerText = idx + 1; });
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('pdfTableBody').rows;
        btn.disabled = true; btn.innerText = "同期中...";
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c * 2 - 1].querySelector('input');
                if (!input.value.trim()) continue;
                const payload = { date, name: rows[r].cells[0].innerText, count: document.getElementById('mainTable').rows[0].cells[c * 2 - 1].innerText, time: input.value.trim(), rank: rows[r].cells[c * 2].innerText, memberList: document.getElementById('memberList').value };
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        btn.disabled = false; btn.innerText = "同期完了！";
        fetchDateHistory();
        fetchAllDataForGraph();
    }

    async function fetchAllDataForGraph() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(GAS_WEBAPP_URL);
            allSheetData = await res.json();
            updateGraph();
        } catch (e) {}
    }

    function updateGraph() {
        const filter = document.getElementById('filterSelect').value;
        const currentDay = document.getElementById('recordDate').value;
        
        // 日付フィルタが有効な場合はその日だけ、無効な場合は全履歴
        let filtered = allSheetData.filter(r => {
            const nameMatch = (filter === 'all' || r.name === filter);
            const dateMatch = isFilteredByDate ? (r.date === currentDay) : true;
            return nameMatch && dateMatch;
        });
        
        const dataMap = {}; const labelSet = new Set();
        filtered.forEach(r => {
            const label = `${r.date} (${r.count})`;
            labelSet.add(label);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][label] = t2s(r.time);
        });

        const sortedLabels = Array.from(labelSet).sort();
        const datasets = [];
        Object.keys(dataMap).forEach((name, i) => {
            datasets.push({ label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: colors[i % colors.length], tension: 0.3, spanGaps: true, pointRadius: 4 });
        });

        chart.data.labels = sortedLabels;
        chart.data.datasets = datasets;
        chart.update();
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { 
            type: 'line', 
            data: { labels: [], datasets: [] }, 
            options: { 
                responsive: true, maintainAspectRatio: false, 
                scales: { 
                    y: { reverse: true, ticks: { callback: v => s2t(v) } },
                    x: { ticks: { maxRotation: 45, minRotation: 45 } }
                }
            } 
        });
    }

    function s2t(s) {
        if (!s) return "";
        if (s.toString().includes(':')) return s;
        const val = parseFloat(s);
        const m = Math.floor(val / 60);
        const sec = Math.floor(val % 60);
        return m + ":" + String(sec).padStart(2, '0');
    }

    function t2s(v){
        if(!v || !v.toString().includes(':')) return parseFloat(v) || 0;
        const p = v.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]);
    }
</script>
</body>
</html>
