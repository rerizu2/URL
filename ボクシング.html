<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Boxing Run Tracker - New Members Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #e63946; --secondary: #1d3557; --bg: #f4f7f9;
            --pdf-header: #b2ffff; --pdf-yellow: #ffff00;
        }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; font-size: 13px; }
        .container { max-width: 1280px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        .dashboard { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        h2 { font-size: 15px; color: var(--secondary); margin: 0 0 15px; border-left: 5px solid var(--secondary); padding-left: 10px; }
        
        /* 入力テーブル */
        .sheet-mode-card { overflow-x: auto; }
        .entry-table { width: 100%; border-collapse: collapse; min-width: 900px; }
        .entry-table th, .entry-table td { border: 1px solid #bbb; padding: 4px; text-align: center; }
        .entry-table th { background: #f0f0f0; font-size: 11px; }
        .entry-table input { width: 90%; padding: 5px; border: 1px solid #ddd; text-align: center; border-radius: 3px; font-size: 14px; }
        .lap-tag { font-size: 10px; color: #e63946; font-weight: bold; }

        textarea { width: 100%; height: 250px; border: 1px solid #ccc; border-radius: 4px; padding: 8px; box-sizing: border-box; font-size: 14px; line-height: 1.5; }
        button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .btn-main { background: var(--secondary); color: white; padding: 12px; width: 100%; margin-top: 10px; font-size: 15px; }
        .btn-main:hover { background: var(--primary); }
        .btn-update { background: #6c757d; color: white; padding: 6px; font-size: 12px; margin-top: 5px; width: 100%; }

        /* 早見表 */
        .pdf-table { width: 100%; border-collapse: collapse; font-size: 11px; border: 2px solid #000; }
        .pdf-table th { background: var(--pdf-header); border: 1px solid #000; }
        .pdf-table td { border: 1px solid #000; text-align: center; height: 20px; }
        .col-y { background: var(--pdf-yellow); }

        .sync-msg { font-size: 11px; color: #10b981; margin-bottom: 5px; font-weight: bold; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard">
        <!-- 1. 名簿管理 -->
        <div class="card">
            <h2>1. 部員名簿の管理</h2>
            <p style="font-size:10px; color:#666;">名前を入れ替えた場合は必ず下のボタンを押してください。</p>
            <textarea id="memberList">石橋 乃蒼
川﨑 輝寅
上窪 聖
大畑 歩希
志冨田 凪大
亀本 快歩
松嶋 虎鉄
今井 仁
岡田 陸翔
濱田 周摩
日高 心太
井上 暁仁
今中 悠人
惣田 湧大
髙峯 将真
西岡 泰志
福貴田 泰生
栗原 翔
岩原 晴斗
杉阪 咲太
安藤 心咲
大西 義一
岸上 虎央
南 悠翔
石橋 奈樹
志冨田 明陽
木下 一颯
道下 大翔
柏木 羽空</textarea>
            <button class="btn-update" onclick="applyMembers()">名簿を確定し表に反映</button>
        </div>

        <!-- 2. 成長グラフ -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
                <h2>2. タイム分析グラフ (上＝速い)</h2>
                <select id="filterSelect" onchange="renderChart()" style="padding:5px; border-radius:4px;"><option value="all">全員比較</option></select>
            </div>
            <div style="height: 350px;"><canvas id="runChart"></canvas></div>
        </div>
    </div>

    <!-- 3. 一括入力テーブル -->
    <div class="card sheet-mode-card">
        <div class="sync-msg">● スプレッドシート常時接続中</div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>3. 記録一括入力 (2周×2本、1周×3本 形式)</h2>
            <div>日付：<input type="date" id="recordDate" style="padding:5px;"></div>
        </div>
        <table class="entry-table">
            <thead>
                <tr>
                    <th rowspan="2" style="width:120px;">氏名</th>
                    <th colspan="2">2周区間</th>
                    <th colspan="3">1周区間</th>
                </tr>
                <tr>
                    <th>1本目 <span class="lap-tag">(2周)</span></th>
                    <th>2本目 <span class="lap-tag">(2周)</span></th>
                    <th>3本目 <span class="lap-tag">(1周)</span></th>
                    <th>4本目 <span class="lap-tag">(1周)</span></th>
                    <th>5本目 <span class="lap-tag">(1周)</span></th>
                </tr>
            </thead>
            <tbody id="entryTableBody"></tbody>
        </table>
        <button id="saveBtn" class="btn-main" onclick="saveAllSheetData()">すべてのデータをスプレッドシートに送信・保存</button>
    </div>

    <!-- 4. 早見表 -->
    <div class="card">
        <h2 style="border-left: 5px solid #00ffff;">4. ラップタイム算早見表 (小数点第1位)</h2>
        <div style="overflow-x: auto;">
            <table class="pdf-table">
                <thead>
                    <tr><th>100m</th><th>200m</th><th>300m</th><th>400m</th><th>600m</th><th>800m</th><th>1000m</th><th>1200m</th><th>1500m</th><th>3000m</th></tr>
                </thead>
                <tbody id="refTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 5. ログ -->
    <div class="card">
        <h2>5. 内部保存ログ (直接修正可)</h2>
        <textarea id="rawLog" onchange="saveAllToStorage(); renderChart();" style="height: 100px; font-family: monospace; font-size: 11px;"></textarea>
        <button onclick="if(confirm('全消去しますか？')){localStorage.clear(); location.reload();}" style="font-size:10px; background:#999; color:white; margin-top:5px; padding:4px;">ローカルデータをリセット</button>
    </div>
</div>

<script>
    // ==========================================
    // 自身のGASウェブアプリURLを貼り付けてください
    // ==========================================
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzvrhccyq6nvqGzMK3kIojQvKiWluLPbG5dY-MJ6O8KTSW4s_BuT8xopspRTeAjyvxK2A/exec"; 

    let chart;
    const colors = ['#e63946', '#457b9d', '#2a9d8f', '#f4a261', '#1d3557', '#8b5cf6', '#6d597a', '#354f52', '#bc4749'];

    window.onload = () => {
        // 今日をデフォルトに
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        loadData();
        applyMembers();
        generateRefTable();
        initChart();
        renderChart();
    };

    function loadData() {
        if(localStorage.getItem('boxing_members')) document.getElementById('memberList').value = localStorage.getItem('boxing_members');
        if(localStorage.getItem('boxing_logs')) document.getElementById('rawLog').value = localStorage.getItem('boxing_logs');
    }

    function saveAllToStorage() {
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
        localStorage.setItem('boxing_logs', document.getElementById('rawLog').value);
    }

    function applyMembers() {
        saveAllToStorage();
        const members = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('entryTableBody');
        const filter = document.getElementById('filterSelect');
        tbody.innerHTML = '';
        filter.innerHTML = '<option value="all">全員比較</option>';

        members.forEach(name => {
            const n = name.trim(); if(!n) return;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:bold; background:#f9f9f9;">${n}</td>
                <td><input type="text" class="t-in" data-name="${n}" data-count="1" data-laps="2"></td>
                <td><input type="text" class="t-in" data-name="${n}" data-count="2" data-laps="2"></td>
                <td><input type="text" class="t-in" data-name="${n}" data-count="3" data-laps="1"></td>
                <td><input type="text" class="t-in" data-name="${n}" data-count="4" data-laps="1"></td>
                <td><input type="text" class="t-in" data-name="${n}" data-count="5" data-laps="1"></td>
            `;
            tbody.appendChild(tr);
            filter.add(new Option(n, n));
        });
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const inputs = document.querySelectorAll('.t-in');
        const log = document.getElementById('rawLog');
        
        let sendCount = 0;
        btn.disabled = true;
        btn.innerText = "スプレッドシートと同期中...";

        for (const input of inputs) {
            const time = input.value.trim();
            if (!time) continue;

            const name = input.dataset.name;
            const count = input.dataset.count;
            const laps = input.dataset.laps;

            // ローカルログの更新ロジック
            let lines = log.value.trim().split('\n').filter(l => l !== "");
            let found = false;
            const newLines = lines.map(line => {
                const p = line.split(',').map(s => s.trim());
                if (p[0] === date && p[1] === count && p[3] === name) {
                    found = true;
                    return `${date}, ${count}, ${laps}, ${name}, ${time}`;
                }
                return line;
            });
            if (!found) newLines.push(`${date}, ${count}, ${laps}, ${name}, ${time}`);
            log.value = newLines.join('\n');

            // GAS送信
            if (GAS_WEBAPP_URL.startsWith('http')) {
                try {
                    await fetch(GAS_WEBAPP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ date, count, laps, name, time })
                    });
                } catch(e) {}
            }
            sendCount++;
        }

        saveAllToStorage();
        renderChart();
        btn.disabled = false;
        btn.innerText = "同期完了 (" + sendCount + "件)";
        setTimeout(() => btn.innerText = "すべての記録をスプレッドシートに送信・保存", 3000);
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    y: { reverse: true, ticks: { callback: v => Math.floor(v/60) + ":" + String(v%60).padStart(2, '0') } } 
                },
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
            }
        });
    }

    function renderChart() {
        const txt = document.getElementById('rawLog').value.trim();
        const filter = document.getElementById('filterSelect').value;
        if(!txt) return;
        const lines = txt.split('\n');
        const dataMap = {}; const labelSet = new Set();
        lines.forEach(l => {
            const p = l.split(',').map(s => s.trim());
            if(p.length < 5) return;
            const label = `${p[0]}(${p[1]}本)${p[2]}周`;
            labelSet.add(label);
            if(!dataMap[p[3]]) dataMap[p[3]] = {};
            const t = p[4].split(':');
            const sec = t.length === 2 ? parseInt(t[0])*60 + parseInt(t[1]) : parseInt(t[0]);
            dataMap[p[3]][label] = sec;
        });
        const sortedLabels = Array.from(labelSet).sort();
        const datasets = [];
        Object.keys(dataMap).forEach((name, i) => {
            if(filter !== 'all' && name !== filter) return;
            datasets.push({ label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: colors[i % colors.length], tension: 0.3, spanGaps: true, borderWidth: 2, pointRadius: 3 });
        });
        chart.data.labels = sortedLabels; chart.data.datasets = datasets; chart.update();
    }

    function generateRefTable() {
        const tbody = document.getElementById('refTableBody');
        const distances = [1, 2, 3, 4, 6, 8, 10, 12, 15, 30];
        for (let base = 13.0; base <= 35.0; base += 1.0) {
            const tr = document.createElement('tr');
            distances.forEach((dist, idx) => {
                const td = document.createElement('td');
                const sec = base * dist;
                const m = Math.floor(sec / 60);
                const s = (sec % 60).toFixed(1).padStart(4, '0');
                td.innerText = m > 0 ? `${m}'${s}` : s;
                if ([1, 3, 6].includes(idx)) td.className = 'col-y';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    }
</script>

</body>
</html>
