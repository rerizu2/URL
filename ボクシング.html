<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ボクシングタイム記録（カメラ解析付）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- OCRライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style id="dynamic-print-style"></style>
    <style>
        /* --- デザイン設定 --- */
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f0f2f5; --pdf-header: #b2ffff; --pdf-yellow: #ffff00; --pdf-male: #00ffff; --pdf-female: #ff0000; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 15px; }
        
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; background: #fff; table-layout: fixed; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px 2px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-table input { width: 95%; border: none; text-align: center; font-size: 13px; background: transparent; }
        
        .col-name { width: 130px; text-align: left !important; padding-left: 5px !important; font-weight: bold; }
        .col-time { width: 60px; }
        .col-rank { width: 30px; color: var(--primary); font-weight: bold; font-size: 11px; }
        .lap-edit { width: 35px !important; border: 1px solid #ccc !important; background: #fff !important; color: var(--primary); font-weight: bold; border-radius: 3px; }

        /* カメラエリアのスタイル */
        .camera-section { background: #1e293b; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        #video { width: 100%; max-width: 500px; border-radius: 8px; background: #000; display: none; margin: 0 auto; }
        #canvas { display: none; }
        .camera-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; }
        .snap-btn { background: var(--primary); }
        .loading-overlay { display: none; color: #fbbf24; font-weight: bold; margin-top: 10px; }

        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        
        @media print {
            .no-print, .camera-section { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- カメラ撮影セクション -->
    <div class="card camera-section no-print">
        <h3 style="margin-top:0;">📸 カメラで表を読み取る</h3>
        <p style="font-size:11px; color:#cbd5e1;">「名前 タイム」が並んでいる手書きメモや名簿を撮影してください</p>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <div id="camera-controls">
            <button class="camera-btn" id="start-camera" onclick="initCamera()">カメラを起動</button>
            <button class="camera-btn snap-btn" id="take-photo" onclick="takePhoto()" style="display:none;">撮影して解析</button>
        </div>
        <div id="loading" class="loading-overlay">⌛ 文字を解析中...（10秒ほどかかります）</div>
    </div>

    <!-- メイン操作エリア -->
    <div class="no-print-area card no-print" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="camera-btn" style="background:var(--secondary);" onclick="preparePrint()">印刷・PDF保存</button>
        <label><input type="date" id="recordDate" onchange="onDateChange()"></label>
        <select id="dateHistory" onchange="syncDateAndLoad()"><option value="">-- 履歴読込 --</option></select>
    </div>

    <div class="dashboard-grid">
        <div class="card no-print">
            <h2>選手名簿</h2>
            <textarea id="memberList" style="width:100%; height:150px; font-size:11px;"></textarea>
            <button onclick="applyMembers()" style="width:100%; padding:8px; margin-top:5px; cursor:pointer;">名簿更新</button>
        </div>

        <div class="card">
            <h2>成長分析グラフ</h2>
            <div style="height:300px;"><canvas id="runChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div style="overflow-x: auto;">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th class="col-name">氏名</th>
                        <th class="col-time">1本目(<input type="number" class="lap-edit" id="lap-1" value="2">)</th><th class="col-rank">順</th>
                        <th class="col-time">2本目(<input type="number" class="lap-edit" id="lap-2" value="2">)</th><th class="col-rank">順</th>
                        <th class="col-time">3本目(<input type="number" class="lap-edit" id="lap-3" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">4本目(<input type="number" class="lap-edit" id="lap-4" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">5本目(<input type="number" class="lap-edit" id="lap-5" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">追加(<input type="number" class="lap-edit" id="lap-6" value="1">)</th><th class="col-rank">順</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">同期保存</button>
    </div>
</div>

<script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4wv9HDVi099vlKKXq_whz6uQ1X-tQ5E1D47-xbi7Un_KkNO00yp7obVCsp-3201lL9Q/exec"; 
    const PERMANENT_MEMBERS = "石橋 乃蒼\n川﨑 輝寅\n上窪 聖\n大畑 歩希\n志冨田 凪大\n亀本 快歩\n松嶋 虎鉄\n今井 仁\n岡田 陸翔\n濱田 周摩\n日高 心太\n井上 暁仁\n今中 悠人\n惣田 湧大\n髙峯 将真\n西岡 泰志\n福貴田 泰生\n栗原 翔\n岩原 晴斗\n杉阪 咲太\n安藤 心咲\n大西 義一\n岸上 虎央\n南 悠翔\n石橋 奈樹\n志冨田 明陽\n木下 一颯\n道下 大翔\n柏木 羽空";
    
    let chart;
    let allSheetData = [];
    let videoStream = null;

    window.onload = async () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || PERMANENT_MEMBERS;
        applyMembers();
        initChart();
        await fetchDateHistory();
        await fetchAllData();
        await loadDateData();
    };

    // --- カメラ機能 ---
    async function initCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, // 背面カメラ優先
                audio: false 
            });
            const video = document.getElementById('video');
            video.srcObject = videoStream;
            video.style.display = "block";
            document.getElementById('start-camera').style.display = "none";
            document.getElementById('take-photo').style.display = "inline-block";
        } catch (err) {
            alert("カメラの起動に失敗しました: " + err);
        }
    }

    async function takePhoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        
        // ビデオの現在のフレームをキャンバスに描画
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);

        loading.style.display = "block";
        document.getElementById('take-photo').disabled = true;

        try {
            // OCR実行 (日本語と英語を指定)
            const result = await Tesseract.recognize(canvas, 'jpn+eng');
            parseOCRText(result.data.text);
        } catch (err) {
            alert("解析中にエラーが発生しました。");
            console.error(err);
        } finally {
            loading.style.display = "none";
            document.getElementById('take-photo').disabled = false;
        }
    }

    // --- OCR解析ロジック ---
    function parseOCRText(text) {
        console.log("解析されたテキスト:", text);
        const rows = document.getElementById('pdfTableBody').rows;
        let matchCount = 0;

        // 改行で分割して1行ずつループ
        const lines = text.split('\n');
        
        lines.forEach(line => {
            for (let r = 0; r < rows.length; r++) {
                const nameInTable = rows[r].cells[0].innerText.trim();
                // 行の中に名簿の名前が含まれているか確認
                if (line.includes(nameInTable)) {
                    // タイム形式 (2:05, 2.05, 205等) を抽出
                    const timePattern = /(\d[:：\.]\d{2}|\d{3,4})/g;
                    const foundTimes = line.match(timePattern) || [];
                    
                    foundTimes.forEach((timeStr, idx) => {
                        if (idx < 6) {
                            const input = rows[r].cells[(idx + 1) * 2 - 1].querySelector('input');
                            let formatted = timeStr.replace(/[：\.]/g, ':');
                            if (/^\d{3,4}$/.test(formatted)) {
                                formatted = formatted.slice(0, -2) + ":" + formatted.slice(-2);
                            }
                            input.value = formatted;
                            input.setAttribute('value', formatted);
                        }
                    });
                    matchCount++;
                    break;
                }
            }
        });

        for (let i = 1; i <= 6; i++) calcRanks(i);
        updateGraph();
        alert(`${matchCount} 名のデータを反映しました。値が正しいか確認してください。`);
    }

    // --- 既存の補助関数 ---
    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        tbody.innerHTML = '';
        ms.forEach(m => {
            if(!m.trim()) return;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-name" style="background:#f9f9f9;">${m.trim()}</td>` +
                           Array(6).fill(0).map((_,i) => `<td class="col-time"><input type="text" class="t-in" oninput="handleInput(this, ${i+1})"></td><td class="col-rank">-</td>`).join('');
            tbody.appendChild(tr);
        });
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            const val = input.value.trim();
            if(val) times.push({ rowIndex: i, sec: t2s(val) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, idx) => { rows[t.rowIndex].cells[colIdx * 2].innerText = idx + 1; });
    }

    function handleInput(el, colIdx) { el.setAttribute('value', el.value); calcRanks(colIdx); }

    function t2s(v){
        if(!v) return 0;
        const sVal = v.toString();
        if(!sVal.includes(':')) return parseFloat(sVal) || 0;
        const p = sVal.split(':');
        return (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0);
    }

    function s2t(s) {
        if (!s && s!==0) return "";
        const m = Math.floor(s/60);
        const sec = Math.floor(s%60);
        return m + ":" + String(sec).padStart(2, '0');
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true, ticks: { callback: v => s2t(v) } } } } });
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('pdfTableBody').rows;
        btn.disabled = true; btn.innerText = "同期中...";
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c * 2 - 1].querySelector('input');
                if (!input.value.trim()) continue;
                const payload = { date, name: rows[r].cells[0].innerText, count: `${c}本目`, laps: document.getElementById(`lap-${c}`).value, time: input.value.trim(), rank: rows[r].cells[c * 2].innerText };
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        btn.disabled = false; btn.innerText = "同期完了！";
        await fetchAllData();
    }

    async function fetchAllData() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(GAS_WEBAPP_URL);
            allSheetData = await res.json();
            updateGraph();
        } catch (e) {}
    }

    function updateGraph() {
        if(!chart) return;
        const dataMap = {}; const labelSet = new Set();
        allSheetData.forEach(r => {
            const label = `${r.date} (${r.count})`;
            labelSet.add(label);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][label] = t2s(r.time);
        });
        const sortedLabels = Array.from(labelSet).sort();
        const datasets = Object.keys(dataMap).map((name, i) => {
            return { label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: `hsl(${(i*40)%360},70%,50%)`, tension: 0.3, spanGaps: true };
        });
        chart.data.labels = sortedLabels; chart.data.datasets = datasets; chart.update();
    }

    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            if (result.found) {
                const rows = document.getElementById('pdfTableBody').rows;
                result.data.forEach(d => {
                    for(let r=0; r<rows.length; r++){
                        if(rows[r].cells[0].innerText === d[0]){
                            for(let c=1; c<=6; c++){
                                rows[r].cells[c*2-1].querySelector('input').value = d[c*2-1] || '';
                                rows[r].cells[c*2].innerText = d[c*2] || '-';
                            }
                        }
                    }
                });
            }
        } catch(e){}
    }

    async function fetchDateHistory() {
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?mode=listDates`);
            const dates = await res.json();
            const sel = document.getElementById('dateHistory');
            dates.forEach(d => sel.add(new Option(d, d)));
        } catch(e){}
    }

    function preparePrint() { window.print(); }
</script>
</body>
</html>
