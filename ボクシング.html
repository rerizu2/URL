<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ボクシングタイム記録</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style id="dynamic-print-style"></style>
    <style>
        /* --- デザイン設定 --- */
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f0f2f5; --pdf-header: #b2ffff; --pdf-yellow: #ffff00; --pdf-male: #00ffff; --pdf-female: #ff0000; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 15px; }
        
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; background: #fff; table-layout: fixed; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px 2px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-table input { width: 95%; border: none; text-align: center; font-size: 13px; background: transparent; }
        
        .col-name { width: 130px; text-align: left !important; padding-left: 5px !important; font-weight: bold; }
        .col-time { width: 60px; }
        .col-rank { width: 30px; color: var(--primary); font-weight: bold; font-size: 11px; }
        .lap-edit { width: 35px !important; border: 1px solid #ccc !important; background: #fff !important; color: var(--primary); font-weight: bold; border-radius: 3px; }

        .ranking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .rank-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .rank-item { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 11px; }
        .rank-name { flex: 1; font-weight: bold; margin-left: 10px; }
        .rank-time { font-family: monospace; color: var(--primary); font-weight: bold; }

        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        .chart-container { height: 400px; position: relative; }

        .no-print-area { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 2px solid var(--secondary); display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .print-btn { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* --- 印刷設定 --- */
        @media print {
            @page { margin: 3mm; } 
            body { background: white; padding: 0; margin: 0; }
            .no-print, .no-print-area, #saveBtn, .lap-edit, button, select, hr { display: none !important; }
            .print-hidden { display: none !important; }
            /* 個人印刷時に他人の行を隠す用 */
            .print-exclude-row { display: none !important; }
            
            .container { max-width: 100% !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .dashboard-grid { display: block; margin: 0; padding: 0; }
            .card { box-shadow: none; border: none; padding: 0; margin-bottom: 5px; }
            
            .pdf-table { width: 100% !important; min-width: 100% !important; table-layout: fixed !important; }
            .pdf-table th, .pdf-table td { font-size: 9px !important; padding: 1px !important; height: 16px !important; line-height: 1.0 !important; border: 0.5px solid #000 !important; }
            .col-name { width: 90px !important; }
            
            .page-break { page-break-before: always; }
            .print-only-header { display: block !important; text-align: center; border-bottom: 1px solid #000; margin-bottom: 5px; }
        }
        .print-only-header { display: none; }
        .col-y { background: var(--pdf-yellow) !important; }
        .highlight-male { background-color: var(--pdf-male) !important; font-weight: bold; }
        .highlight-female { background-color: var(--pdf-female) !important; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="print-only-header">
    <h2 style="margin:0; font-size:18px;">ボクシング トレーニング記録レポート</h2>
    <p id="print-date-display" style="margin:5px 0; font-size:12px; font-weight:bold;"></p>
</div>

<div class="container">
    <div class="no-print-area">
        <div style="font-weight:bold; color:var(--secondary); min-width:100px;">印刷設定:</div>
        <label><input type="checkbox" id="check-graph" checked> グラフ</label>
        <label><input type="checkbox" id="check-rank" checked> ランキング</label>
        <label><input type="checkbox" id="check-table" checked> 記録表</label>
        
        <div style="border-left: 1px solid #ccc; padding-left: 10px; display: flex; gap: 5px; align-items: center;">
            <span>範囲:</span>
            <select id="print-scope" onchange="togglePrintNameSelect()" style="padding:5px;">
                <option value="all">すべて</option>
                <option value="individual">個人</option>
            </select>
            <select id="print-name-select" style="padding:5px; display:none;">
                <!-- 名簿更新時に自動で追加されます -->
            </select>
        </div>

        <select id="print-orientation" style="padding:5px;">
            <option value="landscape">横向き (推奨)</option>
            <option value="portrait">縦向き</option>
        </select>
        <button class="print-btn" onclick="preparePrint()">印刷・PDF保存</button>
    </div>

    <!-- 印刷時に制御するためIDを付与 -->
    <div class="dashboard-grid" id="main-dashboard-container">
        <!-- 左：サイドバー -->
        <div class="card no-print">
            <div style="font-size:10px; color:#10b981; font-weight:bold; margin-bottom:10px;">● スプレッドシート同期中</div>
            <label style="font-weight:bold;">履歴選択</label>
            <select id="dateHistory" onchange="syncDateAndLoad()" style="width:100%; padding:8px; margin-bottom:10px;"><option value="">-- 読込中 --</option></select>
            <input type="date" id="recordDate" onchange="onDateChange()" style="width:100%; padding:8px; margin-bottom:15px;">
            <hr>
            <h2>選手名簿</h2>
            <textarea id="memberList" style="width:100%; height:120px; font-size:11px;"></textarea>
            <button onclick="applyMembers()" style="width:100%; padding:8px; background:#6c757d; color:#fff; border:none; border-radius:4px; font-size:11px; cursor:pointer; margin-top:5px;">名簿更新</button>
        </div>

        <!-- 右：分析エリア -->
        <div class="card" id="card-analysis">
            <div id="section-graph">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h2>成長分析グラフ</h2>
                    <div style="display:flex; gap:10px;" class="no-print">
                        <select id="filterSelect" onchange="updateGraph()" style="padding:5px;"><option value="all">全員表示</option></select>
                        <select id="graphRange" onchange="updateGraph()" style="padding:5px;">
                            <option value="all">全期間</option>
                            <option value="today">本日のみ</option>
                        </select>
                    </div>
                </div>
                <div class="chart-container"><canvas id="runChart"></canvas></div>
            </div>

            <div class="ranking-grid" id="section-rank">
                <div class="rank-box"><h3 style="text-align:center; font-size:11px; margin-top:0;">🏆 2周個人ベスト</h3><div id="rankLaps2"></div></div>
                <div class="rank-box"><h3 style="text-align:center; font-size:11px; margin-top:0;">🏆 1周個人ベスト</h3><div id="rankLaps1"></div></div>
            </div>
        </div>
    </div>

    <!-- 記録表 -->
    <div class="card" id="section-table">
        <div style="overflow-x: auto;">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th class="col-name">氏名</th>
                        <th class="col-time">1本目(<input type="number" class="lap-edit" id="lap-1" value="2">)</th><th class="col-rank">順</th>
                        <th class="col-time">2本目(<input type="number" class="lap-edit" id="lap-2" value="2">)</th><th class="col-rank">順</th>
                        <th class="col-time">3本目(<input type="number" class="lap-edit" id="lap-3" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">4本目(<input type="number" class="lap-edit" id="lap-4" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">5本目(<input type="number" class="lap-edit" id="lap-5" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">追加(<input type="number" class="lap-edit" id="lap-6" value="1">)</th><th class="col-rank">順</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">同期保存</button>
    </div>

    <!-- 早見表（印刷除外） -->
    <div class="card no-print">
        <h2 style="text-align:center; font-size:22px; letter-spacing:8px;">ラップタイム早見表</h2>
        <div style="overflow-x:auto;">
            <table class="pdf-table" style="table-layout: auto;">
                <thead>
                    <tr><th>100m</th><th>200m</th><th>300m</th><th>400m</th><th>600m</th><th>800m</th><th>1000m</th><th>1200m</th><th>1500m</th><th>3000m</th></tr>
                </thead>
                <tbody id="refTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4wv9HDVi099vlKKXq_whz6uQ1X-tQ5E1D47-xbi7Un_KkNO00yp7obVCsp-3201lL9Q/exec"; 
    const PERMANENT_MEMBERS = "石橋 乃蒼\n川﨑 輝寅\n上窪 聖\n大畑 歩希\n志冨田 凪大\n亀本 快歩\n松嶋 虎鉄\n今井 仁\n岡田 陸翔\n濱田 周摩\n日高 心太\n井上 暁仁\n今中 悠人\n惣田 湧大\n髙峯 将真\n西岡 泰志\n福貴田 泰生\n栗原 翔\n岩原 晴斗\n杉阪 咲太\n安藤 心咲\n大西 義一\n岸上 虎央\n南 悠翔\n石橋 奈樹\n志冨田 明陽\n木下 一颯\n道下 大翔\n柏木 羽空";
    
    let chart;
    let allSheetData = [];

    window.onload = async () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || PERMANENT_MEMBERS;
        applyMembers();
        initChart();
        generateRefTable();
        await fetchDateHistory();
        await fetchAllData();
        await loadDateData();
    };

    // --- 印刷設定の制御用 ---
    function togglePrintNameSelect() {
        const scope = document.getElementById('print-scope').value;
        document.getElementById('print-name-select').style.display = (scope === 'individual') ? 'inline-block' : 'none';
    }

    // --- 自動変換 500 -> 5:00 ---
    function formatTimeInput(el, colIdx) {
        let val = el.value.trim();
        if (/^\d{3,4}$/.test(val)) {
            const min = val.slice(0, -2);
            const sec = val.slice(-2);
            el.value = min + ":" + sec;
            el.setAttribute('value', el.value);
            calcRanks(colIdx);
        }
    }

    // --- 印刷準備（修正点：個人フィルタリング追加） ---
    function preparePrint() {
        const showGraph = document.getElementById('check-graph').checked;
        const showRank = document.getElementById('check-rank').checked;
        const showTable = document.getElementById('check-table').checked;
        const orientation = document.getElementById('print-orientation').value;
        const printScope = document.getElementById('print-scope').value;
        const targetName = document.getElementById('print-name-select').value;

        // 向きの反映
        document.getElementById('dynamic-print-style').innerHTML = `@media print { @page { size: A4 ${orientation}; } }`;

        // 表示切り替え
        document.getElementById('section-graph').classList.toggle('print-hidden', !showGraph);
        document.getElementById('section-rank').classList.toggle('print-hidden', !showRank);
        document.getElementById('section-table').classList.toggle('print-hidden', !showTable);

        // 個人印刷の場合の処理
        if (printScope === 'individual') {
            // 記録表の行をフィルタリング
            const rows = document.getElementById('pdfTableBody').rows;
            for (let i = 0; i < rows.length; i++) {
                const rowName = rows[i].cells[0].innerText.trim();
                if (rowName !== targetName) {
                    rows[i].classList.add('print-exclude-row');
                } else {
                    rows[i].classList.remove('print-exclude-row');
                }
            }
            // グラフも個人に合わせる（グラフが表示対象の場合）
            if (showGraph) {
                document.getElementById('filterSelect').value = targetName;
                updateGraph();
            }
        } else {
            // すべて表示に戻す
            const rows = document.getElementById('pdfTableBody').rows;
            for (let i = 0; i < rows.length; i++) {
                rows[i].classList.remove('print-exclude-row');
            }
            if (showGraph) {
                document.getElementById('filterSelect').value = 'all';
                updateGraph();
            }
        }

        const hasAnalysis = showGraph || showRank;
        document.getElementById('main-dashboard-container').classList.toggle('print-hidden', !hasAnalysis);
        document.getElementById('card-analysis').classList.toggle('print-hidden', !hasAnalysis);

        const tableCard = document.getElementById('section-table');
        if (hasAnalysis && showTable) {
            tableCard.classList.add('page-break');
        } else {
            tableCard.classList.remove('page-break');
        }

        document.getElementById('print-date-display').innerText = `記録実施日: ${document.getElementById('recordDate').value}`;
        document.querySelectorAll('input').forEach(input => { input.setAttribute('value', input.value); });

        window.print();

        // 印刷ダイアログを閉じた後に「個人フィルタ」による非表示を解除する（念のため）
        setTimeout(() => {
            const rows = document.getElementById('pdfTableBody').rows;
            for (let i = 0; i < rows.length; i++) {
                rows[i].classList.remove('print-exclude-row');
            }
        }, 1000);
    }

    // --- その他既存ロジック ---
    function generateDynamicColor(index) {
        const hue = (index * 137.5) % 360;
        return `hsl(${hue}, 70%, 50%)`;
    }

    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        const fs = document.getElementById('filterSelect');
        const ps = document.getElementById('print-name-select'); // 印刷用セレクト
        
        tbody.innerHTML = '';
        fs.innerHTML = '<option value="all">全員表示</option>';
        ps.innerHTML = ''; // クリア

        ms.forEach(m => {
            if(!m.trim()) return;
            const name = m.trim();
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-name" style="background:#f9f9f9;">${name}</td>` +
                           Array(6).fill(0).map((_,i) => `<td class="col-time"><input type="text" class="t-in" oninput="handleInput(this, ${i+1})" onblur="formatTimeInput(this, ${i+1})"></td><td class="col-rank rank-col-cell">-</td>`).join('');
            tbody.appendChild(tr);
            
            fs.add(new Option(name, name));
            ps.add(new Option(name, name)); // 印刷設定用にも追加
        });
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            const val = input.value.trim();
            if(val) times.push({ rowIndex: i, sec: t2s(val) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, idx) => { rows[t.rowIndex].cells[colIdx * 2].innerText = idx + 1; });
    }

    function handleInput(el, colIdx) { el.setAttribute('value', el.value); calcRanks(colIdx); }

    function s2t(s) {
        if (!s && s!==0) return "";
        const m = Math.floor(s/60);
        const sec = Math.floor(s%60);
        return m + ":" + String(sec).padStart(2, '0');
    }

    function t2s(v){
        if(!v) return 0;
        const sVal = v.toString();
        if(!sVal.includes(':')) return parseFloat(sVal) || 0;
        const p = sVal.split(':');
        return (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0);
    }

    function s2t_pdf(s) {
        if (s < 60) return s.toFixed(1);
        const m = Math.floor(s/60);
        const sec = (s%60).toFixed(1);
        return m + "'" + String(sec).padStart(4, '0');
    }

    function generateRefTable() {
        const tbody = document.getElementById('refTableBody');
        const dists = [1, 2, 3, 4, 6, 8, 10, 12, 15, 30];
        for (let b = 13.0; b <= 40.0; b += 0.5) {
            const tr = document.createElement('tr');
            dists.forEach((d, idx) => {
                const td = document.createElement('td');
                const sec = b * d;
                let text = s2t_pdf(sec);
                if([1,3,6].includes(idx)) td.className = 'col-y';
                if(idx === 5 && b === 15.0) { text += "(男全)"; td.className = "highlight-male"; }
                if(idx === 5 && b === 17.0) { text += "(女全)"; td.className = "highlight-female"; }
                if(idx === 8 && b === 16.5) { text += "(男全)"; td.className = "highlight-male"; }
                if(idx === 8 && b === 18.5) { text += "(女全)"; td.className = "highlight-female"; }
                if(idx === 9 && b === 18.0) { text += "(男全)"; td.className = "highlight-male"; }
                td.innerText = text; tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true, ticks: { callback: v => s2t(v) } } } } });
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('pdfTableBody').rows;
        btn.disabled = true; btn.innerText = "同期中...";
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c * 2 - 1].querySelector('input');
                if (!input.value.trim()) continue;
                const laps = document.getElementById(`lap-${c}`).value;
                const count = ["1本目", "2本目", "3本目", "4本目", "5本目", "追加"][c-1];
                const payload = { date, name: rows[r].cells[0].innerText, count, laps, time: input.value.trim(), rank: rows[r].cells[c * 2].innerText, memberList: document.getElementById('memberList').value };
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        btn.disabled = false; btn.innerText = "同期完了！";
        await fetchAllData();
    }

    function updateGraph() {
        if(!chart) return;
        const filter = document.getElementById('filterSelect').value;
        const range = document.getElementById('graphRange').value;
        const curDay = document.getElementById('recordDate').value;
        let filtered = allSheetData.filter(r => (filter === 'all' || r.name === filter) && (range === 'today' ? r.date === curDay : true));
        const dataMap = {}; const labelSet = new Set();
        filtered.forEach(r => {
            const label = range === 'today' ? r.count : `${r.date} (${r.count})`;
            labelSet.add(label);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][label] = t2s(r.time);
        });
        const sortedLabels = Array.from(labelSet).sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
        const datasets = Object.keys(dataMap).map((name, i) => {
            const color = generateDynamicColor(i);
            return { label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: color, backgroundColor: color, tension: 0.3, spanGaps: true, pointRadius: 4 };
        });
        chart.data.labels = sortedLabels; chart.data.datasets = datasets; chart.update();
    }

    function renderRanking() {
        let pBest2 = {}; let pBest1 = {};
        allSheetData.forEach(r => {
            const sec = t2s(r.time);
            if (r.laps == "2") { if (!pBest2[r.name] || sec < pBest2[r.name]) pBest2[r.name] = sec; }
            else if (r.laps == "1") { if (!pBest1[r.name] || sec < pBest1[r.name]) pBest1[r.name] = sec; }
        });
        const draw = (id, obj) => {
            const arr = Object.entries(obj).sort((a,b) => a[1]-b[1]).slice(0,5);
            document.getElementById(id).innerHTML = arr.map((x,i) => `<div class="rank-item"><span>${i+1}</span><span class="rank-name">${x[0]}</span><span class="rank-time">${s2t(x[1])}</span></div>`).join('') || 'なし';
        };
        draw('rankLaps2', pBest2); draw('rankLaps1', pBest1);
    }

    async function syncDateAndLoad() {
        const sel = document.getElementById('dateHistory').value;
        if(sel) { document.getElementById('recordDate').value = sel; await loadDateData(); updateGraph(); }
    }
    async function onDateChange() { await loadDateData(); updateGraph(); }

    async function fetchDateHistory() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?mode=listDates`);
            const dates = await res.json();
            const select = document.getElementById('dateHistory');
            select.innerHTML = '<option value="">-- 練習履歴を選択 --</option>';
            dates.forEach(d => select.add(new Option(d, d)));
        } catch (e) {}
    }

    async function fetchAllData() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(GAS_WEBAPP_URL);
            allSheetData = await res.json();
            updateGraph();
            renderRanking();
        } catch (e) {}
    }

    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            document.querySelectorAll('.t-in').forEach(el => { el.value = ''; el.setAttribute('value', ''); });
            if (result.found) {
                const sheetData = result.data;
                const rows = document.getElementById('pdfTableBody').rows;
                for (let i = 1; i < sheetData.length; i++) {
                    for (let r = 0; r < rows.length; r++) {
                        if (rows[r].cells[0].innerText.trim() === sheetData[i][0].trim()) {
                            for (let c = 1; c <= 6; c++) {
                                const val = sheetData[i][c * 2 - 1] || '';
                                rows[r].cells[c * 2 - 1].querySelector('input').value = val;
                                rows[r].cells[c * 2].innerText = sheetData[i][c * 2] || '-';
                            }
                            break;
                        }
                    }
                }
            }
        } catch (e) {}
    }
</script>
</body>
</html>
