<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ボクシングタイム記録</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style id="dynamic-print-style"></style>
    <style>
        /* --- 基本デザイン --- */
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f0f2f5; --pdf-header: #b2ffff; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 15px; }
        
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; background: #fff; table-layout: fixed; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px 2px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-table input { width: 95%; border: none; text-align: center; font-size: 13px; background: transparent; }
        
        .col-name { width: 130px; text-align: left !important; padding-left: 5px !important; font-weight: bold; }
        .col-time { width: 60px; }
        .col-rank { width: 30px; color: var(--primary); font-weight: bold; font-size: 11px; }
        .lap-edit { width: 35px !important; border: 1px solid #ccc !important; background: #fff !important; color: var(--primary); font-weight: bold; border-radius: 3px; }

        .ranking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .rank-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .rank-item { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 11px; }
        .rank-name { flex: 1; font-weight: bold; margin-left: 10px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .rank-time { font-family: monospace; color: var(--primary); font-weight: bold; }

        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        .chart-container { height: 400px; position: relative; }

        .no-print-area { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 2px solid var(--secondary); display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .print-btn { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        @media print {
            @page { margin: 5mm; }
            body { background: white; padding: 0; margin: 0; }
            .no-print, .no-print-area, #saveBtn, .lap-edit, button, select, hr { display: none !important; }
            .force-page-break { page-break-before: always !important; }
            .pdf-table { width: 100% !important; min-width: 100% !important; }
            .pdf-table th, .pdf-table td { font-size: 9px !important; padding: 1px !important; border: 0.5px solid #000 !important; }
            .print-only-header { display: block !important; text-align: center; border-bottom: 1px solid #000; margin-bottom: 10px; }
        }
        .print-only-header { display: none; }
    </style>
</head>
<body>

<div class="print-only-header">
    <h2 style="margin:0; font-size:18px;" id="print-title">トレーニング記録レポート</h2>
    <p id="print-date-display" style="margin:5px 0; font-size:12px; font-weight:bold;"></p>
</div>

<div class="container">
    <!-- 印刷設定 -->
    <div class="no-print-area">
        <div style="font-weight:bold; color:var(--secondary); min-width:100px;">印刷設定:</div>
        <label><input type="checkbox" id="check-graph" checked> グラフ</label>
        <label><input type="checkbox" id="check-rank" checked> ランキング</label>
        <label><input type="checkbox" id="check-table" checked> 記録表</label>
        <button class="print-btn" onclick="preparePrint()">印刷・PDF保存</button>
    </div>

    <div class="dashboard-grid" id="main-dashboard-container">
        <!-- 左：サイドバー -->
        <div class="card no-print">
            <label style="font-weight:bold;">履歴選択</label>
            <select id="dateHistory" onchange="syncDateAndLoad()" style="width:100%; padding:8px; margin-bottom:10px;"><option value="">-- 読込中 --</option></select>
            <input type="date" id="recordDate" onchange="onDateChange()" style="width:100%; padding:8px; margin-bottom:15px;">
            <hr>
            <h2>選手名簿</h2>
            <textarea id="memberList" style="width:100%; height:120px; font-size:11px;"></textarea>
            <button onclick="applyMembers()" style="width:100%; padding:8px; background:#6c757d; color:#fff; border:none; border-radius:4px; font-size:11px; cursor:pointer; margin-top:5px;">名簿更新</button>
        </div>

        <!-- グラフエリア：ここですべてを操作 -->
        <div class="card" id="card-analysis">
            <div id="section-graph">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px;">
                    <h2 style="margin:0;">成長分析グラフ</h2>
                    <div style="display:flex; gap:10px; align-items:center;" class="no-print">
                        <select id="displayScope" onchange="syncUI()" style="padding:5px; font-weight:bold; border:2px solid var(--secondary);">
                            <option value="all">全員表示</option>
                            <option value="individual">個人表示</option>
                        </select>
                        <select id="filterSelect" onchange="syncUI()" style="padding:5px; display:none;"></select>
                        <select id="graphRange" onchange="syncUI()" style="padding:5px;">
                            <option value="all">全期間</option>
                            <option value="today">本日(選択日)のみ</option>
                        </select>
                    </div>
                </div>
                <div class="chart-container"><canvas id="runChart"></canvas></div>
            </div>

            <div class="ranking-grid" id="section-rank">
                <div class="rank-box"><h3 id="rankTitle2" style="text-align:center; font-size:11px; margin-top:0;">🏆 2周ランキング</h3><div id="rankLaps2"></div></div>
                <div class="rank-box"><h3 id="rankTitle1" style="text-align:center; font-size:11px; margin-top:0;">🏆 1周ランキング</h3><div id="rankLaps1"></div></div>
            </div>
        </div>
    </div>

    <!-- 記録表 -->
    <div class="card" id="section-table">
        <div style="overflow-x: auto;">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th class="col-name" id="table-first-col">氏名</th>
                        <th class="col-time">1本目(<input type="number" class="lap-edit" id="lap-1" value="2">)</th><th class="col-rank">順</th>
                        <th class="col-time">2本目(<input type="number" class="lap-edit" id="lap-2" value="2">)</th><th class="col-rank">順</th>
                        <th class="col-time">3本目(<input type="number" class="lap-edit" id="lap-3" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">4本目(<input type="number" class="lap-edit" id="lap-4" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">5本目(<input type="number" class="lap-edit" id="lap-5" value="1">)</th><th class="col-rank">順</th>
                        <th class="col-time">追加(<input type="number" class="lap-edit" id="lap-6" value="1">)</th><th class="col-rank">順</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">同期保存</button>
    </div>
</div>

<script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4wv9HDVi099vlKKXq_whz6uQ1X-tQ5E1D47-xbi7Un_KkNO00yp7obVCsp-3201lL9Q/exec"; 
    const PERMANENT_MEMBERS = "石橋 乃蒼\n川﨑 輝寅\n上窪 聖\n大畑 歩希\n志冨田 凪大\n亀本 快歩\n松嶋 虎鉄\n今井 仁\n岡田 陸翔\n濱田 周摩\n日高 心太\n井上 暁仁\n今中 悠人\n惣田 湧大\n髙峯 将真\n西岡 泰志\n福貴田 泰生\n栗原 翔\n岩原 晴斗\n杉阪 咲太\n安藤 心咲\n大西 義一\n岸上 虎央\n南 悠翔\n石橋 奈樹\n志冨田 明陽\n木下 一颯\n道下 大翔\n柏木 羽空";
    
    let chart;
    let allSheetData = []; 
    let currentDayData = [];

    window.onload = async () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || PERMANENT_MEMBERS;
        applyMembers();
        initChart();
        await fetchDateHistory();
        await fetchAllData();
        await loadDateData();
    };

    function syncUI() {
        const scope = document.getElementById('displayScope').value;
        document.getElementById('filterSelect').style.display = (scope === 'individual') ? 'inline-block' : 'none';
        renderTable(); 
        renderRanking();
        updateGraph();
    }

    // グラフ更新ロジック（全期間対応）
    function updateGraph() {
        if(!chart) return;
        const scope = document.getElementById('displayScope').value;
        const targetName = document.getElementById('filterSelect').value;
        const range = document.getElementById('graphRange').value;
        const curDay = document.getElementById('recordDate').value;
        
        let graphData = [];

        if (range === 'today') {
            // 本日のみ：現在表示されているテーブルからリアルタイム取得
            const rows = document.getElementById('pdfTableBody').rows;
            if (scope === 'all') {
                for(let r=0; r<rows.length; r++) {
                    const name = rows[r].cells[0].innerText;
                    for(let c=1; c<=6; c++) {
                        const val = rows[r].cells[c*2-1].querySelector('input').value;
                        if(val) graphData.push({ name, count: getLapLabel(c), time: val, date: curDay });
                    }
                }
            } else {
                // 個人×本日
                const personToday = allSheetData.filter(d => d.name === targetName && d.date === curDay);
                graphData = personToday;
            }
        } else {
            // 全期間：全履歴データ(allSheetData)から取得
            if (scope === 'all') {
                graphData = [...allSheetData];
            } else {
                graphData = allSheetData.filter(d => d.name === targetName);
            }
        }

        // 時系列にソート
        graphData.sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            const lapOrder = ["1本目","2本目","3本目","4本目","5本目","追加"];
            return lapOrder.indexOf(a.count) - lapOrder.indexOf(b.count);
        });

        // グラフ用に整形
        const dataMap = {}; const labelSet = new Set();
        graphData.forEach(r => {
            const label = (range === 'today') ? r.count : `${r.date} (${r.count})`;
            labelSet.add(label);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][label] = t2s(r.time);
        });

        const sortedLabels = Array.from(labelSet); // すでにソート済み
        const datasets = Object.keys(dataMap).map((name, i) => {
            const color = `hsl(${(i * 137.5) % 360}, 70%, 50%)`;
            return { label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: color, backgroundColor: color, tension: 0.3, spanGaps: true, pointRadius: 4 };
        });

        chart.data.labels = sortedLabels; 
        chart.data.datasets = datasets; 
        chart.update('none'); 
    }

    function getLapLabel(i) { return ["1本目","2本目","3本目","4本目","5本目","追加"][i-1]; }

    function renderTable() {
        const scope = document.getElementById('displayScope').value;
        const targetName = document.getElementById('filterSelect').value;
        const tbody = document.getElementById('pdfTableBody');
        const firstCol = document.getElementById('table-first-col');
        const saveBtn = document.getElementById('saveBtn');
        
        tbody.innerHTML = '';
        if (scope === 'all') {
            firstCol.innerText = '氏名';
            saveBtn.style.display = 'block';
            const ms = document.getElementById('memberList').value.trim().split('\n');
            ms.forEach(name => {
                if(!name.trim()) return;
                const rowData = currentDayData.find(d => d[0] === name.trim());
                addRowToTable(name.trim(), rowData);
            });
            for(let i=1; i<=6; i++) calcRanks(i);
        } else {
            firstCol.innerText = '実施日';
            saveBtn.style.display = 'none';
            const personData = allSheetData.filter(d => d.name === targetName);
            const dateGroups = [...new Set(personData.map(d => d.date))].sort((a,b) => b.localeCompare(a));
            dateGroups.forEach(date => {
                let row = [date, "", "", "", "", "", "", "", "", "", "", "", ""];
                ["1本目","2本目","3本目","4本目","5本目","追加"].forEach((lbl, i) => {
                    const rec = personData.find(d => d.date === date && d.count === lbl);
                    if (rec) { row[i*2+1] = rec.time; row[i*2+2] = getRankFromAll(date, lbl, rec.time); }
                });
                addRowToTable(date, row);
            });
        }
    }

    function addRowToTable(txt, data) {
        const tr = document.createElement('tr');
        let html = `<td class="col-name" style="background:#f9f9f9;">${txt}</td>`;
        for (let i = 0; i < 6; i++) {
            const time = data ? (data[i*2+1] || '') : '';
            const rank = data ? (data[i*2+2] || '-') : '-';
            html += `<td class="col-time"><input type="text" class="t-in" value="${time}" oninput="handleInput(this, ${i+1})" onblur="formatTimeInput(this, ${i+1})"></td><td class="col-rank rank-col-cell">${rank}</td>`;
        }
        tr.innerHTML = html;
        document.getElementById('pdfTableBody').appendChild(tr);
    }

    function getRankFromAll(date, count, time) {
        const sec = t2s(time);
        const dayRecs = allSheetData.filter(d => d.date === date && d.count === count);
        const times = dayRecs.map(d => t2s(d.time)).sort((a,b) => a-b);
        const r = times.indexOf(sec) + 1;
        return r > 0 ? r : "-";
    }

    function renderRanking() {
        const scope = document.getElementById('displayScope').value;
        const targetName = document.getElementById('filterSelect').value;
        const rBox2 = document.getElementById('rankLaps2');
        const rBox1 = document.getElementById('rankLaps1');

        if (scope === 'all') {
            document.getElementById('rankTitle2').innerText = "🏆 2周 歴代トップ5(全員)";
            document.getElementById('rankTitle1').innerText = "🏆 1周 歴代トップ5(全員)";
            let pB2 = {}; let pB1 = {};
            allSheetData.forEach(r => {
                const s = t2s(r.time);
                if (r.laps == "2") { if(!pB2[r.name] || s < pB2[r.name]) pB2[r.name] = s; }
                else if (r.laps == "1") { if(!pB1[r.name] || s < pB1[r.name]) pB1[r.name] = s; }
            });
            const draw = (el, obj) => {
                const arr = Object.entries(obj).sort((a,b) => a[1]-b[1]).slice(0,5);
                el.innerHTML = arr.map((x,i) => `<div class="rank-item"><span>${i+1}</span><span class="rank-name">${x[0]}</span><span class="rank-time">${s2t(x[1])}</span></div>`).join('') || 'なし';
            };
            draw(rBox2, pB2); draw(rBox1, pB1);
        } else {
            document.getElementById('rankTitle2').innerText = `🏆 ${targetName} 自己ベスト5 (2周)`;
            document.getElementById('rankTitle1').innerText = `🏆 ${targetName} 自己ベスト5 (1周)`;
            const myB2 = allSheetData.filter(d => d.name === targetName && d.laps == "2").sort((a,b) => t2s(a.time) - t2s(b.time)).slice(0,5);
            const myB1 = allSheetData.filter(d => d.name === targetName && d.laps == "1").sort((a,b) => t2s(a.time) - t2s(b.time)).slice(0,5);
            const drawMy = (el, arr) => {
                el.innerHTML = arr.map((x,i) => `<div class="rank-item"><span>${i+1}</span><span class="rank-name">${x.date}</span><span class="rank-time">${x.time}</span></div>`).join('') || 'なし';
            };
            drawMy(rBox2, myB2); drawMy(rBox1, myB1);
        }
    }

    // --- その他基本系 ---
    function t2s(v){ if(!v) return 9999; const sVal = v.toString(); if(!sVal.includes(':')) return parseFloat(sVal) || 0; const p = sVal.split(':'); return (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0); }
    function s2t(s) { if (!s || s === 9999) return ""; const m = Math.floor(s/60); const sec = Math.floor(s%60); return m + ":" + String(sec).padStart(2, '0'); }
    function formatTimeInput(el, colIdx) {
        let val = el.value.trim();
        if (/^\d{3,4}$/.test(val)) { el.value = val.slice(0, -2) + ":" + val.slice(-2); el.setAttribute('value', el.value); handleInput(el, colIdx); }
    }
    function handleInput(el, colIdx) { el.setAttribute('value', el.value); calcRanks(colIdx); updateGraph(); }
    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            const val = input ? input.value.trim() : "";
            if(val) times.push({ rowIndex: i, sec: t2s(val) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, idx) => { rows[t.rowIndex].cells[colIdx * 2].innerText = idx + 1; });
    }
    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true, ticks: { callback: v => s2t(v) } } } } });
    }
    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const fs = document.getElementById('filterSelect'); fs.innerHTML = '';
        ms.forEach(m => { if(!m.trim()) return; fs.add(new Option(m.trim(), m.trim())); });
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
        syncUI();
    }
    async function fetchAllData() {
        try {
            const res = await fetch(GAS_WEBAPP_URL);
            allSheetData = await res.json();
            syncUI();
        } catch (e) {}
    }
    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            currentDayData = result.found ? result.data : [];
            syncUI();
        } catch (e) {}
    }
    async function fetchDateHistory() {
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?mode=listDates`);
            const dates = await res.json();
            const select = document.getElementById('dateHistory');
            select.innerHTML = '<option value="">-- 履歴を選択 --</option>';
            dates.forEach(d => select.add(new Option(d, d)));
        } catch (e) {}
    }
    function syncDateAndLoad() {
        const sel = document.getElementById('dateHistory').value;
        if(sel) { document.getElementById('recordDate').value = sel; loadDateData(); }
    }
    function onDateChange() { loadDateData(); }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn'); const date = document.getElementById('recordDate').value; const rows = document.getElementById('pdfTableBody').rows;
        btn.disabled = true; btn.innerText = "同期中...";
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c*2-1].querySelector('input'); if (!input || !input.value.trim()) continue;
                const payload = { date, name: rows[r].cells[0].innerText, count: getLapLabel(c), laps: document.getElementById(`lap-${c}`).value, time: input.value.trim(), rank: rows[r].cells[c*2].innerText, memberList: document.getElementById('memberList').value };
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        btn.disabled = false; btn.innerText = "同期完了！"; await fetchAllData();
    }

    function preparePrint() {
        const showG = document.getElementById('check-graph').checked;
        const showR = document.getElementById('check-rank').checked;
        const showT = document.getElementById('check-table').checked;
        const scope = document.getElementById('displayScope').value;
        const target = document.getElementById('filterSelect').value;
        document.getElementById('section-graph').classList.toggle('print-hidden', !showG);
        document.getElementById('section-rank').classList.toggle('print-hidden', !showR);
        document.getElementById('section-table').classList.toggle('print-hidden', !showT);
        if ((showG || showR) && showT) document.getElementById('section-table').classList.add('force-page-break');
        else document.getElementById('section-table').classList.remove('force-page-break');
        document.getElementById('print-title').innerText = (scope === 'individual') ? `記録レポート: ${target}` : `トレーニング記録レポート`;
        document.getElementById('print-date-display').innerText = (scope === 'individual') ? `出力日: ${new Date().toLocaleDateString()}` : `実施日: ${document.getElementById('recordDate').value}`;
        window.print();
    }
</script>
</body>
</html>
