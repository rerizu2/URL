<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Boxing Tracker - Full Data Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f4f7f9; --pdf-header: #b2ffff; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 300px 1fr; gap: 15px; }
        
        /* 表のデザイン */
        .sheet-container { overflow-x: auto; }
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; background: #fff; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 4px; text-align: center; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-table input { width: 55px; border: none; text-align: center; font-size: 13px; background: transparent; }
        .rank-col { width: 30px; color: var(--primary); font-weight: bold; font-size: 11px; }

        .sync-status { font-size: 11px; color: #10b981; font-weight: bold; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 10px; }
        .chart-container { height: 300px; position: relative; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-grid">
        <div class="card">
            <h2>選手名簿 (確定)</h2>
            <textarea id="memberList" style="width:100%; height:120px; font-size:11px;">石橋 乃蒼&#10;川﨑 輝寅&#10;上窪 聖&#10;大畑 歩希&#10;志冨田 凪大&#10;亀本 快歩&#10;松嶋 虎鉄&#10;今井 仁&#10;岡田 陸翔&#10;濱田 周摩&#10;日高 心太&#10;井上 暁仁&#10;今中 悠人&#10;惣田 湧大&#10;髙峯 将真&#10;西岡 泰志&#10;福貴田 泰生&#10;栗原 翔&#10;岩原 晴斗&#10;杉阪 咲太&#10;安藤 心咲&#10;大西 義一&#10;岸上 虎央&#10;南 悠翔&#10;石橋 奈樹&#10;志冨田 明陽&#10;木下 一颯&#10;道下 大翔&#10;柏木 羽空</textarea>
            <button onclick="applyMembers()" style="width:100%; padding:5px; margin-top:5px; font-size:10px;">リスト更新</button>
            
            <label style="display:block; margin-top:15px; font-weight:bold;">日付選択</label>
            <input type="date" id="recordDate" style="width:100%; padding:8px; margin-top:5px;" onchange="loadDateData()">
            <p style="font-size:10px; color:#666; margin-top:5px;">※日付を変えると、その日のデータをシートから読み込みます。</p>
        </div>

        <div class="card">
            <h2>成長グラフ</h2>
            <div class="chart-container"><canvas id="runChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div class="sync-status">
            <span id="connLabel">● スプレッドシート同期モード</span>
            <span id="lastSync" style="color:#666; font-weight:normal;">最終更新: ---</span>
        </div>
        <div class="sheet-container">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th style="width:120px;">週 × 本</th>
                        <th>1本目</th><th class="rank-col">順位</th>
                        <th>2本目</th><th class="rank-col">順位</th>
                        <th>3本目</th><th class="rank-col">順位</th>
                        <th>4本目</th><th class="rank-col">順位</th>
                        <th>5本目</th><th class="rank-col">順位</th>
                        <th>追加</th><th class="rank-col">順位</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">すべての記録をスプレッドシートへ送信・上書き</button>
    </div>
</div>

<script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxeLTrBtHEZFCkz_xBCWl-Er7sScHdkKLaddlFz-OPf5diEmxVcw9ZnnAJ-EBXD2BtOLQ/exec"; 
    let chart;
    const colors = ['#e63946', '#457b9d', '#2a9d8f', '#f4a261', '#1d3557'];

    window.onload = () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        applyMembers();
        initChart();
        loadDateData(); // 起動時に今日の日付のデータを読込
    };

    // スプレッドシートから特定の日付のデータを読み込んで表に入れる
    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        
        document.getElementById('connLabel').innerText = "⌛ データ読込中...";
        try {
            const response = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await response.json();
            
            // 入力欄と順位をリセット
            document.querySelectorAll('.t-in').forEach(el => el.value = '');
            document.querySelectorAll('.rank-col-cell').forEach(el => el.innerText = '-');

            if (result.found) {
                const sheetData = result.data; // スプレッドシートの行列
                const header = sheetData[0];
                const rows = document.getElementById('pdfTableBody').rows;

                for (let i = 1; i < sheetData.length; i++) {
                    const rowData = sheetData[i];
                    const name = rowData[0];
                    // HTMLの表から同じ名前の行を探す
                    for (let r = 0; r < rows.length; r++) {
                        if (rows[r].cells[0].innerText === name) {
                            // タイムと順位をセット
                            for (let c = 1; c <= 6; c++) {
                                const timeVal = rowData[c * 2 - 1];
                                const rankVal = rowData[c * 2];
                                rows[r].cells[c * 2 - 1].querySelector('input').value = timeVal || '';
                                rows[r].cells[c * 2].innerText = rankVal || '-';
                            }
                            break;
                        }
                    }
                }
                document.getElementById('connLabel').innerText = "● 読込完了";
            } else {
                document.getElementById('connLabel').innerText = "● 新規データ作成";
            }
            updateGraph(); // グラフもついでに更新
        } catch (e) {
            document.getElementById('connLabel').innerText = "● 接続エラー";
        }
    }

    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        tbody.innerHTML = '';
        ms.forEach((m, idx) => {
            const name = m.trim(); if(!name) return;
            const tr = document.createElement('tr');
            let html = `<td style="font-weight:bold; background:#f9f9f9; text-align:left; padding-left:10px;">${name}</td>`;
            for(let i=1; i<=6; i++){
                const countLabel = i === 6 ? "追加" : i + "本目";
                html += `<td><input type="text" class="t-in" data-name="${name}" data-count="${countLabel}" oninput="calcRanks(${i})"></td>
                         <td class="rank-col rank-col-cell" id="rank-${idx}-${i}">-</td>`;
            }
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            const val = input.value.trim();
            if(val && (val.includes(':') || !isNaN(val))){
                times.push({ rowIndex: i, sec: t2s(val) });
            }
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, index) => {
            rows[t.rowIndex].cells[colIdx * 2].innerText = index + 1;
        });
    }

    function t2s(v){
        if(!v.toString().includes(':')) return parseFloat(v) || 0;
        const p = v.split(':'); return parseInt(p[0])*60 + parseInt(p[1]);
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const inputs = document.querySelectorAll('.t-in');
        btn.disabled = true; btn.innerText = "同期中...";

        for (const input of inputs) {
            const time = input.value.trim();
            if (!time) continue;
            const rank = input.parentElement.nextElementSibling.innerText;
            const payload = { date, name: input.dataset.name, count: input.dataset.count, time, rank, memberList: document.getElementById('memberList').value };
            await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        }
        btn.disabled = false; btn.innerText = "送信完了！";
        document.getElementById('lastSync').innerText = "同期完了: " + new Date().toLocaleTimeString();
        updateGraph();
    }

    async function updateGraph() {
        const response = await fetch(GAS_WEBAPP_URL);
        const records = await response.json();
        const filter = "all";
        const dataMap = {}; const labelSet = new Set();
        records.forEach(r => {
            const label = `${r.date}(${r.count})`;
            labelSet.add(label);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][label] = t2s(r.time);
        });
        const sortedLabels = Array.from(labelSet).sort();
        const datasets = [];
        Object.keys(dataMap).forEach((name, i) => {
            datasets.push({ label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: colors[i % colors.length], tension: 0.3, spanGaps: true, pointRadius: 3 });
        });
        chart.data.labels = sortedLabels; chart.data.datasets = datasets; chart.update();
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true, ticks: { callback: v => Math.floor(v/60) + ":" + String(v%60).padStart(2, '0') } } } } });
    }
</script>
</body>
</html>
