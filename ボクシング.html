<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ボクシング記録 - 印刷高度設定版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style id="dynamic-print-style">
        /* JavaScriptで動的に上書きされます */
    </style>
    <style>
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f0f2f5; --pdf-header: #b2ffff; }
        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        
        /* テーブルスタイル */
        .pdf-table { width: 100%; border-collapse: collapse; border: 1px solid #000; background: #fff; table-layout: fixed; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 4px 2px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .pdf-table thead th { background: var(--pdf-header); font-size: 11px; }
        .col-name { width: 110px; text-align: left !important; padding-left: 5px !important; }
        .col-time { width: 55px; }
        .col-rank { width: 28px; color: var(--primary); font-weight: bold; }
        .pdf-table input { width: 95%; border: none; text-align: center; font-size: 13px; background: transparent; outline: none; }
        .lap-edit { width: 30px !important; border: 1px solid #ccc !important; background: #fff !important; color: var(--primary); font-weight: bold; border-radius: 3px; }

        .dashboard-grid { display: grid; grid-template-columns: 300px 1fr; gap: 15px; }
        .chart-container { height: 300px; position: relative; margin-bottom: 10px; }
        
        /* ランキング */
        .ranking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .rank-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; }
        .rank-item { display: flex; align-items: center; border-bottom: 1px solid #eee; padding: 2px 0; font-size: 11px; }
        .rank-name { flex: 1; font-weight: bold; margin-left: 5px; overflow: hidden; text-overflow: ellipsis; }
        .rank-time { font-family: monospace; color: var(--primary); font-weight: bold; }

        /* 印刷設定UI */
        .no-print-area { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 2px solid var(--secondary); }
        .print-options { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
        .print-btn { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        select.print-select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }

        @media print {
            .no-print, .no-print-area, #saveBtn, .dashboard-grid > .card:first-child, .lap-edit, button, select:not(.print-select), hr { display: none !important; }
            .print-hidden { display: none !important; }
            .dashboard-grid { display: block; }
            .card { box-shadow: none; border: none; padding: 0; margin-bottom: 20px; }
            .print-only-header { display: block !important; text-align: center; border-bottom: 1px solid #000; margin-bottom: 10px; }
            
            /* 改ページ指定用のクラス */
            .page-break { page-break-before: always; }
            
            /* 印刷時のテーブル微調整 */
            .pdf-table { table-layout: fixed; width: 100% !important; }
            .pdf-table th, .pdf-table td { font-size: 9px; padding: 2px 1px !important; }
            input { border: none !important; font-size: 9px !important; }
        }
        .print-only-header { display: none; }
    </style>
</head>
<body>

<div class="print-only-header">
    <h2 id="print-title" style="margin:0;">ボクシング トレーニング記録</h2>
    <p id="print-date-display" style="margin:5px 0; font-size:12px;"></p>
</div>

<div class="container">
    <!-- 印刷コントロールパネル -->
    <div class="no-print-area">
        <div style="font-weight:bold; color:var(--secondary);">🖨 印刷・PDF詳細設定</div>
        <div class="print-options">
            <label><input type="checkbox" id="check-graph" checked> グラフ</label>
            <label><input type="checkbox" id="check-rank" checked> ランキング</label>
            <label><input type="checkbox" id="check-table" checked> タイム記録表</label>
            
            <span style="margin-left:10px; border-left:1px solid #ccc; padding-left:15px;">向き:</span>
            <select id="print-orientation" class="print-select">
                <option value="landscape">横向き (推奨)</option>
                <option value="portrait">縦向き</option>
            </select>

            <button class="print-btn" onclick="preparePrint()">PDF印刷を実行</button>
        </div>
        <div style="font-size:11px; color:#666; margin-top:8px;">
            ※「グラフ/ランキング」と「記録表」の両方にチェックがある場合、記録表は自動的に<b>2枚目</b>に配置されます。
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <label style="font-weight:bold;">履歴選択</label>
            <select id="dateHistory" onchange="syncDateAndLoad()" style="width:100%; padding:5px; margin-bottom:10px;"><option value="">-- 読込中 --</option></select>
            <input type="date" id="recordDate" onchange="onDateChange()" style="width:100%; padding:5px; margin-bottom:15px;">
            <hr>
            <h2 style="font-size:14px;">選手名簿</h2>
            <textarea id="memberList" style="width:100%; height:150px; font-size:11px;"></textarea>
            <button onclick="applyMembers()" style="width:100%; padding:5px; background:#6c757d; color:#fff; border:none; border-radius:4px; cursor:pointer;">名簿更新</button>
        </div>

        <div class="card" id="card-analysis">
            <div id="section-graph">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="font-size:14px; margin:0;">成長・分析グラフ</h2>
                    <div class="no-print">
                        <select id="filterSelect" onchange="updateGraph()" style="font-size:11px;"></select>
                    </div>
                </div>
                <div class="chart-container"><canvas id="runChart"></canvas></div>
            </div>

            <div class="ranking-grid" id="section-rank">
                <div class="rank-box">
                    <h3 style="text-align:center; font-size:11px; margin:0 0 5px 0;">🏆 2周区間ベスト5</h3>
                    <div id="rankLaps2"></div>
                </div>
                <div class="rank-box">
                    <h3 style="text-align:center; font-size:11px; margin:0 0 5px 0;">🏆 1周区間ベスト5</h3>
                    <div id="rankLaps1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 記録表セクション -->
    <div class="card" id="section-table">
        <div style="overflow-x: auto;">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th class="col-name">氏名</th>
                        <th class="col-time">1本目(<input type="number" class="lap-edit" id="lap-1" value="2">周)</th><th class="col-rank">順</th>
                        <th class="col-time">2本目(<input type="number" class="lap-edit" id="lap-2" value="2">周)</th><th class="col-rank">順</th>
                        <th class="col-time">3本目(<input type="number" class="lap-edit" id="lap-3" value="1">周)</th><th class="col-rank">順</th>
                        <th class="col-time">4本目(<input type="number" class="lap-edit" id="lap-4" value="1">周)</th><th class="col-rank">順</th>
                        <th class="col-time">5本目(<input type="number" class="lap-edit" id="lap-5" value="1">周)</th><th class="col-rank">順</th>
                        <th class="col-time">追加(<input type="number" class="lap-edit" id="lap-6" value="1">周)</th><th class="col-rank">順</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">すべての記録を保存同期</button>
    </div>

    <div class="card no-print">
        <h2 style="font-size:14px; margin-top:0;">ラップタイム算早見表 (印刷対象外)</h2>
        <div style="overflow-x:auto;">
            <table class="pdf-table" style="table-layout: auto;">
                <tbody id="refTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4wv9HDVi099vlKKXq_whz6uQ1X-tQ5E1D47-xbi7Un_KkNO00yp7obVCsp-3201lL9Q/exec"; 
    const PERMANENT_MEMBERS = "石橋 乃蒼\n川﨑 輝寅\n上窪 聖\n大畑 歩希\n志冨田 凪大\n亀本 快歩\n松嶋 虎鉄\n今井 仁\n岡田 陸翔\n濱田 周摩\n日高 心太\n井上 暁仁\n今中 悠人\n惣田 湧大\n髙峯 将真\n西岡 泰志\n福貴田 泰生\n栗原 翔\n岩原 晴斗\n杉阪 咲太\n安藤 心咲\n大西 義一\n岸上 虎央\n南 悠翔\n石橋 奈樹\n志冨田 明陽\n木下 一颯\n道下 大翔\n柏木 羽空";
    
    let chart;
    const colors = ['#e63946', '#457b9d', '#2a9d8f', '#f4a261', '#1d3557', '#8b5cf6', '#6d597a'];
    let allSheetData = [];

    window.onload = async () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || PERMANENT_MEMBERS;
        applyMembers();
        initChart();
        generateRefTable();
        await fetchDateHistory();
        await fetchAllData();
        await loadDateData();
    };

    function preparePrint() {
        const showGraph = document.getElementById('check-graph').checked;
        const showRank = document.getElementById('check-rank').checked;
        const showTable = document.getElementById('check-table').checked;
        const orientation = document.getElementById('print-orientation').value;

        // 1. 向きの動的適用
        document.getElementById('dynamic-print-style').innerHTML = `
            @media print {
                @page { size: A4 ${orientation}; margin: 8mm; }
                ${orientation === 'portrait' ? '.pdf-table { font-size: 7px !important; } .col-name { width: 70px !important; }' : ''}
            }
        `;

        // 2. 表示・非表示の切り替え
        document.getElementById('section-graph').classList.toggle('print-hidden', !showGraph);
        document.getElementById('section-rank').classList.toggle('print-hidden', !showRank);
        document.getElementById('section-table').classList.toggle('print-hidden', !showTable);
        document.getElementById('card-analysis').classList.toggle('print-hidden', (!showGraph && !showRank));

        // 3. 改ページの制御 (グラフ/ランクのいずれかがあり、かつテーブルもある場合)
        if ((showGraph || showRank) && showTable) {
            document.getElementById('section-table').classList.add('page-break');
        } else {
            document.getElementById('section-table').classList.remove('page-break');
        }

        // 4. ヘッダー情報の更新
        document.getElementById('print-date-display').innerText = `記録実施日: ${document.getElementById('recordDate').value}`;
        
        // 5. 入力値の属性固定 (ブラウザ印刷バグ対策)
        document.querySelectorAll('input').forEach(input => {
            input.setAttribute('value', input.value);
        });

        // 6. 実行
        window.print();
    }

    // --- ロジック部分は前回同様 ---
    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { reverse: true, ticks: { font: { size: 10 }, callback: v => s2t(v) } },
                    x: { ticks: { font: { size: 9 } } }
                }
            }
        });
    }

    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        const fs = document.getElementById('filterSelect');
        const cur = fs.value;
        tbody.innerHTML = '';
        fs.innerHTML = '<option value="all">全員表示</option>';
        ms.forEach(m => {
            if(!m.trim()) return;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-name">${m.trim()}</td>` +
                           Array(6).fill(0).map((_,i) => `<td class="col-time"><input type="text" class="t-in" oninput="handleInput(this, ${i+1})"></td><td class="col-rank rank-col-cell">-</td>`).join('');
            tbody.appendChild(tr);
            fs.add(new Option(m.trim(), m.trim()));
        });
        fs.value = cur;
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
    }

    function handleInput(el, colIdx) {
        el.setAttribute('value', el.value);
        calcRanks(colIdx);
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            const val = input.value.trim();
            if(val) times.push({ rowIndex: i, sec: t2s(val) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, idx) => { rows[t.rowIndex].cells[colIdx * 2].innerText = idx + 1; });
    }

    async function syncDateAndLoad() {
        const sel = document.getElementById('dateHistory').value;
        if(sel) { document.getElementById('recordDate').value = sel; await loadDateData(); updateGraph(); }
    }
    async function onDateChange() { await loadDateData(); updateGraph(); }

    async function fetchDateHistory() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?mode=listDates`);
            const dates = await res.json();
            const select = document.getElementById('dateHistory');
            select.innerHTML = '<option value="">-- 過去の練習日を選択 --</option>';
            dates.forEach(d => select.add(new Option(d, d)));
        } catch (e) {}
    }

    async function fetchAllData() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(GAS_WEBAPP_URL);
            allSheetData = await res.json();
            updateGraph();
            renderRanking();
        } catch (e) {}
    }

    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            document.querySelectorAll('.t-in').forEach(el => { el.value = ''; el.setAttribute('value', ''); });
            document.querySelectorAll('.rank-col-cell').forEach(el => el.innerText = '-');
            if (result.found) {
                const sheetData = result.data;
                const rows = document.getElementById('pdfTableBody').rows;
                for(let c=1; c<=6; c++){
                    const h = sheetData[0][c*2-1];
                    if(h && h.includes('周')) {
                        const val = h.match(/\d+/)[0];
                        document.getElementById(`lap-${c}`).value = val;
                        document.getElementById(`lap-${c}`).setAttribute('value', val);
                    }
                }
                for (let i = 1; i < sheetData.length; i++) {
                    for (let r = 0; r < rows.length; r++) {
                        if (rows[r].cells[0].innerText.trim() === sheetData[i][0].trim()) {
                            for (let c = 1; c <= 6; c++) {
                                const val = sheetData[i][c * 2 - 1] || '';
                                const input = rows[r].cells[c * 2 - 1].querySelector('input');
                                input.value = val; input.setAttribute('value', val);
                                rows[r].cells[c * 2].innerText = sheetData[i][c * 2] || '-';
                            }
                            break;
                        }
                    }
                }
            }
        } catch (e) {}
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('pdfTableBody').rows;
        btn.disabled = true; btn.innerText = "同期中...";
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c * 2 - 1].querySelector('input');
                if (!input.value.trim()) continue;
                const laps = document.getElementById(`lap-${c}`).value;
                const count = ["1本目", "2本目", "3本目", "4本目", "5本目", "追加"][c-1];
                const payload = { date, name: rows[r].cells[0].innerText, count, laps, time: input.value.trim(), rank: rows[r].cells[c * 2].innerText, memberList: document.getElementById('memberList').value };
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        btn.disabled = false; btn.innerText = "保存完了！";
        await fetchAllData();
    }

    function updateGraph() {
        if(!chart) return;
        const filter = document.getElementById('filterSelect').value;
        let filtered = allSheetData.filter(r => (filter === 'all' || r.name === filter));
        const dataMap = {}; const labelSet = new Set();
        filtered.forEach(r => {
            const label = `${r.date} (${r.count})`;
            labelSet.add(label);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][label] = t2s(r.time);
        });
        const sortedLabels = Array.from(labelSet).sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).slice(-20);
        const datasets = Object.keys(dataMap).map((name, i) => ({ label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: colors[i % colors.length], tension: 0.3, spanGaps: true, pointRadius: 3 }));
        chart.data.labels = sortedLabels; chart.data.datasets = datasets; chart.update();
    }

    function renderRanking() {
        let pBest2 = {}; let pBest1 = {};
        allSheetData.forEach(r => {
            const sec = t2s(r.time);
            if (r.laps == "2") { if (!pBest2[r.name] || sec < pBest2[r.name]) pBest2[r.name] = sec; }
            else if (r.laps == "1") { if (!pBest1[r.name] || sec < pBest1[r.name]) pBest1[r.name] = sec; }
        });
        const draw = (id, obj) => {
            const arr = Object.entries(obj).sort((a,b) => a[1]-b[1]).slice(0,5);
            document.getElementById(id).innerHTML = arr.map((x,i) => `<div class="rank-item"><span>${i+1}</span><span class="rank-name">${x[0]}</span><span class="rank-time">${s2t(x[1])}</span></div>`).join('') || 'なし';
        };
        draw('rankLaps2', pBest2); draw('rankLaps1', pBest1);
    }

    function generateRefTable() {
        const tbody = document.getElementById('refTableBody');
        const dists = [1, 2, 3, 4, 6, 8, 10, 12, 15, 30];
        for (let b = 13.0; b <= 25.0; b += 1.0) {
            const tr = document.createElement('tr');
            dists.forEach((d) => {
                const td = document.createElement('td');
                td.innerText = s2t_pdf(b * d);
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    }

    function s2t(s) {
        if (!s && s!==0) return "";
        const m = Math.floor(s/60);
        const sec = Math.floor(s%60);
        return m + ":" + String(sec).padStart(2, '0');
    }
    function s2t_pdf(s) {
        const m = Math.floor(s/60);
        const sec = (s%60).toFixed(1);
        return m + "'" + String(sec).padStart(4, '0');
    }
    function t2s(v){
        if(!v || !v.toString().includes(':')) return parseFloat(v) || 0;
        const p = v.split(':'); return parseInt(p[0])*60 + parseInt(p[1]);
    }
</script>
</body>
</html>
