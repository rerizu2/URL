<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Boxing Tracker - Spreadsheet Grid Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #e63946; --secondary: #1d3557; --bg: #f4f7f9;
            --pdf-header: #b2ffff; --pdf-yellow: #ffff00;
        }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 300px 1fr; gap: 15px; }
        
        /* 入力テーブル（画像再現） */
        .sheet-container { overflow-x: auto; }
        .pdf-entry-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; }
        .pdf-entry-table th, .pdf-entry-table td { border: 1px solid #000; padding: 4px; text-align: center; }
        .pdf-entry-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-entry-table input { width: 55px; border: 1px solid #eee; text-align: center; font-size: 13px; }
        .rank-col { width: 30px; color: var(--primary); font-weight: bold; font-size: 11px; background: #fafafa; }

        textarea { width: 100%; height: 150px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-main { background: var(--secondary); color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-send { background: var(--primary); font-size: 15px; padding: 18px; }
        
        .sync-status { font-size: 11px; color: #10b981; font-weight: bold; margin-bottom: 10px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-grid">
        <div class="card">
            <h2>選手名簿 (確定)</h2>
            <textarea id="memberList">石橋 乃蒼&#10;川﨑 輝寅&#10;上窪 聖&#10;大畑 歩希&#10;志冨田 凪大&#10;亀本 快歩&#10;松嶋 虎鉄&#10;今井 仁&#10;岡田 陸翔&#10;濱田 周摩&#10;日高 心太&#10;井上 暁仁&#10;今中 悠人&#10;惣田 湧大&#10;髙峯 将真&#10;西岡 泰志&#10;福貴田 泰生&#10;栗原 翔&#10;岩原 晴斗&#10;杉阪 咲太&#10;安藤 心咲&#10;大西 義一&#10;岸上 虎央&#10;南 悠翔&#10;石橋 奈樹&#10;志冨田 明陽&#10;木下 一颯&#10;道下 大翔&#10;柏木 羽空</textarea>
            <button class="btn-main" style="background:#6c757d; font-size:11px;" onclick="applyMembers()">リストを更新（表に反映）</button>
            <label style="display:block; margin-top:15px; font-weight:bold;">日付選択</label>
            <input type="date" id="recordDate" style="width:100%; padding:8px; box-sizing:border-box;">
        </div>

        <div class="card">
            <h2>成長グラフ</h2>
            <div style="height: 300px;"><canvas id="runChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div class="sync-status">● スプレッドシート連携：画像と同じ形式で保存されます</div>
        <div class="sheet-container">
            <table class="pdf-entry-table">
                <thead>
                    <tr>
                        <th style="width:120px;">週 × 本</th>
                        <th>1本目</th><th class="rank-col">順位</th>
                        <th>2本目</th><th class="rank-col">順位</th>
                        <th>3本目</th><th class="rank-col">順位</th>
                        <th>4本目</th><th class="rank-col">順位</th>
                        <th>5本目</th><th class="rank-col">順位</th>
                        <th>追加</th><th class="rank-col">順位</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-main btn-send" onclick="saveAllSheetData()">すべての記録をスプレッドシートへ送信・上書き保存</button>
    </div>
</div>

<script>
    // ==========================================
    // GASのウェブアプリURLをここに貼り付けてください
    // ==========================================
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzMME9FJxajLOA3Jd9TwTQOlTGJVM9uumeKmOQW-Vb9pGxQrf7lRs8m8GuLWtnmP2H30Q/exec"; 

    let chart;
    const colors = ['#e63946', '#457b9d', '#2a9d8f', '#f4a261', '#1d3557', '#8b5cf6'];

    window.onload = () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        if(localStorage.getItem('boxing_members')) document.getElementById('memberList').value = localStorage.getItem('boxing_members');
        applyMembers();
        initChart();
    };

    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        tbody.innerHTML = '';
        ms.forEach((m, idx) => {
            const name = m.trim(); if(!name) return;
            const tr = document.createElement('tr');
            let html = `<td style="font-weight:bold; background:#f9f9f9; text-align:left; padding-left:10px;">${name}</td>`;
            for(let i=1; i<=6; i++){
                const countLabel = i === 6 ? "追加" : i + "本目";
                html += `<td><input type="text" class="t-in" data-name="${name}" data-count="${countLabel}" oninput="calcRanks(${i})"></td>
                         <td class="rank-col" id="rank-${idx}-${i}">-</td>`;
            }
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].querySelectorAll('.t-in')[colIdx-1];
            const val = input.value.trim();
            if(val && (val.includes(':') || !isNaN(val))){
                times.push({ rowIndex: i, sec: t2s(val) });
            }
            document.getElementById(`rank-${i}-${colIdx}`).innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec);
        times.forEach((t, index) => {
            document.getElementById(`rank-${t.rowIndex}-${colIdx}`).innerText = index + 1;
        });
    }

    function t2s(v){
        if(!v.includes(':')) return parseFloat(v);
        const p = v.split(':'); return parseInt(p[0])*60 + parseInt(p[1]);
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const memberListText = document.getElementById('memberList').value;
        const inputs = document.querySelectorAll('.t-in');
        
        btn.disabled = true; btn.innerText = "スプレッドシートの表を更新中...";

        for (const input of inputs) {
            const time = input.value.trim();
            if (!time) continue;

            // 画面上の順位を取得
            const parentTd = input.parentElement;
            const rankTd = parentTd.nextElementSibling;
            const rank = rankTd.innerText;

            const payload = {
                date: date,
                name: input.dataset.name,
                count: input.dataset.count,
                time: time,
                rank: rank,
                memberList: memberListText // 新規シート作成用
            };

            if (GAS_WEBAPP_URL.startsWith('http')) {
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        btn.disabled = false; btn.innerText = "同期完了！スプレッドシートを確認してください";
        setTimeout(() => btn.innerText = "すべての記録をスプレッドシートへ送信・上書き保存", 3000);
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true } } } });
    }
</script>
</body>
</html>
