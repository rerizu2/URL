<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ボクシングタイム記録</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style id="dynamic-print-style"></style>
    <style>
        /* --- デザイン設定 --- */
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f0f2f5; --pdf-header: #b2ffff; --pdf-yellow: #ffff00; --pdf-male: #00ffff; --pdf-female: #ff0000; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; color: #333; }
        
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1d3557; display: flex; align-items: center; justify-content: center;
            z-index: 9999; color: white; flex-direction: column; font-family: sans-serif;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center; color: #333;
        }
        .login-box input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { background: #e63946; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }

        #app-content { display: none; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 15px; }
        
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #000; background: #fff; table-layout: fixed; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 5px 2px; text-align: center; overflow: hidden; white-space: nowrap; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: normal; }
        .pdf-table input { width: 95%; border: none; text-align: center; font-size: 13px; background: transparent; }
        
        .col-name { width: 130px; text-align: left !important; padding-left: 5px !important; font-weight: bold; }
        .col-time { width: 60px; }
        .col-rank { width: 30px; color: var(--primary); font-weight: bold; font-size: 11px; }
        .lap-edit { width: 35px !important; border: 1px solid #ccc !important; background: #fff !important; color: var(--primary); font-weight: bold; border-radius: 3px; }

        .ranking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .rank-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .rank-item { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 11px; }
        .rank-name { flex: 1; font-weight: bold; margin-left: 10px; overflow: hidden; text-overflow: ellipsis; }
        .rank-time { font-family: monospace; color: var(--primary); font-weight: bold; }

        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        .chart-container { height: 400px; position: relative; }

        .no-print-area { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 2px solid var(--secondary); display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .print-btn { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* 特殊色 */
        .col-y { background: var(--pdf-yellow) !important; }
        .highlight-male { background-color: var(--pdf-male) !important; font-weight: bold; }
        .highlight-female { background-color: var(--pdf-female) !important; color: white; font-weight: bold; }

        @media print {
            @page { margin: 5mm; }
            .no-print, .no-print-area, #saveBtn, .lap-edit, button, select, hr { display: none !important; }
            .print-hidden { display: none !important; }
            .force-page-break { page-break-before: always !important; }
            .dashboard-grid { display: block; }
            .card { box-shadow: none; border: none; padding: 0; }
            .pdf-table { width: 100% !important; min-width: 100% !important; }
            .print-only-header { display: block !important; text-align: center; }
        }
        .print-only-header { display: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>Boxing Training Auth</h2>
        <p>パスワードを入力してください</p>
        <input type="password" id="password-input" placeholder="Password">
        <button onclick="checkPassword()">ログイン</button>
    </div>
</div>

<div id="app-content">
    <div class="print-only-header">
        <h2 id="print-title">トレーニング記録レポート</h2>
        <p id="print-date-display"></p>
    </div>

    <div class="container">
        <div class="no-print-area">
            <strong>印刷設定:</strong>
            <label><input type="checkbox" id="check-graph" checked> グラフ</label>
            <label><input type="checkbox" id="check-rank" checked> ランキング</label>
            <label><input type="checkbox" id="check-table" checked> 記録表</label>
            <select id="print-orientation"><option value="landscape">横向き</option><option value="portrait">縦向き</option></select>
            <button class="print-btn" onclick="preparePrint()">印刷・PDF保存</button>
        </div>

        <div class="dashboard-grid">
            <div class="card no-print">
                <label>履歴選択</label>
                <select id="dateHistory" onchange="syncDateAndLoad()" style="width:100%; padding:8px; margin-bottom:10px;"><option value="">履歴を読み込み中...</option></select>
                <input type="date" id="recordDate" onchange="onDateChange()" style="width:100%; padding:8px; margin-bottom:15px;">
                <hr>
                <h2>選手名簿（1行1名）</h2>
                <textarea id="memberList" style="width:100%; height:150px; font-size:11px;" placeholder="選手名を入力してください"></textarea>
                <button onclick="applyMembers()" style="width:100%; padding:8px; background:#6c757d; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-top:5px;">名簿更新・表作成</button>
            </div>

            <div class="card" id="card-analysis">
                <div id="section-graph">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h2 style="margin:0;">成長分析グラフ</h2>
                        <div class="no-print">
                            <select id="displayScope" onchange="syncUI()"><option value="all">全員表示</option><option value="individual">個人表示</option></select>
                            <select id="filterSelect" onchange="syncUI()" style="display:none;"></select>
                            <select id="graphRange" onchange="syncUI()"><option value="all">全期間</option><option value="today">本日のみ</option></select>
                        </div>
                    </div>
                    <div class="chart-container"><canvas id="runChart"></canvas></div>
                </div>

                <div class="ranking-grid" id="section-rank">
                    <div class="rank-box"><h3 id="rankTitle2" style="text-align:center; font-size:11px; margin-top:0;">🏆 2周ランキング</h3><div id="rankLaps2"></div></div>
                    <div class="rank-box"><h3 id="rankTitle1" style="text-align:center; font-size:11px; margin-top:0;">🏆 1周ランキング</h3><div id="rankLaps1"></div></div>
                </div>
            </div>
        </div>

        <div class="card" id="section-table">
            <div style="overflow-x: auto;">
                <table class="pdf-table" id="mainTable">
                    <thead>
                        <tr>
                            <th class="col-name" id="table-first-col">氏名</th>
                            <th class="col-time">1本目(<input type="number" class="lap-edit" id="lap-1" value="2">)</th><th class="col-rank">順</th>
                            <th class="col-time">2本目(<input type="number" class="lap-edit" id="lap-2" value="2">)</th><th class="col-rank">順</th>
                            <th class="col-time">3本目(<input type="number" class="lap-edit" id="lap-3" value="1">)</th><th class="col-rank">順</th>
                            <th class="col-time">4本目(<input type="number" class="lap-edit" id="lap-4" value="1">)</th><th class="col-rank">順</th>
                            <th class="col-time">5本目(<input type="number" class="lap-edit" id="lap-5" value="1">)</th><th class="col-rank">順</th>
                            <th class="col-time">追加(<input type="number" class="lap-edit" id="lap-6" value="1">)</th><th class="col-rank">順</th>
                        </tr>
                    </thead>
                    <tbody id="pdfTableBody"></tbody>
                </table>
            </div>
            <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">クラウドに同期保存</button>
        </div>

        <div class="card no-print">
            <h2 style="text-align:center; font-size:20px;">ラップタイム早見表</h2>
            <div style="overflow-x:auto;"><table class="pdf-table" style="table-layout: auto;"><thead id="refHead"></thead><tbody id="refTableBody"></tbody></table></div>
        </div>
    </div>
</div>

<script>
    const CORRECT_PASSWORD = "ojithsboxing";
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4wv9HDVi099vlKKXq_whz6uQ1X-tQ5E1D47-xbi7Un_KkNO00yp7obVCsp-3201lL9Q/exec"; 
    
    let chart;
    let allSheetData = []; 
    let currentDayData = [];

    function checkPassword() {
        if (document.getElementById('password-input').value === CORRECT_PASSWORD) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            sessionStorage.setItem('isBoxingAuth', 'true');
            initApp();
        } else { alert('パスワードが違います'); }
    }

    async function initApp() {
        // 1. 日付設定
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        
        // 2. 名簿の初期化 (Local Storage or Default)
        let savedMembers = localStorage.getItem('boxing_members');
        if (!savedMembers) {
            savedMembers = "選手A\n選手B\n選手C"; // サンプル
            localStorage.setItem('boxing_members', savedMembers);
        }
        document.getElementById('memberList').value = savedMembers;

        // 3. グラフ初期化
        initChart();
        generateRefTable();

        // 4. 即座に表と名簿をレンダリング (通信を待たずに表示)
        applyMembers(); 

        // 5. 非同期でデータを取得して更新
        fetchDateHistory();
        await fetchAllData();
        await loadDateData();
    }

    function applyMembers() {
        const list = document.getElementById('memberList').value.trim();
        localStorage.setItem('boxing_members', list);
        
        const names = list.split('\n').map(n => n.trim()).filter(n => n !== "");
        const fs = document.getElementById('filterSelect');
        fs.innerHTML = '';
        names.forEach(n => fs.add(new Option(n, n)));
        
        syncUI(); // 表とグラフを更新
    }

    function syncUI() {
        renderTable();
        renderRanking();
        updateGraph();
    }

    function renderTable() {
        const scope = document.getElementById('displayScope').value;
        const targetName = document.getElementById('filterSelect').value;
        const tbody = document.getElementById('pdfTableBody');
        if(!tbody) return;
        tbody.innerHTML = '';

        if (scope === 'all') {
            document.getElementById('table-first-col').innerText = '氏名';
            const names = document.getElementById('memberList').value.split('\n').filter(n => n.trim() !== "");
            names.forEach(name => {
                const rowData = currentDayData.find(d => d[0] === name.trim());
                addRowToTable(name.trim(), rowData);
            });
            for(let i=1; i<=6; i++) calcRanks(i);
        } else {
            document.getElementById('table-first-col').innerText = '実施日';
            const personData = allSheetData.filter(d => d.name === targetName);
            const dates = [...new Set(personData.map(d => d.date))].sort((a,b) => b.localeCompare(a));
            dates.forEach(date => {
                let row = [date];
                for(let i=1; i<=6; i++) {
                    const rec = personData.find(d => d.date === date && d.count === getLapLabel(i));
                    row.push(rec ? rec.time : "", "");
                }
                addRowToTable(date, row);
            });
        }
    }

    function addRowToTable(txt, data) {
        const tr = document.createElement('tr');
        let html = `<td class="col-name">${txt}</td>`;
        for (let i = 0; i < 6; i++) {
            const time = data ? (data[i*2+1] || '') : '';
            const rank = data ? (data[i*2+2] || '-') : '-';
            html += `<td class="col-time"><input type="text" value="${time}" oninput="handleInput(this, ${i+1})" onblur="formatTimeInput(this, ${i+1})"></td><td class="col-rank">${rank}</td>`;
        }
        tr.innerHTML = html;
        document.getElementById('pdfTableBody').appendChild(tr);
    }

    function handleInput(el, colIdx) {
        el.setAttribute('value', el.value);
        calcRanks(colIdx);
        updateGraph();
    }

    function formatTimeInput(el, colIdx) {
        let val = el.value.trim();
        if (/^\d{3,4}$/.test(val)) {
            el.value = val.slice(0, -2) + ":" + val.slice(-2);
            el.setAttribute('value', el.value);
            calcRanks(colIdx);
            updateGraph();
        }
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            if(input && input.value.trim()) times.push({ rowIndex: i, sec: t2s(input.value.trim()) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, idx) => { rows[t.rowIndex].cells[colIdx * 2].innerText = idx + 1; });
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true, ticks: { callback: v => s2t(v) } } } }
        });
    }

    function updateGraph() {
        if(!chart) return;
        const scope = document.getElementById('displayScope').value;
        const targetName = document.getElementById('filterSelect').value;
        const range = document.getElementById('graphRange').value;
        const curDay = document.getElementById('recordDate').value;
        
        let graphData = [];
        if (range === 'today') {
            const rows = document.getElementById('pdfTableBody').rows;
            for(let r=0; r<rows.length; r++) {
                const name = rows[r].cells[0].innerText;
                if (scope === 'individual' && name !== targetName) continue;
                for(let c=1; c<=6; c++) {
                    const val = rows[r].cells[c*2-1].querySelector('input').value;
                    if(val) graphData.push({ name, count: getLapLabel(c), time: val, date: curDay });
                }
            }
        } else {
            graphData = (scope === 'all') ? [...allSheetData] : allSheetData.filter(d => d.name === targetName);
        }

        const labelSet = new Set();
        const dataMap = {};
        graphData.forEach(r => {
            const lbl = (range === 'today') ? r.count : `${r.date} ${r.count}`;
            labelSet.add(lbl);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][lbl] = t2s(r.time);
        });

        const sortedLabels = Array.from(labelSet).sort();
        chart.data.labels = sortedLabels;
        chart.data.datasets = Object.keys(dataMap).map((name, i) => ({
            label: name,
            data: sortedLabels.map(l => dataMap[name][l] || null),
            borderColor: `hsl(${(i * 137) % 360}, 70%, 50%)`,
            spanGaps: true, tension: 0.3
        }));
        chart.update();
    }

    // ユーティリティ
    function t2s(v){ if(!v) return 9999; const p = v.toString().split(':'); return p.length>1 ? (parseInt(p[0])*60 + parseInt(p[1])) : parseFloat(v); }
    function s2t(s) { if (!s || s === 9999) return ""; const m = Math.floor(s/60); return m + ":" + String(Math.floor(s%60)).padStart(2, '0'); }
    function getLapLabel(i) { return ["1本目","2本目","3本目","4本目","5本目","追加"][i-1]; }

    async function fetchAllData() {
        try {
            const res = await fetch(GAS_WEBAPP_URL);
            allSheetData = await res.json();
            syncUI();
        } catch (e) { console.error("データ取得失敗"); }
    }

    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            currentDayData = result.found ? result.data : [];
            syncUI();
        } catch (e) {}
    }

    async function fetchDateHistory() {
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?mode=listDates`);
            const dates = await res.json();
            const select = document.getElementById('dateHistory');
            select.innerHTML = '<option value="">-- 履歴を選択 --</option>';
            dates.forEach(d => select.add(new Option(d, d)));
        } catch (e) {}
    }

    function syncDateAndLoad() {
        const sel = document.getElementById('dateHistory').value;
        if(sel) { document.getElementById('recordDate').value = sel; loadDateData(); }
    }
    function onDateChange() { loadDateData(); }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('pdfTableBody').rows;
        btn.disabled = true; btn.innerText = "同期中...";
        
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c*2-1].querySelector('input');
                if (!input || !input.value.trim()) continue;
                const payload = {
                    date, name: rows[r].cells[0].innerText,
                    count: getLapLabel(c), laps: document.getElementById(`lap-${c}`).value,
                    time: input.value.trim(), rank: rows[r].cells[c*2].innerText
                };
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        alert("同期が完了しました");
        btn.disabled = false; btn.innerText = "クラウドに同期保存";
        fetchAllData();
    }

    function renderRanking() {
        const rBox2 = document.getElementById('rankLaps2');
        const rBox1 = document.getElementById('rankLaps1');
        const scope = document.getElementById('displayScope').value;
        const target = document.getElementById('filterSelect').value;

        const getTop5 = (laps, nameFilter = null) => {
            let data = allSheetData.filter(d => d.laps == laps);
            if(nameFilter) data = data.filter(d => d.name === nameFilter);
            const bests = {};
            data.forEach(d => { if(!bests[d.name] || t2s(d.time) < bests[d.name].sec) bests[d.name] = {sec: t2s(d.time), time: d.time, date: d.date}; });
            return Object.entries(bests).sort((a,b) => a[1].sec - b[1].sec).slice(0,5);
        };

        const draw = (el, list) => {
            el.innerHTML = list.map((x, i) => `<div class="rank-item"><span>${i+1}</span><span class="rank-name">${x[0]}</span><span class="rank-time">${x[1].time}</span></div>`).join('') || 'データなし';
        };

        if(scope === 'all') {
            draw(rBox2, getTop5(2)); draw(rBox1, getTop5(1));
        } else {
            draw(rBox2, getTop5(2, target)); draw(rBox1, getTop5(1, target));
        }
    }

    function generateRefTable() {
        const head = document.getElementById('refHead');
        const body = document.getElementById('refTableBody');
        const dists = [1, 2, 3, 4, 6, 8, 10, 12, 15, 30]; 
        head.innerHTML = `<tr>${dists.map(d => `<th>${d*100}m</th>`).join('')}</tr>`;
        
        for (let b = 13.0; b <= 35.0; b += 0.5) {
            const tr = document.createElement('tr');
            dists.forEach((d, idx) => {
                const td = document.createElement('td');
                const s = b * d;
                let txt = s < 60 ? s.toFixed(1) : `${Math.floor(s/60)}'${String((s%60).toFixed(1)).padStart(4,'0')}`;
                if([1,3,6].includes(idx)) td.className = 'col-y';
                td.innerText = txt; tr.appendChild(td);
            });
            body.appendChild(tr);
        }
    }

    function preparePrint() {
        document.getElementById('section-graph').classList.toggle('print-hidden', !document.getElementById('check-graph').checked);
        document.getElementById('section-rank').classList.toggle('print-hidden', !document.getElementById('check-rank').checked);
        document.getElementById('section-table').classList.toggle('print-hidden', !document.getElementById('check-table').checked);
        document.getElementById('dynamic-print-style').innerHTML = `@media print { @page { size: A4 ${document.getElementById('print-orientation').value}; } }`;
        window.print();
    }

    window.onload = () => { if (sessionStorage.getItem('isBoxingAuth') === 'true') { document.getElementById('login-overlay').style.display = 'none'; document.getElementById('app-content').style.display = 'block'; initApp(); } };
</script>
</body>
</html>
