<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ボクシングトレーニング記録 (ローカル完結版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .dashboard-grid { display: grid; grid-template-columns: 280px 1fr; gap: 15px; }
        
        /* テーブル */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 5px; text-align: center; }
        th { background: #b2ffff; font-weight: normal; }
        input[type="text"], input[type="number"] { width: 90%; border: 1px solid #ccc; text-align: center; border-radius: 3px; }
        .lap-edit { width: 40px !important; font-weight: bold; color: var(--primary); }

        /* ボタン */
        .btn { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; margin: 2px; }
        .btn-save { background: #28a745; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn-export { background: var(--secondary); }
        .btn-import { background: #6c757d; }
        
        .chart-container { height: 350px; }
        .no-print { margin-bottom: 10px; }

        @media print { .no-print, .btn, #recordDate { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card no-print">
        <h2 style="margin:0 0 10px 0;">データ同期・バックアップ</h2>
        <button class="btn btn-export" onclick="exportToCSV()">CSVへ書き出し (Excel/スプレッドシート用)</button>
        <button class="btn btn-import" onclick="document.getElementById('importFile').click()">CSVから読み込み</button>
        <input type="file" id="importFile" style="display:none" accept=".csv" onchange="importFromCSV(event)">
        <p style="font-size:10px; color:#666;">※スプレッドシートにデータを移したい場合は「書き出し」をしてください。</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <label>記録日</label>
            <input type="date" id="recordDate" onchange="loadDayData()" style="width:100%; padding:5px; margin-bottom:15px;">
            
            <label>選手名簿 (改行区切り)</label>
            <textarea id="memberList" style="width:100%; height:150px;" oninput="saveMembers()"></textarea>
            
            <button class="btn btn-save" onclick="saveToLocal()">ブラウザに保存</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>分析グラフ</h3>
                <div class="no-print">
                    <select id="lapFilter" onchange="updateGraph()">
                        <option value="all">全ての周を表示</option>
                    </select>
                    <select id="graphRange" onchange="updateGraph()">
                        <option value="all">全期間</option>
                        <option value="today">本日のみ</option>
                    </select>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="runChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>トレーニング記録表</h3>
        <table id="mainTable">
            <thead>
                <tr>
                    <th>氏名</th>
                    <th>1本目(<input type="number" class="lap-edit" id="lap-1" value="2" oninput="onHeaderChange()">周)</th><th>順</th>
                    <th>2本目(<input type="number" class="lap-edit" id="lap-2" value="2" oninput="onHeaderChange()">周)</th><th>順</th>
                    <th>3本目(<input type="number" class="lap-edit" id="lap-3" value="1" oninput="onHeaderChange()">周)</th><th>順</th>
                    <th>4本目(<input type="number" class="lap-edit" id="lap-4" value="1" oninput="onHeaderChange()">周)</th><th>順</th>
                    <th>5本目(<input type="number" class="lap-edit" id="lap-5" value="1" oninput="onHeaderChange()">周)</th><th>順</th>
                    <th>追加(<input type="number" class="lap-edit" id="lap-6" value="1" oninput="onHeaderChange()">周)</th><th>順</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let chart;
    let database = JSON.parse(localStorage.getItem('boxing_db')) || [];
    const lapLabels = ["1本目","2本目","3本目","4本目","5本目","追加"];

    window.onload = () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || "";
        initChart();
        onHeaderChange();
        loadDayData();
    };

    function onHeaderChange() {
        updateLapDropdown();
        updateGraph();
    }

    // 周数プルダウンの更新
    function updateLapDropdown() {
        const laps = [];
        for(let i=1; i<=6; i++) laps.push(document.getElementById(`lap-${i}`).value);
        const uniqueLaps = [...new Set(laps)].sort();
        const sel = document.getElementById('lapFilter');
        const current = sel.value;
        sel.innerHTML = '<option value="all">全ての周を表示</option>';
        uniqueLaps.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l; opt.innerText = l + '周のタイムのみ';
            sel.appendChild(opt);
        });
        sel.value = current || "all";
    }

    // 保存処理 (ブラウザ内)
    function saveToLocal() {
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('tableBody').rows;
        
        // 既存の同じ日のデータを一旦削除
        database = database.filter(d => d.date !== date);

        for (let r = 0; r < rows.length; r++) {
            const name = rows[r].cells[0].innerText;
            for (let c = 1; c <= 6; c++) {
                const time = rows[r].cells[c*2-1].querySelector('input').value.trim();
                const laps = document.getElementById(`lap-${c}`).value;
                if (time) {
                    database.push({ date, name, count: lapLabels[c-1], laps, time });
                }
            }
        }
        localStorage.setItem('boxing_db', JSON.stringify(database));
        alert("ブラウザに保存しました");
        updateGraph();
    }

    function loadDayData() {
        const date = document.getElementById('recordDate').value;
        const names = document.getElementById('memberList').value.split('\n').filter(n => n.trim());
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        names.forEach(name => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${name}</td>` + [1,2,3,4,5,6].map(i => `
                <td><input type="text" oninput="updateGraph()" onblur="formatTime(this)"></td><td class="rank">-</td>
            `).join('');
            
            // 既存データの流し込み
            const dayData = database.filter(d => d.date === date && d.name === name);
            dayData.forEach(d => {
                const colIdx = lapLabels.indexOf(d.count);
                if (colIdx !== -1) tr.cells[colIdx*2+1].querySelector('input').value = d.time;
            });
            tbody.appendChild(tr);
        });
        calcRanks();
        updateGraph();
    }

    function formatTime(el) {
        let v = el.value.replace(/[^\d]/g, '');
        if (v.length >= 3) el.value = v.slice(0, -2) + ":" + v.slice(-2);
        calcRanks();
    }

    function calcRanks() {
        const tbody = document.getElementById('tableBody');
        for (let c = 1; c <= 6; c++) {
            let times = [];
            for (let r = 0; r < tbody.rows.length; r++) {
                const val = tbody.rows[r].cells[c*2-1].querySelector('input').value;
                if (val) times.push({ r, sec: t2s(val) });
                tbody.rows[r].cells[c*2].innerText = '-';
            }
            times.sort((a, b) => a.sec - b.sec).forEach((t, i) => {
                tbody.rows[t.r].cells[c*2].innerText = i + 1;
            });
        }
    }

    function initChart() {
        chart = new Chart(document.getElementById('runChart'), {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: { scales: { y: { reverse: true, ticks: { callback: v => s2t(v) } } }, maintainAspectRatio: false }
        });
    }

    function updateGraph() {
        if (!chart) return;
        const range = document.getElementById('graphRange').value;
        const filterLap = document.getElementById('lapFilter').value;
        const curDate = document.getElementById('recordDate').value;

        let data = [];
        if (range === 'today') {
            // 本日のテーブルからリアルタイム取得
            const rows = document.getElementById('tableBody').rows;
            for (let r = 0; r < rows.length; r++) {
                const name = rows[r].cells[0].innerText;
                for (let c = 1; c <= 6; c++) {
                    const time = rows[r].cells[c*2-1].querySelector('input').value;
                    const laps = document.getElementById(`lap-${c}`).value;
                    if (time && (filterLap === 'all' || laps === filterLap)) {
                        data.push({ name, time, label: lapLabels[c-1], date: curDate });
                    }
                }
            }
        } else {
            // データベース（全期間）から取得
            data = database.filter(d => filterLap === 'all' || d.laps === filterLap);
        }

        data.sort((a,b) => a.date.localeCompare(b.date) || lapLabels.indexOf(a.label) - lapLabels.indexOf(b.label));

        const labels = [...new Set(data.map(d => range === 'today' ? d.label : d.date.slice(5) + " " + d.count))];
        const names = [...new Set(data.map(d => d.name))];

        chart.data.labels = labels;
        chart.data.datasets = names.map((name, i) => ({
            label: name,
            data: labels.map(l => {
                const match = data.find(d => d.name === name && (range === 'today' ? d.label : d.date.slice(5) + " " + d.count) === l);
                return match ? t2s(match.time) : null;
            }),
            borderColor: `hsl(${(i * 50) % 360}, 70%, 50%)`,
            spanGaps: true
        }));
        chart.update();
    }

    function t2s(t) { const p = t.split(':'); return p.length > 1 ? p[0]*60 + p[1]*1 : t*1; }
    function s2t(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2, '0'); }

    function saveMembers() { localStorage.setItem('boxing_members', document.getElementById('memberList').value); }

    // --- CSV エクスポート (スプレッドシート用) ---
    function exportToCSV() {
        let csv = "\uFEFF日付,名前,項目,周数,タイム\n";
        database.forEach(d => {
            csv += `${d.date},${d.name},${d.count},${d.laps},${d.time}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `boxing_data_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
    }

    // --- CSV インポート ---
    function importFromCSV(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const rows = e.target.result.split('\n').slice(1);
            database = rows.filter(r => r.trim()).map(r => {
                const [date, name, count, laps, time] = r.split(',');
                return { date, name, count, laps, time };
            });
            localStorage.setItem('boxing_db', JSON.stringify(database));
            alert("読み込みが完了しました");
            loadDayData();
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
