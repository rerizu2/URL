<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Boxing Tracker - Spreadsheet View Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f4f7f9; --pdf-header: #b2ffff; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 15px; margin-bottom: 15px; }
        .dashboard-grid { display: grid; grid-template-columns: 300px 1fr; gap: 15px; }
        
        /* 表のデザイン（スプレッドシート再現） */
        .pdf-table { width: 100%; border-collapse: collapse; min-width: 1100px; border: 1px solid #ccc; background: #fff; }
        .pdf-table th, .pdf-table td { border: 1px solid #ccc; padding: 6px; text-align: center; }
        .pdf-table thead th { background: var(--pdf-header); font-weight: bold; color: #333; }
        .pdf-table input { width: 60px; border: 1px solid #eee; text-align: center; font-size: 13px; background: transparent; border-radius: 3px; }
        .pdf-table input:focus { background: #fff9c4; outline: none; border-color: var(--primary); }
        .rank-col { width: 35px; color: var(--primary); font-weight: bold; font-size: 11px; }

        .btn-send { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 10px; }
        .chart-container { height: 320px; position: relative; }
        .status-bar { font-size: 11px; font-weight: bold; color: #10b981; display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-grid">
        <div class="card">
            <h2>記録設定・読込</h2>
            <label style="display:block; font-weight:bold;">日付選択</label>
            <input type="date" id="recordDate" style="width:100%; padding:10px; margin:5px 0 15px 0;" onchange="loadDateData()">
            
            <h2>選手名簿</h2>
            <textarea id="memberList" style="width:100%; height:150px; font-size:11px; margin-bottom:5px;"></textarea>
            <button onclick="applyMembers()" style="width:100%; padding:8px; background:#6c757d; color:#fff; border:none; border-radius:4px; font-size:11px; cursor:pointer;">リスト更新</button>
        </div>

        <div class="card">
            <h2>成長グラフ (5:00 形式)</h2>
            <div class="chart-container"><canvas id="runChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div class="status-bar">
            <span id="connLabel">● リアルタイム同期中</span>
            <span id="lastSync" style="color:#666; font-weight:normal;">最終同期: ---</span>
        </div>
        <div style="overflow-x: auto;">
            <table class="pdf-table" id="mainTable">
                <thead>
                    <tr>
                        <th style="width:140px;">氏名</th>
                        <th>1本目</th><th class="rank-col">順位</th>
                        <th>2本目</th><th class="rank-col">順位</th>
                        <th>3本目</th><th class="rank-col">順位</th>
                        <th>4本目</th><th class="rank-col">順位</th>
                        <th>5本目</th><th class="rank-col">順位</th>
                        <th>追加</th><th class="rank-col">順位</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody"></tbody>
            </table>
        </div>
        <button id="saveBtn" class="btn-send" onclick="saveAllSheetData()">すべての記録をスプレッドシートへ送信・同期</button>
    </div>
</div>

<script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwtLS_XGKrViArpzq1XQkI0upqmmcbWLLuDB7BNGUnCVJabFcF3bM1SAAh6_B6QnRvyAQ/exec"; 
    const PERMANENT_MEMBERS = "石橋 乃蒼\n川﨑 輝寅\n上窪 聖\n大畑 歩希\n志冨田 凪大\n亀本 快歩\n松嶋 虎鉄\n今井 仁\n岡田 陸翔\n濱田 周摩\n日高 心太\n井上 暁仁\n今中 悠人\n惣田 湧大\n髙峯 将真\n西岡 泰志\n福貴田 泰生\n栗原 翔\n岩原 晴斗\n杉阪 咲太\n安藤 心咲\n大西 義一\n岸上 虎央\n南 悠翔\n石橋 奈樹\n志冨田 明陽\n木下 一颯\n道下 大翔\n柏木 羽空";
    
    let chart;
    const colors = ['#e63946', '#457b9d', '#2a9d8f', '#f4a261', '#1d3557', '#8b5cf6', '#6d597a'];

    window.onload = () => {
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('memberList').value = localStorage.getItem('boxing_members') || PERMANENT_MEMBERS;
        applyMembers();
        initChart();
        loadDateData();
    };

    function s2t(s) {
        if (!s && s !== 0) return "";
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ":" + String(sec).padStart(2, '0');
    }

    function t2s(v) {
        if (!v.toString().includes(':')) return parseFloat(v) || 0;
        const p = v.split(':');
        return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    // スプレッドシートからデータを読み込み、画像のように表へ配置
    async function loadDateData() {
        const date = document.getElementById('recordDate').value;
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        
        document.getElementById('connLabel').innerText = "⌛ シートからデータ読込中...";
        try {
            const res = await fetch(`${GAS_WEBAPP_URL}?date=${date}`);
            const result = await res.json();
            
            // 一旦クリア
            document.querySelectorAll('.t-in').forEach(el => el.value = '');
            document.querySelectorAll('.rank-col-cell').forEach(el => el.innerText = '-');

            if (result.found) {
                const sheetData = result.data; // A列=名前, B列=1本目, C列=順位...
                const rows = document.getElementById('pdfTableBody').rows;

                for (let i = 1; i < sheetData.length; i++) {
                    const sheetRow = sheetData[i];
                    const name = sheetRow[0];
                    // HTML側の行を探す
                    for (let r = 0; r < rows.length; r++) {
                        if (rows[r].cells[0].innerText === name) {
                            // 1本目〜追加までの6セットを流し込む
                            for (let col = 1; r < rows.length && col <= 6; col++) {
                                const timeVal = sheetRow[col * 2 - 1]; // B, D, F, H, J, L列
                                const rankVal = sheetRow[col * 2];     // C, E, G, I, K, M列
                                rows[r].cells[col * 2 - 1].querySelector('input').value = timeVal || '';
                                rows[r].cells[col * 2].innerText = rankVal || '-';
                            }
                            break;
                        }
                    }
                }
                document.getElementById('connLabel').innerText = "● 読込完了（同期中）";
            } else {
                document.getElementById('connLabel').innerText = "● 新規作成（データなし）";
            }
            updateGraph();
        } catch (e) {
            document.getElementById('connLabel').innerText = "● 接続エラー";
        }
    }

    function applyMembers() {
        const ms = document.getElementById('memberList').value.trim().split('\n');
        const tbody = document.getElementById('pdfTableBody');
        tbody.innerHTML = '';
        ms.forEach((m, idx) => {
            const name = m.trim(); if(!name) return;
            const tr = document.createElement('tr');
            let html = `<td style="font-weight:bold; background:#f9f9f9; text-align:left;">${name}</td>`;
            for(let i=1; i<=6; i++){
                html += `<td><input type="text" class="t-in" oninput="calcRanks(${i})"></td>
                         <td class="rank-col rank-col-cell">-</td>`;
            }
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
        localStorage.setItem('boxing_members', document.getElementById('memberList').value);
    }

    function calcRanks(colIdx) {
        const rows = document.getElementById('pdfTableBody').rows;
        let times = [];
        for(let i=0; i<rows.length; i++){
            const input = rows[i].cells[colIdx * 2 - 1].querySelector('input');
            const val = input.value.trim();
            if(val) times.push({ rowIndex: i, sec: t2s(val) });
            rows[i].cells[colIdx * 2].innerText = '-';
        }
        times.sort((a,b) => a.sec - b.sec).forEach((t, index) => {
            rows[t.rowIndex].cells[colIdx * 2].innerText = index + 1;
        });
    }

    async function saveAllSheetData() {
        const btn = document.getElementById('saveBtn');
        const date = document.getElementById('recordDate').value;
        const rows = document.getElementById('pdfTableBody').rows;
        btn.disabled = true; btn.innerText = "同期中...";
        
        for (let r = 0; r < rows.length; r++) {
            for (let c = 1; c <= 6; c++) {
                const input = rows[r].cells[c * 2 - 1].querySelector('input');
                const time = input.value.trim();
                if (!time) continue;
                const count = document.getElementById('mainTable').rows[0].cells[c * 2 - 1].innerText;
                const rank = rows[r].cells[c * 2].innerText;
                const payload = { date, name: rows[r].cells[0].innerText, count, time, rank, memberList: document.getElementById('memberList').value };
                await fetch(GAS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        }
        btn.disabled = false; btn.innerText = "同期完了！";
        document.getElementById('lastSync').innerText = "最終同期: " + new Date().toLocaleTimeString();
        updateGraph();
    }

    async function updateGraph() {
        if (!GAS_WEBAPP_URL.startsWith('http')) return;
        const response = await fetch(GAS_WEBAPP_URL);
        const records = await response.json();
        const dataMap = {}; const labelSet = new Set();
        records.forEach(r => {
            const label = `${r.date}(${r.count})`;
            labelSet.add(label);
            if(!dataMap[r.name]) dataMap[r.name] = {};
            dataMap[r.name][label] = t2s(r.time);
        });
        const sortedLabels = Array.from(labelSet).sort();
        const datasets = [];
        Object.keys(dataMap).forEach((name, i) => {
            datasets.push({ label: name, data: sortedLabels.map(l => dataMap[name][l] || null), borderColor: colors[i % colors.length], tension: 0.3, spanGaps: true, pointRadius: 3 });
        });
        chart.data.labels = sortedLabels; chart.data.datasets = datasets; chart.update();
    }

    function initChart() {
        const ctx = document.getElementById('runChart').getContext('2d');
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { reverse: true, ticks: { callback: v => s2t(v) } } } } });
    }
</script>
</body>
</html>
