<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2IA Riddle Final</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --accent: #c5a059; --bg: #0d0d0d; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 500px; padding: 30px; border: 2px solid var(--accent); background: #151515; text-align: center; }
        .stage { display: none; }
        .active { display: block; }
        .btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 12px 24px; cursor: pointer; margin: 10px; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: #000; }
        .id-btn { width: 40px; height: 40px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin: 3px; }
        .id-btn.selected { background: var(--accent); color: #000; }
        input { background: transparent; border: none; border-bottom: 2px solid var(--accent); color: #fff; padding: 10px; width: 80%; text-align: center; font-size: 1.2rem; outline: none; margin: 20px 0; }
        .error-log { font-size: 0.7rem; color: #ff6666; background: #222; padding: 10px; text-align: left; margin-top: 10px; border-radius: 5px; white-space: pre-wrap; }
        #test-reader { width: 100% !important; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container" id="main">
    <!-- 1. 端末設定 -->
    <div id="screen-setup" class="stage active">
        <h1>TERMINAL SETUP</h1>
        <div id="id-btns">
            <button class="id-btn" onclick="sel(1)">1</button>
            <button class="id-btn" onclick="sel(2)">2</button>
            <button class="id-btn" onclick="sel(3)">3</button>
            <button class="id-btn" onclick="sel(4)">4</button>
            <button class="id-btn" onclick="sel(5)">5</button>
        </div>
        <button class="btn" id="con-btn" onclick="connect()" disabled>接続開始</button>
        <p style="font-size:0.7rem; color:#666;">※接続できない場合は、GASのURLと権限を再確認してください</p>
    </div>

    <!-- 2. 通信中 -->
    <div id="screen-loading" class="stage">
        <p id="load-status">通信中...</p>
        <div id="diag-area" style="display:none;">
            <div class="error-log" id="err-log"></div>
            <button class="btn" onclick="location.reload()">やり直す</button>
        </div>
    </div>

    <!-- 3. スタート（テストあり） -->
    <div id="screen-start" class="stage">
        <h1 id="st-title">TERMINAL READY</h1>
        <button class="btn" onclick="show('screen-game')">本編開始</button><br>
        <button class="btn" style="font-size:0.8rem;" onclick="openCam()">カメラテスト</button>
    </div>

    <!-- 4. カメラテスト -->
    <div id="screen-cam" class="stage">
        <div id="test-reader"></div>
        <p id="cam-msg"></p>
        <button class="btn" onclick="closeCam()">戻る</button>
    </div>

    <!-- 5. 停止 -->
    <div id="screen-off" class="stage">
        <h1>LOCKED</h1>
        <p>停止中です</p>
        <button class="btn" onclick="location.reload()">リセット</button>
    </div>

    <!-- 6. 本編 -->
    <div id="screen-game" class="stage">
        <p id="prog">1/5</p>
        <div id="ques" style="font-size:1.2rem; margin:20px 0;">問題</div>
        <input type="text" id="ans" placeholder="答え..." autocomplete="off">
        <button class="btn" onclick="check()">送信</button>
    </div>

    <!-- 7. クリア -->
    <div id="screen-clear" class="stage">
        <h1>COMPLETE!</h1>
        <button class="btn" onclick="location.reload()">TOP</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw267LayPjUSigqkgw5gjRLgrpZj-d2AcxWRZskvJCQrlUQq8nSkll94gQHRvX-4mg8Fg/exec"; // /execで終わるURL
    let tid = null, riddles = [], step = 0, scanner = null;

    function sel(n) {
        tid = n;
        document.querySelectorAll('.id-btn').forEach(b => b.classList.toggle('selected', b.innerText == n));
        document.getElementById('con-btn').disabled = false;
    }

    function show(id) {
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function connect() {
        show('screen-loading');
        try {
            const res = await fetch(`${GAS_URL}?id=${tid}`);
            if (!res.ok) throw new Error("HTTPエラー: " + res.status);
            const data = await res.json();
            if (data.error) throw new Error("GASエラー: " + data.error);
            if (!data.is_active) return show('screen-off');

            riddles = data.riddles;
            document.getElementById('st-title').innerText = "TERMINAL " + tid;
            updateQ();
            show('screen-start');
        } catch (e) {
            document.getElementById('load-status').innerText = "接続に失敗しました";
            document.getElementById('diag-area').style.display = "block";
            document.getElementById('err-log').innerText = 
                "【エラー原因】\n" + e.message + 
                "\n\n【確認事項】\n1.GASのURLが正しく /exec か\n2.アクセス権限が「全員」か\n3.GAS側で承認済みか";
        }
    }

    function updateQ() {
        document.getElementById('prog').innerText = `${step+1} / 5`;
        document.getElementById('ques').innerText = riddles[step].question;
        document.getElementById('ans').value = "";
    }

    function check() {
        const u = document.getElementById('ans').value.trim();
        const a = riddles[step].answer.toString().trim();
        if (u === a && a !== "") {
            step++;
            if (step >= 5) show('screen-clear'); else updateQ();
        } else {
            alert("違います");
        }
    }

    async function openCam() {
        show('screen-cam');
        scanner = new Html5Qrcode("test-reader");
        scanner.start({facingMode:"environment"}, {fps:10, qrbox:200}, t=>{
            document.getElementById('cam-msg').innerText = "成功: " + t;
        }).catch(e => document.getElementById('cam-msg').innerText = e);
    }

    function closeCam() {
        if(scanner) scanner.stop().finally(()=>show('screen-start')); else show('screen-start');
    }
</script>
</body>
</html>
