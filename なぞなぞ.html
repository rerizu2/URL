<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2IA Riddle Adventure</title>
    <!-- QRコードライブラリ -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --accent-color: #c5a059;
            --text-color: #e0e0e0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Yu Mincho', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 20px;
            border: 2px solid var(--accent-color);
            background: rgba(20, 20, 20, 0.95);
            text-align: center;
            position: relative;
        }
        .stage { display: none; animation: fadeIn 0.6s forwards; }
        .active { display: block; }

        h1 { color: var(--accent-color); letter-spacing: 3px; font-size: 1.4rem; margin-bottom: 20px; }
        .desc { font-size: 0.9rem; color: #888; margin-bottom: 20px; line-height: 1.6; }

        /* 端末選択ボタン */
        .id-selector { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .id-btn {
            width: 45px; height: 45px; border: 1px solid var(--accent-color);
            background: transparent; color: var(--accent-color);
            cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }
        .id-btn.selected { background: var(--accent-color); color: #000; }

        /* QRスキャナー枠 */
        #test-reader { width: 100% !important; margin: 15px 0; border-radius: 8px; overflow: hidden; border: 1px solid #444; }

        /* ボタン共通 */
        .btn {
            background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color);
            padding: 12px 30px; cursor: pointer; margin: 10px 5px; transition: 0.3s; font-size: 1rem;
        }
        .btn:hover { background: var(--accent-color); color: #000; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 本編用 */
        .q-text { font-size: 1.2rem; margin: 30px 0; min-height: 80px; white-space: pre-wrap; }
        input[type="text"] {
            background: transparent; border: none; border-bottom: 2px solid var(--accent-color);
            color: white; padding: 10px; width: 85%; text-align: center; font-size: 1.2rem; outline: none; margin-bottom: 20px;
        }
        .progress { color: #666; font-size: 0.8rem; margin-bottom: 5px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
    </style>
</head>
<body>

<div class="container" id="main-box">
    <!-- 1. 端末設定画面 -->
    <div id="screen-setup" class="stage active">
        <h1>SET TERMINAL ID</h1>
        <p class="desc">使用する端末の番号を選択してください。</p>
        <div class="id-selector">
            <button class="id-btn" onclick="selectId(1)">1</button>
            <button class="id-btn" onclick="selectId(2)">2</button>
            <button class="id-btn" onclick="selectId(3)">3</button>
            <button class="id-btn" onclick="selectId(4)">4</button>
            <button class="id-btn" onclick="selectId(5)">5</button>
        </div>
        <button class="btn" id="setup-connect-btn" onclick="connectGAS()" disabled>接続開始</button>
    </div>

    <!-- 2. ローディング -->
    <div id="screen-loading" class="stage">
        <p>魔導ネットワークに接続中...</p>
    </div>

    <!-- 3. スタート画面 -->
    <div id="screen-start" class="stage">
        <h1 id="ui-start-terminal">TERMINAL X</h1>
        <p class="desc">データの取得に成功しました。<br>準備ができたら「本編開始」を押してください。</p>
        <button class="btn" style="border-width: 2px; font-weight: bold;" onclick="show('screen-game')">本編開始</button>
        <br>
        <button class="btn" style="font-size: 0.8rem; opacity: 0.7;" onclick="openTestScan()">カメラ動作テスト</button>
    </div>

    <!-- 4. 試しスキャン画面 -->
    <div id="screen-test-scan" class="stage">
        <h1>CAMERA TEST</h1>
        <p class="desc">QRコードが読み取れるかテストします。<br>（何でも良いのでQRを映してください）</p>
        <div id="test-reader"></div>
        <p id="test-result" style="color: var(--accent-color); font-size: 0.8rem; min-height: 1.2rem;"></p>
        <button class="btn" onclick="closeTestScan()">戻る</button>
    </div>

    <!-- 5. 停止画面 -->
    <div id="screen-off" class="stage">
        <h1>SYSTEM LOCKED</h1>
        <p>この端末は現在、封印されています。</p>
        <button class="btn" onclick="location.reload()">再試行</button>
    </div>

    <!-- 6. 本編（ゲーム）画面 -->
    <div id="screen-game" class="stage">
        <div class="progress" id="ui-progress">STAGE 1 / 5</div>
        <h1 id="ui-game-terminal">TERMINAL</h1>
        <div class="q-text" id="ui-question">---</div>
        <input type="text" id="ans-input" placeholder="答えを入力..." autocomplete="off">
        <br>
        <button class="btn" onclick="judge()">解錠</button>
    </div>

    <!-- 7. クリア画面 -->
    <div id="screen-clear" class="stage">
        <h1 style="font-size: 2rem;">QUEST COMPLETE</h1>
        <p>おめでとう。すべての謎が解き明かされた。</p>
        <button class="btn" onclick="location.reload()">初期状態に戻す</button>
    </div>
</div>

<script>
    // ★ GASのウェブアプリURLをここに貼り付け
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzBrc0NGbhwmo4OlSps2tMZpPeVv_wfX7JBJYtve98jTVdydeSU4U9GOVRSyRDQbP4SgQ/exec";

    let selectedTerminalId = null;
    let riddles = [];
    let step = 0;
    let testScanner = null;

    // --- 1. セットアップ ---
    function selectId(id) {
        selectedTerminalId = id;
        document.querySelectorAll('.id-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.innerText == id);
        });
        document.getElementById('setup-connect-btn').disabled = false;
    }

    async function connectGAS() {
        show('screen-loading');
        try {
            const res = await fetch(`${GAS_URL}?id=${selectedTerminalId}`);
            const config = await res.json();

            if (!config.is_active) {
                show('screen-off');
                return;
            }

            riddles = config.riddles;
            document.getElementById('ui-start_terminal').innerText = `TERMINAL ${selectedTerminalId}`;
            document.getElementById('ui-game-terminal').innerText = `TERMINAL ${selectedTerminalId}`;
            updateRiddleUI();
            
            // 接続完了後、即ゲームではなく「スタート画面」へ
            show('screen-start');
        } catch (e) {
            alert("接続エラーが発生しました。");
            show('screen-setup');
        }
    }

    // --- 2. 試しスキャン ---
    async function openTestScan() {
        show('screen-test-scan');
        document.getElementById('test-result').innerText = "スキャナー起動中...";
        testScanner = new Html5Qrcode("test-reader");
        try {
            await testScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 200 },
                (text) => {
                    document.getElementById('test-result').innerText = "読込成功: " + text;
                }
            );
            document.getElementById('test-result').innerText = "QRコードを映してください";
        } catch (err) {
            document.getElementById('test-result').innerText = "カメラエラー: " + err;
        }
    }

    function closeTestScan() {
        if (testScanner) {
            testScanner.stop().then(() => {
                show('screen-start');
            });
        } else {
            show('screen-start');
        }
    }

    // --- 3. 本編ロジック ---
    function show(sid) {
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        document.getElementById(sid).classList.add('active');
    }

    function updateRiddleUI() {
        document.getElementById('ui-progress').innerText = `STAGE ${step + 1} / 5`;
        document.getElementById('ui-question').innerText = riddles[step].question;
        document.getElementById('ans-input').value = "";
    }

    function judge() {
        const val = document.getElementById('ans-input').value.trim();
        const collect = riddles[step].answer.toString().trim();

        if (val === collect) {
            step++;
            if (step >= riddles.length) {
                show('screen-clear');
            } else {
                updateRiddleUI();
            }
        } else {
            const b = document.getElementById('main-box');
            b.classList.add('shake');
            setTimeout(() => b.classList.remove('shake'), 400);
        }
    }
</script>
</body>
</html>
