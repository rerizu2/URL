<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2IA Riddle Adventure</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --accent: #c5a059; --bg: #0d0d0d; --text: #e0e0e0; --danger: #8b0000; }
        body { background: var(--bg); color: var(--text); font-family: 'Yu Mincho', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 500px; padding: 25px 20px; border: 2px solid var(--accent); background: rgba(20,20,20,0.95); text-align: center; box-shadow: 0 0 30px #000; position: relative; max-height: 98vh; overflow-y: auto; }
        .stage { display: none; }
        .active { display: block; animation: fadeIn 0.5s; }
        
        /* ヘッダー */
        .game-header { display: none; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #444; }
        #ui-timer { font-size: 1.1rem; color: var(--accent); font-weight: bold; font-family: monospace; }
        #ui-team-display { font-size: 0.8rem; color: #fff; background: rgba(197, 160, 89, 0.2); padding: 2px 10px; border-radius: 4px; border: 1px solid var(--accent); }
        .time-warning { color: #ff4444 !important; animation: blink 1s infinite; }

        h1 { color: var(--accent); letter-spacing: 3px; font-size: 1.4rem; margin-bottom: 15px; }
        .btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px 20px; cursor: pointer; margin: 8px; transition: 0.3s; font-size: 1rem; min-width: 150px; outline: none; }
        .btn:hover:not(:disabled) { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        .btn:disabled { opacity: 0.2; }

        .btn-sm { font-size: 0.75rem; padding: 6px 12px; opacity: 0.6; border-color: #666; color: #aaa; min-width: 80px; }
        .btn-sm:hover { opacity: 1; background: var(--danger); color: white; border-color: var(--danger); }

        .text-input { background: rgba(255,255,255,0.05); border: 1px solid #444; border-bottom: 2px solid var(--accent); color: #fff; padding: 10px; width: 100%; box-sizing: border-box; font-size: 1.1rem; outline: none; text-align: center; }
        .id-btn { width: 40px; height: 42px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin: 3px; border-radius: 4px; }
        .id-btn.selected { background: var(--accent); color: #000; }
        
        .story-text { text-align: left; line-height: 1.6; font-size: 1rem; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 5px; white-space: pre-wrap; margin-bottom: 15px; }
        #game-reader, #rule-reader { width: 100% !important; border-radius: 8px; overflow: hidden; min-height: 250px; background: #000; border: 1px solid #444; }
        
        .footer-btns { margin-top: 20px; display: flex; justify-content: center; gap: 10px; border-top: 1px solid #333; padding-top: 15px; }

        /* ランキング用 */
        .rank-card { background: linear-gradient(135deg, #c5a059 0%, #8a6d2f 100%); color: #000; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-around; align-items: center; }
        .rank-card div { text-align: center; }
        .rank-card small { font-size: 0.7rem; display: block; text-transform: uppercase; }
        .rank-card span { font-size: 1.5rem; font-weight: bold; }

        .tab-container { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .tab-btn { background: #222; border: 1px solid #444; color: #888; padding: 5px 12px; cursor: pointer; font-size: 0.8rem; flex: 1; }
        .tab-btn.active { background: var(--accent); color: #000; }

        .ranking-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .ranking-table th { color: var(--accent); border-bottom: 1px solid var(--accent); padding: 6px; }
        .ranking-table td { padding: 6px; border-bottom: 1px solid #333; }
        .is-me { background: rgba(197, 160, 89, 0.3); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
        #map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; }
        #map-img { max-width: 90%; max-height: 80%; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <div class="game-header" id="ui-header">
        <div id="ui-team-display">---</div>
        <div id="ui-timer">0:60:00</div>
    </div>

    <!-- 1. セットアップ -->
    <div id="screen-setup" class="stage active">
        <h1>SET TERMINAL</h1>
        <input type="text" id="team-name-input" class="text-input" placeholder="チーム名を入力" oninput="validateSetup()">
        <div style="margin:15px 0;">
            <button class="id-btn" onclick="sel(1)">1</button><button class="id-btn" onclick="sel(2)">2</button><button class="id-btn" onclick="sel(3)">3</button><button class="id-btn" onclick="sel(4)">4</button><button class="id-btn" onclick="sel(5)">5</button>
        </div>
        <button class="btn" id="con-btn" onclick="connect()" disabled>接続開始</button>
    </div>

    <div id="screen-loading" class="stage"><p id="loading-msg">同期中...</p></div>

    <div id="screen-main-start" class="stage">
        <h1>WELCOME</h1>
        <button class="btn" onclick="startRuleScan()">「ルール説明」をスキャン</button>
    </div>

    <div id="screen-rule-scan" class="stage">
        <h1>RULE SCAN</h1>
        <div id="rule-reader"></div>
        <p style="font-size:0.8rem; margin-top:10px; color:#888;">「ルール説明」のQRを映してください</p>
    </div>

    <div id="screen-rules-content" class="stage">
        <h1>RULES</h1>
        <div class="story-text">制限時間 1時間。<br>クリアタイムを競い、全ての謎を解き明かしてください。</div>
        <button class="btn" onclick="initGameSession()">物語へ進む</button>
    </div>

    <div id="screen-story" class="stage">
        <h1 id="ui-story-title">STAGE</h1>
        <div class="story-text" id="ui-story-text">...</div>
        <button id="ui-story-btn" class="btn" onclick="showScan()">探索へ進む</button>
    </div>

    <div id="screen-qr" class="stage">
        <button class="btn" style="position:absolute; top:5px; right:5px; font-size:0.6rem; min-width:auto; padding:5px 10px;" onclick="toggleMap(true)">MAP</button>
        <div id="game-reader"></div>
        <p id="scan-status" style="font-size:0.8rem; margin:10px 0;">紋章をスキャンしてください</p>
        <div class="footer-btns">
            <button class="btn btn-sm" onclick="sendEmergency()">緊急事態</button>
            <button class="btn btn-sm" onclick="confirmRetire()">リタイア</button>
        </div>
    </div>

    <div id="screen-riddle" class="stage">
        <button class="btn" style="position:absolute; top:5px; right:5px; font-size:0.6rem; min-width:auto; padding:5px 10px;" onclick="toggleMap(true)">MAP</button>
        <p id="ui-progress" style="font-size:0.7rem; color:#666;">1 / 5</p>
        <div id="ui-question" style="font-size:1.1rem; margin:10px 0; min-height:80px; display:flex; align-items:center; justify-content:center; white-space:pre-wrap;">---</div>
        <input type="text" id="ans-input" placeholder="答えを入力" autocomplete="off">
        <button class="btn" onclick="judge()">送信</button>
        <div class="footer-btns">
            <button class="btn btn-sm" onclick="sendEmergency()">緊急事態</button>
            <button class="btn btn-sm" onclick="confirmRetire()">リタイア</button>
        </div>
    </div>

    <div id="screen-clear" class="stage">
        <h1>QUEST CLEAR</h1>
        <div class="rank-card">
            <div><small>Overall</small><span id="ui-my-overall-rank">--</span>位</div>
            <div><small>Terminal</small><span id="ui-my-terminal-rank">--</span>位</div>
        </div>
        <div class="tab-container">
            <button id="tab-overall" class="tab-btn active" onclick="switchRanking('overall')">総合ランキング</button>
            <button id="tab-terminal" class="tab-btn" onclick="switchRanking('terminal')">この端末(No.<span id="ui-current-tid"></span>)</button>
        </div>
        <div id="ranking-container"></div>
        <button class="btn" style="margin-top:15px;" onclick="location.reload()">最初に戻る</button>
    </div>

    <div id="screen-retire" class="stage"><h1>GAME OVER</h1><div class="story-text" id="ui-retire-msg" style="text-align:center; font-size:1.8rem; color:var(--danger);">リタイア</div><button class="btn" onclick="location.reload()">戻る</button></div>
    <div id="screen-off" class="stage"><h1>LOCKED</h1><p>停止中です。</p><button class="btn" onclick="location.reload()">戻る</button></div>
</div>

<div id="map-overlay" onclick="toggleMap(false)"><img id="map-img" src=""></div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxW67GsjNHMVcE_IcQbLpYP0U0f8-k_tSZj4tmiY2McSPki8sFfF_-R0xTc_z1bo1zdNQ/exec"; 
    let tid = null, riddles = [], step = 0, currentScanner = null, configData = {};
    let teamName = "", timeLeft = 3600, timerInterval = null, startTime = null, rankingData = null;

    function formatTime(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function validateSetup() {
        const name = document.getElementById('team-name-input').value.trim();
        document.getElementById('con-btn').disabled = !(name !== "" && tid !== null);
    }
    function sel(n) { tid = n; document.querySelectorAll('.id-btn').forEach(b => b.classList.toggle('selected', b.innerText == n)); validateSetup(); }
    function show(id) { document.querySelectorAll('.stage').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    async function connect() {
        teamName = document.getElementById('team-name-input').value.trim();
        show('screen-loading');
        try {
            const res = await fetch(`${GAS_URL}?id=${tid}`);
            configData = await res.json();
            if(!configData.is_active) return show('screen-off');
            riddles = configData.riddles;
            document.getElementById('ui-team-display').innerText = teamName;
            document.getElementById('ui-current-tid').innerText = tid;
            document.getElementById('map-img').src = configData.map_url || "";
            show('screen-main-start');
        } catch (e) { alert("接続エラー"); show('screen-setup'); }
    }

    async function startRuleScan() {
        show('screen-rule-scan');
        currentScanner = new Html5Qrcode("rule-reader");
        await currentScanner.start({facingMode:"environment"}, {fps:10, qrbox:220}, (t) => {
            if (t.trim() === "ルール説明") { currentScanner.stop().then(() => { currentScanner = null; show('screen-rules-content'); }); }
        });
    }

    function initGameSession() {
        document.getElementById('ui-header').style.display = 'flex';
        startTime = new Date();
        startTimer();
        showStage();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('ui-timer').innerText = formatTime(timeLeft);
            if (timeLeft <= 300) document.getElementById('ui-timer').classList.add('time-warning');
            if (timeLeft <= 0) { clearInterval(timerInterval); autoRetireByTimeup(); }
        }, 1000);
    }

    async function autoRetireByTimeup() {
        if(currentScanner) currentScanner.stop();
        fetch(`${GAS_URL}?action=retire&id=${tid}&team=${encodeURIComponent(teamName)}&time=0:00:00`, {mode:'no-cors'});
        show('screen-retire');
    }

    function showStage() {
        show('screen-story');
        document.getElementById('ui-story-title').innerText = `STAGE ${step + 1}`;
        document.getElementById('ui-story-text').innerText = riddles[step].story;
        document.getElementById('ui-story-btn').onclick = showScan;
    }

    async function showScan() {
        show('screen-qr');
        const target = riddles[step].qr_key.toString().trim();
        currentScanner = new Html5Qrcode("game-reader");
        await currentScanner.start({facingMode:"environment"}, {fps:10, qrbox:220}, (t) => {
            const scan = t.trim();
            if (scan === "2IAの教室にぜひ来てください！" + target || scan === target) {
                currentScanner.stop().then(() => { currentScanner = null; showRiddle(); });
            }
        });
    }

    function showRiddle() {
        show('screen-riddle');
        document.getElementById('ui-progress').innerText = `${step + 1} / 5`;
        document.getElementById('ui-question').innerText = riddles[step].question;
        document.getElementById('ans-input').value = "";
    }

    async function judge() {
        if (document.getElementById('ans-input').value.trim() === riddles[step].answer.toString().trim()) {
            step++;
            if (step >= 5) { clearInterval(timerInterval); await finalizeGame(); } else showStage();
        } else {
            document.getElementById('game-box').classList.add('shake');
            setTimeout(() => document.getElementById('game-box').classList.remove('shake'), 400);
        }
    }

    async function finalizeGame() {
        show('screen-loading');
        const duration = Math.floor((new Date() - startTime) / 1000);
        const finalTimeStr = formatTime(duration);
        await fetch(`${GAS_URL}?action=clear_log&id=${tid}&team=${encodeURIComponent(teamName)}&time=${finalTimeStr}&duration=${duration}`, {mode:'no-cors'});
        show('screen-story');
        document.getElementById('ui-story-title').innerText = "EPILOGUE";
        document.getElementById('ui-story-text').innerText = configData.ending_story;
        document.getElementById('ui-story-btn').innerText = "ランキングを見る";
        document.getElementById('ui-story-btn').onclick = loadRanking;
    }

    async function loadRanking() {
        show('screen-loading');
        try {
            const res = await fetch(`${GAS_URL}?action=get_ranking&team=${encodeURIComponent(teamName)}&id=${tid}`);
            rankingData = await res.json();
            document.getElementById('ui-my-overall-rank').innerText = rankingData.myOverallRank || "--";
            document.getElementById('ui-my-terminal-rank').innerText = rankingData.myTerminalRank || "--";
            switchRanking('overall');
            show('screen-clear');
        } catch (e) { alert("取得失敗"); show('screen-clear'); }
    }

    function switchRanking(type) {
        document.getElementById('tab-overall').classList.toggle('active', type === 'overall');
        document.getElementById('tab-terminal').classList.toggle('active', type === 'terminal');
        const list = (type === 'overall') ? rankingData.overallTop10 : rankingData.terminalTop10;
        let html = '<table class="ranking-table"><tr><th>位</th><th>チーム</th><th>タイム</th></tr>';
        list.forEach((row, i) => {
            const isMe = (row.team === teamName) ? 'class="is-me"' : '';
            html += `<tr ${isMe}><td>${i+1}</td><td>${row.team}</td><td>${row.time}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('ranking-container').innerHTML = html;
    }

    function toggleMap(v) { document.getElementById('map-overlay').style.display = v ? 'flex' : 'none'; }
    
    function sendEmergency() {
        const input = prompt("トラブルの内容を入力してください");
        if(input) {
            const curT = formatTime(Math.floor((new Date() - startTime)/1000));
            fetch(`${GAS_URL}?action=emergency&id=${tid}&team=${encodeURIComponent(teamName)}&msg=${encodeURIComponent(input)}&time=${curT}`, {mode:'no-cors'});
            alert("送信しました。指示：" + configData.emergency_msg);
        }
    }
    
    function confirmRetire() {
        if (confirm("リタイアしますか？進行データは消去されます。")) {
            clearInterval(timerInterval);
            const curT = formatTime(Math.floor((new Date() - startTime)/1000));
            fetch(`${GAS_URL}?action=retire&id=${tid}&team=${encodeURIComponent(teamName)}&time=${curT}`, {mode:'no-cors'});
            if(currentScanner) currentScanner.stop();
            show('screen-retire');
        }
    }
</script>
</body>
</html>
