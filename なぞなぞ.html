<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2IA Riddle Quest</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --accent: #c5a059; --bg: #0d0d0d; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: 'Yu Mincho', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 500px; padding: 40px 25px; border: 2px solid var(--accent); background: rgba(20,20,20,0.95); text-align: center; box-shadow: 0 0 30px #000; position: relative; }
        .stage { display: none; animation: fadeIn 0.5s forwards; }
        .active { display: block; }
        .btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 12px 24px; cursor: pointer; margin: 10px; transition: 0.3s; font-size: 1rem; }
        .btn:hover { background: var(--accent); color: #000; }
        .id-btn { width: 45px; height: 45px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin: 5px; font-size: 1.1rem; }
        .id-btn.selected { background: var(--accent); color: #000; }
        input { background: transparent; border: none; border-bottom: 2px solid var(--accent); color: #fff; padding: 10px; width: 85%; text-align: center; font-size: 1.2rem; outline: none; margin: 20px 0; }
        .story-text { text-align: left; line-height: 1.8; font-size: 1rem; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 5px; white-space: pre-wrap; margin-bottom: 20px; }
        #game-reader { width: 100% !important; border: 1px solid #444; border-radius: 8px; overflow: hidden; margin-top: 15px; }
        .map-btn { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; padding: 5px 10px; z-index: 10; }
        #map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; }
        #map-img { max-width: 90%; max-height: 80%; border: 1px solid var(--accent); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
    </style>
</head>
<body>

<div class="container" id="main-box">
    <!-- 1. 端末設定 -->
    <div id="screen-setup" class="stage active">
        <h1>TERMINAL SETUP</h1>
        <div id="id-selector">
            <button class="id-btn" onclick="sel(1)">1</button>
            <button class="id-btn" onclick="sel(2)">2</button>
            <button class="id-btn" onclick="sel(3)">3</button>
            <button class="id-btn" onclick="sel(4)">4</button>
            <button class="id-btn" onclick="sel(5)">5</button>
        </div>
        <button class="btn" id="con-btn" onclick="connect()" disabled>接続開始</button>
    </div>

    <!-- 2. 通信中 -->
    <div id="screen-loading" class="stage"><p>魔法回路を同期中...</p></div>

    <!-- 3. スタート（物語） -->
    <div id="screen-story" class="stage">
        <h1>PROLOGUE</h1>
        <div class="story-text" id="ui-story">...</div>
        <button class="btn" onclick="startMainGame()">本編開始</button>
    </div>

    <!-- 4. QRスキャン待機画面 -->
    <div id="screen-qr-gate" class="stage">
        <p id="ui-scan-msg" style="color:var(--accent); font-weight:bold;">STAGE 1 の紋章を探せ</p>
        <div id="game-reader"></div>
        <p id="scan-status" style="font-size:0.8rem; color:#888;">QRコードをスキャンしてください</p>
    </div>

    <!-- 5. 問題回答画面 -->
    <div id="screen-riddle" class="stage">
        <button class="btn map-btn" onclick="toggleMap(true)">MAP</button>
        <p id="ui-progress" style="font-size:0.8rem; color:#666;">1 / 5</p>
        <div id="ui-question" style="font-size:1.2rem; margin:20px 0; min-height:100px; display:flex; align-items:center; justify-content:center; white-space:pre-wrap;">---</div>
        <input type="text" id="ans-input" placeholder="答えを入力..." autocomplete="off">
        <br>
        <button class="btn" onclick="judge()">送信</button>
    </div>

    <!-- 6. 停止画面 -->
    <div id="screen-off" class="stage"><h1>LOCKED</h1><p>この端末は封印されています。</p><button class="btn" onclick="location.reload()">再起動</button></div>
    
    <!-- 7. クリア画面 -->
    <div id="screen-clear" class="stage"><h1>COMPLETE!</h1><p>全ての謎を解き明かした！</p><button class="btn" onclick="location.reload()">初期設定に戻る</button></div>
</div>

<div id="map-overlay" onclick="toggleMap(false)"><img id="map-img" src=""></div>

<script>
    // ★ここにデプロイ後のURLを貼り付け
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxzBojekErnda7Rsjj4rYCybFCqcpTMYIq-jyHT-Iz6nmnpdplymYEZ5QyfYo9djBZkpw/exec";
    
    let tid = null, riddles = [], step = 0, mainScanner = null;
    let configData = {};

    function sel(n) {
        tid = n;
        document.querySelectorAll('.id-btn').forEach(b => b.classList.toggle('selected', b.innerText == n));
        document.getElementById('con-btn').disabled = false;
    }

    function show(id) {
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function connect() {
        show('screen-loading');
        try {
            const res = await fetch(`${GAS_URL}?id=${tid}`);
            configData = await res.json();
            if (!configData.is_active) return show('screen-off');
            riddles = configData.riddles;
            document.getElementById('ui-story').innerText = configData.story || "";
            document.getElementById('map-img').src = configData.map_url || "";
            show('screen-story');
        } catch (e) { alert("接続エラー"); show('screen-setup'); }
    }

    function startMainGame() {
        initScanGate();
    }

    async function initScanGate() {
        show('screen-qr-gate');
        // 合言葉を「端末ID-ステージ番号」に設定
        const targetQR = `${tid}-${step + 1}`;
        document.getElementById('ui-scan-msg').innerText = `STAGE ${step + 1} の紋章を探せ`;
        document.getElementById('scan-status').innerText = `コード「${targetQR}」を読み取ってください`;

        if (!mainScanner) mainScanner = new Html5Qrcode("game-reader");
        
        try {
            await mainScanner.start({facingMode:"environment"}, {fps:10, qrbox:220}, (text) => {
                if (text.trim() === targetQR) {
                    mainScanner.stop().then(() => {
                        showRiddle();
                    });
                } else {
                    document.getElementById('scan-status').innerText = "違うコードです！";
                    document.getElementById('scan-status').style.color = "red";
                }
            });
        } catch (e) { alert("カメラエラー：ブラウザの権限を確認してください"); }
    }

    function showRiddle() {
        show('screen-riddle');
        document.getElementById('ui-progress').innerText = `STAGE ${step + 1} / 5`;
        document.getElementById('ui-question').innerText = riddles[step].question;
        document.getElementById('ans-input').value = "";
    }

    function judge() {
        const u = document.getElementById('ans-input').value.trim();
        const a = riddles[step].answer.toString().trim();
        if (u === a && a !== "") {
            step++;
            if (step >= 5) {
                show('screen-clear');
            } else {
                initScanGate(); // 次のステージのQRスキャンへ
            }
        } else {
            const b = document.getElementById('main-box');
            b.classList.add('shake');
            setTimeout(() => b.classList.remove('shake'), 400);
        }
    }

    function toggleMap(v) { document.getElementById('map-overlay').style.display = v ? 'flex' : 'none'; }
</script>
</body>
</html>
