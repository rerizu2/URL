<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2IA Riddle Adventure</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --accent-color: #c5a059;
            --text-color: #e0e0e0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Yu Mincho', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 20px;
            border: 2px solid var(--accent-color);
            background: rgba(20, 20, 20, 0.95);
            text-align: center;
        }
        .stage { display: none; animation: fadeIn 0.8s forwards; }
        .active { display: block; }
        h1 { color: var(--accent-color); letter-spacing: 3px; }
        .q-text { font-size: 1.2rem; margin: 30px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        input[type="text"] {
            background: transparent; border: none; border-bottom: 2px solid var(--accent-color);
            color: white; padding: 10px; width: 80%; text-align: center; font-size: 1.2rem; outline: none;
        }
        .btn {
            background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color);
            padding: 10px 30px; cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .btn:hover { background: var(--accent-color); color: #000; }
        .progress { color: #666; font-size: 0.8rem; margin-bottom: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <!-- ローディング -->
    <div id="screen-loading" class="stage active">
        <p>書を解読中...</p>
    </div>

    <!-- 停止画面 -->
    <div id="screen-off" class="stage">
        <h1>STOPPED</h1>
        <p>この端末は現在、使用できません。</p>
    </div>

    <!-- メイン画面 -->
    <div id="screen-game" class="stage">
        <div class="progress" id="progress-text">STAGE 1 / 5</div>
        <h1 id="terminal-name">TERMINAL</h1>
        <div class="q-text" id="question-area">---</div>
        <input type="text" id="ans-input" placeholder="答えを入力..." autocomplete="off">
        <br>
        <button class="btn" onclick="judge()">解錠</button>
    </div>

    <!-- クリア画面 -->
    <div id="screen-clear" class="stage">
        <h1>COMPLETE</h1>
        <p>全ての謎を解き明かした！</p>
        <button class="btn" onclick="location.reload()">もう一度</button>
    </div>
</div>

<script>
    // ★ GASでデプロイしたURLをここに貼り付け
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxO9R5c-zKB9meLuvWrviGqy96UB9Sp9L_mrMsdj--UjDu5xgIZ0XYrMhL8LORz50_OGg/exec";

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || "1";

    let riddles = [];
    let step = 0;

    async function init() {
        try {
            const res = await fetch(`${GAS_URL}?id=${id}`);
            const config = await res.json();

            // 稼働チェック
            if (!config.is_active) {
                show('screen-off');
                return;
            }

            riddles = config.riddles;
            document.getElementById('terminal-name').innerText = `TERMINAL ${id}`;
            update();
            show('screen-game');
        } catch (e) {
            document.getElementById('screen-loading').innerText = "エラー: 接続に失敗しました。";
        }
    }

    function show(sid) {
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        document.getElementById(sid).classList.add('active');
    }

    function update() {
        document.getElementById('progress-text').innerText = `STAGE ${step + 1} / 5`;
        document.getElementById('question-area').innerText = riddles[step].question;
        document.getElementById('ans-input').value = "";
    }

    function judge() {
        const val = document.getElementById('ans-input').value.trim();
        const collect = riddles[step].answer.toString().trim();

        if (val === collect) {
            step++;
            if (step >= 5) {
                show('screen-clear');
            } else {
                update();
            }
        } else {
            const b = document.getElementById('game-box');
            b.classList.add('shake');
            setTimeout(() => b.classList.remove('shake'), 400);
        }
    }

    window.onload = init;
</script>
</body>
</html>
