<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2IA Riddle Adventure</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --accent: #c5a059; --bg: #0d0d0d; --text: #e0e0e0; --danger: #8b0000; }
        body { background: var(--bg); color: var(--text); font-family: 'Yu Mincho', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 500px; padding: 35px 25px; border: 2px solid var(--accent); background: rgba(20,20,20,0.95); text-align: center; box-shadow: 0 0 30px #000; position: relative; }
        .stage { display: none; }
        .active { display: block; animation: fadeIn 0.5s; }
        
        #ui-timer { font-size: 1.2rem; color: var(--accent); font-weight: bold; margin-bottom: 15px; border: 1px solid var(--accent); display: none; padding: 5px 20px; border-radius: 20px; letter-spacing: 2px; }
        .time-warning { color: #ff4444 !important; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        h1 { color: var(--accent); letter-spacing: 3px; font-size: 1.6rem; margin-bottom: 20px; }
        .btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 12px 24px; cursor: pointer; margin: 10px; transition: 0.3s; font-size: 1.1rem; min-width: 180px; outline: none; }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-sm { font-size: 0.75rem; padding: 6px 12px; opacity: 0.6; border-color: #666; color: #aaa; min-width: 80px; }
        .btn-sm:hover { opacity: 1; background: var(--danger); color: white; border-color: var(--danger); }

        .id-btn { width: 45px; height: 45px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin: 5px; font-size: 1.1rem; }
        .id-btn.selected { background: var(--accent); color: #000; }
        
        input { background: transparent; border: none; border-bottom: 2px solid var(--accent); color: #fff; padding: 10px; width: 85%; text-align: center; font-size: 1.4rem; outline: none; margin: 20px 0; }
        .story-text { text-align: left; line-height: 1.8; font-size: 1.1rem; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 5px; white-space: pre-wrap; margin-bottom: 20px; }
        #game-reader, #rule-reader { width: 100% !important; border-radius: 8px; overflow: hidden; margin-top: 15px; min-height: 250px; background: #000; border: 1px solid #444; }
        
        .footer-btns { margin-top: 30px; display: flex; justify-content: center; gap: 10px; border-top: 1px solid #333; padding-top: 20px; }
        .map-btn-float { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; padding: 5px 10px; z-index: 10; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
        #map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; }
        #map-img { max-width: 90%; max-height: 80%; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <div id="ui-timer">60:00</div>

    <!-- 1. 端末設定 -->
    <div id="screen-setup" class="stage active">
        <h1>SET TERMINAL</h1>
        <div id="id-selector">
            <button class="id-btn" onclick="sel(1)">1</button>
            <button class="id-btn" onclick="sel(2)">2</button>
            <button class="id-btn" onclick="sel(3)">3</button>
            <button class="id-btn" onclick="sel(4)">4</button>
            <button class="id-btn" onclick="sel(5)">5</button>
        </div>
        <button class="btn" id="con-btn" onclick="connect()" disabled>接続開始</button>
    </div>

    <!-- 2. ローディング -->
    <div id="screen-loading" class="stage"><p>同期中...</p></div>

    <!-- 3. スタート画面 -->
    <div id="screen-main-start" class="stage">
        <h1 id="ui-terminal-ready">TERMINAL READY</h1>
        <button class="btn" onclick="startRuleScan()">「ルール説明」をスキャン</button>
    </div>

    <!-- 4. ルールスキャン -->
    <div id="screen-rule-scan" class="stage">
        <h1>RULE SCAN</h1>
        <div id="rule-reader"></div>
        <p id="rule-scan-status" style="font-size:0.8rem; color:#888; margin-top:10px;">QRコードを映してください</p>
    </div>

    <!-- 5. ルール表示 -->
    <div id="screen-rules-content" class="stage">
        <h1>RULES</h1>
        <div class="story-text" style="font-size: 0.9rem;">
            【制限時間：60分】<br>
            ・物語へ進むとタイマーが始動します。<br>
            ・時間切れは即リタイアとなります。<br>
            ・右上のMAPボタンを活用してください。<br>
            ・トラブル時は下の「緊急事態」ボタンを。
        </div>
        <button class="btn" onclick="initGameSession()">理解した（物語へ）</button>
    </div>

    <!-- 6. 物語画面 -->
    <div id="screen-story" class="stage">
        <h1 id="ui-story-title">STAGE</h1>
        <div class="story-text" id="ui-story-text">...</div>
        <button id="ui-story-btn" class="btn" onclick="showScan()">探索へ進む</button>
    </div>

    <!-- 7. QRスキャン待機 -->
    <div id="screen-qr" class="stage">
        <button class="btn map-btn-float" onclick="toggleMap(true)">MAP</button>
        <p id="ui-scan-msg" style="color:var(--accent); font-weight:bold;">紋章(QR)をスキャン</p>
        <div id="game-reader"></div>
        <div class="footer-btns">
            <button class="btn btn-sm" onclick="sendEmergency()">緊急事態</button>
            <button class="btn btn-sm" onclick="confirmRetire()">リタイア</button>
        </div>
    </div>

    <!-- 8. 問題回答 -->
    <div id="screen-riddle" class="stage">
        <button class="btn map-btn-float" onclick="toggleMap(true)">MAP</button>
        <p id="ui-progress" style="font-size:0.8rem; color:#666;">1 / 5</p>
        <div id="ui-question" style="font-size:1.2rem; margin:20px 0; min-height:100px; display:flex; align-items:center; justify-content:center; white-space:pre-wrap;">---</div>
        <input type="text" id="ans-input" placeholder="答えを入力..." autocomplete="off">
        <br>
        <button class="btn" onclick="judge()">送信</button>
        <div class="footer-btns">
            <button class="btn btn-sm" onclick="sendEmergency()">緊急事態</button>
            <button class="btn btn-sm" onclick="confirmRetire()">リタイア</button>
        </div>
    </div>

    <!-- 状態画面 -->
    <div id="screen-retire" class="stage"><h1 style="color:var(--danger);">GAME OVER</h1><div class="story-text" id="ui-retire-msg" style="text-align:center; font-size:2rem; color:var(--danger);"></div><button class="btn" onclick="location.reload()">TOPへ</button></div>
    <div id="screen-off" class="stage"><h1>LOCKED</h1><button class="btn" onclick="location.reload()">再試行</button></div>
    <div id="screen-clear" class="stage"><h1>COMPLETE!</h1><p>全ての謎を解き明かした！</p><button class="btn" onclick="location.reload()">最初に戻る</button></div>
</div>

<div id="map-overlay" onclick="toggleMap(false)"><img id="map-img" src=""></div>

<script>
    // ★ GASのURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwj5c6-qI7brpJV6-nXZlmqWCqCKjgO9ZYse6OUjT7f5Bx8kZgGqCQiNlQMvKsOay7GJg/exec"; 
    
    let tid = null, riddles = [], step = 0, currentScanner = null, configData = {};
    let timeLeft = 3600; 
    let timerInterval = null;

    function sel(n) {
        tid = n;
        document.querySelectorAll('.id-btn').forEach(b => b.classList.toggle('selected', b.innerText == n));
        document.getElementById('con-btn').disabled = false;
    }

    function show(id) {
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function connect() {
        show('screen-loading');
        try {
            const res = await fetch(`${GAS_URL}?id=${tid}`);
            configData = await res.json();
            riddles = configData.riddles;
            document.getElementById('ui-terminal-ready').innerText = `TERMINAL ${tid} READY`;
            document.getElementById('ui-retire-msg').innerText = configData.retire_msg;
            document.getElementById('map-img').src = configData.map_url || "";
            show('screen-main-start');
        } catch (e) { alert("接続エラー"); show('screen-setup'); }
    }

    async function startRuleScan() {
        show('screen-rule-scan');
        currentScanner = new Html5Qrcode("rule-reader");
        try {
            await currentScanner.start({facingMode:"environment"}, {fps:10, qrbox:220}, (t) => {
                if (t.trim() === "ルール説明") {
                    currentScanner.stop().then(() => { currentScanner = null; show('screen-rules-content'); });
                }
            });
        } catch (e) { alert("カメラ起動失敗"); }
    }

    function initGameSession() {
        startTimer();
        startStage();
    }

    function startTimer() {
        document.getElementById('ui-timer').style.display = 'inline-block';
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) { clearInterval(timerInterval); autoRetireByTimeup(); }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('ui-timer').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 300) document.getElementById('ui-timer').classList.add('time-warning');
    }

    async function autoRetireByTimeup() {
        alert("制限時間終了です！");
        if(currentScanner) currentScanner.stop();
        await fetch(`${GAS_URL}?action=retire&id=${tid}`, {mode:'no-cors'});
        show('screen-retire');
    }

    function startStage() {
        show('screen-story');
        document.getElementById('ui-story-title').innerText = `STAGE ${step + 1}`;
        document.getElementById('ui-story-text').innerText = riddles[step].story;
        document.getElementById('ui-story-btn').innerText = "探索へ進む";
        document.getElementById('ui-story-btn').onclick = showScan;
    }

    function showEndingStory() {
        clearInterval(timerInterval);
        document.getElementById('ui-timer').style.display = 'none';
        show('screen-story');
        document.getElementById('ui-story-title').innerText = "EPILOGUE";
        document.getElementById('ui-story-text').innerText = configData.ending_story;
        document.getElementById('ui-story-btn').innerText = "完了";
        document.getElementById('ui-story-btn').onclick = () => show('screen-clear');
    }

    async function showScan() {
        show('screen-qr');
        const target = riddles[step].qr_key.toString().trim();
        const full = "2IAの教室にぜひ来てください！" + target;
        currentScanner = new Html5Qrcode("game-reader");
        try {
            await currentScanner.start({facingMode:"environment"}, {fps:10, qrbox:220}, (t) => {
                const scan = t.trim();
                if (scan === full || scan === target) {
                    currentScanner.stop().then(() => { currentScanner = null; showRiddle(); });
                }
            });
        } catch (e) { alert("カメラ起動失敗"); }
    }

    function showRiddle() {
        show('screen-riddle');
        document.getElementById('ui-progress').innerText = `${step + 1} / 5`;
        document.getElementById('ui-question').innerText = riddles[step].question;
        document.getElementById('ans-input').value = "";
    }

    function judge() {
        if (document.getElementById('ans-input').value.trim() === riddles[step].answer.toString().trim()) {
            step++;
            if (step >= 5) showEndingStory(); else startStage();
        } else { 
            document.getElementById('game-box').classList.add('shake');
            setTimeout(() => document.getElementById('game-box').classList.remove('shake'), 400);
        }
    }

    function toggleMap(v) { document.getElementById('map-overlay').style.display = v ? 'flex' : 'none'; }

    // 緊急事態：内容を入力させて送信
    async function sendEmergency() {
        const userInput = prompt("緊急内容を入力してください（例：カメラが動かない、ヒントが欲しい 等）");
        if (userInput === null || userInput.trim() === "") return; // キャンセル時

        fetch(`${GAS_URL}?action=emergency&id=${tid}&msg=${encodeURIComponent(userInput)}`, {mode:'no-cors'});
        alert("管理者へメッセージを送信しました。\n指示： " + configData.emergency_msg);
    }

    async function confirmRetire() {
        if (confirm("本当にリタイアしますか？")) {
            clearInterval(timerInterval);
            fetch(`${GAS_URL}?action=retire&id=${tid}`, {mode:'no-cors'});
            if(currentScanner) currentScanner.stop().finally(() => show('screen-retire'));
            else show('screen-retire');
        }
    }
</script>
</body>
</html>
