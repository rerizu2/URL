<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デバッグ版：吉野町マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100vh; background: #eee; } /* 背景色をつけて地図自体が出てるか確認 */
        .overlay {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 10px; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="overlay">
        <b>マップ読み込みテスト</b><br>
        <span id="status">読み込み中...</span>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ★ここに新しいGASのURLを貼り付け
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby2OXZl-fNfb-xV0Ym1-6pRm2v0Go9Xt7MN2XIPB2pEX_EgBUuKFYEPvg6_opXKqnHz/exec'; 

        const map = L.map('map').setView([34.3750, 135.8650], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        async function fetchMapData() {
            const statusEl = document.getElementById('status');
            console.log("GASへの通信開始...");

            try {
                const response = await fetch(GAS_URL);
                console.log("GASからのレスポンス受信:", response);

                if (!response.ok) throw new Error("ネットワークエラーです");

                const data = await response.json();
                console.log("受け取ったデータ一覧:", data);

                if (data.length === 0) {
                    statusEl.innerText = "データが空です（シートの中身を確認してください）";
                    return;
                }

                data.forEach((item, index) => {
                    const lat = parseFloat(item['緯度']);
                    const lng = parseFloat(item['経度']);
                    const name = item['場所名'];
                    const type = item['タイプ'];

                    console.log(`地点${index + 1}: ${name} (${lat}, ${lng}) - ${type}`);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const color = (type === 'クイズ') ? 'red' : 'blue';
                        
                        // 簡易的な円形マーカーを表示（アイコン画像の問題を避けるため）
                        L.circleMarker([lat, lng], {
                            radius: 10,
                            fillColor: color,
                            color: "#fff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(map).bindPopup(`<b>${name}</b><br>${type}<br>${item['詳細']}`);
                    } else {
                        console.warn(`地点${index + 1} (${name}) の座標が正しくありません。`);
                    }
                });

                statusEl.innerText = `成功：${data.length}件のピンを表示`;

            } catch (e) {
                console.error("エラー詳細:", e);
                statusEl.innerHTML = `<span style="color:red">エラー発生: ${e.message}</span><br><small>コンソール(F12)を確認してください</small>`;
            }
        }

        fetchMapData();
    </script>
</body>
</html>
