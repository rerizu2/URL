<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID指定型 YouTube同期プレイヤー</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 800px; width: 100%; background: #2d2d2d; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        
        .room-setup { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #444; }
        .player-area { display: none; } /* ID入力前は非表示 */

        input[type="text"] { padding: 12px; border: none; border-radius: 5px; width: 60%; margin-bottom: 10px; }
        button { padding: 12px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.3s; margin: 5px; }
        
        .btn-join { background: #28a745; color: white; }
        .btn-load { background: #ff0000; color: white; }
        .btn-control { background: #444; color: white; }
        button:hover { opacity: 0.8; }

        #player { width: 100%; aspect-ratio: 16 / 9; background: #000; margin: 15px 0; border-radius: 8px; }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; background: #444; font-size: 0.8em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube Sync Room</h2>

    <!-- 1. ルーム設定エリア -->
    <div id="roomSetup" class="room-setup">
        <input type="text" id="roomIdInput" placeholder="ルームIDを入力 (例: party777)">
        <button class="btn-join" onclick="joinRoom()">ルームに入る / 作成</button>
        <p style="font-size: 0.8em; color: #aaa;">※同じIDを入れた端末同士が同期されます</p>
    </div>

    <!-- 2. プレイヤーエリア (最初は隠す) -->
    <div id="playerArea" class="player-area">
        <div class="status-badge" id="currentRoomDisplay">Room: ---</div>
        
        <div class="input-group">
            <input type="text" id="youtubeUrl" placeholder="YouTubeのURLを入力">
            <button class="btn-load" onclick="loadNewVideo()">動画を変更</button>
        </div>

        <div id="player"></div>

        <div class="controls">
            <button class="btn-control" onclick="sendControl('play')">▶ 再生</button>
            <button class="btn-control" onclick="sendControl('pause')">❚❚ 一時停止</button>
            <button class="btn-control" onclick="sendControl('sync')">🔄 強制同期</button>
        </div>
        <div id="status" style="margin-top:10px; color:#888;">待機中...</div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // --- Firebase設定 (自分のものに書き換えてください) ---
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  let player;
  let currentRoomId = null;
  let syncRef = null;
  let isReceiving = false;

  // YouTubeプレイヤーの初期準備
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('player', {
      height: '360',
      width: '640',
      videoId: 'dQw4w9WgXcQ', 
      playerVars: { 'playsinline': 1 },
      events: { 'onReady': () => console.log("Player Ready") }
    });
  };

  // ルームに参加する関数
  window.joinRoom = () => {
    const idInput = document.getElementById('roomIdInput').value.trim();
    if (!idInput) return alert("IDを入力してください");

    // 以前のリスナーがあれば解除
    if (syncRef) off(syncRef);

    currentRoomId = idInput;
    syncRef = ref(db, 'rooms/' + currentRoomId);

    // 表示切り替え
    document.getElementById('roomSetup').style.display = 'none';
    document.getElementById('playerArea').style.display = 'block';
    document.getElementById('currentRoomDisplay').innerText = "Room ID: " + currentRoomId;

    // そのルームのデータ監視開始
    listenToRoom();
  };

  function listenToRoom() {
    onValue(syncRef, (snapshot) => {
      const data = snapshot.val();
      if (!data || !player) return;

      isReceiving = true;
      
      // 動画IDの同期
      if (player.getVideoData().video_id !== data.videoId) {
        player.loadVideoById(data.videoId, data.currentTime);
      }

      // 時間と再生状態の同期
      const delay = (Date.now() - data.timestamp) / 1000;
      const targetTime = data.currentTime + (data.command === 'play' ? delay : 0);
      
      if (Math.abs(player.getCurrentTime() - targetTime) > 2) {
        player.seekTo(targetTime, true);
      }

      if (data.command === 'play') {
        player.playVideo();
      } else if (data.command === 'pause') {
        player.pauseVideo();
      }

      setTimeout(() => { isReceiving = false; }, 1000);
    });
  }

  // 操作の送信
  window.sendControl = (command) => {
    if (!currentRoomId || !player) return;
    set(syncRef, {
      command: command,
      videoId: player.getVideoData().video_id,
      currentTime: player.getCurrentTime(),
      timestamp: Date.now()
    });
  };

  // 新しい動画の読み込み
  window.loadNewVideo = () => {
    const url = document.getElementById('youtubeUrl').value;
    const videoId = extractVideoId(url);
    if (videoId) {
      set(syncRef, {
        command: 'play',
        videoId: videoId,
        currentTime: 0,
        timestamp: Date.now()
      });
    }
  };

  function extractVideoId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }
</script>
</body>
</html>
