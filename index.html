<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Audio Streamer</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .description {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #startBtn {
            background-color: var(--primary);
            color: white;
        }

        #startBtn:hover {
            background-color: var(--primary-hover);
        }

        #stopBtn {
            background-color: #444;
            color: #ccc;
        }

        #stopBtn:not(:disabled):hover {
            background-color: #ff4444;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .params {
            text-align: left;
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .value-badge {
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: white;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .status-area {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #333;
        }

        #status {
            font-weight: bold;
            color: #666;
        }

        .active #status {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        .warning {
            font-size: 0.8rem;
            color: #ffa500;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Echo Streamer</h1>
    <p class="description">画面共有のシステム音にディレイ効果を追加します。</p>

    <div class="controls">
        <button id="startBtn">画面共有を開始してエコーをかける</button>
        <button id="stopBtn" disabled>停止</button>
    </div>

    <div class="params">
        <div class="param-group">
            <div class="label-row">
                <span>遅延時間 (Delay Time)</span>
                <span class="value-badge" id="delayVal">0.4s</span>
            </div>
            <input type="range" id="delayTime" min="0.05" max="2" step="0.05" value="0.4">
        </div>

        <div class="param-group">
            <div class="label-row">
                <span>エコーの強さ (Feedback)</span>
                <span class="value-badge" id="feedbackVal">0.4</span>
            </div>
            <input type="range" id="feedback" min="0" max="0.9" step="0.05" value="0.4">
        </div>
    </div>

    <div class="status-area">
        <div id="status">OFFLINE</div>
        <p class="warning">※ ハウリングを防ぐためイヤホンを推奨します</p>
    </div>
</div>

<script>
    let audioCtx;
    let source;
    let delayNode;
    let feedbackGain;
    let stream;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const delayInput = document.getElementById('delayTime');
    const feedbackInput = document.getElementById('feedback');
    const delayValText = document.getElementById('delayVal');
    const feedbackValText = document.getElementById('feedbackVal');
    const statusText = document.getElementById('status');
    const appContainer = document.getElementById('app');

    // エコー開始処理
    startBtn.addEventListener('click', async () => {
        try {
            // 1. 画面共有ストリームの取得
            // 注: ブラウザのセキュリティ制限により、ユーザー操作（クリック）が必須
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

            // 音声トラックがあるかチェック
            if (stream.getAudioTracks().length === 0) {
                alert("音声が見つかりません。共有時に「システムオーディオを共有」にチェックを入れてください。");
                stopStream();
                return;
            }

            // 2. AudioContextの初期化
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaStreamSource(stream);

            // 3. ノードの作成
            delayNode = audioCtx.createDelay(2.0); // 最大2秒のバッファ
            delayNode.delayTime.value = parseFloat(delayInput.value);

            feedbackGain = audioCtx.createGain();
            feedbackGain.gain.value = parseFloat(feedbackInput.value);

            // 4. 接続（ルーティング）
            // [Source] ──┬─> [Destination (スピーカー/出力)]
            //            └─> [Delay Node] ──┬─> [Destination]
            //                    ^          │
            //                    └─ [Gain] <┘ (フィードバックループ)
            
            source.connect(audioCtx.destination); // 直接音
            source.connect(delayNode);            // 遅延回路へ
            delayNode.connect(feedbackGain);      // 遅延音をフィードバック
            feedbackGain.connect(delayNode);      // フィードバックを遅延へ戻す
            delayNode.connect(audioCtx.destination); // 遅延音を出力

            // UIの更新
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusText.innerText = "エコー稼働中";
            appContainer.classList.add('active');

            // 画面共有が手動で停止された場合の処理
            stream.getVideoTracks()[0].onended = () => {
                stopStream();
            };

        } catch (err) {
            console.error("Error:", err);
            if (err.name !== 'NotAllowedError') {
                alert("エラーが発生しました: " + err.message);
            }
        }
    });

    // パラメータ変更の監視
    delayInput.addEventListener('input', (e) => {
        const val = e.target.value;
        delayValText.innerText = val + "s";
        if (delayNode) {
            // 急激な変化によるノイズを防ぐため0.1秒かけて変化させる
            delayNode.delayTime.exponentialRampToValueAtTime(parseFloat(val), audioCtx.currentTime + 0.1);
        }
    });

    feedbackInput.addEventListener('input', (e) => {
        const val = e.target.value;
        feedbackValText.innerText = val;
        if (feedbackGain) {
            feedbackGain.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }
    });

    // 停止処理
    stopBtn.addEventListener('click', stopStream);

    function stopStream() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        if (audioCtx) {
            audioCtx.close();
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusText.innerText = "OFFLINE";
        appContainer.classList.remove('active');
    }
</script>

</body>
</html>
