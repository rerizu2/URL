<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画面共有システム</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 600px; }
        h1 { color: #00d4ff; }
        .menu-btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .host-btn { background: #e91e63; color: white; }
        .join-btn { background: #00d4ff; color: #121212; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #idDisplay { font-size: 2rem; font-weight: bold; color: #ffeb3b; margin: 15px 0; display: none; }
        #joinForm { display: none; margin: 20px 0; }
        input { padding: 10px; font-size: 18px; border-radius: 5px; border: none; width: 100px; text-align: center; }
        
        .video-container { width: 100%; margin-top: 20px; background: black; border-radius: 10px; overflow: hidden; display: none; }
        video { width: 100%; height: auto; }
        .status { margin-top: 10px; font-size: 0.9em; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Screen Sync</h1>
    
    <div id="initialMenu" class="menu-btns">
        <button class="host-btn" onclick="setupHost()">ホストとして配信</button>
        <button class="join-btn" onclick="showJoinInput()">参加する</button>
    </div>

    <!-- ホスト用ID表示 -->
    <div id="idDisplay">ID: <span id="myIdText">----</span></div>

    <!-- 参加用入力フォーム -->
    <div id="joinForm">
        <input type="text" id="targetId" placeholder="4桁ID" maxlength="4">
        <button class="join-btn" onclick="setupJoin()">接続</button>
    </div>

    <!-- ビデオ表示エリア -->
    <div id="videoContainer" class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    
    <div id="status" class="status">役割を選択してください</div>
</div>

<!-- PeerJS ライブラリの読み込み -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    let peer;
    let localStream;

    // --- ホスト側の処理 ---
    async function setupHost() {
        // 4桁のランダムなIDを生成
        const randomId = Math.floor(1000 + Math.random() * 9000).toString();
        
        try {
            // 画面キャプチャの取得（ブラウザが画面選択ダイアログを出す）
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: true
            });

            // IDを指定してPeerを作成
            peer = new Peer('sync-' + randomId);

            peer.on('open', (id) => {
                document.getElementById('initialMenu').style.display = 'none';
                document.getElementById('idDisplay').style.display = 'block';
                document.getElementById('myIdText').innerText = randomId;
                document.getElementById('status').innerText = "配信中... 参加者を待っています。";
                
                // ビデオプレビュー表示
                const videoEl = document.getElementById('remoteVideo');
                videoEl.srcObject = localStream;
                document.getElementById('videoContainer').style.display = 'block';
            });

            // 参加者から接続（コール）が来た時の処理
            peer.on('call', (call) => {
                call.answer(localStream); // 自分の画面を送る
                document.getElementById('status').innerText = "参加者が接続しました！";
            });

            peer.on('error', (err) => {
                alert("エラー: IDが既に使用されている可能性があります。もう一度試してください。");
                location.reload();
            });

        } catch (err) {
            console.error(err);
            alert("画面共有の許可が必要です。");
        }
    }

    // --- 参加者側の処理 ---
    function showJoinInput() {
        document.getElementById('initialMenu').style.display = 'none';
        document.getElementById('joinForm').style.display = 'block';
        document.getElementById('status').innerText = "ホストの4桁IDを入力してください。";
    }

    function setupJoin() {
        const targetId = document.getElementById('targetId').value;
        if (targetId.length !== 4) return alert("4桁のIDを入力してください");

        peer = new Peer(); // 参加者はランダムIDでOK

        peer.on('open', (id) => {
            document.getElementById('status').innerText = "ホストに接続中...";
            
            // ホストに電話をかける（空のストリームを送り、相手のストリームをもらう）
            const call = peer.call('sync-' + targetId, new MediaStream());

            call.on('stream', (remoteStream) => {
                const videoEl = document.getElementById('remoteVideo');
                videoEl.srcObject = remoteStream;
                document.getElementById('videoContainer').style.display = 'block';
                document.getElementById('joinForm').style.display = 'none';
                document.getElementById('status').innerText = "受信中：ホストの画面を表示しています。";
            });

            call.on('error', (err) => {
                alert("接続に失敗しました。IDが正しいか確認してください。");
            });
        });
    }
</script>

</body>
</html>
