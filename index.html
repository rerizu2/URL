<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID指定 画面レコーダー</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 800px; width: 100%; background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); text-align: center; }
        
        .setup-area { margin-bottom: 20px; }
        input[type="text"] { padding: 12px; border: none; border-radius: 5px; width: 50%; background: #333; color: white; margin-bottom: 10px; }
        
        .recorder-visual { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; margin: 20px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: contain; }

        .controls { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        button { padding: 12px 25px; cursor: pointer; border: none; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        
        .btn-start { background: #e91e63; color: white; }
        .btn-stop { background: #555; color: white; }
        .btn-download { background: #00bcd4; color: white; display: none; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .status { margin-top: 15px; font-size: 0.9em; color: #aaa; }
        .recording-dot { width: 12px; height: 12px; background: red; border-radius: 50%; display: inline-block; margin-right: 8px; animation: blink 1s infinite; display: none; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Screen Recorder <small id="displayId" style="color: #e91e63;"></small></h2>

    <div class="setup-area" id="setupArea">
        <input type="text" id="roomIdInput" placeholder="セッションIDを入力 (例: meeting-01)">
        <p style="font-size: 0.8em; color: #888;">IDはファイル名に使用されます</p>
    </div>

    <div class="recorder-visual">
        <div id="recordingDot" class="recording-dot"></div>
        <video id="preview" autoplay muted></video>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startRecording()">録画開始</button>
        <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>停止</button>
        <a id="downloadBtn" class="btn-download"><button class="btn-download" style="display:inline;">保存する</button></a>
    </div>

    <div id="status" class="status">IDを入力して録画を開始してください</div>
</div>

<script>
    let mediaRecorder;
    let recordedChunks = [];
    let stream;

    async function startRecording() {
        const roomId = document.getElementById('roomIdInput').value.trim();
        if (!roomId) {
            alert("IDを入力してください");
            return;
        }

        try {
            // 画面キャプチャの開始（音声も含む設定）
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor: "always" },
                audio: true
            });

            // プレビューに表示
            const videoPreview = document.getElementById('preview');
            videoPreview.srcObject = stream;

            // MediaRecorderの設定
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm; codecs=vp9'
            });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                exportVideo(roomId);
            };

            // 録画開始
            recordedChunks = [];
            mediaRecorder.start();

            // UIの更新
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('roomIdInput').disabled = true;
            document.getElementById('recordingDot').style.display = 'inline-block';
            document.getElementById('status').innerText = "録画中...";
            document.getElementById('displayId').innerText = `[ID: ${roomId}]`;

        } catch (err) {
            console.error("Error: " + err);
            alert("画面キャプチャがキャンセルされたか、失敗しました。");
        }
    }

    function stopRecording() {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop()); // キャプチャ停止

        // UIの更新
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('roomIdInput').disabled = false;
        document.getElementById('recordingDot').style.display = 'none';
        document.getElementById('status').innerText = "録画完了。保存してください。";
    }

    function exportVideo(roomId) {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = url;
        downloadBtn.download = `recording_${roomId}_${new Date().getTime()}.webm`;
        downloadBtn.style.display = 'inline-block';

        // プレビュー動画を録画した動画に切り替える
        const videoPreview = document.getElementById('preview');
        videoPreview.srcObject = null;
        videoPreview.src = url;
        videoPreview.controls = true;
        videoPreview.play();
    }
</script>

</body>
</html>
