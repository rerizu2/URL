<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
>

<title>共有カメラ</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  color: #fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button {
  font: inherit;
}

#app {
  position: fixed;

  inset: 0;

  background: #000;
}


/* =========================================
   カメラ
========================================= */

#cameraScreen {

  position: absolute;

  inset: 0;

  background: #000;

  overflow: hidden;
}

#video {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  background: #000;
}


/* =========================================
   カメラ無効画面
========================================= */

#disabledScreen {

  position: absolute;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 15px;

  background:
    radial-gradient(
      circle at center,
      #202020,
      #000
    );

  text-align: center;

  padding: 30px;
}

#disabledScreen.show {
  display: flex;
}

.disabledIcon {
  font-size: 70px;
}

.disabledTitle {
  font-size: 24px;
  font-weight: 700;
}

.disabledText {
  color: #aaa;
  line-height: 1.7;
}


/* =========================================
   上部
========================================= */

.topBar {

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 90px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    env(safe-area-inset-top)
    18px
    0
    18px;

  z-index: 20;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.7),
      transparent
    );
}

.topButton {

  width: 48px;
  height: 48px;

  border: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,.4);

  color: #fff;

  font-size: 22px;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  backdrop-filter: blur(10px);
}

.topButton:active {
  transform: scale(.9);
}

.topCenter {

  font-size: 15px;

  font-weight: 600;

  text-shadow:
    0 1px 5px #000;
}


/* =========================================
   ズーム
========================================= */

.zoomArea {

  position: absolute;

  right: 18px;

  top: 50%;

  transform:
    translateY(-50%);

  display: flex;

  flex-direction: column;

  gap: 8px;

  z-index: 20;
}

.zoomButton {

  width: 44px;
  height: 44px;

  border-radius: 50%;

  border: 1px solid
    rgba(255,255,255,.2);

  background:
    rgba(0,0,0,.45);

  color: #fff;

  font-size: 14px;

  backdrop-filter: blur(10px);
}


/* =========================================
   フォーカス
========================================= */

#focusBox {

  position: absolute;

  width: 70px;
  height: 70px;

  border: 2px solid #ffd60a;

  display: none;

  pointer-events: none;

  z-index: 15;
}


/* =========================================
   録画時間
========================================= */

#recording {

  position: absolute;

  top: 100px;

  left: 50%;

  transform:
    translateX(-50%);

  display: none;

  align-items: center;

  gap: 8px;

  padding:
    8px 14px;

  border-radius: 20px;

  background:
    rgba(0,0,0,.6);

  font-weight: 700;

  z-index: 30;
}

.recordDot {

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: red;

  animation:
    blink 1s infinite;
}

@keyframes blink {

  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .3;
  }
}


/* =========================================
   下部
========================================= */

.bottomBar {

  position: absolute;

  bottom: 0;

  left: 0;
  right: 0;

  padding:
    20px
    20px
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 16px;

  z-index: 20;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.8),
      transparent
    );
}


/* =========================================
   モード
========================================= */

.modeBar {

  display: flex;

  gap: 28px;

  padding: 8px 18px;

  border-radius: 30px;

  background:
    rgba(0,0,0,.45);

  backdrop-filter: blur(10px);
}

.mode {

  color: #aaa;

  font-size: 14px;

  cursor: pointer;
}

.mode.active {

  color: #fff;

  font-weight: 700;
}


/* =========================================
   シャッター
========================================= */

.captureRow {

  width: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  position: relative;
}

.captureButton {

  width: 76px;
  height: 76px;

  border-radius: 50%;

  border: 6px solid
    rgba(255,255,255,.8);

  background: #fff;

  cursor: pointer;

  box-shadow:
    0 0 0 4px
    rgba(0,0,0,.3);
}

.captureButton.videoMode {

  background: #ff3b30;
}

.captureButton.recording {

  transform: scale(.75);

  border-color: #ff3b30;
}

.sideButton {

  position: absolute;

  width: 48px;
  height: 48px;

  border: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,.45);

  color: #fff;

  font-size: 22px;

  backdrop-filter: blur(10px);
}

.sideButton.left {
  left: 15px;
}

.sideButton.right {
  right: 15px;
}


/* =========================================
   ギャラリー
========================================= */

#gallery {

  position: absolute;

  inset: 0;

  background:
    #101010;

  z-index: 100;

  display: none;

  overflow-y: auto;

  padding:
    80px 12px
    calc(30px + env(safe-area-inset-bottom));
}

#gallery.show {
  display: block;
}

.galleryHeader {

  position: fixed;

  top: 0;

  left: 0;

  right: 0;

  height: 70px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 10px 15px;

  background:
    rgba(16,16,16,.9);

  backdrop-filter: blur(15px);

  z-index: 110;
}

.galleryTitle {

  font-size: 20px;

  font-weight: 700;
}

.galleryClose {

  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 50%;

  background: #292929;

  color: #fff;

  font-size: 20px;
}

.tabs {

  display: flex;

  gap: 8px;

  margin-bottom: 15px;
}

.tab {

  border: 0;

  border-radius: 20px;

  padding:
    8px 15px;

  background: #242424;

  color: #aaa;
}

.tab.active {

  background: #fff;

  color: #000;
}


/* =========================================
   グリッド
========================================= */

.grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 4px;
}

.media {

  position: relative;

  aspect-ratio: 1 / 1;

  background: #222;

  overflow: hidden;

  cursor: pointer;
}

.media img {

  width: 100%;
  height: 100%;

  object-fit: cover;
}

.videoThumb {

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 5px;

  font-size: 42px;

  background:
    linear-gradient(
      135deg,
      #202020,
      #050505
    );
}

.videoLabel {

  font-size: 12px;

  color: #bbb;
}

.mineBadge {

  position: absolute;

  right: 5px;
  bottom: 5px;

  padding: 3px 7px;

  border-radius: 10px;

  font-size: 10px;

  background:
    rgba(0,0,0,.7);
}


/* =========================================
   プレビュー
========================================= */

#preview {

  position: fixed;

  inset: 0;

  z-index: 300;

  display: none;

  background:
    rgba(0,0,0,.96);

  align-items: center;

  justify-content: center;

  flex-direction: column;
}

#preview.show {
  display: flex;
}

.previewContent {

  max-width: 96vw;

  max-height: 70vh;

  display: flex;

  align-items: center;

  justify-content: center;
}

.previewContent img,
.previewContent video {

  max-width: 96vw;

  max-height: 70vh;

  object-fit: contain;
}

.previewInfo {

  margin-top: 15px;

  text-align: center;

  max-width: 90vw;
}

.previewName {

  font-weight: 700;

  word-break: break-all;
}

.previewButtons {

  display: flex;

  gap: 10px;

  margin-top: 20px;

  flex-wrap: wrap;

  justify-content: center;
}

.previewButton {

  border: 0;

  border-radius: 22px;

  padding:
    11px 18px;

  background: #292929;

  color: #fff;
}

.previewButton.primary {

  background: #fff;

  color: #000;
}

.previewButton.danger {

  background: #ff3b30;

  color: #fff;
}


/* =========================================
   ローディング
========================================= */

#loading {

  position: fixed;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 15px;

  background:
    rgba(0,0,0,.75);

  z-index: 500;

  backdrop-filter: blur(5px);
}

#loading.show {
  display: flex;
}

.loader {

  width: 45px;
  height: 45px;

  border:
    4px solid #444;

  border-top-color: #fff;

  border-radius: 50%;

  animation:
    spin 1s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }
}

.progress {

  width: 240px;

  height: 8px;

  border-radius: 10px;

  background: #333;

  overflow: hidden;
}

.progressInner {

  height: 100%;

  width: 0%;

  background: #fff;
}


/* =========================================
   PC
========================================= */

@media (min-width: 700px) {

  .grid {

    grid-template-columns:
      repeat(6, 1fr);
  }

  #gallery {

    padding-left: 30px;
    padding-right: 30px;
  }
}

</style>

</head>

<body>

<script>

/*************************************************
 * GAS URL
 *
 * ↓ここだけ変更
 *************************************************/

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbz-XHmJbbiGuF2QDdBnGz-_kccmPHWXXpcWrz22lbTvCPksR-b0KDY-RmoG1nRIph-S5Q/exec";


/*************************************************
 * 設定
 *************************************************/

const MAX_FILE_SIZE =
  20 * 1024 * 1024;

const CHUNK_SIZE =
  256 * 1024;

const MAX_RECORDING_TIME =
  60;


/*************************************************
 * DOM
 *************************************************/

const video =
  document.getElementById("video");

const captureButton =
  document.getElementById("captureButton");

const cameraScreen =
  document.getElementById("cameraScreen");

const disabledScreen =
  document.getElementById("disabledScreen");

const gallery =
  document.getElementById("gallery");

const mediaGrid =
  document.getElementById("mediaGrid");

const preview =
  document.getElementById("preview");

const previewContent =
  document.getElementById("previewContent");

const previewName =
  document.getElementById("previewName");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const progressInner =
  document.getElementById("progressInner");

const statusText =
  document.getElementById("statusText");

const recording =
  document.getElementById("recording");

const recordTime =
  document.getElementById("recordTime");


/*************************************************
 * Device ID
 *************************************************/

let deviceId =
  localStorage.getItem(
    "shared_camera_device_id"
  );


if (!deviceId) {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    deviceId =
      crypto.randomUUID();

  } else {

    deviceId =
      "device_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2);
  }


  localStorage.setItem(
    "shared_camera_device_id",
    deviceId
  );
}


/*************************************************
 * 状態
 *************************************************/

let cameraEnabled = false;

let stream = null;

let facingMode = "environment";

let currentMode = "photo";

let mediaRecorder = null;

let recordedChunks = [];

let recordingStartTime = 0;

let recordingTimer = null;

let currentZoom = 1;

let currentMedia = null;

let currentTab = "all";

let mediaList = [];


/*************************************************
 * JSONP
 *************************************************/

function gasGet(
  action,
  params = {}
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "gasCallback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams({

          action: action,

          callback:
            callbackName,

          ...params
        });


      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "GASへの接続がタイムアウトしました"
              )
            );

          },
          20000
        );


      window[callbackName] =
        function(data) {

          clearTimeout(timeout);

          cleanup();

          resolve(data);
        };


      function cleanup() {

        try {

          script.remove();

        } catch(e) {}

        try {

          delete window[
            callbackName
          ];

        } catch(e) {}
      }


      script.src =
        GAS_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          clearTimeout(timeout);

          cleanup();

          reject(
            new Error(
              "GASに接続できません"
            )
          );
        };


      document.body.appendChild(
        script
      );
    }
  );
}


/*************************************************
 * POST
 *************************************************/

function gasPost(
  action,
  data = {}
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.style.display =
        "none";


      iframe.name =
        "gasFrame_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        GAS_URL;

      form.target =
        iframe.name;


      function addInput(
        name,
        value
      ) {

        const input =
          document.createElement(
            "input"
          );

        input.type =
          "hidden";

        input.name =
          name;

        input.value =
          value;

        form.appendChild(
          input
        );
      }


      addInput(
        "action",
        action
      );


      Object.keys(data)
        .forEach(
          key => {

            addInput(
              key,
              data[key]
            );
          }
        );


      document.body.appendChild(
        form
      );


      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "アップロードがタイムアウトしました"
              )
            );

          },
          30000
        );


      iframe.onload =
        function() {

          clearTimeout(timeout);

          cleanup();

          resolve({
            success: true
          });
        };


      iframe.onerror =
        function() {

          clearTimeout(timeout);

          cleanup();

          reject(
            new Error(
              "アップロードに失敗しました"
            )
          );
        };


      form.submit();


      function cleanup() {

        try {
          form.remove();
        } catch(e) {}

        try {
          iframe.remove();
        } catch(e) {}
      }

    }
  );
}


/*************************************************
 * ローディング
 *************************************************/

function showLoading(
  text,
  progress = 0
) {

  loadingText.textContent =
    text;

  progressInner.style.width =
    progress + "%";

  loading.classList.add(
    "show"
  );
}


function hideLoading() {

  loading.classList.remove(
    "show"
  );
}


/*************************************************
 * 設定取得
 *************************************************/

async function loadSettings() {

  try {

    const result =
      await gasGet(
        "settings"
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        "設定取得失敗"
      );
    }


    cameraEnabled =
      result.cameraEnabled;


    if (!cameraEnabled) {

      disableCamera();

      return false;
    }


    disabledScreen.classList.remove(
      "show"
    );


    return true;

  } catch(error) {

    console.error(error);

    disableCamera(
      "GASに接続できないため、カメラを使用できません"
    );

    return false;
  }
}


/*************************************************
 * カメラ無効
 *************************************************/

function disableCamera(
  message
) {

  cameraEnabled =
    false;


  disabledScreen.classList.add(
    "show"
  );


  if (message) {

    disabledScreen.querySelector(
      ".disabledText"
    ).textContent =
      message;
  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream = null;
  }
}


/*************************************************
 * カメラ起動
 *************************************************/

async function startCamera() {

  if (!cameraEnabled) {

    disableCamera();

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "このブラウザではカメラを使用できません"
    );
  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }


  stream =
    await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode:
            facingMode,

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          },

          frameRate: {
            ideal: 30
          }
        },

        audio: true
      });


  video.srcObject =
    stream;


  await video.play();


  disabledScreen.classList.remove(
    "show"
  );


  statusText.textContent =
    "共有カメラ";
}


/*************************************************
 * カメラ切替
 *************************************************/

async function switchCamera() {

  if (!cameraEnabled) {
    return;
  }


  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";


  try {

    await startCamera();

  } catch(error) {

    alert(
      "カメラ切替に失敗しました\n\n" +
      error.message
    );
  }
}


/*************************************************
 * フラッシュ
 *************************************************/

async function toggleTorch() {

  if (!stream) {
    return;
  }


  const track =
    stream.getVideoTracks()[0];


  if (!track) {
    return;
  }


  const capabilities =
    track.getCapabilities();


  if (!capabilities.torch) {

    alert(
      "この端末ではライトを操作できません"
    );

    return;
  }


  const settings =
    track.getSettings();


  await track.applyConstraints({

    advanced: [

      {
        torch:
          !settings.torch
      }

    ]
  });
}


/*************************************************
 * ズーム
 *************************************************/

async function setZoom(
  zoom
) {

  if (!stream) {
    return;
  }


  const track =
    stream.getVideoTracks()[0];


  const capabilities =
    track.getCapabilities();


  if (
    capabilities.zoom !== undefined
  ) {

    const min =
      capabilities.zoom.min || 1;

    const max =
      capabilities.zoom.max || 1;

    const value =
      Math.max(
        min,
        Math.min(
          max,
          zoom
        )
      );


    try {

      await track.applyConstraints({

        advanced: [
          {
            zoom: value
          }
        ]

      });

      currentZoom =
        value;

      return;

    } catch(error) {

      console.warn(error);
    }
  }


  /*
   * ズーム非対応の場合はCSS
   */
  video.style.transform =
    "scale(" +
    zoom +
    ")";

  currentZoom =
    zoom;
}

/*************************************************
 * 写真撮影
 *************************************************/

async function takePhoto() {

  if (!cameraEnabled) {

    alert(
      "現在カメラが無効です"
    );

    return;
  }


  if (!video.videoWidth) {

    alert(
      "カメラの準備ができていません"
    );

    return;
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
   * 前面カメラの場合は左右反転
   */
  if (
    facingMode === "user"
  ) {

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(
      -1,
      1
    );
  }


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const blob =
    await new Promise(
      resolve =>
        canvas.toBlob(
          resolve,
          "image/jpeg",
          .92
        )
    );


  if (!blob) {

    alert(
      "写真の作成に失敗しました"
    );

    return;
  }


  const fileName =
    "PHOTO_" +
    makeDateName() +
    ".jpg";


  await uploadFile(
    blob,
    fileName
  );
}


/*************************************************
 * MP4対応チェック
 *************************************************/

function getVideoMimeType() {

  /*
   * MP4を最優先
   */
  const mp4Types = [

    "video/mp4;codecs=h264,aac",

    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

    "video/mp4"
  ];


  for (
    const type of mp4Types
  ) {

    if (
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;
    }
  }


  /*
   * MP4非対応ブラウザ
   *
   * WebMにフォールバック
   */
  const webmTypes = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"
  ];


  for (
    const type of webmTypes
  ) {

    if (
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;
    }
  }


  return "";
}


/*************************************************
 * 動画撮影
 *************************************************/

function startRecording() {

  if (!cameraEnabled) {

    alert(
      "現在カメラが無効です"
    );

    return;
  }


  const mimeType =
    getVideoMimeType();


  if (!mimeType) {

    alert(
      "このブラウザでは動画撮影に対応していません"
    );

    return;
  }


  recordedChunks = [];


  try {

    mediaRecorder =
      new MediaRecorder(
        stream,
        {
          mimeType:
            mimeType,

          videoBitsPerSecond:
            1200000,

          audioBitsPerSecond:
            96000
        }
      );

  } catch(error) {

    alert(
      "動画撮影を開始できません\n\n" +
      error.message
    );

    return;
  }


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );
      }
    };


  mediaRecorder.onstop =
    async () => {

      stopRecordingUI();


      const actualMime =
        mediaRecorder.mimeType ||
        mimeType;


      const extension =
        actualMime.includes(
          "mp4"
        )
          ? "mp4"
          : "webm";


      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              actualMime
          }
        );


      if (
        blob.size >
        MAX_FILE_SIZE
      ) {

        alert(
          "動画が20MBを超えています。\n" +
          "撮影時間を短くしてください。"
        );

        return;
      }


      if (
        blob.size <= 0
      ) {

        alert(
          "動画データがありません"
        );

        return;
      }


      const fileName =
        "VIDEO_" +
        makeDateName() +
        "." +
        extension;


      /*
       * MP4対応ブラウザなら.mp4
       */
      await uploadFile(
        blob,
        fileName
      );
    };


  mediaRecorder.start(
    1000
  );


  recordingStartTime =
    Date.now();


  recording.classList.add(
    "show"
  );


  captureButton.classList.add(
    "recording"
  );


  updateRecordTime();


  recordingTimer =
    setInterval(
      updateRecordTime,
      250
    );


  /*
   * 最大60秒
   */
  setTimeout(
    () => {

      if (
        mediaRecorder &&
        mediaRecorder.state ===
          "recording"
      ) {

        stopRecording();
      }

    },
    MAX_RECORDING_TIME * 1000
  );
}


/*************************************************
 * 録画停止
 *************************************************/

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state ===
      "recording"
  ) {

    mediaRecorder.stop();
  }
}


/*************************************************
 * 録画UI停止
 *************************************************/

function stopRecordingUI() {

  recording.classList.remove(
    "show"
  );

  captureButton.classList.remove(
    "recording"
  );


  clearInterval(
    recordingTimer
  );


  recordingTimer =
    null;
}


/*************************************************
 * 録画時間
 *************************************************/

function updateRecordTime() {

  const seconds =
    Math.floor(
      (
        Date.now() -
        recordingStartTime
      ) / 1000
    );


  const mm =
    String(
      Math.floor(
        seconds / 60
      )
    ).padStart(
      2,
      "0"
    );


  const ss =
    String(
      seconds % 60
    ).padStart(
      2,
      "0"
    );


  recordTime.textContent =
    mm + ":" + ss;
}


/*************************************************
 * ファイルアップロード
 *************************************************/

async function uploadFile(
  blob,
  fileName
) {

  try {

    if (!cameraEnabled) {

      throw new Error(
        "現在カメラが無効です"
      );
    }


    if (
      blob.size >
      MAX_FILE_SIZE
    ) {

      throw new Error(
        "20MBを超えています"
      );
    }


    showLoading(
      "アップロード準備中...",
      0
    );


    /*
     * アップロード開始
     */
    const start =
      await gasGet(
        "start",
        {

          fileName:
            fileName,

          mimeType:
            blob.type,

          totalSize:
            blob.size,

          deviceId:
            deviceId
        }
      );


    if (!start.success) {

      throw new Error(
        start.error ||
        "アップロードを開始できません"
      );
    }


    const uploadId =
      start.uploadId;


    const totalChunks =
      Math.ceil(
        blob.size /
        CHUNK_SIZE
      );


    /*
     * チャンク送信
     */
    for (
      let i = 0;
      i < totalChunks;
      i++
    ) {

      const startByte =
        i *
        CHUNK_SIZE;


      const endByte =
        Math.min(
          blob.size,
          startByte +
          CHUNK_SIZE
        );


      const chunk =
        blob.slice(
          startByte,
          endByte
        );


      const base64 =
        await blobToBase64(
          chunk
        );


      showLoading(
        "アップロード中 " +
        (i + 1) +
        " / " +
        totalChunks,

        Math.round(
          (
            i /
            totalChunks
          ) * 100
        )
      );


      await gasPost(
        "chunk",
        {

          uploadId:
            uploadId,

          chunkIndex:
            i,

          totalChunks:
            totalChunks,

          data:
            base64
        }
      );


      /*
       * GAS負荷軽減
       */
      await sleep(150);
    }


    showLoading(
      "保存完了",
      100
    );


    await sleep(500);


    hideLoading();


    alert(
      "Google Driveへの保存が完了しました"
    );


    /*
     * ギャラリー更新
     */
    await loadGallery();

  } catch(error) {

    console.error(error);

    hideLoading();


    alert(
      "アップロードに失敗しました\n\n" +
      error.message
    );
  }
}


/*************************************************
 * Blob → Base64
 *************************************************/

function blobToBase64(
  blob
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            reader.result;


          const base64 =
            result.split(
              ","
            )[1];


          resolve(
            base64
          );
        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


/*************************************************
 * 日時ファイル名
 *************************************************/

function makeDateName() {

  const d =
    new Date();


  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );


  const h =
    String(
      d.getHours()
    ).padStart(
      2,
      "0"
    );


  const min =
    String(
      d.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const s =
    String(
      d.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    m +
    day +
    "_" +
    h +
    min +
    s
  );
}


/*************************************************
 * ギャラリー取得
 *************************************************/

async function loadGallery() {

  try {

    const result =
      await gasGet(
        "list",
        {
          deviceId:
            deviceId
        }
      );


    if (!result.success) {

      throw new Error(
        result.error
      );
    }


    mediaList =
      result.files || [];


    renderGallery();

  } catch(error) {

    console.error(error);

    mediaGrid.innerHTML =
      `
        <div
          style="
            grid-column:1/-1;
            text-align:center;
            padding:50px 20px;
            color:#aaa;
          "
        >
          写真・動画を取得できませんでした
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;
  }
}


/*************************************************
 * ギャラリー表示
 *************************************************/

function renderGallery() {

  let list =
    mediaList;


  if (
    currentTab === "mine"
  ) {

    list =
      mediaList.filter(
        item => item.mine
      );
  }


  if (
    currentTab === "shared"
  ) {

    list =
      mediaList.filter(
        item => !item.mine
      );
  }


  mediaGrid.innerHTML =
    "";


  if (
    list.length === 0
  ) {

    mediaGrid.innerHTML =
      `
        <div
          style="
            grid-column:1/-1;
            text-align:center;
            padding:60px 20px;
            color:#777;
          "
        >
          写真・動画がありません
        </div>
      `;

    return;
  }


  list.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "media";


      if (
        item.mimeType
          .startsWith(
            "image/"
          )
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.loading =
          "lazy";


        img.src =
          item.thumbnailUrl;


        img.onerror =
          () => {

            img.src =
              item.downloadUrl;
          };


        div.appendChild(
          img
        );

      } else {

        div.innerHTML =
          `
            <div
              class="videoThumb"
            >
              🎥
              <span
                class="videoLabel"
              >
                動画
              </span>
            </div>
          `;
      }


      if (item.mine) {

        const badge =
          document.createElement(
            "div"
          );


        badge.className =
          "mineBadge";


        badge.textContent =
          "自分";


        div.appendChild(
          badge
        );
      }


      div.addEventListener(
        "click",
        () =>
          openPreview(item)
      );


      mediaGrid.appendChild(
        div
      );
    }
  );
}


/*************************************************
 * プレビュー
 *************************************************/

function openPreview(
  item
) {

  currentMedia =
    item;


  previewContent.innerHTML =
    "";


  previewName.textContent =
    item.name;


  if (
    item.mimeType
      .startsWith(
        "image/"
      )
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.src =
      item.downloadUrl;


    img.alt =
      item.name;


    previewContent.appendChild(
      img
    );

  } else {

    const videoElement =
      document.createElement(
        "video"
      );


    videoElement.controls =
      true;

    videoElement.playsInline =
      true;

    videoElement.preload =
      "metadata";

    videoElement.src =
      item.downloadUrl;


    previewContent.appendChild(
      videoElement
    );
  }


  deleteButton.style.display =
    item.mine
      ? "inline-block"
      : "none";


  preview.classList.add(
    "show"
  );
}

 *************************************************/

    currentMedia.viewUrl,

/*************************************************
 * 保存
 *************************************************/

function downloadCurrent() {

  if (!currentMedia) {
    return;
  }


  const a =
    document.createElement(
      "a"
    );


  a.href =
    currentMedia.downloadUrl;


  a.target =
    "_blank";


  a.rel =
    "noopener";


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();
}


/*************************************************
 * 削除
 *************************************************/

async function deleteCurrent() {

  if (!currentMedia) {
    return;
  }


  if (!currentMedia.mine) {

    alert(
      "自分が撮影したファイルだけ削除できます"
    );

    return;
  }


  if (
    !confirm(
      "この写真・動画を削除しますか？"
    )
  ) {

    return;
  }


  try {

    showLoading(
      "削除中..."
    );


    const result =
      await gasPost(
        "delete",
        {

          fileId:
            currentMedia.id,

          deviceId:
            deviceId
        }
      );


    hideLoading();


    if (!result.success) {

      throw new Error(
        result.error ||
        "削除できませんでした"

    closePreview();


    await loadGallery();


  } catch(error) {

    hideLoading();


    alert(
      "削除に失敗しました\n\n" +
      error.message
    );
  }
}


/*************************************************
 * HTMLエスケープ
 *************************************************/

function escapeHtml(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/*************************************************
 * Sleep
 *************************************************/

function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}
