<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<title>共有カメラ</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {

  box-sizing:
    border-box;

  -webkit-tap-highlight-color:
    transparent;

}

html,
body {

  width:
    100%;

  height:
    100%;

  margin:
    0;

  padding:
    0;

  overflow:
    hidden;

  background:
    #000;

  color:
    #fff;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Helvetica Neue",

    Arial,

    sans-serif;

}


/* =========================================================
   ボタン
========================================================= */

button {

  border:
    0;

  outline:
    0;

  background:
    none;

  color:
    inherit;

  font:
    inherit;

  cursor:
    pointer;

}

button:active {

  transform:
    scale(.94);

}


/* =========================================================
   アプリ
========================================================= */

.camera-app {

  position:
    fixed;

  inset:
    0;

  width:
    100vw;

  height:
    100vh;

  height:
    100dvh;

  background:
    #000;

  overflow:
    hidden;

}


/* =========================================================
   カメラ
========================================================= */

#camera {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;

  background:
    #000;

  z-index:
    1;

  transition:
    transform .2s;

}


/* =========================================================
   上部グラデーション
========================================================= */

.top-gradient {

  position:
    absolute;

  left:
    0;

  right:
    0;

  top:
    0;

  height:

    );

  z-index:
    5;

  pointer-events:
    none;

}


/* =========================================================
   下部グラデーション
========================================================= */

.bottom-gradient {

  position:
    absolute;

  left:
    0;

  right:
    0;

  bottom:
    0;

  height:
    300px;

  background:

    linear-gradient(

      to top,

      rgba(0,0,0,.9),

      rgba(0,0,0,.45),

      transparent

    );

  z-index:
    5;

  pointer-events:
    none;

}


/* =========================================================
   上部コントロール
========================================================= */

.top-controls {

  position:
    absolute;

  top:

  left:
    0;

  right:
    0;

  align-items:

}


.top-left,
.top-right {

    center;

  gap:
    15px;

}


.icon-button {

  width:
    44px;

  height:
    44px;

  border-radius:
    50%;

  display:
    flex;

  justify-content:
    center;

  align-items:
    center;

    rgba(0,0,0,.4);

  -webkit-backdrop-filter:
    blur(12px);

  font-size:
    21px;

}


/* =========================================================
   ステータス
========================================================= */

.status {

  position:
    absolute;

  top:
    76px;

  left:
    50%;

  transform:
    translateX(-50%);

  z-index:
    30;

  max-width:

  padding:

    rgba(0,0,0,.55);

    nowrap;

    0;

  transition:
    opacity .25s;

}


.status.show {

  opacity:
    1;

}


/* =========================================================
   録画
========================================================= */

.recording {

  position:
    absolute;

  top:
    125px;

  left:
    50%;

  transform:
    translateX(-50%);

  z-index:
    35;

    none;

  align-items:

    8px;

  border-radius:
    20px;

    rgba(0,0,0,.6);

    blur(10px);

  -webkit-backdrop-filter:

    14px;

}


.recording.active {

    flex;

}


.record-dot {

  width:
    9px;

  height:
    9px;

    50%;

    #ff3b30;

}


@keyframes blink {

  }

}


/* =========================================================
   フォーカス
========================================================= */

.focus-box {

  position:
    absolute;

  width:
    70px;

  height:
    70px;

  border:
    1px solid
    rgba(255,255,255,.9);

  z-index:
    15;

  transform:
    translate(-50%,-50%);

  opacity:
    0;

  pointer-events:
    none;

}


.focus-box.active {

  opacity:
    1;

}


/* =========================================================
   下部
========================================================= */

.bottom-ui {

  position:
    absolute;

  left:
    0;

  right:
    0;

  bottom:
    0;

  z-index:
    20;

  padding:

    0

    20px

    max(
      25px,
      env(safe-area-inset-bottom)
    )

    20px;

}


/* =========================================================
   ズーム
========================================================= */

.zoom-controls {

  display:
    flex;

  justify-content:
    center;

  gap:
    10px;

  margin-bottom:
    18px;

}


.zoom {

  height:

    20px;

    blur(10px);

.zoom.active {

/* =========================================================

========================================================= */

.mode-selector {

/* =========================================================

.capture-controls {

.capture-button {

/* =========================================================

    #050505;

}


.gallery-panel.show {

  display:
    flex;

}


.gallery-header {

    max(
      15px,

    )

    18px;

    flex;

    center;

/* =========================================================

.preview {

</style>

<script>


// ============================================================
// ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
// ★
// ★  ここにGASのウェブアプリURLを入れる
// ★
// ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyY9quq69NuT5ZdAe9Y_LFC2tPD7nv3oy5JYySUlGJZHrDN87mXKRgCP4XDUFmUnURGZg/exec";


// 例:
//
// const GAS_URL =
// "https://script.google.com/macros/s/AKfycbxxxxxxxxxxxx/exec";


// ============================================================
// 設定
// ============================================================

const MAX_FILE_SIZE =
  20 * 1024 * 1024;

const MAX_RECORDING_TIME =
  60;

const CHUNK_SIZE =
  256 * 1024;


// ============================================================
// DOM
// ============================================================

const camera =
  document.getElementById(
    "camera"
  );

const captureButton =
  document.getElementById(
    "captureButton"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const recording =
  document.getElementById(
    "recording"
  );

const recordTime =
  document.getElementById(
    "recordTime"
  );

const uploadPanel =
  document.getElementById(
    "uploadPanel"
  );

const uploadTitle =
  document.getElementById(
    "uploadTitle"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const galleryPanel =
  document.getElementById(
    "galleryPanel"
  );

const gallery =
  document.getElementById(
    "gallery"
  );

const preview =
  document.getElementById(
    "preview"
  );

const previewMedia =
  document.getElementById(
    "previewMedia"
  );


// ============================================================
// 状態
// ============================================================

let stream =
  null;

let facingMode =
  "environment";

let torchOn =
  false;

let currentMode =
  "photo";

let mediaRecorder =
  null;

let recordedChunks =
  [];

let recordingTimer =
  null;

let recordingSeconds =
  0;

let currentTab =
  "all";

let selectedMedia =
  null;

let currentZoom =
  1;


// ============================================================
// デバイスID
// ============================================================

let deviceId =
  localStorage.getItem(
    "shared_camera_device_id"
  );


if (!deviceId) {

  deviceId =
    crypto.randomUUID();

  localStorage.setItem(

    "shared_camera_device_id",

    deviceId

  );
}


// ============================================================
// ステータス
// ============================================================

let statusTimer =
  null;


function showStatus(
  message
) {

  statusElement.textContent =
    message;

  statusElement.classList.add(
    "show"
  );


  clearTimeout(
    statusTimer
  );


  statusTimer =
    setTimeout(
      () => {

        statusElement.classList.remove(
          "show"
        );

      },
      2500
    );
}


// ============================================================
// GAS GET
// JSONP
// ============================================================

function gasGet(

  action,

  params = {}

) {

  return new Promise(

    (resolve, reject) => {

      const callbackName =

        "gas_" +

        Date.now() +

        "_" +

        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams({

          action,

          callback:
            callbackName,

          ...params

        });


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "GASが応答しません"
              )
            );

          },
          30000
        );


      window[callbackName] =
        data => {

          clearTimeout(
            timer
          );

          cleanup();

          resolve(
            data
          );

        };


      script.src =

        GAS_URL +

        "?" +

        query.toString();


      script.onerror =
        () => {

          clearTimeout(
            timer
          );

          cleanup();

          reject(
            new Error(
              "GASへ接続できません"
            )
          );

        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        delete window[
          callbackName
        ];

        script.remove();

      }

    }

  );
}


// ============================================================
// GAS POST
// iframe方式
// ============================================================

function gasPost(

  action,

  data

) {

  return new Promise(

    (resolve, reject) => {

      const iframeName =

        "gasFrame_" +

        Date.now() +

        "_" +

        Math.random()
          .toString(36)
          .substring(2);


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.name =
        iframeName;

      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        GAS_URL;

      form.target =
        iframeName;

      form.style.display =
        "none";


      const values = {

        action,

        ...data

      };


      Object.keys(values)
        .forEach(
          key => {

            const input =
              document.createElement(
                "input"
              );

            input.type =
              "hidden";

            input.name =
              key;

            input.value =
              values[key];

            form.appendChild(
              input
            );

          }
        );


      document.body.appendChild(
        form
      );


      let finished =
        false;


      const timer =
        setTimeout(
          () => {

            if (
              finished
            )
              return;


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "GAS送信がタイムアウトしました"
              )
            );

          },
          60000
        );


      iframe.onload =
        () => {

          if (
            finished
          )
            return;


          finished =
            true;


          clearTimeout(
            timer
          );


          cleanup();


          resolve({
            success:
              true
          });

        };


      try {

        form.submit();

      } catch (error) {

        clearTimeout(
          timer
        );

        cleanup();

        reject(
          error
        );

      }


      function cleanup() {

        form.remove();

        setTimeout(
          () => {

            iframe.remove();

          },
          500
        );

      }

    }

  );
}


// ============================================================
// アップロード開始
// ============================================================

function startUpload(
  blob,
  fileName
) {

  return new Promise(

    (resolve, reject) => {

      const callbackName =

        "uploadStart_" +

        Date.now() +

        "_" +

        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const params =
        new URLSearchParams({

          action:
            "start",

          callback:
            callbackName,

          fileName,

          mimeType:
            blob.type ||
            "application/octet-stream",

          totalSize:
            blob.size,

          deviceId

        });


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "アップロード開始がタイムアウトしました"
              )
            );

          },
          30000
        );


      window[callbackName] =
        data => {

          clearTimeout(
            timer
          );

          cleanup();


          if (
            data &&
            data.success
          ) {

            resolve(
              data
            );

          } else {

            reject(
              new Error(
                data?.error ||
                "アップロード開始に失敗しました"
              )
            );

          }

        };


      script.src =

        GAS_URL +

        "?" +

        params.toString();


      script.onerror =
        () => {

          clearTimeout(
            timer
          );

          cleanup();

          reject(
            new Error(
              "GASへ接続できません"
            )
          );

        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        delete window[
          callbackName
        ];

        script.remove();

      }

    }

  );
}


// ============================================================
// カメラ開始
// ============================================================

async function startCamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode,

            width: {
              ideal:
                1920
            },

            height: {
              ideal:
                1080
            }

          },

          audio:
            true

        });


    camera.srcObject =
      stream;


    await camera.play();


    torchOn =
      false;


    applyZoom();


    showStatus(
      facingMode ===
        "environment"

        ? "背面カメラ"

        : "前面カメラ"

    );

  } catch (error) {

    console.error(
      error
    );

    showStatus(
      "カメラを使用できません"
    );

  }

}


// ============================================================
// 前後切替
// ============================================================

async function switchCamera() {

  facingMode =

    facingMode ===
      "environment"

      ? "user"

      : "environment";


  await startCamera();

}


// ============================================================
// ライト
// ============================================================

async function toggleTorch() {

  if (!stream) {

    showStatus(
      "先にカメラを開始してください"
    );

    return;
  }


  const track =
    stream.getVideoTracks()[0];


  const capabilities =
    track.getCapabilities();


  if (
    !capabilities.torch
  ) {

    showStatus(
      "この端末はライトに対応していません"
    );

    return;
  }


  torchOn =
    !torchOn;


  try {

    await track.applyConstraints({

      advanced: [

        {
          torch:
            torchOn
        }

      ]

    });


    showStatus(
      torchOn
        ? "ライト ON"
        : "ライト OFF"
    );

  } catch (error) {

    console.error(
      error
    );

  }

}


// ============================================================
// ズーム
// ============================================================

async function setZoom(
  zoom
) {

  currentZoom =
    zoom;


  document
    .querySelectorAll(
      ".zoom"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "active",

          Number(
            button.dataset.zoom
          ) === zoom

        );

      }
    );


  applyZoom();

}


async function applyZoom() {

  if (!stream)
    return;


  const track =
    stream.getVideoTracks()[0];


  const capabilities =
    track.getCapabilities();


  if (
    capabilities.zoom
  ) {

    const zoom =
      Math.max(

        capabilities.zoom.min,

        Math.min(

          capabilities.zoom.max,

          currentZoom

        )

      );


    try {

      await track.applyConstraints({

        advanced: [

          {
            zoom
          }

        ]

      });

    } catch (error) {

      console.log(
        error
      );

    }

  } else {

    camera.style.transform =
      `scale(${currentZoom})`;

  }

}

// モード

function setMode(

// ============================================================
// 写真撮影
// ============================================================

async function takePhoto() {

  if (!stream) {

    await startCamera();

    if (!stream)
      return;

  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(

    camera,

    0,

    0,

    canvas.width,

    canvas.height

  );


  canvas.toBlob(

    async blob => {

      if (!blob)
        return;


      const fileName =

        "photo_" +

        formatDate() +

        ".jpg";


      await uploadFile(

        blob,

        fileName

      );

    },

    "image/jpeg",

    .92

  );

}


// ============================================================
// 動画録画
// ============================================================

function startRecording() {

  if (!stream) {

    showStatus(
      "先にカメラを開始してください"
    );

    return;
  }


  recordedChunks =
    [];


  let mimeType =
    "";


  const types = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm",

    "video/mp4"

  ];


  for (
    const type of types
  ) {

    if (
      MediaRecorder
        .isTypeSupported(
          type
        )
    ) {

      mimeType =
        type;

      break;

    }

  }


  try {

    mediaRecorder =
      new MediaRecorder(

        stream,

        mimeType

          ? {
              mimeType
            }

          : undefined

      );

  } catch (error) {

    showStatus(
      "動画録画に対応していません"
    );

    return;

  }


  mediaRecorder.ondataavailable =
    event => {

      if (

        event.data &&

        event.data.size > 0

      ) {

        recordedChunks.push(
          event.data
        );

      }

    };


  mediaRecorder.onstop =
    async () => {

      stopRecordingUI();


      const blob =
        new Blob(

          recordedChunks,

          {

            type:

              mimeType ||

              "video/webm"

          }

        );


      if (
        blob.size >
        MAX_FILE_SIZE
      ) {

        showStatus(
          "20MBを超えたため保存できません"
        );

        return;

      }


      const extension =

        blob.type.includes(
          "mp4"
        )

          ? "mp4"

          : "webm";


      const fileName =

        "video_" +

        formatDate() +

        "." +

        extension;


      await uploadFile(

        blob,

        fileName

      );

    };


  mediaRecorder.start(
    250
  );


  recordingSeconds =
    0;


  recording.classList.add(
    "active"
  );


  updateRecordTime();


  recordingTimer =
    setInterval(

      () => {

        recordingSeconds++;

        updateRecordTime();


        if (
          recordingSeconds >=
          MAX_RECORDING_TIME
        ) {

          stopRecording();

        }

      },

      1000

    );


  showStatus(
    "録画中"
  );

}


// ============================================================
// 録画停止
// ============================================================

function stopRecording() {

  if (

    mediaRecorder &&

    mediaRecorder.state ===
      "recording"

  ) {

    mediaRecorder.stop();

  }

}


function stopRecordingUI() {

  recording.classList.remove(
    "active"
  );


  clearInterval(
    recordingTimer
  );


  recordingTimer =
    null;


  recordTime.textContent =
    "00:00";

}


function updateRecordTime() {

  const minutes =
    Math.floor(

      recordingSeconds /
      60

    )
      .toString()
      .padStart(
        2,
        "0"
      );


  const seconds =

    (
      recordingSeconds %
      60
    )

      .toString()
      .padStart(
        2,
        "0"
      );


  recordTime.textContent =

    minutes +

    ":" +

    seconds;

}


// ============================================================
// Blob → Base64
// ============================================================

function blobToBase64(
  blob
) {

  return new Promise(

    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            reader.result;


          resolve(

            result
              .split(",")[1]

          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }

  );
}


// ============================================================
// アップロード
// ============================================================

async function uploadFile(

  blob,

  fileName

) {

  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    showStatus(
      "20MBを超えています"
    );

    return;
  }


  uploadPanel.classList.add(
    "show"
  );


  progressBar.style.width =
    "0%";


  try {

    // --------------------------------------------------------
    // セッション開始
    // --------------------------------------------------------

    const start =
      await startUpload(

        blob,

        fileName

      );


    if (
      !start.uploadId
    ) {

      throw new Error(
        "アップロードIDを取得できませんでした"
      );

    }


    const uploadId =
      start.uploadId;


    const totalChunks =
      Math.ceil(

        blob.size /
        CHUNK_SIZE

      );


    // --------------------------------------------------------
    // チャンク送信
    // --------------------------------------------------------

    for (

      let i = 0;

      i < totalChunks;

      i++

    ) {

      const startByte =

        i *
        CHUNK_SIZE;


      const endByte =

        Math.min(

          startByte +
          CHUNK_SIZE,

          blob.size

        );


      const chunk =
        blob.slice(

          startByte,

          endByte

        );


      const base64 =
        await blobToBase64(
          chunk
        );


      uploadTitle.textContent =

        "Google Driveへ保存中 " +

        (i + 1) +

        " / " +

        totalChunks;


      progressBar.style.width =

        (

          ((i + 1) /
            totalChunks) *

          100

        ) +

        "%";


      await gasPost(

        "chunk",

        {

          uploadId,

          chunkIndex:
            i,

          totalChunks,

          data:
            base64

        }

      );


      // GASへの連続アクセスを少し間隔を空ける
      await sleep(
        150
      );

    }


    progressBar.style.width =
      "100%";


    uploadTitle.textContent =
      "保存完了";


    showStatus(
      "Google Driveに保存しました"
    );


    await sleep(
      700
    );


    await loadGallery();


  } catch (error) {

    console.error(
      error
    );


    showStatus(
      "アップロードに失敗しました"
    );


    console.error(
      error.message
    );

  } finally {

    setTimeout(
      () => {

        uploadPanel.classList.remove(
          "show"
        );

      },
      1000
    );

  }

}


// ============================================================
// ギャラリー
// ============================================================

async function loadGallery() {

  gallery.innerHTML =
    '<div class="empty">読み込み中...</div>';


  try {

    const result =
      await gasGet(

        "list",

        {

          deviceId

        }

      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error
      );

    }


    let files =
      result.files || [];


    if (
      currentTab ===
      "mine"
    ) {

      files =
        files.filter(
          file =>
            file.mine
        );

    }


    if (
      currentTab ===
      "shared"
    ) {

      files =
        files.filter(
          file =>
            !file.mine
        );

    }


    gallery.innerHTML =
      "";


    if (
      files.length === 0
    ) {

      gallery.innerHTML =
        '<div class="empty">写真や動画がありません</div>';

      return;

    }


    files.forEach(
      file => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "media";


        if (
          file.mimeType
            .startsWith(
              "image/"
            )
        ) {

          const img =
            document.createElement(
              "img"
            );


          img.src =

            "https://drive.google.com/thumbnail?id=" +

            encodeURIComponent(
              file.id
            ) +

            "&sz=w800";


          img.loading =
            "lazy";


          item.appendChild(
            img
          );

        } else {

          const video =
            document.createElement(
              "div"
            );


          video.className =
            "video-thumb";


          video.textContent =
            "🎥";


          item.appendChild(
            video
          );

        }


        const label =
          document.createElement(
            "div"
          );


        label.className =
          "media-label";


        label.textContent =

          file.mine

            ? "自分"

            : "共有";


        item.appendChild(
          label
        );


        item.onclick =
          () =>
            openMedia(
              file
            );


        gallery.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    gallery.innerHTML =

      '<div class="empty">ギャラリーを読み込めませんでした</div>';

  }

}


// ============================================================
// メディア表示
// ============================================================

function openMedia(
  file
) {

  selectedMedia =
    file;


  preview.classList.add(
    "show"
  );


  previewMedia.innerHTML =
    "";


  if (
    file.mimeType
      .startsWith(
        "image/"
      )
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "preview-media";


    img.src =

      "https://drive.google.com/thumbnail?id=" +

      encodeURIComponent(
        file.id
      ) +

      "&sz=w2000";


    previewMedia.appendChild(
      img
    );

  } else {

    const video =
      document.createElement(
        "video"
      );


    video.className =
      "preview-media";


    video.controls =
      true;


    video.playsInline =
      true;


    video.src =

      "https://drive.google.com/uc?export=download&id=" +

      encodeURIComponent(
        file.id
      );


    previewMedia.appendChild(
      video
    );

  }

}


// ============================================================
// プレビュー閉じる
// ============================================================

function closePreview() {

  preview.classList.remove(
    "show"
  );


  previewMedia.innerHTML =
    "";


  selectedMedia =
    null;

}


// ============================================================
// Drive
// ============================================================

function openDrive() {

  if (!selectedMedia)
    return;


  window.open(

    selectedMedia.url,

    "_blank"

  );

}


// ============================================================
// ダウンロード
// ============================================================

function downloadMedia() {

  if (!selectedMedia)
    return;


  const url =

    "https://drive.google.com/uc?export=download&id=" +

    encodeURIComponent(
      selectedMedia.id
    );


  window.open(
    url,
    "_blank"
  );

}


// ============================================================
// 削除
// ============================================================

async function deleteMedia() {

  if (!selectedMedia)
    return;


  if (
    !selectedMedia.mine
  ) {

    showStatus(
      "共有ファイルは削除できません"
    );

    return;

  }


  if (
    !confirm(
      "この写真・動画を削除しますか？"
    )
  ) {

    return;

  }


  try {

    await gasPost(

      "delete",

      {

        fileId:
          selectedMedia.id,

        deviceId

      }

    );


    closePreview();


    await loadGallery();


    showStatus(
      "削除しました"
    );


  } catch (error) {

    console.error(
      error
    );


    showStatus(
      "削除に失敗しました"
    );

  }

}


// ============================================================
// 日時
// ============================================================

function formatDate() {

  const d =
    new Date();


  return (

    d.getFullYear() +

    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +

    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    ) +

    "_" +

    String(
      d.getHours()
    ).padStart(
      2,
      "0"
    ) +

    String(
      d.getMinutes()
    ).padStart(
      2,
      "0"
    ) +

    String(
      d.getSeconds()
    ).padStart(
      2,
      "0"
    )

  );

}


// ============================================================
// 待機
// ============================================================

function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

// イベント

document
  .getElementById(

  )

  .getElementById(

  )
  .onclick =

  .getElementById(

  )
  .onclick =
    switchCamera;


document
  .getElementById(
    "photoMode"
  )
  .onclick =
    () =>
      setMode(
        "photo"
      );


document
  .getElementById(
    "videoMode"
  )
  .onclick =
    () =>
      setMode(
        "video"
      );

  .getElementById(
    "captureButton"
  )
  .onclick =
    () => {

        if (

          mediaRecorder &&

          mediaRecorder.state ===
            "recording"

          stopRecording();

        } else {

        }

      }

    };

  .getElementById(
    "galleryButton"
  )
  .onclick =
    () =>
      galleryPanel.classList.add(

      );


document
  .getElementById(
    "closeGallery"
  )
  .onclick =

      );

  .getElementById(
    "closePreview"
  )
  .onclick =
    closePreview;


document
  .getElementById(
    "openDrive"
  )
  .onclick =

document
  .getElementById(
    "downloadButton"
  )
  .onclick =
    downloadMedia;


document
  .getElementById(
    "deleteButton"
  )
  .onclick =
    deleteMedia;


// ============================================================
// ギャラリータブ
// ============================================================

document
  .querySelectorAll(
    ".gallery-tab"
  )
  .forEach(
    button => {

      button.onclick =
        async () => {

          document
            .querySelectorAll(
              ".gallery-tab"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(

          currentTab =
            button.dataset.tab;

  );


// ============================================================
// ズーム
// ============================================================

document
  .querySelectorAll(
    ".zoom"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          setZoom(
            Number(
              button.dataset.zoom
            )
          );

        };

    }
  );


// ============================================================
// プレビュー外側クリック
// ============================================================

preview.onclick =
  event => {

    if (
      event.target ===
      preview
    ) {

      closePreview();

    }

  };


// ============================================================
// 初期化
// ============================================================

setMode(
  "photo"
);


// ギャラリーを先に取得
loadGallery();


// カメラはブラウザによって
// 自動起動が拒否されるため
// ユーザーがボタンを押しても開始可能
startCamera()
  .catch(
    () => {}
  );


</script>
