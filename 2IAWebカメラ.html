<style>

/* =========================================

========================================= */

  align-items: center;

/* =========================================

========================================= */

<script>

/*************************************************
 * GAS URL
 *
 * ★ここだけ変更
 *************************************************/

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwq378JfxWIFqDdaxH19n2ybX43FuBGGu39kO90hjKJiKsWGgusR2lvNYSMRcCBcXunLg/exec";


/*************************************************
 * 設定
 *************************************************/

const MAX_FILE_SIZE =
  20 * 1024 * 1024;

const CHUNK_SIZE =
  256 * 1024;

const MAX_RECORDING_TIME =
  60;


/*************************************************
 * 状態
 *************************************************/

let cameraStream =
  null;

let currentMode =
  "photo";

let facingMode =
  "environment";

let currentZoom =
  1;

let torchEnabled =
  false;

let mediaRecorder =
  null;

let recordedChunks =
  [];

let recordingTimer =
  null;

let recordingSeconds =
  0;

let settings =
  null;

let mediaList =
  [];

let currentFilter =
  "all";

let currentPreview =
  null;

let currentMimeType =
  "";


/*************************************************
 * Device ID
 *************************************************/

function getDeviceId() {

  let id =
    localStorage.getItem(
      "sharedCameraDeviceId"
    );


  if (!id) {

    id =
      crypto.randomUUID
        ? crypto.randomUUID()
        : "device-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2);


    localStorage.setItem(
      "sharedCameraDeviceId",
      id
    );
  }


  return id;
}


/*************************************************
 * DOM
 *************************************************/

const camera =
  document.getElementById(
    "camera"
  );

const cameraPage =
  document.getElementById(
    "cameraPage"
  );

const lockScreen =
  document.getElementById(
    "lockScreen"
  );

const shutterButton =
  document.getElementById(
    "shutterButton"
  );

const recordTime =
  document.getElementById(
    "recordTime"
  );

const loading =
  document.getElementById(
    "loading"
  );

const loadingText =
  document.getElementById(
    "loadingText"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );

const galleryPage =
  document.getElementById(
    "galleryPage"
  );

const galleryGrid =
  document.getElementById(
    "galleryGrid"
  );

const previewPage =
  document.getElementById(
    "previewPage"
  );

const previewContent =
  document.getElementById(
    "previewContent"
  );


/*************************************************
 * Loading
 *************************************************/

function showLoading(
  text
) {

  loadingText.textContent =
    text ||
    "処理中...";

  loading.style.display =
    "flex";
}


function hideLoading() {

  loading.style.display =
    "none";
}


/*************************************************
 * Error
 *************************************************/

function showError(
  message
) {

  errorMessage.textContent =
    message;

  errorMessage.style.display =
    "block";


  setTimeout(
    () => {

      errorMessage.style.display =
        "none";

    },
    5000
  );
}


/*************************************************
 * JSONP
 *************************************************/

function jsonp(
  params
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      script.src =
        GAS_URL +
        "?" +
        query.toString();


      let finished =
        false;


      window[
        callbackName
      ] =
        data => {

          if (
            finished
          ) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          resolve(
            data
          );
        };


      script.onerror =
        () => {

          if (
            finished
          ) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              "GASとの通信に失敗しました"
            )
          );
        };


      document.body.appendChild(
        script
      );


      setTimeout(
        () => {

          if (
            finished
          ) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              "GAS通信がタイムアウトしました"
            )
          );

        },
        30000
      );

    }
  );
}


/*************************************************
 * 設定
 *************************************************/

async function loadSettings() {

  try {

    const result =
      await jsonp({
        action:
          "settings"
      });


    if (
      !result.success
    ) {

      throw new Error(
        result.error
      );
    }


    settings =
      result;


    if (
      !result.cameraEnabled
    ) {

      disableCamera();

      return false;
    }


    cameraPage.style.display =
      "block";

    lockScreen.style.display =
      "none";


    return true;

  } catch (error) {

    showError(
      error.message
    );

    return false;
  }
}


/*************************************************
 * カメラ停止
 *************************************************/

function stopCamera() {

  if (
    cameraStream
  ) {

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    cameraStream =
      null;
  }


  camera.srcObject =
    null;
}


/*************************************************
 * カメラ無効
 *************************************************/

function disableCamera() {

  stopCamera();


  cameraPage.style.display =
    "none";


  lockScreen.style.display =
    "flex";
}


/*************************************************
 * カメラ開始
 *************************************************/

async function startCamera() {

  if (
    !settings ||
    !settings.cameraEnabled
  ) {

    disableCamera();

    return false;
  }


  try {

    stopCamera();


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio: false,

          video: {

            facingMode:
              facingMode,

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }
          }

        });


    camera.srcObject =
      cameraStream;


    await camera.play();


    await applyZoom();


    return true;


  } catch (error) {

    console.error(
      error
    );


    showError(
      "カメラを起動できませんでした。カメラの使用許可を確認してください。"
    );


    return false;
  }
}


/*************************************************
 * ズーム
 *************************************************/

async function applyZoom() {

  if (
    !cameraStream
  ) {
    return;
  }


  const track =
    cameraStream
      .getVideoTracks()[0];


  if (!track) {
    return;
  }


  const capabilities =
    track.getCapabilities
      ? track.getCapabilities()
      : {};


  if (
    capabilities.zoom
  ) {

    try {

      await track.applyConstraints({

        advanced: [

          {
            zoom:
              currentZoom
          }

        ]

      });

    } catch (
      error
    ) {

      console.log(
        error
      );
    }
  }
}


/*************************************************
 * 写真撮影
 *************************************************/

async function takePhoto() {

  if (
    !cameraStream
  ) {

    const started =
      await startCamera();


    if (!started) {
      return;
    }
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    async blob => {

      if (!blob) {

        showError(
          "写真を作成できませんでした"
        );

        return;
      }


      await uploadFile(
        blob,
        "photo_" +
        formatDate(
          new Date()
        ) +
        ".jpg",
        "image/jpeg"
      );

    },
    "image/jpeg",
    0.92
  );
}


/*************************************************
 * 動画形式
 *************************************************/

function getVideoMimeType() {

  const types = [

    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

    "video/mp4",

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];


  for (
    const type of types
  ) {

    if (
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;
    }
  }


  return "";
}


/*************************************************
 * 録画開始
 *************************************************/

async function startRecording() {

  if (
    !cameraStream
  ) {

    const started =
      await startCamera();


    if (!started) {
      return;
    }
  }


  const mimeType =
    getVideoMimeType();


  if (!mimeType) {

    showError(
      "動画録画に対応していません"
    );

    return;
  }


  currentMimeType =
    mimeType;


  recordedChunks =
    [];


  mediaRecorder =
    new MediaRecorder(
      cameraStream,
      {

        mimeType:
          mimeType,

        videoBitsPerSecond:
          1200000,

        audioBitsPerSecond:
          96000

      }
    );


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size
      ) {

        recordedChunks.push(
          event.data
        );


        const size =
          recordedChunks.reduce(
            (sum, chunk) =>
              sum +
              chunk.size,
            0
          );


        if (
          size >=
          MAX_FILE_SIZE *
          0.95
        ) {

          stopRecording();
        }
      }
    };


  mediaRecorder.onstop =
    async () => {

      clearInterval(
        recordingTimer
      );


      recordTime.style.display =
        "none";


      shutterButton
        .classList
        .remove(
          "recording"
        );


      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              currentMimeType
          }
        );


      if (
        blob.size >
        MAX_FILE_SIZE
      ) {

        showError(
          "動画が20MBを超えています"
        );


        await resumeCamera();

        return;
      }


      const extension =
        currentMimeType
          .includes("mp4")
          ? "mp4"
          : "webm";


      await uploadFile(
        blob,
        "video_" +
        formatDate(
          new Date()
        ) +
        "." +
        extension,
        currentMimeType
      );

    };


  mediaRecorder.start(
    1000
  );


  recordingSeconds =
    0;


  recordTime.textContent =
    "00:00";


  recordTime.style.display =
    "block";


  shutterButton
    .classList
    .add(
      "recording"
    );


  recordingTimer =
    setInterval(
      () => {

        recordingSeconds++;


        const min =
          String(
            Math.floor(
              recordingSeconds /
              60
            )
          ).padStart(
            2,
            "0"
          );


        const sec =
          String(
            recordingSeconds %
            60
          ).padStart(
            2,
            "0"
          );


        recordTime.textContent =
          min +
          ":" +
          sec;


        if (
          recordingSeconds >=
          MAX_RECORDING_TIME
        ) {

          stopRecording();
        }

      },
      1000
    );
}


/*************************************************
 * 録画停止
 *************************************************/

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state ===
      "recording"
  ) {

    mediaRecorder.stop();
  }
}


/*************************************************
 * ファイルアップロード
 *************************************************/

async function uploadFile(
  blob,
  fileName,
  mimeType
) {

  try {

    showLoading(
      "保存しています..."
    );


    const check =
      await jsonp({
        action:
          "settings"
      });


    if (
      !check.success ||
      !check.cameraEnabled
    ) {

      hideLoading();

      disableCamera();

      alert(
        "現在カメラ機能が無効です"
      );

      return;
    }


    settings =
      check;


    if (
      blob.size >
      MAX_FILE_SIZE
    ) {

      throw new Error(
        "20MBを超えています"
      );
    }


    /*
     * アップロード開始
     */

    const start =
      await jsonp({

        action:
          "start",

        fileName:
          fileName,

        mimeType:
          mimeType,

        totalSize:
          blob.size,

        deviceId:
          getDeviceId()

      });


    if (
      !start.success
    ) {

      throw new Error(
        start.error
      );
    }


    /*
     * Blobをチャンクに分割
     */

    const totalChunks =
      Math.ceil(
        blob.size /
        CHUNK_SIZE
      );


    for (
      let i = 0;
      i < totalChunks;
      i++
    ) {

      const begin =
        i *
        CHUNK_SIZE;


      const end =
        Math.min(
          begin +
          CHUNK_SIZE,
          blob.size
        );


      const chunk =
        blob.slice(
          begin,
          end
        );


      const base64 =
        await blobToBase64(
          chunk
        );


      const data =
        base64.split(",")[1];


      showLoading(
        "保存しています... " +
        (i + 1) +
        " / " +
        totalChunks
      );


      await sendChunk(
        start.uploadId,
        i,
        totalChunks,
        data
      );
    }


    /*
     * GAS側の完成を確認
     */

    let completed =
      false;


    for (
      let i = 0;
      i < 15;
      i++
    ) {

      const status =
        await jsonp({

          action:
            "status",

          uploadId:
            start.uploadId

        });


      if (
        status.success &&
        status.completed &&
        status.fileId
      ) {

        completed =
          true;

        break;
      }


      await sleep(
        1000
      );
    }


    if (
      !completed
    ) {

      /*
       * 最後のチャンクのレスポンスから
       * 完成している場合もあるため、
       * 一覧を確認
       */

      await sleep(
        1500
      );
    }


    hideLoading();


    /*
     * 完了
     */

    alert(
      "保存できました！"
    );


    /*
     * ★アラートを閉じた後に復帰
     */

    await resumeCamera();


    /*
     * ギャラリー更新
     */

    await loadGallery(
      true
    );


  } catch (
    error
  ) {

    hideLoading();


    console.error(
      error
    );


    alert(
      "保存に失敗しました\n\n" +
      error.message
    );


    await resumeCamera();
  }
}


/*************************************************
 * チャンク送信
 *
 * GAS側のレスポンスを待つ
 *************************************************/

function sendChunk(
  uploadId,
  index,
  totalChunks,
  data
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.createElement(
          "iframe"
        );


      const name =
        "upload_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      iframe.name =
        name;


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        GAS_URL;


      form.target =
        name;


      const values = {

        action:
          "chunk",

        uploadId:
          uploadId,

        chunkIndex:
          index,

        totalChunks:
          totalChunks,

        data:
          data

      };


      Object.keys(
        values
      ).forEach(
        key => {

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "hidden";

          input.name =
            key;

          input.value =
            values[key];


          form.appendChild(
            input
          );

        }
      );


      document.body.appendChild(
        form
      );


      let done =
        false;


      const cleanup =
        () => {

          form.remove();

          iframe.remove();
        };


      iframe.onload =
        () => {

          if (done) {
            return;
          }


          done =
            true;


          cleanup();


          resolve();

        };


      iframe.onerror =
        () => {

          if (done) {
            return;
          }


          done =
            true;


          cleanup();


          reject(
            new Error(
              "チャンク送信に失敗しました"
            )
          );

        };


      form.submit();


      /*
       * GASの処理が長い場合
       */

      setTimeout(
        () => {

          if (done) {
            return;
          }


          done =
            true;


          cleanup();


          resolve();

        },
        30000
      );

    }
  );
}


/*************************************************
 * Blob → Base64
 *************************************************/

function blobToBase64(
  blob
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


/*************************************************
 * 保存後カメラ復帰
 *************************************************/

async function resumeCamera() {

  try {

    const result =
      await jsonp({
        action:
          "settings"
      });


    if (
      !result.success ||
      !result.cameraEnabled
    ) {

      disableCamera();

      return;
    }


    settings =
      result;


    if (
      !cameraStream ||
      cameraStream
        .getVideoTracks()
        .every(
          track =>
            track.readyState ===
            "ended"
        )
    ) {

      await startCamera();

    } else {

      try {

        await camera.play();

      } catch (
        error
      ) {

        await startCamera();
      }
    }

  } catch (
    error
  ) {

    console.error(
      error
    );


    /*
     * それでもカメラ復帰
     */

    try {

      await startCamera();

    } catch (
      e
    ) {

      console.error(e);
    }
  }
}

/*************************************************
 * HTMLエスケープ
 *************************************************/

function escapeHtml(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

/*************************************************

 *************************************************/

function postDelete(
  fileId
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.createElement(
          "iframe"
        );


      const name =
        "delete_" +
        Date.now();


      iframe.name =
        name;


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        GAS_URL;


      form.target =
        name;


      const fields = {

        action:
          "delete",

        fileId:
          fileId,

        deviceId:
          getDeviceId()

      };


      Object.keys(
        fields
      ).forEach(
        key => {

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "hidden";

          input.name =
            key;

          input.value =
            fields[key];


          form.appendChild(
            input
          );

        }
      );


      document.body.appendChild(
        form
      );


      iframe.onload =
        () => {

          form.remove();

          iframe.remove();

          resolve({
            success:
              true
          });

        };


      iframe.onerror =
        () => {

          form.remove();

          iframe.remove();

          reject(
            new Error(
              "削除に失敗しました"
            )
          );

        };


      form.submit();

    }
  );
}

            }

          ]

        });

    }
  );


/*************************************************
 * フォーカス
 *************************************************/

camera.addEventListener(
  "click",
  async event => {

    if (
      !cameraStream
    ) {
      return;
    }


    const rect =
      camera.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    const box =
      document.getElementById(
        "focusBox"
      );


    box.style.left =
      x + "px";


    box.style.top =
      y + "px";


    box.style.display =
      "block";


    setTimeout(
      () => {

        box.style.display =
          "none";

      },
      1000
    );

  }
);


/*************************************************
 * Visibility
 *************************************************/

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      if (
        !mediaRecorder ||
        mediaRecorder.state !==
          "recording"
      ) {

        await resumeCamera();
      }
    }

  }
);


/*************************************************
 * 待機
 *************************************************/

function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


/*************************************************
 * 日付
 *************************************************/

function formatDate(
  date
) {

  return (
    date.getFullYear() +
    String(
      date.getMonth() + 1
    ).padStart(2,"0") +
    String(
      date.getDate()
    ).padStart(2,"0") +
    "_" +
    String(
      date.getHours()
    ).padStart(2,"0") +
    String(
      date.getMinutes()
    ).padStart(2,"0") +
    String(
      date.getSeconds()
    ).padStart(2,"0")
  );
}


/*************************************************
 * 初期化
 *************************************************/

async function init() {

  if (
    !GAS_URL ||
    GAS_URL.includes(
      "ここにGAS"
    )
  ) {

    alert(
      "GAS_URLを設定してください"
    );

    return;
  }


  const enabled =
    await loadSettings();


  if (
    !enabled
  ) {
    return;
  }


  await startCamera();

}


init();

</script>
