<script>


/* =====================================================
   GAS URL
===================================================== */

/*
 * ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
 *
 * ここを自分のGASウェブアプリURLに変更
 *
 * 例：
 * https://script.google.com/macros/s/XXXXXXXX/exec
 *
 * ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
 */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwUTqlU9eR6NUMVVDO91s-uB0RKObF4YXKbVc-_5DHMGwKdGQ3P4_LuzLDVfWtP6NCqaA/exec";


/* =====================================================
   容量設定
===================================================== */


/*
 * 本当の最大容量
 *
 * 15MB
 */

const MAX_FILE_SIZE =
  15 * 1024 * 1024;


/*
 * 安全停止容量
 *
 * 14MB
 *
 * 15MBになる前に停止する
 */

const AUTO_STOP_SIZE =
  14 * 1024 * 1024;


/* =====================================================
   DOM
===================================================== */

const camera =
  document.getElementById(
    "camera"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const errorScreen =
  document.getElementById(
    "errorScreen"
  );


const errorMessage =
  document.getElementById(
    "errorMessage"
  );


const retryButton =
  document.getElementById(
    "retryButton"
  );


const shutter =
  document.getElementById(
    "shutter"
  );


const photoMode =
  document.getElementById(
    "photoMode"
  );


const videoMode =
  document.getElementById(
    "videoMode"
  );


const switchCamera =
  document.getElementById(
    "switchCamera"
  );


const zoomSlider =
  document.getElementById(
    "zoomSlider"
  );


const zoomValue =
  document.getElementById(
    "zoomValue"
  );


const status =
  document.getElementById(
    "status"
  );


const cameraStatus =
  document.getElementById(
    "cameraStatus"
  );


const recordInfo =
  document.getElementById(
    "recordInfo"
  );


const recordTime =
  document.getElementById(
    "recordTime"
  );


const recordSize =
  document.getElementById(
    "recordSize"
  );


const gallery =
  document.getElementById(
    "gallery"
  );


const galleryButton =
  document.getElementById(
    "galleryButton"
  );


const galleryBack =
  document.getElementById(
    "galleryBack"
  );


const galleryGrid =
  document.getElementById(
    "galleryGrid"
  );


const refreshGallery =
  document.getElementById(
    "refreshGallery"
  );


const viewer =
  document.getElementById(
    "viewer"
  );


const viewerContent =
  document.getElementById(
    "viewerContent"
  );


const viewerClose =
  document.getElementById(
    "viewerClose"
  );


const viewerOpenDrive =
  document.getElementById(
    "viewerOpenDrive"
  );


/* =====================================================
   変数
===================================================== */

let stream =
  null;


let currentFacingMode =
  "environment";


let currentMode =
  "photo";


let mediaRecorder =
  null;


let recordedChunks =
  [];


let recordingStartTime =
  0;


let timerInterval =
  null;


let currentZoom =
  1;


let autoStopped =
  false;


let currentViewerUrl =
  "";


/* =====================================================
   ステータス
===================================================== */

function showStatus(
  message,
  duration = 3000
) {

  status.textContent =
    message;


  status.style.display =
    "block";


  if (
    duration > 0
  ) {

    setTimeout(
      function() {

        status.style.display =
          "none";

      },
      duration
    );

  }

}


/* =====================================================
   MB
===================================================== */

function formatMB(
  bytes
) {

  return (
    bytes /
    1024 /
    1024
  ).toFixed(2);

}


/* =====================================================
   時間
===================================================== */

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const sec =
    Math.floor(
      seconds % 60
    );


  return (
    String(
      minutes
    ).padStart(
      2,
      "0"
    ) +
    ":" +
    String(
      sec
    ).padStart(
      2,
      "0"
    )
  );

}


/* =====================================================
   設定確認
===================================================== */

function checkSettings() {

  return new Promise(
    function(resolve) {

      const callbackName =
        "settingsCallback_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            cleanup();


            resolve(
              null
            );

          },
          10000
        );


      window[
        callbackName
      ] =
        function(data) {

          if (
            finished
          ) {

            return;

          }


          finished =
            true;


          clearTimeout(
            timeout
          );


          cleanup();


          if (
            data &&
            data.enabled
          ) {

            cameraStatus.textContent =
              "カメラON";

          } else {

            cameraStatus.textContent =
              "カメラOFF";

          }


          resolve(
            data
          );

        };


      script.src =
        GAS_URL +
        "?action=settings" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      document.body.appendChild(
        script
      );


      function cleanup() {

        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

      }

    }
  );

}


/* =====================================================
   カメラ開始
===================================================== */

async function startCamera() {

  try {

    const settings =
      await checkSettings();


    /*
     * GASから設定が取得できた場合
     */

    if (
      settings &&
      settings.enabled === false
    ) {

      throw new Error(
        "スプレッドシートの設定でカメラがOFFになっています。"
      );

    }


    /*
     * 既存カメラ停止
     */

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }


    /*
     * カメラ取得
     */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              currentFacingMode,

            width: {

              ideal:
                1280

            },

            height: {

              ideal:
                720

            }

          },

          audio: true

        });


    camera.srcObject =
      stream;


    await camera.play();


    startScreen.style.display =
      "none";


    errorScreen.style.display =
      "none";


    cameraStatus.textContent =
      currentFacingMode ===
      "environment"
        ? "背面カメラ"
        : "前面カメラ";


    showStatus(
      "カメラを開始しました。",
      2000
    );


  } catch (error) {

    console.error(
      error
    );


    errorScreen.style.display =
      "flex";


    errorMessage.textContent =
      "カメラを使用できません。\n\n" +
      error.message;


    cameraStatus.textContent =
      "エラー";

  }

}


/* =====================================================
   カメラ切り替え
===================================================== */

switchCamera.onclick =
  async function() {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
      "recording"
    ) {

      showStatus(
        "録画中はカメラを切り替えられません。"
      );

      return;

    }


    currentFacingMode =
      currentFacingMode ===
      "environment"
        ? "user"
        : "environment";


    await startCamera();

  };


/* =====================================================
   写真モード
===================================================== */

photoMode.onclick =
  function() {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
      "recording"
    ) {

      return;

    }


    currentMode =
      "photo";


    photoMode.classList.add(
      "active"
    );


    videoMode.classList.remove(
      "active"
    );


    showStatus(
      "📷 写真モード"
    );

  };


/* =====================================================
   動画モード
===================================================== */

videoMode.onclick =
  function() {

    currentMode =
      "video";


    videoMode.classList.add(
      "active"
    );


    photoMode.classList.remove(
      "active"
    );


    showStatus(
      "🎥 動画モード"
    );

  };


/* =====================================================
   シャッター
===================================================== */

shutter.onclick =
  function() {

    if (
      currentMode ===
      "photo"
    ) {

      takePhoto();

    } else {

      toggleRecording();

    }

  };


/* =====================================================
   写真
===================================================== */

function takePhoto() {

  if (
    !camera.videoWidth
  ) {

    showStatus(
      "カメラ映像が準備されていません。"
    );

    return;

  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;


  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    function(blob) {

      if (!blob) {

        showStatus(
          "写真の作成に失敗しました。"
        );

        return;

      }


      uploadBlob(
        blob,
        "IMG_" +
        Date.now() +
        ".jpg",
        "image/jpeg"
      );

    },
    "image/jpeg",
    0.92
  );

}


/* =====================================================
   MediaRecorder形式
===================================================== */

function getSupportedMimeType() {

  const types = [

    "video/mp4;codecs=avc1",

    "video/mp4",

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  for (
    const type of types
  ) {

    if (
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;

    }

  }


  return "";

}


/* =====================================================
   録画切り替え
===================================================== */

function toggleRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state ===
    "recording"
  ) {

    stopRecording(
      false
    );

  } else {

    startRecording();

  }

}


/* =====================================================
   録画開始
===================================================== */

function startRecording() {

  if (!stream) {

    showStatus(
      "カメラを先に開始してください。"
    );

    return;

  }


  const mimeType =
    getSupportedMimeType();


  if (!mimeType) {

    showStatus(
      "このブラウザは動画録画に対応していません。"
    );

    return;

  }


  recordedChunks =
    [];


  autoStopped =
    false;


  mediaRecorder =
    new MediaRecorder(
      stream,
      {

        mimeType:
          mimeType,

        /*
         * 容量を抑えるため
         * 約2Mbps
         */

        videoBitsPerSecond:
          2000000,

        audioBitsPerSecond:
          96000

      }
    );


  mediaRecorder.ondataavailable =
    function(event) {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );


        /*
         * 現在サイズ計算
         */

        const size =
          recordedChunks.reduce(
            function(
              total,
              chunk
            ) {

              return (
                total +
                chunk.size
              );

            },
            0
          );


        recordSize.textContent =
          formatMB(
            size
          ) +
          "MB";


        /*
         * 14MBで自動停止
         */

        if (
          size >=
          AUTO_STOP_SIZE
        ) {

          if (
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
          ) {

            autoStopped =
              true;


            showStatus(
              "⚠️ 15MBに近づいたため録画を自動停止します。",
              5000
            );


            stopRecording(
              true
            );

          }

        }

      }

    };


  mediaRecorder.onstop =
    function() {

      finishRecording();

    };


  mediaRecorder.onerror =
    function(event) {

      console.error(
        event
      );


      cleanupRecordingUI();


      showStatus(
        "❌ 録画中にエラーが発生しました。",
        5000
      );

    };


  /*
   * 1秒ごとにデータ取得
   */

  mediaRecorder.start(
    1000
  );


  recordingStartTime =
    Date.now();


  recordInfo.style.display =
    "flex";


  shutter.classList.add(
    "recording"
  );


  timerInterval =
    setInterval(
      function() {

        const seconds =
          Math.floor(
            (
              Date.now() -
              recordingStartTime
            ) / 1000
          );


        recordTime.textContent =
          formatTime(
            seconds
          );

      },
      250
    );


  showStatus(
    "🔴 録画開始",
    1500
  );

}


/* =====================================================
   録画停止
===================================================== */

function stopRecording(
  isAutoStop
) {

  if (
    !mediaRecorder ||
    mediaRecorder.state !==
    "recording"
  ) {

    return;

  }


  if (
    isAutoStop
  ) {

    autoStopped =
      true;

  }


  mediaRecorder.stop();


  clearInterval(
    timerInterval
  );


  timerInterval =
    null;

}


/* =====================================================
   録画終了
===================================================== */

function finishRecording() {

  const recorder =
    mediaRecorder;


  if (!recorder) {

    return;

  }


  const mimeType =
    recorder.mimeType ||
    "video/webm";


  const blob =
    new Blob(
      recordedChunks,
      {
        type:
          mimeType
      }
    );


  cleanupRecordingUI();


  /*
   * 最終容量チェック
   */

  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    showStatus(
      "⚠️ 動画が15MBを超えたため保存しませんでした。",
      6000
    );


    recordedChunks =
      [];


    mediaRecorder =
      null;


    return;

  }


  /*
   * 拡張子
   */

  const extension =
    mimeType
      .toLowerCase()
      .includes("mp4")
      ? ".mp4"
      : ".webm";


  const fileName =
    "VID_" +
    Date.now() +
    extension;


  if (
    autoStopped
  ) {

    showStatus(
      "🛑 容量上限に近づいたため自動停止。保存中...",
      5000
    );

  } else {

    showStatus(
      "☁ 動画を保存中...",
      5000
    );

  }


  uploadBlob(
    blob,
    fileName,
    mimeType
  );


  recordedChunks =
    [];


  mediaRecorder =
    null;

}


/* =====================================================
   録画UI解除
===================================================== */

function cleanupRecordingUI() {

  recordInfo.style.display =
    "none";


  shutter.classList.remove(
    "recording"
  );


  clearInterval(
    timerInterval
  );


  timerInterval =
    null;

}


/* =====================================================
   Blobアップロード
===================================================== */

async function uploadBlob(
  blob,
  fileName,
  mimeType
) {

  /*
   * 15MB最終確認
   */

  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    showStatus(
      "❌ 15MBを超えているため保存できません。",
      5000
    );

    return;

  }


  showStatus(
    "☁ Google Driveへ保存中...",
    0
  );


  try {

    /*
     * Base64変換
     */

    const base64 =
      await blobToBase64(
        blob
      );


    /*
     * POSTデータ
     */

    const formData =
      new URLSearchParams();


    formData.append(
      "base64Data",
      base64
    );


    formData.append(
      "fileName",
      fileName
    );


    formData.append(
      "mimeType",
      mimeType
    );


    /*
     * GASへ送信
     */

    await fetch(
      GAS_URL,
      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"

        },

        body:
          formData.toString()

      }
    );


    showStatus(
      "✅ Google Driveへ保存処理を送信しました。",
      5000
    );


  } catch (error) {

    console.error(
      error
    );


    showStatus(
      "❌ Google Driveへの保存に失敗しました。",
      5000
    );

  }

}


/* =====================================================
   Blob → Base64
===================================================== */

function blobToBase64(
  blob
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onloadend =
        function() {

          const result =
            reader.result;


          const base64 =
            result.split(
              ","
            )[1];


          resolve(
            base64
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* =====================================================
   ズーム
===================================================== */

zoomSlider.oninput =
  function() {

    currentZoom =
      parseFloat(
        zoomSlider.value
      );


    zoomValue.textContent =
      currentZoom.toFixed(
        1
      ) +
      "x";


    camera.style.transform =
      "scale(" +
      currentZoom +
      ")";

  };


/* =====================================================
   ギャラリー表示
===================================================== */

galleryButton.onclick =
  async function() {

    gallery.style.display =
      "block";


    await loadGallery();

  };


/* =====================================================
   カメラに戻る
===================================================== */

galleryBack.onclick =
  function() {

    gallery.style.display =
      "none";

  };


/* =====================================================
   ギャラリー更新
===================================================== */

refreshGallery.onclick =
  async function() {

    await loadGallery();

  };


/* =====================================================
   Driveファイル取得
===================================================== */

function loadGallery() {

  return new Promise(
    function(resolve) {

      galleryGrid.innerHTML =
        `
        <div style="
          grid-column:1/-1;
          text-align:center;
          padding:40px;
        ">
          ☁️ 読み込み中...
        </div>
        `;


      const callbackName =
        "galleryCallback_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            galleryGrid.innerHTML =
              `
              <div style="
                grid-column:1/-1;
                text-align:center;
                padding:40px;
              ">
                ❌ 読み込みがタイムアウトしました。
              </div>
              `;


            cleanup();


            resolve();

          },
          15000
        );


      window[
        callbackName
      ] =
        function(data) {

          if (
            finished
          ) {

            return;

          }


          finished =
            true;


          clearTimeout(
            timeout
          );


          renderGallery(
            data
          );


          cleanup();


          resolve();

        };


      script.src =
        GAS_URL +
        "?action=files" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      document.body.appendChild(
        script
      );


      function cleanup() {

        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

      }

    }
  );

}


/* =====================================================
   ギャラリー描画
===================================================== */

function renderGallery(
  data
) {

  galleryGrid.innerHTML =
    "";


  if (
    !data ||
    !data.success
  ) {

    galleryGrid.innerHTML =
      `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
      ">
        ❌
        ${
          data &&
          data.message
            ? data.message
            : "読み込みに失敗しました。"
        }
      </div>
      `;


    return;

  }


  if (
    !data.files ||
    data.files.length === 0
  ) {

    galleryGrid.innerHTML =
      `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:50px 20px;
      ">
        📷<br><br>
        写真・動画がありません。
      </div>
      `;


    return;

  }


  data.files.forEach(
    function(file) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "mediaCard";


      /*
       * 写真
       */

      if (
        file.type ===
        "image"
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          file.imageUrl;


        img.alt =
          file.name;


        img.loading =
          "lazy";


        card.appendChild(
          img
        );

      }


      /*
       * 動画
       */

      else {

        const iframe =
          document.createElement(
            "iframe"
          );


        iframe.className =
          "videoThumbnail";


        iframe.src =
          file.previewUrl;


        iframe.allow =
          "autoplay";


        iframe.loading =
          "lazy";


        card.appendChild(
          iframe
        );


        const mark =
          document.createElement(
            "div"
          );


        mark.className =
          "videoMark";


        mark.textContent =
          "▶ 動画";


        card.appendChild(
          mark
        );

      }


      /*
       * ファイル情報
       */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "mediaInfo";


      info.textContent =
        file.name +
        "　" +
        file.sizeMB +
        "MB";


      card.appendChild(
        info
      );


      /*
       * クリック
       */

      card.onclick =
        function() {

          openViewer(
            file
          );

        };


      galleryGrid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   ビューア
===================================================== */

function openViewer(
  file
) {

  viewerContent.innerHTML =
    "";


  currentViewerUrl =
    file.viewUrl;


  /*
   * 写真
   */

  if (
    file.type ===
    "image"
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.src =
      file.imageUrl;


    img.alt =
      file.name;


    viewerContent.appendChild(
      img
    );

  }


  /*
   * 動画
   */

  else {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.src =
      file.previewUrl;


    iframe.allow =
      "autoplay";


    iframe.allowFullscreen =
      true;


    viewerContent.appendChild(
      iframe
    );

  }


  viewer.style.display =
    "flex";

}


/* =====================================================
   ビューア閉じる
===================================================== */

viewerClose.onclick =
  function() {

    viewer.style.display =
      "none";


    viewerContent.innerHTML =
      "";


    currentViewerUrl =
      "";

  };


/* =====================================================
   Google Driveで開く
===================================================== */

viewerOpenDrive.onclick =
  function() {

    if (
      !currentViewerUrl
    ) {

      return;

    }


    window.open(
      currentViewerUrl,
      "_blank"
    );

  };


/* =====================================================
   カメラ開始
===================================================== */

startButton.onclick =
  function() {

    startCamera();

  };


/* =====================================================
   再試行
===================================================== */

retryButton.onclick =
  function() {

    errorScreen.style.display =
      "none";


    startScreen.style.display =
      "flex";


    startCamera();

  };


/* =====================================================
   ページ終了
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

  }
);

</script>
