<title>共有カメラ</title>


<style>

/* =========================================
   基本
========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button {
  font-family: inherit;
}


/* =========================================
   カメラ
========================================= */

#app {
  width: 100%;
  height: 100%;
  position: relative;
  background: #000;
}

#cameraPage {
  position: absolute;
  inset: 0;
  background: #000;
}

#camera {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}


/* =========================================
   上部
========================================= */

.topBar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;

  z-index: 10;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    18px
    12px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.6),
      transparent
    );
}

.topTitle {
  font-size: 16px;
  font-weight: 600;
}

.topButtons {
  display: flex;
  gap: 10px;
}

.circleButton {
  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  background: rgba(0,0,0,.45);
  color: #fff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;

  backdrop-filter: blur(10px);
}


/* =========================================
   モード
========================================= */

.modeSelector {
  position: absolute;

  top: calc(
    env(safe-area-inset-top) + 68px
  );

  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  display: flex;
  gap: 5px;

  padding: 5px;

  border-radius: 30px;

  background: rgba(0,0,0,.45);

  backdrop-filter: blur(12px);
}

.modeButton {
  border: 0;

  border-radius: 22px;

  padding: 8px 18px;

  color: #fff;

  background: transparent;

  font-size: 13px;
}

.modeButton.active {
  background: #fff;
  color: #000;
}


/* =========================================
   フォーカス
========================================= */

#focusBox {
  position: absolute;

  width: 80px;
  height: 80px;

  border: 2px solid rgba(255,255,255,.9);

  border-radius: 8px;

  transform:
    translate(-50%, -50%);

  display: none;

  z-index: 8;

  pointer-events: none;
}


/* =========================================
   ズーム
========================================= */

.zoomBox {
  position: absolute;

  left: 50%;
  bottom: 170px;

  transform: translateX(-50%);

  z-index: 10;

  display: flex;
  gap: 7px;
}

.zoomButton {
  width: 38px;
  height: 38px;

  border: 0;
  border-radius: 50%;

  color: #fff;

  background: rgba(0,0,0,.45);

  backdrop-filter: blur(8px);
}

.zoomButton.active {
  background: #fff;
  color: #000;
}


/* =========================================
   下部操作
========================================= */

.bottomBar {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 10;

  padding:
    18px
    24px
    calc(env(safe-area-inset-bottom) + 22px);

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.7),
      transparent
    );
}

.bottomSide {
  width: 60px;
  display: flex;
  justify-content: center;
}

.shutter {
  width: 76px;
  height: 76px;

  border-radius: 50%;

  border: 5px solid #fff;

  background: transparent;

  position: relative;
}

.shutter::after {
  content: "";

  position: absolute;

  inset: 6px;

  border-radius: 50%;

  background: #fff;

  transition: .2s;
}

.shutter.recording::after {
  inset: 19px;
  border-radius: 10px;
}

.smallButton {
  width: 48px;
  height: 48px;

  border: 0;
  border-radius: 50%;

  background: rgba(0,0,0,.45);

  color: #fff;

  font-size: 20px;

  backdrop-filter: blur(10px);
}


/* =========================================
   録画時間
========================================= */

#recordTime {

  top: calc(
    env(safe-area-inset-top) + 120px

  transform: translateX(-50%);

  z-index: 10;

  border-radius: 20px;

  display: none;

}


/* =========================================
   ロック画面
========================================= */

#lockScreen {
  position: absolute;

  z-index: 100;

  background:
    radial-gradient(

  justify-content: center;

}

.lockIcon {

  margin-bottom: 20px;
}

.lockTitle {
  font-size: 22px;

  margin-bottom: 10px;

.lockText {

}


/* =========================================

========================================= */

#galleryPage {

  z-index: 50;

  overflow-y: auto;
}

.galleryHeader {

.galleryTabs {

.galleryTab.active {

.galleryGrid {

.mediaCard img {

/* =========================================
   プレビュー
========================================= */

}

.previewTop {

.previewBottom {

  color: #fff;

}

/* =========================================
   ローディング
========================================= */

#loading {

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.72);

.loader {

@keyframes spin {

/* =========================================

========================================= */

#errorMessage {

  left: 15px;

  bottom: 20px;

/* =========================================

========================================= */

@media (min-width: 700px) {

  .galleryGrid {
    grid-template-columns:

</style>

<script>

/*************************************************
 * GAS URL
 *
 * ↓↓↓ここだけ変更↓↓↓
 *************************************************/

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwS9yjD9OY5hWz6KYOj5dwwyUjfzdQt9t7P1xMCuHCx2qNSHQZxTJvX_ItgpCWBlsdrxw/exec";


/*************************************************
 * 設定
 *************************************************/

const MAX_FILE_SIZE =
  20 * 1024 * 1024;

const CHUNK_SIZE =
  256 * 1024;

const MAX_RECORDING_TIME =
  60;


/*************************************************
 * 状態
 *************************************************/

let cameraStream = null;

let currentMode = "photo";

let facingMode = "environment";

let currentZoom = 1;

let torchEnabled = false;

let mediaRecorder = null;

let recordedChunks = [];

let recordingTimer = null;

let recordingSeconds = 0;

let settings = null;

let mediaList = [];

let currentFilter = "all";

let currentPreview = null;

let currentMimeType = "";


/*************************************************
 * Device ID
 *************************************************/

function getDeviceId() {

  let id =
    localStorage.getItem(
      "sharedCameraDeviceId"
    );


  if (!id) {

    id =
      crypto.randomUUID
        ? crypto.randomUUID()
        : "device-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2);


    localStorage.setItem(
      "sharedCameraDeviceId",
      id
    );
  }


  return id;
}


/*************************************************
 * DOM
 *************************************************/

const camera =
  document.getElementById("camera");

const cameraPage =
  document.getElementById("cameraPage");

const lockScreen =
  document.getElementById("lockScreen");

const shutterButton =
  document.getElementById(
    "shutterButton"
  );

const recordTime =
  document.getElementById(
    "recordTime"
  );

const loading =
  document.getElementById(
    "loading"
  );

const loadingText =
  document.getElementById(
    "loadingText"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );

const galleryPage =
  document.getElementById(
    "galleryPage"
  );

const galleryGrid =
  document.getElementById(
    "galleryGrid"
  );

const previewPage =
  document.getElementById(
    "previewPage"
  );

const previewContent =
  document.getElementById(
    "previewContent"
  );


/*************************************************
 * ローディング
 *************************************************/

function showLoading(text) {

  loadingText.textContent =
    text || "処理中...";

  loading.style.display =
    "flex";
}


function hideLoading() {

  loading.style.display =
    "none";
}


/*************************************************
 * エラー
 *************************************************/

function showError(message) {

  errorMessage.textContent =
    message;

  errorMessage.style.display =
    "block";


  setTimeout(() => {

    errorMessage.style.display =
      "none";

  }, 5000);
}


/*************************************************
 * JSONP
 *************************************************/

function jsonp(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "jsonp_" +
        Date.now() +
        "_" +
        Math
          .random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      script.src =
        GAS_URL +
        "?" +
        query.toString();


      window[callbackName] =
        function(data) {

          delete window[
            callbackName
          ];

          script.remove();

          resolve(data);
        };


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              "GASとの通信に失敗しました"
            )
          );
        };


      document.body.appendChild(
        script
      );


      setTimeout(() => {

        if (
          window[
            callbackName
          ]
        ) {

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              "GAS通信がタイムアウトしました"
            )
          );
        }

      }, 30000);

    }
  );
}


/*************************************************
 * 設定読み込み
 *************************************************/

async function loadSettings() {

  try {

    const result =
      await jsonp({
        action:
          "settings"
      });


    if (!result.success) {

      throw new Error(
        result.error ||
        "設定取得失敗"
      );
    }


    settings =
      result;


    if (
      !settings.cameraEnabled
    ) {

      disableCamera();

      return false;
    }


    lockScreen.style.display =
      "none";

    cameraPage.style.display =
      "block";


    return true;


  } catch (error) {

    showError(
      error.message
    );

    return false;
  }
}


/*************************************************
 * カメラ停止
 *************************************************/

function stopCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track => {
          track.stop();
        }
      );

    cameraStream = null;
  }


  camera.srcObject =
    null;
}


/*************************************************
 * カメラ無効
 *************************************************/

function disableCamera() {

  stopCamera();

  cameraPage.style.display =
    "none";

  lockScreen.style.display =
    "flex";
}


/*************************************************
 * カメラ開始
 *************************************************/

async function startCamera() {

  if (
    !settings ||
    !settings.cameraEnabled
  ) {

    disableCamera();

    return false;
  }


  try {

    stopCamera();


    const constraints = {

      audio: false,

      video: {

        facingMode:
          facingMode,

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        },

        frameRate: {
          ideal: 30
        }
      }
    };


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    camera.srcObject =
      cameraStream;


    await camera.play();


    await applyZoom();


    cameraPage.style.display =
      "block";

    lockScreen.style.display =
      "none";


    return true;


  } catch (error) {

    console.error(error);

    showError(
      "カメラを起動できませんでした。カメラの使用許可を確認してください。"
    );

    return false;
  }
}


/*************************************************
 * ズーム
 *************************************************/

async function applyZoom() {

  if (!cameraStream) {
    return;
  }


  const track =
    cameraStream
      .getVideoTracks()[0];


  if (!track) {
    return;
  }


  const capabilities =
    track.getCapabilities
      ? track.getCapabilities()
      : {};


  if (
    capabilities.zoom
  ) {

    const min =
      capabilities.zoom.min || 1;

    const max =
      capabilities.zoom.max || 1;


    const zoom =
      Math.max(
        min,
        Math.min(
          max,
          currentZoom
        )
      );


    try {

      await track.applyConstraints({
        advanced: [
          {
            zoom:
              zoom
          }
        ]
      });

    } catch (error) {

      console.log(
        "Zoom unavailable",
        error
      );
    }
  }
}


/*************************************************
 * 写真撮影
 *************************************************/

async function takePhoto() {

  if (!cameraStream) {

    const started =
      await startCamera();

    if (!started) {
      return;
    }
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    async blob => {

      if (!blob) {

        showError(
          "写真の作成に失敗しました"
        );

        return;
      }


      const fileName =
        "photo_" +
        formatDate(
          new Date()
        ) +
        ".jpg";


      await uploadFile(
        blob,
        fileName,
        "image/jpeg"
      );

    },
    "image/jpeg",
    0.92
  );
}


/*************************************************
 * MP4 / WebM判定
 *************************************************/

function getVideoMimeType() {

  const types = [

    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

    "video/mp4",

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];


  for (
    const type of types
  ) {

    if (
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported &&
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;
    }
  }


  return "";
}


/*************************************************
 * 動画録画開始
 *************************************************/

async function startRecording() {

  if (!cameraStream) {

    const started =
      await startCamera();

    if (!started) {
      return;
    }
  }


  const mimeType =
    getVideoMimeType();


  if (!mimeType) {

    showError(
      "このブラウザでは動画録画に対応していません"
    );

    return;
  }


  currentMimeType =
    mimeType;


  recordedChunks = [];


  try {

    mediaRecorder =
      new MediaRecorder(
        cameraStream,
        {
          mimeType:
            mimeType,

          videoBitsPerSecond:
            1200000,

          audioBitsPerSecond:
            96000
        }
      );


  } catch (error) {

    showError(
      "録画を開始できませんでした"
    );

    return;
  }


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );


        /*
         * 20MBを超えそうなら
         * 自動停止
         */
        const size =
          recordedChunks.reduce(
            (total, chunk) =>
              total +
              chunk.size,
            0
          );


        if (
          size >=
          MAX_FILE_SIZE * 0.95
        ) {

          stopRecording();

          showError(
            "ファイルサイズが20MBに近づいたため録画を自動停止しました"
          );
        }
      }
    };


  mediaRecorder.onstop =
    async () => {

      clearInterval(
        recordingTimer
      );


      recordTime.style.display =
        "none";


      shutterButton
        .classList
        .remove(
          "recording"
        );


      const extension =
        currentMimeType
          .includes("mp4")
          ? "mp4"
          : "webm";


      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              currentMimeType
          }
        );


      if (
        blob.size >
        MAX_FILE_SIZE
      ) {

        showError(
          "動画が20MBを超えています"
        );

        return;
      }


      const fileName =
        "video_" +
        formatDate(
          new Date()
        ) +
        "." +
        extension;


      await uploadFile(
        blob,
        fileName,
        currentMimeType
      );

    };


  mediaRecorder.start(
    1000
  );


  recordingSeconds =
    0;


  recordTime.textContent =
    "00:00";


  recordTime.style.display =
    "block";


  shutterButton
    .classList
    .add(
      "recording"
    );


  recordingTimer =
    setInterval(() => {

      recordingSeconds++;


      const minutes =
        String(
          Math.floor(
            recordingSeconds / 60
          )
        ).padStart(
          2,
          "0"
        );


      const seconds =
        String(
          recordingSeconds % 60
        ).padStart(
          2,
          "0"
        );


      recordTime.textContent =
        minutes +
        ":" +
        seconds;


      if (
        recordingSeconds >=
        MAX_RECORDING_TIME
      ) {

        stopRecording();
      }

    }, 1000);
}


/*************************************************
 * 録画停止
 *************************************************/

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    mediaRecorder.stop();
  }
}


/*************************************************
 * ファイルアップロード
 *************************************************/

async function uploadFile(
  blob,
  fileName,
  mimeType
) {

  try {

    showLoading(
      "保存しています..."
    );


    /*
     * 最新設定確認
     */
    const currentSettings =
      await jsonp({
        action:
          "settings"
      });


    if (
      !currentSettings.success
    ) {

      throw new Error(
        currentSettings.error ||
        "設定取得失敗"
      );
    }


    if (
      !currentSettings.cameraEnabled
    ) {

      hideLoading();

      disableCamera();

      alert(
        "現在カメラ機能が無効になっています"
      );

      return;
    }


    if (
      blob.size >
      MAX_FILE_SIZE
    ) {

      throw new Error(
        "ファイルサイズが20MBを超えています"
      );
    }


    /*
     * Base64
     */
    const base64 =
      await blobToBase64(
        blob
      );


    /*
     * data: を除去
     */
    const base64Data =
      base64.split(",")[1];


    /*
     * アップロード開始
     */
    const start =
      await jsonp({

        action:
          "start",

        fileName:
          fileName,

        mimeType:
          mimeType,

        totalSize:
          blob.size,

        deviceId:
          getDeviceId()
      });


    if (
      !start.success
    ) {

      throw new Error(
        start.error ||
        "アップロード開始失敗"
      );
    }


    const chunkSize =
      start.chunkSize ||
      CHUNK_SIZE;


    const totalChunks =
      Math.ceil(
        base64Data.length /
        Math.floor(
          chunkSize * 1.35
        )
      );


    /*
     * 実際にはバイナリサイズを基準に
     * 分割する
     */
    const binaryChunkSize =
      chunkSize;


    const binaryData =
      base64ToUint8Array(
        base64Data
      );


    const actualTotalChunks =
      Math.ceil(
        binaryData.length /
        binaryChunkSize
      );


    /*
     * 順番にアップロード
     */
    for (
      let i = 0;
      i < actualTotalChunks;
      i++
    ) {

      const startByte =
        i *
        binaryChunkSize;


      const endByte =
        Math.min(
          startByte +
          binaryChunkSize,
          binaryData.length
        );


      const chunk =
        binaryData.slice(
          startByte,
          endByte
        );


      const chunkBase64 =
        uint8ArrayToBase64(
          chunk
        );


      showLoading(
        "保存しています... " +
        (i + 1) +
        " / " +
        actualTotalChunks
      );


      await postChunk(
        start.uploadId,
        i,
        actualTotalChunks,
        chunkBase64
      );
    }


    /*
     * 保存完了をGAS側で確認
     */
    await waitForUploadCompletion(
      start.uploadId,
      actualTotalChunks
    );


    hideLoading();


    /*
     * ★重要
     *
     * alertを閉じたあと、
     * 必ずカメラを再起動する
     */
    alert(
      "保存できました！"
    );


    /*
     * alertを閉じた直後
     */
    await resumeCameraAfterSave();


    /*
     * ギャラリーも更新
     */
    loadGallery(
      true
    );


  } catch (error) {

    hideLoading();

    console.error(error);

    alert(
      "保存に失敗しました\n\n" +
      error.message
    );


    /*
     * エラー時もカメラを復帰
     */
    await resumeCameraAfterSave();
  }
}


/*************************************************
 * 保存後カメラ復帰
 *
 * ★今回の重要修正
 *************************************************/

async function resumeCameraAfterSave() {

  try {

    /*
     * 最新設定を確認
     */
    const latest =
      await jsonp({
        action:
          "settings"
      });


    if (
      !latest.success ||
      !latest.cameraEnabled
    ) {

      disableCamera();

      return;
    }


    settings =
      latest;


    /*
     * カメラが止まっている場合のみ
     * 再起動
     */
    if (
      !cameraStream ||
      cameraStream
        .getVideoTracks()
        .every(
          track =>
            track.readyState ===
            "ended"
        )
    ) {

      await startCamera();

    } else {

      /*
       * 念のため映像を再生
       */
      try {

        await camera.play();

      } catch (error) {

        await startCamera();
      }
    }


  } catch (error) {

    console.error(
      "カメラ復帰エラー",
      error
    );


    /*
     * GAS確認に失敗しても
     * 可能ならカメラを復帰
     */
    try {

      await startCamera();

    } catch (e) {

      console.error(e);
    }
  }
}


/*************************************************
 * Base64
 *************************************************/

function blobToBase64(blob) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => resolve(
          reader.result
        );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


/*************************************************
 * Base64 → Uint8Array
 *************************************************/

function base64ToUint8Array(
  base64
) {

  const binary =
    atob(base64);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }


  return bytes;
}


/*************************************************
 * Uint8Array → Base64
 *************************************************/

function uint8ArrayToBase64(
  bytes
) {

  let binary = "";


  const chunkSize = 8192;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    binary += String.fromCharCode(
      ...bytes.subarray(
        i,
        Math.min(
          i + chunkSize,
          bytes.length
        )
      )
    );
  }


  return btoa(
    binary
  );
}


/*************************************************
 * POSTチャンク
 *
 * hidden iframeを使用
 *************************************************/

function postChunk(
  uploadId,
  chunkIndex,
  totalChunks,
  data
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.name =
        "uploadFrame_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        GAS_URL;

      form.target =
        iframe.name;


      const fields = {

        action:
          "chunk",

        uploadId:
          uploadId,

        chunkIndex:
          chunkIndex,

        totalChunks:
          totalChunks,

        data:
          data
      };


      Object.entries(
        fields
      ).forEach(
        ([name, value]) => {

          const input =
            document.createElement(
              "input"
            );

          input.type =
            "hidden";

          input.name =
            name;

          input.value =
            value;

          form.appendChild(
            input
          );
        }
      );


      document.body.appendChild(
        form
      );


      let finished =
        false;


      const cleanup =
        () => {

          form.remove();

          iframe.remove();
        };


      iframe.onload =
        () => {

          if (finished) {
            return;
          }


          finished =
            true;

          cleanup();

          resolve();
        };


      iframe.onerror =
        () => {

          if (finished) {
            return;
          }


          finished =
            true;

          cleanup();

          reject(
            new Error(
              "チャンク送信に失敗しました"
            )
          );
        };


      form.submit();


      /*
       * iframe onloadが発火しない環境対策
       */
      setTimeout(() => {

        if (finished) {
          return;
        }


        finished =
          true;

        cleanup();

        resolve();

      }, 12000);

    }
  );
}


/*************************************************
 * アップロード完了確認
 *************************************************/

async function waitForUploadCompletion(
  uploadId,
  totalChunks
) {

  /*
   * チャンク処理がDrive側で
   * 完了するまで少し待つ
   */
  await sleep(1200);


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const status =
      await jsonp({

        action:
          "status",

        uploadId:
          uploadId
      });


    /*
     * upload情報が消えた
     *
     * → 完成している可能性が高い
     */
    if (
      !status.success
    ) {

      return true;
    }


    if (
      Number(
        status.chunks || 0
      ) >= totalChunks
    ) {

      await sleep(1000);

      return true;
    }


    await sleep(1000);
  }


  return true;
}


/*************************************************
 * 待機
 *************************************************/

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


/*************************************************
 * 日付
 *************************************************/

function formatDate(
  date
) {

  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const d =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const h =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const min =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const s =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    m +
    d +
    "_" +
    h +
    min +
    s
  );
}

async function toggleTorch() {

  if (!cameraStream) {
    return;
  }


  const track =
    cameraStream
      .getVideoTracks()[0];


  if (!track) {
    return;
  }


  const capabilities =
    track.getCapabilities
      ? track.getCapabilities()
      : {};


  if (!capabilities.torch) {

    showError(
      "このカメラはライト操作に対応していません"
    );

    return;
  }


  torchEnabled =
    !torchEnabled;


  try {

    await track.applyConstraints({

      advanced: [
        {
          torch:
            torchEnabled
        }
      ]

    });

  } catch (error) {

    console.error(error);
  }
}

 *************************************************/

camera.addEventListener(
  "click",
  async event => {

    if (!cameraStream) {
      return;
    }


    const rect =
      camera.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    const focusBox =
      document.getElementById(
        "focusBox"
      );


    focusBox.style.left =
      x + "px";

    focusBox.style.top =
      y + "px";

    focusBox.style.display =
      "block";


    setTimeout(() => {

      focusBox.style.display =
        "none";

    }, 1000);


    const track =
      cameraStream
        .getVideoTracks()[0];


    if (!track) {
      return;
    }


    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    if (
      capabilities.focusMode
    ) {

      try {

        await track.applyConstraints({

          advanced: [

            {
              focusMode:
                "continuous"
            }

          ]

        });

      } catch (error) {

        console.log(error);
      }
    }

  }
);

async function loadGallery(
  silent = false
) {

  try {

    if (!silent) {
      showLoading(
        "写真・動画を読み込んでいます..."
      );
    }


    const result =
      await jsonp({

        action:
          "list",

        deviceId:
          getDeviceId()
      });


    if (!result.success) {

      throw new Error(
        result.error ||
        "ギャラリー取得失敗"
      );
    }


    mediaList =
      result.files || [];


    renderGallery();


    if (!silent) {
      hideLoading();
    }


  } catch (error) {

    hideLoading();

    showError(
      error.message
    );
  }

/*************************************************
 * ギャラリー表示
 *************************************************/

function renderGallery() {

  galleryGrid.innerHTML =
    "";


  let list =
    mediaList;


  if (
    currentFilter ===
    "mine"
  ) {

    list =
      mediaList.filter(
        item =>
          item.mine
      );
  }


  if (
    currentFilter ===
    "shared"
  ) {

    list =
      mediaList.filter(
        item =>
          !item.mine
      );
  }


  if (list.length === 0) {

    galleryGrid.innerHTML = `
      <div style="
        grid-column:1/-1;
        padding:50px 20px;
        text-align:center;
        color:#888;
      ">
        写真・動画がありません
      </div>
    `;

    return;
  }


  list.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "mediaCard";


      if (
        item.mimeType
          .startsWith(
            "image/"
          )
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          item.thumbnailUrl;


        img.loading =
          "lazy";


        card.appendChild(
          img
        );

      } else {

        const video =
          document.createElement(
            "div"
          );


        video.className =
          "videoPlaceholder";


        video.textContent =
          "🎥";


        card.appendChild(
          video
        );
      }


      if (item.mine) {

        const mine =
          document.createElement(
            "div"
          );


        mine.className =
          "mediaMine";


        mine.textContent =
          "自分";


        card.appendChild(
          mine
        );
      }


      card.addEventListener(
        "click",
        () => {

          openPreview(
            item
          );

        }
      );


      galleryGrid.appendChild(
        card
      );

    }
  );
}

        return;
      }


      const a =
        document.createElement(
          "a"
        );


      a.href =
        currentPreview.downloadUrl;


      a.download =
        currentPreview.name ||
        "media";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();

    }
  );


/*************************************************
 * 削除
 *************************************************/

document
  .getElementById(
    "deleteButton"
  )
  .addEventListener(
    "click",
    async () => {

      if (!currentPreview) {
        return;
      }


      if (
        !currentPreview.mine
      ) {

        return;
      }


      const ok =
        confirm(
          "この写真・動画を削除しますか？"
        );


      if (!ok) {
        return;
      }


      try {

        showLoading(
          "削除しています..."
        );


        const result =
          await postDelete(
            currentPreview.id
          );


        if (
          !result.success
        ) {

          throw new Error(
            result.error ||
            "削除に失敗しました"
          );
        }


        hideLoading();


        alert(
          "削除しました"
        );


        previewPage.style.display =
          "none";


        await loadGallery(
          true
        );


        /*
         * ★削除後もカメラを維持
         */
        await resumeCameraAfterSave();


      } catch (error) {

        hideLoading();

        alert(
          "削除に失敗しました\n\n" +
          error.message
        );

      }

    }
  );


/*************************************************
 * 削除POST
 *************************************************/

function postDelete(
  fileId
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.name =
        "deleteFrame_" +
        Date.now();


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        GAS_URL;

      form.target =
        iframe.name;


      const fields = {

        action:
          "delete",

        fileId:
          fileId,

        deviceId:
          getDeviceId()
      };


      Object.entries(
        fields
      ).forEach(
        ([name, value]) => {

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "hidden";

          input.name =
            name;

          input.value =
            value;


          form.appendChild(
            input
          );

        }
      );


      document.body.appendChild(
        form
      );


      iframe.onload =
        () => {

          form.remove();

          iframe.remove();

          resolve({
            success: true
          });

        };


      iframe.onerror =
        () => {

          form.remove();

          iframe.remove();

          reject(
            new Error(
              "削除通信に失敗しました"
            )
          );

        };


      form.submit();

    }
  );
}


/*************************************************
 * ページ復帰
 *
 * スマホで別画面に行って戻った場合
 *************************************************/

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      if (
        !mediaRecorder ||
        mediaRecorder.state !==
          "recording"
      ) {

        await resumeCameraAfterSave();
      }
    }
  }
);


/*************************************************
 * 初期化
 *************************************************/

async function init() {

  if (
    !GAS_URL ||
    GAS_URL.includes(
      "ここにGAS"
    )
  ) {

    alert(
      "GAS_URLを設定してください"
    );

    return;
  }


  const enabled =
    await loadSettings();


  if (!enabled) {
    return;
  }


  await startCamera();

}


init();

</script>
