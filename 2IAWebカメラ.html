<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>GAS Smart Camera</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;

  color: white;
}

body {

  display: flex;

  justify-content: center;

  align-items: center;

}

#app {

  position: relative;

  width: 100%;
  height: 100%;

  background: #000;

  overflow: hidden;

}


/* =====================================================
   カメラ
===================================================== */

#camera {

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #000;

  transform-origin: center center;

}


/* =====================================================
   上部
===================================================== */

#topBar {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;

  min-height: 60px;

  padding:
    10px 15px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  background:
    linear-gradient(
      rgba(0,0,0,.75),
      rgba(0,0,0,0)
    );

  z-index: 20;

}

#title {

  font-size: 18px;

  font-weight: bold;

}

#cameraStatus {

  padding:
    6px 10px;

  border-radius: 20px;

  background:
    rgba(0,0,0,.55);

  font-size: 13px;

}


/* =====================================================
   サイドボタン
===================================================== */

#sideControls {

  position: absolute;

  right: 12px;
  top: 85px;

  display: flex;

  flex-direction:
    column;

  gap: 10px;

  z-index: 30;

}

.sideButton {

  width: 48px;
  height: 48px;

  border: none;

  border-radius: 50%;

  background:
    rgba(0,0,0,.55);

  color: white;

  font-size: 21px;

}


/* =====================================================
   ズーム
===================================================== */

#zoomBox {

  position: absolute;

  left: 50%;
  bottom: 155px;

  transform:
    translateX(-50%);

  width: 80%;

  max-width: 400px;

  padding:
    8px 15px;

  border-radius: 30px;

  background:
    rgba(0,0,0,.5);

  display: flex;

  align-items: center;

  gap: 10px;

  z-index: 20;

}

#zoomSlider {

  flex: 1;

}

#zoomValue {

  width: 45px;

  text-align: center;

}


/* =====================================================
   モード
===================================================== */

#modeBox {

  position: absolute;

  left: 50%;
  bottom: 95px;

  transform:
    translateX(-50%);

  display: flex;

  gap: 10px;

  z-index: 20;

}

.modeButton {

  padding:
    10px 20px;

  border: none;

  border-radius: 25px;

  background:
    rgba(0,0,0,.55);

  color: white;

  font-size: 14px;

}

.modeButton.active {

  background: white;

  color: black;

  font-weight: bold;

}


/* =====================================================
   シャッター
===================================================== */

#shutter {

  position: absolute;

  left: 50%;
  bottom: 18px;

  transform:
    translateX(-50%);

  width: 75px;
  height: 75px;

  border-radius: 50%;

  border:
    6px solid white;

  background: transparent;

  z-index: 20;

}

#shutter::after {

  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 57px;
  height: 57px;

  transform:
    translate(-50%,-50%);

  border-radius: 50%;

  background: white;

}

#shutter.recording {

  border-color: red;

}

#shutter.recording::after {

  width: 30px;
  height: 30px;

  border-radius: 7px;

  background: red;

}


/* =====================================================
   録画情報
===================================================== */

#recordInfo {

  position: absolute;

  top: 75px;
  left: 50%;

  transform:
    translateX(-50%);

  z-index: 30;

  display: none;

  gap: 10px;

  padding:
    8px 15px;

  border-radius: 20px;

  background:
    rgba(180,0,0,.8);

}

#recordDot {

  width: 10px;
  height: 10px;

  background: red;

  border-radius: 50%;

}


/* =====================================================
   ステータス
===================================================== */

#status {

  position: absolute;

  left: 50%;
  bottom: 115px;

  transform:
    translateX(-50%);

  z-index: 50;

  padding:
    9px 16px;

  border-radius: 20px;

  background:
    rgba(0,0,0,.75);

  font-size: 13px;

  text-align: center;

  display: none;

}


/* =====================================================
   スタート画面
===================================================== */

#startScreen {

  position: absolute;

  inset: 0;

  z-index: 100;

  background: #111;

  display: flex;

  flex-direction:
    column;

  justify-content:
    center;

  align-items:
    center;

  text-align: center;

}

#startButton {

  padding:
    15px 35px;

  border: none;

  border-radius: 30px;

  background: white;

  color: black;

  font-size: 16px;

  font-weight: bold;

}


/* =====================================================
   エラー
===================================================== */

#errorScreen {

  position: absolute;

  inset: 0;

  z-index: 200;

  background: #111;

  display: none;

  flex-direction:
    column;

  justify-content:
    center;

  align-items:
    center;

  text-align: center;

  padding: 25px;

}


/* =====================================================
   ギャラリー
===================================================== */

#gallery {

  position: absolute;

  inset: 0;

  z-index: 500;

  background:
    #101010;

  display: none;

  overflow-y: auto;

  padding-bottom: 80px;

}


/* ギャラリーヘッダー */

#galleryHeader {

  position: sticky;

  top: 0;

  z-index: 10;

  padding:
    15px;

  background:
    rgba(20,20,20,.95);

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  backdrop-filter:
    blur(10px);

}

#galleryTitle {

  font-size: 20px;

  font-weight: bold;

}

.galleryHeaderButton {

  border: none;

  border-radius: 20px;

  padding:
    8px 14px;

  background:
    #333;

  color: white;

}


/* ギャラリー一覧 */

#galleryGrid {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(
        160px,
        1fr
      )
    );

  gap: 10px;

  padding: 10px;

}


/* メディアカード */

.mediaCard {

  position: relative;

  overflow: hidden;

  border-radius: 12px;

  background: #222;

  aspect-ratio: 1 / 1;

  cursor: pointer;

}

.mediaCard img {

  width: 100%;
  height: 100%;

  object-fit: cover;

}

.mediaCard video {

  width: 100%;
  height: 100%;

  object-fit: cover;

}


/* 動画マーク */

.videoMark {

  position: absolute;

  left: 10px;
  bottom: 10px;

  padding:
    5px 8px;

  border-radius: 15px;

  background:
    rgba(0,0,0,.75);

}


/* ファイル情報 */

.mediaInfo {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  padding:
    8px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.9)
    );

  font-size: 11px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* =====================================================
   全画面プレビュー
===================================================== */

#viewer {

  position: fixed;

  inset: 0;

  z-index: 1000;

  background:
    rgba(0,0,0,.96);

  display: none;

  align-items:
    center;

  justify-content:
    center;

  flex-direction:
    column;

}

#viewerContent {

  width: 95%;

  height: 85%;

  display: flex;

  justify-content:
    center;

  align-items:
    center;

}

#viewer img {

  max-width: 100%;
  max-height: 100%;

  object-fit: contain;

}

#viewer iframe {

  width: 100%;
  height: 100%;

  border: none;

  border-radius: 10px;

}

#viewerClose {

  position: absolute;

  top: 15px;
  right: 15px;

  width: 45px;
  height: 45px;

  border: none;

  border-radius: 50%;

  background:
    rgba(255,255,255,.15);

  color: white;

  font-size: 24px;

}

#viewerOpenDrive {

  margin-top: 10px;

  padding:
    10px 20px;

  border: none;

  border-radius: 25px;

  background: white;

  color: black;

}


/* =====================================================
   ギャラリー戻る
===================================================== */

#galleryBack {

  border: none;

  padding:
    8px 15px;

  border-radius: 20px;

  background: #333;

  color: white;

}


/* =====================================================
   スマホ
===================================================== */

@media (max-width: 600px) {

  #galleryGrid {

    grid-template-columns:
      repeat(
        2,
        1fr
      );

  }

}

</style>

</head>


<body>

<div id="app">


<!-- ===================================================
     カメラ
=================================================== -->

<video id="camera"
       autoplay
       muted
       playsinline></video>


<!-- ===================================================
     上部
=================================================== -->

<div id="topBar">

  <div id="title">
    📷 GAS Smart Camera
  </div>

  <div id="cameraStatus">
    未開始
  </div>

</div>


<!-- ===================================================
     サイドボタン
=================================================== -->

<div id="sideControls">

  <button
    id="switchCamera"
    class="sideButton">
    🔄
  </button>

  <button
    id="galleryButton"
    class="sideButton">
    🖼️
  </button>

</div>


<!-- ===================================================
     録画情報
=================================================== -->

<div id="recordInfo">

  <span id="recordDot">
  </span>

  <span id="recordTime">
    00:00
  </span>

  <span id="recordSize">
    0.00MB
  </span>

</div>


<!-- ===================================================
     ズーム
=================================================== -->

<div id="zoomBox">

  <span>−</span>

  <input
    id="zoomSlider"
    type="range"
    min="1"
    max="5"
    step="0.1"
    value="1">

  <span>＋</span>

  <span id="zoomValue">
    1.0x
  </span>

</div>


<!-- ===================================================
     モード
=================================================== -->

<div id="modeBox">

  <button
    id="photoMode"
    class="modeButton active">
    📷 写真
  </button>

  <button
    id="videoMode"
    class="modeButton">
    🎥 動画
  </button>

</div>


<!-- ===================================================
     シャッター
=================================================== -->

<button id="shutter">
</button>


<!-- ===================================================
     ステータス
=================================================== -->

<div id="status">
</div>


<!-- ===================================================
     スタート
=================================================== -->

<div id="startScreen">

  <h1>
    📷 GAS Smart Camera
  </h1>

  <p>
    カメラを使用するには<br>
    「カメラを開始」を押してください。
  </p>

  <button id="startButton">
    カメラを開始
  </button>

</div>


<!-- ===================================================
     エラー
=================================================== -->

<div id="errorScreen">

  <h2>
    ⚠️ カメラエラー
  </h2>

  <p id="errorMessage">
  </p>

  <button id="retryButton">
    再試行
  </button>

</div>


<!-- ===================================================
     ギャラリー
=================================================== -->

<div id="gallery">

  <div id="galleryHeader">

    <button
      id="galleryBack">
      ← カメラ
    </button>

    <div id="galleryTitle">
      🖼️ ギャラリー
    </div>

    <button
      id="refreshGallery"
      class="galleryHeaderButton">
      🔄 更新
    </button>

  </div>


  <div id="galleryGrid">
  </div>

</div>


<!-- ===================================================
     プレビュー
=================================================== -->

<div id="viewer">

  <button id="viewerClose">
    ×
  </button>

  <div id="viewerContent">
  </div>

  <button id="viewerOpenDrive">
    Google Driveで開く
  </button>

</div>


</div>


<script>

/* =====================================================
   GAS URL
===================================================== */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzcCFGKuaktZX1qrR9cAegRarA3N4EUhT2J6SVwaBZjaUEKiMKMiSaLDNclkn4TXqRx4Q/exec";


/* =====================================================
   15MB
===================================================== */

const MAX_FILE_SIZE =
  15 * 1024 * 1024;

const AUTO_STOP_SIZE =
  14 * 1024 * 1024;


/* =====================================================
   DOM
===================================================== */

const camera =
  document.getElementById("camera");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const errorScreen =
  document.getElementById("errorScreen");

const errorMessage =
  document.getElementById("errorMessage");

const retryButton =
  document.getElementById("retryButton");

const shutter =
  document.getElementById("shutter");

const photoMode =
  document.getElementById("photoMode");

const videoMode =
  document.getElementById("videoMode");

const switchCamera =
  document.getElementById("switchCamera");

const zoomSlider =
  document.getElementById("zoomSlider");

const zoomValue =
  document.getElementById("zoomValue");

const status =
  document.getElementById("status");

const cameraStatus =
  document.getElementById("cameraStatus");

const recordInfo =
  document.getElementById("recordInfo");

const recordTime =
  document.getElementById("recordTime");

const recordSize =
  document.getElementById("recordSize");

const gallery =
  document.getElementById("gallery");

const galleryButton =
  document.getElementById("galleryButton");

const galleryBack =
  document.getElementById("galleryBack");

const galleryGrid =
  document.getElementById("galleryGrid");

const refreshGallery =
  document.getElementById("refreshGallery");

const viewer =
  document.getElementById("viewer");

const viewerContent =
  document.getElementById("viewerContent");

const viewerClose =
  document.getElementById("viewerClose");

const viewerOpenDrive =
  document.getElementById("viewerOpenDrive");


/* =====================================================
   変数
===================================================== */

let stream = null;

let currentFacingMode =
  "environment";

let currentMode =
  "photo";

let mediaRecorder =
  null;

let recordedChunks =
  [];

let recordingStartTime =
  0;

let timerInterval =
  null;

let currentZoom =
  1;

let autoStopped =
  false;

let currentViewerUrl =
  "";


/* =====================================================
   ステータス
===================================================== */

function showStatus(
  message,
  duration = 3000
) {

  status.textContent =
    message;

  status.style.display =
    "block";


  if (duration > 0) {

    setTimeout(() => {

      status.style.display =
        "none";

    }, duration);

  }

}


/* =====================================================
   MB
===================================================== */

function formatMB(bytes) {

  return (
    bytes /
    1024 /
    1024
  ).toFixed(2);

}


/* =====================================================
   カメラ
===================================================== */

async function startCamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              currentFacingMode,

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: true

        });


    camera.srcObject =
      stream;


    await camera.play();


    startScreen.style.display =
      "none";

    errorScreen.style.display =
      "none";


    cameraStatus.textContent =
      currentFacingMode ===
      "environment"
        ? "背面カメラ"
        : "前面カメラ";


  } catch (error) {

    console.error(error);


    errorScreen.style.display =
      "flex";


    errorMessage.textContent =
      error.message;

  }

}


/* =====================================================
   カメラ切り替え
===================================================== */

switchCamera.onclick =
  async () => {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
      "recording"
    ) {

      showStatus(
        "録画中は切り替えできません。"
      );

      return;

    }


    currentFacingMode =
      currentFacingMode ===
      "environment"
        ? "user"
        : "environment";


    await startCamera();

  };


/* =====================================================
   モード
===================================================== */

photoMode.onclick =
  () => {

    currentMode =
      "photo";

    photoMode.classList.add(
      "active"
    );

    videoMode.classList.remove(
      "active"
    );

  };


videoMode.onclick =
  () => {

    currentMode =
      "video";

    videoMode.classList.add(
      "active"
    );

    photoMode.classList.remove(
      "active"
    );

  };


/* =====================================================
   シャッター
===================================================== */

shutter.onclick =
  () => {

    if (
      currentMode ===
      "photo"
    ) {

      takePhoto();

    } else {

      toggleRecording();

    }

  };


/* =====================================================
   写真
===================================================== */

function takePhoto() {

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    blob => {

      uploadBlob(
        blob,
        "IMG_" +
        Date.now() +
        ".jpg",
        "image/jpeg"
      );

    },
    "image/jpeg",
    0.92
  );

}


/* =====================================================
   MIME
===================================================== */

function getSupportedMimeType() {

  const types = [

    "video/mp4;codecs=avc1",

    "video/mp4",

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  for (
    const type of types
  ) {

    if (
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;

    }

  }


  return "";

}


/* =====================================================
   録画
===================================================== */

function toggleRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state ===
    "recording"
  ) {

    stopRecording(false);

  } else {

    startRecording();

  }

}


/* =====================================================
   録画開始
===================================================== */

function startRecording() {

  const mimeType =
    getSupportedMimeType();


  if (!mimeType) {

    showStatus(
      "録画に対応していません。"
    );

    return;

  }


  recordedChunks =
    [];

  autoStopped =
    false;


  mediaRecorder =
    new MediaRecorder(
      stream,
      {

        mimeType:

          mimeType,

        videoBitsPerSecond:

          2000000,

        audioBitsPerSecond:

          96000

      }
    );


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );


        const size =
          recordedChunks.reduce(
            (
              total,
              chunk
            ) =>
              total +
              chunk.size,
            0
          );


        recordSize.textContent =
          formatMB(size) +
          "MB";


        /*
          14MBで自動停止
        */

        if (
          size >=
          AUTO_STOP_SIZE
        ) {

          autoStopped =
            true;


          showStatus(
            "⚠️ 15MBに近づいたため自動停止します。",
            5000
          );


          stopRecording(true);

        }

      }

    };


  mediaRecorder.onstop =
    finishRecording;


  mediaRecorder.start(
    1000
  );


  recordingStartTime =
    Date.now();


  recordInfo.style.display =
    "flex";


  shutter.classList.add(
    "recording"
  );


  timerInterval =
    setInterval(
      () => {

        const seconds =
          Math.floor(
            (
              Date.now() -
              recordingStartTime
            ) / 1000
          );


        const min =
          String(
            Math.floor(
              seconds / 60
            )
          ).padStart(
            2,
            "0"
          );


        const sec =
          String(
            seconds % 60
          ).padStart(
            2,
            "0"
          );


        recordTime.textContent =
          min +
          ":" +
          sec;

      },
      250
    );

}


/* =====================================================
   録画停止
===================================================== */

function stopRecording(
  isAutoStop
) {

  if (
    !mediaRecorder ||
    mediaRecorder.state !==
    "recording"
  ) {

    return;

  }


  if (isAutoStop) {

    autoStopped =
      true;

  }


  mediaRecorder.stop();


  clearInterval(
    timerInterval
  );

}


/* =====================================================
   録画終了
===================================================== */

function finishRecording() {

  const mimeType =
    mediaRecorder.mimeType;


  const blob =
    new Blob(
      recordedChunks,
      {
        type:
          mimeType
      }
    );


  recordInfo.style.display =
    "none";


  shutter.classList.remove(
    "recording"
  );


  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    showStatus(
      "⚠️ 15MBを超えたため保存しませんでした。",
      5000
    );

    return;

  }


  const extension =
    mimeType.includes("mp4")
      ? ".mp4"
      : ".webm";


  const fileName =
    "VID_" +
    Date.now() +
    extension;


  uploadBlob(
    blob,
    fileName,
    mimeType
  );


  recordedChunks =
    [];

  mediaRecorder =
    null;

}


/* =====================================================
   アップロード
===================================================== */

async function uploadBlob(
  blob,
  fileName,
  mimeType
) {

  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    showStatus(
      "15MBを超えているため保存できません。",
      5000
    );

    return;

  }


  showStatus(
    "☁ Google Driveへ保存中...",
    0
  );


  try {

    const base64 =
      await blobToBase64(
        blob
      );


    const data =
      new URLSearchParams();


    data.append(
      "base64Data",
      base64
    );


    data.append(
      "fileName",
      fileName
    );


    data.append(
      "mimeType",
      mimeType
    );


    await fetch(
      GAS_URL,
      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"

        },

        body:
          data.toString()

      }
    );


    showStatus(
      "✅ Google Driveへ保存しました。",
      4000
    );


  } catch (error) {

    console.error(
      error
    );


    showStatus(
      "❌ 保存に失敗しました。",
      5000
    );

  }

}


/* =====================================================
   Base64
===================================================== */

function blobToBase64(
  blob
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onloadend =
        () => {

          resolve(
            reader.result
              .split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}

/* =====================================================
   Drive一覧取得
===================================================== */

function loadGallery() {

  return new Promise(
    resolve => {

      galleryGrid.innerHTML =
        "<p style='padding:20px'>読み込み中...</p>";


      const callbackName =
        "galleryCallback_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      window[callbackName] =
        function(data) {

          try {

            renderGallery(
              data
            );

          } catch (error) {

            console.error(
              error
            );

            galleryGrid.innerHTML =
              "<p style='padding:20px'>読み込みに失敗しました。</p>";

          }


          script.remove();

          delete window[
            callbackName
          ];

          resolve();

        };


      script.src =
        GAS_URL +
        "?action=files" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   ギャラリー表示
===================================================== */

function renderGallery(
  data
) {

  galleryGrid.innerHTML =
    "";


  if (
    !data ||
    !data.success
  ) {

    galleryGrid.innerHTML =
      `
      <p style="padding:20px">
        ⚠️
        ${
          data &&
          data.message
            ? data.message
            : "読み込みに失敗しました。"
        }
      </p>
      `;

    return;

  }


  if (
    !data.files ||
    data.files.length === 0
  ) {

    galleryGrid.innerHTML =
      `
      <div style="
        padding:30px;
        text-align:center;
        width:100%;
        grid-column:1/-1;
      ">
        📷<br><br>
        写真・動画がありません。
      </div>
      `;

    return;

  }


  data.files.forEach(
    file => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "mediaCard";


      if (
        file.type ===
        "image"
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          file.imageUrl;


        img.loading =
          "lazy";


        img.alt =
          file.name;


        card.appendChild(
          img
        );


      } else {

        /*
          Google Driveの
          プレビューを
          サムネイルとして表示
        */

        const iframe =
          document.createElement(
            "iframe"
          );


        iframe.src =
          file.previewUrl;


        iframe.style.width =
          "100%";

        iframe.style.height =
          "100%";

        iframe.style.border =
          "none";

        iframe.style.pointerEvents =
          "none";


        card.appendChild(
          iframe
        );


        const mark =
          document.createElement(
            "div"
          );


        mark.className =
          "videoMark";


        mark.textContent =
          "▶ 動画";


        card.appendChild(
          mark
        );

      }


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "mediaInfo";


      info.textContent =
        file.name +
        "　" +
        file.sizeMB +
        "MB";


      card.appendChild(
        info
      );


      card.onclick =
        () => {

          openViewer(
            file
          );

        };


      galleryGrid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   プレビュー
===================================================== */

function openViewer(
  file
) {

  viewerContent.innerHTML =
    "";


  currentViewerUrl =
    file.viewUrl;


  if (
    file.type ===
    "image"
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.src =
      file.imageUrl;


    img.alt =
      file.name;


    viewerContent.appendChild(
      img
    );


  } else {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.src =
      file.previewUrl;


    iframe.allow =
      "autoplay";


    viewerContent.appendChild(
      iframe
    );

  }


  viewer.style.display =
    "flex";

}

   プレビュー閉じる
===================================================== */

viewerClose.onclick =

    viewer.style.display =

    viewerContent.innerHTML =

);
