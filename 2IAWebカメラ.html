<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>共有カメラ</title>


<style>

/* =========================================
   基本
========================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}

button {

    border: none;

    color: white;

    background: transparent;

    cursor: pointer;

    font: inherit;

}

button:active {

    transform: scale(.94);

}


/* =========================================
   アプリ
========================================= */

#app {

    width: 100vw;

    height: 100dvh;

    position: relative;

    background: #000;

    overflow: hidden;

}


/* =========================================
   カメラ
========================================= */

#cameraScreen {

    position: absolute;

    inset: 0;

    background: #000;

}


#video {

    width: 100%;

    height: 100%;

    object-fit: cover;

    background: #000;

}


/* =========================================
   上部
========================================= */

.topBar {

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    z-index: 20;

    padding:
        calc(env(safe-area-inset-top) + 12px)
        18px
        12px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background:
        linear-gradient(
            rgba(0,0,0,.65),
            transparent
        );

}


.topLeft,
.topRight {

    display: flex;

    align-items: center;

    gap: 10px;

}


.iconButton {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.42);

    backdrop-filter:
        blur(10px);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 20px;

}


/* =========================================
   録画表示
========================================= */

#recording {

    display: none;

    align-items: center;

    gap: 8px;

    background:
        rgba(0,0,0,.65);

    padding: 7px 12px;

    border-radius: 20px;

    font-size: 14px;

}


#recording.active {

    display: flex;

}


.recordDot {

    width: 10px;

    height: 10px;

    background: red;

    border-radius: 50%;

    animation:
        blink 1s infinite;

}


@keyframes blink {

    50% {
        opacity: .3;
    }

}


/* =========================================
   フォーカス
========================================= */

#focusBox {

    position: absolute;

    width: 55px;

    height: 55px;

    border: 2px solid #ffd400;

    border-radius: 8px;

    transform:
        translate(-50%, -50%)
        scale(.8);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .2s,
        transform .2s;

    z-index: 10;

}


#focusBox.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);

}


/* =========================================
   ズーム
========================================= */

.zoomArea {

    position: absolute;

    right: 18px;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 20;

    display: flex;

    flex-direction: column;

    gap: 8px;

}


.zoomButton {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.45);

    backdrop-filter:
        blur(10px);

    font-size: 13px;

}


/* =========================================
   下部操作
========================================= */

.bottomArea {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 20;

    padding:
        15px
        18px
        calc(env(safe-area-inset-bottom) + 18px);

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );

}


/* =========================================
   モード
========================================= */

.modeSelector {

    display: flex;

    justify-content: center;

    gap: 28px;

    margin-bottom: 18px;

}


.mode {

    font-size: 14px;

    color: #aaa;

}


.mode.active {

    color: white;

    font-weight: bold;

}


/* =========================================
   シャッター
========================================= */

.captureRow {

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    min-height: 90px;

}


.captureButton {

    width: 78px;

    height: 78px;

    border-radius: 50%;

    background: white;

    border: 5px solid
        rgba(255,255,255,.5);

    box-shadow:
        0 0 0 3px
        rgba(0,0,0,.45);

}


.captureButton.videoMode {

    border-color: #ff3030;

}


.captureButton.videoMode.recording {

    background: #ff3030;

}


.galleryButton {

    position: absolute;

    left: 20px;

    width: 55px;

    height: 55px;

    border-radius: 12px;

    overflow: hidden;

    background: #222;

    border: 2px solid #fff;

}


.galleryButton img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* =========================================
   ギャラリー
========================================= */

#galleryPanel {

    position: absolute;

    inset: 0;

    z-index: 100;

    background:
        rgba(0,0,0,.96);

    display: none;

    flex-direction: column;

}


#galleryPanel.show {

    display: flex;

}


.galleryHeader {

    padding:
        calc(env(safe-area-inset-top) + 12px)
        16px
        12px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        1px solid #222;

}


.galleryTitle {

    font-size: 20px;

    font-weight: bold;

}


.galleryTabs {

    display: flex;

    gap: 8px;

    padding: 12px 16px;

}


.tab {

    padding: 8px 16px;

    border-radius: 20px;

    background: #222;

    color: #aaa;

}


.tab.active {

    background: #fff;

    color: #000;

}


#gallery {

    flex: 1;

    overflow-y: auto;

    padding: 8px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 5px;

    align-content: start;

}


.mediaItem {

    aspect-ratio: 1;

    background: #151515;

    position: relative;

    overflow: hidden;

    border-radius: 5px;

}


.mediaItem img,
.mediaItem video {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


.mediaItem .videoIcon {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #111,
            #333
        );

}


.mineMark {

    position: absolute;

    top: 5px;

    right: 5px;

    background:
        rgba(0,0,0,.65);

    border-radius: 10px;

    padding: 3px 7px;

    font-size: 10px;

}


/* =========================================
   プレビュー
========================================= */

#preview {

    position: absolute;

    inset: 0;

    z-index: 200;

    background: #000;

    display: none;

    flex-direction: column;

}


#preview.show {

    display: flex;

}


.previewHeader {

    padding:
        calc(env(safe-area-inset-top) + 10px)
        15px
        10px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


#previewContent {

    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


#previewContent img,
#previewContent video {

    max-width: 100%;

    max-height: 100%;

    object-fit: contain;

}


.previewBottom {

    padding:
        15px
        15px
        calc(env(safe-area-inset-bottom) + 15px);

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

}


.actionButton {

    padding: 12px 18px;

    border-radius: 25px;

    background: #222;

}


.actionButton.primary {

    background: white;

    color: black;

}


.actionButton.danger {

    background: #a00;

}


/* =========================================
   アップロード
========================================= */

#uploadStatus {

    position: absolute;

    left: 50%;

    bottom: 120px;

    transform:
        translateX(-50%);

    z-index: 300;

    width: min(340px, 90vw);

    padding: 15px;

    border-radius: 15px;

    background:
        rgba(20,20,20,.95);

    display: none;

}


#uploadStatus.show {

    display: block;

}


.progress {

    height: 6px;

    background: #333;

    border-radius: 10px;

    overflow: hidden;

    margin-top: 10px;

}


#progressBar {

    width: 0%;

    height: 100%;

    background: white;

    transition: width .15s;

}


/* =========================================
   ローディング
========================================= */

#loading {

    position: absolute;

    inset: 0;

    z-index: 500;

    background:
        rgba(0,0,0,.8);

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 15px;

}


#loading.show {

    display: flex;

}


.spinner {

    width: 40px;

    height: 40px;

    border: 4px solid #444;

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin 1s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   PC
========================================= */

@media (min-width: 700px) {

    #gallery {

        grid-template-columns:
            repeat(6, 1fr);

        padding: 15px;

        gap: 8px;

    }

}


/* =========================================
   横画面
========================================= */

@media (orientation: landscape) {

    .bottomArea {

        padding-bottom:
            calc(
                env(safe-area-inset-bottom)
                + 10px
            );

    }


    .modeSelector {

        margin-bottom: 8px;

    }


    .captureButton {

        width: 65px;

        height: 65px;

    }

}

</style>

</head>

<script>

/* =================================================
   設定
================================================= */

const GAS_URL =
    "https://script.google.com/macros/s/AKfycbxYVLRQoKT2tE7s9xZ-29wDn4FkwuTZ5ARc_JxMWT8Fmy1iE_UT5XLQ1SlHudMt0_cz6A/exec";


const MAX_FILE_SIZE =
    20 * 1024 * 1024;


const CHUNK_SIZE =
    256 * 1024;


const MAX_RECORDING_TIME =
    60;


/* =================================================
   DOM
================================================= */

const video =
    document.getElementById("video");


const captureButton =
    document.getElementById(
        "captureButton"
    );


const recording =
    document.getElementById(
        "recording"
    );


const recordTime =
    document.getElementById(
        "recordTime"
    );


const galleryPanel =
    document.getElementById(
        "galleryPanel"
    );


const gallery =
    document.getElementById(
        "gallery"
    );


const preview =
    document.getElementById(
        "preview"
    );


const previewContent =
    document.getElementById(
        "previewContent"
    );


const uploadStatus =
    document.getElementById(
        "uploadStatus"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const uploadText =
    document.getElementById(
        "uploadText"
    );


const loading =
    document.getElementById(
        "loading"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


/* =================================================
   Device ID
================================================= */

let deviceId =
    localStorage.getItem(
        "shared_camera_device_id"
    );


if (!deviceId) {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        deviceId =
            crypto.randomUUID();

    } else {

        deviceId =
            "device_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .substring(2);

    }


    localStorage.setItem(
        "shared_camera_device_id",
        deviceId
    );

}


/* =================================================
   カメラ変数
================================================= */

let stream = null;

let facingMode =
    "environment";

let currentMode =
    "video";

let mediaRecorder =
    null;

let recordedChunks = [];

let recordingStartTime = 0;

let recordingTimer = null;

let currentZoom = 1;

let selectedMedia = null;

let currentFilter = "all";


/* =================================================
   JSONP GET
================================================= */

function gasGet(
    action,
    params = {}
) {

    return new Promise(
        (resolve, reject) => {

            const callbackName =
                "gasCallback_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2);


            const script =
                document.createElement(
                    "script"
                );


            const query =
                new URLSearchParams();


            query.set(
                "action",
                action
            );


            query.set(
                "callback",
                callbackName
            );


            Object.keys(params)
              .forEach(key => {

                query.set(
                    key,
                    params[key]
                );

              });


            const timer =
                setTimeout(
                    () => {

                        cleanup();

                        reject(
                            new Error(
                                "GAS通信がタイムアウトしました"
                            )
                        );

                    },
                    30000
                );


            window[callbackName] =
                function(data) {

                    clearTimeout(timer);

                    cleanup();

                    if (
                        data &&
                        data.success === false
                    ) {

                        reject(
                            new Error(
                                data.error ||
                                "GASエラー"
                            )
                        );

                        return;

                    }


                    resolve(data);

                };


            function cleanup() {

                delete window[
                    callbackName
                ];

                if (
                    script.parentNode
                ) {

                    script.parentNode
                      .removeChild(
                          script
                      );

                }

            }


            script.onerror =
                function() {

                    clearTimeout(timer);

                    cleanup();

                    reject(
                        new Error(
                            "GASへ接続できません"
                        )
                    );

                };


            script.src =
                GAS_URL +
                "?" +
                query.toString();


            document.body.appendChild(
                script
            );

        }
    );

}


/* =================================================
   POST
================================================= */

function gasPost(
    action,
    data
) {

    return new Promise(
        (resolve, reject) => {

            const iframe =
                document.createElement(
                    "iframe"
                );


            iframe.name =
                "gas_post_" +
                Date.now() +
                "_" +
                Math.random()
                  .toString(36)
                  .substring(2);


            iframe.style.display =
                "none";


            document.body.appendChild(
                iframe
            );


            const form =
                document.createElement(
                    "form"
                );


            form.method =
                "POST";


            form.action =
                GAS_URL;


            form.target =
                iframe.name;


            Object.keys(data)
              .forEach(key => {

                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "hidden";


                input.name =
                    key;


                input.value =
                    data[key];


                form.appendChild(
                    input
                );

              });


            const actionInput =
                document.createElement(
                    "input"
                );


            actionInput.type =
                "hidden";


            actionInput.name =
                "action";


            actionInput.value =
                action;


            form.appendChild(
                actionInput
            );


            document.body.appendChild(
                form
            );


            let finished = false;


            const timeout =
                setTimeout(
                    () => {

                        if (finished)
                            return;


                        finished = true;


                        cleanup();


                        reject(
                            new Error(
                                "アップロードがタイムアウトしました"
                            )
                        );

                    },
                    60000
                );


            iframe.onload =
                function() {

                    if (finished)
                        return;


                    finished = true;

                    clearTimeout(
                        timeout
                    );

                    cleanup();

                    resolve({
                        success: true
                    });

                };


            iframe.onerror =
                function() {

                    if (finished)
                        return;


                    finished = true;

                    clearTimeout(
                        timeout
                    );

                    cleanup();

                    reject(
                        new Error(
                            "POSTに失敗しました"
                        )
                    );

                };


            function cleanup() {

                if (form.parentNode)
                    form.parentNode
                        .removeChild(form);


                setTimeout(
                    () => {

                        if (
                            iframe.parentNode
                        ) {

                            iframe.parentNode
                                .removeChild(
                                    iframe
                                );

                        }

                    },
                    500
                );

            }


            form.submit();

        }
    );

}


/* =================================================
   カメラ開始
================================================= */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "このブラウザではカメラを利用できません。"
        );

        return;

    }


    if (stream) {

        stream
          .getTracks()
          .forEach(
              track =>
                track.stop()
          );

    }


    try {

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                facingMode
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: true

                });


        video.srcObject =
            stream;


        currentZoom = 1;


        applyZoom(1);


        updateTorchButton();


    } catch (error) {

        console.error(error);

        alert(
            "カメラを開始できませんでした。\n\n" +
            error.message
        );

    }

}


/* =================================================
   カメラ切替
================================================= */

document
  .getElementById("switchCamera")
  .addEventListener(
      "click",
      async () => {

          facingMode =
              facingMode ===
              "environment"
                  ? "user"
                  : "environment";


          await startCamera();

      }
  );


/* =================================================
   ライト
================================================= */

async function toggleTorch() {

    if (!stream)
        return;


    const track =
        stream
          .getVideoTracks()[0];


    if (!track)
        return;


    const capabilities =
        track.getCapabilities();


    if (!capabilities.torch) {

        alert(
            "このカメラはライト制御に対応していません。"
        );

        return;

    }


    const settings =
        track.getSettings();


    await track.applyConstraints({

        advanced: [

            {
                torch:
                    !settings.torch
            }

        ]

    });

}


document
  .getElementById("torchButton")
  .addEventListener(
      "click",
      toggleTorch
  );


function updateTorchButton() {

    const button =
        document.getElementById(
            "torchButton"
        );


    button.style.opacity =
        "1";

}


/* =================================================
   ズーム
================================================= */

function applyZoom(
    zoom
) {

    currentZoom =
        zoom;


    if (!stream)
        return;


    const track =
        stream
          .getVideoTracks()[0];


    if (!track)
        return;


    const capabilities =
        track.getCapabilities();


    if (
        capabilities.zoom
    ) {

        const actualZoom =
            Math.min(
                capabilities.zoom.max,
                Math.max(
                    capabilities.zoom.min,
                    zoom
                )
            );


        track.applyConstraints({

            advanced: [

                {
                    zoom:
                        actualZoom
                }

            ]

        }).catch(
            console.error
        );

    } else {

        video.style.transform =
            `scale(${zoom})`;

    }

}

/* =================================================
   写真撮影
================================================= */

async function takePhoto() {

    if (!video.videoWidth) {

        alert(
            "カメラが準備中です。"
        );

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(
        async blob => {

            if (!blob)
                return;


            const fileName =
                "photo_" +
                makeDateName() +
                ".jpg";


            await uploadFile(
                blob,
                fileName
            );

        },
        "image/jpeg",
        .92
    );

}


/* =================================================
   MP4 MIME判定
================================================= */

function getSupportedVideoMime() {

    const types = [

        "video/mp4;codecs=h264,aac",

        "video/mp4",

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    for (
        const type of types
    ) {

        if (
            window.MediaRecorder &&
            MediaRecorder.isTypeSupported(
                type
            )
        ) {

            return type;

        }

    }


    return "";

}


/* =================================================
   録画開始
================================================= */

function startRecording() {

    if (!stream) {

        alert(
            "カメラが起動していません。"
        );

        return;

    }


    recordedChunks = [];


    const mimeType =
        getSupportedVideoMime();


    if (!mimeType) {

        alert(
            "このブラウザでは動画録画に対応していません。"
        );

        return;

    }


    try {

        mediaRecorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:
                        mimeType
                }
            );


    } catch (error) {

        alert(
            "録画を開始できませんでした。"
        );

        return;

    }


    mediaRecorder.ondataavailable =
        event => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                recordedChunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop =
        async () => {

            clearInterval(
                recordingTimer
            );


            recording.classList.remove(
                "active"
            );


            captureButton.classList.remove(
                "recording"
            );


            const blob =
                new Blob(
                    recordedChunks,
                    {
                        type:
                            mimeType
                    }
                );


            if (
                blob.size >
                MAX_FILE_SIZE
            ) {

                alert(
                    "動画が20MBを超えたため保存できませんでした。"
                );

                return;

            }


            if (
                blob.size <= 0
            ) {

                return;

            }


            /*
             * MP4でない場合
             * MP4変換を試す
             */

            let uploadBlob =
                blob;


            let fileName =
                "video_" +
                makeDateName();


            if (
                mimeType
                    .toLowerCase()
                    .includes(
                        "mp4"
                    )
            ) {

                fileName +=
                    ".mp4";

            } else {

                /*
                 * MP4変換
                 */

                try {

                    showLoading(
                        "MP4へ変換中..."
                    );


                    const converted =
                        await convertToMP4(
                            blob
                        );


                    if (
                        converted &&
                        converted.size > 0
                    ) {

                        uploadBlob =
                            converted;

                    }


                } catch (error) {

                    console.warn(
                        "MP4変換失敗",
                        error
                    );


                    /*
                     * 変換できない場合
                     * WebMのままにはしない
                     */

                    hideLoading();


                    alert(
                        "この端末ではMP4変換に失敗しました。\n" +
                        "別のブラウザまたはPCで試してください。"
                    );


                    return;

                }


                hideLoading();


                fileName +=
                    ".mp4";

            }


            if (
                uploadBlob.size >
                MAX_FILE_SIZE
            ) {

                alert(
                    "MP4変換後の動画が20MBを超えました。"
                );

                return;

            }


            await uploadFile(
                uploadBlob,
                fileName
            );

        };


    mediaRecorder.start(
        250
    );


    captureButton.classList.add(
        "recording"
    );


    recording.classList.add(
        "active"
    );


    recordingStartTime =
        Date.now();


    updateRecordTime();


    recordingTimer =
        setInterval(
            updateRecordTime,
            250
        );


    /*
     * 最大60秒
     */

    setTimeout(
        () => {

            if (
                mediaRecorder &&
                mediaRecorder.state ===
                    "recording"
            ) {

                stopRecording();

            }

        },
        MAX_RECORDING_TIME * 1000
    );

}


/* =================================================
   録画停止
================================================= */

function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state ===
            "recording"
    ) {

        mediaRecorder.stop();

    }

}


/* =================================================
   録画時間
================================================= */

function updateRecordTime() {

    const seconds =
        Math.floor(
            (
                Date.now() -
                recordingStartTime
            ) / 1000
        );


    const min =
        String(
            Math.floor(
                seconds / 60
            )
        ).padStart(
            2,
            "0"
        );


    const sec =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    recordTime.textContent =
        min + ":" + sec;

}


/* =================================================
   MP4変換
================================================= */

async function convertToMP4(
    inputBlob
) {

    /*
     * FFmpegを動的読み込み
     */

    if (
        !window.FFmpeg
    ) {

        await loadFFmpeg();

    }


    const {
        createFFmpeg,
        fetchFile
    } = FFmpeg;


    const ffmpeg =
        createFFmpeg({
            log: false
        });


    await ffmpeg.load();


    ffmpeg.FS(
        "writeFile",
        "input.webm",
        await fetchFile(
            inputBlob
        )
    );


    await ffmpeg.run(

        "-i",
        "input.webm",

        "-c:v",
        "libx264",

        "-preset",
        "ultrafast",

        "-crf",
        "30",

        "-c:a",
        "aac",

        "-movflags",
        "+faststart",

        "output.mp4"

    );


    const data =
        ffmpeg.FS(
            "readFile",
            "output.mp4"
        );


    return new Blob(
        [data.buffer],
        {
            type:
                "video/mp4"
        }
    );

}


/* =================================================
   FFmpeg読み込み
================================================= */

function loadFFmpeg() {

    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );


            script.src =
                "https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js";


            script.onload =
                () => {

                    if (
                        window.FFmpeg
                    ) {

                        resolve();

                    } else {

                        reject(
                            new Error(
                                "FFmpeg読み込み失敗"
                            )
                        );

                    }

                };


            script.onerror =
                () => {

                    reject(
                        new Error(
                            "FFmpegを読み込めませんでした"
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );

}


/* =================================================
   ファイルアップロード
================================================= */

async function uploadFile(
    blob,
    fileName
) {

    if (
        blob.size >
        MAX_FILE_SIZE
    ) {

        alert(
            "20MBを超えています。"
        );

        return;

    }


    showUpload(
        "アップロード開始..."
    );


    try {

        const start =
            await gasGet(
                "start",
                {

                    fileName:
                        fileName,

                    mimeType:
                        blob.type,

                    totalSize:
                        blob.size,

                    deviceId:
                        deviceId

                }
            );


        if (
            !start ||
            !start.uploadId
        ) {

            throw new Error(
                "アップロード開始に失敗しました"
            );

        }


        const uploadId =
            start.uploadId;


        const totalChunks =
            Math.ceil(
                blob.size /
                CHUNK_SIZE
            );


        for (
            let i = 0;
            i < totalChunks;
            i++
        ) {

            const startByte =
                i * CHUNK_SIZE;


            const endByte =
                Math.min(
                    blob.size,
                    startByte +
                    CHUNK_SIZE
                );


            const chunk =
                blob.slice(
                    startByte,
                    endByte
                );


            const base64 =
                await blobToBase64(
                    chunk
                );


            updateUpload(
                `アップロード中 ${i + 1}/${totalChunks}`,
                (
                    (i + 1) /
                    totalChunks
                ) * 100
            );


            await gasPost(
                "chunk",
                {

                    uploadId:
                        uploadId,

                    chunkIndex:
                        i,

                    totalChunks:
                        totalChunks,

                    data:
                        base64

                }
            );


            /*
             * 少し待つ
             */

            await sleep(100);

        }


        updateUpload(
            "保存処理中...",
            100
        );


        await sleep(800);


        hideUpload();


        /*
         * ギャラリー更新
         */

        await loadGallery();


        /*
         * 最新画像
         */

        await updateGalleryPreview();


    } catch (error) {

        console.error(error);

        hideUpload();


        alert(
            "アップロードに失敗しました。\n\n" +
            error.message
        );

    }

}


/* =================================================
   Blob → Base64
================================================= */

function blobToBase64(
    blob
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    const result =
                        reader.result;


                    resolve(
                        result.split(
                            ","
                        )[1]
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                blob
            );

        }
    );

}


/* =================================================
   ギャラリー読み込み
================================================= */

async function loadGallery() {

    try {

        const result =
            await gasGet(
                "list",
                {
                    deviceId:
                        deviceId
                }
            );


        if (
            !result ||
            !Array.isArray(
                result.files
            )
        ) {

            return;

        }


        window.mediaList =
            result.files;


        renderGallery();


    } catch (error) {

        console.error(
            "ギャラリー取得:",
            error
        );


        gallery.innerHTML =
            `<div style="
                grid-column:1/-1;
                padding:30px;
                text-align:center;
                color:#aaa;
            ">
                ギャラリーを読み込めませんでした
                <br><br>
                ${escapeHTML(error.message)}
            </div>`;

    }

}


/* =================================================
   ギャラリー描画
================================================= */

function renderGallery() {

    gallery.innerHTML =
        "";


    const files =
        window.mediaList || [];


    const filtered =
        files.filter(
            file => {

                if (
                    currentFilter ===
                    "all"
                ) {

                    return true;

                }


                if (
                    currentFilter ===
                    "mine"
                ) {

                    return file.mine;

                }


                if (
                    currentFilter ===
                    "shared"
                ) {

                    return !file.mine;

                }


                return true;

            }
        );


    if (
        filtered.length === 0
    ) {

        gallery.innerHTML =
            `<div style="
                grid-column:1/-1;
                padding:50px 20px;
                text-align:center;
                color:#777;
            ">
                写真・動画はありません
            </div>`;

        return;

    }


    filtered.forEach(
        file => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "mediaItem";


            /*
             * 写真
             */

            if (
                file.mimeType
                    .startsWith(
                        "image/"
                    )
            ) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.loading =
                    "lazy";


                img.src =
                    file.thumbnailUrl;


                img.onerror =
                    () => {

                        img.src =
                            createPlaceholder(
                                "📷"
                            );

                    };


                item.appendChild(
                    img
                );

            }


            /*
             * 動画
             */

            else {

                const videoIcon =
                    document.createElement(
                        "div"
                    );


                videoIcon.className =
                    "videoIcon";


                videoIcon.textContent =
                    "🎥";


                item.appendChild(
                    videoIcon
                );

            }


            /*
             * 自分マーク
             */

            if (file.mine) {

                const mark =
                    document.createElement(
                        "div"
                    );


                mark.className =
                    "mineMark";


                mark.textContent =
                    "自分";


                item.appendChild(
                    mark
                );

            }


            item.addEventListener(
                "click",
                () => {

                    openPreview(
                        file
                    );

                }
            );


            gallery.appendChild(
                item
            );

        }
    );

}


/* =================================================
   プレビュー
================================================= */

async function openPreview(
    file
) {

    selectedMedia =
        file;


    previewName.textContent =
        file.name;


    previewContent.innerHTML =
        "";


    showLoading(
        "写真・動画を読み込み中..."
    );


    preview.classList.add(
        "show"
    );


    try {

        /*
         * DriveからGAS経由で取得
         */

        const result =
            await gasGet(
                "file",
                {

                    fileId:
                        file.id,

                    deviceId:
                        deviceId

                }
            );


        if (
            result.tooLarge
        ) {

            previewContent.innerHTML =
                `
                <div style="
                    text-align:center;
                    padding:30px;
                    color:#aaa;
                ">
                    <div style="
                        font-size:60px;
                    ">
                        ${file.mimeType.startsWith("video/")
                            ? "🎥"
                            : "📷"}
                    </div>

                    <br>

                    ファイルサイズが大きいため
                    <br>
                    Driveから開いてください。
                </div>
                `;


            hideLoading();

            return;

        }


        if (
            !result.data
        ) {

            throw new Error(
                "ファイルデータを取得できませんでした"
            );

        }


        const dataUrl =
            "data:" +
            result.mimeType +
            ";base64," +
            result.data;


        /*
         * 写真
         */

        if (
            result.mimeType
                .startsWith(
                    "image/"
                )
        ) {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                dataUrl;


            img.alt =
                file.name;


            previewContent.appendChild(
                img
            );

        }


        /*
         * 動画
         */

        else if (
            result.mimeType
                .startsWith(
                    "video/"
                )
        ) {

            const vid =
                document.createElement(
                    "video"
                );


            vid.controls =
                true;


            vid.autoplay =
                true;


            vid.playsInline =
                true;


            vid.preload =
                "auto";


            vid.src =
                dataUrl;


            previewContent.appendChild(
                vid
            );

        }


        hideLoading();


    } catch (error) {

        hideLoading();


        previewContent.innerHTML =
            `
            <div style="
                padding:30px;
                text-align:center;
            ">
                <div style="
                    font-size:50px;
                ">
                    ⚠️
                </div>

                <br>

                ファイルを表示できませんでした。

                <br><br>

                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>
            </div>
            `;

    }

}

/* =================================================
   保存
================================================= */

document
  .getElementById(
      "saveButton"
  )
  .addEventListener(
      "click",
      async () => {

          if (
              !selectedMedia
          )
              return;


          try {

              showLoading(
                  "保存準備中..."
              );


              const result =
                  await gasGet(
                      "file",
                      {

                          fileId:
                              selectedMedia.id,

                          deviceId:
                              deviceId

                      }
                  );


              if (
                  result.tooLarge
              ) {

                  hideLoading();

                  window.open(
                      selectedMedia.viewUrl,
                      "_blank"
                  );

                  return;

              }


              const dataUrl =
                  "data:" +
                  result.mimeType +
                  ";base64," +
                  result.data;


              const a =
                  document.createElement(
                      "a"
                  );


              a.href =
                  dataUrl;


              a.download =
                  result.name ||
                  selectedMedia.name;


              document.body.appendChild(
                  a
              );


              a.click();


              a.remove();


              hideLoading();


          } catch (error) {

              hideLoading();


              alert(
                  "保存に失敗しました。\n" +
                  error.message
              );

          }

      }
  );

/* =================================================
   最新画像
================================================= */

async function updateGalleryPreview() {

    const files =
        window.mediaList || [];


    const image =
        files.find(
            file =>
                file.mimeType
                    .startsWith(
                        "image/"
                    )
        );


    const img =
        document.getElementById(
            "galleryPreviewImage"
        );


    const icon =
        document.getElementById(
            "galleryPreviewIcon"
        );


    if (image) {

        img.src =
            image.thumbnailUrl;


        img.style.display =
            "block";


        icon.style.display =
            "none";

    } else {

        img.style.display =
            "none";


        icon.style.display =
            "block";

    }

}

/* =================================================
   Upload UI
================================================= */

function showUpload(
    text
) {

    uploadText.textContent =
        text;


    progressBar.style.width =
        "0%";


    uploadStatus.classList.add(
        "show"
    );

}


function updateUpload(
    text,
    percent
) {

    uploadText.textContent =
        text;


    progressBar.style.width =
        Math.min(
            100,
            Math.max(
                0,
                percent
            )
        ) + "%";

}


function hideUpload() {

    uploadStatus.classList.remove(
        "show"
    );

}


/* =================================================
   日付
================================================= */

function makeDateName() {

    const d =
        new Date();


    const y =
        d.getFullYear();


    const m =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    const h =
        String(
            d.getHours()
        ).padStart(
            2,
            "0"
        );


    const min =
        String(
            d.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const sec =
        String(
            d.getSeconds()
        ).padStart(
            2,
            "0"
        );


    return (
        y +
        m +
        day +
        "_" +
        h +
        min +
        sec
    );

}


/* =================================================
   HTMLエスケープ
================================================= */

function escapeHTML(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================================
   プレースホルダー
================================================= */

function createPlaceholder(
    emoji
) {

    return (
        "data:image/svg+xml," +
        encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg"
                  width="500"
                  height="500">
                <rect width="100%"
                      height="100%"
                      fill="#222"/>
                <text x="50%"
                      y="50%"
                      dominant-baseline="middle"
                      text-anchor="middle"
                      font-size="100">
                    ${emoji}
                </text>
            </svg>`
        )
    );

}


/* =================================================
   Sleep
================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}

window.addEventListener(
