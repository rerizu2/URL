<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Camera</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button {
  border: 0;
  outline: none;
  background: none;
  color: inherit;
  font: inherit;
  padding: 0;
  margin: 0;
  cursor: pointer;
}

button:active {
  transform: scale(.94);
}


/* =========================================================
   カメラ全体
========================================================= */

.camera-app {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  height: 100dvh;

  background: #000;

  overflow: hidden;
}


/* =========================================================
   カメラ映像
========================================================= */

#camera {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #000;

  z-index: 1;
}


/* =========================================================
   上部グラデーション
========================================================= */

.top-gradient {

  position: absolute;

  left: 0;
  right: 0;
  top: 0;

  height: 180px;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.65),
      rgba(0,0,0,.2),
      transparent
    );

  z-index: 5;

  pointer-events: none;
}


/* =========================================================
   下部グラデーション
========================================================= */

.bottom-gradient {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 280px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.85),
      rgba(0,0,0,.5),
      transparent
    );

  z-index: 5;

  pointer-events: none;
}


/* =========================================================
   上部ボタン
========================================================= */

.top-controls {

  position: absolute;

  top:
    max(
      18px,
      env(safe-area-inset-top)
    );

  left: 0;
  right: 0;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  padding: 15px 20px;

  z-index: 20;
}


.top-left,
.top-right {

  display: flex;

  align-items: center;

  gap: 18px;
}


.icon-button {

  width: 42px;
  height: 42px;

  border-radius: 50%;

  background:
    rgba(0,0,0,.35);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 22px;
}


/* =========================================================
   ステータス
========================================================= */

.status {

  position: absolute;

  top: 78px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 25;

  max-width: 85%;

  padding: 7px 13px;

  border-radius: 20px;

  background:
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

  font-size: 12px;

  text-align: center;

  opacity: 0;

  transition:
    opacity .25s;
}

.status.show {
  opacity: 1;
}


/* =========================================================
   録画表示
========================================================= */

.recording {

  position: absolute;

  top: 130px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 30;

  display: none;

  align-items: center;

  gap: 8px;

  padding: 7px 13px;

  border-radius: 20px;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  font-size: 14px;

  font-weight: 600;
}

.recording.active {
  display: flex;
}

.record-dot {

  width: 9px;
  height: 9px;

  border-radius: 50%;

  background: #ff3b30;

  animation:
    recordingBlink 1s infinite;
}

@keyframes recordingBlink {

  50% {
    opacity: .25;
  }
}


/* =========================================================
   フォーカス表示
========================================================= */

.focus-box {

  position: absolute;

  left: 50%;
  top: 45%;

  width: 70px;
  height: 70px;

  transform:
    translate(-50%, -50%);

  border: 1.5px solid
    rgba(255,255,255,.85);

  border-radius: 3px;

  z-index: 10;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .2s;
}

.focus-box.active {
  opacity: 1;
}


/* =========================================================
   下部UI
========================================================= */

.bottom-ui {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 20;

  padding:

    0

    20px

    max(
      24px,
      env(safe-area-inset-bottom)
    )

    20px;
}


/* =========================================================
   モード切替
========================================================= */

.mode-selector {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 24px;

  margin-bottom: 22px;
}

.mode {

  color:
    rgba(255,255,255,.6);

  font-size: 14px;

  font-weight: 600;

  transition:
    color .2s,
    transform .2s;
}

.mode.active {

  color: #ffd60a;

  transform:
    scale(1.05);
}


/* =========================================================
   撮影コントロール
========================================================= */

.capture-controls {

  display: grid;

  grid-template-columns:
    1fr 90px 1fr;

  align-items: center;

  max-width: 430px;

  margin: auto;
}


/* =========================================================
   ギャラリーボタン
========================================================= */

.gallery-button {

  width: 52px;
  height: 52px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.18);

  border:
    2px solid
    rgba(255,255,255,.75);

  overflow: hidden;

  justify-self: start;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 22px;
}


/* =========================================================
   シャッター
========================================================= */

.capture-button {

  width: 76px;
  height: 76px;

  border-radius: 50%;

  background: #fff;

  border:
    5px solid
    rgba(255,255,255,.35);

  box-shadow:
    0 0 0 3px
    rgba(0,0,0,.4);

  justify-self: center;

  transition:
    transform .12s;
}

.capture-button.video {

  background:
    #ff3b30;

  border-color:
    rgba(255,255,255,.4);
}


/* =========================================================
   カメラ切替
========================================================= */

.switch-button {

  width: 52px;
  height: 52px;

  border-radius: 50%;

  background:
    rgba(0,0,0,.4);

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

  justify-self: end;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 27px;
}


/* =========================================================
   ズーム風表示
========================================================= */

.zoom-controls {

  display: flex;

  justify-content: center;

  gap: 12px;

  margin-bottom: 18px;
}

.zoom {

  min-width: 48px;

  height: 32px;

  padding: 0 12px;

  border-radius: 20px;

  background:
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

  font-size: 13px;

  font-weight: 600;
}

.zoom.active {

  background:
    rgba(255,255,255,.22);

  color: #ffd60a;
}


/* =========================================================
   アップロード
========================================================= */

.upload-panel {

  position: absolute;

  left: 15px;
  right: 15px;

  bottom: 155px;

  z-index: 50;

  display: none;

  padding: 15px;

  border-radius: 18px;

  background:
    rgba(20,20,20,.8);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);
}

.upload-panel.show {
  display: block;
}

.upload-title {

  font-size: 14px;

  margin-bottom: 9px;
}

.progress {

  height: 7px;

  width: 100%;

  border-radius: 10px;

  background:
    rgba(255,255,255,.18);

  overflow: hidden;
}

.progress-bar {

  width: 0%;

  height: 100%;

  background: #fff;

  border-radius: 10px;

  transition:
    width .15s;
}


/* =========================================================
   ギャラリー
========================================================= */

.gallery-panel {

  position: fixed;

  inset: 0;

  z-index: 100;

  background:
    #050505;

  display: none;

  flex-direction: column;
}

.gallery-panel.show {
  display: flex;
}


/* =========================================================
   ギャラリーヘッダー
========================================================= */

.gallery-header {

  padding:
    max(
      15px,
      env(safe-area-inset-top)
    )
    18px
    12px
    18px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  border-bottom:
    1px solid
    rgba(255,255,255,.1);
}

.gallery-header h2 {

  margin: 0;

  font-size: 20px;
}

.close-gallery {

  width: 42px;
  height: 42px;

  border-radius: 50%;

  background:
    #222;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 20px;
}


/* =========================================================
   タブ
========================================================= */

.gallery-tabs {

  display: flex;

  padding: 10px 15px;

  gap: 8px;

  overflow-x: auto;
}

.gallery-tab {

  padding: 8px 15px;

  border-radius: 20px;

  background:
    #202020;

  color:
    #aaa;

  white-space: nowrap;

  font-size: 13px;
}

.gallery-tab.active {

  background:
    #fff;

  color:
    #000;
}


/* =========================================================
   ギャラリー一覧
========================================================= */

.gallery {

  flex: 1;

  overflow-y: auto;

  padding: 5px;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 3px;

  align-content: start;
}

.media {

  position: relative;

  aspect-ratio: 1;

  background: #161616;

  overflow: hidden;
}

.media img {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.video-thumb {

  width: 100%;
  height: 100%;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 38px;

  background:
    linear-gradient(
      135deg,
      #222,
      #111
    );
}

.media-label {

  position: absolute;

  left: 6px;
  bottom: 6px;

  padding: 3px 7px;

  border-radius: 10px;

  background:
    rgba(0,0,0,.65);

  font-size: 10px;
}


/* =========================================================
   プレビュー
========================================================= */

.preview {

  position: fixed;

  inset: 0;

  z-index: 200;

  display: none;

  justify-content: center;
  align-items: center;

  background:
    rgba(0,0,0,.96);
}

.preview.show {
  display: flex;
}

.preview-content {

  width: 100%;
  height: 100%;

  display: flex;

  flex-direction: column;

  justify-content: center;
  align-items: center;

  gap: 20px;

  padding: 20px;
}

.preview-media {

  max-width: 100%;
  max-height: 75vh;

  object-fit: contain;
}

.preview-buttons {

  display: flex;

  gap: 8px;

  width: 100%;

  max-width: 500px;
}

.preview-buttons button {

  flex: 1;

  padding: 12px;

  border-radius: 12px;

  background: #222;

  color: #fff;

  font-size: 13px;
}


/* =========================================================
   エラー
========================================================= */

.error-message {

  grid-column:
    1 / -1;

  padding: 30px;

  text-align: center;

  color: #999;

  font-size: 14px;
}


/* =========================================================
   PC
========================================================= */

@media (min-width: 800px) {

  .gallery {

    grid-template-columns:
      repeat(6, 1fr);
  }

  .gallery-panel {

    max-width: 700px;

    left: 50%;

    transform:
      translateX(-50%);
  }
}


/* =========================================================
   横画面
========================================================= */

@media
(orientation: landscape)
and (max-height: 600px) {

  .top-controls {
    padding-top: 10px;
  }

  .mode-selector {
    margin-bottom: 8px;
  }

  .zoom-controls {
    margin-bottom: 8px;
  }

  .bottom-ui {
    padding-bottom: 10px;
  }

  .capture-button {

    width: 64px;
    height: 64px;
  }

  .gallery-button,
  .switch-button {

    width: 44px;
    height: 44px;
  }
}

</style>

</head>


<body>


<!-- ========================================================
     カメラアプリ
========================================================= -->

<div class="camera-app">


  <!-- カメラ映像 -->

  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>


  <!-- グラデーション -->

  <div class="top-gradient"></div>

  <div class="bottom-gradient"></div>


  <!-- フォーカス -->

  <div
    id="focusBox"
    class="focus-box"
  ></div>


  <!-- ======================================================
       上部
  ======================================================= -->

  <div class="top-controls">

    <div class="top-left">

      <button
        id="flashButton"
        class="icon-button"
        aria-label="ライト"
      >
        ⚡
      </button>

    </div>


    <div class="top-right">

      <button
        id="startButton"
        class="icon-button"
        aria-label="カメラ開始"
      >
        📷
      </button>

    </div>

  </div>


  <!-- ステータス -->

  <div
    id="status"
    class="status"
  >
    カメラを準備しています
  </div>


  <!-- 録画表示 -->

  <div
    id="recording"
    class="recording"
  >

    <span class="record-dot"></span>

    <span id="recordTime">
      00:00
    </span>

  </div>


  <!-- ======================================================
       下部UI
  ======================================================= -->

  <div class="bottom-ui">


    <!-- ズーム風ボタン -->

    <div class="zoom-controls">

      <button
        class="zoom active"
        data-zoom="1"
      >
        1×
      </button>

      <button
        class="zoom"
        data-zoom="2"
      >
        2×
      </button>

      <button
        class="zoom"
        data-zoom="3"
      >
        3×
      </button>

    </div>


    <!-- モード -->

    <div class="mode-selector">

      <button
        id="videoMode"
        class="mode"
      >
        ビデオ
      </button>

      <button
        id="photoMode"
        class="mode active"
      >
        写真
      </button>

    </div>


    <!-- 撮影ボタン -->

    <div class="capture-controls">


      <!-- ギャラリー -->

      <button
        id="galleryButton"
        class="gallery-button"
        aria-label="ギャラリー"
      >
        🖼️
      </button>


      <!-- シャッター -->

      <button
        id="captureButton"
        class="capture-button"
        aria-label="撮影"
      ></button>


      <!-- カメラ切替 -->

      <button
        id="switchButton"
        class="switch-button"
        aria-label="カメラ切替"
      >
        🔄
      </button>


    </div>

  </div>


  <!-- ======================================================
       アップロード
  ======================================================= -->

  <div
    id="uploadPanel"
    class="upload-panel"
  >

    <div
      id="uploadTitle"
      class="upload-title"
    >
      Google Driveへ保存中...
    </div>

    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>


</div>


<!-- ========================================================
     ギャラリー
========================================================= -->

<div
  id="galleryPanel"
  class="gallery-panel"
>

  <div class="gallery-header">

    <h2>
      ギャラリー
    </h2>

    <button
      id="closeGallery"
      class="close-gallery"
    >
      ✕
    </button>

  </div>


  <div class="gallery-tabs">

    <button
      class="gallery-tab active"
      data-tab="all"
    >
      すべて
    </button>

    <button
      class="gallery-tab"
      data-tab="mine"
    >
      自分
    </button>

    <button
      class="gallery-tab"
      data-tab="shared"
    >
      共有
    </button>

  </div>


  <div
    id="gallery"
    class="gallery"
  ></div>

</div>


<!-- ========================================================
     プレビュー
========================================================= -->

<div
  id="preview"
  class="preview"
>

  <div class="preview-content">

    <div id="previewMedia"></div>


    <div class="preview-buttons">

      <button
        id="openDrive"
      >
        Google Drive
      </button>

      <button
        id="downloadButton"
      >
        ダウンロード
      </button>

      <button
        id="deleteButton"
      >
        削除
      </button>

      <button
        id="closePreview"
      >
        閉じる
      </button>

    </div>

  </div>

</div>


<script>


// ============================================================
// ★★★ ここだけ変更してください ★★★
// ============================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxXRA5wiBiIXc1JTzL03ESK_Yx2uHdopSfpMhaiT308Os9VdGc4okrlBbCPOynIW_RMLw/exec";


// 例:
//
// const GAS_URL =
// "https://script.google.com/macros/s/AKfycbxxxxxxxxxxxx/exec";


// ============================================================
// 設定
// ============================================================

const MAX_FILE_SIZE =
  20 * 1024 * 1024;

const MAX_RECORDING_TIME =
  60;

const CHUNK_SIZE =
  256 * 1024;


// ============================================================
// DOM
// ============================================================

const camera =
  document.getElementById(
    "camera"
  );

const captureButton =
  document.getElementById(
    "captureButton"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const recording =
  document.getElementById(
    "recording"
  );

const recordTime =
  document.getElementById(
    "recordTime"
  );

const uploadPanel =
  document.getElementById(
    "uploadPanel"
  );

const uploadTitle =
  document.getElementById(
    "uploadTitle"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const galleryPanel =
  document.getElementById(
    "galleryPanel"
  );

const gallery =
  document.getElementById(
    "gallery"
  );

const preview =
  document.getElementById(
    "preview"
  );

const previewMedia =
  document.getElementById(
    "previewMedia"
  );


// ============================================================
// 状態
// ============================================================

let stream = null;

let facingMode =
  "environment";

let torchOn = false;

let currentMode =
  "photo";

let mediaRecorder = null;

let recordedChunks = [];

let recordingTimer = null;

let recordingSeconds = 0;

let currentTab = "all";

let selectedMedia = null;

let currentZoom = 1;


// ============================================================
// デバイスID
// ============================================================

let deviceId =
  localStorage.getItem(
    "shared_camera_device_id"
  );


if (!deviceId) {

  deviceId =
    crypto.randomUUID();

  localStorage.setItem(
    "shared_camera_device_id",
    deviceId
  );
}


// ============================================================
// ステータス
// ============================================================

let statusTimer = null;

function showStatus(
  message
) {

  statusElement.textContent =
    message;

  statusElement.classList.add(
    "show"
  );


  clearTimeout(
    statusTimer
  );


  statusTimer =
    setTimeout(
      () => {

        statusElement.classList.remove(
          "show"
        );

      },
      2500
    );
}


// ============================================================
// GAS GET / JSONP
// ============================================================

function gasGet(
  action,
  params = {}
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "gasCallback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams({

          action,

          callback:
            callbackName,

          ...params

        });


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "GASの応答がありません"
              )
            );

          },
          30000
        );


      window[callbackName] =
        data => {

          clearTimeout(
            timer
          );

          cleanup();

          resolve(data);
        };


      script.src =
        GAS_URL +
        "?" +
        query.toString();


      script.onerror =
        () => {

          clearTimeout(
            timer
          );

          cleanup();

          reject(
            new Error(
              "GASへ接続できません"
            )
          );
        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        delete window[
          callbackName
        ];

        script.remove();
      }

    }
  );
}


// ============================================================
// GAS POST
// ============================================================

function gasPost(
  action,
  data
) {

  return new Promise(
    (resolve, reject) => {

      const iframeName =
        "gasFrame_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.name =
        iframeName;

      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        GAS_URL;

      form.target =
        iframeName;

      form.style.display =
        "none";


      const values = {

        action,

        ...data

      };


      Object.keys(values)
        .forEach(
          key => {

            const input =
              document.createElement(
                "input"
              );

            input.type =
              "hidden";

            input.name =
              key;

            input.value =
              values[key];

            form.appendChild(
              input
            );
          }
        );


      document.body.appendChild(
        form
      );


      let completed =
        false;


      const timer =
        setTimeout(
          () => {

            if (completed)
              return;

            completed =
              true;

            cleanup();

            reject(
              new Error(
                "GASへの送信がタイムアウトしました"
              )
            );

          },
          60000
        );


      iframe.onload =
        () => {

          if (completed)
            return;

          completed =
            true;

          clearTimeout(timer);

          cleanup();

          resolve({
            success: true
          });

        };


      try {

        form.submit();

      } catch (error) {

        clearTimeout(timer);

        cleanup();

        reject(error);
      }


      function cleanup() {

        form.remove();

        setTimeout(
          () => {

            iframe.remove();

          },
          500
        );
      }

    }
  );
}


// ============================================================
// アップロード開始
// ============================================================

function startUploadJSONP(
  blob,
  fileName
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "uploadStart_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const params =
        new URLSearchParams({

          action:
            "start",

          callback:
            callbackName,

          fileName,

          mimeType:
            blob.type ||
            "application/octet-stream",

          totalSize:
            blob.size,

          deviceId

        });


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "アップロード開始がタイムアウトしました"
              )
            );

          },
          30000
        );


      window[callbackName] =
        data => {

          clearTimeout(timer);

          cleanup();


          if (
            data &&
            data.success
          ) {

            resolve(data);

          } else {

            reject(
              new Error(
                data?.error ||
                "アップロードを開始できませんでした"
              )
            );
          }

        };


      script.src =
        GAS_URL +
        "?" +
        params.toString();


      script.onerror =
        () => {

          clearTimeout(timer);

          cleanup();

          reject(
            new Error(
              "GASへ接続できません"
            )
          );
        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        delete window[
          callbackName
        ];

        script.remove();
      }

    }
  );
}


// ============================================================
// カメラ開始
// ============================================================

async function startCamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode,

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: true

        });


    camera.srcObject =
      stream;


    await camera.play();


    torchOn =
      false;


    applyZoom();


    showStatus(
      facingMode ===
      "environment"
        ? "背面カメラ"
        : "前面カメラ"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "カメラを使用できません"
    );
  }
}


// ============================================================
// カメラ切替
// ============================================================

async function switchCamera() {

  facingMode =
    facingMode ===
      "environment"
      ? "user"
      : "environment";


  await startCamera();
}


// ============================================================
// ライト
// ============================================================

async function toggleTorch() {

  if (!stream) {

    showStatus(
      "先にカメラを開始してください"
    );

    return;
  }


  const track =
    stream.getVideoTracks()[0];


  const capabilities =
    track.getCapabilities();


  if (
    !capabilities.torch
  ) {

    showStatus(
      "ライトに対応していません"
    );

    return;
  }


  torchOn =
    !torchOn;


  try {

    await track.applyConstraints({

      advanced: [
        {
          torch:
            torchOn
        }
      ]

    });


    showStatus(
      torchOn
        ? "ライト ON"
        : "ライト OFF"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "ライトを変更できません"
    );
  }
}


// ============================================================
// ズーム
// ============================================================

async function setZoom(
  zoom
) {

  currentZoom =
    zoom;


  document
    .querySelectorAll(
      ".zoom"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.zoom
          ) === zoom
        );

      }
    );


  applyZoom();
}


async function applyZoom() {

  if (!stream)
    return;


  const track =
    stream.getVideoTracks()[0];


  const capabilities =
    track.getCapabilities();


  if (
    capabilities.zoom
  ) {

    const min =
      capabilities.zoom.min;

    const max =
      capabilities.zoom.max;


    const zoom =
      Math.max(
        min,
        Math.min(
          max,
          currentZoom
        )
      );


    try {

      await track.applyConstraints({

        advanced: [
          {
            zoom
          }
        ]

      });

    } catch (error) {

      console.log(error);
    }

  } else {

    camera.style.transform =
      `scale(${currentZoom})`;
  }
}

// ============================================================
// 写真
// ============================================================

async function takePhoto() {

  if (!stream) {

    await startCamera();

    if (!stream)
      return;
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    async blob => {

      if (!blob)
        return;


      const fileName =
        "photo_" +
        formatDate() +
        ".jpg";


      await uploadFile(
        blob,
        fileName
      );

    },
    "image/jpeg",
    .92
  );
}


// ============================================================
// 録画開始
// ============================================================

function startRecording() {

  if (!stream) {

    showStatus(
      "先にカメラを開始してください"
    );

    return;
  }


  recordedChunks = [];


  let mimeType = "";


  const types = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm",

    "video/mp4"

  ];


  for (
    const type of types
  ) {

    if (
      MediaRecorder
        .isTypeSupported(type)
    ) {

      mimeType =
        type;

      break;
    }
  }


  try {

    mediaRecorder =
      new MediaRecorder(
        stream,

        mimeType
          ? {
              mimeType
            }
          : undefined
      );

  } catch (error) {

    showStatus(
      "動画録画に対応していません"
    );

    return;
  }


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );
      }
    };


  mediaRecorder.onstop =
    async () => {

      stopRecordingUI();


      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              mimeType ||
              "video/webm"
          }
        );


      if (
        blob.size >
        MAX_FILE_SIZE
      ) {

        showStatus(
          "20MBを超えたため保存できません"
        );

        return;
      }


      const extension =
        blob.type.includes("mp4")
          ? "mp4"
          : "webm";


      const fileName =
        "video_" +
        formatDate() +
        "." +
        extension;


      await uploadFile(
        blob,
        fileName
      );
    };


  mediaRecorder.start(
    250
  );


  recordingSeconds =
    0;


  recording.classList.add(
    "active"
  );


  updateRecordTime();


  recordingTimer =
    setInterval(
      () => {

        recordingSeconds++;

        updateRecordTime();


        if (
          recordingSeconds >=
          MAX_RECORDING_TIME
        ) {

          stopRecording();
        }

      },
      1000
    );


  showStatus(
    "録画中"
  );
}


// ============================================================
// 録画停止
// ============================================================

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state ===
      "recording"
  ) {

    mediaRecorder.stop();
  }
}


function stopRecordingUI() {

  recording.classList.remove(
    "active"
  );


  clearInterval(
    recordingTimer
  );


  recordingTimer =
    null;


  recordTime.textContent =
    "00:00";
}


function updateRecordTime() {

  const minutes =
    Math.floor(
      recordingSeconds / 60
    )
      .toString()
      .padStart(2, "0");


  const seconds =
    (
      recordingSeconds % 60
    )
      .toString()
      .padStart(2, "0");


  recordTime.textContent =
    minutes +
    ":" +
    seconds;
}


// ============================================================
// Blob → Base64
// ============================================================

function blobToBase64(
  blob
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            reader.result;


          resolve(
            result.split(",")[1]
          );
        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


// ============================================================
// ファイルアップロード
// ============================================================

async function uploadFile(
  blob,
  fileName
) {

  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    showStatus(
      "20MBを超えています"
    );

    return;
  }


  uploadPanel.classList.add(
    "show"
  );


  progressBar.style.width =
    "0%";


  try {

    uploadTitle.textContent =
      "Google Driveへ保存中...";


    // --------------------------------------------------------
    // アップロードセッション開始
    // --------------------------------------------------------

    const start =
      await startUploadJSONP(
        blob,
        fileName
      );


    if (
      !start ||
      !start.uploadId
    ) {

      throw new Error(
        "アップロードIDを取得できませんでした"
      );
    }


    const uploadId =
      start.uploadId;


    const totalChunks =
      Math.ceil(
        blob.size /
        CHUNK_SIZE
      );


    // --------------------------------------------------------
    // チャンクを順番に送信
    // --------------------------------------------------------

    for (
      let i = 0;
      i < totalChunks;
      i++
    ) {

      const startByte =
        i *
        CHUNK_SIZE;


      const endByte =
        Math.min(
          startByte +
          CHUNK_SIZE,
          blob.size
        );


      const chunk =
        blob.slice(
          startByte,
          endByte
        );


      const base64 =
        await blobToBase64(
          chunk
        );


      uploadTitle.textContent =
        "保存中 " +
        (i + 1) +
        " / " +
        totalChunks;


      progressBar.style.width =
        (
          ((i + 1) /
            totalChunks) *
          100
        ) +
        "%";


      await gasPost(
        "chunk",
        {

          uploadId,

          chunkIndex:
            i,

          totalChunks,

          data:
            base64

        }
      );


      await sleep(150);
    }


    progressBar.style.width =
      "100%";


    uploadTitle.textContent =
      "保存完了";


    showStatus(
      "Google Driveに保存しました"
    );


    await sleep(700);


    await loadGallery();


  } catch (error) {

    console.error(error);

    showStatus(
      "保存に失敗しました"
    );

  } finally {

    setTimeout(
      () => {

        uploadPanel.classList.remove(
          "show"
        );

      },
      1000
    );
  }
}


// ============================================================
// ギャラリー表示
// ============================================================

function openGallery() {

  galleryPanel.classList.add(

  );

}


function closeGallery() {

  );

// ============================================================
// ギャラリー取得
// ============================================================

async function loadGallery() {

  gallery.innerHTML =
    '<div class="error-message">読み込み中...</div>';


  try {

    const result =
      await gasGet(
        "list",
        {
          deviceId
        }
      );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result?.error ||
        "取得できませんでした"
      );
    }


    let files =
      result.files || [];


    if (
      currentTab === "mine"
    ) {

      files =
        files.filter(
          file =>
            file.mine
        );
    }


    if (
      currentTab === "shared"
    ) {

      files =
        files.filter(
          file =>
            !file.mine
        );
    }


    gallery.innerHTML =
      "";


    if (
      files.length === 0
    ) {

      gallery.innerHTML =
        '<div class="error-message">写真や動画がありません</div>';

      return;
    }


    for (
      const file of files
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "media";


      if (
        file.mimeType
          .startsWith(
            "image/"
          )
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          "https://drive.google.com/thumbnail?id=" +
          encodeURIComponent(
            file.id
          ) +
          "&sz=w800";


        img.loading =
          "lazy";


        element.appendChild(
          img
        );

      } else {

        const video =
          document.createElement(
            "div"
          );


        video.className =
          "video-thumb";


        video.textContent =
          "🎥";


        element.appendChild(
          video
        );
      }


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "media-label";


      label.textContent =
        file.mine
          ? "自分"
          : "共有";


      element.appendChild(
        label
      );


      element.onclick =
        () =>
          openMedia(
            file
          );


      gallery.appendChild(
        element
      );
    }


  } catch (error) {

    console.error(error);

    gallery.innerHTML =
      '<div class="error-message">ギャラリーを読み込めませんでした</div>';
  }
}


// ============================================================
// メディアプレビュー
// ============================================================

function openMedia(
  file
) {

  selectedMedia =
    file;


  preview.classList.add(
    "show"
  );


  previewMedia.innerHTML =

  if (
    file.mimeType
      .startsWith(
        "image/"
      )
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "preview-media";


    img.src =
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(
        file.id
      ) +
      "&sz=w2000";


    previewMedia.appendChild(
      img
    );

  } else {

    const video =
      document.createElement(
        "video"
      );


    video.className =
      "preview-media";

    video.controls =
      true;

    video.playsInline =
      true;


    video.src =
      "https://drive.google.com/uc?export=download&id=" +
      encodeURIComponent(
        file.id
      );


    previewMedia.appendChild(
      video
    );
  }
}

  );
}

// ============================================================

function downloadMedia() {

    return;

      selectedMedia.id
    );

  );

// ============================================================
// 削除
// ============================================================

async function deleteMedia() {

  if (!selectedMedia)
    return;


  if (!selectedMedia.mine) {

    showStatus(
      "共有ファイルは削除できません"
    );

    return;
  }


  const ok =
    confirm(
      "この写真・動画を削除しますか？"
    );


  if (!ok)
    return;


  try {

    await gasPost(
      "delete",
      {

        fileId:
          selectedMedia.id,

        deviceId

      }
    );


    closePreview();

    await loadGallery();


    showStatus(
      "削除しました"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "削除に失敗しました"
    );
  }
}


// ============================================================
// 日時
// ============================================================

function formatDate() {

  const d =
    new Date();


  return (

    d.getFullYear() +

    String(
      d.getMonth() + 1
    ).padStart(2, "0") +

    String(
      d.getDate()
    ).padStart(2, "0") +

    "_" +

    String(
      d.getHours()
    ).padStart(2, "0") +

    String(
      d.getMinutes()
    ).padStart(2, "0") +

    String(
      d.getSeconds()
    ).padStart(2, "0")

  );
}


// ============================================================
// 待機
// ============================================================

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}

  );

// 初期化
// ============================================================

);

startCamera()

  );
