<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>共有カメラ</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #101114;
  color: white;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}


/* =========================================================
   ヘッダー
========================================================= */

header {
  padding: 16px;

  background: #181a20;

  position: sticky;
  top: 0;

  z-index: 100;
}

header h1 {
  margin: 0;

  font-size: 21px;
}


/* =========================================================
   メイン
========================================================= */

main {
  width: min(100%, 1000px);

  margin: auto;

  padding: 15px;
}


/* =========================================================
   カメラ
========================================================= */

.camera-box {

  position: relative;

  width: 100%;

  background: black;

  border-radius: 18px;

  overflow: hidden;

  aspect-ratio: 16 / 9;
}

#camera {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}


/* =========================================================
   録画表示
========================================================= */

.recording {

  position: absolute;

  top: 15px;
  left: 15px;

  display: none;

  align-items: center;

  gap: 8px;

  background: rgba(0,0,0,.7);

  padding: 8px 12px;

  border-radius: 20px;

  font-weight: bold;
}

.recording.active {
  display: flex;
}

.record-dot {

  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: red;

  animation: blink 1s infinite;
}

@keyframes blink {

  50% {
    opacity: .2;
  }
}


/* =========================================================
   コントロール
========================================================= */

.controls {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

  margin-top: 12px;
}

.controls button {

  background: #272a32;

  color: white;
}

.controls button:hover {
  background: #333743;
}


/* =========================================================
   撮影ボタン
========================================================= */

.capture-area {

  display: flex;

  justify-content: center;

  margin: 18px 0;
}

.capture {

  width: 78px;
  height: 78px;

  border-radius: 50%;

  background: white;

  border: 7px solid #555;

  padding: 0;
}

.capture.video {

  background: red;
}


/* =========================================================
   モード
========================================================= */

.mode {

  display: flex;

  gap: 8px;

  margin-bottom: 10px;
}

.mode button {

  flex: 1;

  background: #272a32;

  color: white;
}

.mode button.active {

  background: #3d73ff;
}


/* =========================================================
   進捗
========================================================= */

.progress-box {

  display: none;

  margin: 15px 0;
}

.progress-text {

  margin-bottom: 6px;

  font-size: 14px;
}

.progress {

  width: 100%;

  height: 10px;

  background: #292b31;

  border-radius: 10px;

  overflow: hidden;
}

.progress-bar {

  width: 0%;

  height: 100%;

  background: #3d73ff;

  transition: width .15s;
}


/* =========================================================
   ギャラリー
========================================================= */

.gallery-title {

  margin-top: 25px;

  display: flex;

  justify-content: space-between;

  align-items: center;
}

.tabs {

  display: flex;

  gap: 7px;

  overflow-x: auto;

  margin: 12px 0;
}

.tabs button {

  white-space: nowrap;

  background: #272a32;

  color: white;
}

.tabs button.active {

  background: #3d73ff;
}


.gallery {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;
}

.media {

  position: relative;

  background: #1c1e24;

  border-radius: 10px;

  overflow: hidden;

  aspect-ratio: 1;
}

.media img {

  width: 100%;
  height: 100%;

  object-fit: cover;
}

.video-thumb {

  width: 100%;
  height: 100%;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 42px;
}

.media-label {

  position: absolute;

  left: 5px;
  bottom: 5px;

  background: rgba(0,0,0,.7);

  padding: 4px 7px;

  border-radius: 7px;

  font-size: 11px;
}


/* =========================================================
   モーダル
========================================================= */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.9);

  z-index: 999;

  padding: 15px;

  justify-content: center;

  align-items: center;
}

.modal.active {
  display: flex;
}

.modal-content {

  width: 100%;

  max-width: 900px;

  max-height: 90vh;

  display: flex;

  flex-direction: column;

  gap: 10px;
}

.modal-media {

  width: 100%;

  max-height: 75vh;

  object-fit: contain;

  background: black;

  border-radius: 12px;
}

.modal-buttons {

  display: flex;

  gap: 8px;
}

.modal-buttons button {

  flex: 1;

  background: #272a32;

  color: white;
}


/* =========================================================
   ステータス
========================================================= */

.status {

  margin-top: 10px;

  padding: 10px;

  border-radius: 10px;

  background: #181a20;

  font-size: 13px;
}


/* =========================================================
   PC
========================================================= */

@media (min-width: 700px) {

  .controls {

    grid-template-columns:
      repeat(4, 1fr);
  }

  .gallery {

    grid-template-columns:
      repeat(5, 1fr);
  }
}


/* =========================================================
   横画面スマホ
========================================================= */

@media (orientation: landscape)
and (max-height: 600px) {

  .camera-box {

    aspect-ratio: 16 / 8;
  }

  header {
    padding: 8px 15px;
  }

  main {
    padding: 10px;
  }
}

</style>
</head>

<script>

// ============================================================
// ★★★ ここだけ変更 ★★★
// ============================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxmTmRc68WpxAWmfBABMW3jJvGRfY3byuT2bC8X2lq8zrlznBJNKKsYuR8EROa6cvsKUA/exec";


// 例
//
// const GAS_URL =
// "https://script.google.com/macros/s/AKfycbxxxxxxxxxxxx/exec";


// ============================================================
// 設定
// ============================================================

const MAX_FILE_SIZE =
  20 * 1024 * 1024;

const MAX_RECORDING_TIME =
  60;

const CHUNK_SIZE =
  256 * 1024;


// ============================================================
// DOM
// ============================================================

const camera =
  document.getElementById(
    "camera"
  );

const captureButton =
  document.getElementById(
    "captureButton"
  );

const recording =
  document.getElementById(
    "recording"
  );

const recordTime =
  document.getElementById(
    "recordTime"
  );

const status =
  document.getElementById(
    "status"
  );

const gallery =
  document.getElementById(
    "gallery"
  );

const progressBox =
  document.getElementById(
    "progressBox"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const modal =
  document.getElementById(
    "modal"
  );

const modalMedia =
  document.getElementById(
    "modalMedia"
  );


// ============================================================
// 状態
// ============================================================

let stream = null;

let facingMode =
  "environment";

let torchOn = false;

let currentMode =
  "photo";

let mediaRecorder = null;

let recordedChunks = [];

let recordingTimer = null;

let recordingSeconds = 0;

let selectedMedia = null;

let currentTab = "all";


// ============================================================
// デバイスID
// ============================================================

let deviceId =
  localStorage.getItem(
    "shared_camera_device_id"
  );


if (!deviceId) {

  deviceId =
    crypto.randomUUID();

  localStorage.setItem(
    "shared_camera_device_id",
    deviceId
  );
}


// ============================================================
// GAS JSONP
// ============================================================

function gasGet(
  action,
  params = {}
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "gasCallback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams({

          action,

          callback:
            callbackName,

          ...params
        });


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "GASへの接続がタイムアウトしました"
              )
            );

          },
          30000
        );


      window[callbackName] =
        function(data) {

          clearTimeout(timer);

          cleanup();

          resolve(data);
        };


      script.src =
        GAS_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          clearTimeout(timer);

          cleanup();

          reject(
            new Error(
              "GASへの接続に失敗しました"
            )
          );
        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        delete window[
          callbackName
        ];

        script.remove();
      }

    }
  );
}


// ============================================================
// GAS POST
//
// GitHub Pages → GASはCORS問題を避けるため
// hidden iframe + form POSTを使用
// ============================================================

function gasPost(
  action,
  data
) {

  return new Promise(
    (resolve, reject) => {

      const iframeName =
        "gasFrame_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const iframe =
        document.createElement(
          "iframe"
        );

      iframe.name =
        iframeName;

      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        GAS_URL;

      form.target =
        iframeName;

      form.style.display =
        "none";


      const values = {

        action,

        ...data
      };


      Object.keys(values)
        .forEach(
          key => {

            const input =
              document.createElement(
                "input"
              );

            input.type =
              "hidden";

            input.name =
              key;

            input.value =
              values[key];

            form.appendChild(
              input
            );
          }
        );


      document.body.appendChild(
        form
      );


      let finished = false;


      const timer =
        setTimeout(
          () => {

            if (finished)
              return;

            finished = true;

            cleanup();

            reject(
              new Error(
                "GAS POSTがタイムアウトしました"
              )
            );

          },
          60000
        );


      iframe.onload =
        function() {

          if (finished)
            return;

          finished = true;

          clearTimeout(timer);

          cleanup();

          resolve({
            success: true
          });
        };


      try {

        form.submit();

      } catch (error) {

        clearTimeout(timer);

        cleanup();

        reject(error);
      }


      function cleanup() {

        form.remove();

        setTimeout(
          () => iframe.remove(),
          1000
        );
      }

    }
  );
}


// ============================================================
// カメラ開始
// ============================================================

async function startCamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:

              facingMode

          },

          audio: true

        });


    camera.srcObject =
      stream;


    status.textContent =
      "カメラを開始しました";

  } catch (error) {

    console.error(error);

    status.textContent =
      "カメラを開始できませんでした";
  }
}


// ============================================================
// 前後カメラ
// ============================================================

async function switchCamera() {

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";


  await startCamera();
}


// ============================================================
// ライト
// ============================================================

async function toggleTorch() {

  if (!stream)
    return;


  const track =
    stream.getVideoTracks()[0];


  const capabilities =
    track.getCapabilities();


  if (!capabilities.torch) {

    status.textContent =
      "この端末ではライトを使用できません";

    return;
  }


  torchOn =
    !torchOn;


  try {

    await track.applyConstraints({

      advanced: [
        {
          torch:
            torchOn
        }
      ]

    });

  } catch (error) {

    console.error(error);
  }
}


// ============================================================
// モード変更
// ============================================================

function setMode(
  mode
) {

  currentMode =
    mode;


  document
    .getElementById(
      "photoMode"
    )
    .classList
    .toggle(
      "active",
      mode === "photo"
    );


  document
    .getElementById(
      "videoMode"
    )
    .classList
    .toggle(
      "active",
      mode === "video"
    );


  captureButton
    .classList
    .toggle(
      "video",
      mode === "video"
    );
}


// ============================================================
// 写真撮影
// ============================================================

async function takePhoto() {

  if (!stream) {

    await startCamera();

    if (!stream)
      return;
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    async blob => {

      if (!blob)
        return;


      const fileName =
        "photo_" +
        formatDate() +
        ".jpg";


      await uploadFile(
        blob,
        fileName
      );

    },
    "image/jpeg",
    .92
  );
}


// ============================================================
// 動画撮影開始
// ============================================================

function startRecording() {

  if (!stream) {

    status.textContent =
      "先にカメラを開始してください";

    return;
  }


  recordedChunks = [];


  let mimeType = "";


  const types = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm",

    "video/mp4"

  ];


  for (
    const type of types
  ) {

    if (
      MediaRecorder
        .isTypeSupported(type)
    ) {

      mimeType =
        type;

      break;
    }
  }


  try {

    mediaRecorder =
      new MediaRecorder(
        stream,
        mimeType
          ? {
              mimeType
            }
          : undefined
      );

  } catch (error) {

    status.textContent =
      "この端末では動画録画に対応していません";

    return;
  }


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );
      }
    };


  mediaRecorder.onstop =
    async () => {

      stopRecordingUI();


      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              mimeType ||
              "video/webm"
          }
        );


      if (
        blob.size >
        MAX_FILE_SIZE
      ) {

        status.textContent =
          "20MBを超えたため保存できません";

        return;
      }


      const extension =
        blob.type.includes("mp4")
          ? "mp4"
          : "webm";


      const fileName =
        "video_" +
        formatDate() +
        "." +
        extension;


      await uploadFile(
        blob,
        fileName
      );
    };


  mediaRecorder.start(
    250
  );


  recordingSeconds =
    0;


  recording.classList.add(
    "active"
  );


  updateRecordTime();


  recordingTimer =
    setInterval(
      () => {

        recordingSeconds++;

        updateRecordTime();


        if (
          recordingSeconds >=
          MAX_RECORDING_TIME
        ) {

          stopRecording();
        }

      },
      1000
    );


  status.textContent =
    "録画中...";
}


// ============================================================
// 録画停止
// ============================================================

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    mediaRecorder.stop();
  }
}


// ============================================================
// 録画UI
// ============================================================

function stopRecordingUI() {

  recording.classList.remove(
    "active"
  );


  clearInterval(
    recordingTimer
  );


  recordingTimer =
    null;


  recordTime.textContent =
    "00:00";
}


function updateRecordTime() {

  const min =
    Math.floor(
      recordingSeconds / 60
    )
      .toString()
      .padStart(2, "0");


  const sec =
    (
      recordingSeconds % 60
    )
      .toString()
      .padStart(2, "0");


  recordTime.textContent =
    min +
    ":" +
    sec;
}


// ============================================================
// Blob → Base64
// ============================================================

function blobToBase64(
  blob
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            reader.result;


          resolve(
            result.split(",")[1]
          );
        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


// ============================================================
// ファイルアップロード
// ============================================================

async function uploadFile(
  blob,
  fileName
) {

  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    status.textContent =
      "20MBを超えています";

    return;
  }


  progressBox.style.display =
    "block";


  progressBar.style.width =
    "0%";


  try {

    status.textContent =
      "アップロードを準備しています";


    // --------------------------------------------------------
    // アップロード開始
    // --------------------------------------------------------

    await gasPost(
      "start",
      {

        fileName,

        mimeType:
          blob.type ||
          "application/octet-stream",

        totalSize:
          blob.size,

        deviceId

      }
    );


    // start POSTはiframeのonloadだけでは
    // uploadIdを取得できないため、
    // 一意な名前を利用してDrive状態を扱う方式ではなく、
    // ここではクライアント側でuploadIdを取得する必要がある。
    //
    // そのため、実際にはstart専用JSONPを使用する。
    //
    // 下のstartUploadJSONP()を使用する。


    const start =
      await startUploadJSONP(
        blob,
        fileName
      );


    if (
      !start ||
      !start.uploadId
    ) {

      throw new Error(
        "アップロードIDを取得できませんでした"
      );
    }


    const uploadId =
      start.uploadId;


    const totalChunks =
      Math.ceil(
        blob.size /
        CHUNK_SIZE
      );


    // --------------------------------------------------------
    // チャンクを順番に送信
    // --------------------------------------------------------

    for (
      let i = 0;
      i < totalChunks;
      i++
    ) {

      const startByte =
        i *
        CHUNK_SIZE;


      const endByte =
        Math.min(
          startByte +
          CHUNK_SIZE,
          blob.size
        );


      const chunk =
        blob.slice(
          startByte,
          endByte
        );


      const base64 =
        await blobToBase64(
          chunk
        );


      progressText.textContent =
        "アップロード中 " +
        (i + 1) +
        " / " +
        totalChunks;


      progressBar.style.width =
        (
          ((i + 1) /
            totalChunks) *
          100
        ) +
        "%";


      await gasPost(
        "chunk",
        {

          uploadId,

          chunkIndex:
            i,

          totalChunks,

          data:
            base64

        }
      );


      // 次のチャンクへ
      await sleep(150);
    }


    status.textContent =
      "保存が完了しました";


    progressBar.style.width =
      "100%";


    await sleep(500);


    await loadGallery();

  } catch (error) {

    console.error(error);

    status.textContent =
      "アップロードエラー: " +
      error.message;

  } finally {

    setTimeout(
      () => {

        progressBox.style.display =
          "none";

      },
      1000
    );
  }
}


// ============================================================
// アップロード開始ID取得
// ============================================================

function startUploadJSONP(
  blob,
  fileName
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "startCallback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const params =
        new URLSearchParams({

          action:
            "start",

          callback:
            callbackName,

          fileName,

          mimeType:
            blob.type ||
            "application/octet-stream",

          totalSize:
            blob.size,

          deviceId

        });


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "GASが応答しません"
              )
            );

          },
          30000
        );


      window[callbackName] =
        data => {

          clearTimeout(timer);

          cleanup();

          if (
            data &&
            data.success
          ) {

            resolve(data);

          } else {

            reject(
              new Error(
                data?.error ||
                "アップロード開始に失敗しました"
              )
            );
          }
        };


      script.src =
        GAS_URL +
        "?" +
        params.toString();


      script.onerror =
        () => {

          clearTimeout(timer);

          cleanup();

          reject(
            new Error(
              "GASへの接続に失敗しました"
            )
          );
        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        delete window[
          callbackName
        ];

        script.remove();
      }

    }
  );
}


// ============================================================
// ギャラリー読み込み
// ============================================================

async function loadGallery() {

  gallery.innerHTML =
    "<p>読み込み中...</p>";


  try {

    const result =
      await gasGet(
        "list",
        {
          deviceId
        }
      );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result?.error ||
        "取得できませんでした"
      );
    }


    let files =
      result.files || [];


    if (
      currentTab === "mine"
    ) {

      files =
        files.filter(
          file =>
            file.mine
        );
    }


    if (
      currentTab === "shared"
    ) {

      files =
        files.filter(
          file =>
            !file.mine
        );
    }


    gallery.innerHTML = "";


    if (
      files.length === 0
    ) {

      gallery.innerHTML =
        "<p>メディアがありません</p>";

      return;
    }


    for (
      const file of files
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "media";


      if (
        file.mimeType
          .startsWith("image/")
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.alt =
          file.name;


        // Drive画像を表示
        img.src =
          "https://drive.google.com/thumbnail?id=" +
          encodeURIComponent(
            file.id
          ) +
          "&sz=w800";


        element.appendChild(
          img
        );

      } else {

        const video =
          document.createElement(
            "div"
          );


        video.className =
          "video-thumb";

        video.textContent =
          "🎥";

        element.appendChild(
          video
        );
      }


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "media-label";


      label.textContent =
        file.mine
          ? "自分"
          : "共有";


      element.appendChild(
        label
      );


      element.onclick =
        () => openMedia(file);


      gallery.appendChild(
        element
      );
    }

  } catch (error) {

    console.error(error);

    gallery.innerHTML =
      "<p>ギャラリーを読み込めませんでした</p>";
  }
}


// ============================================================
// メディア表示
// ============================================================

async function openMedia(
  file
) {

  selectedMedia =
    file;


  modal.classList.add(
    "active"
  );


  modalMedia.innerHTML =
    "読み込み中...";


  if (
    file.mimeType
      .startsWith("image/")
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "modal-media";


    img.src =
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(
        file.id
      ) +
      "&sz=w2000";


    modalMedia.innerHTML =
      "";

    modalMedia.appendChild(
      img
    );

  } else {

    const video =
      document.createElement(
        "video"
      );


    video.className =
      "modal-media";

    video.controls =
      true;

    video.playsInline =
      true;


    video.src =
      "https://drive.google.com/uc?export=download&id=" +
      encodeURIComponent(
        file.id
      );


    modalMedia.innerHTML =
      "";

    modalMedia.appendChild(
      video
    );
  }
}

// ============================================================
// ユーティリティ
// ============================================================

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


function formatDate() {

  const d =
    new Date();


  return (
    d.getFullYear() +
    String(
      d.getMonth() + 1
    ).padStart(2, "0") +
    String(
      d.getDate()
    ).padStart(2, "0") +
    "_" +
    String(
      d.getHours()
    ).padStart(2, "0") +
    String(
      d.getMinutes()
    ).padStart(2, "0") +
    String(
      d.getSeconds()
    ).padStart(2, "0")
  );
}
