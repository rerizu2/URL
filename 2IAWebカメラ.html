<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>共有カメラ</title>


<style>

/* =========================================
   基本
========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
  color: #fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button {
  font-family: inherit;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  background: #000;
}


/* =========================================
   カメラ
========================================= */

#cameraPage {
  position: absolute;
  inset: 0;
  background: #000;
}

#camera {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #000;
}


/* =========================================
   上部
========================================= */

.topBar {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  z-index: 10;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    18px
    12px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.65),
      transparent
    );
}

.topTitle {
  font-size: 16px;
  font-weight: 600;
}

.topButtons {
  display: flex;
  gap: 10px;
}

.circleButton {
  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  background:
    rgba(0,0,0,.45);

  color: #fff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;

  backdrop-filter: blur(10px);
}


/* =========================================
   モード
========================================= */

.modeSelector {
  position: absolute;

  top:
    calc(
      env(safe-area-inset-top) +
      68px
    );

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 10;

  display: flex;

  gap: 5px;

  padding: 5px;

  border-radius: 30px;

  background:
    rgba(0,0,0,.45);

  backdrop-filter: blur(12px);
}

.modeButton {
  border: 0;

  border-radius: 22px;

  padding:
    8px 18px;

  color: #fff;

  background:
    transparent;

  font-size: 13px;
}

.modeButton.active {
  background: #fff;
  color: #000;
}


/* =========================================
   フォーカス
========================================= */

#focusBox {
  position: absolute;

  width: 80px;
  height: 80px;

  border:
    2px solid
    rgba(255,255,255,.9);

  border-radius: 8px;

  transform:
    translate(-50%,-50%);

  display: none;

  z-index: 8;

  pointer-events: none;
}


/* =========================================
   ズーム
========================================= */

.zoomBox {
  position: absolute;

  left: 50%;
  bottom: 170px;

  transform:
    translateX(-50%);

  z-index: 10;

  display: flex;

  gap: 7px;
}

.zoomButton {
  width: 38px;
  height: 38px;

  border: 0;

  border-radius: 50%;

  color: #fff;

  background:
    rgba(0,0,0,.45);

  backdrop-filter: blur(8px);
}

.zoomButton.active {
  background: #fff;
  color: #000;
}


/* =========================================
   下部
========================================= */

.bottomBar {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 10;

  padding:
    18px
    24px
    calc(
      env(safe-area-inset-bottom) +
      22px
    );

  display: flex;

  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.7),
      transparent
    );
}

.bottomSide {
  width: 60px;

  display: flex;
  justify-content: center;
}

.shutter {
  width: 76px;
  height: 76px;

  border:
    5px solid #fff;

  border-radius: 50%;

  background: transparent;

  position: relative;
}

.shutter::after {
  content: "";

  position: absolute;

  inset: 6px;

  border-radius: 50%;

  background: #fff;

  transition: .2s;
}

.shutter.recording::after {
  inset: 19px;
  border-radius: 10px;
}

.smallButton {
  width: 48px;
  height: 48px;

  border: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,.45);

  color: #fff;

  font-size: 20px;

  backdrop-filter: blur(10px);
}


/* =========================================
   録画時間
========================================= */

#recordTime {
  position: absolute;

  top:
    calc(
      env(safe-area-inset-top) +
      120px
    );

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 10;

  padding:
    7px 14px;

  border-radius: 20px;

  background:
    rgba(220,0,0,.8);

  display: none;

  font-size: 13px;
}


/* =========================================
   ロック
========================================= */

#lockScreen {
  position: absolute;

  inset: 0;

  z-index: 100;

  background:
    radial-gradient(
      circle at center,
      #202020,
      #000 70%
    );

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  text-align: center;

  padding: 30px;
}

.lockIcon {
  font-size: 60px;
  margin-bottom: 20px;
}

.lockTitle {
  font-size: 22px;
  font-weight: 700;

  margin-bottom: 10px;
}

.lockText {
  color: #bbb;

  line-height: 1.7;
}



/* =========================================
   ギャラリー：iPhone「写真」風
========================================= */

#galleryPage {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: #000;
  color: #fff;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.galleryHeader {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 62px;
  padding:
    calc(env(safe-area-inset-top) + 8px)
    14px
    8px;
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.galleryTitle {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.3px;
}

.galleryClose {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #292929;
  color: #fff;
  font-size: 24px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.galleryTabs {
  position: sticky;
  top: 62px;
  z-index: 19;
  display: flex;
  gap: 7px;
  padding: 7px 12px 10px;
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  overflow-x: auto;
  scrollbar-width: none;
}

.galleryTabs::-webkit-scrollbar {
  display: none;
}

.galleryTab {
  flex: 0 0 auto;
  border: 0;
  padding: 8px 15px;
  border-radius: 18px;
  color: #c9c9c9;
  background: #252525;
  font-size: 13px;
  font-weight: 600;
}

.galleryTab.active {
  color: #000;
  background: #fff;
}

.gallerySectionTitle {
  padding: 14px 14px 8px;
  font-size: 17px;
  font-weight: 700;
}

.galleryGrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  padding: 0 2px 18px;
}

.mediaCard {
  position: relative;
  aspect-ratio: 1 / 1;
  background: #202020;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
}

.mediaCard img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .18s ease, transform .18s ease;
}

.mediaCard img.loaded {
  opacity: 1;
}

.mediaCard:active img {
  transform: scale(.97);
}

.thumbnailLoading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(
      135deg,
      #1b1b1b,
      #2a2a2a
    );
  color: #777;
  font-size: 24px;
}

.thumbnailLoading::after {
  content: "";
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.18);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

.videoPlaceholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(
      135deg,
      #222,
      #444
    );
  font-size: 38px;
}

.videoBadge {
  position: absolute;
  left: 7px;
  bottom: 7px;
  min-width: 27px;
  height: 27px;
  padding: 0 7px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.72);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
}

.mediaMine {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 10px;
  padding: 4px 7px;
  border-radius: 12px;
  background: rgba(0,0,0,.68);
}

/* =========================================
   写真・動画の個別表示：iPhone風
========================================= */

#previewPage {
  position: absolute;
  inset: 0;
  z-index: 200;
  background: #000;
  display: none;
  overflow: hidden;
}

#previewContent {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:
    calc(env(safe-area-inset-top) + 58px)
    0
    calc(env(safe-area-inset-bottom) + 92px);
}

#previewContent img,
#previewContent video {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.previewTop {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  min-height: 62px;
  padding:
    calc(env(safe-area-inset-top) + 8px)
    12px
    8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.82),
    rgba(0,0,0,0)
  );
}

.previewBack {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(42,42,42,.92);
  color: #fff;
  font-size: 25px;
  line-height: 1;
}

.previewInfo {
  flex: 1;
  min-width: 0;
  margin: 0 12px;
  text-align: center;
}

.previewName {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
  font-weight: 600;
}

.previewDate {
  margin-top: 2px;
  color: #aaa;
  font-size: 11px;
}

.previewTopSpacer {
  width: 40px;
  height: 40px;
}

.previewBottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  padding:
    12px
    18px
    calc(env(safe-area-inset-bottom) + 14px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: linear-gradient(
    to top,
    rgba(0,0,0,.86),
    rgba(0,0,0,0)
  );
}

.actionButton {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.13);
  color: #fff;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.actionButton span {
  display: none;
}

.actionButton.danger {
  background: rgba(220,40,40,.82);
}

.previewHint {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 72px);
  transform: translateX(-50%);
  color: rgba(255,255,255,.55);
  font-size: 11px;
  pointer-events: none;
}

@media (min-width:700px) {
  .galleryGrid {
    grid-template-columns: repeat(6, 1fr);
  }
}

@media (min-width:1100px) {
  .galleryGrid {
    grid-template-columns: repeat(7, 1fr);
  }
}


/* =========================================
   ローディング
========================================= */

#loading {
  position: fixed;

  inset: 0;

  z-index: 500;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background:
    rgba(0,0,0,.72);

  backdrop-filter: blur(5px);
}

.loader {
  width: 44px;
  height: 44px;

  border:
    4px solid
    rgba(255,255,255,.2);

  border-top-color: #fff;

  border-radius: 50%;

  animation:
    spin .8s linear infinite;

  margin-bottom: 15px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

#loadingText {
  font-size: 14px;
}


/* =========================================
   エラー
========================================= */

#errorMessage {
  position: fixed;

  left: 15px;
  right: 15px;
  bottom: 20px;

  z-index: 600;

  display: none;

  padding:
    14px 16px;

  border-radius: 14px;

  background:
    rgba(220,40,40,.95);

  color: #fff;

  font-size: 13px;

  line-height: 1.5;
}


/* =========================================
   PC
========================================= */

@media (min-width:700px) {

  .galleryGrid {
    grid-template-columns:
      repeat(5,1fr);
  }

}

</style>

</head>


<body>

<div id="app">


<!-- =====================================
     カメラ
===================================== -->

<div id="cameraPage">

  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>


  <div id="focusBox"></div>


  <div class="topBar">

      共有カメラ
    </div>


    <div class="topButtons">

      <button
        class="circleButton"
        id="torchButton"

        🖼️

<!-- =====================================

===================================== -->

<div id="lockScreen">

<!-- =====================================
     ギャラリー
===================================== -->

<div id="galleryPage">

  <div class="galleryHeader">

      ギャラリー

    <button

    <button

<!-- =====================================
     プレビュー
===================================== -->

<div id="previewPage">

  <div class="previewTop">

    <button
      class="previewBack"
      id="previewClose"
      aria-label="戻る"

      ‹

    <div class="previewInfo">
      <div class="previewName" id="previewName">

<!-- =====================================
     ローディング
===================================== -->

<div id="loading">

  <div class="loader"></div>

  <div id="loadingText">
    処理中...
  </div>

</div>


<div id="errorMessage"></div>

</div>


<script>

/*************************************************
 * GAS URL
 *
 * ★ここだけ変更
 *************************************************/

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwIIvVi2W8MWRac0SHN-kN6ff9E6rEiZihW7SZodpg5uoWcKl-vYnZJ8tJ6_axFILhYhQ/exec";


/*************************************************
 * 設定
 *************************************************/

const MAX_FILE_SIZE =
  20 * 1024 * 1024;

const CHUNK_SIZE =
  256 * 1024;

const MAX_RECORDING_TIME =
  60;


/*************************************************
 * 状態
 *************************************************/

let cameraStream =
  null;

let currentMode =
  "photo";

let facingMode =
  "environment";

let currentZoom =
  1;

let torchEnabled =
  false;

let mediaRecorder =
  null;

let recordedChunks =
  [];

let recordingTimer =
  null;

let recordingSeconds =
  0;

let settings =
  null;

let mediaList =
  [];

let currentFilter =
  "all";

let currentPreview =
  null;

let currentMimeType =
  "";


/*************************************************
 * Device ID
 *************************************************/

function getDeviceId() {

  let id =
    localStorage.getItem(
      "sharedCameraDeviceId"
    );


  if (!id) {

    id =
      crypto.randomUUID
        ? crypto.randomUUID()
        : "device-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2);


    localStorage.setItem(
      "sharedCameraDeviceId",
      id
    );
  }


  return id;
}


/*************************************************
 * DOM
 *************************************************/

const camera =
  document.getElementById(
    "camera"
  );

const cameraPage =
  document.getElementById(
    "cameraPage"
  );

const lockScreen =
  document.getElementById(
    "lockScreen"
  );

const shutterButton =
  document.getElementById(
    "shutterButton"
  );

const recordTime =
  document.getElementById(
    "recordTime"
  );

const loading =
  document.getElementById(
    "loading"
  );

const loadingText =
  document.getElementById(
    "loadingText"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );

const galleryPage =
  document.getElementById(
    "galleryPage"
  );

const galleryGrid =
  document.getElementById(
    "galleryGrid"
  );

const previewPage =
  document.getElementById(
    "previewPage"
  );

const previewContent =
  document.getElementById(
    "previewContent"
  );


/*************************************************
 * Loading
 *************************************************/

function showLoading(
  text
) {

  loadingText.textContent =
    text ||
    "処理中...";

  loading.style.display =
    "flex";
}


function hideLoading() {

  loading.style.display =
    "none";
}


/*************************************************
 * Error
 *************************************************/

function showError(
  message
) {

  errorMessage.textContent =
    message;

  errorMessage.style.display =
    "block";


  setTimeout(
    () => {

      errorMessage.style.display =
        "none";

    },
    5000
  );
}


/*************************************************
 * JSONP
 *************************************************/

function jsonp(
  params
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      script.src =
        GAS_URL +
        "?" +
        query.toString();


      let finished =
        false;


      window[
        callbackName
      ] =
        data => {

          if (
            finished
          ) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          resolve(
            data
          );
        };


      script.onerror =
        () => {

          if (
            finished
          ) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              "GASとの通信に失敗しました"
            )
          );
        };


      document.body.appendChild(
        script
      );


      setTimeout(
        () => {

          if (
            finished
          ) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              "GAS通信がタイムアウトしました"
            )
          );

        },
        30000
      );

    }
  );
}

function stopCamera() {

          track.stop()
      );

    cameraStream =
      null;

/*************************************************
 * カメラ開始
 *************************************************/

async function startCamera() {

  if (
    !settings ||
    !settings.cameraEnabled
  ) {

    disableCamera();

    return false;
  }


  try {

    stopCamera();


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio: false,

          video: {

            facingMode:
              facingMode,

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }
          }

        });


    camera.srcObject =
      cameraStream;


    await camera.play();


    await applyZoom();


    return true;


  } catch (error) {

    console.error(
      error
    );


    showError(
      "カメラを起動できませんでした。カメラの使用許可を確認してください。"
    );


    return false;
  }
}


/*************************************************
 * ズーム
 *************************************************/

async function applyZoom() {

  if (
    !cameraStream
  ) {
    return;
  }


  const track =
    cameraStream
      .getVideoTracks()[0];


  if (!track) {
    return;
  }


  const capabilities =
    track.getCapabilities
      ? track.getCapabilities()
      : {};


  if (
    capabilities.zoom
  ) {

    try {

      await track.applyConstraints({

        advanced: [

          {
            zoom:
              currentZoom
          }

        ]

      });

    } catch (
      error
    ) {

      console.log(
        error
      );
    }
  }
}

 *************************************************/

async function takePhoto() {

  if (
    !cameraStream
  ) {

    const started =
      await startCamera();


    if (!started) {
      return;
    }
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    async blob => {

      if (!blob) {

        showError(
          "写真を作成できませんでした"
        );

        return;
      }


      await uploadFile(
        blob,
        "photo_" +
        formatDate(
          new Date()
        ) +
        ".jpg",
        "image/jpeg"
      );

    },
    "image/jpeg",
    0.92
  );
}


/*************************************************
 * 動画形式
 *************************************************/

function getVideoMimeType() {

  const types = [

    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

    "video/mp4",

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];


  for (
    const type of types
  ) {

    if (
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;
    }
  }


  return "";
}


/*************************************************
 * 録画開始
 *************************************************/

async function startRecording() {

  if (
    !cameraStream
  ) {

    const started =
      await startCamera();


    if (!started) {
      return;
    }
  }


  const mimeType =
    getVideoMimeType();


  if (!mimeType) {

    showError(
      "動画録画に対応していません"
    );

    return;
  }


  currentMimeType =
    mimeType;


  recordedChunks =
    [];


  mediaRecorder =
    new MediaRecorder(
      cameraStream,
      {

        mimeType:
          mimeType,

        videoBitsPerSecond:
          1200000,

        audioBitsPerSecond:
          96000

      }
    );


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size
      ) {

        recordedChunks.push(
          event.data
        );


        const size =
          recordedChunks.reduce(
            (sum, chunk) =>
              sum +
              chunk.size,
            0
          );


        if (
          size >=
          MAX_FILE_SIZE *
          0.95
        ) {

          stopRecording();
        }
      }
    };


  mediaRecorder.onstop =
    async () => {

      clearInterval(
        recordingTimer
      );


      recordTime.style.display =
        "none";


      shutterButton
        .classList
        .remove(
          "recording"
        );


      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              currentMimeType
          }
        );


      if (
        blob.size >
        MAX_FILE_SIZE
      ) {

        showError(
          "動画が20MBを超えています"
        );


        await resumeCamera();

        return;
      }


      const extension =
        currentMimeType
          .includes("mp4")
          ? "mp4"
          : "webm";


      await uploadFile(
        blob,
        "video_" +
        formatDate(
          new Date()
        ) +
        "." +
        extension,
        currentMimeType
      );

    };


  mediaRecorder.start(
    1000
  );


  recordingSeconds =
    0;


  recordTime.textContent =
    "00:00";


  recordTime.style.display =
    "block";


  shutterButton
    .classList
    .add(
      "recording"
    );


  recordingTimer =
    setInterval(
      () => {

        recordingSeconds++;


        const min =
          String(
            Math.floor(
              recordingSeconds /
              60
            )
          ).padStart(
            2,
            "0"
          );


        const sec =
          String(
            recordingSeconds %
            60
          ).padStart(
            2,
            "0"
          );


        recordTime.textContent =
          min +
          ":" +
          sec;


        if (
          recordingSeconds >=
          MAX_RECORDING_TIME
        ) {

          stopRecording();
        }

      },
      1000
    );
}


/*************************************************
 * 録画停止
 *************************************************/

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state ===
      "recording"
  ) {

    mediaRecorder.stop();
  }
}


/*************************************************
 * ファイルアップロード
 *************************************************/

async function uploadFile(
  blob,
  fileName,
  mimeType
) {

  try {

    showLoading(
      "保存しています..."
    );


    const check =
      await jsonp({
        action:
          "settings"
      });


    if (
      !check.success ||
      !check.cameraEnabled
    ) {

      hideLoading();

      disableCamera();

      alert(
        "現在カメラ機能が無効です"
      );

      return;
    }


    settings =
      check;


    if (
      blob.size >
      MAX_FILE_SIZE
    ) {

      throw new Error(
        "20MBを超えています"
      );
    }


    /*
     * アップロード開始
     */

    const start =
      await jsonp({

        action:
          "start",

        fileName:
          fileName,

        mimeType:
          mimeType,

        totalSize:
          blob.size,

        deviceId:
          getDeviceId()

      });


    if (
      !start.success
    ) {

      throw new Error(
        start.error
      );
    }


    /*
     * Blobをチャンクに分割
     */

    const totalChunks =
      Math.ceil(
        blob.size /
        CHUNK_SIZE
      );


    for (
      let i = 0;
      i < totalChunks;
      i++
    ) {

      const begin =
        i *
        CHUNK_SIZE;


      const end =
        Math.min(
          begin +
          CHUNK_SIZE,
          blob.size
        );


      const chunk =
        blob.slice(
          begin,
          end
        );


      const base64 =
        await blobToBase64(
          chunk
        );


      const data =
        base64.split(",")[1];


      showLoading(
        "保存しています... " +
        (i + 1) +
        " / " +
        totalChunks
      );


      await sendChunk(
        start.uploadId,
        i,
        totalChunks,
        data
      );
    }


    /*
     * GAS側の完成を確認
     */

    let completed =
      false;


    for (
      let i = 0;
      i < 15;
      i++
    ) {

      const status =
        await jsonp({

          action:
            "status",

          uploadId:
            start.uploadId

        });


      if (
        status.success &&
        status.completed &&
        status.fileId
      ) {

        completed =
          true;

        break;
      }


      await sleep(
        1000
      );
    }


    if (
      !completed
    ) {

      /*
       * 最後のチャンクのレスポンスから
       * 完成している場合もあるため、
       * 一覧を確認
       */

      await sleep(
        1500
      );
    }


    hideLoading();


    /*
     * 完了
     */

    alert(
      "保存できました！"
    );


    /*
     * ★アラートを閉じた後に復帰
     */

    await resumeCamera();


    /*
     * ギャラリー更新
     */

    await loadGallery(
      true
    );


  } catch (
    error
  ) {

    hideLoading();


    console.error(
      error
    );


    alert(
      "保存に失敗しました\n\n" +
      error.message
    );


    await resumeCamera();
  }
}


/*************************************************
 * チャンク送信
 *
 * GAS側のレスポンスを待つ
 *************************************************/

function sendChunk(
  uploadId,
  index,
  totalChunks,
  data
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.createElement(
          "iframe"
        );


      const name =
        "upload_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      iframe.name =
        name;


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        GAS_URL;


      form.target =
        name;


      const values = {

        action:
          "chunk",

        uploadId:
          uploadId,

        chunkIndex:
          index,

        totalChunks:
          totalChunks,

        data:
          data

      };


      Object.keys(
        values
      ).forEach(
        key => {

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "hidden";

          input.name =
            key;

          input.value =
            values[key];


          form.appendChild(
            input
          );

        }
      );


      document.body.appendChild(
        form
      );


      let done =
        false;


      const cleanup =
        () => {

          form.remove();

          iframe.remove();
        };


      iframe.onload =
        () => {

          if (done) {
            return;
          }


          done =
            true;


          cleanup();


          resolve();

        };


      iframe.onerror =
        () => {

          if (done) {
            return;
          }


          done =
            true;


          cleanup();


          reject(
            new Error(
              "チャンク送信に失敗しました"
            )
          );

        };


      form.submit();


      /*
       * GASの処理が長い場合
       */

      setTimeout(
        () => {

          if (done) {
            return;
          }


          done =
            true;


          cleanup();


          resolve();

        },
        30000
      );

    }
  );
}


/*************************************************
 * Blob → Base64
 *************************************************/

function blobToBase64(
  blob
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );
    }
  );
}


/*************************************************
 * 保存後カメラ復帰
 *************************************************/

async function resumeCamera() {

  try {

    const result =
      await jsonp({
        action:
          "settings"
      });


    if (
      !result.success ||
      !result.cameraEnabled
    ) {

      disableCamera();

      return;
    }


    settings =
      result;


    if (
      !cameraStream ||
      cameraStream
        .getVideoTracks()
        .every(
          track =>
            track.readyState ===
            "ended"
        )
    ) {

      await startCamera();

    } else {

      try {

        await camera.play();

      } catch (
        error
      ) {

        await startCamera();
      }
    }

  } catch (
    error
  ) {

    console.error(
      error
    );


    /*
     * それでもカメラ復帰
     */

    try {

      await startCamera();

    } catch (
      e
    ) {

      console.error(e);
    }
  }
}

/*************************************************
 * ギャラリー表示
 *************************************************/

const thumbnailCache = new Map();

async function loadThumbnail(item, img, loading) {

  if (thumbnailCache.has(item.id)) {

    img.src = thumbnailCache.get(item.id);
    img.classList.add("loaded");

    if (loading) {
      loading.remove();
    }

    return;
  }

  try {

    const result =
      await jsonp({
        action: "file",
        fileId: item.id
      });

    if (!result || !result.success) {
      throw new Error(
        result && result.error
          ? result.error
          : "画像を読み込めませんでした"
      );
    }

    if (
      result.type === "image" &&
      result.data
    ) {

      const src =
        "data:" +
        result.mimeType +
        ";base64," +
        result.data;

      thumbnailCache.set(
        item.id,
        src
      );

      img.src = src;
      img.onload = () => {
        img.classList.add("loaded");
        if (loading) {
          loading.remove();
        }
      };

      return;
    }

    /*
     * 5MBを超える画像はGAS側で
     * Base64を返さないためDriveサムネイルを使用
     */
    if (
      item.mimeType &&
      item.mimeType.startsWith("image/")
    ) {

      if (
        result.thumbnailData
      ) {

        img.src =
          "data:" +
          (
            result.thumbnailMimeType ||
            "image/jpeg"
          ) +
          ";base64," +
          result.thumbnailData;

      } else {

        img.src =
          "https://drive.google.com/thumbnail?id=" +
          encodeURIComponent(item.id) +
          "&sz=w500";
      }

      img.onload = () => {
        img.classList.add("loaded");
        if (loading) {
          loading.remove();
        }
      };

      img.onerror = () => {
        if (loading) {
          loading.textContent = "📷";
          loading.style.fontSize = "28px";
        }
      };

      return;
    }

    throw new Error(
      "画像データがありません"
    );

  } catch (error) {

    console.error(
      "thumbnail error:",
      item.id,
      error
    );

    if (loading) {
      loading.textContent = "📷";
      loading.style.fontSize = "28px";
    }
  }
}


function renderGallery() {

  galleryGrid.innerHTML = "";

  let list = mediaList;

  if (currentFilter === "mine") {
    list =
      mediaList.filter(
        item => item.mine
      );
  }

  if (currentFilter === "shared") {
    list =
      mediaList.filter(
        item => !item.mine
      );
  }

  if (list.length === 0) {

    galleryGrid.innerHTML = `
      <div style="
        grid-column:1/-1;
        min-height:240px;
        padding:70px 20px;
        text-align:center;
        color:#888;
        font-size:14px;
      ">
        <div style="
          font-size:42px;
          margin-bottom:14px;
        ">📷</div>
        写真・動画がありません
      </div>
    `;

    return;
  }

  const observer =
    "IntersectionObserver" in window
      ? new IntersectionObserver(
          entries => {
            entries.forEach(entry => {

              if (!entry.isIntersecting) {
                return;
              }

              const card =
                entry.target;

              observer.unobserve(card);

              const item =
                card.__mediaItem;

              if (!item) {
                return;
              }

              if (
                item.mimeType &&
                item.mimeType.startsWith("image/")
              ) {

                loadThumbnail(
                  item,
                  card.querySelector("img"),
                  card.querySelector(".thumbnailLoading")
                );

              }
            });
          },
          {
            root: galleryPage,
            rootMargin: "500px 0px"
          }
        )
      : null;

  list.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "mediaCard";

    card.__mediaItem =
      item;

    if (
      item.mimeType &&
      item.mimeType.startsWith("image/")
    ) {

      const loading =
        document.createElement("div");

      loading.className =
        "thumbnailLoading";

      card.appendChild(
        loading
      );

      const img =
        document.createElement("img");

      img.alt =
        item.name || "写真";

      img.loading =
        "lazy";

      card.appendChild(
        img
      );

      if (observer) {
        observer.observe(card);
      } else {
        loadThumbnail(
          item,
          img,
          loading
        );
      }

    } else {

      const video =
        document.createElement("div");

      video.className =
        "videoPlaceholder";

      video.textContent =
        "🎥";

      card.appendChild(
        video
      );

      const badge =
        document.createElement("div");

      badge.className =
        "videoBadge";

      badge.textContent =
        "▶";

      card.appendChild(
        badge
      );
    }

    if (item.mine) {

      const mine =
        document.createElement("div");

      mine.className =
        "mediaMine";

      mine.textContent =
        "自分";

      card.appendChild(
        mine
      );
    }

    card.addEventListener(
      "click",
      () => openPreview(item)
    );

    galleryGrid.appendChild(
      card
    );
  });
}

    ) {

        );

      ) {

          (
            result.thumbnailMimeType ||
            "image/jpeg"
          ) +
          ";base64," +
          result.thumbnailData;

      } else {

        img.src =
          "https://drive.google.com/thumbnail?id=" +
          encodeURIComponent(item.id) +
          "&sz=w1200";
      }

      img.alt =
        result.name;

      previewContent.appendChild(
        img
      );

    }

    /*
     * 動画
     */
    else if (
      result.type ===
      "video"
    ) {

      const video =
        document.createElement(
          "video"
        );

      video.controls =
        true;

      video.playsInline =
        true;

      video.preload =
        "metadata";

      video.src =
        result.downloadUrl;

      previewContent.appendChild(
        video
      );

      video.addEventListener(
        "error",
        () => {

          previewContent.innerHTML = `
            <div style="
              text-align:center;
              color:#aaa;
              padding:30px;
            ">
              <div style="
                font-size:50px;
                margin-bottom:15px;
              ">🎥</div>

              動画をブラウザ内で
              再生できませんでした。

              <br><br>

              Google Driveから開いてください。
            </div>
          `;

        }
      );
    }

    document
      .getElementById(
        "deleteButton"
      )
      .style.display =
        item.mine
          ? "inline-flex"
          : "none";

  } catch (
    error
  ) {

    previewContent.innerHTML = `
      <div style="
        color:#ff7777;
        text-align:center;
        padding:30px;
      ">
        読み込みに失敗しました
        <br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;
  }
}


function formatGalleryDate(
  timestamp
) {

  const date =
    new Date(
      Number(timestamp)
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "";
  }

  return new Intl.DateTimeFormat(
    "ja-JP",
    {
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(date);
}


/*************************************************
 * HTMLエスケープ
 *************************************************/

function escapeHtml(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

 *************************************************/

document
  .getElementById(
    "deleteButton"
  )
  .addEventListener(
    "click",
    async () => {

      if (
        !currentPreview ||
        !currentPreview.mine
      ) {

        return;
      }


      if (
        !confirm(
          "この写真・動画を削除しますか？"
        )
      ) {

        return;
      }


      try {

        showLoading(
          "削除しています..."
        );


        const result =
          await postDelete(
            currentPreview.id
          );


        hideLoading();


        if (
          !result.success
        ) {

          throw new Error(
            result.error
          );
        }


        alert(
          "削除しました"
        );


        previewPage.style.display =
          "none";


        currentPreview =
          null;


        await loadGallery(
          true
        );


        await resumeCamera();


      } catch (
        error
      ) {

        hideLoading();


        alert(
          "削除に失敗しました\n\n" +
          error.message
        );
      }
    }
  );


/*************************************************
 * Delete POST
 *************************************************/

function postDelete(
  fileId
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.createElement(
          "iframe"
        );


      const name =
        "delete_" +
        Date.now();


      iframe.name =
        name;


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        GAS_URL;


      form.target =
        name;


      const fields = {

        action:
          "delete",

        fileId:
          fileId,

        deviceId:
          getDeviceId()

      };


      Object.keys(
        fields
      ).forEach(
        key => {

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "hidden";

          input.name =
            key;

          input.value =
            fields[key];


          form.appendChild(
            input
          );

        }
      );


      document.body.appendChild(
        form
      );


      iframe.onload =
        () => {

          form.remove();

          iframe.remove();

          resolve({
            success:
              true
          });

        };


      iframe.onerror =
        () => {

          form.remove();

          iframe.remove();

          reject(
            new Error(
              "削除に失敗しました"
            )
          );

        };


      form.submit();

    }
  );
}

/*************************************************
 * Torch
 *************************************************/

document
  .getElementById(
    "torchButton"
  )
  .addEventListener(
    "click",
    async () => {

      if (
        !cameraStream
      ) {
        return;
      }


      const track =
        cameraStream
          .getVideoTracks()[0];


      if (!track) {
        return;
      }


      const capabilities =
        track.getCapabilities
          ? track.getCapabilities()
          : {};


      if (
        !capabilities.torch
      ) {

        showError(
          "ライト操作に対応していません"
        );

        return;
      }


      torchEnabled =
        !torchEnabled;


      await track
        .applyConstraints({

          advanced: [

            {
              torch:
                torchEnabled
            }

          ]

        });

    }
  );


/*************************************************
 * フォーカス
 *************************************************/

camera.addEventListener(
  "click",
  async event => {

    if (
      !cameraStream
    ) {
      return;
    }


    const rect =
      camera.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    const box =
      document.getElementById(
        "focusBox"
      );


    box.style.left =
      x + "px";


    box.style.top =
      y + "px";


    box.style.display =
      "block";


    setTimeout(
      () => {

        box.style.display =
          "none";

      },
      1000
    );

  }
);


/*************************************************
 * Visibility
 *************************************************/

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      if (
        !mediaRecorder ||
        mediaRecorder.state !==
          "recording"
      ) {

        await resumeCamera();
      }
    }

  }
);


/*************************************************
 * 待機
 *************************************************/

function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


/*************************************************
 * 日付
 *************************************************/

function formatDate(
  date
) {

  return (
    date.getFullYear() +
    String(
      date.getMonth() + 1
    ).padStart(2,"0") +
    String(
      date.getDate()
    ).padStart(2,"0") +
    "_" +
    String(
      date.getHours()
    ).padStart(2,"0") +
    String(
      date.getMinutes()
    ).padStart(2,"0") +
    String(
      date.getSeconds()
    ).padStart(2,"0")
  );
}
