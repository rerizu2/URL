<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no"
>

<title>GAS Smart Camera</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  color: #fff;

  font-family:
    Arial,
    sans-serif;

}

body {

  display: flex;

  flex-direction: column;

}


/* =====================================================
   上部
===================================================== */

#topBar {

  height: 60px;

  background:
    rgba(0,0,0,.9);

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 12px;

  flex-shrink: 0;

}

#title {

  font-size: 17px;

  font-weight: bold;

}

.topButton {

  width: 42px;

  height: 42px;

  border: none;

  border-radius: 50%;

  background:
    rgba(255,255,255,.15);

  color: white;

  font-size: 20px;

}


/* =====================================================
   カメラ
===================================================== */

#cameraArea {

  position: relative;

  flex: 1;

  min-height: 0;

  overflow: hidden;

  background: #000;

}

#video {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

  transform-origin: center;

}


/* =====================================================
   状態
===================================================== */

#status {

  position: absolute;

  top: 15px;

  left: 50%;

  transform:
    translateX(-50%);

  background:
    rgba(0,0,0,.65);

  padding:
    7px 15px;

  border-radius: 20px;

  font-size: 13px;

  white-space: nowrap;

  z-index: 10;

}


/* =====================================================
   ズーム
===================================================== */

#zoomArea {

  position: absolute;

  right: 10px;

  top: 50%;

  transform:
    translateY(-50%);

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 8px;

}

#zoomLabel {

  background:
    rgba(0,0,0,.7);

  padding:
    5px 8px;

  border-radius: 8px;

  font-size: 12px;

}

#zoom {

  height: 180px;

  writing-mode:
    vertical-lr;

  direction: rtl;

}


/* =====================================================
   録画時間
===================================================== */

#recordTimer {

  position: absolute;

  top: 55px;

  left: 50%;

  transform:
    translateX(-50%);

  color: red;

  font-weight: bold;

  font-size: 18px;

  display: none;

}


/* =====================================================
   下部
===================================================== */

#bottomBar {

  height: 130px;

  background:
    rgba(0,0,0,.95);

  flex-shrink: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 10px;

}


/* モード */

#modeArea {

  display: flex;

  gap: 8px;

}

.modeButton {

  border: none;

  background: #333;

  color: white;

  padding:
    8px 18px;

  border-radius: 20px;

}

.modeButton.active {

  background: white;

  color: black;

}


/* シャッター */

#shutter {

  width: 70px;

  height: 70px;

  border-radius: 50%;

  border: 6px solid white;

  background: white;

}

#shutter.recording {

  background: red;

}


/* =====================================================
   ロック
===================================================== */

#lockScreen {

  position: fixed;

  inset: 0;

  background: #111;

  z-index: 999;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 25px;

}

#lockScreen.hidden {

  display: none;

}

#lockIcon {

  font-size: 60px;

  margin-bottom: 20px;

}

#lockMessage {

  font-size: 17px;

  line-height: 1.7;

  margin-bottom: 20px;

}

#startButton {

  border: none;

  background: white;

  color: black;

  padding:
    15px 30px;

  border-radius: 30px;

  font-size: 17px;

  font-weight: bold;

}


/* =====================================================
   エラー
===================================================== */

#errorBox {

  position: fixed;

  left: 15px;

  right: 15px;

  bottom: 150px;

  background:
    rgba(180,0,0,.95);

  padding: 15px;

  border-radius: 12px;

  z-index: 1000;

  display: none;

  white-space: pre-wrap;

  font-size: 13px;

}

#errorBox.show {

  display: block;

}


/* =====================================================
   設定状態
===================================================== */

#settingStatus {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.95);

  z-index: 2000;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 25px;

}

#settingStatus.show {

  display: flex;

}

#settingPanel {

  width: 100%;

  max-width: 500px;

  background: #222;

  border-radius: 20px;

  padding: 25px;

}

#settingPanel h2 {

  margin-top: 0;

}

.settingItem {

  padding:
    12px 0;

  border-bottom:
    1px solid #444;

}

.ok {

  color: #4cff75;

}

.ng {

  color: #ff5c5c;

}

#closeSetting {

  margin-top: 20px;

  width: 100%;

  padding: 13px;

  border: none;

  border-radius: 12px;

}

</style>

</head>


<body>


<!-- =====================================================
     ロック
===================================================== -->

<div id="lockScreen">

  <div id="lockIcon">
    📷
  </div>

  <div id="lockMessage">

    カメラの設定を確認しています…

  </div>

  <button id="startButton">

    カメラを起動

  </button>

</div>


<!-- =====================================================
     上部
===================================================== -->

<div id="topBar">

  <button
    class="topButton"
    id="switchCamera"
  >
    🔄
  </button>

  <div id="title">
    GAS Smart Camera
  </div>

  <button
    class="topButton"
    id="checkSettings"
  >
    ⚙️
  </button>

</div>


<!-- =====================================================
     カメラ
===================================================== -->

<div id="cameraArea">

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <div id="status">
    設定確認中
  </div>

  <div id="recordTimer">
    00:00
  </div>

  <div id="zoomArea">

    <div id="zoomLabel">
      1.0x
    </div>

    <input
      id="zoom"
      type="range"
      min="1"
      max="5"
      step="0.1"
      value="1"
    >

  </div>

</div>


<!-- =====================================================
     下部
===================================================== -->

<div id="bottomBar">

  <div id="modeArea">

    <button
      class="modeButton active"
      id="photoMode"
    >
      📷 写真
    </button>

    <button
      class="modeButton"
      id="videoMode"
    >
      🎥 動画
    </button>

  </div>

  <button
    id="shutter"
  ></button>

</div>


<!-- =====================================================
     エラー
===================================================== -->

<div id="errorBox"></div>


<!-- =====================================================
     設定確認
===================================================== -->

<div id="settingStatus">

  <div id="settingPanel">

    <h2>
      ⚙️ カメラ設定
    </h2>

    <div
      class="settingItem"
      id="cameraSetting"
    >
      カメラ使用許可：確認中
    </div>

    <div
      class="settingItem"
      id="folderSetting"
    >
      Google Drive：確認中
    </div>

    <div
      class="settingItem"
      id="folderNameSetting"
    >
      フォルダ：確認中
    </div>

    <button
      id="closeSetting"
    >
      閉じる
    </button>

  </div>

</div>


<script>


/* =====================================================
   GAS URL
===================================================== */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxO5NOec9Iguu36_aF4ZownAY1yMzdV-nX1BXoOl7CFPFrkXXue3BSoM_1_2jf2jv6j8A/exec";


/*
  ファイルサイズ上限

  Base64化するとデータ量が増えるため、
  まずは15MB程度を推奨。
*/

const MAX_FILE_SIZE =
  15 * 1024 * 1024;


/* =====================================================
   DOM
===================================================== */

const video =
  document.getElementById(
    "video"
  );

const lockScreen =
  document.getElementById(
    "lockScreen"
  );

const lockMessage =
  document.getElementById(
    "lockMessage"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const shutter =
  document.getElementById(
    "shutter"
  );

const status =
  document.getElementById(
    "status"
  );

const errorBox =
  document.getElementById(
    "errorBox"
  );

const photoMode =
  document.getElementById(
    "photoMode"
  );

const videoMode =
  document.getElementById(
    "videoMode"
  );

const switchCamera =
  document.getElementById(
    "switchCamera"
  );

const zoom =
  document.getElementById(
    "zoom"
  );

const zoomLabel =
  document.getElementById(
    "zoomLabel"
  );

const recordTimer =
  document.getElementById(
    "recordTimer"
  );

const checkSettings =
  document.getElementById(
    "checkSettings"
  );

const settingStatus =
  document.getElementById(
    "settingStatus"
  );

const cameraSetting =
  document.getElementById(
    "cameraSetting"
  );

const folderSetting =
  document.getElementById(
    "folderSetting"
  );

const folderNameSetting =
  document.getElementById(
    "folderNameSetting"
  );

const closeSetting =
  document.getElementById(
    "closeSetting"
  );


/* =====================================================
   変数
===================================================== */

let stream = null;

let facingMode =
  "environment";

let currentMode =
  "photo";

let mediaRecorder = null;

let recordedChunks = [];

let recording = false;

let recordingStart = 0;

let timerInterval = null;

let currentZoom = 1;

let cameraEnabled = false;


/* =====================================================
   エラー
===================================================== */

function showError(message) {

  console.error(message);

  errorBox.textContent =
    message;

  errorBox.classList.add(
    "show"
  );

  setTimeout(() => {

    errorBox.classList.remove(
      "show"
    );

  }, 8000);

}


/* =====================================================
   設定確認
===================================================== */

function checkGASSettings() {

  return new Promise(
    (resolve) => {

      const callbackName =
        "gasCallback_" +
        Date.now();

      window[callbackName] =
        function(data) {

          delete window[
            callbackName
          ];

          script.remove();

          resolve(data);

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          script.remove();

          resolve({

            success: false,

            message:
              "GASへの接続に失敗しました。"

          });

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   設定画面
===================================================== */

async function showSettings() {

  settingStatus.classList.add(
    "show"
  );

  cameraSetting.textContent =
    "カメラ使用許可：確認中";

  folderSetting.textContent =
    "Google Drive：確認中";

  folderNameSetting.textContent =
    "フォルダ：確認中";


  const result =
    await checkGASSettings();


  if (!result.success) {

    cameraSetting.textContent =
      "❌ GAS接続エラー";

    cameraSetting.className =
      "settingItem ng";

    folderSetting.textContent =
      "❌ 設定を取得できません";

    folderSetting.className =
      "settingItem ng";

    folderNameSetting.textContent =
      result.message || "";

    return;

  }


  /* カメラ */

  if (result.cameraEnabled) {

    cameraSetting.textContent =
      "✅ カメラ使用許可：ON";

    cameraSetting.className =
      "settingItem ok";

  } else {

    cameraSetting.textContent =
      "❌ カメラ使用許可：OFF";

    cameraSetting.className =
      "settingItem ng";

  }


  /* Drive */

  if (result.folderExists) {

    folderSetting.textContent =
      "✅ Google Drive：接続OK";

    folderSetting.className =
      "settingItem ok";

    folderNameSetting.textContent =
      "📁 フォルダ：" +
      result.folderName;

  } else {

    folderSetting.textContent =
      "❌ Google Drive：接続失敗";

    folderSetting.className =
      "settingItem ng";

    folderNameSetting.textContent =
      result.folderError ||
      "フォルダを確認できません。";

  }

}


checkSettings.addEventListener(
  "click",
  showSettings
);


closeSetting.addEventListener(
  "click",
  () => {

    settingStatus.classList.remove(
      "show"
    );

  }
);


/* =====================================================
   起動時設定確認
===================================================== */

async function initialize() {

  try {

    const result =
      await checkGASSettings();


    if (!result.success) {

      lockMessage.innerHTML =
        "GASに接続できません。<br>" +
        "GAS_URLを確認してください。";

      status.textContent =
        "GAS接続エラー";

      return;

    }


    if (!result.cameraEnabled) {

      cameraEnabled =
        false;

      lockMessage.innerHTML =
        "スプレッドシートの設定で<br>" +
        "カメラ使用がOFFになっています。";

      startButton.style.display =
        "none";

      status.textContent =
        "カメラ使用OFF";

      return;

    }


    if (!result.folderExists) {

      lockMessage.innerHTML =
        "Google Driveフォルダに<br>" +
        "アクセスできません。";

      startButton.style.display =
        "none";

      status.textContent =
        "Driveエラー";

      return;

    }


    cameraEnabled =
      true;

    lockMessage.innerHTML =
      "カメラを使用できます。<br>" +
      "下のボタンを押してください。";

    startButton.style.display =
      "block";

    status.textContent =
      "カメラ待機中";


  } catch (error) {

    showError(
      error.message
    );

  }

}


/* =====================================================
   カメラ開始
===================================================== */

async function startCamera() {

  if (!cameraEnabled) {

    showError(
      "スプレッドシートでカメラ使用がOFFです。"
    );

    return;

  }


  try {

    stopCamera();

    setStatus(
      "カメラ起動中…"
    );


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                facingMode
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: true

        });


    video.srcObject =
      stream;


    await video.play();


    lockScreen.classList.add(
      "hidden"
    );


    setStatus(
      facingMode === "environment"
        ? "背面カメラ"
        : "前面カメラ"
    );


    applyZoom();


  } catch (error) {

    showError(
      "カメラ起動エラー\n\n" +
      error.name +
      "\n" +
      error.message
    );

    setStatus(
      "カメラエラー"
    );

  }

}


/* =====================================================
   カメラ停止
===================================================== */

function stopCamera() {

  if (!stream) {
    return;
  }

  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

  stream = null;

  video.srcObject = null;

}


/* =====================================================
   カメラ切替
===================================================== */

switchCamera.addEventListener(
  "click",
  async () => {

    facingMode =
      facingMode === "environment"
        ? "user"
        : "environment";

    await startCamera();

  }
);


/* =====================================================
   シャッター
===================================================== */

shutter.addEventListener(
  "click",
  async () => {

    if (!stream) {

      await startCamera();

      return;

    }


    if (
      currentMode === "photo"
    ) {

      await takePhoto();

    } else {

      if (recording) {

        stopRecording();

      } else {

        startRecording();

      }

    }

  }
);


/* =====================================================
   写真
===================================================== */

async function takePhoto() {

  try {

    setStatus(
      "写真を撮影中…"
    );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            "image/jpeg",
            0.9
          );

        }
      );


    if (!blob) {

      throw new Error(
        "画像生成に失敗しました。"
      );

    }


    await uploadBlob(
      blob,
      "IMG_" +
      Date.now() +
      ".jpg",
      "image/jpeg"
    );


    setStatus(
      "✅ Google Driveへ保存しました"
    );


  } catch (error) {

    showError(
      "写真保存エラー\n" +
      error.message
    );

    setStatus(
      "保存エラー"
    );

  }

}


/* =====================================================
   動画モード
===================================================== */

photoMode.addEventListener(
  "click",
  () => {

    if (recording) return;

    currentMode =
      "photo";

    photoMode.classList.add(
      "active"
    );

    videoMode.classList.remove(
      "active"
    );

    setStatus(
      "写真モード"
    );

  }
);


videoMode.addEventListener(
  "click",
  () => {

    if (recording) return;

    currentMode =
      "video";

    videoMode.classList.add(
      "active"
    );

    photoMode.classList.remove(
      "active"
    );

    setStatus(
      "動画モード"
    );

  }
);


/* =====================================================
   動画MIME
===================================================== */

function getMimeType() {

  const types = [

    "video/mp4",

    "video/mp4;codecs=avc1",

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  for (
    const type of types
  ) {

    if (
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;

    }

  }


  return "";

}


/* =====================================================
   録画開始
===================================================== */

function startRecording() {

  const mimeType =
    getMimeType();


  if (!mimeType) {

    showError(
      "動画録画に対応していません。"
    );

    return;

  }


  recordedChunks = [];


  mediaRecorder =
    new MediaRecorder(
      stream,
      {
        mimeType:
          mimeType
      }
    );


  mediaRecorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        recordedChunks.push(
          event.data
        );

      }

    };


  mediaRecorder.onstop =
    () => {

      saveVideo(
        mimeType
      );

    };


  mediaRecorder.start(
    1000
  );


  recording =
    true;


  shutter.classList.add(
    "recording"
  );


  recordTimer.style.display =
    "block";


  recordingStart =
    Date.now();


  timerInterval =
    setInterval(
      updateTimer,
      500
    );


  setStatus(
    "🔴 録画中"
  );

}


/* =====================================================
   録画停止
===================================================== */

function stopRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state ===
      "inactive"
  ) {

    return;

  }


  mediaRecorder.stop();


  recording =
    false;


  shutter.classList.remove(
    "recording"
  );


  clearInterval(
    timerInterval
  );


  recordTimer.style.display =
    "none";


  setStatus(
    "動画を保存中…"
  );

}


/* =====================================================
   動画保存
===================================================== */

async function saveVideo(
  mimeType
) {

  try {

    const blob =
      new Blob(
        recordedChunks,
        {
          type:
            mimeType
        }
      );


    if (
      blob.size >
      MAX_FILE_SIZE
    ) {

      throw new Error(
        "動画サイズが15MBを超えています。"
      );

    }


    const extension =
      mimeType.includes(
        "mp4"
      )
        ? ".mp4"
        : ".webm";


    await uploadBlob(

      blob,

      "VID_" +
      Date.now() +
      extension,

      mimeType

    );


    setStatus(
      "✅ Google Driveへ保存しました"
    );


  } catch (error) {

    showError(
      "動画保存エラー\n" +
      error.message
    );

    setStatus(
      "保存エラー"
    );

  }

}


/* =====================================================
   Blob → Base64
===================================================== */

function blobToBase64(
  blob
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            reader.result;


          resolve(
            result.split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* =====================================================
   GitHub → GAS
===================================================== */

async function uploadBlob(
  blob,
  fileName,
  mimeType
) {

  if (
    blob.size >
    MAX_FILE_SIZE
  ) {

    throw new Error(
      "ファイルサイズが大きすぎます。"
    );

  }


  const base64 =
    await blobToBase64(
      blob
    );


  /*
    JSONではなく
    application/x-www-form-urlencoded
    で送信します。

    これにより、
    ブラウザのCORSプリフライトを
    発生させにくい構成にします。
  */

  const body =
    new URLSearchParams();


  body.append(
    "base64Data",
    base64
  );


  body.append(
    "fileName",
    fileName
  );


  body.append(
    "mimeType",
    mimeType
  );


  await fetch(
    GAS_URL,
    {

      method:
        "POST",

      mode:
        "no-cors",

      headers: {

        "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"

      },

      body:
        body.toString()

    }
  );

}


/* =====================================================
   ズーム
===================================================== */

zoom.addEventListener(
  "input",
  () => {

    currentZoom =
      Number(
        zoom.value
      );


    zoomLabel.textContent =
      currentZoom.toFixed(1) +
      "x";


    applyZoom();

  }
);


function applyZoom() {

  video.style.transform =
    "scale(" +
    currentZoom +
    ")";

}


/* =====================================================
   タイマー
===================================================== */

function updateTimer() {

  const elapsed =
    Date.now() -
    recordingStart;


  const seconds =
    Math.floor(
      elapsed / 1000
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const sec =
    seconds % 60;


  recordTimer.textContent =

    String(
      minutes
    ).padStart(
      2,
      "0"
    ) +

    ":" +

    String(
      sec
    ).padStart(
      2,
      "0"
    );

}


/* =====================================================
   状態
===================================================== */

function setStatus(
  text
) {

  status.textContent =
    text;

}


/* =====================================================
   起動
===================================================== */

startButton.addEventListener(
  "click",
  startCamera
);


window.addEventListener(
  "beforeunload",
  stopCamera
);


initialize();

</script>

</body>

</html>
