<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>micro:bit USB Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #0d1117;
    color: white;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}

header {
    padding: 25px;

    text-align: center;

    background: #161b22;

    border-bottom:
        1px solid #30363d;
}

header h1 {
    margin: 0;
}

header p {
    color: #8b949e;
}

main {
    width: min(800px, 94%);

    margin: 30px auto;
}

.card {
    margin-bottom: 20px;

    padding: 25px;

    background: #161b22;

    border:
        1px solid #30363d;

    border-radius: 18px;
}

button {
    border: none;

    cursor: pointer;

    font-family: inherit;
}

#connect {
    padding: 15px 25px;

    background: #00eaff;

    color: #001014;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;
}

#disconnect {
    padding: 15px 25px;

    background: #ff4d4d;

    color: white;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;
}

.status {
    margin-top: 15px;

    padding: 15px;

    background: #010409;

    border-radius: 10px;

    color: #8b949e;
}

#status {
    font-weight: bold;
}

.controller {
    width: min(450px, 100%);

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.control {
    height: 90px;

    background: #21262d;

    color: white;

    border:
        1px solid #30363d;

    border-radius: 18px;

    font-size: 35px;

    font-weight: bold;
}

.control:hover {
    background: #30363d;
}

.forward {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.stop {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.back {
    grid-column: 2;
    grid-row: 3;
}

.preview {
    height: 200px;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #010409;

    border-radius: 15px;
}

#arrow {
    font-size: 120px;

    color: #00eaff;
}

.log {
    height: 220px;

    overflow-y: auto;

    padding: 15px;

    background: #010409;

    border-radius: 10px;

    font-family: monospace;
}

.log div {
    padding: 5px;

    border-bottom:
        1px solid #21262d;
}

.info {
    color: #8b949e;

    line-height: 1.8;
}

</style>

</head>


<body>


<header>

<h1>
micro:bit USB TEST
</h1>

<p>
USBシリアル通信テスト
</p>

</header>


<main>


<!-- 接続 -->

<section class="card">

<h2>
① USB接続
</h2>

<button id="connect">
micro:bitに接続
</button>

<button id="disconnect">
切断
</button>

<div class="status">

状態：

<span id="status">
未接続
</span>

</div>

</section>


<!-- プレビュー -->

<section class="card">

<h2>
② LED表示
</h2>

<div class="preview">

<div id="arrow">
</div>

</div>

</section>


<!-- 操作 -->

<section class="card">

<h2>
③ 操作
</h2>

<div class="controller">

<button
    class="control forward"
    data-command="F"
    data-arrow="↑"
>
↑
</button>

<button
    class="control left"
    data-command="L"
    data-arrow="←"
>
←
</button>

<button
    class="control stop"
    data-command="S"
    data-arrow=""
>
■
</button>

<button
    class="control right"
    data-command="R"
    data-arrow="→"
>
→
</button>

<button
    class="control back"
    data-command="B"
    data-arrow="↓"
>
↓
</button>

</div>

</section>


<!-- 説明 -->

<section class="card">

<h2>
キーボード
</h2>

<div class="info">

W = ↑

<br>

S = ↓

<br>

A = ←

<br>

D = →

<br>

Space = 停止

</div>

</section>


<!-- ログ -->

<section class="card">

<h2>
通信ログ
</h2>

<div id="log" class="log">
</div>

</section>


</main>


<script>


// ==========================================
// USB Serial
// ==========================================

let port = null;

let writer = null;


// ==========================================
// HTML
// ==========================================

const connectButton =
    document.getElementById("connect");

const disconnectButton =
    document.getElementById("disconnect");

const status =
    document.getElementById("status");

const arrow =
    document.getElementById("arrow");

const log =
    document.getElementById("log");


// ==========================================
// ログ
// ==========================================

function addLog(text) {

    const div =
        document.createElement("div");

    const time =
        new Date().toLocaleTimeString();

    div.textContent =
        "[" + time + "] " + text;

    log.prepend(div);
}


// ==========================================
// 接続
// ==========================================

async function connectMicrobit() {

    try {

        // Web Serial対応確認

        if (!("serial" in navigator)) {

            alert(
                "このブラウザはWeb Serialに対応していません。\n\n" +
                "ChromeまたはEdgeを使用してください。"
            );

            return;
        }


        addLog(
            "USBポートを選択してください"
        );


        // USBポート選択

        port =
            await navigator.serial.requestPort();


        addLog(
            "ポートを選択しました"
        );


        // 接続

        await port.open({
            baudRate: 115200
        });


        addLog(
            "USB接続成功"
        );


        // Writer

        writer =
            port.writable.getWriter();


        status.textContent =
            "接続済み";


        addLog(
            "通信準備完了"
        );


        // 接続テスト

        await sendCommand("S");

    }

    catch(error) {

        console.error(error);

        addLog(
            "ERROR: " +
            error.message
        );

        status.textContent =
            "接続失敗";
    }
}


// ==========================================
// 送信
// ==========================================

async function sendCommand(command) {

    if (!writer) {

        addLog(
            "ERROR: USB未接続"
        );

        return;
    }


    try {

        const encoder =
            new TextEncoder();


        // 重要
        // micro:bit側が改行を待っている

        const data =
            encoder.encode(
                command + "\r\n"
            );


        await writer.write(data);


        addLog(
            "送信 → [" +
            command +
            "]"
        );


        // Web側プレビュー

        const arrows = {

            F: "↑",

            B: "↓",

            L: "←",

            R: "→",

            S: ""

        };


        arrow.textContent =
            arrows[command];


    }

    catch(error) {

        console.error(error);

        addLog(
            "送信ERROR: " +
            error.message
        );
    }
}


// ==========================================
// 切断
// ==========================================

async function disconnectMicrobit() {

    try {

        if (writer) {

            await sendCommand("S");

            writer.releaseLock();

            writer = null;
        }


        if (port) {

            await port.close();

            port = null;
        }


        status.textContent =
            "未接続";


        addLog(
            "USB切断"
        );

    }

    catch(error) {

        console.error(error);

        addLog(
            "切断ERROR: " +
            error.message
        );
    }
}


// ==========================================
// ボタン
// ==========================================

document
.querySelectorAll(".control")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            const command =
                this.dataset.command;

            sendCommand(command);

        }
    );

});


// ==========================================
// キーボード
// ==========================================

document.addEventListener(
    "keydown",
    function(event) {

        let command = null;


        switch (
            event.key.toLowerCase()
        ) {

            case "w":

                command = "F";

                break;


            case "s":

                command = "B";

                break;


            case "a":

                command = "L";

                break;


            case "d":

                command = "R";

                break;


            case " ":

                command = "S";

                event.preventDefault();

                break;

        }


        if (command) {

            sendCommand(command);

        }

    }
);


// ==========================================
// 接続ボタン
// ==========================================

connectButton.addEventListener(
    "click",
    connectMicrobit
);


disconnectButton.addEventListener(
    "click",
    disconnectMicrobit
);


// ==========================================
// 初期ログ
// ==========================================

addLog(
    "USB通信テスト開始"
);

addLog(
    "micro:bitをUSB接続してください"
);


</script>

</body>

</html>
