<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スライドエディタ</title>
<style>
:root{--bg:#f1f3f6;--panel:#fff;--ink:#1d2330;--mut:#667085;--line:#d9dee7;--acc:#2f6bff;--accbg:#e8efff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1d222b;--ink:#e8ebf1;--mut:#9aa3b2;--line:#323946;--acc:#6b95ff;--accbg:#26304a}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1d222b;--ink:#e8ebf1;--mut:#9aa3b2;--line:#323946;--acc:#6b95ff;--accbg:#26304a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:14px}
#app{display:none;flex-direction:column;height:100%}
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar b{margin-right:8px}
button,select,input[type=number]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--accbg);border-color:var(--acc)}
input[type=color]{width:32px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#main{flex:1;display:flex;min-height:0}
#thumbs{width:190px;overflow:auto;padding:10px;background:var(--panel);border-right:1px solid var(--line);flex:none}
.th{position:relative;width:166px;height:93.4px;margin-bottom:10px;border:2px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;background:#fff}
.th.cur{border-color:var(--acc)}
.th i{position:absolute;left:3px;bottom:2px;font-style:normal;font-size:11px;background:#0008;color:#fff;border-radius:3px;padding:0 4px;z-index:3}
.th .slide{transform:scale(.1148);transform-origin:0 0;pointer-events:none}
#wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
#frame{position:relative;flex:none}
.slide{position:absolute;left:0;top:0;width:1440px;height:810px;background:#fff;overflow:hidden;transform-origin:0 0}
#frame .slide{box-shadow:0 2px 14px #0004}
.el{position:absolute;user-select:none}
.el.t{white-space:pre-wrap;line-height:1.35;overflow:visible;font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif;padding:4px 8px;word-break:break-all}
.el.i img{width:100%;height:100%;display:block;pointer-events:none;object-fit:fill}
.el.i.miss{background:#d0d4dc}
#frame .el{cursor:move}
#frame .el:hover{outline:2px dashed #2f6bff88}
#frame .el.sel{outline:2px solid #2f6bff}
.el.ed{cursor:text!important;user-select:text;outline:2px solid #2f6bff}
.hd{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;background:#2f6bff;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;z-index:5}
#hint{padding:6px 12px;color:var(--mut);font-size:12px;background:var(--panel);border-top:1px solid var(--line)}
#print{display:none}
#pres{display:none;position:fixed;inset:0;background:#000;z-index:50;cursor:pointer}
#rm{display:none;position:fixed;inset:0;background:#0007;z-index:60;align-items:center;justify-content:center}
#rm .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(420px,92vw);text-align:center}
#qr{display:flex;justify-content:center;margin:12px 0;background:#fff;padding:10px;border-radius:8px}
#ru{width:100%;font-size:12px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#rc{padding:12px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
#rc .bt{display:flex;gap:12px;flex:1}#rc .bt button{flex:1;min-height:15vh;font-size:30px;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:16px}
#rc .bt button:first-child{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
#rc .ls button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:10px}
#rsl{touch-action:none;position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
#rtl{display:flex;gap:6px;align-items:center}#rtl button{flex:1;padding:12px 6px}#zt{min-width:48px;text-align:center;color:var(--mut)}
#rl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tb{position:relative;aspect-ratio:16/9;border:3px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}
.tb.cur{border-color:var(--acc)}.tb .slide{pointer-events:none}
.tb i{position:absolute;left:4px;bottom:3px;font-style:normal;font-size:12px;background:#000a;color:#fff;border-radius:4px;padding:0 6px;z-index:3}
#rc .ls button.cur{background:var(--accbg);border-color:var(--acc)}
#rno{flex:1;overflow:auto;white-space:pre-wrap;line-height:1.6;font-size:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:30vh}
#nt{flex:none;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
#note{width:100%;height:84px;resize:vertical;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
#pz{position:absolute;inset:0;transform-origin:0 0;transition:transform .2s ease-out}
#ld{display:none;position:absolute;border-radius:50%;background:#ff2b2b;box-shadow:0 0 18px 8px #ff2b2baa;z-index:20;pointer-events:none}
#pres .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff9;font:14px sans-serif;pointer-events:none}
#vw2{display:none;position:fixed;inset:0;background:#0b0d12;z-index:80;color:#fff;font:14px sans-serif;flex-direction:column}
#vz{position:relative;flex:none;overflow:hidden;background:#000;width:100%}
#vbar{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 10px;background:#161a22}
#vbar button{background:#222;color:#fff;border-color:#555}
#vst{min-width:150px;text-align:center}
#vlog{flex:1;overflow:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.vlh{color:#9aa3b2;font-size:12px;margin-bottom:8px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
#vw2 .tb{border-color:#323946}#vw2 .tb.cur{border-color:#6b95ff}
#home{display:none;position:fixed;inset:0;overflow:auto;background:var(--bg);padding:16px 16px 28px}
#hh{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#hvw{margin-bottom:12px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cth{position:relative;aspect-ratio:16/9;background:#fff;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--line)}
.cth .slide{pointer-events:none}
.cn{padding:8px 12px 0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm{padding:2px 12px 8px;color:var(--mut);font-size:12px}
.cb{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
@media print{#home,#vw2{display:none!important}@page{size:1280px 720px;margin:0}body>#app{display:none}#print{display:block}#print .slide{position:relative;zoom:.8889;page-break-after:always;box-shadow:none}html,body{background:#fff;height:auto}}
@media (max-width:700px){#thumbs{display:none}}
</style>
</head>
<body>
<div id="app">
 <div id="bar">
  <button id="gohome">🏠 ホーム</button><b id="dname" title="クリックで名前変更" style="cursor:pointer"></b>
  <button id="addT">＋文字</button><button id="addI">＋画像</button><input id="file" type="file" accept="image/*" hidden>
  <span class="sep"></span>
  <select id="fs" title="文字サイズ"></select>
  <input id="col" type="color" value="#000000" title="文字色">
  <button id="bold"><b>B</b></button><button id="al" title="配置">左</button>
  <span class="sep"></span>
  <button id="up">前面</button><button id="dn">背面</button><button id="del">削除</button>
  <span class="sep"></span><span style="color:var(--mut)">文字・画像の動き</span><select id="an" title="選択中の要素のアニメーション"><option value="none">なし</option><option value="fade">フェード</option><option value="up">下から</option><option value="down">上から</option><option value="left">左から</option><option value="right">右から</option><option value="zoom">ズーム</option><option value="pop">ポップ</option><option value="blur">ぼかし</option><option value="wipe">ワイプ</option><option value="type">タイプ打ち(文字)</option><option value="char">1文字ずつ(文字)</option></select><span style="color:var(--mut)">時間</span><input id="ad" type="number" min="0.1" max="10" step="0.1" style="width:60px"><span style="color:var(--mut)">遅延</span><input id="adl" type="number" min="0" max="20" step="0.1" style="width:60px"><button id="pv">▶確認</button><input id="bgc" type="color" value="#ffffff" title="スライドの背景色">
  <span class="sep"></span><span style="color:var(--mut)">スライド切替</span><select id="tr" title="このスライドが表示されるときの動き"><option value="none">なし</option><option value="fade">フェード</option><option value="slide">横スライド</option><option value="rise">下から</option><option value="zoom">ズーム</option></select><input id="trd" type="number" min="0.1" max="3" step="0.1" style="width:60px" title="切替時間(秒)">
  <span class="sep"></span>
  <button id="undo">↶</button><button id="redo">↷</button>
  <span class="sep"></span>
  <button id="addS">＋スライド</button><button id="dupS">複製</button><button id="delS">スライド削除</button>
  <span class="sep"></span>
  <button id="play">▶発表</button><button id="rem">📱リモコン</button>
  <button id="pub">🌐オンライン公開</button><button id="vw">👁 IDで見る</button><span id="pst" style="color:var(--acc);font-size:12px"></span>
  <button id="pdfi">📄PDF読込</button><input id="pf" type="file" accept="application/pdf,.pdf" hidden>
  <button id="pdf">PDF保存/印刷</button><button id="exp">JSON書出</button><button id="imp">読込</button><input id="jf" type="file" accept=".json" hidden>
  <button id="reset">初期化</button><span id="sv" style="margin-left:auto;color:var(--mut);font-size:12px"></span>
 </div>
 <div id="main"><div id="thumbs"></div><div id="wrap"><div id="frame"></div></div></div>
 <div id="nt"><textarea id="note" placeholder="スピーカーノート（接続したスマホのリモコンに表示されます）"></textarea></div>
 <div id="hint">ドラッグで移動／右下の●でサイズ変更／文字はダブルクリックで編集／矢印キーで微調整（Shiftで大きく）／Delete削除／自動保存（このブラウザ内・更新しても残ります）／Ctrl+Zで元に戻す／🌐オンライン公開で4桁IDを発行すると、IDを入力した人がスライドを閲覧できます（編集は自動で反映・ノートは公開されません）</div>
</div>
<div id="print"></div>
<div id="pres"><div id="pz"><div id="ld"></div></div></div>
<div id="rm"><div class="box"><b>スマホをリモコンにする</b><p style="font-size:13px;color:var(--mut);margin:8px 0">スマホのカメラでQRを読み取り、開いたページで操作します（同じWi-Fiでなくても可）。</p><div id="qr">準備中…</div><input id="ru" readonly><p id="rs" style="font-size:13px;margin:8px 0">接続待ち</p><button id="rx">閉じる</button></div></div>
<div id="vw2"><div id="vz"></div><div id="vbar"><button id="vp">◀</button><span id="vst">接続中…</span><button id="vn">▶</button><label><input type="checkbox" id="vf" checked> 発表者に追従</label><button id="vx">閉じる</button></div><div id="vlog"></div></div>
<div id="home"><div id="hh"><b style="font-size:20px">🖼️ スライド</b><span style="flex:1"></span><button id="hnew">＋新規作成</button><button id="hview">👁 IDで見る</button></div><div id="hvw"></div><div id="hgrid"></div></div>
<script>
/* 初期スライドの画像データ（元ファイルの const IMG={...}; をここに貼ると初期画像が表示されます）。無い場合は灰色の枠になります */
const IMG={};
const T=(id,x,y,w,h,s,fs,o={})=>({id,t:'t',x,y,w,h,s,fs,c:'#000000',b:0,a:'left',...o});
const P=(id,x,y,w,h,k)=>({id,t:'i',x,y,w,h,k});
const INIT=()=>[
 {els:[T(1,120,230,1200,120,'情報電子工学科',72,{b:1}),T(2,120,350,1200,150,'R&D説明',110,{b:1}),T(3,120,520,1200,80,'〜王工見学会〜',48,{c:'#555555'})]},
 {els:[T(4,64,70,1300,80,'1.R&Dについて',56),T(5,64,200,1320,500,'R&Dとは(Research&Discovery)の略です。\n【Research】は【研究】\n【Discovery】は【発見】\nこのようなものです。\n問題点や課題を発見し、解決に向けて情報を収集・整理・分析を行い\n考え抜く力 (課題発見力・計画力・想像力)を育成する授業です。',40)]},
 {els:[T(6,64,60,1300,80,'2.R&Dでどのようなものを作っているか',56),T(7,64,170,800,60,'今までの課題',40,{c:'#666666'}),
  P(8,44,268,530,297,'g'),P(9,656,254,569,293,'p'),P(10,310,468,548,304,'s'),P(11,878,486,549,292,'f')]},
 {els:[T(12,64,50,1300,80,'3.R&D micro:bit（マイクロビットのサッカー大会）',50),P(13,49,177,399,250,'m'),P(14,24,450,443,310,'b'),
  T(15,500,190,900,70,'⇐ロボットを操作してサッカー大会を行う',32),T(16,500,360,900,160,'R&D（探究授業）でmicro:bitサッカー大会を開催！　AIや3DCADも活用し、チームで創意工夫',32),T(17,500,540,900,70,'⇐マイクロビット対戦様子',32)]}
];
let S,cur=0,sel=null,hist=[],fut=[],nid=100,scale=1;
const $=id=>document.getElementById(id),KEY='slide-editor-v1';
S=INIT();
const snap=()=>JSON.stringify(S);
function push(){hist.push(snap());if(hist.length>80)hist.shift();fut=[];save()}
/* ===== 自動保存（IndexedDB → localStorage の順に退避。失敗時は警告） ===== */
let ready=false,dirty=false,svT,dbp;
const setSv=t=>{const x=document.getElementById('sv');if(x)x.textContent=t};
const idb=()=>dbp||(dbp=new Promise((ok,ng)=>{const r=indexedDB.open('slide-editor-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}));
const dbGet=async(k='deck')=>{const d=await idb();return new Promise((ok,ng)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ng(q.error)})};
const dbPut=async(v,k='deck')=>{const d=await idb();return new Promise((ok,ng)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>ng(t.error);t.onabort=()=>ng(t.error)})};
const dbDel=async k=>{const d=await idb();return new Promise((ok,ng)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=ok;t.onerror=()=>ng(t.error)})};
let IDX=[],DID='';
const dkey=id=>'d:'+id,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const saveIdx=()=>dbPut(IDX,'idx').catch(()=>{try{localStorage.setItem(KEY+'-idx',JSON.stringify(IDX))}catch(e){}});
function titleOf(d){for(const sl of d)for(const e of sl.els)if(e.t=='t'&&e.s.trim())return e.s.split('\n')[0].slice(0,30);return '無題のスライド'}
async function flush(){
 if(!ready||!dirty||!DID)return;dirty=false;const data={S,cur,t:Date.now()},ix=IDX.find(x=>x.id==DID);
 if(ix){ix.t=data.t;ix.n=S.length;if(!ix.custom)ix.name=titleOf(S);$('dname').textContent=ix.name}
 try{await dbPut(data,dkey(DID));await saveIdx();setSv('✓ 自動保存済み '+new Date().toLocaleTimeString())}
 catch(e){try{localStorage.setItem(KEY+DID,JSON.stringify(S));setSv('✓ 保存済み（簡易）')}
  catch(_){dirty=true;setSv('⚠ 保存できません。「JSON書出」で控えを取ってください')}}}
addEventListener('visibilitychange',()=>{if(document.hidden){dirty=true;flush()}});
addEventListener('pagehide',()=>{dirty=true;flush()});
function save(){dirty=true;setSv('保存中…');clearTimeout(svT);svT=setTimeout(flush,150);
 if(pubCode){clearTimeout(pubT);pubT=setTimeout(pubSync,2000)}
 try{if(conns.length){clearTimeout(window._bt);window._bt=setTimeout(()=>broadcast(true),600)}}catch(e){}}
function undo(){if(!hist.length)return;fut.push(snap());S=JSON.parse(hist.pop());cur=Math.min(cur,S.length-1);sel=null;save();draw()}
function redo(){if(!fut.length)return;hist.push(snap());S=JSON.parse(fut.pop());cur=Math.min(cur,S.length-1);sel=null;save();draw()}
function mk(e,live){
 const d=document.createElement('div');d.className='el '+e.t;d.dataset.id=e.id;
 d.style.cssText=`left:${e.x}px;top:${e.y}px;width:${e.w}px;`+(e.t=='i'?`height:${e.h}px;`:`min-height:${e.h}px;font-size:${e.fs}px;color:${e.c};line-height:${e.lh||1.35};font-weight:${e.b?700:400};text-align:${e.a};`);
 if(e.t=='i'){const u=e.k?IMG[e.k]:e.src;if(u){const im=new Image();im.src=u;im.draggable=false;d.appendChild(im)}else d.classList.add('miss')}else d.textContent=e.s;
 if(live&&e.id===sel){d.classList.add('sel');const h=document.createElement('div');h.className='hd';d.appendChild(h)}
 return d}
function slideEl(s,live){const d=document.createElement('div');d.className='slide';if(s.bg)d.style.background=s.bg;s.els.forEach(e=>d.appendChild(mk(e,live)));return d}
function draw(){
 const f=$('frame'),w=$('wrap');
 scale=Math.min((w.clientWidth-32)/1440,(w.clientHeight-32)/810);if(scale<.2)scale=.2;
 f.style.width=1440*scale+'px';f.style.height=810*scale+'px';f.innerHTML='';
 const sl=slideEl(S[cur],true);sl.style.transform=`scale(${scale})`;f.appendChild(sl);
 const th=$('thumbs');th.innerHTML='';
 S.forEach((s,i)=>{const t=document.createElement('div');t.className='th'+(i==cur?' cur':'');t.appendChild(slideEl(s,false));const n=document.createElement('i');n.textContent=i+1;t.appendChild(n);t.onclick=()=>{cur=i;sel=null;draw();pubCur()};th.appendChild(t)});
 const nt=$('note');if(document.activeElement!==nt)nt.value=S[cur].note||'';const e=cur_el();$('bold').classList.toggle('on',!!(e&&e.b));
 const A=(e&&e.an)||{};$('an').value=A.t||'none';$('ad').value=A.d??.6;$('adl').value=A.l??0;$('tr').value=S[cur].tr||'none';$('trd').value=S[cur].trd??.6;$('bgc').value=S[cur].bg||'#ffffff';$('an').disabled=$('ad').disabled=$('adl').disabled=!e;
 if(e&&e.t=='t'){$('fs').value=e.fs;$('col').value=e.c;$('al').textContent={left:'左',center:'中',right:'右'}[e.a]}
}
const cur_el=()=>S[cur].els.find(e=>e.id===sel);
function pt(ev){const r=$('frame').getBoundingClientRect();return{x:(ev.clientX-r.left)/scale,y:(ev.clientY-r.top)/scale}}
let drag=null;
$('frame').addEventListener('pointerdown',ev=>{
 if(document.querySelector('.el.ed')&&ev.target.closest('.el.ed'))return;
 const h=ev.target.closest('.hd'),el=ev.target.closest('.el');
 if(!el){sel=null;draw();return}
 const id=+el.dataset.id;sel=id;const e=cur_el(),p=pt(ev);
 drag={mode:h?'rs':'mv',sx:p.x,sy:p.y,ox:e.x,oy:e.y,ow:e.w,oh:e.h,moved:false,id};
 draw();ev.preventDefault();
});
addEventListener('pointermove',ev=>{
 if(!drag)return;const e=S[cur].els.find(x=>x.id===drag.id),p=pt(ev),dx=p.x-drag.sx,dy=p.y-drag.sy;
 if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<3)return;
 if(!drag.moved){drag.moved=true;hist.push(snap());fut=[]}
 if(drag.mode=='mv'){e.x=Math.round(drag.ox+dx);e.y=Math.round(drag.oy+dy)}
 else{e.w=Math.max(40,Math.round(drag.ow+dx));e.h=e.t=='i'?Math.max(30,Math.round(drag.oh*(e.w/drag.ow))):Math.max(30,Math.round(drag.oh+dy))}
 const d=$('frame').querySelector(`[data-id="${e.id}"]`);d.style.left=e.x+'px';d.style.top=e.y+'px';d.style.width=e.w+'px';
 d.style[e.t=='i'?'height':'minHeight']=e.h+'px';
});

 const k=Math.min(z.clientWidth/1440,z.clientHeight/810),sl=slideEl(vS[vCur],false);
 z.innerHTML='';sl.style.transform=`scale(${k})`;sl.style.left=(z.clientWidth-1440*k)/2+'px';sl.style.top=(z.clientHeight-810*k)/2+'px';z.appendChild(sl);

function vLogDraw(){
 const L=$('vlog');L.innerHTML='<div class="vlh">これまでに流れたスライド（新しい順・タップで拡大）</div>';

async function openView(code,hash){

 try{vLog=JSON.parse(localStorage.getItem(vKey())||'[]')}catch(e){vLog=[]}

}
function askView(){const c=(prompt('スライドの4桁IDを入力してください','')||'').trim();if(!c)return;if(!/^\d{4}$/.test(c)){alert('4桁の数字で入力してください');return}openView(c,false)}

async function renderHome(){
 const g=$('hgrid');g.innerHTML='';let vv=[];try{vv=JSON.parse(localStorage.getItem('slide-viewed')||'[]')}catch(e){}
 const hv=$('hvw');hv.innerHTML='';if(vv.length){hv.append('最近見たID：');vv.forEach(c=>{const b=document.createElement('button');b.textContent='👁 '+c;b.onclick=()=>openView(c,false);hv.appendChild(b)})}

  c.querySelector('.cn').textContent=x.name;c.querySelector('.cm').textContent=(x.n||'?')+'枚　'+new Date(x.t).toLocaleString('ja-JP')+(x.pub?'　🌐ID '+x.pub:'');

  (async()=>{try{const d=await dbGet(dkey(x.id));if(d&&d.S&&d.S[0]){const sl=slideEl(d.S[0],false);sl.style.transform=`scale(${th.clientWidth/1440})`;th.appendChild(sl)}}catch(e){}})()})}
async function showHome(){
 if(DID){await flush();if(pubCode){clearTimeout(pubT);await pubSync()}}

async function openDeck(id){

 const ix=IDX.find(x=>x.id==id);pubCode=(ix&&ix.pub)||'';nid=100;S.forEach(s=>s.els.forEach(e=>nid=Math.max(nid,e.id)));

$('dname').onclick=()=>{const ix=IDX.find(x=>x.id==DID);if(!ix)return;const n=prompt('スライドの名前',ix.name);if(n&&n.trim()){ix.name=n.trim();ix.custom=true;$('dname').textContent=ix.name;saveIdx()}};

/* ===== PDF読込（文字・画像を個別の要素として取り込む） ===== */
$('pdfi').onclick=()=>$('pf').click();
const hex=c=>{if(typeof c!=='string')return '#000000';if(c[0]=='#')return c.length==4?'#'+[...c.slice(1)].map(x=>x+x).join(''):c;const m=c.match(/[\d.]+/g);return m?'#'+m.slice(0,3).map(v=>(+v|0).toString(16).padStart(2,'0')).join(''):'#000000'};
function imgURL(src,mw){const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;if(!w||!h)return null;
 const k=Math.min(1,mw/w),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k)),c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.drawImage(src,0,0,cw,ch);
 let al=false;try{const d=x.getImageData(0,0,cw,ch).data,st=4*Math.max(1,(d.length/4/4000)|0);for(let i=3;i<d.length;i+=st)if(d[i]<250){al=true;break}}catch(e){}
 return al?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85)}
async function pdfPage(pg){
 const v0=pg.getViewport({scale:1}),fit=Math.min(1440/v0.width,810/v0.height),R=1.4,vp=pg.getViewport({scale:fit*R}),v1=pg.getViewport({scale:fit}),
  ox=Math.round((1440-v0.width*fit)/2),oy=Math.round((810-v0.height*fit)/2),cv=document.createElement('canvas');
 cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
 const glyphs=[],imgs=[],realDraw=cx.drawImage.bind(cx);
 cx.fillText=function(s,x,y){const m=this.getTransform();glyphs.push({x:(m.a*x+m.c*y+m.e)/R,y:(m.b*x+m.d*y+m.f)/R,f:this.fillStyle})};
 cx.strokeText=()=>{};
 cx.drawImage=function(src,...a){
  if(src instanceof HTMLCanvasElement&&src.width>=cv.width*.9&&src.height>=cv.height*.9)return realDraw(src,...a);
  const m=this.getTransform();let dx,dy,dw,dh;
  if(a.length>=8)[dx,dy,dw,dh]=a.slice(4,8);else if(a.length>=4)[dx,dy,dw,dh]=a;else{dx=a[0];dy=a[1];dw=src.width;dh=src.height}
  const P=[[dx,dy],[dx+dw,dy],[dx,dy+dh],[dx+dw,dy+dh]].map(([x,y])=>[(m.a*x+m.c*y+m.e)/R,(m.b*x+m.d*y+m.f)/R]),xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),
   L=Math.min(...xs),T=Math.min(...ys),W=Math.max(...xs)-L,H=Math.max(...ys)-T;
  if(W<6||H<6||imgs.length>=40)return;const u=imgURL(src,1600);if(u)imgs.push({u,x:L,y:T,w:W,h:H})};
 await pg.render({canvasContext:cx,viewport:vp}).promise;
 const tc=await pg.getTextContent(),its=[];
 for(const it of tc.items){if(!it.str)continue;const t=pdfjsLib.Util.transform(v1.transform,it.transform);its.push({s:it.str,x:t[4],y:t[5],fs:Math.hypot(t[2],t[3]),w:it.width*fit})}
 const lines=[];
 for(const it of its){const l=lines[lines.length-1];
  if(l&&Math.abs(it.y-l.y)<it.fs*.35&&it.x>=l.e-it.fs*.6&&it.x-l.e<it.fs*3){const gap=it.x-l.e>it.fs*.25&&!/\s$/.test(l.s)&&!/^\s/.test(it.s);l.s+=(gap?' ':'')+it.s;l.e=it.x+it.w;l.fs=Math.max(l.fs,it.fs)}
  else lines.push({s:it.s,x:it.x,y:it.y,e:it.x+it.w,fs:it.fs})}
 const paras=[];
 for(const l of lines){if(!l.s.trim())continue;const p=paras[paras.length-1];
  if(p){const q=p.L[p.L.length-1],dy=l.y-q.y;if(dy>q.fs*.9&&dy<q.fs*1.9&&Math.abs(l.x-p.x)<q.fs*.7&&Math.abs(l.fs-q.fs)<q.fs*.15){p.L.push(l);p.lh=dy/q.fs;continue}}
  paras.push({L:[l],x:l.x,lh:1.35})}
 const col=(x,y)=>{let b=null,bd=1e9;for(const g of glyphs){const d=Math.abs(g.x-x)+Math.abs(g.y-y);if(d<bd){bd=d;b=g}}return b&&bd<40?hex(b.f):'#000000'};
 const d=cx.getImageData(0,0,cv.width,cv.height).data,r0=d[0],g0=d[1],b0=d[2];let uni=true;
 for(let i=0;i<d.length;i+=4*97)if(Math.abs(d[i]-r0)+Math.abs(d[i+1]-g0)+Math.abs(d[i+2]-b0)>24){uni=false;break}
 const els=[];
 if(!uni)els.push({id:++nid,t:'i',x:ox,y:oy,w:Math.round(v0.width*fit),h:Math.round(v0.height*fit),src:cv.toDataURL('image/jpeg',.82)});
 imgs.forEach(im=>els.push({id:++nid,t:'i',x:Math.round(ox+im.x),y:Math.round(oy+im.y),w:Math.round(im.w),h:Math.round(im.h),src:im.u}));
 paras.forEach(p=>{const f=p.L[0],fs=Math.max(8,Math.round(f.fs)),lh=Math.max(1,Math.min(2.2,+p.lh.toFixed(2))),e=Math.max(...p.L.map(l=>l.e)),mx=Math.min(...p.L.map(l=>l.x));
  els.push({id:++nid,t:'t',x:Math.round(ox+mx-8),y:Math.round(oy+f.y-4-fs*((lh-1)/2+.88)),w:Math.round(e-mx+fs*1.5+24),h:Math.round(p.L.length*fs*lh+8),s:p.L.map(l=>l.s.replace(/\s+$/,'')).join('\n'),fs,lh,c:col(f.x,f.y),b:0,a:'left'})});
 return{bg:hex(`rgb(${r0},${g0},${b0})`),els}}
$('pf').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
 const rep_=confirm('「'+f.name+'」からスライドを作成します。\n文字と画像は1つずつ編集・移動できる要素として取り込みます。\n\nOK：今のスライドをすべて置き換える\nキャンセル：今のスライドの後ろに追加する');
 try{setSv('PDFを準備中…');const V='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadJs(V+'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=V+'pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer(),cMapUrl:V+'cmaps/',cMapPacked:true}).promise,out=[];
  for(let i=1;i<=pdf.numPages;i++){setSv(`PDF読込中 ${i}/${pdf.numPages}`);out.push(await pdfPage(await pdf.getPage(i)))}
  push();if(rep_){S=out;cur=0}else{S.push(...out);cur=S.length-out.length}sel=null;draw();save();await flush();
 }catch(e){console.error(e);setSv('⚠ PDFを読み込めませんでした');alert('PDFを読み込めませんでした。ネット接続（pdf.jsの読み込み）とファイルを確認してください。')}};
/* ===== 起動 ===== */
async function boot(){
 try{IDX=(await dbGet('idx'))||[]}catch(e){try{IDX=JSON.parse(localStorage.getItem(KEY+'-idx')||'[]')}catch(_){IDX=[]}}
 if(!IDX.length){
  let old=null;try{const d=await dbGet('deck');if(d&&d.S&&d.S.length)old=d}catch(e){}
  if(!old)try{const r=localStorage.getItem(KEY);if(r){const x=JSON.parse(r);if(x&&x.length)old={S:x,cur:0}}}catch(e){}
  const S0=old?old.S:INIT(),id=uid();
  try{await dbPut({S:S0,cur:(old&&old.cur)||0,t:Date.now()},dkey(id))}catch(e){try{localStorage.setItem(KEY+id,JSON.stringify(S0))}catch(_){}}
  IDX=[{id,name:titleOf(S0),t:Date.now(),n:S0.length}];await saveIdx()}

 try{const ok=navigator.storage&&navigator.storage.persist&&await navigator.storage.persist();if(!ok)setSv('（容量不足時は消えることがあります。JSON書出も併用を）')}catch(e){}}
if(/^#r=/.test(location.hash))remoteMode();
else if(/^#v=\d{4}$/.test(location.hash))openView(location.hash.slice(3),true);
else boot();
