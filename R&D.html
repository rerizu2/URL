<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3D人型バトルRPG - リアル百鬼夜行版</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Hiragino Mincho ProN', 'serif'; }
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 10;
  }
  .window { background: rgba(10, 10, 15, 0.9); border: 2px solid #555; border-radius: 4px; padding: 10px 20px; color: #eee; pointer-events: auto; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
  #player-window { align-self: flex-start; width: 220px; border-left: 5px solid #0af; }
  #enemy-window { align-self: flex-end; width: 260px; text-align: right; max-height: 70vh; overflow-y: auto; border-right: 5px solid #f44; }
  #message-box { width: 80%; max-width: 600px; height: 80px; margin-bottom: 10px; text-align: left; font-size: 18px; border-top: 1px solid #777; }
  #command-box { width: 220px; align-self: flex-start; }
  .command { padding: 8px 20px; position: relative; cursor: pointer; transition: 0.2s; }
  .command:hover { background: rgba(255,255,255,0.1); }
  .selected::before { content: "▶"; position: absolute; left: 0; color: #0af; }
  .gauge-bg { width: 100%; height: 6px; background: #222; border: 1px solid #444; margin-top: 4px; overflow: hidden; }
  .hp-bar { height: 100%; transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); width: 100%; }
  #player-hp-bar { background: linear-gradient(90deg, #066, #0af); }
  .enemy-unit { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; font-size: 14px; }
  #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 20; }
</style>
</head>
<body>

<div id="flash"></div>

<div id="ui-layer">
  <div style="width: 100%; display: flex; justify-content: space-between;">
    <div id="player-window" class="window">
      侍 LV:<span id="lv">1</span><br>
      HP: <span id="p-hp">80</span> / <span id="p-max">80</span>
      <div class="gauge-bg"><div id="player-hp-bar" class="hp-bar"></div></div>
      <div style="font-size: 11px; margin-top: 5px; color:#0af;">習得妖術: <span id="magic-list">なし</span></div>
    </div>
    <div id="enemy-window" class="window">
      <div id="enemy-list"></div>
    </div>
  </div>
  <div>
    <div id="message-box" class="window">闇に蠢くモノたちを 斬り伏せよ。</div>
    <div id="command-box" class="window">
      <div class="command" id="cmd0">抜刀・斬撃</div>
      <div class="command" id="cmd1">妖術を放つ</div>
      <div class="command" id="cmd2">精神統一</div>
      <div class="command" id="cmd3">闇に消える</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/**
 * ゲームデータ (基本構造は維持)
 */
let playerMaxHP = 80;
let playerHP = 80;
let playerLv = 1;
let defeatedCount = 0;
let playerMagics = [];

let enemies = [];
let isBoss = false;
let isBusy = false;
let index = 0;
const totalCommands = 4;

const magicData = {
  "ファイア": { color: 0xff4400, dmg: 1.5, msg: "が 業火に包まれた！" },
  "ブリザド": { color: 0x00ffff, dmg: 1.2, msg: "が 氷結した！" },
  "サンダー": { color: 0xffff00, dmg: 1.8, msg: "に 雷が落ちた！" },
  "ダーク":   { color: 0xaa00ff, dmg: 2.5, msg: "が 虚無に消えた！" }
};
const magicNames = Object.keys(magicData);
const enemyNames = ["闇の浪人", "朽ちた足軽", "影の忍", "髑髏衆", "化け提灯"];
const bossNames = ["九尾の影", "酒呑童子の末裔", "羅生門の鬼", "怨嗟の巨神"];

/**
 * Three.js 設定 - リアリティ重視のレンダリング
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020205);
scene.fog = new THREE.FogExp2(0x020205, 0.15); // 霧の追加

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; // 影の有効化
document.body.appendChild(renderer.domElement);

// ライティングの強化
const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
scene.add(ambientLight);

const blueLight = new THREE.PointLight(0x0055ff, 2, 20);
blueLight.position.set(-5, 5, -5);
scene.add(blueLight);

const torchLight = new THREE.PointLight(0xffaa44, 3, 15);
torchLight.position.set(2, 3, -2);
scene.add(torchLight);

// 背景の石畳テクスチャ生成
function createStoneTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#111'; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
  for(let i=0; i<8; i++) {
    for(let j=0; j<8; j++) {
      ctx.strokeRect(i*32, j*32, 32, 32);
      ctx.fillStyle = `rgba(40,40,50,${Math.random()*0.2})`;
      ctx.fillRect(i*32+2, j*32+2, 28, 28);
    }
  }
  return new THREE.CanvasTexture(canvas);
}

const floorTex = createStoneTexture();
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(10, 10);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100), 
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8, metalness: 0.2 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// 背景の装飾品（石灯篭風の柱）
for(let i=0; i<10; i++) {
  const pillar = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 4, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  pillar.position.set( (Math.random()-0.5)*20, 2, -10 - Math.random()*20 );
  scene.add(pillar);
  // 灯篭の火
  const fire = new THREE.PointLight(0xff6600, 1, 5);
  fire.position.set(pillar.position.x, 3.5, pillar.position.z);
  scene.add(fire);
}

const loader = new THREE.TextureLoader();

/**
 * 敵の生成ロジック
 */
async function spawnEnemy() {
  enemies.forEach(e => scene.remove(e.mesh));
  enemies = [];
  
  isBoss = (defeatedCount + 1) % 5 === 0;
  
  if (isBoss) {
    playerHP = playerMaxHP;
    msg("<b style='color:red;'>【強敵襲来】</b> 精神が研ぎ澄まされ体力が回復した！");
    await new Promise(r => setTimeout(r, 1200));
    createEnemyData(true, 0); 
  } else {
    let numEnemies = Math.min(5, Math.floor((playerLv - 1) / 5) + 1);
    const spacing = 3.0;
    const startX = -(numEnemies - 1) * spacing / 2;
    for (let i = 0; i < numEnemies; i++) {
      createEnemyData(false, startX + (i * spacing));
    }
    msg(numEnemies > 1 ? `${numEnemies}体の怪異が立ち塞がった！` : "怪異が現れた！");
  }
  updateUI();
}

function createEnemyData(bossMode, posX) {
  let name, maxHP, magic, size, roboSet;
  if (bossMode) {
    name = bossNames[Math.floor(Math.random() * bossNames.length)];
    maxHP = (defeatedCount === 4) ? 200 : (40 + playerLv * 15) * 3;
    magic = "ダーク"; size = 6.0; roboSet = "set2";
  } else {
    name = enemyNames[Math.floor(Math.random() * enemyNames.length)];
    maxHP = 40 + playerLv * 15;
    magic = magicNames[Math.floor(Math.random() * 3)];
    size = 3.5; roboSet = "set1";
  }
  const texture = loader.load(`https://robohash.org/${Math.random()}?set=${roboSet}`);
  const material = new THREE.MeshPhongMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
  if (bossMode) material.color.set(0xff99ff);
  
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size), material);
  mesh.position.set(posX, size / 2, -8);
  mesh.castShadow = true;
  scene.add(mesh);
  enemies.push({ name, hp: maxHP, maxHP, magic, mesh });
}

/**
 * 武器（リアルな刀）の構築
 */
const swordGroup = new THREE.Group();

// 刀身 (Blade)
const bladeGeo = new THREE.BoxGeometry(0.02, 1.4, 0.08);
const bladeMat = new THREE.MeshStandardMaterial({ 
  color: 0xffffff, 
  metalness: 1.0, 
  roughness: 0.1,
  emissive: 0x222222
});
const bladeMesh = new THREE.Mesh(bladeGeo, bladeMat);
bladeMesh.position.y = 0.7;
swordGroup.add(bladeMesh);

// 鍔 (Tsuba / Guard)
const tsubaGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16);
const tsubaMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
const tsubaMesh = new THREE.Mesh(tsubaGeo, tsubaMat);
swordGroup.add(tsubaMesh);

// 柄 (Tsuka / Handle)
const hiltGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4, 8);
const hiltMat = new THREE.MeshStandardMaterial({ color: 0x661111 });
const hiltMesh = new THREE.Mesh(hiltGeo, hiltMat);
hiltMesh.position.y = -0.2;
swordGroup.add(hiltMesh);

swordGroup.position.set(1.2, 0.8, -1);
swordGroup.rotation.z = Math.PI * 0.1;
scene.add(swordGroup);

camera.position.set(0, 1.8, 3);
camera.lookAt(0, 1.5, -8);

/**
 * 演出
 */
let particles = [];
function createHitEffect(x, y, z, color = 0xffaa00) {
  for (let i = 0; i < 20; i++) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshBasicMaterial({ color }));
    p.position.set(x, y, z);
    p.userData = { vx: (Math.random()-0.5)*0.4, vy: Math.random()*0.4, vz: (Math.random()-0.5)*0.4, life: 25 };
    scene.add(p); particles.push(p);
  }
}

function animate() {
  requestAnimationFrame(animate);
  
  // 敵の浮遊アニメ
  enemies.forEach(e => { 
    if(e.mesh) e.mesh.position.y = (e.mesh.geometry.parameters.height/2) + Math.sin(Date.now() * 0.002 + e.mesh.position.x) * 0.1; 
  });
  
  // パーティクル
  particles.forEach((p, i) => {
    p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
    p.rotation.x += 0.1;
    if (--p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
  });

  // 武器の待機アニメ
  if(!isBusy) {
    swordGroup.position.y = 0.8 + Math.sin(Date.now() * 0.001) * 0.05;
    swordGroup.rotation.y = Math.sin(Date.now() * 0.0005) * 0.1;
  }

  // 松明のゆらぎ
  torchLight.intensity = 2.5 + Math.random() * 0.5;

  renderer.render(scene, camera);
}
animate();

/**
 * UI 更新
 */
function updateUI() {
  document.getElementById("p-hp").innerText = playerHP;
  document.getElementById("p-max").innerText = playerMaxHP;
  document.getElementById("lv").innerText = playerLv;
  document.getElementById("player-hp-bar").style.width = (playerHP/playerMaxHP*100) + "%";
  document.getElementById("magic-list").innerText = playerMagics.join(", ") || "なし";

  const list = document.getElementById("enemy-list");
  list.innerHTML = "";
  enemies.forEach((e) => {
    const div = document.createElement("div");
    div.className = "enemy-unit";
    div.innerHTML = `<b>${e.name}</b> [${e.magic}]<br>HP: ${e.hp}/${e.maxHP}
      <div class="gauge-bg"><div class="hp-bar" style="width:${(e.hp/e.maxHP*100)}%; background:linear-gradient(90deg, #500, #f44)"></div></div>`;
    list.appendChild(div);
  });
  for(let i=0; i<totalCommands; i++) document.getElementById(`cmd${i}`).classList.remove("selected");
  document.getElementById(`cmd${index}`).classList.add("selected");
}

function msg(t) { document.getElementById("message-box").innerHTML = t; }
function flash() { const f = document.getElementById("flash"); f.style.opacity = 1; setTimeout(() => f.style.opacity = 0, 100); }

/**
 * 戦闘アクション
 */
async function action() {
  if (isBusy || playerHP <= 0 || enemies.length === 0) return;
  isBusy = true;

  if (index === 0) { // 斬りつける
    const target = enemies[0];
    msg(`一閃！ ${target.name} を斬りつけた！`);
    
    // 斬撃モーション
    const originPos = swordGroup.position.clone();
    swordGroup.position.set(target.mesh.position.x, 2, -6);
    swordGroup.rotation.x = Math.PI / 2;
    
    await new Promise(r => setTimeout(r, 150));
    flash(); 
    createHitEffect(target.mesh.position.x, 2, -7, 0xffffff);
    
    const dmg = 15 + Math.floor(Math.random() * 10) + playerLv * 5;
    await dealDamage(target, dmg);
    
    swordGroup.position.copy(originPos);
    swordGroup.rotation.x = 0;
    if(enemies.length > 0 && playerHP > 0) await enemyAttackTurn();

  } else if (index === 1) { // 妖術
    if (playerMagics.length === 0) {
      msg("まだ妖術を心得ていない！"); await new Promise(r => setTimeout(r, 800));
    } else {
      const mName = playerMagics[playerMagics.length - 1];
      const mData = magicData[mName];
      msg(`妖術【${mName}】！ 闇を切り裂く力が迸る！`);
      await new Promise(r => setTimeout(r, 400));
      flash();
      
      const targets = [...enemies];
      for (const e of targets) {
        createHitEffect(e.mesh.position.x, 2, -7, mData.color);
        const dmg = Math.floor((15 + playerLv * 8) * mData.dmg);
        await dealDamage(e, dmg, true);
      }
      if(enemies.length > 0 && playerHP > 0) {
        msg("生き残った怪異が襲いかかる！");
        await new Promise(r => setTimeout(r, 600));
        await enemyAttackTurn();
      }
    }
  } else if (index === 2) { // 休息
    playerHP = Math.min(playerMaxHP, playerHP + 30);
    msg("精神を統一し、傷を癒した。"); updateUI();
    await new Promise(r => setTimeout(r, 800));
    await enemyAttackTurn();
  } else { // 逃走
    if (isBoss) { 
      msg("この禍々しい気配からは逃げられない！"); 
      await new Promise(r=>setTimeout(r,800)); 
      await enemyAttackTurn(); 
    } else { 
      msg("闇に紛れてその場を離脱した。"); 
      await new Promise(r=>setTimeout(r,800)); 
      spawnEnemy(); 
    }
  }

  if (enemies.length === 0 && playerHP > 0) {
    defeatedCount++;
    playerLv++; playerMaxHP += 20;
    msg("怪異を討ち果たした。");
    await new Promise(r => setTimeout(r, 1000));
    spawnEnemy();
  }

  isBusy = false;
  updateUI();
}

async function dealDamage(target, dmg, isMulti = false) {
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    if (!playerMagics.includes(target.magic)) {
      playerMagics.push(target.magic);
      msg(`怪異の力を取り込み、妖術【${target.magic}】を得た！`);
      await new Promise(r => setTimeout(r, 800));
    }
    scene.remove(target.mesh);
    enemies = enemies.filter(e => e !== target);
  }
  updateUI();
}

async function enemyAttackTurn() {
  if (enemies.length === 0 || playerHP <= 0) return;
  for (const e of enemies) {
    msg(`${e.name} の反撃！`);
    e.mesh.position.z += 3; await new Promise(r => setTimeout(r, 150));
    
    // 画面揺らし
    const shake = isBoss ? 1.0 : 0.5;
    const op = camera.position.x;
    for(let i=0; i<6; i++){ 
      camera.position.x = op + (Math.random()-0.5)*shake; 
      await new Promise(r=>setTimeout(r,25)); 
    }
    camera.position.x = op;

    const dmg = 8 + Math.floor(Math.random()*10) + playerLv*2 + (isBoss?15:0);
    playerHP -= dmg; if(playerHP < 0) playerHP = 0;
    msg(`${dmg} の痛手を負った！`);
    e.mesh.position.z -= 3; 
    await new Promise(r => setTimeout(r, 600));
    if(playerHP <= 0) { msg("侍は闇に飲まれた…"); break; }
  }
}

window.addEventListener("keydown", (e) => {
  if (isBusy) return;
  if (e.key === "ArrowUp") index = (index + (totalCommands - 1)) % totalCommands;
  if (e.key === "ArrowDown") index = (index + 1) % totalCommands;
  if (e.key === "Enter" || e.key === " ") action();
  updateUI();
});

spawnEnemy();
</script>
</body>
</html>
