<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimpleMoney Pro | 次世代資産管理</title>
    
    <!-- 外部ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. DESIGN SYSTEM (ユニバーサルデザイン)
           ========================================= */
        :root {
            --p: #4f46e5; --p-dark: #3730a3; --p-soft: #eef2ff;
            --s: #10b981; --s-soft: #ecfdf5;
            --d: #f43f5e; --d-soft: #fff1f2;
            --w: #f59e0b;
            --icoca: #00a0e9;
            --bg: #f8fafc; --card: #ffffff;
            --text: #0f172a; --text-m: #64748b;
            --radius-lg: 32px; --radius-md: 20px;
            --shadow: 0 10px 30px -5px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg: #020617; --card: #0f172a; --text: #f8fafc; --text-m: #94a3b8;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; line-height: 1.6; overflow-x: hidden;
            transition: background 0.4s ease; font-size: 18px;
        }

        /* Layout Structure */
        .app-container { max-width: 600px; margin: 0 auto; min-height: 100vh; position: relative; }

        /* =========================================
           2. HEADER & DASHBOARD (視覚的直感性)
           ========================================= */
        .hero-dashboard {
            background: var(--p); background: linear-gradient(135deg, var(--p), var(--p-dark));
            color: white; padding: 50px 24px 80px; border-radius: 0 0 50px 50px;
            text-align: center; box-shadow: 0 20px 40px rgba(79, 70, 229, 0.2);
            position: relative; overflow: hidden;
        }

        .hero-dashboard::after {
            content: ""; position: absolute; top: -50px; right: -50px;
            width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%;
        }

        .main-balance-label { font-size: 1.1rem; font-weight: 600; opacity: 0.9; letter-spacing: 1px; }
        .main-balance-value { font-size: 4rem; font-weight: 800; margin: 10px 0; letter-spacing: -2px; }
        
        .icoca-mini-card {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
            padding: 8px 18px; border-radius: 15px; font-weight: 700; font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* =========================================
           3. INTERACTIVE INPUT (1秒入力)
           ========================================= */
        .input-card {
            background: var(--card); border-radius: var(--radius-lg);
            margin: -40px 20px 20px; padding: 30px; box-shadow: var(--shadow);
            position: relative; z-index: 10;
        }

        .smart-input-wrapper { position: relative; margin-bottom: 25px; }
        .amount-display {
            width: 100%; border: none; background: var(--bg);
            padding: 24px; border-radius: var(--radius-md);
            font-size: 3rem; font-weight: 800; color: var(--p);
            text-align: center; transition: 0.3s;
        }
        .amount-display:focus { box-shadow: 0 0 0 4px var(--p-soft); background: white; }

        .quick-actions {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
        }

        .btn-action {
            border: none; border-radius: var(--radius-md); padding: 25px 10px;
            font-weight: 800; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .btn-action:active { transform: translateY(4px) scale(0.95); }
        .btn-action i { width: 32px; height: 32px; }

        .btn-food { background: #fff7ed; color: #c2410c; }
        .btn-daily { background: #f0fdf4; color: #15803d; }
        .btn-other { background: #f8fafc; color: #475569; }

        /* =========================================
           4. SYNC SYSTEM (ICOCA / 自動連携)
           ========================================= */
        .sync-container { padding: 0 20px; margin-bottom: 24px; }
        .card-icoca {
            background: linear-gradient(110deg, var(--icoca) 0%, #81d4fa 100%);
            color: white; border-radius: 24px; padding: 24px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 15px 30px rgba(0, 160, 233, 0.25);
            position: relative; overflow: hidden;
        }
        .icoca-logo { font-size: 1.4rem; font-weight: 900; letter-spacing: -1px; }
        .btn-sync-trigger {
            background: white; color: var(--icoca); border: none;
            padding: 12px 24px; border-radius: 14px; font-weight: 800;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); cursor: pointer;
        }

        /* =========================================
           5. ANALYTICS & LISTS (見える化)
           ========================================= */
        .section-title { padding: 0 24px; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .history-list { padding: 0 20px; }
        .list-item {
            background: var(--card); margin-bottom: 12px; padding: 20px;
            border-radius: 20px; display: flex; align-items: center; gap: 15px;
            box-shadow: var(--shadow); animation: slideIn 0.4s ease forwards;
        }
        @keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .icon-box {
            width: 50px; height: 50px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
        }
        .item-info { flex: 1; }
        .item-title { font-weight: 700; font-size: 1.1rem; }
        .item-meta { font-size: 0.85rem; color: var(--text-m); }
        .item-amount { font-weight: 800; font-size: 1.2rem; }

        /* =========================================
           6. NAVIGATION (ユニバーサル)
           ========================================= */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px); border-radius: 30px;
            display: flex; justify-content: space-around; padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); z-index: 1000;
        }
        .nav-link {
            color: #94a3b8; display: flex; flex-direction: column; align-items: center;
            text-decoration: none; font-size: 0.7rem; font-weight: 700; gap: 4px; transition: 0.3s;
        }
        .nav-link.active { color: var(--s); }

        /* =========================================
           7. UTILS & ANIMATIONS
           ========================================= */
        .page { display: none; padding-bottom: 120px; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg); z-index: 9999; display: flex;
            align-items: center; justify-content: center; transition: 0.5s;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--p-soft); border-top-color: var(--p); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast Notification */
        #toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: white; padding: 12px 30px;
            border-radius: 50px; font-weight: 700; font-size: 0.9rem;
            opacity: 0; pointer-events: none; transition: 0.4s; z-index: 2000;
        }
    </style>
</head>
<body>

    <!-- ロード画面 -->
    <div id="loader" class="loader"><div class="spinner"></div></div>

    <div class="app-container">

        <!-- ページ：ホーム -->
        <div id="page-home" class="page active">
            <header class="hero-dashboard">
                <div class="main-balance-label">今月の残り予算</div>
                <div class="main-balance-value" id="disp-budget-rem">¥0</div>
                <div class="icoca-mini-card">
                    <i data-lucide="wallet-2"></i> ICOCA残高: <span id="disp-icoca-bal">¥0</span>
                </div>
            </header>

            <div class="input-card">
                <div class="smart-input-wrapper">
                    <input type="number" id="main-amount" class="amount-display" placeholder="0" inputmode="numeric">
                </div>
                <div class="quick-actions">
                    <button class="btn-action btn-food" onclick="app.addEntry('食費', 'utensils')">
                        <i data-lucide="utensils"></i><span>食費</span>
                    </button>
                    <button class="btn-action btn-daily" onclick="app.addEntry('固定費', 'home')">
                        <i data-lucide="home"></i><span>固定費</span>
                    </button>
                    <button class="btn-action btn-other" onclick="app.addEntry('その他', 'layers')">
                        <i data-lucide="layers"></i><span>その他</span>
                    </button>
                </div>
            </div>

            <div class="sync-container">
                <div class="card-icoca">
                    <div>
                        <div class="icoca-logo">ICOCA</div>
                        <div style="font-size:0.8rem; opacity:0.9;" id="icoca-status-text">最新の乗車履歴を取得できます</div>
                    </div>
                    <button class="btn-sync-trigger" id="btn-icoca-sync" onclick="app.syncICOCA()">同期する</button>
                </div>
            </div>

            <div class="section-title">
                <h3 style="margin:0">最近の記録</h3>
                <small style="color:var(--p); font-weight:800;" onclick="app.changePage('history')">すべて表示</small>
            </div>

            <div id="recent-list" class="history-list">
                <!-- JSで動的生成 -->
            </div>
        </div>

        <!-- ページ：分析 -->
        <div id="page-analysis" class="page">
            <div style="padding: 40px 24px 20px;">
                <h2 style="margin:0; font-size:2rem; font-weight:800;">分析レポート</h2>
                <p style="color:var(--text-m)">お金の使いみちを可視化します</p>
            </div>
            <div class="input-card" style="margin-top:0;">
                <canvas id="chart-pie" height="300"></canvas>
            </div>
            <div class="input-card">
                <h4 style="margin-top:0">日次支出トレンド</h4>
                <canvas id="chart-line" height="200"></canvas>
            </div>
        </div>

        <!-- ページ：履歴 -->
        <div id="page-history" class="page">
            <div style="padding: 40px 24px 20px;">
                <h2 style="margin:0; font-size:2rem; font-weight:800;">全履歴</h2>
                <input type="text" id="history-search" placeholder="項目名や手段で検索..." 
                       style="width:100%; padding:15px; border-radius:15px; border:none; background:var(--card); margin-top:15px; font-weight:600; box-shadow:var(--shadow);">
            </div>
            <div id="full-history-list" class="history-list"></div>
        </div>

        <!-- ナビゲーション -->
        <nav class="bottom-nav">
            <a href="#" class="nav-link active" onclick="app.changePage('home')">
                <i data-lucide="edit-3"></i><span>入力</span>
            </a>
            <a href="#" class="nav-link" onclick="app.changePage('analysis')">
                <i data-lucide="pie-chart"></i><span>分析</span>
            </a>
            <a href="#" class="nav-link" onclick="app.changePage('history')">
                <i data-lucide="list"></i><span>履歴</span>
            </a>
            <a href="#" class="nav-link" onclick="alert('設定は次期アップデートで提供予定です')">
                <i data-lucide="settings"></i><span>設定</span>
            </a>
        </nav>

        <div id="toast"></div>
    </div>

    <script>
        /**
         * SimpleMoney Pro - 超高性能コアロジック
         */

        // --- 1. 設定 & 状態管理 ---
        const API_URL = "https://script.google.com/macros/s/AKfycbwjoQVUZ0cBL0_67PAOZUl4B3FStEDMmtUCevzWKoUvWHEO3RHCy0JBqe3kQrjTObKe/exec";
        const CONFIG = {
            MONTHLY_BUDGET: 150000,
            ICOCA_INIT_BAL: 3500,
            THEME_COLOR: '#4f46e5'
        };

        const app = {
            state: {
                db: JSON.parse(localStorage.getItem('sm_pro_db')) || [],
                icocaBal: Number(localStorage.getItem('sm_pro_icoca')) || CONFIG.ICOCA_INIT_BAL,
                currentPage: 'home',
                charts: {}
            },

            init: async function() {
                lucide.createIcons();
                this.updateDashboard();
                this.bindEvents();
                await this.fetchServerData();
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            },

            // --- 2. ページ管理 ---
            changePage: function(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(`page-${pageId}`).classList.add('active');
                
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.toggle('active', link.onclick.toString().includes(pageId));
                });

                this.state.currentPage = pageId;
                if(pageId === 'analysis') this.renderCharts();
                if(pageId === 'history') this.renderHistory(this.state.db);
                window.scrollTo(0, 0);
            },

            // --- 3. データ処理コア ---
            addEntry: async function(cat, iconName) {
                const amountInput = document.getElementById('main-amount');
                const val = Number(amountInput.value);

                if(!val || val <= 0) {
                    this.showToast("金額を入力してください ⚠️");
                    return;
                }

                const entry = {
                    type: '支出',
                    item: cat,
                    category: cat,
                    amount: val,
                    source: '手入力',
                    timestamp: new Date().toISOString()
                };

                // 楽観的更新
                this.state.db.push(entry);
                this.updateDashboard();
                amountInput.value = "";
                this.showToast(`${cat} ¥${val.toLocaleString()} を記録しました ✨`);
                this.saveLocal();

                // 非同期でサーバー送信
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors', // GAS用
                        body: JSON.stringify(entry)
                    });
                } catch(e) { console.error("Server sync failed", e); }
            },

            syncICOCA: async function() {
                const btn = document.getElementById('btn-icoca-sync');
                const text = document.getElementById('icoca-status-text');
                
                btn.disabled = true;
                btn.innerText = "同期中...";

                // 擬似ネットワーク遅延 (ICカード読み取りシミュレーション)
                await new Promise(r => setTimeout(r, 1800));

                const icocaTx = {
                    type: '支出',
                    item: 'JR西日本 乗車',
                    category: '交通費',
                    amount: 210,
                    source: 'ICOCA',
                    timestamp: new Date().toISOString()
                };

                this.state.icocaBal -= icocaTx.amount;
                this.state.db.push(icocaTx);
                this.updateDashboard();
                this.saveLocal();

                btn.disabled = false;
                btn.innerText = "同期完了";
                text.innerText = "JR西日本 210円 を同期しました";
                this.showToast("ICOCA履歴を同期しました 🚆");

                setTimeout(() => {
                    btn.innerText = "同期する";
                    text.innerText = "最新の乗車履歴を取得できます";
                }, 4000);

                await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(icocaTx) });
            },

            // --- 4. ビュー更新エンジン ---
            updateDashboard: function() {
                const totalSpent = this.state.db.reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
                const remaining = CONFIG.MONTHLY_BUDGET - totalSpent;

                // 予算表示
                const bDisp = document.getElementById('disp-budget-rem');
                bDisp.innerText = `¥${remaining.toLocaleString()}`;
                bDisp.style.color = remaining < 0 ? 'var(--d)' : 'white';

                // ICOCA表示
                document.getElementById('disp-icoca-bal').innerText = `¥${this.state.icocaBal.toLocaleString()}`;

                // 直近リスト表示 (5件)
                const list = document.getElementById('recent-list');
                const recent = this.state.db.slice().reverse().slice(0, 5);
                this.renderList(list, recent);
            },

            renderList: function(container, data) {
                if(data.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:var(--text-m); padding:40px;">データがまだありません</div>`;
                    return;
                }

                const catIcons = { '食費': 'utensils', '固定費': 'home', '交通費': 'train', 'その他': 'layers' };
                const catColors = { '食費': '#ffedd5', '固定費': '#dcfce7', '交通費': '#e0f2fe', 'その他': '#f1f5f9' };
                const catTxtColors = { '食費': '#c2410c', '固定費': '#15803d', '交通費': '#0369a1', 'その他': '#475569' };

                container.innerHTML = data.map(item => `
                    <div class="list-item">
                        <div class="icon-box" style="background:${catColors[item.category] || '#f1f5f9'}; color:${catTxtColors[item.category] || '#475569'};">
                            <i data-lucide="${catIcons[item.category] || 'box'}"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-title">${item.item}</div>
                            <div class="item-meta">${item.source} · ${new Date(item.timestamp).toLocaleDateString()}</div>
                        </div>
                        <div class="item-amount" style="color:var(--d)">-¥${Number(item.amount).toLocaleString()}</div>
                    </div>
                `).join('');
                lucide.createIcons();
            },

            renderHistory: function(data) {
                const container = document.getElementById('full-history-list');
                this.renderList(container, data.slice().reverse());
            },

            // --- 5. 分析エンジン (Chart.js) ---
            renderCharts: function() {
                const data = this.state.db;
                const catMap = {};
                const dayMap = {};

                data.forEach(item => {
                    // 円グラフ用集計
                    catMap[item.category] = (catMap[item.category] || 0) + Number(item.amount);
                    // 折れ線グラフ用 (直近7日間)
                    const dateStr = new Date(item.timestamp).toLocaleDateString();
                    dayMap[dateStr] = (dayMap[dateStr] || 0) + Number(item.amount);
                });

                // Pie Chart
                const ctxPie = document.getElementById('chart-pie').getContext('2d');
                if(this.state.charts.pie) this.state.charts.pie.destroy();
                this.state.charts.pie = new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(catMap),
                        datasets: [{
                            data: Object.values(catMap),
                            backgroundColor: ['#f97316', '#22c55e', '#0ea5e9', '#6366f1', '#94a3b8'],
                            borderWidth: 0,
                            spacing: 10
                        }]
                    },
                    options: {
                        plugins: { legend: { position: 'bottom', labels: { padding: 20, font: { size: 14, weight: 'bold' } } } },
                        cutout: '75%'
                    }
                });

                // Line Chart
                const ctxLine = document.getElementById('chart-line').getContext('2d');
                if(this.state.charts.line) this.state.charts.line.destroy();
                this.state.charts.line = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels: Object.keys(dayMap).slice(-7),
                        datasets: [{
                            label: '支出推移',
                            data: Object.values(dayMap).slice(-7),
                            borderColor: CONFIG.THEME_COLOR,
                            backgroundColor: 'rgba(79, 70, 229, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5
                        }]
                    },
                    options: {
                        scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } },
                        plugins: { legend: { display: false } }
                    }
                });
            },

            // --- 6. システム・同期 ---
            fetchServerData: async function() {
                try {
                    const res = await fetch(API_URL);
                    const json = await res.json();
                    if(json.data) {
                        // サーバーのデータとローカルをマージ (本来はID等で名寄せが必要)
                        this.state.db = json.data;
                        this.saveLocal();
                        this.updateDashboard();
                    }
                } catch(e) {
                    console.warn("Server sync skipped (Offline or URL not set)");
                }
            },

            saveLocal: function() {
                localStorage.setItem('sm_pro_db', JSON.stringify(this.state.db));
                localStorage.setItem('sm_pro_icoca', this.state.icocaBal);
            },

            bindEvents: function() {
                // 検索機能
                document.getElementById('history-search').addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    const filtered = this.state.db.filter(item => 
                        item.item.toLowerCase().includes(query) || 
                        item.category.toLowerCase().includes(query) ||
                        item.source.toLowerCase().includes(query)
                    );
                    this.renderHistory(filtered);
                });
            },

            showToast: function(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.style.opacity = '1';
                setTimeout(() => t.style.opacity = '0', 3000);
            }
        };

        // 起動
        app.init();
    </script>
</body>
</html>
