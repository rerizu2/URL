<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimpleMoney Omni-Nexus</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           UI FRAMEWORK & THEME
        ========================================= */
        :root {
            --p: #6366f1; --p-soft: rgba(99, 102, 241, 0.1);
            --s: #10b981; --d: #f43f5e; --icoca: #00a0e9;
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-m: #94a3b8;
            --glass: rgba(30, 41, 59, 0.7);
        }

        [data-theme="light"] {
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-m: #64748b; --glass: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); line-height: 1.5;
        }

        /* =========================================
           HP LIFE-GAUGE (SURVIVAL VISUAL)
        ========================================= */
        .hero-section {
            padding: 60px 24px; text-align: center;
            background: radial-gradient(circle at top, var(--p-soft), transparent);
        }

        .life-gauge-container {
            width: 240px; height: 240px; margin: 0 auto 30px; position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .gauge-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .gauge-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 14; }
        .gauge-fill {
            fill: none; stroke: var(--p); stroke-width: 14; stroke-linecap: round;
            stroke-dasharray: 628; stroke-dashoffset: 628; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 10px var(--p));
        }

        .life-content { position: absolute; }
        .hp-label { font-size: 0.9rem; font-weight: 800; opacity: 0.6; letter-spacing: 2px; }
        .hp-value { font-size: 3.5rem; font-weight: 900; margin: 5px 0; letter-spacing: -2px; }
        .hp-status { font-size: 1rem; font-weight: 900; color: var(--s); }

        /* =========================================
           OMNI-INPUT SYSTEM (1秒入力 / 音声AI)
        ========================================= */
        .input-hub {
            background: var(--card); border-radius: 40px; padding: 35px;
            margin: -30px 20px 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative; z-index: 100;
        }

        .voice-fab {
            position: absolute; top: -30px; right: 30px; background: var(--p); color: white;
            width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(99,102,241,0.4); cursor: pointer; border: 5px solid var(--bg);
        }
        .voice-fab.active { background: var(--d); animation: pulse 1s infinite; }

        .main-amount-input {
            width: 100%; border: none; background: transparent; color: var(--text);
            font-size: 4.5rem; font-weight: 900; text-align: center; outline: none; margin-bottom: 25px;
        }

        .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .btn-q {
            background: rgba(255,255,255,0.03); border: 2px solid transparent;
            border-radius: 25px; padding: 25px 10px; color: var(--text);
            font-weight: 900; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .btn-q:active { transform: scale(0.9); background: var(--p-soft); border-color: var(--p); }
        .btn-q i { width: 35px; height: 35px; }

        /* =========================================
           NEXUS SYNC CARDS (ICOCA / GMAIL)
        ========================================= */
        .nexus-row { display: flex; gap: 20px; overflow-x: auto; padding: 0 20px 30px; scroll-snap-type: x mandatory; }
        .nexus-card {
            min-width: 300px; padding: 25px; border-radius: 35px; scroll-snap-align: center;
            background: var(--card); border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .nexus-card.icoca { background: linear-gradient(135deg, var(--icoca), #81d4fa); color: white; border: none; }
        .nexus-card.gmail { background: linear-gradient(135deg, #ea4335, #fb7185); color: white; border: none; }

        .sync-btn {
            background: rgba(255,255,255,0.2); border: none; padding: 12px;
            border-radius: 15px; color: white; font-weight: 900; cursor: pointer;
            backdrop-filter: blur(10px); margin-top: 15px;
        }

        /* =========================================
           ANALYTICS & HISTORY
        ========================================= */
        .section-title { padding: 0 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .list-container { padding: 0 20px 120px; }
        .tx-card {
            background: var(--card); padding: 20px; border-radius: 25px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .tx-icon { width: 55px; height: 55px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); }
        .tx-info { flex: 1; }
        .tx-name { font-weight: 900; font-size: 1.1rem; }
        .tx-meta { font-size: 0.8rem; opacity: 0.5; font-weight: 700; }
        .tx-val { font-weight: 900; font-size: 1.3rem; }

        /* =========================================
           NAVIGATION & TOAST
        ========================================= */
        .nav-dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 450px; background: var(--glass);
            backdrop-filter: blur(25px); border-radius: 40px; padding: 12px;
            display: flex; justify-content: space-around; z-index: 1000;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-link { color: var(--text-m); cursor: pointer; transition: 0.3s; padding: 10px; border-radius: 20px; }
        .nav-link.active { color: var(--p); background: var(--p-soft); }

        #toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--p); color: white; padding: 15px 30px; border-radius: 50px;
            font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0; pointer-events: none; transition: 0.4s; z-index: 9999;
        }

        .page { display: none; }
        .page.active { display: block; animation: pageIn 0.5s ease; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 30px var(--d); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="toast">通知</div>

    <!-- MAIN HOME PAGE -->
    <div id="p-home" class="page active">
        <section class="hero">
            <div class="life-gauge-container">
                <svg class="gauge-svg">
                    <circle class="gauge-bg" cx="120" cy="120" r="100"></circle>
                    <circle id="hp-bar" class="gauge-fill" cx="120" cy="120" r="100"></circle>
                </svg>
                <div class="life-content">
                    <div class="hp-label">FINANCIAL HP</div>
                    <div class="hp-value" id="disp-hp">--</div>
                    <div class="hp-status" id="disp-msg">Analyzing...</div>
                </div>
            </div>
            <div style="font-weight:900; opacity:0.6;">本日使える目安: <span id="disp-daily-limit">¥0</span></div>
        </section>

        <section class="input-hub">
            <div class="voice-fab" id="voice-btn" onclick="nexus.voiceStart()"><i data-lucide="mic"></i></div>
            <input type="number" id="in-amount" class="main-amount-input" placeholder="0" inputmode="numeric">
            <div class="quick-grid">
                <button class="btn-q" onclick="nexus.add('食費', 'utensils')" style="color:#fb923c"><i data-lucide="utensils"></i><span>食費</span></button>
                <button class="btn-q" onclick="nexus.add('固定費', 'home')" style="color:#4ade80"><i data-lucide="home"></i><span>固定費</span></button>
                <button class="btn-q" onclick="nexus.add('その他', 'layers')" style="color:#94a3b8"><i data-lucide="layers"></i><span>その他</span></button>
            </div>
        </section>

        <section class="nexus-row">
            <div class="nexus-card icoca">
                <div>
                    <div style="font-weight:900; font-size:1.4rem;">ICOCA Nexus</div>
                    <small>最新の残高: <span id="disp-icoca">¥0</span></small>
                </div>
                <button class="sync-btn" onclick="nexus.sync('ICOCA')">履歴同期</button>
            </div>
            <div class="nexus-card gmail">
                <div>
                    <div style="font-weight:900; font-size:1.4rem;">Smart Gmail</div>
                    <small>メールから残高を自動抽出</small>
                </div>
                <button class="sync-btn" onclick="nexus.sync('GMAIL')">今すぐ解析</button>
            </div>
        </section>

        <div class="section-title">
            <h3 style="margin:0">最近の記録</h3>
            <small onclick="nexus.showPage('history')" style="color:var(--p); font-weight:900;">すべて見る</small>
        </div>
        <div class="list-container" id="list-home"></div>
    </div>

    <!-- ANALYSIS PAGE -->
    <div id="p-analysis" class="page">
        <div style="padding: 60px 24px 20px;">
            <h2 style="font-weight:900; font-size:2.5rem; margin:0;">分析レポート</h2>
        </div>
        <div class="input-hub" style="margin-top:0;">
            <canvas id="chart-pie"></canvas>
        </div>
        <div class="input-hub">
            <canvas id="chart-line"></canvas>
        </div>
    </div>

    <!-- HISTORY PAGE -->
    <div id="p-history" class="page">
        <div style="padding: 60px 24px 20px;">
            <h2 style="font-weight:900; font-size:2.5rem; margin:0;">取引履歴</h2>
            <input type="text" id="search-box" oninput="nexus.filterHistory()" placeholder="検索..." style="width:100%; padding:20px; border-radius:20px; border:none; background:var(--card); color:var(--text); margin-top:20px; font-weight:700;">
        </div>
        <div class="list-container" id="list-full"></div>
    </div>

    <!-- NAVIGATION DOCK -->
    <nav class="nav-dock">
        <div class="nav-link active" onclick="nexus.showPage('home')"><i data-lucide="home"></i></div>
        <div class="nav-link" onclick="nexus.showPage('analysis')"><i data-lucide="pie-chart"></i></div>
        <div class="nav-link" onclick="nexus.showPage('history')"><i data-lucide="history"></i></div>
        <div class="nav-link" onclick="nexus.toggleTheme()"><i data-lucide="sun"></i></div>
    </nav>

    <script>
        /**
         * SimpleMoney Omni-Nexus CORE
         */
        const API_URL = "https://script.google.com/macros/s/AKfycbwkAxZS6UjNCmIV-nAY3_bAjo7LIcwu1v4T5mjQuzhH17ZtcGwPbARshx97YbQAth77/exec";

        const nexus = {
            state: {
                db: JSON.parse(localStorage.getItem('omni_db')) || [],
                budget: 150000,
                icoca: Number(localStorage.getItem('omni_icoca')) || 3500,
                theme: localStorage.getItem('omni_theme') || 'dark'
            },

            init: async function() {
                lucide.createIcons();
                this.applyTheme();
                this.updateUI();
                await this.refresh();
            },

            // --- 画面表示制御 ---
            updateUI: function() {
                const now = new Date();
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                const daysLeft = daysInMonth - now.getDate() + 1;

                const spent = this.state.db.reduce((acc, cur) => acc + (Number(cur.amount) || 0), 0);
                const remaining = this.state.budget - spent;
                const hp = Math.max(0, (remaining / this.state.budget) * 100);

                // ライフゲージ (SVGアニメーション)
                document.getElementById('disp-hp').innerText = Math.floor(hp);
                document.getElementById('hp-bar').style.strokeDashoffset = 628 - (628 * hp / 100);
                document.getElementById('disp-daily-limit').innerText = `¥${Math.floor(remaining / daysLeft).toLocaleString()}`;
                document.getElementById('disp-icoca').innerText = `¥${this.state.icoca.toLocaleString()}`;

                const msg = document.getElementById('disp-msg');
                if(hp > 70) { msg.innerText = "絶好調！✨"; msg.style.color = "var(--s)"; }
                else if(hp > 30) { msg.innerText = "注意が必要 ⚖️"; msg.style.color = "#fb923c"; }
                else { msg.innerText = "ピンチです！💀"; msg.style.color = "var(--d)"; }

                this.renderList('list-home', this.state.db.slice().reverse().slice(0, 5));
                this.renderList('list-full', this.state.db.slice().reverse());
            },

            renderList: function(id, data) {
                const container = document.getElementById(id);
                const icons = { "食費": "utensils", "固定費": "home", "交通費": "train", "その他": "layers" };
                
                container.innerHTML = data.map(t => `
                    <div class="tx-card">
                        <div class="tx-icon"><i data-lucide="${icons[t.category] || 'box'}"></i></div>
                        <div class="tx-info">
                            <div class="tx-name">${t.item}</div>
                            <div class="tx-meta">${t.source} · ${new Date(t.date).toLocaleDateString()}</div>
                        </div>
                        <div class="tx-val" style="color:var(--d)">-¥${Number(t.amount).toLocaleString()}</div>
                    </div>
                `).join('');
                lucide.createIcons();
            },

            // --- アクション ---
            add: async function(cat, icon) {
                const amount = document.getElementById('in-amount').value;
                if(!amount) return this.notify("金額を入れてください 💰");

                const entry = { type: '支出', item: cat, category: cat, amount: amount, source: '手入力', date: new Date().toISOString() };
                this.state.db.push(entry);
                this.updateUI();
                document.getElementById('in-amount').value = "";
                this.save();
                this.notify("保存しました！ ✨");
                
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(entry), mode: 'no-cors' });
                this.refresh();
            },

            sync: async function(type) {
                this.notify(`${type} と同期中... 🔄`);
                if(type === 'ICOCA') {
                    await new Promise(r => setTimeout(r, 1500));
                    this.state.icoca -= 210;
                    this.add('JR西日本', 'train');
                } else if(type === 'GMAIL') {
                    const res = await fetch(API_URL);
                    const json = await res.json();
                    if(json.gmailBalance) {
                        this.state.icoca = json.gmailBalance;
                        this.notify(`Gmailより残高 ¥${json.gmailBalance} を取得しました！`);
                    }
                }
                this.updateUI();
                this.save();
            },

            voiceStart: function() {
                const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'ja-JP';
                const btn = document.getElementById('voice-btn');
                recognition.onstart = () => btn.classList.add('active');
                recognition.onend = () => btn.classList.remove('active');
                recognition.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const amount = text.match(/\d+/);
                    if(amount) {
                        document.getElementById('in-amount').value = amount[0];
                        this.add(text.replace(/\d+/g, '').trim() || "音声入力", "mic");
                    }
                };
                recognition.start();
            },

            // --- ユーティリティ ---
            showPage: function(id) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('p-' + id).classList.add('active');
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                if(id === 'analysis') this.renderCharts();
                lucide.createIcons();
            },

            toggleTheme: function() {
                this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
                this.applyTheme();
            },

            applyTheme: function() {
                document.body.setAttribute('data-theme', this.state.theme);
                localStorage.setItem('omni_theme', this.state.theme);
            },

            notify: function(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg; t.style.opacity = '1';
                setTimeout(() => t.style.opacity = '0', 3000);
            },

            save: function() {
                localStorage.setItem('omni_db', JSON.stringify(this.state.db));
                localStorage.setItem('omni_icoca', this.state.icoca);
            },

            refresh: async function() {
                try {
                    const res = await fetch(API_URL);
                    const json = await res.json();
                    if(json.data) {
                        this.state.db = json.data;
                        this.save();
                        this.updateUI();
                    }
                } catch(e) {}
            },

            renderCharts: function() {
                const catMap = {};
                this.state.db.forEach(t => catMap[t.category] = (catMap[t.category]||0) + Number(t.amount));
                
                const ctxPie = document.getElementById('chart-pie').getContext('2d');
                if(window.pChart) window.pChart.destroy();
                window.pChart = new Chart(ctxPie, {
                    type: 'doughnut',
                    data: { labels: Object.keys(catMap), datasets: [{ data: Object.values(catMap), backgroundColor: ['#fb923c','#4ade80','#6366f1','#f43f5e'] }] },
                    options: { plugins: { legend: { position: 'bottom', labels: { color: this.state.theme==='dark'?'#fff':'#000', font: {size:16, weight:'bold'} } } } }
                });
            }
        };

        nexus.init();
    </script>
</body>
</html>
