<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyFlow Pro - Complete Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent: #10b981; --accent-dark: #059669; --bg: #f4f7f6;
            --card: #ffffff; --text: #1f2937; --text-muted: #6b7280;
            --danger: #ef4444; --sidebar-w: 260px;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; overflow: hidden; }
        
        /* Layout */
        .sidebar { width: var(--sidebar-w); height: 100vh; background: var(--card); border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; padding: 1.5rem; box-sizing: border-box; }
        .main-content { flex: 1; height: 100vh; overflow-y: auto; padding: 2rem; box-sizing: border-box; position: relative; }
        
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 0.8rem 1rem; border-radius: 12px; cursor: pointer; color: var(--text-muted); transition: 0.3s; margin-bottom: 0.5rem; }
        .nav-item:hover, .nav-item.active { background: #ecfdf5; color: var(--accent); }

        /* Components */
        .card { background: var(--card); padding: 1.5rem; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; font-size: 0.8rem; color: var(--text-muted); border-bottom: 2px solid #f3f4f6; }
        td { padding: 12px; border-bottom: 1px solid #f3f4f6; }

        /* UI Parts */
        .fab { position: fixed; bottom: 2rem; right: 2rem; background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px rgba(16,185,129,0.3); cursor: pointer; z-index: 900; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 100%; max-width: 400px; padding: 2rem; border-radius: 24px; }
        input, select { width: 100%; padding: 0.8rem; margin: 0.5rem 0 1rem; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        
        .page { display: none; animation: slideIn 0.3s ease-out; }
        .page.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .search-bar { width: 100%; max-width: 300px; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><i data-lucide="wallet"></i> MoneyFlow</div>
        <nav>
            <div class="nav-item active" onclick="switchPage('home')"><i data-lucide="home"></i> <span>ホーム</span></div>
            <div class="nav-item" onclick="switchPage('reports')"><i data-lucide="bar-chart-2"></i> <span>分析レポート</span></div>
            <div class="nav-item" onclick="switchPage('history')"><i data-lucide="database"></i> <span>全履歴</span></div>
            <div class="nav-item" onclick="switchPage('settings')"><i data-lucide="settings"></i> <span>設定</span></div>
        </nav>
    </aside>

    <main class="main-content">
        <!-- 1. ホーム -->
        <div id="page-home" class="page active">
            <h2>ダッシュボード</h2>
            <div class="grid">
                <div class="card"><h3>収支合計</h3><div id="home-summary" style="font-size:1.5rem; font-weight:bold;">¥0</div></div>
                <div class="card"><h3>今月の支出</h3><div id="home-expense" style="font-size:1.5rem; font-weight:bold; color:var(--danger)">¥0</div></div>
            </div>
            <div class="card"><h3>最近の動き</h3><table id="table-home"></table></div>
        </div>

        <!-- 2. 分析レポート -->
        <div id="page-reports" class="page">
            <h2>分析レポート</h2>
            <div class="grid">
                <div class="card"><h3>カテゴリ別支出</h3><canvas id="chart-pie"></canvas></div>
                <div class="card"><h3>月別収支推移</h3><canvas id="chart-bar"></canvas></div>
            </div>
        </div>

        <!-- 3. 全履歴 -->
        <div id="page-history" class="page">
            <h2>全履歴</h2>
            <div class="card">
                <input type="text" class="search-bar" id="history-search" placeholder="項目名で検索..." oninput="filterHistory()">
                <div style="max-height: 500px; overflow-y: auto;">
                    <table id="table-history-full">
                        <thead><tr><th>日付</th><th>項目</th><th>カテゴリ</th><th>金額</th></tr></thead>
                        <tbody id="history-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 4. 設定 -->
        <div id="page-settings" class="page">
            <h2>設定</h2>
            <div class="card">
                <h3>プロフィール</h3>
                <label>ユーザー名</label><input type="text" id="set-username" placeholder="名前を入力">
                <label>月間予算設定 (円)</label><input type="number" id="set-budget" placeholder="50,000">
                <button class="btn" onclick="saveSettings()">設定を保存</button>
            </div>
            <div class="card">
                <h3>データ管理</h3>
                <button class="btn" style="background:#6b7280" onclick="clearLocalCache()">キャッシュをクリアして再同期</button>
            </div>
        </div>
    </main>

    <!-- 入力モーダル -->
    <div class="fab" onclick="openModal()"><i data-lucide="plus"></i></div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>記録を入力</h3>
            <input type="date" id="in-date">
            <select id="in-type"><option>支出</option><option>収入</option></select>
            <input type="text" id="in-item" placeholder="項目名（例：コーヒー）">
            <input type="number" id="in-amount" placeholder="金額">
            <select id="in-cat"><option>食費</option><option>日用品</option><option>交通費</option><option>交際費</option><option>住居費</option><option>その他</option></select>
            <button class="btn" style="width:100%" onclick="submitData()">保存</button>
            <button class="btn" style="width:100%; background:none; color:var(--text-muted); margin-top:10px;" onclick="closeModal()">キャンセル</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw3suyGmKs3aBX02L_ANrzC4z1CRX37_4Ptw1cWaaH96cKdqAWAYKA7TXdom6syYWs/exec";
        let store = JSON.parse(localStorage.getItem('money_data')) || [];
        let charts = {};

        // 起動時
        window.onload = async () => {
            lucide.createIcons();
            loadSettings();
            renderAll();
            await sync();
        };

        async function sync() {
            try {
                const res = await fetch(GAS_URL);
                const json = await res.json();
                store = json.data;
                localStorage.setItem('money_data', JSON.stringify(store));
                renderAll();
            } catch (e) { console.error("Sync failed"); }
        }

        function renderAll() {
            if (store.length < 2) return;
            const data = store.slice(1);
            renderHome(data);
            renderHistory(data);
            renderCharts(data);
        }

        // ホーム画面の描画
        function renderHome(data) {
            let inc = 0, exp = 0;
            data.forEach(r => {
                if(r[1] === "収入") inc += Number(r[4]); else exp += Number(r[4]);
            });
            document.getElementById('home-summary').innerText = `¥${(inc - exp).toLocaleString()}`;
            document.getElementById('home-expense').innerText = `¥${exp.toLocaleString()}`;
            
            const recent = data.slice().reverse().slice(0, 5);
            document.getElementById('table-home').innerHTML = recent.map(r => `
                <tr><td>${r[2]}</td><td style="text-align:right; color:${r[1]==='支出'?'red':'green'}">¥${Number(r[4]).toLocaleString()}</td></tr>
            `).join('');
        }

        // 全履歴の描画
        function renderHistory(data) {
            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = data.slice().reverse().map(r => `
                <tr><td>${r[0].split('T')[0]}</td><td>${r[2]}</td><td>${r[3]}</td><td style="font-weight:bold">¥${Number(r[4]).toLocaleString()}</td></tr>
            `).join('');
        }

        // 検索フィルタ
        function filterHistory() {
            const query = document.getElementById('history-search').value.toLowerCase();
            const rows = document.querySelectorAll('#history-tbody tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        }

        // 分析レポートのグラフ
        function renderCharts(data) {
            const catMap = {};
            const monthMap = {};

            data.forEach(r => {
                if(r[1] === "支出") catMap[r[3]] = (catMap[r[3]] || 0) + Number(r[4]);
                const m = r[0].substring(0, 7); // YYYY-MM
                monthMap[m] = (monthMap[m] || 0) + (r[1] === "収入" ? Number(r[4]) : -Number(r[4]));
            });

            // Pie Chart
            const ctxPie = document.getElementById('chart-pie').getContext('2d');
            if(charts.pie) charts.pie.destroy();
            charts.pie = new Chart(ctxPie, {
                type: 'doughnut',
                data: { labels: Object.keys(catMap), datasets: [{ data: Object.values(catMap), backgroundColor: ['#10b981','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#6b7280'] }] }
            });

            // Bar Chart
            const ctxBar = document.getElementById('chart-bar').getContext('2d');
            if(charts.bar) charts.bar.destroy();
            charts.bar = new Chart(ctxBar, {
                type: 'bar',
                data: { labels: Object.keys(monthMap), datasets: [{ label: '月別収支', data: Object.values(monthMap), backgroundColor: '#10b981' }] }
            });
        }

        // 設定の保存
        function saveSettings() {
            const user = document.getElementById('set-username').value;
            const budget = document.getElementById('set-budget').value;
            localStorage.setItem('money_settings', JSON.stringify({user, budget}));
            alert("設定を保存しました");
        }

        function loadSettings() {
            const s = JSON.parse(localStorage.getItem('money_settings'));
            if(s) {
                document.getElementById('set-username').value = s.user || '';
                document.getElementById('set-budget').value = s.budget || '';
            }
        }

        // データ送信
        async function submitData() {
            const payload = {
                date: document.getElementById('in-date').value,
                type: document.getElementById('in-type').value,
                item: document.getElementById('in-item').value,
                amount: document.getElementById('in-amount').value,
                category: document.getElementById('in-cat').value,
                account: "メイン"
            };
            if(!payload.item || !payload.amount) return alert("入力不足です");
            closeModal();
            
            // 楽観的更新
            store.push([payload.date, payload.type, payload.item, payload.category, payload.amount, payload.account]);
            renderAll();

            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            sync();
        }

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        function openModal() { document.getElementById('modal').style.display='flex'; document.getElementById('in-date').value=new Date().toISOString().split('T')[0]; }
        function closeModal() { document.getElementById('modal').style.display='none'; }
        function clearLocalCache() { localStorage.removeItem('money_data'); location.reload(); }
    </script>
</body>
</html>
