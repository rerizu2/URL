<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MoneyFlow Nexus</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1; --primary-soft: #e0e7ff; --success: #10b981;
            --danger: #f43f5e; --warning: #f59e0b; --bg: #f8fafc;
            --card: #ffffff; --text: #0f172a; --text-muted: #64748b;
        }
        [data-theme="dark"] {
            --bg: #020617; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; padding-bottom: 100px; }
        
        /* 1. Header & Summary Section */
        .glass-header {
            background: var(--primary); background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white; padding: 40px 24px; border-radius: 0 0 40px 40px; box-shadow: 0 20px 40px -10px rgba(99,102,241,0.4);
        }
        .balance-label { font-size: 0.9rem; opacity: 0.8; font-weight: 600; }
        .balance-value { font-size: 3rem; font-weight: 800; margin: 8px 0; letter-spacing: -1px; }
        .stats-row { display: flex; gap: 20px; margin-top: 20px; }
        .stat-item { background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 20px; flex: 1; backdrop-filter: blur(10px); }

        /* 2. Main Content Area */
        .container { padding: 24px; max-width: 800px; margin: auto; }
        .card { background: var(--card); border-radius: 28px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 24px; }
        
        /* 3. Smart Input & Voice */
        .input-bar { position: relative; display: flex; gap: 12px; align-items: center; }
        .input-bar input {
            flex: 1; border: 2px solid transparent; background: var(--bg); padding: 16px 20px;
            border-radius: 20px; font-size: 1.1rem; font-weight: 600; color: var(--text); outline: none; transition: 0.3s;
        }
        .input-bar input:focus { border-color: var(--primary); background: var(--card); }
        .voice-btn {
            background: var(--primary-soft); color: var(--primary); border: none;
            width: 56px; height: 56px; border-radius: 18px; cursor: pointer; transition: 0.3s;
        }
        .voice-btn.recording { background: var(--danger); color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* 4. Insight Cards */
        .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .progress-circle { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); transition: 1s ease-out; }

        /* 5. Transaction List */
        .tx-item {
            display: flex; align-items: center; gap: 16px; padding: 16px 0;
            border-bottom: 1px solid rgba(0,0,0,0.03); transition: 0.2s;
        }
        .tx-icon {
            width: 48px; height: 48px; border-radius: 16px; display: flex;
            align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .tx-info { flex: 1; }
        .tx-name { font-weight: 700; font-size: 1rem; }
        .tx-meta { font-size: 0.8rem; color: var(--text-muted); }
        .tx-amount { font-weight: 800; font-size: 1.1rem; text-align: right; }

        /* 6. Navigation Tab Bar */
        .tab-bar {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 440px; background: var(--text); color: white;
            padding: 16px; border-radius: 32px; display: flex; justify-content: space-around;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); z-index: 1000;
        }
        .tab-item { cursor: pointer; opacity: 0.5; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-item.active { opacity: 1; color: var(--primary); }
        .tab-item span { font-size: 0.7rem; font-weight: 700; }

        /* 7. Modal */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); z-index: 2000; align-items: flex-end;
        }
        .modal-content {
            background: var(--card); width: 100%; border-radius: 40px 40px 0 0;
            padding: 32px; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="glass-header">
        <div class="balance-label">現在の推定資産</div>
        <div class="balance-value" id="disp-balance">¥0</div>
        <div class="stats-row">
            <div class="stat-item">
                <small>今月の支出</small>
                <div id="disp-expense" style="font-weight:800; font-size:1.2rem;">¥0</div>
            </div>
            <div class="stat-item">
                <small>1日あたりの予算</small>
                <div id="disp-daily" style="font-weight:800; font-size:1.2rem;">¥0</div>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- Dashboard Page -->
        <div id="page-home" class="page active">
            <div class="input-bar card">
                <input type="text" id="smart-input" placeholder="例: 焼肉 5000">
                <button class="voice-btn" id="voice-trigger" onclick="startVoice()"><i data-lucide="mic"></i></button>
                <button onclick="handleSmartInput()" style="background:var(--primary); color:white; border:none; padding:12px 24px; border-radius:16px; font-weight:700; cursor:pointer;">追加</button>
            </div>

            <div class="insight-grid">
                <div class="card">
                    <h4 style="margin:0">予算達成率</h4>
                    <div class="progress-circle"><div id="budget-progress" class="progress-fill" style="width: 0%"></div></div>
                    <small id="budget-status">分析中...</small>
                </div>
                <div class="card">
                    <h4 style="margin:0">月末予測</h4>
                    <div id="forecast-value" style="font-size:1.4rem; font-weight:800; color:var(--primary); margin-top:8px;">¥0</div>
                    <small>現在のペースで推移</small>
                </div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3 style="margin:0">最近の記録</h3>
                    <button onclick="switchTab('history')" style="background:none; border:none; color:var(--primary); font-weight:700;">すべて見る</button>
                </div>
                <div id="tx-list">データを読み込み中...</div>
            </div>
        </div>

        <!-- Analytics Page -->
        <div id="page-analytics" class="page">
            <h2>支出分析</h2>
            <div class="card">
                <canvas id="categoryChart" height="300"></canvas>
            </div>
            <div class="card">
                <canvas id="trendChart" height="200"></canvas>
            </div>
        </div>

        <!-- History Page -->
        <div id="page-history" class="page">
            <h2>全取引履歴</h2>
            <div id="full-tx-list"></div>
        </div>

        <!-- Settings Page -->
        <div id="page-settings" class="page">
            <h2>設定</h2>
            <div class="card">
                <h3>ユーザー設定</h3>
                <label>月間予算目標</label>
                <input type="number" id="cfg-budget" value="150000" onchange="updateConfigs()">
                <label>資産初期値</label>
                <input type="number" id="cfg-init-balance" value="1000000" onchange="updateConfigs()">
                <button onclick="toggleDarkMode()" class="btn-main" style="width:100%; margin-top:20px;">ダークモード切替</button>
            </div>
        </div>
    </div>

    <!-- Navigation Tab Bar -->
    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home')"><i data-lucide="layout-grid"></i><span>ホーム</span></div>
        <div class="tab-item" onclick="switchTab('analytics')"><i data-lucide="pie-chart"></i><span>分析</span></div>
        <div class="tab-item" onclick="switchTab('history')"><i data-lucide="history"></i><span>履歴</span></div>
        <div class="tab-item" onclick="switchTab('settings')"><i data-lucide="sliders"></i><span>設定</span></div>
    </nav>

    <script>
        // --- 設定 ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwn03i7evgC6DZdhDAv14T7aVSAwJSbwoxv_dt2EyY9M_INq3_6IsxHYi9xTjRcJW3z/exec"; // ここに貼り付け
        let transactions = JSON.parse(localStorage.getItem('nexus_tx')) || [];
        let config = JSON.parse(localStorage.getItem('nexus_config')) || { budget: 150000, init: 1000000 };
        let charts = {};

        // --- 初期化 ---
        window.onload = () => {
            lucide.createIcons();
            applyTheme();
            refreshUI();
            syncWithServer();
        };

        // --- 画面更新 ---
        function refreshUI() {
            const now = new Date();
            const thisMonthTx = transactions.filter(t => new Date(t.date).getMonth() === now.getMonth());
            
            // 計算
            const totalExpense = thisMonthTx.reduce((sum, t) => t.type === "支出" ? sum + Number(t.amount) : sum, 0);
            const totalIncome = thisMonthTx.reduce((sum, t) => t.type === "収入" ? sum + Number(t.amount) : sum, 0);
            const currentBalance = config.init + totalIncome - totalExpense;
            
            // ライフゲージ & 予算
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const daysLeft = daysInMonth - now.getDate() + 1;
            const remainingBudget = config.budget - totalExpense;
            const dailyBudget = Math.max(0, remainingBudget / daysLeft);
            const progress = Math.min(100, (totalExpense / config.budget) * 100);

            // 値の適用
            document.getElementById('disp-balance').innerText = `¥${currentBalance.toLocaleString()}`;
            document.getElementById('disp-expense').innerText = `¥${totalExpense.toLocaleString()}`;
            document.getElementById('disp-daily').innerText = `¥${Math.floor(dailyBudget).toLocaleString()}`;
            document.getElementById('budget-progress').style.width = `${progress}%`;
            document.getElementById('budget-status').innerText = `予算 ¥${config.budget.toLocaleString()} に対し ${progress.toFixed(1)}% 消化`;
            document.getElementById('forecast-value').innerText = `¥${(currentBalance - (totalExpense / now.getDate() * daysLeft)).toLocaleString()}`;

            renderTxList('tx-list', transactions.slice().reverse().slice(0, 5));
            renderTxList('full-tx-list', transactions.slice().reverse());
            updateCharts(thisMonthTx);
        }

        function renderTxList(containerId, data) {
            const container = document.getElementById(containerId);
            if(data.length === 0) { container.innerHTML = "記録がありません"; return; }
            
            const icons = { "食費": "utensils", "日用品": "shopping-bag", "交通費": "train", "交際費": "users", "収入": "trending-up" };

            container.innerHTML = data.map(t => `
                <div class="tx-item">
                    <div class="tx-icon" style="background:${t.type==='収入'?'#ecfdf5':'#fef2f2'}; color:${t.type==='収入'?'#10b981':'#ef4444'}">
                        <i data-lucide="${icons[t.category] || 'box'}"></i>
                    </div>
                    <div class="tx-info">
                        <div class="tx-name">${t.item}</div>
                        <div class="tx-meta">${new Date(t.date).toLocaleDateString()} · ${t.category}</div>
                    </div>
                    <div class="tx-amount" style="color:${t.type==='収入'?'var(--success)':'var(--text)'}">
                        ${t.type==='収入'?'+':''}¥${Number(t.amount).toLocaleString()}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- スマート入力解析 ---
        async function handleSmartInput() {
            const input = document.getElementById('smart-input').value;
            if(!input) return;

            const amountMatch = input.match(/\d+/);
            const amount = amountMatch ? amountMatch[0] : 0;
            const item = input.replace(/\d+/g, '').trim() || "不明な項目";

            // カテゴリ自動推論
            let category = "その他";
            const k = item.toLowerCase();
            if(k.match(/ランチ|カフェ|コンビニ|焼肉|飯/)) category = "食費";
            if(k.match(/電車|タクシー|バス/)) category = "交通費";
            if(k.match(/給料|売上|入金/)) category = "収入";

            const payload = {
                type: category === "収入" ? "収入" : "支出",
                item: item,
                amount: amount,
                category: category,
                date: new Date().toISOString()
            };

            // 楽観的更新
            transactions.push(payload);
            localStorage.setItem('nexus_tx', JSON.stringify(transactions));
            document.getElementById('smart-input').value = "";
            refreshUI();

            // サーバー同期
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            syncWithServer();
        }

        // --- 音声認識 (Speech API) ---
        function startVoice() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'ja-JP';
            const btn = document.getElementById('voice-trigger');
            
            recognition.onstart = () => btn.classList.add('recording');
            recognition.onend = () => btn.classList.remove('recording');
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('smart-input').value = text;
                handleSmartInput();
            };
            recognition.start();
        }

        // --- チャット・グラフ ---
        function updateCharts(data) {
            const catMap = {};
            data.forEach(t => { if(t.type === "支出") catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount); });

            const ctxPie = document.getElementById('categoryChart').getContext('2d');
            if(charts.pie) charts.pie.destroy();
            charts.pie = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{ data: Object.values(catMap), backgroundColor: ['#6366f1','#10b981','#f59e0b','#f43f5e','#8b5cf6'] }]
                },
                options: { cutout: '70%', plugins: { legend: { position: 'bottom' } } }
            });
        }

        // --- その他ユーティリティ ---
        async function syncWithServer() {
            try {
                const res = await fetch(GAS_URL);
                const json = await res.json();
                transactions = json.data;
                localStorage.setItem('nexus_tx', JSON.stringify(transactions));
                refreshUI();
            } catch(e) { console.error("Sync Error", e); }
        }

        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        function updateConfigs() {
            config.budget = Number(document.getElementById('cfg-budget').value);
            config.init = Number(document.getElementById('cfg-init-balance').value);
            localStorage.setItem('nexus_config', JSON.stringify(config));
            refreshUI();
        }

        function toggleDarkMode() {
            const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('nexus_theme', theme);
        }
        function applyTheme() {
            const theme = localStorage.getItem('nexus_theme') || 'light';
            document.body.setAttribute('data-theme', theme);
        }
    </script>
</body>
</html>
