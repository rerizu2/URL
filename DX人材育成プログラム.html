<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who/When Calendar</title>
  <style>
    :root { --primary: #1a73e8; --border: #dadce0; --bg: #f8f9fa; --sun: #d93025; --sat: #1967d2; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
    .container { width: 100%; max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { margin: 0; font-size: 1.4rem; color: #3c4043; }
    .nav-btn { padding: 8px 16px; border: 1px solid var(--border); background: white; cursor: pointer; border-radius: 6px; font-weight: 500; }
    .nav-btn:hover { background: #f1f3f4; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { background: #f8f9fa; border: 1px solid var(--border); padding: 10px; font-size: 13px; color: #70757a; }
    td { border: 1px solid var(--border); height: 120px; vertical-align: top; padding: 4px; }
    
    .date-num { font-weight: bold; font-size: 14px; margin: 4px; display: inline-block; width: 24px; height: 24px; text-align: center; line-height: 24px; }
    .is-today .date-num { background: var(--primary); color: white; border-radius: 50%; }

    /* 予定カードのスタイル */
    .event-card {
      background: #e8f0fe;
      color: #1967d2;
      font-size: 11px;
      padding: 4px;
      margin: 2px 0;
      border-radius: 4px;
      border-left: 3px solid var(--primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .event-who { font-weight: bold; color: #185abc; display: block; margin-bottom: 2px; font-size: 10px; text-transform: uppercase; }
    .event-time { color: #5f6368; display: block; margin-bottom: 2px; }
    .event-title { font-weight: 500; color: #202124; }

    /* 入力フォームのスタイル */
    .form-box { margin-top: 30px; padding: 20px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .form-box h3 { margin-top: 0; font-size: 1.1rem; }
    .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 15px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 12px; color: #5f6368; margin-bottom: 5px; font-weight: 500; }
    input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
    
    .submit-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; transition: background 0.2s; }
    .submit-btn:hover { background: #1765cc; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    #status { font-size: 13px; text-align: center; color: #1a73e8; margin-top: 10px; height: 1.2em; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <button class="nav-btn" onclick="moveMonth(-1)">◀ 前月</button>
    <h2 id="monthTitle">カレンダー読み込み中...</h2>
    <button class="nav-btn" onclick="moveMonth(1)">次月 ▶</button>
  </header>
  
  <table id="calendar">
    <thead>
      <tr>
        <th style="color:var(--sun)">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th style="color:var(--sat)">土</th>
      </tr>
    </thead>
    <tbody id="calendarBody"></tbody>
  </table>

  <div class="form-box">
    <h3>予定の新規登録</h3>
    <div class="input-grid">
      <div class="field"><label>日付</label><input type="date" id="formDate"></div>
      <div class="field"><label>お名前</label><input type="text" id="formName" placeholder="例：山田太郎"></div>
      <div class="field"><label>開始時間</label><input type="time" id="formStart" value="09:00"></div>
      <div class="field"><label>終了時間</label><input type="time" id="formEnd" value="10:00"></div>
    </div>
    <div class="field" style="margin-bottom: 15px;">
      <label>予定の内容</label>
      <input type="text" id="formTitle" placeholder="例：クライアント商談">
    </div>
    <button class="submit-btn" id="saveBtn" onclick="saveData()">スプレッドシートへ保存</button>
    <div id="status"></div>
  </div>
</div>

<script>
  // ---------------------------------------------------------
  // 設定：ここにGASのURLを貼り付けてください
  // ---------------------------------------------------------
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwZjlsc5zXsmt9sCekEj97XQ1sXQ8RjsszLf1SaaS6Dp0CfzFrfwIGZzqZPr4HehsM0/exec";

  let currentView = new Date();
  let events = [];

  window.onload = () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('formDate').value = today;
    refresh();
  };

  async function refresh() {
    document.getElementById('status').innerText = "最新のデータを取得中...";
    try {
      const res = await fetch(`${GAS_URL}?action=get`);
      events = await res.json();
      render();
      document.getElementById('status').innerText = "同期完了";
    } catch (e) {
      document.getElementById('status').innerText = "同期エラー";
    }
  }

  function render() {
    const year = currentView.getFullYear();
    const month = currentView.getMonth();
    document.getElementById('monthTitle').innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const tbody = document.getElementById('calendarBody');
    tbody.innerHTML = "";

    const todayStr = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD

    let dateNum = 1;
    for (let i = 0; i < 6; i++) {
      let tr = document.createElement('tr');
      let hasCells = false;

      for (let j = 0; j < 7; j++) {
        let td = document.createElement('td');
        if ((i === 0 && j < firstDay) || dateNum > lastDate) {
          // 空セル
        } else {
          hasCells = true;
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
          if (dateStr === todayStr) td.className = "is-today";

          td.innerHTML = `<span class="date-num">${dateNum}</span>`;
          
          // その日の予定を表示（開始時間順にソート）
          const dayEvents = events.filter(e => e.date === dateStr)
                                  .sort((a, b) => a.start.localeCompare(b.start));

          dayEvents.forEach(e => {
            const evDiv = document.createElement('div');
            evDiv.className = 'event-card';
            evDiv.innerHTML = `
              <span class="event-who">👤 ${e.name}</span>
              <span class="event-time">🕒 ${e.start} - ${e.end}</span>
              <span class="event-title">${e.title}</span>
            `;
            td.appendChild(evDiv);
          });
          dateNum++;
        }
        tr.appendChild(td);
      }
      if (hasCells) tbody.appendChild(tr);
    }
  }

  async function saveData() {
    const date = document.getElementById('formDate').value;
    const name = document.getElementById('formName').value;
    const start = document.getElementById('formStart').value;
    const end = document.getElementById('formEnd').value;
    const title = document.getElementById('formTitle').value;

    if(!date || !name || !title) return alert("日付、名前、内容は必須項目です");

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    document.getElementById('status').innerText = "データを書き込み中...";

    // パラメータ送信
    const query = `action=add&date=${date}&name=${encodeURIComponent(name)}&start=${start}&end=${end}&title=${encodeURIComponent(title)}`;
    
    // GAS側でCORSエラーを回避するため no-cors
    await fetch(`${GAS_URL}?${query}`, { mode: 'no-cors' });

    setTimeout(() => {
      document.getElementById('formTitle').value = "";
      btn.disabled = false;
      refresh();
    }, 1500);
  }

  function moveMonth(diff) {
    currentView.setMonth(currentView.getMonth() + diff);
    render();
  }
</script>

</body>
</html>
