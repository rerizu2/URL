<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルーム共有・チームカレンダー</title>
  <style>
    :root { --primary: #1a73e8; --border: #dadce0; --bg: #f8f9fa; --sun: #d93025; --sat: #1967d2; --danger: #d93025; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
    .container { width: 100%; max-width: 1000px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    /* ルーム選択画面 */
    #room-selection { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: white; z-index: 200; display: flex; align-items: center; justify-content: center; 
    }
    .room-box { width: 90%; max-width: 400px; padding: 30px; border: 1px solid var(--border); border-radius: 12px; text-align: center; }
    .room-box h2 { margin-top: 0; }
    .room-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .primary-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; }
    .secondary-btn { background: #5f6368; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .nav-btn { padding: 8px 15px; border: 1px solid var(--border); background: white; cursor: pointer; border-radius: 6px; font-weight: bold; }
    .room-info { font-size: 12px; color: #5f6368; text-align: right; margin-bottom: 5px; }
    
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { border: 1px solid var(--border); padding: 10px; font-size: 12px; background: #f8f9fa; color: #70757a; }
    td { border: 1px solid var(--border); height: 110px; vertical-align: top; padding: 4px; cursor: pointer; overflow: hidden; }
    td:hover { background: #f8f9fa; }
    .date-num { font-weight: bold; font-size: 14px; margin: 2px; display: inline-block; width: 22px; text-align: center; }
    .is-today { background: #fef7e0; }
    .is-today .date-num { color: var(--primary); font-size: 16px; border-bottom: 2px solid var(--primary); }

    .event-tag {
      background: #e8f0fe; color: #1967d2; font-size: 10px; padding: 2px 4px; 
      margin: 1px 0; border-radius: 3px; border-left: 3px solid var(--primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 450px; border-radius: 10px; position: relative; }
    .modal-header { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { font-size: 28px; cursor: pointer; color: #aaa; }
    .detail-item { padding: 15px; border-bottom: 1px solid #f1f3f4; position: relative; }
    .detail-who { font-weight: bold; color: var(--primary); font-size: 12px; display: block; }
    .detail-time { color: #5f6368; font-size: 12px; }
    .detail-title { display: block; margin-top: 5px; font-size: 16px; font-weight: bold; }
    .del-btn { position: absolute; right: 0; top: 15px; background: #fff; border: 1px solid #fcc; color: var(--danger); padding: 5px 10px; border-radius: 4px; cursor: pointer; }

    .form-box { margin-top: 20px; padding: 20px; border-top: 2px solid #f1f3f4; }
    .grid-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 11px; font-weight: bold; color: #5f6368; margin-bottom: 4px; }
    input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .save-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
    #status { font-size: 12px; text-align: center; margin-top: 10px; color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

<!-- ルーム選択画面 -->
<div id="room-selection">
  <div class="room-box">
    <h2>チームカレンダー</h2>
    <p style="font-size: 13px; color: #666;">名前とルームIDを入力してください</p>
    <input type="text" id="roomUserName" placeholder="あなたの名前">
    <input type="text" id="roomInputId" placeholder="ルームID (例: team-abc)">
    <div class="btn-group">
      <button class="primary-btn" onclick="enterRoom()">参加 / 作成</button>
    </div>
    <p style="font-size: 11px; color: #999; margin-top: 20px;">※新しいIDを入力すると新規作成されます</p>
  </div>
</div>

<div class="container">
  <div class="room-info">
    ルームID: <span id="displayRoomId">---</span> | 
    名前: <span id="displayUserName">---</span>
    <button onclick="leaveRoom()" style="margin-left:10px; font-size:10px;">退室</button>
  </div>
  <header>
    <button class="nav-btn" onclick="moveMonth(-1)">◀ 前月</button>
    <h2 id="monthTitle" style="margin:0;">読み込み中...</h2>
    <button class="nav-btn" onclick="moveMonth(1)">次月 ▶</button>
  </header>
  
  <table id="calendar">
    <thead>
      <tr><th style="color:var(--sun)">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th style="color:var(--sat)">土</th></tr>
    </thead>
    <tbody id="calendarBody"></tbody>
  </table>

  <div class="form-box">
    <div class="grid-row">
      <div class="field"><label>日付</label><input type="date" id="fDate"></div>
      <div class="field"><label>開始</label><input type="time" id="fStart" value="09:00"></div>
      <div class="field"><label>終了</label><input type="time" id="fEnd" value="10:00"></div>
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label>予定の内容</label><input type="text" id="fTitle" placeholder="予定を入力してください">
    </div>
    <button class="save-btn" id="saveBtn" onclick="saveData()">保存して同期</button>
    <div id="status"></div>
  </div>
</div>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalDate" style="margin:0;"></h3>
      <span class="close-btn" onclick="closeModal()">&times;</span>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  // ★重要：ここにGASのウェブアプリURLを貼り付けてください★
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz5eZcy3wG9j0R1kdDq8kiHJ3gYswrCtwrZ7Ub-VzJRq60AU1tI2PFQdHB5Aoz7odQP/exec";

  let currentView = new Date();
  let events = [];
  let currentRoomId = "";
  let currentUserName = "";

  window.onload = () => {
    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
    
    // 保存された情報の確認
    const savedRoomId = localStorage.getItem('room_id');
    const savedName = localStorage.getItem('user_name');

    if (savedRoomId && savedName) {
      setupApp(savedRoomId, savedName);
    }
  };

  function enterRoom() {
    const name = document.getElementById('roomUserName').value.trim();
    const roomId = document.getElementById('roomInputId').value.trim();
    if (!name || !roomId) return alert("名前とルームIDを入力してください");
    
    localStorage.setItem('room_id', roomId);
    localStorage.setItem('user_name', name);
    setupApp(roomId, name);
  }

  function setupApp(roomId, name) {
    currentRoomId = roomId;
    currentUserName = name;
    document.getElementById('displayRoomId').innerText = roomId;
    document.getElementById('displayUserName').innerText = name;
    document.getElementById('room-selection').style.display = "none";
    refresh();
  }

  function leaveRoom() {
    if(!confirm("ルームを退室しますか？")) return;
    localStorage.removeItem('room_id');
    localStorage.removeItem('user_name');
    location.reload();
  }

  async function refresh() {
    const statusEl = document.getElementById('status');
    statusEl.innerText = "データを同期中...";
    try {
      const res = await fetch(`${GAS_URL}?action=get&roomId=${encodeURIComponent(currentRoomId)}`);
      events = await res.json();
      render();
      statusEl.innerText = "最新の状態です";
    } catch (e) {
      statusEl.innerText = "エラー: 取得できません。URLを確認してください。";
    }
  }

  function render() {
    const year = currentView.getFullYear();
    const month = currentView.getMonth();
    document.getElementById('monthTitle').innerText = `${year}年 ${month + 1}月`;
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const tbody = document.getElementById('calendarBody');
    tbody.innerHTML = "";
    const todayStr = new Date().toISOString().split('T')[0];

    let dateNum = 1;
    for (let i = 0; i < 6; i++) {
      let tr = document.createElement('tr');
      let created = false;
      for (let j = 0; j < 7; j++) {
        let td = document.createElement('td');
        if (!((i === 0 && j < firstDay) || dateNum > lastDate)) {
          created = true;
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
          if(dateStr === todayStr) td.classList.add("is-today");
          td.innerHTML = `<div class="date-num">${dateNum}</div>`;
          td.onclick = () => showDetails(dateStr);
          
          events.filter(e => e.date === dateStr).sort((a,b) => a.start.localeCompare(b.start)).forEach(e => {
            td.innerHTML += `<div class="event-tag">${e.start} ${e.title}</div>`;
          });
          dateNum++;
        }
        tr.appendChild(td);
      }
      if(created) tbody.appendChild(tr);
    }
  }

  function showDetails(dateStr) {
    const dayEvents = events.filter(e => e.date === dateStr).sort((a,b) => a.start.localeCompare(b.start));
    const modalBody = document.getElementById('modalBody');
    document.getElementById('modalDate').innerText = dateStr;
    
    modalBody.innerHTML = dayEvents.length === 0 ? "<p>予定はありません</p>" : 
      dayEvents.map(e => {
        const canDelete = (e.name === currentUserName);
        return `
          <div class="detail-item">
            <span class="detail-who">👤 ${e.name}</span>
            <span class="detail-time">🕒 ${e.start} - ${e.end}</span>
            <strong class="detail-title">${e.title}</strong>
            ${canDelete ? `<button class="del-btn" onclick='deleteEvent(${JSON.stringify(e)})'>🗑️ 削除</button>` : ""}
          </div>`;
      }).join("");
    document.getElementById('detailModal').style.display = "block";
  }

  async function saveData() {
    const date = document.getElementById('fDate').value;
    const title = document.getElementById('fTitle').value;
    const start = document.getElementById('fStart').value;
    const end = document.getElementById('fEnd').value;

    if(!date || !title) return alert("内容を入力してください。");

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    const q = `action=add&roomId=${encodeURIComponent(currentRoomId)}&date=${date}&name=${encodeURIComponent(currentUserName)}&start=${start}&end=${end}&title=${encodeURIComponent(title)}`;
    
    await fetch(`${GAS_URL}?${q}`, { mode: 'no-cors' });

    setTimeout(() => {
      document.getElementById('fTitle').value = "";
      btn.disabled = false;
      refresh();
    }, 1500);
  }

  async function deleteEvent(e) {
    if(!confirm("削除しますか？")) return;
    closeModal();
    const q = `action=delete&roomId=${encodeURIComponent(currentRoomId)}&date=${e.date}&name=${encodeURIComponent(e.name)}&start=${e.start}&end=${e.end}&title=${encodeURIComponent(e.title)}`;
    await fetch(`${GAS_URL}?${q}`, { mode: 'no-cors' });
    setTimeout(refresh, 1500);
  }

  function closeModal() { document.getElementById('detailModal').style.display = "none"; }
  function moveMonth(n) { currentView.setMonth(currentView.getMonth() + n); render(); }
  window.onclick = (e) => { if (e.target == document.getElementById('detailModal')) closeModal(); }
</script>
</body>
</html>
